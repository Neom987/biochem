萄糖。"],[0,"（2）意义：⟦1|G6P⟧ 是糖代谢⟦1|交叉点⟧，也是⟦1|多种糖⟧的共同中间物。"],[1,"①经 ⟦1|PPP⟧ ⟦2|供给⟧ ⟦1|R5P⟧，为⟦1|核酸⟧合成提供⟦2|原料⟧。"],[1,"②经 ⟦1|PPP⟧ 生成 ⟦1|NADPH⟧，提供还原力。"],[1,"③经 ⟦1|EMP⟧、⟦1|TCA⟧ 和⟦1|呼吸链⟧彻底氧化供能。"],[1,"④⟦2|糖异生⟧时转为葡萄糖入血，维持⟦1|血糖⟧。"],[1,"⑤转为 ⟦1|G1P⟧ 并合成⟦2|糖原⟧⟦1|储能⟧。"],[1,"⑥还可作为其他糖、⟦2|脂质⟧和⟦1|氨基酸⟧的⟦2|前体⟧。"]]],[0,7,1,8,"为什么说肝脏是维持血糖浓度的重要器官？",[[0,"肝是血糖调节的主要靶器官，受⟦1|激素⟧⟦2|调控⟧，通过⟦2|糖原⟧合成、分解及⟦2|糖异生⟧平衡血糖来源和⟦1|去路⟧。"],[1,"①⟦1|GLUT2⟧ 使⟦1|肝细胞葡萄糖⟧与血糖接近平衡；摄入的⟦1|葡萄糖⟧可经⟦1|糖酵解⟧、⟦1|TCA⟧ 彻底氧化供能。"],[1,"②肝⟦1|葡萄糖激酶⟧ Km 高且不受 ⟦1|G6P⟧ 抑制，饱食⟦1|高血糖⟧时仍可生成 ⟦1|G6P⟧ 并合成肝⟦2|糖原⟧。"],[1,"③肝有⟦1|葡萄糖⟧-⟦1|6⟧-⟦1|磷酸酶⟧，⟦2|肌肉⟧没有；⟦1|空腹⟧时，肝可将⟦1|糖原分解⟧所得 ⟦1|G6P⟧ 转为⟦1|葡萄糖⟧入血。"],[1,"④肝有完整⟦1|糖异生酶⟧系，⟦1|禁食⟧时由生糖氨基酸、⟦1|乳酸⟧和⟦2|甘油⟧合成⟦1|葡萄糖⟧。"],[1,"⑤可把⟦1|果糖⟧、⟦1|半乳糖⟧等转为⟦1|葡萄糖⟧，补充血糖。"]]],[0,7,1,9,"ATP 是磷酸果糖激酶-1 的底物，但高浓度的 ATP 却抑制该酶的活性，为什么？",[[0,"①⟦1|PFK-1⟧ 有两个 ATP ⟦1|位点⟧：⟦1|高亲⟧和活性⟦1|位点⟧以 ATP 为底物，⟦1|低亲⟧和⟦1|别构位点⟧在高 ATP 时被占据，降低酶对 ⟦1|F6P⟧的⟦2|亲和力⟧。"],[0,"②高 ATP 表示能量充足，反馈抑制 ⟦1|PFK-1⟧ 可避免⟦1|过度⟧产能；⟦1|柠檬酸⟧还能增强这种抑制，使 ⟦1|EMP⟧ 减慢。"]]],[0,7,1,10,"糖酵解中的关键酶有哪些?",[[0,"⟦1|EMP⟧ 关键酶⟦1|为己糖激酶⟧、⟦1|PFK-1⟧ 和⟦1|丙酮酸激酶⟧。"],[1,"①⟦1|己糖激酶⟧：催化⟦1|葡萄糖⟧+⟦1|ATP⟧→⟦1|G6P+ADP⟧，需 ⟦1|Mg²⁺⟧ ，反应不可逆，并受 ⟦1|G6P⟧ 反馈抑制。"],[1,"②⟦1|PFK-1⟧：催化 ⟦1|F6P+ATP⟧→⟦1|F-1⟧,⟦1|6⟧-⟦1|BP+ADP⟧，需 ⟦1|Mg²⁺⟧ ，是不可逆限速⟦2|步骤⟧；⟦1|AMP⟧、⟦1|ADP⟧、⟦1|F-2⟧,⟦1|6⟧-BP 和 ⟦1|F6P⟧ 激活，⟦1|ATP⟧、⟦1|柠檬酸⟧抑制。"],[1,"③⟦1|丙酮酸激酶⟧：催化 ⟦1|PEP+ADP⟧→⟦1|丙酮酸⟧+⟦1|ATP⟧，是不可逆底物水平磷酸化；⟦1|F-1⟧,⟦1|6⟧-BP 激活，⟦1|Ala⟧、⟦1|乙酰⟧-⟦1|CoA⟧ 和⟦1|长链脂肪酸⟧抑制，⟦1|肝酶⟧⟦2|磷酸化⟧后⟦2|活性⟧降低。"]]],[0,7,1,11,"阐述三羧酸循环的过程及其特点（简述柠檬酸循环的过程及催化反应所需的酶）。",[[0,"（1）⟦1|TCA⟧ 循环含 ⟦1|8⟧ 步。"],[1,"①⟦1|OAA+乙酰⟧-⟦1|CoA⟧→⟦1|柠檬酸⟧（⟦1|柠檬酸合酶⟧）。"],[1,"②⟦1|柠檬酸⟧→异⟦1|柠檬酸⟧（顺⟦1|乌头酸酶⟧）。"],[1,"③异⟦1|柠檬酸⟧→⟦1|α-KG+CO₂+NADH⟧（异⟦1|柠檬酸脱氢酶⟧）。"],[1,"④⟦1|α-KG⟧→⟦1|琥珀酰⟧-⟦1|CoA+CO₂+NADH⟧（⟦1|α-KG⟧ ⟦1|脱氢酶⟧系）。"],[1,"⑤⟦1|琥珀酰⟧-⟦1|CoA⟧→⟦1|琥珀酸⟧+⟦1|GTP⟧（⟦1|琥珀酰⟧-⟦1|CoA⟧ 合成酶）。"],[1,"⑥⟦1|琥珀酸⟧→⟦1|延胡索酸⟧+⟦1|FADH₂⟧（⟦1|琥珀酸脱氢酶⟧）。"],[1,"⑦⟦1|延胡索酸⟧→⟦1|苹果酸⟧（⟦1|延胡索酸⟧酶）。"],[1,"⑧⟦1|苹果酸⟧→⟦1|OAA+NADH⟧（⟦1|苹果酸脱氢酶⟧）。"],[0,"（2）特点。"],[1,"①每轮进入 ⟦1|2⟧ 个 C 并放出 ⟦1|2⟧ 个 C，但放出的并非当轮⟦1|乙酰基⟧的 C，而来自 ⟦1|OAA⟧。"],[1,"②每个⟦1|乙酰⟧-⟦1|CoA⟧ 经 ⟦1|4⟧ 次脱氢生成 ⟦1|3⟧ ⟦1|NADH⟧、⟦1|1⟧ ⟦1|FADH₂⟧，并经 ⟦1|2⟧ 次⟦2|脱羧⟧生成 ⟦1|2⟧ ⟦1|CO₂⟧。"],[1,"③有 ⟦1|1⟧ 次底物水平磷酸化，生成 ⟦1|GTP⟧ 或 ⟦1|ATP⟧。"],[1,"④消耗 ⟦1|2⟧ 个 ⟦1|H₂O⟧，分别用于⟦1|柠檬酸合酶⟧和⟦1|延胡索酸⟧酶反应。"],[1,"⑤⟦1|O₂⟧不直接参加，但 ⟦1|NADH⟧、⟦1|FADH₂⟧须经有氧呼吸链再氧化，故循环依赖 ⟦1|O₂⟧。"],[1,"⑥关键酶为⟦1|柠檬酸合酶⟧、异⟦1|柠檬酸脱氢酶⟧和⟦1|α-KG⟧ ⟦1|脱氢酶⟧⟦2|复合体⟧。"]]],[0,7,1,12,"试述三羧酸循环的生理意义（TCA 循环的要点与生物学意义）（双重作用）（生理功能）？",[[0,"TCA 循环的意义："],[1,"①是高效供能⟦2|途径⟧：⟦1|1⟧ 分子⟦1|葡萄糖⟧经 ⟦1|EMP⟧、TCA 循环和⟦1|呼吸链⟧可生成 ⟦1|30⟧ 或 ⟦1|32⟧ 分子 ⟦1|ATP⟧，能量⟦1|利用率⟧约 ⟦1|40⟧%。"],[1,"②是糖、⟦2|脂质⟧和蛋白质氧化的共同⟦2|途径⟧：它们分解产生⟦1|乙酰⟧-⟦1|CoA⟧ 或循环中间物，经 TCA 及⟦1|呼吸链⟧完成氧化供能。"],[1,"③供合成⟦2|前体⟧和能量：⟦1|OAA⟧ 用于⟦2|糖异生⟧，⟦1|柠檬酸⟧转运⟦1|乙酰基⟧供⟦1|脂肪酸⟧合成，⟦1|OAA⟧ 和⟦1|α-KG⟧ 生成 ⟦1|Asp⟧ 和 ⟦1|Glu⟧，其他中间物参与⟦1|核苷酸⟧合成。"],[1,"④部分中间物可作别构效应物：如⟦1|柠檬酸⟧调节 ⟦1|PFK-1⟧、⟦1|果糖⟧-⟦1|1⟧,⟦1|6⟧-二⟦1|磷酸酶⟧和⟦1|乙酰⟧-⟦1|CoA⟧ ⟦1|羧化酶⟧。"]]],[0,7,1,13,"简述乙酰-CoA 的来源与去路。",[[0,"（1）来源。"],[1,"①⟦1|丙酮酸⟧经丙酮酸脱氢酶复合体氧化⟦2|脱羧⟧，生成乙酰-CoA 和 ⟦1|CO₂⟧。"],[1,"②⟦1|脂肪酸β-⟧氧化通常每轮生成 ⟦1|1⟧ 个乙酰-CoA，⟦1|脂酰链⟧缩短 ⟦1|2⟧ 个碳；⟦1|偶数链⟧最后一轮生成 ⟦1|2⟧ 个乙酰-CoA。"],[1,"③肝外组织利用 ⟦1|D-β-⟧羟⟦1|丁酸⟧、乙酰⟦1|乙酸⟧等⟦1|酮体⟧时生成乙酰-CoA。"],[1,"④生酮氨基酸分解生成，如 ⟦1|Phe⟧ 经乙酰乙酰-CoA 生成乙酰-CoA。"],[0,"（2）去路。"],[1,"①与 ⟦1|OAA⟧ 生成⟦1|柠檬酸⟧，经 ⟦1|TCA⟧ 及⟦1|呼吸链⟧彻底氧化，生成 ⟦1|CO₂⟧、⟦1|H₂O⟧ 并合成 ⟦1|ATP⟧。"],[1,"②作为起始⟦2|原料⟧合成⟦1|胆固醇⟧等⟦1|类固醇⟧。"],[1,"③⟦2|饥饿⟧或⟦1|糖尿病⟧时在肝⟦1|线粒体⟧生成乙酰⟦1|乙酸⟧、⟦1|D-β-⟧羟⟦1|丁酸⟧和⟦1|丙酮⟧等⟦1|酮体⟧。"],[1,"④作为⟦1|脂肪酸⟧合成⟦2|前体⟧。"],[1,"⑤合成⟦1|神经递质⟧乙酰胆碱。"],[1,"⑥作为⟦1|乙酰基⟧⟦2|供体⟧参与⟦1|乙酰化⟧。"]]],[0,7,1,14,"简述乙酰-CoA 的作用。",[[0,"乙酰-CoA ⟦1|连接糖⟧、⟦2|脂质⟧和蛋白质代谢；多种分解产物经它汇入 ⟦1|TCA⟧，再经氧化磷酸化供能。"],[1,"①进入 ⟦1|TCA⟧：与 ⟦1|OAA⟧ 生成⟦1|柠檬酸⟧，再产生 ⟦1|NADH⟧、⟦1|FADH₂⟧、⟦1|GTP⟧ 并经⟦1|呼吸链⟧⟦2|大量⟧产 ⟦1|ATP⟧。"],[1,"②作为⟦1|脂肪酸⟧合成⟦2|原料⟧。"],[1,"③⟦2|饥饿⟧或⟦1|糖尿病⟧时生成乙酰⟦1|乙酸⟧、⟦1|D-β-⟧羟⟦1|丁酸⟧等⟦1|酮体⟧，⟦1|供肝⟧外组织利用。"],[1,"④作为⟦1|胆固醇⟧合成⟦2|原料⟧。"],[1,"⑤参与⟦1|氨基酸⟧等代谢并提供碳⟦2|骨架⟧，是三大物质代谢的⟦2|中心化合物⟧。"],[1,"⑥⟦2|供给活性⟧物质，如乙酰胆碱等。"],[1,"⑦作为⟦1|乙酰基⟧⟦2|供体⟧参与某些⟦2|药物⟧的⟦1|乙酰化⟧代谢，影响其⟦2|活性⟧或排泄，但并非普遍的⟦2|药物⟧减毒机制。"],[1,"⑧作为⟦1|乙酰基⟧⟦2|供体⟧参与⟦1|乙酰化⟧。"]]],[0,7,1,15,"简述三羧酸循环的调控（柠檬酸循环本身制约系统的调节）。",[[0,"关键酶为⟦1|柠檬酸合酶⟧、异⟦1|柠檬酸脱氢酶⟧和⟦1|α-KG⟧ ⟦1|脱氢酶⟧⟦2|复合体⟧；异⟦1|柠檬酸脱氢酶⟧最重要，⟦1|α-KG⟧ ⟦1|脱氢酶⟧次之。"],[1,"①底物⟦1|供应⟧：⟦1|乙酰⟧-⟦1|CoA⟧、⟦1|OAA⟧ 及 ⟦1|NAD⁺⟧ 等的⟦1|供应⟧影响循环；⟦1|丙酮酸脱氢酶⟧⟦2|活性⟧影响⟦1|乙酰⟧-⟦1|CoA⟧ 来源。"],[1,"②产物抑制：⟦1|琥珀酰⟧-⟦1|CoA⟧ 抑制⟦1|α-KG⟧ ⟦1|脱氢酶⟧；⟦1|柠檬酸⟧抑制⟦1|柠檬酸合酶⟧；⟦1|ATP⟧ 抑制⟦1|柠檬酸合酶⟧和异⟦1|柠檬酸脱氢酶⟧。"],[1,"③⟦1|变构⟧调节：底物或产物作⟦2|效应⟧物，以前馈或反馈方式调节循环。"],[1,"④能量状态：⟦1|ATP⟧、⟦1|NADH⟧ 较高时抑制循环，⟦1|ADP⟧ 可激活异⟦1|柠檬酸脱氢酶⟧，促进氧化供能。"],[1,"⑤⟦1|Ca²⁺⟧ 结合异⟦1|柠檬酸脱氢酶⟧和⟦1|α-KG⟧ ⟦1|脱氢酶⟧，降低 Km 并激活。"]]],[0,7,1,16,"简述丙酮酸脱氢酶系的组成及其催化作用。",[[0,"（1）丙酮酸脱氢酶系含 ⟦1|E1⟧ 丙酮酸脱氢酶、⟦1|E2⟧ 二氢⟦1|硫辛酰⟧转⟦1|乙酰酶⟧和 ⟦1|E3⟧ 二氢⟦1|硫辛酰⟧脱氢酶；需 ⟦1|TPP⟧、⟦1|硫辛酸⟧、⟦1|CoA⟧、⟦1|FAD⟧ 和 ⟦1|NAD⁺⟧ 。"],[0,"（2）催化过程如下。"],[1,"①⟦1|E1⟧、⟦1|E2⟧ 催化丙酮酸⟦2|脱羧⟧并形成⟦1|乙酰基⟧。"],[2,"⟦1|TPP⟧ 结合丙酮酸，⟦2|脱羧⟧形成⟦1|羟乙⟧基-⟦1|TPP⟧；⟦1|羟乙基被⟧氧化为⟦1|乙酰基⟧，转给 ⟦1|E2⟧ 的⟦1|硫辛酰胺⟧，同时还原其⟦1|二硫键⟧。"],[1,"②⟦1|E2⟧ 把⟦1|乙酰基⟧转给 ⟦1|CoA⟧，形成⟦1|乙酰⟧-⟦1|CoA⟧。"],[2,"⟦1|E2⟧ 将⟦1|乙酰基⟧转给 ⟦1|CoA-SH⟧，生成⟦1|乙酰⟧-⟦1|CoA⟧，留下⟦1|还原型⟧二氢⟦1|硫辛酰胺⟧。"],[1,"③⟦1|E3⟧ 使 ⟦1|E2⟧ 的⟦1|二氢硫辛酰胺⟧再氧化。"],[2,"⟦1|E3⟧ 重新氧化二氢⟦1|硫辛酰胺⟧，使其恢复⟦1|二硫键⟧；⟦1|E3⟧ 含 ⟦1|FAD⟧ 辅基。"],[1,"④⟦1|还原型⟧ ⟦1|E3⟧ 再氧化。"],[2,"⟦1|FAD⟧ 接受 ⟦1|E3⟧ ⟦1|巯基⟧上的氢生成 ⟦1|FADH₂⟧，再把氢交给 ⟦1|NAD⁺⟧ ，使 ⟦1|E3⟧ 和 ⟦1|FAD⟧ 恢复氧化态。"]]],[0,7,1,17,"如果三羧酸循环中的草酰乙酸被用来合成氨基酸，该怎样让循环正常运行下去？",[[0,"⟦1|OAA⟧ 被用于合成后，须补充其碳⟦2|骨架⟧以维持 ⟦1|TCA⟧，可通过以下反应生成 ⟦1|OAA⟧。"],[1,"①⟦1|丙酮酸羧化⟧：动物主要方式。⟦1|丙酮酸羧化酶⟧以⟦1|生物素⟧为辅基，耗 ⟦1|1⟧ ⟦1|ATP⟧ 生成 ⟦1|OAA⟧，在⟦1|线粒体⟧⟦2|基质⟧进行。"],[1,"②⟦1|PEP⟧ ⟦1|羧化⟧：植物和⟦1|细菌⟧由 ⟦1|PEP⟧ ⟦1|羧化酶⟧使 ⟦1|PEP⟧ 生成 ⟦1|OAA⟧。"],[1,"③⟦1|苹果酸⟧脱氢：⟦1|苹果酸脱氢酶⟧生成 ⟦1|OAA⟧；须有循环外⟦1|碳源⟧补入⟦1|苹果酸⟧，才构成净回补。"],[1,"④氨基酸转化：⟦1|Asp⟧ 经⟦1|谷草转氨酶⟧生成 ⟦1|OAA⟧。"]]],[0,7,1,18,"氧气含量的高低为什么可以影响三羧酸循环进程？",[[0,"①⟦1|NADH⟧、⟦1|FADH₂⟧须把⟦2|电子⟧经⟦1|呼吸链⟧交给 ⟦1|O₂⟧，才能再生 ⟦1|NAD⁺⟧ 、⟦1|FAD⟧ 并维持 ⟦1|TCA⟧；⟦1|O₂⟧充足时⟦1|呼吸链⟧顺畅，循环正常，缺氧⟦1|时则⟧减慢。"],[0,"②⟦1|O₂⟧充足时⟦1|丙酮酸⟧生成⟦1|乙酰⟧-⟦1|CoA⟧ 并进入 ⟦1|TCA⟧；缺氧时更多⟦1|丙酮酸⟧被还原成⟦1|乳酸⟧或⟦1|乙醇⟧，⟦1|乙酰⟧-⟦1|CoA⟧ 来源减少，循环减慢。"]]],[0,7,1,19,"比较哺乳动物肌肉细胞内有氧和无氧条件下葡萄糖氧化有什么不同？",[[0,"①过程：有氧时，葡萄糖经 ⟦1|EMP⟧ 生成⟦1|丙酮酸⟧，再转为⟦1|乙酰⟧-⟦1|CoA⟧ 进入 ⟦1|TCA⟧，彻底氧化为 ⟦1|CO₂⟧和 ⟦1|H₂O⟧；无氧时，⟦1|丙酮酸⟧还原成⟦1|乳酸⟧。"],[0,"②产能：有氧时每分子葡萄糖约生成 ⟦1|30～32⟧ ⟦1|ATP⟧；无氧时仅净生成 ⟦1|2⟧ ⟦1|ATP⟧。"],[0,"③意义：有氧氧化供能高效；缺氧时⟦1|乳酸⟧发酵可快速供能并再生 ⟦1|NAD⁺⟧ 。⟦1|乳酸⟧并非⟦1|运动⟧后延迟性肌肉⟦1|酸痛⟧的直接原因。"],[0,"④⟦1|场所⟧：有氧氧化在⟦2|胞质⟧和⟦1|线粒体⟧进行；无氧氧化⟦1|全在胞质⟧进行。"],[0,"⑤⟦1|需氧⟧：有氧氧化包括 ⟦  ⟦1|EMP⟧ 的 ⟦1|3⟧ 步不可逆反应。"],[1,"三个⟦1|旁路⟧如下。"],[2,"①⟦1|丙酮酸⟧经 ⟦1|OAA⟧ 生成 ⟦1|PEP⟧，分两步。"],[3,"a.⟦1|丙酮酸羧化酶⟧以⟦1|生物素⟧为辅基，耗 ⟦1|ATP⟧ 使⟦1|丙酮酸⟧生成 ⟦1|OAA⟧。"],[3,"b.⟦1|PEPCK⟧ 耗 ⟦1|GTP⟧，使 ⟦1|OAA⟧ 生成 ⟦1|PEP⟧。"],[1,"⟦1|OAA+GTP⟧→⟦1|PEP+CO₂+GDP⟧。"],[2,"②⟦1|F-1⟧,⟦1|6⟧-BP 经 ⟦1|FBPase-1⟧ ⟦2|水解⟧为 ⟦1|F6P⟧。"],[2,"③⟦1|G6P⟧ 经⟦1|葡萄糖⟧-⟦1|6⟧-⟦1|磷酸酶⟧⟦2|水解⟧为⟦1|葡萄糖⟧。"]]],[0,7,1,28,"简述糖异生的功能（糖异生的生理意义）。",[[0,"①⟦1|空腹⟧或⟦2|饥饿⟧时以⟦1|乳酸⟧、⟦2|甘油⟧、生糖氨基酸等合成⟦1|葡萄糖⟧，维持⟦1|血糖⟧并⟦1|供脑⟧、⟦1|红细胞⟧利用。"],[0,"②肝把⟦2|肌肉⟧⟦1|乳酸异生⟧为⟦1|葡萄糖⟧，再送回⟦2|肌肉⟧供能，实现⟦1|乳酸⟧⟦2|循环⟧。"],[0,"③清除⟦1|乳酸⟧，可减轻⟦1|代谢性酸中毒⟧。"],[0,"④是草食动物，尤其⟦1|反刍动物⟧的重要⟦1|葡萄糖⟧来源。"],[0,"⑤使生糖氨基酸经 ⟦1|TCA⟧ 和 ⟦1|PEP⟧ 转为⟦1|葡萄糖⟧，联系⟦1|氨基酸⟧与糖代谢。"]]],[0,7,1,29,"请简述乳酸循环的过程及其生理意义是什么？",[[0,"（1）过程：⟦2|肌肉⟧缺氧时将⟦1|丙酮酸⟧还原成乳酸并再生 ⟦1|NAD⁺⟧ ；乳酸入⟦1|肝异⟧生为⟦1|葡萄糖⟧，再经⟦1|血液⟧返回⟦2|肌肉⟧。"],[0,"（2）生理意义。"],[1,"①使缺氧⟦2|肌肉⟧的⟦1|糖酵解⟧持续供 ⟦1|ATP⟧。"],[1,"②把乳酸转为⟦1|葡萄糖⟧，帮助维持⟦1|血糖⟧。"],[1,"③清除乳酸，减轻⟦1|酸中毒⟧。"],[1,"④回收乳酸碳⟦2|骨架⟧，提高物质⟦1|利用率⟧。"]]],[0,7,1,30,"试述丙氨酸异生为葡萄糖的主要反应过程及其酶？",[[0,"丙氨酸先转为⟦1|丙酮酸⟧，再经⟦2|糖异生⟧的 ⟦1|3⟧ 个⟦1|旁路⟧及 ⟦1|EMP⟧ 的可逆反应生成葡萄糖。"],[0,"（1）⟦1|谷丙转氨酶⟧使丙氨酸把⟦1|氨基⟧交给⟦1|α-KG⟧，生成⟦1|谷氨酸⟧和⟦1|丙酮酸⟧。"],[0,"（2）⟦1|丙酮酸⟧转为 ⟦1|PEP⟧。"],[1,"①⟦1|线粒体丙酮酸羧化酶⟧催化⟦1|丙酮酸⟧生成 ⟦1|OAA⟧。"],[1,"②⟦1|线粒体苹果酸脱氢酶⟧使 ⟦1|OAA⟧ 生成⟦1|苹果酸⟧。"],[1,"③⟦1|苹果酸⟧出⟦1|线粒体⟧，在⟦2|胞质⟧再氧化成 ⟦1|OAA⟧。"],[1,"④⟦1|PEPCK⟧ 催化 ⟦1|OAA⟧ 生成 ⟦1|PEP⟧。"],[0,"（3）⟦1|FBPase-1⟧ 催化 ⟦1|F-1⟧,⟦1|6⟧-BP 生成 ⟦1|F6P⟧。"],[0,"（4）葡萄糖-⟦1|6⟧-⟦1|磷酸酶⟧催化 ⟦1|G6P⟧ 生成葡萄糖。"]]],[0,7,1,31,"何为糖酵解？与糖异生的区别。",[[0,"（1）糖酵解是在⟦2|胞质⟧中由 ⟦1|1⟧ 分子⟦1|葡萄糖⟧经 ⟦1|10⟧ 步生成 ⟦1|2⟧ 分子⟦1|丙酮酸⟧，净得 ⟦1|2⟧ ⟦1|ATP⟧ 和 ⟦1|2⟧ ⟦1|NADH⟧；缺氧时可快速供能。"],[0,"（2）与糖异生的区别。"],[1,"①方向：糖酵解由⟦1|葡萄糖⟧生成⟦1|丙酮酸⟧；糖异生由⟦1|丙酮酸⟧等生成⟦1|葡萄糖⟧。"],[1,"②关键酶：⟦1|前者为己糖激酶⟧、⟦1|PFK-1⟧、⟦1|丙酮酸激酶⟧；⟦2|后者⟧为⟦1|丙酮酸羧化酶⟧、⟦1|PEPCK⟧、⟦1|FBPase-1⟧ 和 ⟦1|G6P⟧ 酶。"],[1,"③部位：糖酵解在⟦2|胞质⟧；肝糖异生跨⟦1|线粒体⟧、⟦2|胞质⟧及⟦1|内质网⟧，⟦1|末步⟧在⟦1|内质网⟧完成。"],[1,"④能量：⟦1|1⟧ ⟦1|葡萄糖⟧糖酵解净得 ⟦1|2⟧ ⟦1|ATP⟧；⟦1|2⟧ ⟦1|丙酮酸异生⟧为 ⟦1|1⟧ ⟦1|葡萄糖⟧耗 ⟦1|4⟧ ⟦1|ATP⟧ 和 ⟦1|2⟧ ⟦1|GTP⟧。"],[1,"⑤功能：糖酵解供能；糖异生维持⟦1|血糖⟧。"]]],[0,7,1,32,"写出由丙酮酸转化成葡萄糖反应过程中消耗高能磷酸化合物的反应式（可以不写结构式），计算由 2摩尔丙酮酸转化成 1 摩尔葡萄糖需要提供多少摩尔的高能磷酸化合物？",[[0,"①丙酮酸经 ⟦1|OAA⟧ 生成 ⟦1|PEP⟧，分两步耗能。"],[1,"a.丙酮酸⟦1|羧化酶⟧耗 ⟦1|ATP⟧ 生成 ⟦1|OAA⟧。"],[2,"丙酮酸+⟦1|CO₂+ATP+H₂O⟧→⟦1|OAA+ADP+Pi+2H⁺⟧ 。"],[1,"b.⟦1|PEPCK⟧ 耗 ⟦1|GTP⟧ 使 ⟦1|OAA⟧ 生成 ⟦1|PEP⟧。"],[2,"⟦1|OAA+GTP⟧→⟦1|PEP+CO₂+GDP⟧。"],[0,"②⟦1|磷酸甘油⟧酸⟦1|激酶⟧耗 ⟦1|ATP⟧，使 ⟦1|3⟧-PG 生成 ⟦1|1⟧,⟦1|3⟧-⟦1|BPG⟧。"],[0,"⟦1|3⟧-⟦1|PG+ATP⟧→⟦1|1⟧,⟦1|3⟧-⟦1|BPG+ADP⟧。"],[1,"⟦1|2⟧ ⟦1|mol⟧ 丙酮酸生成 ⟦1|1⟧ ⟦1|mol⟧ 葡萄糖⟦1|共耗⟧ ⟦1|6⟧ ⟦1|mol⟧ 高能磷酸化合物：⟦1|4⟧ ⟦1|mol ATP⟧、⟦1|2⟧ ⟦1|mol GTP⟧。"]]],[0,7,1,33,"糖异生与糖酵解途径是如何协调控制的（糖酵解和糖异生的调控机制）？",[[0,"糖酵解与糖异生通过相反调节各自关键酶，避免同时⟦1|活跃⟧。"],[0,"（1）⟦1|PFK-1⟧ 与 ⟦1|FBPase-1⟧ 的调节。"],[1,"①⟦1|AMP⟧ 激活 ⟦1|PFK-1⟧ 并抑制 ⟦1|FBPase-1⟧，促进糖酵解。"],[1,"②⟦1|ATP⟧、⟦1|柠檬酸⟧抑制 ⟦1|PFK-1⟧，⟦1|柠檬酸⟧还激活 ⟦1|FBPase-1⟧，促进糖异生。"],[1,"③⟦1|F-2⟧,⟦1|6⟧-BP 激活 ⟦1|PFK-1⟧、抑制 ⟦1|FBPase-1⟧；其升高促糖酵解，降低则促糖异生。"],[1,"④肝内胰⟦1|高血糖素⟧/⟦1|胰岛素比值⟧升高，促双功能酶⟦2|磷酸化⟧，激活 ⟦1|FBPase-2⟧、抑制 ⟦1|PFK-2⟧，使 ⟦1|F-2⟧,⟦1|6⟧-BP 降低、糖异生增强。"],[0,"（2）⟦1|丙酮酸激酶⟧、⟦1|丙酮酸羧化酶⟧和 ⟦1|PEPCK⟧ 的调节。"],[1,"①⟦1|ATP⟧、⟦1|Ala⟧ 抑制肝⟦1|丙酮酸激酶⟧；⟦1|ADP⟧ 升高抑制⟦1|丙酮酸羧化酶⟧和 ⟦1|PEPCK⟧，限制耗能的糖异生。"],[1,"②⟦1|乙酰⟧-⟦1|CoA⟧ 激活⟦1|丙酮酸羧化酶⟧，促进糖异生并间接抑制糖酵解。"],[1,"③⟦1|F-1⟧,⟦1|6⟧-BP 前馈激活⟦1|丙酮酸激酶⟧，促进糖酵解。"],[0,"（3）底物⟦1|供应⟧也参与调节：⟦1|葡萄糖⟧影响糖酵解，⟦1|乳酸⟧等⟦2|前体⟧影响糖异生，共同维持⟦1|血糖⟧。"]]],[0,7,1,34,"简述人体如何维持血糖水平的稳定？",[[0,"①胰⟦1|高血糖素⟧、肾上腺素经 ⟦1|cAMP-PKA⟧ 激活⟦2|糖原⟧⟦1|磷酸化酶⟧，促进⟦1|糖原分解⟧；并增强⟦2|糖异生⟧，升高血糖。"],[0,"②⟦1|胰岛素⟧促进⟦1|葡萄糖⟧摄取、⟦2|糖原⟧合成和⟦1|糖酵解⟧，抑制⟦1|糖原分解⟧及⟦2|糖异生⟧，从而降低血糖。"],[0,"③⟦1|肾小管⟧通常⟦1|重吸收⟧滤过的⟦1|葡萄糖⟧；血糖超过⟦1|肾阈⟧时，超出⟦1|重吸收⟧⟦2|能力⟧的⟦1|葡萄糖⟧随尿排出。"]]],[0,7,1,35,"胰岛素如何降低血糖浓度？",[[0,"①促进⟦2|糖原⟧合成、抑制分解：降低 ⟦1|cAMP⟧，使⟦2|糖原⟧⟦1|合酶⟧去⟦2|磷酸化⟧而激活，⟦2|糖原⟧⟦1|磷酸化酶⟧去⟦2|磷酸化⟧而⟦2|失活⟧。"],[0,"②促进 ⟦1|GLUT4⟧ 转位至⟦1|细胞膜⟧，增强⟦2|肌肉⟧、⟦2|脂肪⟧细胞摄取⟦1|葡萄糖⟧。"],[0,"③⟦2|诱导⟧⟦1|葡萄糖激酶⟧、⟦1|PFK⟧ 和⟦1|丙酮酸激酶⟧，促进⟦1|葡萄糖⟧⟦2|磷酸化⟧和⟦1|糖酵解⟧。"],[0,"④拮抗升糖⟦1|激素⟧，并抑制 ⟦1|PEPCK⟧、⟦1|G6P⟧ 酶等⟦2|糖异生⟧关键酶的表达，减少⟦1|肝糖⟧输出。"]]],[0,7,1,36,"简述血糖的来源与去路",[[0,"（1）血糖来源。"],[1,"①⟦1|食物糖消化⟧成⟦1|葡萄糖⟧后吸收，是主要来源。"],[1,"②⟦1|空腹时肝糖原分解⟧释放⟦1|葡萄糖⟧。"],[1,"③肝以⟦1|乳酸⟧、⟦1|丙酮酸⟧、⟦2|甘油⟧和生糖氨基酸等进行⟦2|糖异生⟧。"],[1,"④其他⟦1|单糖⟧或糖⟦2|衍生物⟧转为⟦1|葡萄糖⟧。"],[0,"（2）血糖去路。"],[1,"①经无氧⟦1|酵解⟧或⟦2|有氧⟧氧化供能，是主要去路。"],[1,"②在肝和⟦2|肌肉⟧合成⟦2|糖原储存⟧。"],[1,"③转成⟦2|甘油⟧、⟦1|脂肪酸⟧或⟦1|氨基酸⟧，合成⟦2|脂肪⟧或蛋白质。"],[1,"④转成⟦1|核糖⟧、⟦1|脱氧核糖⟧、⟦1|糖蛋白⟧等。"],[1,"⑤超过⟦1|肾阈⟧时，部分随尿排出。"]]],[0,7,1,37,"试述糖原合成的特征。",[[0,"①需⟦2|活化⟧⟦1|糖基⟧：⟦1|葡萄糖⟧依次生成 ⟦1|G6P⟧、⟦1|G1P⟧ 和 ⟦1|UDP-G⟧；该过程耗 ⟦1|UTP⟧，⟦1|PPi⟧ ⟦2|水解⟧推动反应不可逆。"],[0,"②需⟦2|引物⟧：糖原⟦1|合酶⟧不能从头起始，只能延长已有⟦1|糖链⟧；起始⟦1|糖链⟧通常由⟦1|糖原素⟧形成。"],[0,"③糖原⟦1|合酶⟧将⟦1|葡萄糖⟧加到⟦1|糖链⟧的非还原端，使糖⟦1|链延长⟧。"],[0,"④需⟦1|分支酶⟧：糖原⟦1|合酶⟧形成⟦1|α-1⟧,⟦1|4⟧ 键；⟦1|分支酶⟧从⟦2|长度⟧＞⟦1|11⟧ ⟦1|残基⟧的⟦1|链转移⟧约 ⟦1|7⟧ 个⟦1|糖基⟧，以⟦1|α-1⟧,⟦1|6⟧ 键成⟦1|支链⟧，⟦1|新旧分支⟧至少相隔 ⟦1|4⟧ ⟦1|残基⟧。"],[0,"⑤合成不是降解的逆过程：虽由 ⟦1|G6P⟧ 经 ⟦1|G1P⟧ 开始，但⟦1|糖基⟧⟦2|供体⟧是 ⟦1|UDP-G⟧ 而非 ⟦1|G1P⟧。"]]],[0,7,1,38,"以糖原分解和合成为例，说明可逆磷酸化调节的重要性。",[[0,"（1）糖原分解和合成。"],[1,"①⟦2|糖原⟧⟦1|磷酸化酶⟧控制分解：b 型磷酸化为⟦2|活性⟧较高的 a 型，去磷酸化后⟦2|活性⟧降低。"],[1,"②⟦2|糖原⟧⟦1|合酶⟧控制合成：去磷酸化 a 型⟦2|活性⟧较高，磷酸化 b 型⟦2|活性⟧较低，但仍可受 ⟦1|G6P⟧ 激活。"],[0,"（2）可逆磷酸化的重要性。"],[1,"①快速响应⟦1|激素⟧等⟦2|信号⟧，迅速改变⟦2|糖原⟧代谢。"],[1,"②精确控制两种酶的⟦2|活性⟧，适应生理需要。"],[1,"③协调⟦2|糖原储存⟧与释放，维持能量平衡。"],[1,"④通过级联放大，少量⟦1|激素⟧即可引起⟦2|大量⟧糖原分解。"]]],[0,7,1,39,"为什么糖原降解选用磷酸解，而不是水解（糖原的降解采用磷酸解的生物学意义）？",[[0,"糖原磷酸解的意义如下。"],[1,"①直接生成 ⟦1|G1P⟧，可转为 ⟦1|G6P⟧ 进入分解⟦2|途径⟧，省去⟦1|己糖激酶⟧耗 ⟦1|ATP⟧，能量⟦1|效率高⟧。"],[1,"②⟦1|G1P⟧ 在⟦2|生理⟧条件下带电，不能自由穿膜，适合⟦1|肌细胞⟧利用。"]]],[0,7,1,40,"试比较糖酵解、糖原合成与糖异生的原料、关键酶和产物的异同。",[[0,"比较⟦1|项目⟧             糖酵解                 糖原合成                  糖异生"],[0,"原料        ⟦1|葡萄糖⟧                ⟦1|葡萄糖⟧形成的 ⟦1|UDP-G⟧       ⟦1|乳酸⟧、⟦2|甘油⟧、生糖氨基酸等"],[0,"⟦1|丙酮酸羧化酶⟧、⟦1|PEPCK⟧、"],[0,"关键酶       ⟦1|己糖激酶⟧、⟦1|PFK-1⟧、⟦1|丙酮酸激酶⟧   糖原⟦1|合酶⟧"],[0,"⟦1|FBPase-1⟧、⟦1|G6P⟧ 酶"],[0,"主要产物       ⟦1|丙酮酸⟧；无氧时可生成⟦1|乳酸⟧       糖原                 ⟦1|葡萄糖⟧"],[0,"⟦1|2⟧ 个⟦1|丙酮酸⟧生成 ⟦1|1⟧ 个⟦1|葡萄糖⟧耗 ⟦1|4⟧"],[0,"能量变化       每个⟦1|葡萄糖⟧净得 ⟦1|2⟧ ⟦1|ATP⟧      每加 ⟦1|1⟧ 个⟦1|糖基⟧耗 ⟦1|2⟧ 个⟦1|高能键⟧"],[0,"⟦1|ATP⟧ 和 ⟦1|2⟧ ⟦1|GTP⟧"],[0,"⟦2|饥饿⟧时维持⟦1|血糖⟧，⟦1|供脑⟧和⟦1|红细⟧"],[0,"⟦2|生理⟧意义       分解⟦1|葡萄糖⟧并供能           ⟦2|储存⟧⟦1|葡萄糖⟧并调节⟦1|血糖⟧"],[0,"⟦1|胞等用糖⟧"]]],[0,7,1,41,"简要说明糖原磷酸化酶和糖原合酶的共价调节。",[[0,"（1）两种酶的特点。"],[1,"糖原磷酸化酶的⟦2|磷酸化⟧ a 型⟦2|活性⟧高、去⟦2|磷酸化⟧ b 型⟦2|活性⟧低；糖原合酶相反，a 型去⟦2|磷酸化⟧时有⟦2|活性⟧。"],[0,"（2）糖原磷酸化酶的⟦2|调控⟧。"],[1,"磷酸化酶⟦1|激酶⟧使 b 型 ⟦1|Ser⟧ ⟦2|磷酸化⟧为 a 型；⟦1|PP1⟧ 使其去⟦2|磷酸化⟧。胰⟦1|高血糖素⟧或肾上腺素经 ⟦1|cAMP-PKA⟧ ⟦1|级联⟧促进⟦2|磷酸化⟧和⟦1|糖原分解⟧。"],[0,"（3）糖原合酶的⟦2|调控⟧。"],[1,"⟦1|GSK3⟧ ⟦2|磷酸化⟧多个 ⟦1|Ser⟧ 并抑制糖原合酶；⟦1|PP1⟧ 去⟦2|磷酸化⟧使其激活，⟦1|G6P⟧ 结合 b 型后可促进 ⟦1|PP1⟧ 作用。"]]],[0,8,0,1,"脂肪动员（lipid mobilization）",[[0,"指⟦2|储存⟧在⟦1|脂肪组织⟧中的三酰甘油在三酰甘油⟦1|脂肪酶⟧作用下逐步⟦2|水解⟧为⟦2|游离⟧⟦1|脂肪酸⟧和⟦2|甘油⟧并释放进入⟦1|血液⟧中，供⟦1|全身⟧各组织氧化利用的过程；脂肪动员的关键酶为三酰甘油⟦1|脂肪酶⟧，⟦2|脂肪水解⟧还需其他⟦1|脂酶⟧、⟦1|磷脂酶⟧的作用。"]]],[0,8,0,2,"肉碱（carnitine）",[[0,"由⟦1|赖氨酸⟧衍生的小分子，是长⟦1|链脂酰基⟧入⟦1|线粒体⟧的⟦1|载体⟧。脂⟦1|酰基⟧先由 ⟦1|CoA⟧ 转给肉碱，形成⟦1|脂酰⟧肉碱；进入⟦2|基质⟧后再转回 ⟦1|CoA⟧，生成⟦1|脂酰⟧ ⟦1|CoA⟧ 并进行⟦1|β-⟧氧化。"]]],[0,8,0,3,"肉碱穿梭系统（carnitine shuttle system）",[[0,"将长⟦1|链脂酰基⟧运入⟦1|线粒体⟧⟦2|基质⟧的机制。⟦1|CPTⅠ先将⟧脂⟦1|酰基⟧由 ⟦1|CoA⟧ 转给⟦1|肉碱⟧，⟦1|转位酶⟧运入⟦1|脂酰肉碱⟧；⟦1|CPTⅡ⟧再将脂⟦1|酰基⟧转回 ⟦1|CoA⟧，供⟦1|β-⟧氧化，⟦1|肉碱⟧返回膜外侧。"]]],[0,8,0,4,"β氧化途径（β oxidation pathway）",[[0,"⟦1|脂肪酸⟧主要在⟦1|线粒体⟧⟦2|基质⟧进行的分解途径，因β碳被氧化而得名。⟦1|脂酰⟧ ⟦1|CoA⟧ 依次脱氢、⟦1|水合⟧、再脱氢和硫解，每轮通常切下 ⟦1|1⟧ 个⟦1|乙酰⟧ ⟦1|CoA⟧，并生成 ⟦1|FADH₂⟧和 ⟦1|NADH⟧。"]]],[0,8,0,5,"脂肪酸的ω-氧化作用（ω-oxidation）",[[0,"脂肪酸末端ω碳被氧化的过程。⟦1|P450⟧ ⟦1|单加氧酶⟧利用 ⟦1|NADPH⟧ 和 ⟦1|O₂⟧先将其⟦1|羟化⟧，再氧化为⟦1|羧基⟧，生成α,⟦1|ω-二羧酸⟧；两端均可经 ⟦1|CoA⟧ ⟦2|活化⟧后进行⟦1|β-⟧氧化。"]]],[0,8,0,6,"柠檬酸转运系统（Citric acid transport system）",[[0,"以⟦1|柠檬酸⟧运出⟦1|线粒体乙酰基⟧的系统。⟦1|乙酰⟧ ⟦1|CoA⟧ 与⟦1|草酰乙酸⟧缩合后出膜，在⟦2|胞质⟧裂解，提供⟦1|脂肪酸⟧合成⟦2|原料⟧；⟦1|草酰乙酸⟧经⟦1|苹果酸⟧、⟦1|丙酮酸⟧返回⟦1|线粒体⟧，再生⟦1|草酰乙酸⟧。"]]],[0,8,0,7,"酮体（ketone body）",[[0,"指⟦1|脂肪酸⟧氧化分解的中间产物⟦1|乙酰乙酸⟧、⟦1|D-β-⟧羟⟦1|丁酸⟧、⟦1|丙酮三者⟧的统称，主要在肝的⟦1|线粒体⟧⟦2|基质⟧内合成；它在⟦2|饥饿⟧、⟦1|低糖⟧或⟦1|糖尿病⟧等糖代谢不足时⟦2|大量⟧生成，作为脑、⟦1|心肌⟧、⟦1|骨骼肌⟧等肝外组织的重要⟦1|替代能源⟧。"]]],[0,8,0,8,"酮血症（ketonemia）/酮症（ketosis）",[[0,"酮血症是⟦1|酮体⟧生成超过肝外组织利用⟦2|能力⟧，使血中⟦1|乙酰乙酸⟧、⟦1|β-⟧羟⟦1|丁酸⟧等异常升高的状态；⟦2|饥饿⟧或⟦1|糖尿病⟧时⟦2|糖异生⟧消耗⟦1|草酰乙酸⟧，⟦1|乙酰⟧-⟦1|CoA⟧ 难入 ⟦1|TCA⟧ ⟦2|循环⟧而转向⟦1|酮体⟧合成，严重时可致⟦1|代谢性酸中毒⟧。"]]],[0,8,1,1,"比较脂肪酸氧化和合成的异同（脂肪酸合成与脂肪酸β-氧化的异同）。",[[0,"（1）⟦2|相同点⟧。"],[1,"①均以⟦1|载体⟧连接⟦1|脂酰⟧中间物，并有连接⟦2|胞质⟧与⟦1|线粒体⟧代谢的转运机制。"],[1,"②均以 ⟦1|2⟧ 个碳为单位逐轮延长或缩短⟦1|脂肪酸链⟧。"],[1,"③每轮均有 ⟦1|4⟧ 步反应，但反应方向、酶和⟦1|辅因子⟧不同。"],[0,"（2）⟦2|不同点⟧。"],[1,"区别点                  脂肪酸从头合成                     脂肪酸⟦1|β-⟧氧化"],[1,"部位          ⟦2|胞质⟧                       ⟦1|线粒体⟧⟦2|基质⟧"],[1,"⟦1|跨膜⟧转运         ⟦1|柠檬酸⟧穿梭输出⟦1|乙酰基⟧               ⟦1|肉碱⟧穿梭输入脂⟦1|酰基⟧"],[1,"⟦1|酰基载体⟧         ⟦1|ACP⟧ ⟦1|OAA⟧ 经⟦1|苹果酸⟧、⟦1|丙酮酸⟧返回线粒体并再生。"]]],[0,8,1,4,"乙酰 CoA 分子在代谢中有何重要地位？（也可以回答 18 章乙酰 CoA 的作用答案）",[[0,"①乙酰-CoA 来自⟦1|丙酮酸⟧氧化⟦2|脱羧⟧、⟦1|脂肪酸β-⟧氧化和部分⟦1|氨基酸⟧分解。"],[0,"②是⟦1|脂肪酸⟧、⟦1|胆固醇⟧和⟦1|酮体⟧合成的⟦1|碳源⟧。"],[0,"③是三大⟦1|营养物质⟧分解的共同中间物，经 ⟦1|TCA⟧ 及氧化磷酸化完成氧化，生成 ⟦1|CO₂⟧、⟦1|H₂O⟧ 并合成 ⟦1|ATP⟧。"],[0,"④可激活⟦1|丙酮酸羧化酶⟧，并作为乙酰-CoA ⟦1|羧化酶⟧的底物，连接⟦2|糖异生⟧与⟦1|脂肪酸⟧合成。"]]],[0,8,1,5,"什么是酮体？简述其代谢特点、产生原因及生理意义。",[[0,"（1）酮体为⟦1|乙酰乙酸⟧、⟦1|D-β-⟧羟⟦1|丁酸⟧和⟦1|丙酮⟧，由肝⟦1|线粒体⟧的⟦1|乙酰⟧-⟦1|CoA⟧ 生成；前⟦1|两者⟧可运至肝外供能。"],[0,"（2）代谢特点。"],[1,"①肝内生成、肝外利用：肝⟦1|有生酮酶⟧系，却缺乏利用酮体的关键酶。"],[1,"②⟦1|丙酮⟧生成少，主要经呼吸排出。"],[1,"③⟦1|乙酰乙酸⟧和 ⟦1|D-β-⟧羟⟦1|丁酸⟧入肝外组织，转为⟦1|乙酰⟧-⟦1|CoA⟧ 并经 ⟦1|TCA⟧ 供能。"],[1,"④长期⟦2|饥饿⟧时，脑也可利用⟦1|乙酰乙酸⟧和 ⟦1|D-β-⟧羟⟦1|丁酸⟧。"],[1,"⑤酮体易入血；⟦2|过量⟧可致⟦1|酮症酸中毒⟧、昏迷甚至死亡。"],[0,"（3）产生原因。"],[1,"⟦2|饥饿⟧或⟦1|胰岛素⟧不足⟦1|时脂⟧解增强，⟦1|OAA⟧ 被用于⟦2|糖异生⟧，⟦1|乙酰⟧-⟦1|CoA⟧ ⟦1|供应⟧超过 ⟦1|TCA⟧ 利用⟦2|能力⟧，因而更多转为酮体。"],[0,"（4）生理意义。"],[1,"①酮体是肝输出⟦1|脂肪酸⟧能量的可溶形式。"],[1,"②易⟦2|运输⟧、易利用，可供心、肾、肌及⟦2|饥饿⟧时的脑，并减少⟦1|肌蛋白⟧分解。"],[1,"③⟦1|低血糖⟧时作为⟦1|应急燃料⟧，⟦1|节省葡萄糖⟧供⟦1|红细胞⟧等利用；⟦2|饥饿⟧时可提供脑能量的 ⟦1|25⟧%～⟦1|75⟧%。"]]],[0,8,1,6,"简述糖代谢与脂代谢的联系（糖代谢和脂代谢是通过哪些反应联系起来的）",[[0,"①⟦1|糖经⟧ ⟦1|EMP⟧ 生成 ⟦1|DHAP⟧ 和⟦1|丙酮酸⟧，分别转成⟦2|甘油⟧-⟦1|3⟧-⟦1|磷酸⟧和⟦1|乙酰⟧-⟦1|CoA⟧；⟦2|后者⟧合成⟦1|脂肪酸⟧，⟦2|二者⟧再合成⟦2|脂肪⟧。"],[0,"②⟦1|HMP⟧ 提供⟦1|脂肪酸⟧、⟦1|固醇⟧合成所需 ⟦1|NADPH⟧；⟦1|GAP⟧ 等中间物也可转成⟦2|脂质原料⟧。"],[0,"③⟦2|脂肪水解⟧的⟦2|甘油⟧转成 ⟦1|DHAP⟧，可经⟦2|糖异生⟧补充⟦1|葡萄糖⟧，也可入 ⟦1|EMP⟧ 供能。"],[0,"④植物⟦1|脂肪酸⟧经⟦1|β-⟧氧化和乙醛酸循环生成 ⟦1|OAA⟧，再经⟦2|糖异生⟧⟦1|转为糖⟧。"],[0,"⑤⟦1|脂肪酸β-⟧氧化生成⟦1|乙酰⟧-⟦1|CoA⟧，进入 ⟦1|TCA⟧ 彻底氧化供能。"],[0,"⑥⟦1|脂肪酸⟧合成所需⟦1|乙酰⟧-⟦1|CoA⟧ 以⟦1|柠檬酸⟧形式由⟦1|线粒体⟧运至⟦2|胞质⟧。"]]],[0,8,1,7,"为什么说柠檬酸在脂肪酸合成途径中扮演重要角色？",[[0,"柠檬酸既运送脂肪酸合成⟦2|原料⟧，又参与调节。"],[1,"①运送⟦1|乙酰⟧-⟦1|CoA⟧：⟦1|线粒体乙酰⟧-⟦1|CoA⟧ 与 ⟦1|OAA⟧ 生成柠檬酸并出膜，在⟦2|胞质⟧裂为⟦1|乙酰⟧-⟦1|CoA⟧ 和 ⟦1|OAA⟧。"],[1,"②激活限速酶：柠檬酸促⟦1|乙酰⟧-⟦1|CoA⟧ ⟦1|羧化酶⟧聚合为⟦2|活性⟧多聚体，促进⟦1|丙二酰⟧-⟦1|CoA⟧ 形成。"],[1,"③穿梭中⟦1|苹果酸⟧可经⟦1|苹果酸酶⟧生成 ⟦1|NADPH⟧，供脂肪酸合成。"],[1,"④柠檬酸升高提示⟦1|碳源⟧和能量充足，有利于满足合成所需 ⟦1|ATP⟧。"]]],[0,9,0,1,"泛肽（ubiquitin），泛素",[[0,"⟦1|真核细胞⟧中由 ⟦1|76⟧ 个⟦1|氨基酸⟧组成的⟦1|高度⟧保守小⟦1|蛋白⟧。经 ⟦1|E1⟧ 激活、⟦1|E2⟧ 转接和 ⟦1|E3⟧ 识别，常与靶⟦1|蛋白⟧ ⟦1|Lys⟧ 形成异⟦1|肽键⟧；特定多聚⟦1|泛素链⟧可⟦2|标记⟧靶⟦1|蛋白⟧，供⟦1|蛋白酶体⟧识别降解。"]]],[0,9,0,2,"泛素介导的蛋白质降解（ubiquitin-proteasome system）",[[0,"是⟦1|真核细胞⟧内依赖 ⟦1|ATP⟧、⟦1|高度⟧特异的蛋白质降解⟦2|途径⟧；其过程是⟦1|泛素⟧分子先在⟦1|泛素激活酶⟧（⟦1|E1⟧）、⟦1|泛素⟧结合酶（⟦1|E2⟧）和⟦1|泛素⟧连接酶（⟦1|E3⟧）的作用下⟦2|标记⟧靶⟦1|蛋白⟧，形成多⟦1|泛素⟧化⟦1|标签⟧，随后被 ⟦1|26⟧S ⟦1|蛋白酶体⟧识别并降解。"]]],[0,9,0,3,"转氨基作用（transamination）",[[0,"转氨基作用是在⟦1|转氨酶⟧催化下，将⟦1|氨基酸⟧的⟦1|α-氨基⟧转给另一⟦1|α-酮酸⟧，生成新⟦1|氨基酸⟧和新⟦1|α-酮酸⟧的可逆反应；它既参与⟦1|氨基酸⟧分解，也是合成非必需氨基酸的重要方式。"]]],[0,9,0,4,"氧化脱氨基作用（oxidative deamination）",[[0,"⟦1|α-氨基酸⟧在酶的作用下，经过氧化还原反应，生成⟦1|α-酮酸⟧，并产生氨的过程；它是体内⟦1|氨基酸⟧分解、释放氨的重要途径，可连接⟦1|氨基酸⟧代谢与三⟦1|羧酸⟧⟦2|循环⟧。"]]],[0,9,0,5,"联合脱氨基作用（transdeamination）",[[0,"是体内主要的脱⟦1|氨基⟧方式，由转氨基作用与氧化脱氨基作用⟦2|偶联⟧进行；在代谢中，它既是⟦1|氨基酸⟧分解代谢的主要⟦2|途径⟧，也可用于合成非必需氨基酸。"]]],[0,9,0,6,"葡萄糖-丙氨酸循环（Glucose-alanine cycle）",[[0,"是⟦1|骨骼肌⟧与⟦1|肝脏⟧之间的氨和葡萄糖转运的循环过程；⟦2|肌肉⟧中⟦1|氨基酸经转氨⟧将⟦1|氨基⟧转给⟦1|丙酮酸⟧生成丙氨酸，⟦1|经血⟧运至⟦1|肝脏⟧；丙氨酸在肝内⟦2|脱氨⟧生成⟦1|丙酮酸⟧，经⟦2|糖异生⟧合成葡萄糖，再运回⟦2|肌肉⟧供能，同时氨在⟦1|肝脏⟧合成⟦1|尿素⟧排出。"]]],[0,9,0,7,"尿素循环（urea cycle）",[[0,"在⟦1|肝脏线粒体⟧和⟦1|细胞质⟧⟦2|基质⟧中进行的代谢⟦2|途径⟧，将有毒的氨与 ⟦1|CO₂⟧逐步转化为无毒⟦1|尿素⟧排出体外；它消耗 ⟦1|ATP⟧，⟦1|经氨甲酰磷酸⟧合成、⟦1|瓜氨酸⟧、⟦1|精氨酸⟧代⟦1|琥珀酸⟧、⟦1|精氨酸⟧生成等⟦2|步骤⟧，最终由⟦1|精氨酸酶⟧⟦2|水解⟧产生⟦1|尿素⟧。"]]],[0,9,0,8,"生糖氨基酸（glycogenic amino acids）",[[0,"分解后能生成⟦1|丙酮酸⟧或⟦1|α-⟧酮戊⟦1|二酸⟧、⟦1|草酰乙酸⟧等 ⟦1|TCA⟧ 中间物的⟦1|氨基酸⟧。这些碳⟦2|骨架⟧可经⟦2|糖异生⟧生成⟦1|葡萄糖⟧或⟦2|糖原⟧，在⟦2|饥饿⟧或⟦1|供糖⟧不足时帮助维持⟦1|血糖⟧。"]]],[0,9,0,9,"生酮氨基酸（ketonegenic amino acid）",[[0,"指分解代谢过程中能生成⟦1|乙酰⟧ ⟦1|CoA⟧ 或⟦1|乙酰乙酰⟧ ⟦1|CoA⟧，进而转化为⟦1|酮体⟧的⟦1|氨基酸⟧；这类⟦1|氨基酸⟧不能经⟦2|糖异生⟧生成⟦1|葡萄糖⟧，只能用于合成⟦1|脂肪酸⟧或⟦1|酮体⟧供能，在⟦2|饥饿⟧或糖代谢紊乱时为机体供能。"]]],[0,9,0,10,"苯丙酮尿症（phenylketonuria）",[[0,"主要由⟦1|苯丙氨酸羟化酶⟧缺陷引起的⟦2|遗传⟧代谢病。⟦1|苯丙氨酸⟧转为⟦1|酪氨酸⟧受阻，积累后更多与⟦1|α-⟧酮⟦1|戊二酸转氨⟧，生成⟦1|苯丙酮酸⟧等⟦1|旁路⟧产物，并随尿排出。"]]],[0,9,0,11,"一碳单位（one carbon unit）或一碳基团（one carbon group）",[[0,"指在代谢过程中，某些⟦2|化合物⟧（如⟦1|氨基酸⟧）分解产生的具有一个⟦1|碳原子⟧的基团（不包括 ⟦1|CO2⟧）；例如亚氨⟦1|甲基⟧、⟦1|甲基⟧、羟⟦1|甲基⟧、亚⟦1|甲基⟧等，这些基团不能⟦2|游离⟧存在，其⟦1|载体⟧主要为四氢叶酸。"]]],[0,9,0,12,"生物固氮作用（Biological nitrogen fixation）",[[0,"微生物将分子氮还原为氨的过程，由⟦1|固氮酶⟧⟦2|复合体⟧催化，主要含⟦1|固氮酶还原酶⟧和⟦1|固氮酶⟧两⟦2|组分⟧。它为⟦1|农业⟧提供可利用⟦1|氮源⟧，并维持生态系统的氮⟦2|循环⟧。"]]],[0,9,1,1,"简述氨基酸脱氨基的方式和特点（脱氨基作用的主要类型）。",[[0,"氨基酸⟦2|脱氨⟧相关反应主要包括⟦1|转氨⟧、氧化⟦2|脱氨⟧、联合⟦2|脱氨⟧和非氧化⟦2|脱氨⟧；其中 （2）意义。"],[1,"①概括 ⟦1|DNA⟧ ⟦2|储存⟧、⟦1|RNA⟧ 传递、蛋白质执行⟦2|遗传信息⟧的⟦2|基本⟧关系。"],[1,"②为⟦2|研究⟧表达⟦2|调控⟧、⟦1|发育⟧、⟦2|疾病⟧及⟦2|药物⟧作用提供⟦1|理论⟧基础。"],[1,"③推动⟦1|分子生物学实验⟧⟦2|技术⟧⟦1|发展⟧。"]]],[0,13,1,2,"基因突变有哪些类型，可能会产生哪些后果。",[[0,"（1）基因突变包括⟦1|碱基⟧替换、⟦1|移码⟧以及⟦1|大片⟧段缺失或重复。"],[1,"①替换分转换和颠换；可造成⟦1|同义⟧、⟦1|错义⟧或无义突变，无义突变产生提前终止⟦1|密码⟧。"],[1,"②插入或缺失非 ⟦1|3⟧ 整数倍⟦1|核苷酸⟧会⟦1|移码⟧，使突变点后的⟦1|密码子⟧和⟦1|氨基酸序列改变⟧。"],[1,"③⟦1|大片⟧段缺失可丢失十几至数千⟦1|碱基⟧；重复则增加某区域⟦1|拷贝⟧。"],[0,"（2）可能后果。"],[1,"①蛋白质结构、功能异常，可致⟦2|遗传病⟧。"],[1,"②⟦1|同义⟧突变可能无⟦1|表型⟧；非⟦2|编码⟧区突变可无影响，也可改变表达。"],[1,"③产生新基因、新⟦1|性状⟧，为自然选择和适应提供⟦1|变异⟧。"],[1,"④增加⟦1|种群⟧、⟦1|物种⟧的⟦2|遗传⟧多样性。"],[1,"⑤可用于诱变育种。"]]],[0,14,0,1,"半保留复制（semiconservative replication）",[[0,"是 ⟦1|DNA⟧ 复制的主要方式。复制时 ⟦1|DNA⟧ ⟦1|双链⟧解旋，每条⟦1|单链⟧作为⟦2|模板⟧，按照⟦1|碱基⟧互补配对⟦1|原则⟧合成⟦1|新链⟧；复制完成后，形成的两个⟦1|子代⟧ ⟦1|DNA⟧ 分子中，各含一条⟦1|亲代链⟧和一条新⟦1|合成链⟧，原有⟦2|遗传信息⟧被完整保留并传递。"]]],[0,14,0,2,"DNA 的半不连续复制（Semi-discontinuous replication of the DNA）",[[0,"DNA 复制中前导链连续、⟦1|后随链⟧不连续合成的⟦1|特性⟧。因两⟦2|模板⟧反向⟦1|平行⟧，而聚合酶只能 ⟦1|5⟧′→⟦1|3⟧′延伸，⟦1|后随链⟧须⟦1|分段⟧合成⟦1|冈崎片段⟧，再去⟦2|引物⟧、补缺口并连接⟦1|成长链⟧。"]]],[0,14,0,3,"复制叉（replication fork）或生长点（growing point）",[[0,"当 ⟦1|DNA⟧ 复制从起始区⟦1|启动⟧时，起始⟦1|区因⟧发生⟦1|解链⟧而形成叉状结构，⟦1|原核细胞⟧内只有一个，⟦1|真核细胞⟧内有多个复制起始点。"]]],[0,14,0,4,"复制子（replicon）",[[0,"是 ⟦1|DNA⟧ 中能独立进行复制的⟦2|基本⟧单位，包含复制起点、复制相关⟦2|调控⟧序列及被复制的 ⟦1|DNA⟧ 片段，可能还有终止复制的终点；在数量上，⟦2|原核⟧生物通常一个 ⟦1|DNA⟧ 分子就是一个复制子，⟦2|真核⟧生物每条⟦1|染色体⟧含多个复制子。"]]],[0,14,0,5,"滚环复制（rolling circle replication）",[[0,"⟦1|环状⟧ ⟦1|DNA⟧ 的一种⟦1|单向⟧复制方式，常见于⟦1|噬菌体⟧和⟦1|质粒⟧。以⟦1|噬菌体⟧为例，A ⟦1|蛋白⟧切开⟦1|正链⟧，暴露 ⟦1|3⟧′-OH；聚合酶以完整⟦1|负链⟧为⟦2|模板⟧延伸⟦1|正链⟧，同时置换出原⟦1|正链⟧。"]]],[0,14,0,6,"双向复制（bidirectional replication）",[[0,"是 ⟦1|DNA⟧ 从复制起点开始，向两个相反方向同时进行复制的方式；解旋后形成两个反向⟦2|移动⟧的复制叉，分别完成前导链与⟦1|后随链⟧的合成，最终在复制终点汇合完成复制。"]]],[0,14,0,7,"Klenow 片段",[[0,"是大肠杆菌 ⟦1|DNA⟧ 聚合酶 I 经枯草杆菌⟦1|蛋白酶⟧⟦2|水解⟧后产生的 C 端⟦1|大片⟧段分子；它保留了 ⟦1|5⟧'→⟦1|3⟧'聚合酶⟦2|活性⟧和⟦1|3⟧'→⟦1|5⟧'⟦1|外切酶⟧校对⟦2|活性⟧，但缺失 ⟦1|5⟧'→⟦1|3⟧'⟦1|外切酶⟧⟦2|活性⟧。"]]],[0,14,0,8,"冈崎片段（Okazaki fragments）",[[0,"⟦1|后随链⟧不连续合成的短 ⟦1|DNA⟧ 片段。因聚合酶只能 ⟦1|5⟧′→⟦1|3⟧′延伸，⟦1|后随链⟧须⟦1|分段⟧复制；⟦1|细菌⟧片段约 ⟦1|1000～2000⟧nt，⟦2|真核⟧约 ⟦1|100～200⟧ nt，经去⟦2|引物⟧、补缺口和连接形成⟦1|长链⟧。"]]],[0,14,0,9,"前导链（leading strand）",[[0,"前导链是以 ⟦1|3⟧′→⟦1|5⟧′⟦1|亲代链⟧为⟦2|模板⟧，沿复制叉⟦1|前进方向⟧连续合成的⟦1|子链⟧；其合成只需一个⟦2|引物⟧，由 ⟦1|DNA⟧ 聚合酶按 ⟦1|5⟧′→⟦1|3⟧′方向持续延伸。"]]],[0,14,0,10,"滞后链（lagging strand）",[[0,"滞后链是以 ⟦1|5⟧′→⟦1|3⟧′⟦1|亲代链⟧为⟦2|模板⟧、与复制叉⟦2|移动⟧方向相反而不连续合成的⟦1|子链⟧；它需反复引发并形成多个⟦1|冈崎片段⟧，最后由 ⟦1|DNA⟧ 连接酶⟦1|连成⟧完整链。"]]],[0,14,0,11,"自主复制序列（autonomously replicating sequences ARS）",[[0,"自主复制序列是⟦2|真核⟧⟦1|染色体⟧上可作为复制起点的特定 ⟦1|DNA⟧ 序列，能结合复制⟦1|起始因子⟧并⟦1|启动⟧复制；它可赋予相连 ⟦1|DNA⟧ 自主复制⟦2|能力⟧，也是构建⟦1|酵母载体⟧的重要⟦2|元件⟧。"]]],[0,14,0,12,"DNA 聚合酶（DNA polymerase）",[[0,"催化 DNA 合成的酶，通常以 DNA 为⟦2|模板⟧、⟦1|4⟧ 种⟦1|脱氧核苷⟧三⟦1|磷酸⟧为⟦2|原料⟧，从⟦2|引物⟧ ⟦1|3⟧′-OH 沿 ⟦1|5⟧′→⟦1|3⟧′方向延伸。它参与复制和修复，维持⟦2|基因组⟧稳定并传递⟦2|遗传信息⟧。"]]],[0,14,0,13,"端粒（telomere）",[[0,"是⟦2|真核⟧生物⟦1|线性染色体⟧末端由短⟦1|串联⟧重复 ⟦1|DNA⟧ 序列组成的特殊结构；它由上百个 ⟦1|6⟧ 个⟦1|核苷酸⟧的重复序列组成，⟦1|一条链⟧富含 G，⟦1|互补链⟧富含 C。"]]],[0,14,0,14,"端粒酶（telomerase）",[[0,"是一种⟦1|核糖⟧核蛋白⟦1|复合物⟧，具有⟦1|逆转录酶⟧⟦2|活性⟧，由 ⟦1|RNA⟧ 和蛋白质组成；它利用所含的 ⟦1|RNA⟧ 作为⟦2|模板⟧延伸⟦1|染色体⟧末端的⟦1|端粒⟧，合成一个重复单位⟦1|后酶⟧再向前⟦2|移动⟧一个单位，从而弥补复制导致的⟦1|端粒⟧缩短。"]]],[0,14,0,15,"DNA 损伤（DNA injury）",[[0,"指 DNA 结构与⟦1|碱基⟧序列发生异常改变，从而可能影响 DNA 的正常功能现象；若未及时修复，可导致突变、细胞衰老或⟦1|癌变⟧。"]]],[0,14,0,16,"DNA 修复（DNA repair）",[[0,"是细胞针对 DNA 损伤识别和修复，最终通过⟦1|一系列酶⟧促反应使其结构与序列恢复正常的过程；具体包括直接修复、切除修复、错配修复、重组修复及易错修复等方式。"]]],[0,14,0,17,"定点突变（site-specific mutagenesis）",[[0,"是在已知 ⟦1|DNA⟧ 序列的特⟦1|定位点⟧，通过⟦1|人工⟧方法引入⟦1|碱基⟧替换、插入或缺失，从而改变基因⟦1|编码序列⟧的⟦1|分子生物学⟧⟦2|技术⟧。"]]],[0,14,0,18,"直接修复（direct repair）",[[0,"是不切除⟦1|碱基⟧或⟦1|核苷酸⟧，直接将损伤 ⟦1|DNA⟧ 恢复为正常结构的一种高效修复方式；其特点是无需⟦2|模板⟧，一步完成，对细胞损伤小、⟦1|保真度⟧高，是生物应对简单 ⟦1|DNA⟧ 损伤、维持⟦2|基因组⟧稳定的重要基础机制。"]]],[0,14,0,19,"错配修复（mismatch repair）",[[0,"纠正 ⟦1|DNA⟧ 复制错配的系统，识别⟦1|新链⟧并切除⟦1|错误⟧片段，再补合成和连接。大肠杆菌可借⟦1|半甲基化区分母子链⟧；⟦2|真核⟧不依赖⟦1|半甲基化⟧，而利用⟦1|新链切口⟧及复制相关⟦2|信号⟧。"]]],[0,14,0,20,"切除修复（excision repair）",[[0,"先切除 ⟦1|DNA⟧ 损伤，再依完整⟦1|互补链⟧恢复序列的修复方式。⟦1|特异酶⟧识别并去除受损⟦1|碱基⟧或⟦1|核苷酸⟧片段，⟦1|DNA⟧ 聚合酶填补⟦1|缺口⟧，连接酶⟦1|封口⟧，使 ⟦1|DNA⟧ 恢复正常结构。"]]],[0,14,0,21,"重组修复（recombination repair）",[[0,"是 ⟦1|DNA⟧ 复制后，针对未修复的损伤区域进行的⟦1|容错性⟧修复机制；复制时先跳过损伤部位，⟦1|子链⟧在损伤处出现⟦1|缺口⟧，通过同源重组从⟦1|母链同源⟧片段获取序列填补⟦1|缺口⟧，然后用再合成的序列来补上⟦1|母链⟧的空缺。"]]],[0,14,0,22,"易错修复（error prone repair）",[[0,"是 ⟦1|DNA⟧ 受损严重、复制受阻时⟦2|诱导⟧产生的⟦1|应急⟧容错修复；其修复机制是⟦2|诱导⟧产生缺乏校对功能的 ⟦1|DNA⟧ 聚合酶IV 和 V，它们在 ⟦1|DNA⟧ 链的损伤部位引入任意⟦1|核苷酸⟧，虽能维持⟦2|基因组⟧完整、让细胞⟦1|存活⟧，但引入⟦2|大量⟧突变。"]]],[0,14,0,23,"SOS 反应（SOS response）",[[0,"是细胞受到严重 ⟦1|DNA⟧ 损伤或复制受阻时，细胞抑制复制并⟦1|应急⟧产生一系列复杂的⟦2|诱导效应⟧；这一反应广泛存在于⟦2|原核⟧生物⟦1|和真⟧核生物，它是生物在不利⟦2|环境⟧中求得生存的一种⟦1|基本功能⟧。"]]],[0,14,0,24,"无义突变（nonsense mutation）",[[0,"指⟦2|编码⟧⟦1|氨基酸⟧的⟦1|密码子⟧突变为终止⟦1|密码子⟧的⟦1|基因突变⟧；突变后 ⟦1|mRNA⟧ 翻译提前终止，产生截短、不完整且通常无功能的蛋白质。这类突变常导致⟦1|基因功能⟧完全丧失，对生物⟦1|表型⟧影响显著，可引发⟦1|遗传性⟧⟦2|疾病⟧。"]]],[0,14,0,25,"错义突变（missense mutation）",[[0,"指三联体⟦1|密码子⟧发生突变改变了⟦2|编码⟧⟦1|氨基酸⟧的⟦1|密码子⟧，导致蛋白质中原来的⟦1|氨基酸⟧被另一种⟦1|氨基酸⟧取代的突变；其原因包括 ⟦1|DNA⟧ 复制过程中的⟦1|错误⟧、⟦1|环境因素⟧导致的 ⟦1|DNA⟧ 损伤等。"]]],[0,14,0,26,"移码突变（frameshift mutation）",[[0,"由于一个或多个非三整⟦1|倍数⟧的⟦1|核苷酸⟧对插入或缺失，而使⟦2|编码⟧区该⟦1|位点⟧后的三联体⟦1|密码子⟧阅读⟦1|框架⟧改变的⟦1|基因突变⟧；突变⟦1|位点⟧后的⟦1|密码子⟧全部重新⟦1|编组⟧，翻译出的⟦1|氨基酸⟧序列完全改变，对基因产物功能破坏极大。"]]],[0,14,0,27,"基因突变（Gene mutation）",[[0,"指基因内部⟦1|核酸⟧序列发生可⟦2|遗传⟧的改变，包括碱基置换、移码突变和⟦1|大片⟧段序列的删除与重复；其⟦1|成因⟧包括自发复制⟦1|错误⟧和⟦1|外界⟧诱变因素，⟦2|后者⟧如⟦1|化学物质⟧、辐射、⟦2|病毒⟧等⟦1|诱变剂⟧。"]]],[0,14,0,28,"引发体（primosome）",[[0,"是 ⟦1|DNA⟧ 复制起始⟦1|阶段⟧在复制叉处形成的多蛋白⟦2|复合体⟧，由⟦1|引发酶⟧、⟦1|解旋酶⟧及其他⟦1|辅助蛋白⟧组装而成；其功能是识别复制起点，解开 ⟦1|DNA⟧ ⟦1|双链⟧，并合成 ⟦1|RNA⟧ ⟦2|引物⟧，为 ⟦1|DNA⟧ 聚合酶提供 ⟦1|3⟧'-OH 末端以⟦1|启动链⟧的合成。"]]],[0,14,0,29,"拓扑异构酶（topoisomerase）",[[0,"拓扑异构酶是通过暂时切断并重连 ⟦1|DNA⟧ 链来改变其拓扑状态的酶；按⟦1|切链⟧方式，可分为Ⅰ型和Ⅱ型：Ⅰ型只切⟦1|一条链⟧且通常不耗 ⟦1|ATP⟧，Ⅱ型同时切⟦1|两条链⟧，改变⟦1|超螺旋时需⟧ ⟦1|ATP⟧。"]]],[0,14,0,30,"DNA 连接酶（ligase）",[[0,"是一种能催化 DNA 链的 ⟦1|3⟧'-⟦1|羟基⟧与 ⟦1|5⟧'-⟦1|磷酸⟧基团形成⟦1|磷酸二酯⟧键的酶；在复制中用于连接⟦1|冈崎片段⟧、修复 DNA⟦1|单链⟧断裂，在⟦1|基因工程⟧中用于拼接⟦2|外源⟧ DNA 与⟦1|载体⟧。"]]],[0,14,0,31,"转导（Transduction）",[[0,"转导是⟦1|噬菌体⟧把⟦2|供体⟧⟦1|细菌⟧ ⟦1|DNA⟧ 转移⟦1|给受体⟧菌的过程；⟦1|普遍性⟧转导可转移⟦2|宿主⟧任意片段，⟦1|局限性⟧转导只转移温和⟦1|噬菌体⟧整合⟦1|位点⟧附近的基因。"]]],[0,14,0,32,"转座（transposition）",[[0,"指 ⟦1|DNA⟧ 上的⟦1|碱基⟧序列从一个位置转位或跳跃到另外一个位置，在⟦1|细菌⟧、⟦1|古菌⟧和⟦2|真核⟧生物的⟦2|基因组⟧内均可发生；转座的位置通常或多或少是随机的，不依赖序列同源性，可导致⟦2|宿主⟧序列删除、⟦1|倒位⟧和⟦1|易位⟧。"]]],[0,14,0,33,"转座子（transposons）",[[0,"是一种可由⟦1|染色体⟧的一个位置转移到另外位置的⟦1|遗传因子⟧，也就是一段可发生转座的 ⟦1|DNA⟧；它们在⟦2|基因组⟧中的⟦2|移动⟧可导致基因的插入、删除或⟦1|重排⟧，从而引起⟦1|基因突变⟧和⟦1|染色体⟧结构的改变。"]]],[0,14,1,1,"简述 DNA 复制的详细过程（以原核生物为例）。",[[0,"（1）以大肠杆菌为例，DNA 复制分起始、延伸和终止。"],[1,"①起始。"],[2,"⟦1|DnaA⟧ 结合 ⟦1|oriC⟧ 并促使富含 AT 的区域局部⟦1|解链⟧；⟦1|DnaC⟧ 把 ⟦1|DnaB⟧ ⟦1|解旋酶⟧装载到 DNA 上，形成两个复制叉。"],[2,"⟦1|DnaB⟧ ⟦1|解链⟧，⟦1|SSB⟧ 稳定⟦1|单链⟧，DNA ⟦1|旋转酶⟧消除前方正⟦1|超螺旋⟧；⟦1|DnaG⟧ 与 ⟦1|DnaB⟧ 配合合成 ⟦1|RNA⟧ ⟦2|引物⟧。"],[1,"②延伸。"],[2,"⟦1|PolⅢ⟧从⟦2|引物⟧ ⟦1|3⟧′端沿 ⟦1|5⟧′→⟦1|3⟧′延伸，前导链连续合成，⟦1|后随链⟧形成⟦1|冈崎片段⟧。"],[3,"a.⟦1|DnaG⟧ 为前导链和各⟦1|冈崎片段⟧合成 ⟦1|RNA⟧ ⟦2|引物⟧。"],[3,"b.DNA 聚合酶Ⅲ延伸⟦1|新链⟧，并以 ⟦1|3⟧′→⟦1|5⟧′⟦1|外切⟧⟦2|活性⟧校对。"],[3,"c.DNA 聚合酶Ⅰ以 ⟦1|5⟧′→⟦1|3⟧′⟦1|外切⟧⟦2|活性⟧去除 ⟦1|RNA⟧ ⟦2|引物⟧，并补入 DNA。"],[3,"d.DNA 连接酶封闭相邻片段间的⟦1|切口⟧，形成连续滞后链。"],[1,"③终止。"],[2,"两复制叉在终止区汇合，⟦1|Tus-Ter⟧ 可阻止其越过该区；复制体⟦1|解体⟧，残留⟦1|缺口⟧补齐连接，拓扑异构酶分开互锁的⟦1|子代⟧ DNA。"]]],[0,14,1,2,"试述参与 DNA 复制的酶及其功能。（以原核生物为例）",[[0,"（1）DNA 聚合酶。"],[1,"①聚合酶Ⅰ：有 ⟦1|5⟧′→⟦1|3⟧′聚合、⟦1|3⟧′→⟦1|5⟧′校对及 ⟦1|5⟧′→⟦1|3⟧′⟦1|外切⟧⟦2|活性⟧，主要去除⟦2|引物⟧、补缺和修复。"],[1,"②聚合酶Ⅱ：有 ⟦1|3⟧′→⟦1|5⟧′⟦1|外切⟧⟦2|活性⟧、无 ⟦1|5⟧′→⟦1|3⟧′⟦1|外切⟧⟦2|活性⟧，主要参与修复。"],[1,"③聚合酶Ⅲ：主要⟦1|复制酶⟧，有 ⟦1|5⟧′→⟦1|3⟧′聚合和 ⟦1|3⟧′→⟦1|5⟧′校对⟦2|活性⟧。"],[1,"④聚合酶Ⅳ、Ⅴ：严重损伤时参与⟦1|易错⟧跨损伤合成，⟦1|突变率⟧高。"],[0,"（2）解旋相关⟦1|蛋白⟧包括⟦1|解链酶⟧、拓扑异构酶和 ⟦1|SSB⟧。"],[1,"①⟦1|解链酶⟧耗 ⟦1|ATP⟧ 破坏⟦1|碱基⟧间⟦1|氢键⟧，打开⟦1|双链⟧。"],[1,"②Ⅱ型拓扑异构酶：⟦1|细菌旋转酶⟧引入负⟦1|超螺旋⟧并消除前方正⟦1|超螺旋⟧；拓扑异构酶Ⅳ主要分开互锁⟦1|子代⟧ DNA。"],[1,"③⟦1|SSB⟧ 结合⟦1|单链⟧，防止⟦2|复性⟧和⟦1|核酸酶⟧降解，但不负责⟦1|解链⟧。"],[0,"（3）⟦1|引物酶⟧是 DNA 依赖的 ⟦1|RNA⟧ 聚合酶，合成 ⟦1|RNA⟧ ⟦2|引物⟧。"],[0,"（4）DNA 连接酶封闭 ⟦1|5⟧′-⟦1|磷酸⟧与 ⟦1|3⟧′-OH 间⟦1|切口⟧；⟦1|细菌⟧多用 ⟦1|NAD⁺⟧ 供能，动物和⟦1|噬菌体⟧多用 ⟦1|ATP⟧。"],[0,"（5）⟦1|Dam⟧ ⟦1|甲基化酶⟧⟦2|甲基化⟧复制起点 ⟦1|GATC⟧ 序列。"]]],[0,14,1,3,"简述 DNA 复制的特点。",[[0,"DNA 复制有以下特点。"],[1,"①有特定复制起点，由起始⟦1|蛋白⟧识别并招募复制⟦1|机器⟧。"],[1,"②⟦1|需带⟧ ⟦1|3⟧′-OH 的⟦2|引物⟧；细胞 DNA 复制通常先合成 ⟦1|RNA⟧ ⟦2|引物⟧，⟦2|长度⟧因生物和复制系统而异。"],[1,"③通常⟦1|双向⟧进行：每个⟦1|起点⟧形成两个反向⟦2|移动⟧的复制叉；⟦2|真核⟧多⟦1|起点⟧可缩短复制⟦1|时间⟧。"],[1,"④半不连续：DNA 均按 ⟦1|5⟧′→⟦1|3⟧′合成，前导链连续，滞后链逆复制叉方向形成⟦1|冈崎片段⟧。"],[1,"⑤半保留：每个⟦1|子代⟧ DNA 含一条⟦1|亲代链⟧和一条⟦1|新链⟧。"],[1,"⑥⟦1|忠实性⟧高，依靠⟦1|碱基配对⟧、聚合酶校对和修复系统。"],[1,"⑦需聚合酶、⟦1|引物酶⟧、拓扑异构酶、连接酶等⟦2|协同⟧完成。"]]],[0,14,1,4,"生物体如何保证其 DNA 复制的准确性或遗传信息传递的稳定性。",[[0,"（1）半保留复制使每个⟦1|子代⟧ DNA 保留一条⟦1|亲代链⟧作为⟦2|模板⟧。"],[0,"（2）DNA 1|外显子⟧可含⟦2|编码⟧区或非翻译区，不能等同于纯⟦1|编码序列⟧。"]]],[0,15,0,9,"编码链（coding strand）、模板链（template strand）、负链（-链）、正链",[[0,"⟦1|模板链⟧、⟦1|无义链⟧、负链：⟦1|DNA⟧ ⟦1|双链⟧中在转录时作为 ⟦1|mRNA⟧ 合成模板的 ⟦1|DNA⟧ ⟦1|单链⟧；编码链、有⟦1|义链⟧、正链：⟦1|DNA双链⟧中与 ⟦1|mRNA⟧ 序列（除 T 被 U 取代外）完全一致的 ⟦1|DNA⟧ ⟦1|单链⟧。"]]],[0,15,0,10,"顺式作用元件（Cis-regulatory elements，CREs）",[[0,"指 ⟦1|DNA⟧ 分子中具有转录调节功能的特异 ⟦1|DNA⟧ 序列；它可被转录因子等反式作用因子识别结合，⟦2|调控⟧基因转录的起始与效率，是⟦2|真核⟧与⟦2|原核⟧基因表达⟦2|调控⟧的重要顺式⟦2|调控元件⟧。"]]],[0,15,0,11,"反式作用因子（trans-acting factor）",[[0,"指能直接或⟦1|间接地⟧识别或结合在各类顺式作用元件⟦2|核心⟧序列上参与⟦2|调控⟧靶基因转录效率的蛋白质或 ⟦1|RNA⟧ 分子；⟦1|这些因子⟧可是⟦1|激活因子⟧，促进基因的转录；也可是抑制⟦1|因子⟧，抑制基因的转录。"]]],[0,15,0,12,"RNA 的编辑（editing）",[[0,"是 ⟦1|mRNA⟧ ⟦2|前体⟧的一种⟦2|加工⟧方式，通过⟦1|碱基⟧替换、删除或插入，改变和扩大原来⟦2|模板⟧ ⟦1|DNA⟧ 的⟦2|遗传信息⟧，从而表达出不同⟦1|氨基酸⟧序列的多种蛋白质。"]]],[0,15,0,13,"RNA 剪接（Rna splicing）",[[0,"是⟦2|真核⟧生物转录后，将前体 ⟦1|mRNA⟧ 中的⟦1|内含子⟧切除、⟦1|外显子⟧依次连接形成成熟 ⟦1|mRNA⟧ 的过程，存在于⟦2|真核⟧生物，⟦2|原核⟧生物极为⟦1|少见⟧；它是进化的结果，也是基因表达调节的重要环节。"]]],[0,15,0,14,"剪接体（spliceosome）",[[0,"剪接体是由 ⟦1|snRNA⟧ 和相关⟦1|蛋白⟧组成的 ⟦1|RNA⟧ 剪接⟦1|复合物⟧；其中 U 系列 ⟦1|snRNP⟧ 及⟦1|剪接因子⟧负责识别剪接⟦1|位点⟧、组装⟦2|活性⟧结构并催化⟦1|内含子⟧切除和⟦1|外显子⟧连接。"]]],[0,15,0,15,"逆转录（reverse transcription）",[[0,"以 ⟦1|RNA⟧ 为⟦2|模板⟧，由⟦1|逆转录酶⟧按互补序列合成 ⟦1|DNA⟧ 的过程，最初发现于致癌 ⟦1|RNA⟧ ⟦2|病毒⟧。先合成⟦1|单链⟧ ⟦1|cDNA⟧，再以其为⟦1|模板合成⟧第二条互补 ⟦1|DNA⟧，形成⟦1|双链⟧。"]]],[0,15,0,16,"siRNA",[[0,"即小干扰 ⟦1|RNA⟧，是一类⟦1|长约⟧ ⟦1|21～25⟧ 个⟦1|核苷酸⟧的⟦1|双链⟧小分子 ⟦1|RNA⟧；它可由⟦2|外源⟧⟦1|双链⟧ ⟦1|RNA⟧ 经 ⟦1|Dicer⟧ 酶切割产生，能与靶 ⟦1|mRNA⟧ 互补结合，⟦2|诱导⟧其降解或阻止翻译，从而⟦2|特异性⟧抑制基因表达。"]]],[0,15,1,1,"请比较分析复制过程中的 DNA 聚合酶和转录过程中的 RNA 聚合酶作用的异同。",[[0,"DNA 聚合酶与 RNA 聚合酶的比较如下。"],[0,"（1）⟦2|相同点⟧。"],[1,"①均按 ⟦1|5⟧′→⟦1|3⟧′合成。"],[1,"②均遵循⟦1|碱基⟧互补配对。"],[1,"③均⟦1|经历⟧起始、延伸和终止。"],[1,"④均以 DNA 链为⟦2|模板⟧。"],[0,"（2）⟦2|不同点⟧。"],[1,"①DNA 聚合酶需⟦2|引物⟧，RNA 聚合酶可从头起始。"],[1,"②底物分别为 ⟦1|dNTP⟧ 和 ⟦1|NTP⟧。"],[1,"③DNA 复制通常⟦1|双向⟧、半保留、半不连续；转录⟦1|单向⟧且只用一条⟦1|模板链⟧。"],[1,"④DNA 聚合酶多有 ⟦1|3⟧′→⟦1|5⟧′校对⟦2|活性⟧；RNA 聚合酶校对有限。"],[1,"⑤RNA 聚合酶可局部解旋 DNA；DNA 聚合酶需⟦1|解链酶⟧。"],[1,"⑥复制⟦1|机器⟧识别复制起点；RNA 聚合酶识别启动子。"],[1,"⑦产物分别为 DNA 和 RNA。"]]],[0,15,1,2,"简述转录的过程：以原核生物为例。",[[0,"原核转录分起始、延伸和终止。"],[0,"（1）起始。"],[1,"①σ⟦1|因子⟧识别启动子-⟦1|35⟧、-⟦1|10⟧ 区， ,"可减轻突变对蛋白质的影响，维持⟦2|遗传信息⟧和生物稳定。"]]],[0,16,1,2,"阐述原核生物蛋白质翻译的主要过程（原核生物蛋白质合成的主要步骤）。",[[0,"（1）⟦1|氨酰⟧-⟦1|tRNA⟧ 合成酶耗 ⟦1|ATP⟧，使⟦1|氨基酸羧基⟧与特异 ⟦1|tRNA 3⟧′端连接，生成⟦1|氨酰⟧-⟦1|tRNA⟧。"],[0,"（2）起始需 ⟦1|30⟧S、⟦1|mRNA⟧、⟦1|fMet-tRNA⟧ᶠ、⟦1|IF-1⟧/⟦1|2⟧/⟦1|3⟧、⟦1|GTP⟧ 和 ⟦1|Mg²⁺⟧ 。"],[1,"①⟦1|IF-1⟧、⟦1|IF-3⟧ 先结合 ⟦1|30⟧S，并使其定位于 ⟦1|mRNA⟧ 起始区。"],[1,"②⟦1|IF-2-GTP⟧ 识别 ⟦1|fMet-tRNA⟧ᶠ，使其进入 P 位并与 ⟦1|AUG⟧ 配对。"],[1,"③⟦1|50⟧S 加入形成 ⟦1|70⟧S ⟦1|复合物⟧；IF 释放，⟦1|IF-2⟧ ⟦2|水解⟧ ⟦1|GTP⟧。"],[0,"（3）延伸。"],[1,"①进位：⟦1|EF-Tu-GTP⟧ 把与下一⟦1|密码⟧匹配的⟦1|氨酰⟧-⟦1|tRNA⟧ 送入 A 位。"],[1,"②⟦1|成肽⟧：肽⟦1|基转移酶⟧使 A 位⟦1|氨基⟧进攻 P ⟦1|位肽酰基⟧，形成⟦1|肽键⟧。"],[1,"③⟦1|移位⟧：⟦1|EF-G-GTP⟧ 推动⟦1|核糖体⟧沿 ⟦1|mRNA⟧ ⟦2|移动⟧，⟦1|肽酰⟧-⟦1|tRNA⟧ 由 A 位到 P 位，⟦1|脱酰⟧ ⟦1|tRNA⟧ 经 E 位离开。"],[0,"（4）终止：终止⟦1|密码⟧ ⟦1|UAA⟧、⟦1|UAG⟧ 或 ⟦1|UGA⟧ 进入 A 位，⟦1|释放因子促肽酰⟧-⟦1|tRNA⟧ ⟦2|水解⟧；再耗 ⟦1|GTP⟧ 释放 ⟦1|mRNA⟧、⟦1|tRNA⟧ 并解离⟦1|核糖体⟧。"],[0,"（5）折叠、⟦2|加工⟧和修饰。"],[1,"⟦1|二硫键异构酶⟧纠正⟦1|二硫键⟧，⟦1|肽基脯氨酰异构酶⟧调节 ⟦1|Pro⟧ 顺反⟦1|构型⟧，分子伴侣协助折叠和组装。"]]],[0,16,1,3,"原核生物与真核生物翻译起始的异同。",[[0,"（1）⟦2|相同点⟧。"],[1,"①均以 ⟦1|mRNA⟧ 为⟦2|模板⟧，以起始 ⟦1|tRNA⟧ 携带起始⟦1|氨基酸⟧。"],[1,"②均在⟦1|核糖体⟧上沿 ⟦1|mRNA 5⟧′→⟦1|3⟧′方向起始翻译。"],[1,"③均需大小⟦1|亚基⟧及⟦1|起始因子⟧。"],[0,"（2）⟦2|不同点⟧。"],[1,"①⟦1|核糖体⟧：原核 ⟦1|70⟧S（⟦1|50S+30S⟧）；真核 ⟦1|80⟧S（⟦1|60S+40S⟧）。"],[1,"②起始 ⟦1|tRNA⟧：原核为 ⟦1|fMet-tRNA⟧ᶠᴹᵉᵗ；真核为 ⟦1|Met-tRNA⟧ᵢᴹᵉᵗ。"],[1,"③原核主要 ⟦1|3⟧ 种 IF；真核 ⟦1|eIF⟧ 至少十余种。"],[1,"④⟦2|定位⟧ ⟦1|AUG⟧：原核以 SD 序列与 ⟦1|16⟧S ⟦1|rRNA⟧ 配对；真核 ⟦1|40⟧S 从 ⟦1|5⟧′帽开始扫描至合适 ⟦1|AUG⟧。"],[1,"⑤装配⟦1|顺序⟧：原核 ⟦1|mRNA⟧ 先与 ⟦1|30⟧S 结合，再加 ⟦1|fMet-tRNA⟧ 和 ⟦1|50⟧S；真核起始 ⟦1|tRNA⟧ 先与 ⟦1|40⟧S 结合，再招募 ⟦1|mRNA⟧并扫描，最后加 ⟦1|60⟧S。"],[1,"⑥真核 ⟦1|40⟧S 扫描需 ⟦1|ATP⟧。"]]],[0,16,1,4,"真核细胞和原核细胞蛋白质合成的异同。",[[0,"（1）⟦2|相同点⟧。"],[1,"①均以 ⟦1|mRNA⟧ 为⟦2|模板⟧，在⟦1|核糖体⟧上翻译，可形成多聚⟦1|核糖体⟧。"],[1,"②均以 ⟦1|20⟧ 种⟦2|基本⟧⟦1|氨基酸⟧为⟦2|原料⟧，先⟦2|活化⟧为⟦1|氨酰⟧-⟦1|tRNA⟧。"],[1,"③均需⟦1|氨酰⟧-⟦1|tRNA⟧ 合成酶、肽⟦1|基转移酶⟧、⟦1|辅助因子⟧以及 ⟦1|ATP⟧、⟦1|GTP⟧。"],[1,"④均⟦1|经历⟧起始、延伸和终止，按遗传密码把⟦1|肽链⟧从 N 端向 C 端延长。"],[1,"⑤均形成⟦1|肽键⟧，产物需进一步折叠，并可发生翻译后⟦2|加工⟧。"],[0,"（2）⟦2|不同点⟧。"],[1,"①⟦1|场所⟧：⟦2|原核⟧转录、翻译可⟦2|偶联⟧；真核核内转录，在⟦2|胞质游离⟧⟦1|核糖体⟧或粗面⟦1|内质网⟧上翻译。"],[1,"②⟦1|核糖体⟧：⟦2|原核⟧ ⟦1|70⟧S（⟦1|50S+30S⟧）；⟦2|真核⟧ ⟦1|80⟧S（⟦1|60S+40S⟧），⟦1|rRNA⟧ 种类也不同。"],[1,"③起始⟦1|氨基酸⟧：⟦2|原核⟧为 ⟦1|fMet⟧，真核为 ⟦1|Met⟧。"],[1,"④⟦1|mRNA⟧ 识别：⟦2|原核⟧靠 SD 序列⟦2|定位⟧起始⟦1|密码子⟧；⟦2|真核⟧小⟦1|亚基⟧识别 ⟦1|5⟧′帽并扫描至适宜的 ⟦1|AUG⟧。"],[1,"⑤延伸和⟦1|释放因子⟧不同：⟦2|原核⟧主要用 ⟦1|EF-Tu⟧、⟦1|EF-G⟧、⟦1|RF1⟧/⟦1|RF2⟧；⟦2|真核⟧主要用 ⟦1|eEF1A⟧、⟦1|eEF2⟧ 和 ⟦1|eRF1⟧。两类⟦1|核糖体⟧均有 A、P、E 位。"],[1,"⑥⟦1|起始因子⟧：⟦2|原核⟧主要用 ⟦1|IF-1⟧、⟦1|IF-2⟧、⟦1|IF-3⟧；⟦2|真核⟧使用种类更多的 ⟦1|eIF⟧。"]]],[0,16,1,5,"真核生物细胞内翻译后修饰的方式有哪些？",[[0,"蛋白质⟦2|前体⟧常经下列翻译后⟦2|加工⟧。"],[1,"①末端修饰：去除 N 端 ⟦1|Met⟧ 等，影响⟦2|稳定性⟧、降解和互作；⟦1|线粒体蛋白⟧还可⟦1|去甲酰基⟧。"],[1,"②切除⟦1|信号肽⟧：⟦1|蛋白⟧⟦2|定位⟧后，⟦1|信号肽⟧可被切除，形成成熟⟦1|蛋白⟧。"],[1,"③形成⟦1|二硫键⟧，稳定正确折叠。"],[1,"④切除特定肽段，如去除⟦1|酶原前肽⟧使其⟦2|活化⟧。"],[1,"⑤⟦1|残基⟧修饰：⟦1|乙酰化⟧、⟦2|甲基化⟧、⟦2|磷酸化⟧、⟦1|羟化⟧、⟦1|泛素⟧化、⟦1|糖基化⟧等，改变性质和⟦2|活性⟧。"],[1,"⑥添加⟦1|糖链⟧，影响折叠、识别和⟦2|运输⟧。"],[1,"⑦结合辅基或⟦1|辅酶⟧，如⟦1|羧化酶⟧结合⟦1|生物素⟧、细胞色素结合⟦1|血红素⟧。"],[1,"⑧形成高级结构及多⟦1|亚基复合物⟧。"]]],[0,17,0,1,"反义 RNA（antisense RNA）",[[0,"是一种调节 RNA，含有与特定 ⟦1|mRNA⟧ 翻译起始部位互补的序列；它可通过与 ⟦1|mRNA⟧ ⟦1|杂交⟧阻断 ⟦1|30⟧S 小⟦1|亚基⟧对起始⟦1|密码子⟧的识别及与 SD 序列的结合，也可使靶 RNA 降解或⟦2|失活⟧，从而抑制翻译。"]]],[0,17,0,2,"操纵子（operon）",[[0,"⟦2|原核⟧基因⟦2|协同⟧表达与⟦2|调控⟧的功能单位，通常由共同启动子、操纵区和一个或多个结构基因组成，结构基因共同转录。调节基因的产物可控制其表达，但调节基因本身不一定属于操纵子。"]]],[0,17,0,3,"管家基因（house keeping gene）",[[0,"在个体的所有细胞中持续表达的基因；它们通常是细胞结构和代谢过程中必需的基因，且通常保持着相对较低的⟦2|甲基化⟧水平，能保持较高的表达量。"]]],[0,17,0,4,"组成型基因表达（constitutive gene expression）",[[0,"指基因在个体发育各⟦1|阶段⟧、多数细胞中持续表达，较少受⟦1|环境影响⟧，其产物为⟦2|基本⟧⟦1|生命活动⟧所必需。这些产物参与蛋白质合成、能量代谢及⟦1|细胞骨架⟧维持等⟦1|基本功能⟧。"]]],[0,17,0,5,"可调型表达（regulated expression）",[[0,"指基因表达随细胞⟦2|生理⟧状态、⟦1|发育阶段⟧和⟦2|环境⟧变化而⟦1|调整⟧。通过改变表达水平，细胞能应对内外变化，调节代谢、增殖和⟦1|分化⟧，维持正常⟦1|生理功能⟧及内⟦2|环境⟧稳定。"]]],[0,17,0,6,"乳糖操纵子模型（lac operon model）",[[0,"⟦2|原核⟧负控⟦1|诱导型⟧⟦2|调控⟧⟦1|模型⟧，含调节基因 ⟦1|lacI⟧、启动子、操纵区及 Z、Y、A 结构基因。无⟦1|乳糖⟧时，阻遏⟦1|蛋白⟧结合操纵区抑制转录；有⟦1|乳糖⟧时，别⟦1|乳糖⟧使其⟦2|失活⟧，⟦1|ZYA⟧ 表达以利用⟦1|乳糖⟧。"]]],[0,17,0,7,"色氨酸操纵子（Trp operon）",[[0,"色氨酸操纵子是⟦2|原核⟧生物⟦2|调控⟧⟦1|色氨酸⟧合成的⟦1|负控⟧阻遏型操纵子；其⟦2|调控⟧机制是：⟦1|色氨酸⟧充足时作为辅阻遏物激活阻遏⟦1|蛋白⟧并关闭转录，缺乏时阻遏⟦1|蛋白⟧⟦2|失活⟧而允许结构基因表达。"]]],[0,17,0,8,"分解代谢物阻遏（catabolite repression）",[[0,"分解代谢物阻遏是多种⟦1|碳源⟧并存时，微生物⟦1|优先⟧利用易分解⟦1|碳源⟧并抑制其他⟦1|碳源⟧利用酶合成的现象；其机制是⟦1|葡萄糖⟧可降低 ⟦1|cAMP⟧，使 ⟦1|cAMP-CAP⟧ 不足而难以激活相关操纵子。"]]],[0,17,0,9,"衰减作用（attenuation）/转录衰减（transcription attenuation）",[[0,"⟦2|原核⟧生物利用转录与翻译⟦2|偶联⟧精细调节转录的机制，常见于⟦1|氨基酸⟧合成操纵子。⟦1|氨基酸⟧充足时，⟦1|mRNA⟧ ⟦1|前导⟧区形成终止结构，使转录提前停止；不足时形成抗终止结构，转录继续。"]]],[0,17,0,10,"衰减子（attenuator）",[[0,"⟦2|原核⟧操纵子⟦1|前导⟧区内控制转录提前终止的序列，以色氨酸操纵子为⟦1|典型⟧。它借助⟦1|前导⟧ ⟦1|RNA⟧ 二级结构变化调节转录：⟦1|氨基酸⟧充足时形成终止结构；不足时阻止该结构形成，使转录继续。"]]],[0,17,0,11,"miRNA（micro RNA）",[[0,"又称微 RNA，是⟦2|真核⟧生物中一类⟦2|长度⟧约 ⟦1|20～25⟧ 个⟦1|核苷酸⟧的⟦1|内源性⟧非⟦2|编码⟧⟦1|单链⟧ RNA；它由⟦1|内源⟧基因⟦2|编码⟧，⟦2|前体⟧含有不完善的发夹结构，能识别多个⟦2|目标⟧，通常与⟦2|目标⟧ ⟦1|mRNA⟧ 的 ⟦1|3⟧’-⟦1|UTR⟧ 结合。"]]],[0,17,0,12,"基因工程（genetic engineering）",[[0,"又称 ⟦1|DNA⟧ ⟦2|重组技术⟧，通过基因⟦2|克隆⟧、⟦2|重组⟧和表达改造⟦1|遗传物质⟧。其⟦2|基本步骤⟧为获取目的基因、⟦1|限制酶⟧切割、⟦1|DNA⟧ 连接酶连接、转化或⟦1|转染受体⟧细胞，以及筛选、鉴定⟦2|重组⟧子。"]]],[0,17,0,13,"蛋白质工程（protein engineering）",[[0,"指通过对蛋白质已知结构与功能的认识，借助计算机辅助⟦2|设计⟧，利用基因⟦2|定位⟧诱变等技术改造蛋白质，以达到改进其某些⟦1|性能⟧的目的。"]]],[0,17,0,14,"质粒（plasmid）",[[0,"是⟦1|染色体⟧外自主复制的⟦1|遗传因子⟧，多为⟦1|共价闭⟧环 ⟦1|DNA⟧；在分布上，它存在于⟦1|细菌⟧、⟦1|古菌⟧及部分⟦2|真核⟧生物中，通常含有非必需的⟦2|遗传信息⟧，但可提供给⟦2|宿主⟧⟦1|细菌⟧一些额外的生存⟦1|优势⟧，例如⟦1|抗生素抗性⟧。"]]],[0,17,0,15,"聚合酶链式反应（Polymerase chain reaction，PCR）",[[0,"是一种⟦2|特异性⟧ ⟦1|DNA⟧ 片段的体外⟦1|快速酶⟧促扩增⟦2|技术⟧；其过程是以 ⟦1|DNA⟧ 为⟦2|模板⟧，⟦1|4⟧ 种 ⟦1|dNTP⟧ 为底物，通过⟦2|引物⟧结合、⟦1|DNA⟧ 聚合酶催化，经⟦2|变性⟧、⟦2|复性⟧、延伸三步⟦2|循环⟧反应，使目的 ⟦1|DNA⟧ 呈⟦1|指数⟧级⟦2|大量⟧扩增。"]]],[0,17,0,16,"反转录 PCR（RT-PCR）",[[0,"是将 ⟦1|RNA⟧ 的⟦1|逆转录⟧反应和 PCR 反应联合应用的一种⟦2|技术⟧；其过程是以 ⟦1|RNA⟧ 为⟦2|模板⟧，经⟦1|逆转录酶⟧作用合成 ⟦1|cDNA⟧，再以 ⟦1|cDNA⟧ 为⟦2|模板⟧通过 PCR 反应来扩增目的基因。"]]],[0,17,0,17,"基因敲除（Gene knockout）",[[0,"是利用同源重组等⟦2|技术⟧，使⟦2|基因组⟧中的特定基因⟦2|失活⟧的基因⟦1|编辑⟧⟦2|技术⟧；其特点是⟦2|特异性⟧强、⟦1|定点精准⟧。"]]],[0,17,0,18,"CRISPR-Cas",[[0,"⟦1|细菌⟧和⟦1|古菌抵抗⟧⟦2|外源遗传元件⟧的防御系统。其⟦1|基因座⟧含 CRISPR 序列和 ⟦1|cas⟧ 基因：⟦1|前者⟧由⟦1|前导⟧区、短重复及⟦1|间隔⟧序列组成；⟦2|后者编码⟧ Cas ⟦1|蛋白⟧，在向导 ⟦1|RNA⟧ 引导下识别、切割入侵⟦1|核酸⟧。"]]],[0,17,0,19,"原位杂交（in situ hybridization）",[[0,"是用⟦2|标记⟧的⟦1|核酸探针⟧（⟦1|DNA⟧ 或者 ⟦1|RNA⟧ ⟦1|探针⟧），经放射自显影或非放射⟦2|检测⟧⟦1|体系⟧，在组织、细胞及⟦1|染色体⟧水平上对⟦1|核酸⟧进行⟦2|定位⟧和相对⟦2|定量研究⟧的一种⟦1|手段⟧；其特点是⟦1|灵敏⟧、快速。"]]],[0,17,0,20,"表达载体（expression vector）",[[0,"在⟦1|克隆载体⟧⟦2|骨架⟧上增加启动子、⟦1|终止子⟧及必要的⟦1|增强子⟧等表达⟦2|元件⟧，使目的基因能在⟦2|宿主⟧中表达的⟦1|载体⟧。它可⟦2|驱动外源⟧基因转录、翻译，用于蛋白质表达、产物制备和⟦1|基因功能⟧验证。"]]],[0,17,0,21,"单核苷酸多态性（SNP）",[[0,"指⟦2|基因组⟧ ⟦1|DNA⟧ 上单个⟦1|碱基⟧的替换、插入或缺失引起的 ⟦1|DNA⟧ 序列⟦1|多态性⟧；其特点是分布广、数量多、⟦2|遗传稳定性⟧高，常发生在 ⟦1|CpG⟧ 二⟦1|核苷酸⟧上的⟦1|胞嘧啶残基⟧上。"]]],[0,17,1,1,"比较真核生物和原核生物转录水平调节的异同点。",[[0,"（1）⟦2|相同点⟧。"],[1,"①转录起始均需 ⟦1|RNA⟧ 聚合酶识别、结合启动子。"],[1,"②均有激活或⟦1|抑制性反式因子⟧结合特定 ⟦1|DNA⟧ 序列调节表达。"],[1,"③⟦2|环境信号⟧均可影响转录调节。"],[0,"（2）⟦2|不同点⟧。"],[1,"①原核常有操纵子：启动子、操纵区和结构基因共同构成⟦2|调控⟧单位，受调节基因产物控制；真核通常无操纵子。"],[1,"②真核可通过 ⟦1|DNA⟧ ⟦1|重排⟧或基因扩增调节，原核⟦1|少见⟧。"],[1,"③原核调节区短，⟦2|调控⟧⟦1|蛋白⟧直接影响聚合酶结合；真核调节⟦1|区广⟧，常借⟦2|染色质⟧和 ⟦1|DNA⟧ 构象变化⟦1|远距离⟧⟦2|调控⟧。"],[1,"④原核转录、翻译⟦2|偶联⟧，⟦2|调控⟧多集中于转录；真核⟦2|二者⟧⟦1|时空⟧分隔，⟦2|调控⟧层次更多。"],[1,"⑤原核常以阻遏物负⟦2|调控⟧，⟦2|效应⟧物多⟦1|别构调节⟧；真核常以⟦1|激活物⟧正⟦2|调控⟧，并受⟦2|共价⟧修饰等控制。"],[1,"⑥原核⟦2|元件⟧多集中于操纵子；真核除启动子外还有⟦1|增强子⟧、⟦1|沉默子⟧、⟦1|绝缘子⟧等。"]]],[0,17,1,2,"说明分解代谢物阻遏的原理。",[[0,"（1）指⟦1|葡萄糖⟧抑制其他⟦1|碳源分解酶⟧的合成。如⟦1|葡萄糖⟧、⟦1|乳糖⟧并存时先利用⟦1|葡萄糖⟧，耗尽后才⟦2|诱导⟧ ⟦1|lac⟧ 酶系利用⟦1|乳糖⟧。"],[0,"（2）原理。"],[1,"⟦1|CAP⟧ 与 ⟦1|cAMP⟧ 结合后才能结合启动子上游，帮助 ⟦1|RNA⟧ 聚合酶起始转录。"],[1,"⟦1|葡萄糖⟧使⟦1|腺苷酸环化酶⟧⟦2|活性⟧⟦1|和胞⟧内 ⟦1|cAMP⟧ 降低，⟦1|CAP⟧ 难以⟦2|活化⟧，⟦1|RNA⟧ 聚合酶难以高效起始转录，因而产生阻遏。"]]],[0,17,1,3,"简述 Trp 操纵子的阻遏系统。",[[0,"（1）阻遏⟦1|系统控制⟧转录是否起始，是 ⟦1|trp⟧ 操纵子的⟦1|粗调⟧开关。"],[1,"①Trp 充足时作为辅阻遏物结合阻遏⟦1|蛋白⟧，使其结合操纵区，关闭结构基因，避免继续合成 Trp。"],[1,"②Trp 不足时阻遏⟦1|蛋白⟧⟦2|失活⟧并离开操纵区，结构基因转录，合成 Trp 所⟦1|需酶⟧。"],[0,"（2）⟦1|弱化⟧作用负责⟦1|细调⟧。"],[1,"⟦1|前导⟧区含⟦1|弱化⟧子和连续 Trp ⟦1|密码⟧。⟦1|色氨酰⟧-⟦1|tRNA⟧ 不足时⟦1|核糖体⟧停顿，转录继续；充足时形成终止结构，提前终止。"],[1,"Trp 低时，⟦1|区段⟧ ⟦1|2⟧ 与 ⟦1|3⟧ 配对，阻止 ⟦1|3-4⟧ 终止⟦1|发夹⟧形成；Trp 高时，⟦1|核糖体⟧通过⟦1|区段⟧ ⟦1|1⟧ 并占据⟦1|区段⟧ ⟦1|2⟧，⟦1|区段⟧ ⟦1|3⟧ 与⟦1|4⟧ 配对，转录终止。"]]],[0,17,1,4,"为什么原核生物以负调控为主，而真核生物以正调控更为常见？",[[0,"正调控由激活蛋白促进转录；⟦2|诱导⟧物可使其⟦2|活化⟧，抑制物可使其⟦2|失活⟧。"],[0,"负调控由阻遏⟦1|蛋白⟧关闭转录；⟦2|诱导⟧⟦1|物使⟧阻遏⟦1|蛋白⟧⟦2|失活⟧，辅阻遏物使其⟦2|活化⟧并结合操纵区。"],[0,"原核以负调控为主的原因如下。"],[0,"原核 ⟦1|DNA⟧ 较裸露，较易转录，用阻遏物关闭基因⟦1|经济⟧、迅速；短时⟦1|失控⟧常表现为物质⟦1|浪费⟧。"],[0,"真核以正调控为主的原因如下。"],[0,"⟦2|真核⟧ ⟦1|DNA⟧ 包装成⟦2|染色质⟧，许多基因默认关闭，需⟦1|激活物⟧及多种顺、⟦1|反式因子启动⟧，便于⟦1|发育⟧、⟦1|分化⟧中的组合调节。"]]],[0,17,1,5,"请简要描述乳糖操纵子的基本元件及相互作用的过程。",[[0,"（1）基本元件：I ⟦2|编码⟧阻遏⟦1|蛋白⟧；P 结合 ⟦1|RNA⟧ 聚合酶；O 结合阻遏⟦1|蛋白⟧；Z、Y、A 分别⟦2|编码⟧⟦1|β-⟧半乳⟦1|糖苷酶⟧、透性酶和转⟦1|乙酰酶⟧。"],[0,"（2）相互作用。"],[1,"无乳糖时 ⟦1|LacI⟧ 结合 O，阻碍转录；有乳糖⟦1|时别⟧乳糖使 ⟦1|LacI⟧ 离开 O，⟦1|RNA⟧ 聚合酶转录 ⟦1|ZYA⟧。"],[0,"（3）分解代谢物阻遏。"],[1,"相关元件为 ⟦1|CAP⟧、⟦1|cAMP⟧、⟦1|CAP⟧ ⟦1|位点⟧、P 和 ⟦1|ZYA⟧。"],[1,"⟦1|葡萄糖⟧低时 ⟦1|cAMP-CAP⟧ 结合上游，帮助 ⟦1|RNA⟧ 聚合酶并增强转录；⟦1|葡萄糖⟧高时 ⟦1|cAMP⟧ 下降，⟦1|CAP⟧ ⟦2|失活⟧，⟦1|lac⟧ 转录降低。"]]],[0,17,1,6,"请比较 miRNA 和 siRNA 的异同点以及它们各自的分子作用机制。",[[0,"（1）⟦2|不同点⟧。"],[1,"①miRNA 通常由⟦1|内源⟧基因产生；siRNA 多由长⟦1|双链⟧ ⟦1|RNA⟧ 形成，可源于⟦2|外源⟧或⟦1|内源⟧序列。"],[1,"②成熟 miRNA、siRNA 均以⟦1|单链⟧向导起效，但⟦2|前体⟧分别多为⟦1|发夹⟧ ⟦1|RNA⟧ 和长⟦1|双链⟧ ⟦1|RNA⟧。"],[1,"③⟦1|Dicer⟧ ⟦2|加工⟧⟦1|发夹⟧⟦2|前体⟧产生 miRNA ⟦1|双链⟧；⟦2|加工⟧长⟦1|双链⟧ ⟦1|RNA⟧ 可产生多段 siRNA ⟦1|双链⟧。"],[1,"④miRNA 多结合靶 ⟦1|mRNA 3⟧′⟦1|UTR⟧；siRNA 可⟦1|靶向⟧与其⟦1|高度⟧互补的任意区域。"],[1,"⑤miRNA 多通过不完全配对抑制翻译或促降解；siRNA 多完全配对并切割 ⟦1|mRNA⟧，也⟦1|可抑制⟧翻译或⟦2|诱导染色质⟧沉默。"],[1,"⑥miRNA 广泛调节⟦1|发育⟧和⟦1|内源⟧表达；siRNA 常参与⟦1|抗病毒⟧、抑制⟦1|转座子⟧及⟦1|实验性⟧沉默。"],[0,"（2）⟦2|相同点⟧。"],[1,"①⟦2|长度⟧多约 ⟦1|20～25⟧ nt。"],[1,"②均可由 ⟦1|Dicer⟧ ⟦2|加工⟧。"],[1,"③均需 ⟦1|Argonaute⟧ ⟦1|蛋白⟧。"],[1,"④均装入 ⟦1|RISC⟧ 并介导序列⟦2|特异性⟧沉默，功能可重叠。"],[0,"（3）siRNA：长⟦1|双链⟧ ⟦1|RNA⟧ 经 ⟦1|Dicer⟧ 切割，⟦1|向导链⟧装入 ⟦1|RISC⟧，与靶 ⟦1|mRNA⟧ 配对并促其切割或抑制翻译。"],[0,"（4）miRNA：⟦1|pri-miRNA⟧ ⟦1|经核⟧内和⟦2|胞质加工⟧，⟦1|向导链⟧装入 ⟦1|RISC⟧，通常与靶 ⟦1|mRNA 3⟧′⟦1|UTR⟧ 部分配对，抑制翻译或促降解。"]]],[0,17,1,7,"PCR 技术（PCR 的基本原理）？简要介绍 PCR 技术的应用和发展。",[[0,"（1）PCR 以 ⟦1|DNA⟧ ⟦2|变性⟧、⟦2|引物⟧退火和聚合酶延伸⟦2|循环⟧扩增靶序列。"],[1,"①基本原理是 ⟦1|DNA⟧ 热⟦2|变性⟧、⟦2|复性⟧及复制。"],[2,"a.⟦1|高温⟧使靶⟦1|双链⟧ ⟦1|DNA⟧ 变为⟦1|单链⟧。"],[2,"b.⟦1|降温⟧至约 ⟦1|37～65⟧℃，两条⟦2|引物⟧分别与⟦2|模板⟧互补区退火。"],[2,"c.约 ⟦1|72⟧℃时 ⟦1|Taq⟧ 酶从⟦2|引物⟧ ⟦1|3⟧′端按 ⟦1|5⟧′→⟦1|3⟧′延伸⟦1|新链⟧。"],[2,"d.反复⟦2|循环⟧时前一轮产物成为⟦2|模板⟧，⟦1|理想⟧情况下靶片段按 ⟦1|2⟧ⁿ扩增。"],[0,"（2）应用。"],[1,"①合成、扩增基因或制备⟦1|探针⟧。"],[1,"②⟦2|检测⟧⟦1|病原核酸⟧，进行 ⟦1|DNA⟧ ⟦1|指纹⟧和⟦1|法医鉴定⟧。"],[1,"③⟦1|RT-PCR⟧ 先把 ⟦1|RNA⟧ ⟦1|逆转录⟧成 ⟦1|cDNA⟧，再⟦2|检测⟧转录水平。"],[1,"④用于⟦1|定点诱变⟧和突变⟦2|分析⟧。"],[1,"⑤重叠延伸 PCR 可连接不同 ⟦1|DNA⟧ 片段。"],[1,"⑥扩增未知片段通常须⟦1|先知⟧两端序列以⟦2|设计引物⟧。"],[1,"⑦随机⟦2|引物⟧ PCR 可比较⟦2|基因组差异⟧。"],[1,"⑧扩增 ⟦1|CRISPR⟧ ⟦1|编辑⟧区和疑似脱靶⟦1|位点⟧并⟦1|测序⟧，⟦1|检查编辑⟧及脱靶。"],[0,"（3）发展出实时⟦2|定量⟧ PCR、多重 PCR、⟦1|RT-PCR⟧ 和⟦1|数字⟧ PCR；⟦1|数字⟧ PCR 可绝对⟦2|定量⟧且更⟦1|耐抑制剂⟧。"]]],[0,17,1,8,"阐述基因敲除技术 CRISPR—Cas9 的原理及其应用。",[[0,"（1）原理。"],[1,"⟦1|CRISPR-Cas9⟧ 含向导 ⟦1|RNA⟧ 和 Cas9 ⟦1|核酸酶⟧；⟦1|实验⟧常将 ⟦1|crRNA⟧ 与 ⟦1|tracrRNA⟧ ⟦1|融合⟧为单向导 ⟦1|RNA⟧。Cas9 识别 ⟦1|PAM⟧，向导 ⟦1|RNA⟧ 与邻近靶序列配对，引导 Cas9 在 ⟦1|PAM⟧ 上游约 ⟦1|3⟧ bp 处切断⟦1|双链⟧。无⟦2|供体⟧时，⟦1|NHEJ⟧ 修复常产生插入或缺失，使基因⟦2|失活⟧；有⟦2|供体⟧时，可经⟦1|同源定向⟧修复⟦1|定点⟧改写。"],[0,"（2）应用。"],[1,"①在细胞和⟦1|模式⟧生物中敲除或改写基因，⟦2|研究⟧⟦1|基因功能⟧。"],[1,"②用于部分⟦2|遗传病⟧、⟦1|血液病⟧和⟦1|肿瘤⟧的基础⟦2|研究⟧及治疗探索。"],[1,"③改良⟦1|作物⟧和动物的⟦1|产量⟧、⟦1|抗病性⟧等⟦1|性状⟧。"]]],[1,1,0,1,"nonessential amino acid（非必需氨基酸）",[[0,"人体能自行合成、通常无须由⟦2|食物⟧额外⟦2|供给⟧的⟦1|氨基酸⟧；例如，常见者有 ⟦1|Glu⟧、⟦1|Ala⟧、⟦1|Gly⟧ 和 ⟦1|Asp⟧ 等。"]]],[1,1,0,2,"蛋白质的等电点",[[0,"蛋白质净⟦2|电荷⟧为 ⟦1|0⟧ 时的 pH；因此，在 pI 处蛋白质间净电斥力最小、⟦1|溶解度⟧最低，易聚集沉淀，可据此分离。"]]],[1,1,0,3,"氨基酸残基（amino-acid residue）",[[0,"⟦1|氨基酸⟧形成⟦1|肽键⟧并脱水后，留在⟦1|多肽链⟧中的⟦1|结构单元⟧。⟦1|残基⟧以⟦1|肽键⟧相连，其排列⟦1|顺序⟧及侧⟦1|链间⟧相互作用影响蛋白质的结构与功能。"]]],[1,1,0,4,"肽（peptides）",[[0,"⟦1|氨基酸⟧的⟦1|α-氨基⟧与⟦1|α-羧基⟧脱水，以⟦1|肽键⟧连接形成的聚合物；从分子⟦1|尺度⟧看，通常是蛋白质片段，相对分子⟦1|质量⟧介于⟦1|氨基酸⟧与蛋白质之间。"]]],[1,1,0,5,"胰岛素（insulin）",[[0,"⟦1|胰腺⟧β细胞分泌、由 ⟦1|51⟧ 个氨基酸残基组成的⟦1|激素⟧；在⟦1|生理功能⟧上，它是机体内唯一⟦1|降血糖⟧的⟦1|激素⟧，可促进⟦1|葡萄糖⟧摄取利用，并抑制⟦1|糖原分解⟧和⟦2|糖异生⟧。"]]],[1,1,0,6,"质谱（mass spectrometry， MS）",[[0,"通过⟦1|测量⟧⟦2|离子⟧⟦1|质荷⟧比⟦2|分析⟧物质组成与结构的⟦2|技术⟧；⟦1|实际⟧应用中，用于蛋白质⟦1|测序⟧、⟦1|多肽⟧和⟦2|代谢物⟧鉴定，以及分子相互作用⟦2|研究⟧。"]]],[1,1,0,7,"纤维蛋白（fibrous proteins）",[[0,"⟦1|多肽链⟧呈⟦1|长线⟧、片层、⟦1|纤维⟧或细⟦1|棒状⟧的结构⟦1|蛋白⟧；功能上，它可为组织提供⟦2|强度⟧或⟦1|柔性⟧，承担支撑、⟦1|定形⟧和外保护作用。"]]],[1,1,0,8,"脂锚定蛋白质（Lipid-anchored protein）",[[0,"通过⟦2|共价⟧连接⟦2|脂质⟧而⟦1|锚定⟧在⟦1|细胞膜⟧上的⟦1|膜蛋白⟧，⟦2|脂质⟧部分将其固定于脂⟦1|双层⟧。它参与⟦2|信号⟧传递、细胞黏附和细胞内⟦2|运输⟧。"]]],[1,1,0,9,"蛋白质复性（renaturation）",[[0,"除去⟦2|变性⟧因素后，变性蛋白可能恢复天然⟦1|构象⟧的过程；⟦2|复性⟧时，⟦1|前提⟧是一级结构完整；⟦1|次级键⟧重新形成后，可重建天然⟦1|构象⟧并恢复⟦2|活性⟧。"]]],[1,1,0,10,"β-转角（β-turn）",[[0,"通常由 ⟦1|4⟧ 个连续⟦1|残基⟧构成、使⟦1|多肽主链⟧约 ⟦1|180⟧°回折的二级结构；结构上，第 ⟦1|1⟧ 个⟦1|残基⟧ C=O 与第 ⟦1|4⟧ 个⟦1|残基⟧ ⟦1|N-H⟧形成⟦1|氢键⟧，⟦1|Gly⟧ 和 ⟦1|Pro⟧ 出现⟦1|频率⟧较高。"]]],[1,1,0,11,"二面角（dihedral angle）",[[0,"⟦1|多肽主链⟧绕 ⟦1|Cα-N⟧ 旋转的⟦1|角为⟧φ，绕 ⟦1|Cα-C⟧ 旋转的⟦1|角为⟧ψ，合称 ⟦1|Cα⟧二面角。⟦2|二者⟧决定相邻肽单位的相对位置，是形成蛋白质⟦1|构象⟧的基础。"]]],[1,1,0,12,"无规卷曲（random coil）",[[0,"不能归入⟦1|α-⟧⟦2|螺旋⟧、⟦1|β-⟧折叠等⟦1|规则⟧类型的二级结构片段；需要注意的是，较松散、不规则，但并非随意或完全⟦1|无序⟧，仍可具有明确而稳定的⟦1|构象⟧。"]]],[1,1,0,13,"肌红蛋白（ [0,"水中疏水分子或非⟦2|极性⟧基团倾向相互聚集的弱非⟦2|共价⟧作用；在生物⟦1|体系⟧中，这是熵⟦2|驱动⟧的自发过程，是稳定生物大分子三维结构的重要⟦1|力量⟧。"]]],[1,1,0,29,"盐键（ionic interaction）",[[0,"带电基团之间的静电作用，又称⟦2|离子⟧相互作用或⟦1|盐桥⟧；具体而言，⟦1|异号⟧相吸、同号相斥；非⟦2|极性环境⟧可增强，⟦1|盐浓度⟧升高可减弱。"]]],[1,1,0,30,"旋光异构",[[0,"由分子手性引起、能使⟦1|平面偏振光⟧旋转的⟦1|立体异构⟧；这类⟦1|异构体⟧中，一对⟦1|异构体⟧互为⟦1|镜像⟧且不能叠合，通常具有方向相反的⟦1|旋光性⟧。"]]],[1,1,0,31,"固相肽合成（Solid phase peptide synthesis，SPPS）",[[0,"把首个⟦1|氨基酸⟧ C 端固定在不⟦1|溶性树脂⟧上，使⟦1|肽链⟧由 C 端向 N 端逐步延长的合成法；合成时，每轮先保护⟦1|氨基⟧、完成缩合再脱保护；合成⟦1|后酸⟧解释放⟦1|肽链⟧并去除⟦1|侧链⟧保护基。"]]],[1,1,0,32,"蛋白质家族（protein family）",[[0,"由共同⟦1|祖先⟧基因进化而来，在序列、结构或功能上相似的一组蛋白质；因此，成员通常有较高序列相似性；有时也可凭少数关键功能⟦1|残基⟧的保守性归类。"]]],[1,1,0,33,"同源物（homologue）",[[0,"由共同⟦1|祖先⟧基因进化而来、序列和结构相似的基因或蛋白质。其功能往往相似，序列比较可用于⟦1|预测⟧未知⟦1|蛋白⟧功能和构建⟦1|进化树⟧。"]]],[1,1,0,34,"酸性氨基酸（Acidic amino acid）",[[0,"⟦1|侧链⟧含⟦1|羧基⟧、在⟦2|生理⟧ pH 下解离带⟦2|负电⟧的⟦1|氨基酸⟧，主要为⟦1|天冬氨酸⟧和⟦1|谷氨酸⟧。其⟦1|侧链⟧可参与⟦1|静电⟧相互作用和酶催化，影响蛋白质结构与性质。"]]],[1,1,0,35,"蛋白质水解",[[0,"蛋白质在酸、碱或酶作用下断裂⟦1|肽键⟧，⟦1|生成肽⟧或⟦1|氨基酸⟧的过程，会破坏一级结构。它参与消化吸收和蛋白质更新，也用于体外结构⟦2|分析⟧。"]]],[1,1,0,36,"胶原（蛋白）（collagen）",[[0,"动物结缔组织中⟦2|含量⟧丰富的一类⟦1|糖蛋白⟧和⟦1|纤维状⟧结构蛋白；功能上，它可为腱、骨、⟦1|软骨⟧、牙、⟦1|皮肤⟧和⟦1|血管⟧等组织提供⟦1|机械⟧⟦2|强度⟧。"]]],[1,1,0,37,"凝胶电泳",[[0,"以多孔⟦2|凝胶⟧为支持⟦1|介质⟧的⟦1|电泳技术⟧；分离时，分子因大小、⟦1|构象⟧和⟦2|电荷⟧不同，在⟦2|凝胶⟧⟦1|网孔⟧中受阻程度及迁移速度不同，因而形成⟦1|区带⟧。"]]],[1,1,1,1,"论述蛋白质缔合成四级结构在结构和功能上的优越性/意义。",[[0,"（1）四级结构：两条及以上具有三级结构的⟦1|亚基⟧，以疏水作用、⟦1|氢键⟧、盐键等组装；包括⟦1|亚基⟧的种类、数量、排布及相互作用。"],[0,"（2）结构和功能上的优越性。"],[1,"①⟦1|亚基⟧缔合降低⟦1|表面积⟧/⟦1|体积⟧比，增强结构⟦2|稳定性⟧。"],[1,"②用较短基因⟦2|编码⟧可重复装配的⟦1|亚基⟧，提高⟦2|遗传⟧⟦1|经济性⟧和效率。"],[1,"③不同⟦1|亚基⟧的催化基团可组成完整⟦2|活性部位⟧，也可分别催化相关反应。"],[1,"④一个部位结合⟦2|配体⟧可影响其他部位的结合或催化，产生⟦2|协同⟧和⟦1|别构效应⟧。"],[1,"⑤由较短⟦1|亚基⟧组装，可减少翻译⟦1|长链⟧时出错的⟦1|机会⟧。"],[1,"⑥⟦1|亚基⟧间作用便于⟦1|调节酶⟧⟦2|活性⟧。"],[1,"⑦多个⟦1|亚基⟧便于⟦1|装配成⟧更大的结构。"],[1,"⑧改变⟦1|亚基⟧组成或排布可改变蛋白质功能⟦2|特异性⟧。"]]],[1,1,1,2,"简述蛋白质三维结构的特点。",[[0,"①蛋白质三维结构由⟦1|氨基酸⟧序列决定。"],[0,"②蛋白质功能由其三维结构决定。"],[0,"③多数分离⟦1|蛋白⟧只采取一种或少数几种稳定⟦1|构象⟧。"],[0,"④特定三维结构主要由非⟦2|共价⟧作用稳定。"],[0,"⑤不同蛋白质的结构具有某些共同⟦1|规律⟧。"],[0,"⑥蛋白质结构具有⟦1|动态性⟧，并非静止不变。"]]],[1,1,1,3,"为什么说烫发是一个“生化工程”？",[[0,"①烫发通过⟦2|化学⟧和⟦1|物理⟧处理改变⟦1|头发α-角蛋白⟧的结构与⟦1|形状⟧，因此属于生化过程。"],[0,"②⟦1|还原剂 H>pI 时蛋白质带⟦2|负电⟧，与⟦1|重金属⟧⟦2|离子⟧形成不⟦1|溶性⟧盐。"],[1,"④⟦1|生物碱试剂⟧或⟦1|某些酸⟧沉淀：pH<pI 时蛋白质带⟦1|正电⟧，与⟦1|酸根阴离子⟧形成不⟦1|溶性⟧盐。"],[1,"⑤加热⟦2|变性⟧沉淀：热使⟦1|构象解体⟧、疏⟦1|水基⟧暴露并削弱⟦1|水化⟧作用；在 pI 处⟦2|电荷⟧保护最弱，更易沉淀。"],[1,"⑥⟦1|等电点⟧沉淀：pH=pI 时净⟦2|电荷⟧为 ⟦1|0⟧、⟦1|同号⟧电斥力⟦1|消失⟧，⟦1|胶体⟧⟦2|稳定性⟧降低而聚集。"]]],[1,1,1,8,"叙述蛋白质的功能多样性。",[[0,"①催化与转化：酶催化细胞内的⟦1|生化⟧反应。"],[0,"②⟦2|信号⟧与转导：蛋白质可作⟦2|信号⟧分子或⟦1|受体⟧，如⟦1|胰岛素⟧与⟦1|受体⟧作用后降低⟦1|血糖⟧。"],[0,"③物质⟦2|运输⟧：如 Hb ⟦2|运输⟧ ⟦1|O₂⟧，转铁蛋白⟦2|运输⟧ Fe。"],[0,"④结构支撑：为细胞和机体提供结构，如⟦1|胶原⟧支撑结缔组织。"],[0,"⑤⟦1|运动⟧与⟦1|动力⟧：⟦1|肌动蛋白⟧和⟦1|肌球蛋白⟧相互⟦1|滑动⟧，参与⟦2|肌肉⟧收缩与⟦1|运动⟧。"],[0,"⑥防卫、保护和免疫：如⟦1|毒素⟧、⟦1|凝血因子⟧及参与⟦1|体液⟧免疫的⟦2|抗体⟧。"],[0,"⑦⟦1|营养⟧贮存：如卵清⟦1|蛋白⟧为⟦1|鸟类胚胎发育⟧提供⟦1|氮源⟧。"],[0,"⑧⟦1|支架⟧与衔接：⟦1|支架蛋白⟧连接并组织多种分子。"],[0,"⑨调节：调节其他⟦1|蛋白⟧功能或基因表达，如周期⟦1|蛋白⟧调节周期⟦1|蛋白依赖性激酶⟧。"],[0,"⑩特殊功能：如应⟦1|乐果⟧甜⟦1|蛋白⟧具有很高⟦1|甜度⟧，可作天然⟦1|甜味剂⟧。"]]],[1,1,1,9,"举例说明协同效应的生物学意义。",[[0,"（1）正⟦2|协同⟧：S 形⟦2|曲线⟧⟦1|中段⟧对底物浓度敏感，便于⟦1|灵敏⟧调节速率；高、⟦1|低浓度平台⟧区可缓冲⟦1|过度波动⟧。"],[0,"例：Hb 首个⟦1|亚基⟧结合 ⟦1|O₂⟧后破坏部分盐键并触发构象变化，使其余⟦1|亚基⟧氧⟦2|亲和力⟧升高，快速结合 ⟦1|4⟧ 个 ⟦1|O₂⟧。"],[0,"（2）负⟦2|协同⟧：使一定底物浓度范围内的速率较稳定，减少其他反应的干扰，维持代谢稳定。"],[0,"例：⟦1|四聚体⟧ ⟦1|3⟧-⟦1|磷酸甘油⟧醛⟦1|脱氢酶⟧先结合 ⟦1|2⟧ 个 ⟦1|NAD⁺⟧ 后⟦1|构象⟧改变，使第 ⟦1|3⟧、⟦1|4⟧ 个 ⟦1|NAD⁺⟧ 更难结合。"]]],[1,1,1,10,"20 个氨基酸残基的共同结构特点是什么？画出这一共同结构式以及氨基酸形成肽链的方式（侧链用 R表示即可）。",[[0,"（1）共同结构：同一个⟦2|中心⟧⟦1|α-C⟧ 连接⟦1|氨基⟧、⟦1|羧基⟧、H 和 R 基。"],[0,"（2）⟦1|通式⟧：⟦1|H₂N-CH⟧(R)-⟦1|COOH⟧。"],[0,"（3）⟦1|成肽⟧：一个氨基酸的⟦1|α-羧基⟧与另一氨基酸的⟦1|α-氨基⟧脱水，形成-⟦1|CO-NH-肽键⟧并延长肽链。"]]],[1,1,1,11,"氨基酸常用的层析方法有哪些？（最少写 3 种）",[[0,"①纸层析：⟦1|滤纸⟧吸附的水为固定相，⟦1|有机溶剂⟧为⟦1|流动⟧相；氨基酸按⟦1|分配系数⟧差异分离。"],[0,"②⟦1|薄层⟧层析：⟦1|吸附剂薄层⟧为固定相，不同⟦2|极性⟧的⟦1|有机溶剂⟧为⟦1|流动⟧相；⟦1|点样⟧后在密闭层析缸中展开。"],[0,"③离子交换层析：氨基酸按不同 pH 下的⟦2|电荷差异⟧与⟦1|树脂⟧结合；改变洗脱液 pH 或⟦2|离子强度⟧，使其依次洗脱。"],[0,"④⟦1|HPLC⟧：⟦1|高压泵⟧将⟦1|溶剂⟧或⟦1|缓冲液⟧等⟦1|流动⟧相送入含固定相的⟦1|色谱⟧柱，分离氨基酸。"],[0,"⑤⟦1|分配柱层析⟧：支持剂结合的水为固定相，与之不⟦1|互溶⟧的⟦1|溶剂⟧为⟦1|流动⟧相；⟦2|组分⟧按⟦1|分配系数⟧⟦2|差异⟧下移，⟦1|分段⟧收集。"]]],[1,1,1,12,"简述α-螺旋和β-折叠结构的特点及两者结构的异同点？",[[0,"（1）⟦1|α-⟧螺旋：多为⟦1|右手棒状⟧螺旋，⟦1|主链⟧在内、R ⟦1|基向⟧外；每个⟦1|残基轴向⟧上升 ⟦1|0.15⟧ nm 并旋转 ⟦1|100⟧°，⟦1|每圈3.6⟧ 个⟦1|残基⟧、⟦1|螺距⟧ ⟦1|0.54⟧ nm；链内 i→⟦1|i+4⟧ ⟦1|氢键⟧近乎⟦1|平行⟧螺旋轴，构成 ⟦1|13⟧ 原子环，⟦1|故称⟧ ⟦1|3.6⟧₁₃螺旋。"],[0,"（2）⟦1|β-⟧折叠：⟦1|主链⟧伸展⟦1|成片⟧层，R 基交替位于上下两侧；相邻⟦1|残基轴距⟧约 ⟦1|0.35⟧ nm，⟦1|邻链⟧ ⟦1|N-H⟧ 与 C=O 形成近乎垂直⟦1|链轴⟧的⟦1|氢键⟧，可为⟦1|平行⟧或反⟦1|平行⟧式。"],[0,"（3）⟦2|二者⟧的异同。"],[1,"⟦1|1⟧）⟦2|相同点⟧：均为常见、⟦1|周期性⟧的二级结构，主要由⟦1|氢键⟧稳定，几乎所有⟦1|肽键⟧都参与⟦1|成键⟧。"],[1,"⟦1|2⟧）⟦2|不同点⟧。"],[2,"①形态不同：⟦1|α-⟧螺旋是肽⟦1|平面⟧绕 ⟦1|Cα⟧盘旋的⟦1|右手⟧螺旋，R ⟦1|基向⟧外；⟦1|β-⟧折叠是⟦1|主链锯齿状⟧伸展，R 基交替位于片层上下。"],[2,"②⟦1|氢键⟧位置不同：⟦1|α-⟧螺旋由链内 ⟦1|N-H⟧ 与 C=O ⟦1|成键⟧；⟦1|β-⟧折叠主要由相邻⟦1|肽链⟧或肽段的 ⟦1|N-H⟧ 与 C=O ⟦1|成键⟧。"],[2,"③⟦1|α-⟧螺旋具有⟦1|手性⟧和⟦1|旋光性⟧；⟦1|β-⟧折叠可分⟦1|平行⟧与反⟦1|平行⟧式。"]]],[1,1,1,13,"比较蛋白质α-螺旋中的氢键和 DNA 双螺旋中的氢键，并指出氢键在稳定这两种结构中的作用。",[[0,"①⟦1|α-⟧螺旋：同一⟦1|肽链⟧第 i 个 C=O 与第 ⟦1|i+4⟧ 个 ⟦1|N-H⟧ 形成氢键，连接相邻⟦1|螺圈⟧，是稳定⟦1|α-⟧螺旋的重要⟦1|作用力⟧。"],[0,"②DNA 双螺旋：⟦1|两条链⟧的互补⟦1|碱基⟧形成氢键，⟦1|A-T⟧ 有 ⟦1|2⟧ 个、⟦1|G-C⟧ 有 ⟦1|3⟧ 个；氢键保证⟦1|碱基配对⟧的⟦2|特异性⟧，碱基堆积则是稳定双螺旋的主要⟦1|作用力⟧之一。"]]],[1,1,1,14,"关于血红蛋白中婴儿中γ链取代成人的β链，143 位由 His 变为 Ser 的意义、为什么 BPG 和成人结合得紧密？",[[0,"①成人 ⟦1|HbA⟧ 为⟦1|α₂β₂⟧，BPG 结合在两条β链之间；BPG 与⟦1|正电残基⟧形成盐键，稳定 T 态并降低 ⟦1|O₂⟧⟦2|亲和力⟧。"],[0,"②⟦1|胎儿⟧ ⟦1|HbF⟧ 为⟦1|α₂γ₂⟧，γ链第 ⟦1|143⟧ 位 Ser 取代成人β链第 ⟦1|143⟧ 位 His，使 BPG 结合⟦1|位点⟧的⟦1|正电荷⟧减少，对 BPG⟦2|亲和力⟧降低。"],[0,"③因此 ⟦1|HbF⟧ 对 ⟦1|O₂⟧的⟦2|亲和力⟧高于 ⟦1|HbA⟧，有利于⟦1|胎儿⟧从⟦1|母体血液⟧中获得 ⟦1|O₂⟧。"]]],[1,1,1,15,"简述离子交换层析的原理。",[[0,"离子交换层析利用不同⟦2|组分⟧与带电⟦1|树脂⟧的结合⟦2|强度⟧差异分离，改变 pH 或⟦2|离子强度⟧可依次洗脱。给定条件下，⟦1|正电荷⟧越多，通常越易结合⟦1|阳离子⟧交换柱；⟦1|负电荷⟧越多，通常越易结合⟦1|阴离子⟧交换柱。"]]],[1,1,1,16,"研究蛋白质分离纯化时，有关等电点的技术有哪些？",[[0,"①等电点沉淀：调 pH 至⟦2|目标⟧⟦1|蛋白⟧ pI，使净⟦2|电荷⟧为 ⟦1|0⟧、⟦1|溶解度⟧降低而沉淀，与其他 pI 的⟦1|蛋白⟧分离。"],[0,"②等电聚焦：在 pH ⟦2|梯度⟧中⟦1|电泳⟧，使不同⟦1|蛋白⟧在 pH=pI 处停止并形成不同⟦1|条带⟧。"],[0,"③⟦1|双向电泳⟧：先 ⟦1|IEF⟧ 按 pI 分离，再 ⟦1|SDS-PAGE⟧ 按⟦1|分子量⟧分离；⟦1|图谱⟧横向反映 pI、纵向反映⟦1|分子量⟧。"],[0,"④离子交换层析：给定 pH 下，蛋白质净⟦2|电荷⟧不同，与相反⟦2|电荷⟧固定相的结合⟦2|强度⟧不同，据此分离。"]]],[1,1,1,17,"请简要说明 Western blot 的原理、流程及用途。",[[0,"（1）Western blot 即蛋白质免疫⟦1|印迹⟧：⟦1|电泳分离⟧、⟦1|转膜⟧后，用特异⟦2|抗体检测⟧；可判断⟦2|目标⟧⟦1|蛋白⟧是否存在、相对丰度及近似⟦1|分子量⟧，⟦1|灵敏⟧且简便。"],[0,"（2）⟦1|实验⟧⟦2|步骤⟧。"],[1,"①⟦1|凝胶电泳⟧分离⟦1|蛋白⟧，⟦1|电转移⟧至⟦1|硝酸纤维素⟧膜等固相⟦1|支持物⟧，再用非特异⟦1|蛋白⟧封闭。"],[1,"②洗去⟦1|封闭液⟧，加入一抗，特异结合⟦2|目标⟧⟦1|蛋白⟧的⟦1|抗原⟧决定簇。"],[1,"③洗去未结合一抗，加入 ⟦1|HRP⟧ 或⟦1|碱性磷酸酶⟧⟦2|标记⟧的二抗；洗涤后加底物⟦2|检测信号⟧。"],[0,"（3）⟦1|主要用途⟧。"],[1,"①比较不同⟦2|样品⟧中⟦2|目标⟧⟦1|蛋白⟧的表达量。"],[1,"②依据 ⟦1|SDS-PAGE⟧ ⟦1|迁移率⟧估算⟦2|目标⟧⟦1|蛋白分子量⟧。"],[1,"③判断⟦2|样品⟧中是否存在特定⟦1|蛋白⟧。"],[1,"④⟦2|检测磷酸化⟧、⟦1|糖基化⟧、⟦1|泛素⟧化等翻译后修饰。"],[1,"⑤与 ⟦1|Co-IP⟧ 等⟦2|技术⟧联用，⟦2|研究⟧蛋白质相互作用。"]]],[1,2,0,1,"锁与钥匙学说（lock and key hypothesis）",[[0,"锁与钥匙学说认为酶的活性中心具有固定⟦1|形状⟧和⟦1|电荷分布⟧，只与结构精确互补的底物结合；它能解释酶的专一性，但忽略⟦1|了酶构象⟧的动态变化。"]]],[1,2,0,2,"多酶复合物（multienzyme complex）",[[0,"多酶复合物是由⟦1|几种酶⟧以非⟦1|共价键⟧嵌合形成的⟦2|复合体⟧，可使连续反应依次进行，减少中间产物扩散并提高反应效率。"]]],[1,2,0,3,"立体异构专一性（Stereospecificity）",[[0,"酶只作用于底物某一种⟦1|立体构型⟧的性质，包括旋光异构专一性和几何异构专一性。其严格的⟦1|立体⟧识别可用于不对称合成和⟦1|异构体⟧拆分。"]]],[1,2,0,4,"酶的专一性（Enzyme specificity）",[[0,"酶的专一性是酶只选择一种或一类底物并催化一种或一类反应的性质；按专一对象，可分为结构专一性和立体异构专一性。"]]],[1,2,0,5,"绝对专一性（absolute specificity）",[[0,"酶只能作用于唯一一种底物，而不作用于其结构⟦1|类似物⟧或⟦2|衍生物⟧的性质，⟦1|体现酶⟧与底物的严格匹配。⟦1|教材⟧中常以⟦1|脲酶⟧⟦2|水解⟧⟦1|尿素⟧为例。"]]],[1,2,0,6,"酶工程（enzyme engineering）",[[0,"酶工程是结合酶学、化学工程和基因⟦2|重组技术⟧，对酶进行⟦1|生产⟧、纯化、固定化、改造和应用的⟦2|技术⟧，可分为⟦2|化学⟧酶工程和生物酶工程。"]]],[1,2,0,7,"固定化酶（immobilized enzyme）",[[0,"固定化酶是用⟦1|物理⟧或⟦2|化学⟧方法把⟦1|水溶性酶⟧制成不溶于水但仍有⟦2|活性⟧的状态；固定化可提高酶的⟦2|稳定性⟧并延长⟦1|使用寿命⟧。"]]],[1,2,0,8,"活化能（activation energy）",[[0,"活化能是在一定⟦2|温度⟧下 ⟦1|1⟧ ⟦1|mol⟧ ⟦1|反应物⟧全部进入⟦2|活化⟧⟦1|态所⟧需的自由能；活化能越高，⟦2|活化⟧分子越少，反应越慢。"]]],[1,2,0,9,"酶的抑制剂（inhibitor）",[[0,"⟦1|酶抑制剂⟧是在不使酶⟦2|变性⟧的情况下改变其必需基团并降低或⟦1|消除酶⟧⟦2|活性⟧的物质；按结合方式分为可逆抑制剂和不可逆抑制剂。"]]],[1,2,0,10,"酶的激活剂（activator）",[[0,"酶的激活剂是能提高酶⟦2|活性⟧的物质，多为⟦1|无机⟧⟦2|离子⟧或简单有机物，也包括激活⟦1|酶原⟧的⟦1|蛋白酶⟧；其作用具有酶和浓度⟦1|选择性⟧。"]]],[1,2,0,11,"米氏方程（Michaelis-Menten equation）",[[0,"米氏方程⟦1|表示酶⟧促反应速率与底物浓度的关系，即 v=⟦1|Vmax⟧[S]/(⟦1|Km+⟧[S])；低底物浓度时速率近似与[S]⟦1|成正比⟧，⟦1|高浓度⟧时速率趋近 ⟦1|Vmax⟧。"]]],[1,2,0,12,"协同指数（CI）",[[0,"协同指数又称饱和⟦1|比值⟧ Rs，是酶结合⟦1|位点⟧达 ⟦1|90⟧%与 ⟦1|10⟧%饱和⟦1|时所⟧需底物浓度之比；⟦1|米氏酶⟧ Rs=⟦1|81⟧，Rs<⟦1|81⟧ 表示正⟦2|协同⟧且⟦1|越小越⟧强，Rs>⟦1|81⟧ 表示负⟦2|协同⟧且越大越强。"]]],[1,2,0,13,"抗代谢物 （Antimetabolites）",[[0,"抗代谢物是结构类似正常⟦2|代谢物⟧的⟦2|化合物⟧，可⟦2|竞争⟧酶的活性中心或掺入生物大分子，形成无功能产物并阻断代谢。"]]],[1,2,0,14,"过渡态稳定学说（transition state Stabilization theory）",[[0,"该⟦1|学说认为酶⟧活性中心⟦1|优先⟧结合并稳定底物的⟦1|过渡态⟧，对其⟦2|亲和力⟧高于对底物或产物的⟦2|亲和力⟧。因此能降低活化能，⟦1|解释酶⟧的高效⟦1|催化作用⟧。"]]],[1,2,0,15,"酸-碱催化（acid-base catalysis）",[[0,"⟦1|酸碱⟧催化是酶活性中心的基团向底物提供或接受⟦2|质子⟧，以稳定⟦1|过渡态⟧、降低活化能并加快反应的机制。"]]],[1,2,0,16,"共价催化（covalent catalysis）",[[0,"共价催化是酶的⟦1|亲核⟧或亲⟦2|电子⟧基团与底物暂时形成不稳定⟦2|共价⟧中间物，从而降低活化能的催化方式；其中，常见的⟦1|亲核⟧基团有 ⟦1|Ser⟧ ⟦1|羟基⟧、⟦1|Cys⟧ ⟦1|巯基⟧和 ⟦1|His⟧ ⟦1|咪唑⟧基。"]]],[1,2,0,17,"正协同性（positive cooperativity）",[[0,"一个⟦1|亚基⟧结合底物后，提高其他⟦1|亚基⟧对底物⟦2|亲和力⟧的现象。其速率⟦2|曲线⟧通常呈 S 形，使酶在一定浓度范围内对底物变化敏感，便于快速调节代谢。"]]],[1,2,0,18,"序变模型（sequential model）",[[0,"解释⟦1|别构酶协同效应⟧的⟦1|模型⟧，认为⟦2|配体⟧结合⟦2|诱导⟧各⟦1|亚基⟧依次改变⟦1|构象⟧，可形成不同⟦1|构象⟧并存的⟦1|杂合⟧态，因此既能解释正⟦2|协同⟧，也能解释负⟦2|协同⟧。"]]],[1,2,0,19,"齐变模型（concerted model）",[[0,"齐变模型认为⟦1|别构酶⟧各⟦1|亚基⟧在 T 态与 R 态之间同步转变，不形成⟦1|杂合⟧态；该⟦1|模型⟧能解释正⟦2|协同⟧，但不能解释负⟦2|协同⟧。"]]],[1,2,0,20,"合成酶",[[0,"催化两种物质⟦1|连接成⟧新物质，并⟦2|偶联⟧ ⟦1|ATP⟧ 等⟦1|高能核苷酸⟧⟦2|水解⟧供能的酶，属于连接酶类。例如 ⟦1|DNA⟧ 连接酶和⟦1|谷氨酰胺⟧合成酶。"]]],[1,2,0,21,"生物酶工程（Biological enzyme engineering）",[[0,"生物酶工程是酶学与 ⟦1|DNA⟧ ⟦2|重组⟧等⟦1|分子生物学⟧⟦2|技术⟧结合形成的⟦2|技术⟧，包括⟦1|基因工程生产酶⟧、⟦1|修饰酶⟧基因获得⟦1|突变酶⟧和⟦2|设计⟧⟦1|新酶⟧基因。"]]],[1,2,0,22,"激酶（kinase）",[[0,"催化⟦1|磷酸⟧基转移的转移酶，通常以 ⟦1|ATP⟧ 为⟦2|供体⟧，使特定靶分子⟦2|磷酸化⟧。该反应可改变底物⟦2|活性⟧或功能，参与⟦2|信号⟧传递、代谢⟦2|调控⟧和能量代谢。"]]],[1,2,0,23,"单纯酶",[[0,"仅由蛋白质组成、不需⟦2|金属离子⟧等⟦1|辅因子⟧参与催化的酶，其⟦2|活性⟧取决于蛋白质自身的结构。例如胃蛋白酶属于单纯酶。"]]],[1,2,1,1,"简述 Ks 型和 Kcat 型抑制剂不同以及特点。",[[0,"（1）⟦2|不同点⟧。"],[1,"⟦1|1⟧）作用机制不同。"],[2,"①Ks 型按底物⟦1|结构设计⟧，可结合酶，并以活泼基团⟦2|共价⟧修饰必需基团而抑制⟦2|活性⟧。"],[2,"②Kcat 型先作为底物被催化，再使潜伏基团⟦2|活化⟧并⟦2|共价⟧修饰⟦2|活性部位⟧或辅基，⟦1|令酶⟧不可逆⟦2|失活⟧。"],[1,"⟦1|2⟧）结构特点不同。"],[2,"①Ks 型似底物，并带可与⟦2|活性⟧⟦1|位点⟧反应的活泼基团。"],[2,"②Kcat 型似天然底物，且含被酶作用后才⟦2|活化⟧的潜伏基团。"],[1,"⟦1|3⟧）专一性不同。"],[2,"①Ks 型的活泼基团也可能⟦1|修饰酶⟧的其他⟦1|同类⟧基团，故专一性有限。"],[2,"②Kcat 型专一性很高，又称自杀性底物。"],[0,"（2）特点。"],[1,"⟦1|1⟧）Ks 型。"],[2,"①酶⟦2|活性部位⟧必需基团与 I 的⟦2|化学⟧⟦1|计量⟧比为 ⟦1|1⟧∶⟦1|1⟧。"],[2,"②真正底物 S 可⟦2|竞争⟧阻断抑制。"],[1,"⟦1|2⟧）Kcat 型。"],[2,"①自杀底物 Si 越多，抑制越强，⟦1|动力学⟧呈一级反应。"],[2,"②Si ⟦2|过量⟧时，酶越多，产生的抑制越大。"],[2,"③Si 本身不抑制，其产物 I 是亲和⟦2|标记⟧抑制物。"],[2,"④酶⟦2|活性部位⟧必需基团与 I 的⟦2|化学⟧⟦1|计量⟧比为 ⟦1|1⟧∶⟦1|1⟧。"],[2,"⑤真正底物 S 可⟦2|竞争⟧阻断 Si 的抑制。"]]],[1,2,1,2,"何谓酶的专一性？酶的专一性有哪几类？",[[0,"（1）酶的专一性⟦1|指酶⟧只选择一类底物并催化一类反应。"],[0,"（2）按底物⟦1|选择性⟧分为结构专一性和立体异构专一性。"],[1,"①结构专一性：选择底物的特定⟦1|化学键⟧或功能团，分两类。"],[2,"a.绝对专一性：只作用于一种底物；如⟦1|脲酶⟧只⟦2|水解⟧⟦1|尿素⟧，不作用于其⟦2|衍生物⟧。"],[2,"b.相对专一性：只要求特定键或基团。键专一性只⟦1|认键⟧，基团专一性还⟦1|认键⟧一侧基团，如⟦1|α-D-葡萄糖苷酶⟧要求一端为⟦1|葡萄糖残基⟧。"],[1,"②立体异构专一性：只催化某一种⟦1|立体异构体⟧，⟦1|分旋光⟧和几何异构专一性。"],[2,"a.旋光异构专一性：如 ⟦1|L-氨基酸氧化酶⟧只氧化 ⟦1|L-氨基酸⟧，不作用于 D 型。"],[2,"b.几何异构专一性：只作用于一种顺反异构体；如⟦1|琥珀酸脱氢酶⟧生成⟦1|延胡索酸⟧，不生成⟦1|顺丁烯二酸⟧。"]]],[1,2,1,3,"简述固定化酶的概念、优点、制备方法。",[[0,"（1）固定化酶是经⟦1|物理⟧或⟦2|化学⟧处理被限制在⟦1|载体⟧或一定⟦2|空间⟧内、仍有⟦2|活性⟧的酶；保留⟦1|高效性⟧和专一性，通常更⟦1|耐酸碱⟧与⟦2|温度⟧变化。"],[0,"（2）优点：①提高⟦2|稳定性⟧和⟦1|使用寿命⟧。"],[1,"②反应⟦1|后易⟧与产物分离，简化分离纯化。"],[1,"③可重复使用，⟦1|提高产量⟧和⟦1|质量⟧。"],[0,"（3）制备：吸附法把酶吸于⟦1|固体载体⟧；包埋法把酶包入多孔⟦1|材料⟧；⟦2|共价偶联⟧法以⟦1|化学键⟧固定；交联⟦1|法用交联剂⟧连接酶分子。"]]],[1,2,1,4,"简述双倒数法作图的原理和意义。",[[0,"（1）原理：⟦1|Lineweaver-Burk⟧ 法将米氏方程取倒数，以 ⟦1|1⟧/v 对 ⟦1|1⟧/[S]作⟦1|直线⟧；⟦1|斜率⟧ Km/⟦1|Vmax⟧，纵截距 ⟦1|1⟧/⟦1|Vmax⟧，横截距－⟦1|1⟧/Km。"],[0,"（2）意义。"],[1,"①可由截距求 ⟦1|Vmax⟧ 和 Km。"],[1,"②可判断抑制类型：⟦1|竞争性⟧抑制使 Km 增大、⟦1|Vmax⟧ 不变；非⟦1|竞争性⟧抑制使 ⟦1|Vmax⟧ 降低、Km 不变。"]]],[1,2,1,5,"请指出有机磷化合物，有机汞化合物，CO 这三种物质为哪种类型的酶的抑制剂？并简要说明作用机制。",[[0,"有机磷、有机汞常按不可逆抑制剂讨论，分别作用于⟦1|羟基⟧和⟦1|巯基⟧；CO 对⟦2|金属中心⟧的⟦1|配位⟧抑制可逆，不能将⟦1|三者⟧一概归为不可逆抑制。"],[0,"（1）有机磷：⟦2|共价⟧修饰⟦2|活性部位⟧ ⟦1|Ser⟧ ⟦1|羟基⟧，使相关⟦1|蛋白酶⟧、⟦1|酯酶⟧⟦2|失活⟧；抑制⟦1|胆碱酯酶⟧可使乙酰胆碱积累。酶“⟦1|老化⟧”前，某些抑制可由⟦1|解磷⟧定等⟦1|复活⟧。"],[0,"（2）有机汞：结合 ⟦1|Cys⟧ ⟦1|巯基⟧，抑制⟦1|巯基酶⟧；⟦2|过量⟧ ⟦1|Cys⟧ 或⟦1|还原型谷胱甘肽⟧可解除。"],[0,"（3）CO：络合细胞色素⟦1|氧化酶⟧的⟦1|亚铁⟧⟦2|离子⟧，阻断电子传递和生物氧化。"]]],[1,2,1,6,"举例说明竞争性抑制的特点和实际意义。",[[0,"（1）特点。"],[1,"①底物与⟦1|抑制剂⟧⟦2|竞争活性⟧⟦1|位点⟧，不能同时结合。"],[1,"②⟦1|Vmax⟧ 不变。"],[1,"③⟦1|表观⟧ Km 增大，即达到 ⟦1|1⟧/⟦1|2⟧ ⟦1|Vmax⟧ 需更高底物浓度。"],[1,"④⟦1|抑制剂⟧常为底物⟦1|类似物⟧，抑制强弱取决于[I]/[S]。"],[0,"（2）意义：用于⟦1|抗菌⟧、⟦1|抗癌⟧⟦2|药物设计⟧，⟦2|研究⟧代谢调节和酶的⟦2|活性⟧⟦1|位点⟧。"],[0,"⟦1|磺胺⟧似对⟦1|氨基苯甲酸⟧，⟦2|竞争⟧⟦1|二氢叶酸⟧合成酶，阻断四氢叶酸及⟦1|核酸⟧合成；高底物可部分克服，故⟦1|用药⟧需维持足够浓度。"]]],[1,2,1,7,"简述别构酶的特点和性质。",[[0,"（1）特点。"],[1,"①⟦2|效应⟧物可逆结合非⟦1|催化部位⟧，引起⟦1|构象⟧和⟦2|活性⟧改变，可呈正或负⟦2|协同⟧。"],[1,"②多为寡聚酶，各⟦1|亚基⟧可有⟦2|活性部位⟧和调节部位，⟦2|二者⟧可同在或分居不同⟦1|亚基⟧。"],[1,"③有同促和异促效应：同促以底物为⟦2|效应⟧物；异促由其他⟦1|激活剂⟧或⟦1|抑制剂⟧介导。"],[1,"④常受⟦1|终产物⟧反馈抑制或激活，可⟦1|灵敏⟧调节代谢速率。"],[0,"（2）性质。"],[1,"①正⟦2|协同⟧呈 S 形⟦2|曲线⟧，负⟦2|协同⟧呈⟦1|表观双曲线⟧，均不符合米氏方程。"],[1,"②加热或⟦2|化学⟧处理可使其解离，失去调节⟦2|活性⟧而保留⟦1|催化活性⟧，称⟦1|脱敏⟧。"],[1,"③常位于代谢⟦2|途径⟧⟦1|起点⟧或⟦1|分支⟧点。"],[1,"④⟦1|模型⟧分齐变⟦1|和序⟧变：⟦1|齐变⟧中各⟦1|亚基⟧同步改变⟦1|构象⟧；⟦1|序变⟧中⟦1|亚基⟧依次改变⟦1|构象⟧和⟦2|亲和力⟧，可出现⟦1|杂合⟧态。"]]],[1,2,1,8,"是否所有的酶都遵守米氏方程？哪类酶不遵守？它们的反应速度与底物浓度的曲线有什么区别？",[[0,"（1）并非⟦1|所有酶⟧都遵守米氏方程；须满足相应⟦1|稳态⟧等条件。有⟦1|协同效应⟧的⟦1|别构酶⟧通常不符合；多底物反应在限定条件下也可呈⟦1|米氏动力学⟧。"],[0,"（2）⟦1|米氏酶⟧的 ⟦1|v-⟧[S]曲线为⟦1|双曲线⟧；⟦1|别构酶⟧为 S 形（正⟦2|协同⟧）或⟦1|表观双曲线⟧（负⟦2|协同⟧）。"],[1,"①S 形：一个⟦1|亚基⟧结合底物或调节物后，提高其余⟦1|亚基⟧的底物⟦2|亲和力⟧，表现正⟦2|协同⟧。"],[1,"②⟦1|表观双曲线⟧：低[S]时⟦2|活性⟧上升快，随后[S]虽⟦1|明显增加⟧，速率只⟦1|小幅⟧上升，表现负⟦2|协同⟧。"]]],[1,3,0,1,"左手 DNA 螺旋（Z-DNA）",[[0,"一种左手⟦2|双螺旋⟧ DNA，糖-⟦1|磷酸⟧⟦2|骨架⟧呈⟦1|锯齿状⟧，⟦1|外形细长⟧，常见于 G、C 交替序列。它可局部形成，可能参与基因转录⟦2|调控⟧和⟦2|染色质⟧结构变化。"]]],[1,3,0,2,"回文结构（Palindrome）",[[0,"回文结构是⟦1|双链⟧ ⟦1|DNA⟧ 中⟦1|两条链⟧按 ⟦1|5⟧′→⟦1|3⟧′方向读取时序列相同、彼此反向互补的片段，常可形成⟦1|发夹⟧或⟦1|十字⟧结构。"]]],[1,3,0,3,"稀有碱基（minor base）",[[0,"稀有碱基是由常见⟦1|碱基⟧经⟦2|甲基化⟧等修饰形成、天然⟦2|含量⟧较少的⟦1|碱基⟧⟦2|衍生物⟧，主要见于 ⟦1|tRNA⟧ 等 ⟦1|RNA⟧ 并有助于维持其结构和功能。"]]],[1,3,0,4,"碱基堆积力（base stacking force）",[[0,"相邻⟦1|碱基⟧堆叠产生的稳定作用，涉及范德华力及疏水⟦2|效应⟧等。它与⟦1|氢键⟧共同维持 ⟦1|DNA⟧ ⟦2|双螺旋⟧，也有助于稳定⟦1|RNA⟧ 的二级和三级结构。"]]],[1,3,0,5,"DNA 的复性（renaturation of DNA）",[[0,"DNA 复性是⟦2|变性⟧后的互补⟦1|单链⟧在适宜条件下重新配对形成⟦2|双螺旋⟧的过程，伴随紫外吸收和沉降速率下降、⟦1|黏度⟧升高。"]]],[1,3,0,6,"帽子结构（cap structure）",[[0,"帽子结构是⟦2|真核⟧ ⟦1|mRNA 5⟧′端的 ⟦1|7⟧-⟦1|甲基鸟苷⟧经 ⟦1|5⟧′-⟦1|5⟧′三⟦1|磷酸键⟧连接形成的结构，可防止降解并促进剪接、⟦2|运输⟧和翻译。"]]],[1,3,0,7,"DNA 的三级结构（The tertiary structure of the DNA）",[[0,"DNA 的三级结构是⟦2|双螺旋⟧进一步扭曲、折叠形成的高级⟦1|构象⟧，主要表现为⟦1|超螺旋⟧，可压缩 DNA 并影响复制和转录。"]]],[1,3,0,8,"RNA 的三级结构（The tertiary structure of the RNA）",[[0,"RNA 的三级结构是 RNA 在二级结构基础上经⟦1|次级键⟧作用进一步折叠形成的三维⟦1|构象⟧，决定其⟦2|稳定性⟧和功能。"]]],[1,3,0,9,"snRNA",[[0,"snRNA 是⟦1|真核细胞⟧核内的小分子 ⟦1|RNA⟧，通常与蛋白质组成 ⟦1|snRNP⟧，负责识别剪接⟦1|位点⟧并参与⟦2|前体⟧ ⟦1|mRNA⟧ 剪接。"]]],[1,3,0,10,"减色效应（hypochromic effect）",[[0,"减色效应是⟦1|单链⟧ ⟦1|DNA⟧ ⟦2|复性⟧形成⟦1|双链⟧后，⟦1|260⟧ nm 处紫外吸收降低的现象；其原因是互补配对恢复并增强了碱基堆积。"]]],[1,3,0,11,"Northern 印迹法（Northern blotting）",[[0,"Northern 印迹法是把⟦1|电泳分离⟧的 ⟦1|RNA⟧ 转移到固⟦1|相膜⟧上，再用⟦2|标记⟧⟦1|探针杂交⟧⟦2|检测⟧特定 ⟦1|RNA⟧ 的⟦2|技术⟧，可⟦2|分析⟧ ⟦1|RNA⟧的大小和丰度。"]]],[1,3,0,12,"反密码子环",[[0,"反密码子环是 ⟦1|tRNA⟧ 二级结构中含反密码子的⟦1|环区⟧，⟦1|中央⟧ ⟦1|3⟧ 个⟦1|碱基⟧可与 ⟦1|mRNA⟧ ⟦1|密码子⟧反向互补配对。"]]],[1,3,1,1,"生物体内 DNA 的负超螺旋结构有何意义？",[[0,"（1）DNA ⟦2|双螺旋⟧进一步盘绕可形成超螺旋；相对松弛⟦1|态欠旋者⟧为负超螺旋。它有利于局部⟦1|解链⟧，为复制和转录提供条件。"],[0,"（2）意义。"],[1,"①利于⟦1|双链⟧解开，促进复制、转录，并减小⟦1|解链⟧产生的扭转⟦1|张力⟧。"],[1,"②维持适宜功能状态，便于转录因子等蛋白质结合，促进转录。"],[1,"③改变 DNA 拓扑并⟦2|调控⟧基因⟦2|活性⟧；拓扑异构酶可调节该状态。"],[1,"④压缩 DNA 以⟦1|容纳⟧于有限⟦2|空间⟧，并提高⟦2|稳定性⟧。"]]],[1,3,1,2,"怎样通过紫外吸收法判断核酸的纯度以及对纯核酸进行定量？",[[0,"核酸⟦1|碱基⟧有⟦1|芳香共轭体系⟧，紫外吸收最大值约 ⟦1|260⟧ nm，可据此估计纯度和定量。"],[0,"（1）纯度鉴定。"],[1,"测 ⟦1|A260⟧/⟦1|A280⟧：纯 ⟦1|DNA⟧ 通常约 ⟦1|1.8⟧，纯 ⟦1|RNA⟧ 约 ⟦1|2.0⟧；偏低可提示⟦1|蛋白⟧或⟦1|苯酚污染⟧，偏高可能与 ⟦1|RNA⟧ 或测定条件⟦1|有关⟧，不能仅凭此⟦1|比值⟧定纯度。"],[0,"（2）定量。"],[1,"①紫外法：⟦1|1⟧ cm ⟦1|光程⟧下，⟦1|A260⟧=⟦1|1⟧ 约⟦1|对应双链⟧ ⟦1|DNA 50⟧ ⟦1|μg⟧/mL、⟦1|RNA 40⟧ ⟦1|μg⟧/mL；再乘稀释⟦1|倍数⟧。"],[1,"②⟦1|定糖法⟧：用⟦1|核糖⟧或⟦1|脱氧核糖⟧的显色反应定量。"],[1,"③定⟦1|磷法⟧：⟦1|强酸消化⟧核酸成⟦1|无机⟧磷，显色⟦1|测磷⟧后换算核酸量。"],[1,"④⟦1|凝胶电泳⟧法：EB 嵌入 ⟦1|DNA⟧ 后发⟦1|荧光⟧，⟦1|荧光⟧⟦2|强度⟧与 ⟦1|DNA⟧ 量⟦1|成正比⟧。"]]],[1,3,1,3,"比较 DNA 和 RNA 在一级结构和二级结构的差别。",[[0,"（1）一级结构⟦2|差异⟧：⟦1|核酸⟧一级结构均为⟦1|核苷酸⟧排列⟦1|顺序⟧。"],[1,"①DNA 由脱氧核苷酸以 ⟦1|3⟧′,⟦1|5⟧′-⟦1|磷酸二酯⟧键连接，含⟦1|脱氧核糖⟧、⟦1|磷酸⟧及 A、C、G、T。"],[1,"②RNA 由⟦1|核糖核苷酸⟧以⟦1|同种键⟧连接，含⟦1|核糖⟧、⟦1|磷酸⟧及 A、C、G、U。"],[0,"（2）二级结构⟦2|差异⟧。"],[1,"①DNA 通常由两条⟦1|互补链氢键⟧配对成⟦2|双螺旋⟧；RNA 通常为⟦1|单链⟧。"],[1,"②RNA 可自身回折形成局部⟦2|双螺旋⟧：⟦1|tRNA⟧ 呈⟦1|三叶草⟧形，⟦1|rRNA⟧ ⟦1|高度⟧折叠，⟦1|mRNA⟧ 常见茎环。"]]],[1,3,1,4,"将核酸完全水解后可得到哪些组分？DNA 和 RNA 的水解产物有何不同？",[[0,"（1）DNA 完全水解得⟦1|脱氧核糖⟧、A、T、C、G 和⟦1|磷酸⟧；RNA 得⟦1|核糖⟧、A、U、C、G 和⟦1|磷酸⟧。"],[0,"（2）⟦2|差异⟧。"],[1,"①DNA 含⟦1|脱氧核糖⟧，RNA 含⟦1|核糖⟧。"],[1,"②DNA ⟦1|碱基⟧为 A、T、C、G，RNA 为 A、U、C、G。"]]],[1,3,1,5,"在加热变性时，为什么双链螺旋 DNA 中的 GC 碱基含量比例越高，其解链温度 Tm 值也越高？",[[0,"（1）DNA 热变性指 ⟦1|70～100⟧℃加热稀⟦1|盐液⟧，使⟦1|氢键⟧断裂、双链分开并形成无规则⟦1|线团⟧。"],[0,"（2）Tm 是 DNA 热变性达到一半时的温度；受⟦2|离子强度⟧、pH、⟦2|极性⟧⟦1|溶质⟧、序列均一性、GC 含量和⟦1|链长⟧等影响。"],[0,"（3）⟦1|A-T⟧ 有 ⟦1|2⟧ 个⟦1|氢键⟧，⟦1|G-C⟧ 有 ⟦1|3⟧ 个，且碱基堆积也影响⟦2|稳定性⟧；其他条件相近时，GC 含量越高，Tm 通常越高。"]]],[1,3,1,6,"简述 DNA 的测序技术有哪些？",[[0,"（1）双脱氧链终止法：四组⟦1|体系⟧各加一种 ⟦1|ddNTP⟧，随机终止延伸；产物经⟦2|变性⟧ ⟦1|PAGE⟧ 分离，按⟦2|长度⟧⟦1|读序⟧。"],[0,"（2）⟦2|化学⟧测序法：用⟦1|碱基⟧特异⟦1|试剂⟧修饰 DNA，再以⟦1|哌啶切链⟧；四组⟦1|末端标记⟧片段⟦1|电泳⟧后⟦1|读序⟧。"],[0,"（3）第二代测序：以⟦1|焦磷酸⟧测序等酶联技术并行测序，⟦1|成本低⟧、⟦1|速度快⟧、⟦1|准确性⟧高，但读长短于第一代。"],[0,"（4）第三代测序：以 ⟦1|Heliscope⟧、⟦1|PacBio⟧ ⟦1|SMRT⟧ 和 ⟦1|Oxford⟧ ⟦1|Nanopore⟧ 等单分子技术为代表。"]]],[1,4,0,1,"异头物（anomer）",[[0,"异头物是⟦1|单糖成环⟧后⟦1|羰基⟧碳成为⟦1|新手⟧性⟦2|中心⟧而形成的一对差向异构体；⟦1|异头羟基⟧与最远⟦1|手性⟧碳⟦1|羟基⟧同侧为α型，⟦1|异侧⟧为β型。"]]],[1,4,0,2,"糖苷键（glycosidic bond）",[[0,"糖苷键是糖的半⟦1|缩醛羟基⟧与另一⟦2|化合物⟧缩合后连接⟦1|糖基⟧和⟦1|配基⟧的⟦1|共价键⟧，按连接原子可分为 O、N、S 和 ⟦1|C-⟧糖苷键。"]]],[1,4,0,3,"肽聚糖（peptidoglycan）",[[0,"肽聚糖又称⟦1|黏肽⟧或⟦1|胞壁质⟧，是⟦1|细菌细胞壁⟧的主要成分；其⟦1|主链⟧由 ⟦1|N-乙酰葡糖胺⟧和 ⟦1|N-乙酰胞壁酸⟧以⟦1|β-1⟧,⟦1|4⟧ ⟦1|糖苷键⟧交替连接，再由⟦1|短肽⟧交联成⟦1|网状结构⟧。"]]],[1,4,0,4,"脂多糖（lipopolysaccharide）",[[0,"脂多糖是⟦1|革兰氏阴性菌外膜⟧的主要⟦1|糖脂⟧，由⟦2|脂质⟧ A、⟦2|核心⟧⟦1|寡糖⟧和 ⟦1|O-特异链⟧组成，其中⟦2|脂质⟧ A 是⟦1|内毒素⟧成分。"]]],[1,4,0,5,"O-糖肽键（O-glycopeptide bond）",[[0,"⟦1|糖蛋白⟧中，⟦1|糖链⟧还原端⟦1|单糖⟧的⟦1|异头⟧碳与 ⟦1|Ser⟧ 或 ⟦1|Thr⟧ ⟦1|侧链羟基⟧氧形成的 ⟦1|O-糖苷键⟧。它连接⟦1|糖链⟧和⟦1|肽链⟧，⟦1|糖基化⟧可影响蛋白质的结构及功能。"]]],[1,4,0,6,"N-糖肽键（N-glycopeptide bond）",[[0,"⟦1|糖蛋白⟧中，⟦1|糖链⟧还原端 ⟦1|N-乙酰葡糖胺⟧与 ⟦1|Asn⟧ ⟦1|侧链酰胺⟧氮形成的 ⟦1|N-糖苷键⟧。它是⟦1|糖链⟧与⟦1|肽链⟧的主要连接方式之一，影响蛋白质结构与功能。"]]],[1,4,0,7,"糖胺聚糖（glycosaminoglycan）",[[0,"糖胺聚糖是动物和⟦1|细菌胞外基质⟧中的⟦1|线性⟧杂⟦1|多糖⟧，通常由己⟦1|糖醛酸和己糖胺⟧组成重复⟦1|二糖⟧单位，并因富含⟦1|硫酸基和羧基⟧而带⟦2|大量⟧⟦1|负电荷⟧。"]]],[1,4,0,8,"糖缀合物（glycoconjugate）",[[0,"糖缀合物又称糖⟦1|复合物⟧，是糖与蛋白质或⟦2|脂质⟧以⟦1|共价键⟧结合形成的分子，参与细胞识别、⟦2|信号⟧⟦1|传导⟧和免疫应答。"]]],[1,4,0,9,"还原糖（reducing sugar）",[[0,"还原糖是能还原 ⟦1|Fehling⟧ 或 ⟦1|Benedict⟧ ⟦1|试剂⟧的糖，分子中含⟦1|游离醛⟧基，或所⟦1|含酮⟧基可在⟦1|碱性⟧条件下⟦1|异构化⟧为醛基。"]]],[1,4,0,10,"糖蛋白（glycoprotein）",[[0,"⟦1|寡糖链⟧与蛋白质⟦2|共价⟧连接形成的糖缀合物，⟦1|糖链⟧常以 ⟦1|N-⟧或 ⟦1|O-糖苷键⟧与⟦1|肽链⟧相连。多见于膜及分泌⟦1|蛋白⟧，参与细胞识别、黏附和免疫应答。"]]],[1,4,0,11,"蛋白聚糖（proteoglycans）",[[0,"蛋白聚糖是⟦2|核心⟧⟦1|蛋白⟧与一条或多条⟦1|糖胺聚糖⟧⟦2|共价⟧连接形成的糖缀合物，主要分布于细⟦1|胞外基质⟧并参与细胞连接和⟦2|信号⟧传递。"]]],[1,4,0,12,"差向异构体（epimer）",[[0,"仅有一个⟦1|手性⟧碳⟦1|构型⟧不同、其余结构相同且不呈⟦1|镜像⟧关系的一对非对⟦1|映体⟧，理化性质可不同。例如 ⟦1|D-葡萄糖⟧与 ⟦1|D-甘露糖⟧互为差向异构体。"]]],[1,4,0,13,"糖苷（glycosides）",[[0,"糖苷是⟦1|环状单糖⟧的半⟦1|缩醛⟧或⟦1|半缩酮羟基⟧与其他⟦2|化合物⟧缩合形成的⟦1|缩醛⟧或⟦1|缩酮⟧，按⟦1|糖苷键⟧可分为 O、N、S 和 ⟦1|C-⟧苷。"]]],[1,4,0,14,"醛糖（aldoses）",[[0,"⟦1|开链⟧形式中⟦1|羰基⟧位于⟦1|碳链⟧末端、⟦1|呈醛⟧基的一类⟦1|单糖⟧，可视为⟦1|甘油醛⟧的⟦2|衍生物⟧。⟦1|葡萄糖⟧是⟦1|典型⟧己醛糖，可作为⟦1|能源⟧和生物合成⟦2|前体⟧。"]]],[1,4,0,15,"酮糖（ketoses）",[[0,"⟦1|开链⟧形式中⟦1|羰基⟧位于⟦1|碳链⟧内部、⟦1|呈酮⟧基的一类⟦1|单糖⟧，可视为二羟⟦1|丙酮⟧的⟦2|衍生物⟧。⟦1|果糖⟧是⟦1|典型⟧己酮糖，其⟦2|衍生物⟧可参与⟦1|糖酵解⟧等代谢。"]]],[1,4,0,16,"同多糖（Homopolysaccharides）",[[0,"同多糖是仅由一种⟦1|单糖⟧或其⟦2|衍生物⟧聚合形成的⟦1|多糖⟧，可分为⟦1|淀粉⟧、⟦2|糖原⟧等⟦2|储存⟧⟦1|多糖⟧和⟦1|纤维素⟧、⟦1|壳多糖⟧等结构⟦1|多糖⟧。"]]],[1,4,1,1,"简述糖类的生物学作用。",[[0,"①结构成分：⟦1|纤维素⟧、半⟦1|纤维素⟧和⟦1|果胶⟧构成植物⟦1|细胞壁⟧，⟦1|肽聚糖⟧构成⟦1|细菌细胞壁⟧，⟦1|壳多糖⟧构成⟦1|昆虫⟧和⟦1|甲壳类外骨骼⟧。"],[0,"②⟦1|能源⟧和⟦1|储能⟧：糖是主要⟦1|能源⟧，⟦1|淀粉⟧和⟦2|糖原⟧是⟦2|储存⟧形式。"],[0,"③合成⟦2|前体⟧：糖代谢中间物为⟦1|氨基酸⟧、⟦1|核苷酸⟧和⟦1|脂肪酸⟧等提供碳⟦2|骨架⟧。"],[0,"④⟦1|信息⟧分子：膜⟦1|糖蛋白⟧和⟦1|糖脂⟧的⟦1|寡糖链⟧参与⟦1|信息⟧传递。"],[0,"⑤⟦1|糖胺聚糖⟧富含⟦1|亲水⟧和带电基团，能结合水形成⟦2|凝胶⟧，在⟦1|胞外基质⟧中润滑、缓冲并⟦1|保水⟧。"]]],[1,4,1,2,"什么是糖蛋白？糖蛋白的多糖链与蛋白质多肽链通过哪些方式相连接？",[[0,"糖蛋白是⟦1|寡糖链⟧与蛋白质⟦2|共价⟧连接的糖缀合物，多为⟦1|膜蛋白⟧或分泌⟦1|蛋白⟧，参与识别、黏附和免疫。连接方式如下："],[1,"①⟦1|N-糖肽键⟧：⟦1|寡糖⟧以⟦1|β-N-糖苷键⟧连接⟦1|多肽⟧的 ⟦1|Asn⟧ ⟦1|残基⟧。"],[1,"②⟦1|O-糖肽键⟧：⟦1|寡糖⟧还原端常为 ⟦1|N-乙酰半乳糖胺⟧，其异头碳与 ⟦1|Ser⟧ 或 ⟦1|Thr⟧ ⟦1|羟基⟧氧形成 ⟦1|O-糖苷键⟧。"],[1,"③⟦1|S-糖肽键⟧：以 ⟦1|Cys⟧ 为⟦1|连接点⟧。"],[1,"④酯⟦1|糖肽键⟧：以 ⟦1|Asp⟧ 或 ⟦1|Glu⟧ 的⟦2|游离⟧⟦1|羧基⟧为⟦1|连接点⟧。"]]],[1,4,1,3,"糖蛋白的生物学功能是什么？",[[0,"糖蛋白种类多、分布广，功能如下："],[1,"①细胞识别和互作：⟦1|糖链⟧被细胞⟦1|表面受体⟧等识别，参与通信、黏附和⟦2|信号⟧传递。"],[1,"②促进蛋白质正确折叠，并维持其⟦2|稳定性⟧和功能。"],[1,"③⟦1|信号转导⟧：⟦1|糖链⟧变化可调节⟦1|膜受体⟧⟦2|活性⟧；⟦2|病毒⟧糖蛋白还能结合⟦1|宿主受体⟧并介导入侵。"],[1,"④免疫：⟦2|抗体⟧等多种免疫分子是糖蛋白。"],[1,"⑤⟦1|胞外基质⟧：参与细胞附着、迁移、⟦1|分化⟧和组织构建。"],[1,"⑥决定代谢去向：⟦1|寡糖⟧末端⟦1|唾液酸⟧影响⟦1|蛋白⟧在血中存留或被肝清除。"]]],[1,4,1,4,"糖蛋白和蛋白聚糖的主要区别。",[[0,"①⟦1|定义⟧：⟦2|二者⟧均含⟦2|共价⟧连接的蛋白质和糖；糖蛋白以⟦1|蛋白⟧为主，蛋白聚糖以糖为主。"],[0,"②⟦1|比例⟧：糖蛋白中蛋白质量较高；蛋白聚糖中⟦1|多糖⟧超过 ⟦1|50⟧%，可达 ⟦1|95⟧%，⟦1|糖链⟧结构、合成和功能也不同。"],[0,"③分布：糖蛋白见于细胞内外；蛋白聚糖主要在结缔组织等⟦1|胞外基质⟧。"],[0,"④连接和⟦1|糖链⟧：糖蛋白多为⟦1|分支寡糖⟧，以 ⟦1|N-⟧或 ⟦1|O-糖苷键⟧连接；蛋白聚糖多带不⟦1|分支⟧的⟦1|糖胺聚糖长链⟧，由含⟦1|氨基糖⟧的⟦1|二糖⟧重复，常以 ⟦1|O-糖苷键⟧连接。"],[0,"⑤功能：糖蛋白参与识别、折叠、⟦1|定向⟧⟦2|运输⟧、⟦2|信号⟧及物质转运；蛋白聚糖支撑保护组织，调节黏附、迁移、增殖和⟦1|分化⟧。"],[0,"⑥大小：糖蛋白通常较小；蛋白聚糖含⟦2|大量⟧⟦1|糖胺聚糖⟧，分子⟦1|质量⟧更大。"]]],[1,4,1,5,"举例说明什么是同多糖，什么是杂多糖？",[[0,"同多糖由一种⟦1|单糖⟧或其⟦2|衍生物⟧聚合。⟦2|储存⟧型如⟦1|淀粉⟧、⟦2|糖原⟧，⟦1|结构型⟧如⟦1|纤维素⟧、⟦1|几丁质⟧；⟦1|前者⟧⟦2|储存⟧⟦1|燃料⟧，⟦2|后者⟧构成⟦1|细胞壁⟧或⟦1|外骨骼⟧。"],[0,"杂多糖由两种以上⟦1|单糖⟧或⟦2|衍生物⟧聚合，如⟦1|透明质酸⟧由 ⟦1|D-葡萄糖醛酸⟧和 ⟦1|N-乙酰⟧-⟦1|D-葡萄糖胺⟧组成；常支撑⟦1|胞外⟧结构或⟦1|传递信息⟧。"]]],[1,4,1,6,"糖胺聚糖的生物学作用及种类？",[[0,"生物学作用。"],[1,"①构成⟦1|胞外基质⟧，为⟦1|软骨⟧、⟦1|皮肤⟧、⟦1|血管⟧和结缔组织提供⟦2|强度⟧与⟦1|弹性⟧。"],[ 脂蛋白⟧，负责把⟦1|膳食⟧⟦2|脂质⟧运送到⟦1|全身⟧组织。"]]],[1,5,0,12,"三酰甘油（triacylglycerol，TG）或称甘油三酯（triglyceride）",[[0,"由一分子⟦2|甘油⟧与三分子⟦1|脂肪酸⟧以⟦1|酯键⟧连接形成，是⟦1|动植物油脂⟧的主要成分。它是重要⟦1|储能⟧物质，需要时经⟦1|脂肪酶⟧⟦2|水解⟧，释放⟦1|脂肪酸⟧供能。"]]],[1,5,0,13,"协同转运（co-transport）",[[0,"协同转运是两种或多种物质经同一转运⟦1|蛋白⟧同步⟦1|跨膜⟧的机制；同向转运使其同向⟦2|移动⟧，⟦1|逆向⟧转运则使其反向⟦2|移动⟧。"]]],[1,5,0,14,"乳化（emulsification）",[[0,"乳化是⟦1|乳化剂⟧包裹⟦1|油滴⟧并使其稳定分散于水中的过程；⟦1|乳化剂⟧凭借亲⟦1|水基⟧和疏⟦1|水基⟧降低⟦1|界面张力⟧，防止⟦1|油滴⟧聚集。"]]],[1,5,0,15,"碘值（价）（iodine value）",[[0,"⟦1|100⟧ g ⟦1|油脂卤化⟧时吸收碘的⟦1|克数⟧，用于衡量⟦1|油脂⟧的⟦1|不饱和⟧程度，碘值越高，⟦1|不饱和⟧程度越高。该⟦1|指标⟧常用于⟦1|评估油脂品质⟧及⟦2|加工⟧⟦1|特性⟧。"]]],[1,5,0,16,"卵磷脂（Lecithin）",[[0,"卵磷脂又称⟦1|磷脂酰胆碱⟧，是由⟦2|甘油⟧、两分子⟦1|脂肪酸⟧、⟦1|磷酸⟧和⟦1|胆碱⟧组成的甘油磷脂，是⟦1|细胞膜⟧的重要成分。"]]],[1,5,0,17,"鞘糖脂（glycosphingolipid）",[[0,"鞘糖脂是不含⟦2|甘油⟧和⟦1|磷酸⟧、以⟦1|神经酰胺⟧为⟦2|骨架⟧并连接⟦1|单糖⟧或⟦1|寡糖⟧的⟦1|鞘脂⟧，参与细胞识别、⟦1|血型抗原⟧决定和⟦1|神经功能⟧。"]]],[1,5,0,18,"低密度脂蛋白（low-density lipoprotein，LDL）",[[0,"低密度脂蛋白是由 ⟦1|VLDL⟧ 代谢形成、负责把⟦1|胆固醇⟧由肝⟦1|运往⟧外周组织的⟦1|血浆脂蛋白⟧；⟦2|过量⟧氧化 LDL 易使⟦1|胆固醇沉积⟧于⟦1|血管⟧壁并促进⟦1|动脉⟧粥样⟦1|硬化⟧。"]]],[1,5,0,19,"糖脂（glycolipid）",[[0,"⟦1|含糖⟧基的复合⟦2|脂质⟧，⟦1|糖基⟧以⟦1|糖苷键⟧连接⟦2|脂质⟧，通常⟦1|朝向⟧细胞外，疏水部分嵌入脂⟦1|双层⟧。其分布有组织⟦2|特异性⟧，可参与细胞识别和相互作用。"]]],[1,5,1,1,"简述脂类的生物学作用。",[[0,"①构成⟦1|生物膜⟧：⟦1|磷脂⟧、⟦1|胆固醇⟧和⟦1|糖脂⟧形成⟦1|膜结构⟧，维持细胞完整并分隔⟦1|内部空间⟧。"],[0,"②⟦2|储存⟧能量：三酰甘油是主要⟦1|储能⟧⟦2|脂质⟧，某些生物也⟦2|储存⟧蜡；⟦1|脂肪酸⟧还原程度高，彻底氧化为 ⟦1|CO₂⟧和 ⟦1|H₂O⟧ 可释放⟦2|大量⟧能量。"],[0,"③⟦2|活性脂质⟧：可作⟦1|辅因子⟧、⟦1|电子载体⟧、⟦1|色素⟧、疏水锚、⟦1|乳化剂⟧、⟦1|激素⟧和⟦1|信使⟧；如 ⟦1|IP₃⟧、⟦1|DAG⟧ 传递⟦2|信号⟧，⟦1|糖脂⟧参与识别，⟦1|β-胡萝卜素抗氧化⟧。"],[0,"④保护：动物⟦2|脂肪⟧⟦1|防震⟧、⟦1|保温⟧和⟦1|抗压⟧；植物蜡减少⟦1|水分⟧蒸发。"],[0,"⑤促进⟦1|营养⟧吸收：作为⟦1|维生素⟧ A、D、E、K 的⟦1|载体⟧，促进其吸收利用。"]]],[1,5,1,2,"血浆脂蛋白的分类和生理功能？为什么说 HDL 是血管中的清道夫？",[[0,"（1）主要分乳糜微粒（CM）、极⟦1|低密度⟧（⟦1|VLDL⟧）、⟦1|低密度⟧（⟦1|LDL⟧）和⟦1|高密度⟧脂蛋白（HDL）。"],[0,"（2）主要功能。"],[1,"①CM：⟦1|小肠⟧合成，富含⟦1|膳食⟧三酰甘油；运送⟦2|外源脂质⟧，向外周供⟦1|脂肪酸⟧，含⟦1|胆固醇⟧的⟦1|残粒⟧由肝摄取。"],[1,"②⟦1|VLDL⟧：肝合成，向外周运送⟦1|内源⟧三酰甘油；经脂蛋白⟦1|脂肪酶⟧⟦2|水解⟧，依次形成 ⟦1|IDL⟧ 和 ⟦1|LDL⟧。"],[1,"③⟦1|LDL⟧：富含⟦1|胆固醇⟧及其酯，向外周运送⟦1|胆固醇⟧；过多或氧化⟦1|后易⟧促进血管⟦1|壁脂质沉积⟧。"],[1,"④HDL：肝和⟦1|小肠⟧形成，将外周组织及⟦1|细胞膜⟧的多余⟦1|胆固醇⟧运回肝，⟦1|故称⟧血管中的“清道夫”。"],[0,"（3）HDL 摄取⟦2|游离⟧⟦1|胆固醇⟧后，⟦1|LCAT⟧ 将⟦1|磷脂酰胆碱⟧的⟦1|脂肪酸⟧转给⟦1|胆固醇⟧；生成的⟦1|胆固醇酯⟧进入⟦2|核心⟧，使 HDL成熟，再直接或间接运回肝。"]]],[1,5,1,3,"简述胆固醇的功能以及对生物膜的双重作用。",[[0,"（1）胆固醇功能。"],[1,"①插入⟦1|磷脂⟧间，参与⟦1|成膜⟧，调节⟦1|流动性⟧、提高⟦2|稳定性⟧并降低⟦1|水溶性⟧物质⟦1|通透性⟧。"],[1,"②是⟦1|雄激素⟧、雌激素、糖⟦1|皮质激素⟧、盐⟦1|皮质激素⟧及⟦1|维生素⟧ D 的⟦2|前体⟧；⟦1|维生素⟧ D 调节钙磷代谢，维持⟦1|骨骼⟧健康。"],[1,"③在肝内转为⟦1|胆汁酸⟧，⟦1|乳化油脂⟧并促进吸收。"],[1,"④影响⟦1|膜受体⟧和⟦2|信号⟧分子的分布、功能，参与⟦1|信号转导⟧。"],[0,"（2）双重作用：⟦2|温度⟧较高时限制⟦1|磷脂链运动⟧，降低⟦1|流动性⟧；⟦2|温度⟧较低时阻止⟦1|脂肪酸链⟧紧密堆积，防止膜凝固。"]]],[1,5,1,4,"生物膜分子结构的理论模型有哪些？“流动镶嵌模型”的基本内容是什么？",[[0,"（1）模型包括脂⟦1|双层⟧模型、⟦1|三夹板⟧模型、单位膜模型和流动镶嵌模型。"],[0,"（2）流动镶嵌模型⟦1|要点⟧。"],[1,"①⟦1|磷脂双层⟧是⟦1|流动⟧⟦2|骨架⟧，⟦1|亲水⟧头⟦1|朝水⟧相、疏水尾⟦1|朝内⟧；蛋白质附于⟦2|表面⟧、嵌入或贯穿⟦1|双层⟧，共同构成⟦1|动态膜结构⟧。"],[1,"②⟦1|膜蛋白⟧以疏水作用等方式与脂⟦1|双层⟧结合，分布不对称，多数承担具体膜功能。"],[1,"③多数⟦2|脂质⟧和蛋白质可旋转、横向扩散，体现膜的⟦1|流动性⟧。"],[1,"④外⟦2|表面⟧有蛋白质结合糖形成的⟦1|糖蛋白⟧或糖被，以及⟦2|脂质⟧结合糖形成的⟦1|糖脂⟧。"]]],[1,5,1,5,"简述影响膜的流动性的主要因素。",[[0,"膜流动性是⟦1|生命活动⟧所需⟦1|特性⟧，主要⟦1|受膜⟧组成和⟦1|环境影响⟧。"],[1,"①⟦2|温度⟧：⟦1|低温⟧使⟦2|脂质⟧⟦1|运动⟧减慢、排列趋于⟦1|有序⟧，过低可转为⟦2|凝胶⟧态；⟦1|高温⟧通常增强⟦1|运动⟧和流动性。"],[1,"②⟦2|脂质⟧组成：⟦1|饱和度⟧越高、链越长，⟦1|链间⟧排列越紧、范德华力越强，流动性越低；顺式⟦1|不饱和链⟧弯曲，流动性较高。"],[1,"③⟦1|固醇⟧：⟦1|高温⟧时限制⟦1|磷脂运动⟧，降低流动性；⟦1|低温⟧时阻止紧密堆积，提高流动性，具体⟦2|效应⟧还取决于膜脂组成。"],[1,"④⟦1|卵磷脂⟧/⟦1|鞘磷脂比值⟧：⟦1|卵磷脂⟧不⟦1|饱和度⟧高、流动性强，故⟦1|比值⟧越高，膜越⟦1|流动⟧。"],[1,"⑤其他：⟦2|环境⟧ pH、⟦2|离子强度⟧等。"]]],[1,6,0,1,"新陈代谢（metabolism）",[[0,"新陈代谢是⟦1|生物体⟧内全部化学变化的⟦1|总称⟧，包括合成机体物质并⟦1|储能⟧的⟦1|同化作用⟧和分解物质并释放能量的⟦1|异化作用⟧。"]]],[1,6,0,2,"同化作用（assimilation）/合成代谢",[[0,"又称合成代谢，是由小分子合成细胞⟦1|大分子⟧，或将⟦1|外界⟧物质转为自身成分的需能过程。如⟦2|糖原⟧、⟦1|脂肪酸⟧和蛋白质合成，需利用 ⟦1|ATP⟧ 等提供能量。"]]],[1,6,0,3,"异化作用（dissimilation）/分解代谢",[[0,"异化作用又称分解代谢，是把糖、⟦2|脂质⟧和蛋白质等逐步分解为较简单产物并释放能量、合成 ⟦1|ATP⟧ 的过程。"]]],[1,6,0,4,"FoF1-ATP 酶又称 ATP 合酶（ATP synthase）",[[0,"⟦1|F₀ F⟧₁-ATP 合酶又称⟦2|复合体⟧Ⅴ，是催化 ATP 合成的⟦1|膜蛋白⟧⟦2|复合体⟧；⟦1|F₀⟧ 构成⟦2|质子⟧通道，⟦1|F₁⟧催化 ⟦1|ADP⟧ 和 Pi 生成 ATP。"]]],[1,6,0,5,"生物大分子（biomacromolecule）",[[0,"生物大分子是由较小⟦1|单体⟧⟦2|共价⟧聚合形成的⟦1|高分子⟧，主要包括蛋白质、⟦1|核酸⟧和⟦1|多糖⟧，是细胞结构和⟦1|生命活动⟧的⟦1|物质基础⟧。"]]],[1,6,0,6,"高能磷酸化合物（high energy phosphate compound）",[[0,"高能磷酸化合物是含⟦1|高能磷酸键⟧、⟦2|水解⟧可释放⟦2|大量⟧自由能的⟦2|化合物⟧，如 ⟦1|ATP⟧、⟦1|磷酸肌酸⟧和⟦1|磷酸烯醇⟧式⟦1|丙酮酸⟧。"]]],[1,6,0,7,"有氧呼吸(aerobic respiration)",[[0,"有氧呼吸是在氧参与下将⟦1|葡萄糖⟧等有机物彻底氧化为 ⟦1|CO₂⟧和水并释放⟦2|大量⟧能量的过程，主要包括⟦1|糖酵解⟧、三⟦1|羧酸⟧⟦2|循环⟧、⟦1|呼吸链⟧和氧化磷酸化。"]]],[1,6,0,8,"递电子体（electron carrier）",[[0,"递电子体是能可逆接受和释放⟦2|电子⟧的分子或蛋白质基团，可按氧化还原⟦1|电位⟧依次传递⟦2|电子⟧并逐步释放能量。"]]],[1,6,0,9,"电子传递抑制剂（electron transfer inhibitor）",[[0,"电子传递抑制剂是特异阻断⟦1|呼吸链⟧某一部位电子传递的物质，可使⟦2|质子梯度⟧不能形成并⟦1|中断⟧ ⟦1|ATP⟧ 合成。"]]],[1,6,0,10,"代谢组学（metabonomics/metabolomics）",[[0,"⟦2|研究⟧⟦1|生物体⟧⟦2|代谢物⟧的⟦1|总体⟧组成、⟦2|含量⟧变化及其与⟦1|生理功能⟧关系的⟦1|学科⟧。常用⟦1|色谱⟧、⟦1|质谱⟧等⟦1|定性⟧定量分析，揭示代谢⟦1|网络⟧变化，⟦1|服务⟧于⟦2|疾病⟧和⟦2|药物研究⟧。"]]],[1,6,0,11,"细胞色素",[[0,"含⟦1|血红素⟧辅基的电子传递⟦1|蛋白⟧，通过⟦1|血红素⟧铁 ⟦1|Fe²⁺⟧ 与 ⟦1|Fe³⁺⟧ 可逆转换传递⟦2|电子⟧。按⟦1|光谱⟧与结构可分 a、b、c等类，是⟦1|呼吸链⟧的重要⟦2|组分⟧。"]]],[1,6,0,12,"质子泵（proton pump）",[[0,"质子泵是利用 ⟦1|ATP⟧ ⟦2|水解⟧、电子传递或光能逆⟦2|梯度⟧⟦1|跨膜⟧转运 ⟦1|H⁺⟧ 的蛋白质，可建立⟦2|驱动⟧ ⟦1|ATP⟧ 合成和物质转运的⟦2|质子⟧⟦1|电化学⟧⟦2|梯度⟧。"]]],[1,6,1,1,"简述新陈代谢的调节机制（代谢的调控）。",[[0,"代谢调控既维持⟦2|代谢物⟧浓度⟦1|稳态⟧，也调节⟦1|通量⟧以适应环境，主要分三个水平。"],[0,"（1）分子水平：调节底物、酶⟦2|活性⟧（⟦1|别构⟧、⟦2|共价⟧修饰）和酶量（合成、降解）；各⟦2|途径⟧由共同中间物联系。"],[0,"（2）细胞水平：⟦1|分室⟧化隔开⟦2|途径⟧，膜⟦2|运输⟧控制底物和产物⟦1|流动⟧，膜⟦2|环境⟧及⟦1|外界⟧⟦2|信号⟧影响细胞代谢。"],[0,"（3）整体水平：⟦1|神经⟧和⟦1|体液⟧调节协调各组织器官，并响应机体内外变化。"]]],[1,6,1,2,"比较底物水平磷酸化、光合磷酸化与氧化磷酸化三者的异同。",[[0,"（1）⟦1|概念⟧。"],[1,"①底物水平磷酸化："],[2,"⟦1|高能⟧中间物直接把⟦1|磷酸⟧基转给 ⟦1|ADP⟧ 或 ⟦1|GDP⟧ 生成 ⟦1|ATP⟧ 或 ⟦1|GTP⟧，"],[2,"不依赖氧和⟦1|呼吸链⟧，如 ⟦1|1⟧,⟦1|3⟧-⟦1|BPG⟧、⟦1|PEP⟧ 产 ⟦1|ATP⟧。"],[1,"②氧化磷酸化：⟦1|NADH⟧、⟦1|FADH₂⟧⟦2|电子⟧经⟦1|呼吸链⟧传给 ⟦1|O₂⟧，以释放能量合成 ⟦1|ATP⟧；发生于⟦1|线粒体内膜⟧或⟦2|原核⟧⟦1|质膜⟧。"],[1,"③光合磷酸化：光⟦2|驱动⟧电子传递建立⟦1|类囊体⟧膜⟦2|质子梯度⟧，再由 ⟦1|ATP⟧ ⟦1|合酶⟧生成 ⟦1|ATP⟧。"],[1,"⟦2|相同点⟧：均由 ⟦1|ADP⟧ ⟦2|磷酸化⟧生成 ⟦1|ATP⟧。"],[2,"⟦2|不同点⟧。"],[1,"①部位：⟦2|真核⟧中，底物水平磷酸化在⟦2|胞质⟧及⟦1|线粒体⟧⟦2|基质⟧；氧化磷酸化在⟦1|线粒体内膜⟧；光合磷酸化在⟦1|叶绿体类囊体⟧膜。"],[1,"②能量：分别来自⟦1|高能⟧底物、⟦1|NADH⟧/⟦1|FADH₂化学能⟧和⟦1|光能⟧。"],[1,"③氧：底物水平磷酸化不需氧，氧化磷酸化⟦1|需氧⟧，光合磷酸化可放氧。"],[1,"④机制不同。"],[2,"底物水平磷酸化：代谢中间物直接把⟦1|磷酸⟧基转给 ⟦1|ADP⟧，不经过电子传递链。"],[2,"氧化磷酸化：电子传递泵出 ⟦1|H⁺⟧ ，⟦2|质子梯度驱动⟧ ⟦1|ATP⟧ ⟦1|合酶⟧。"],[2,"光合磷酸化：光⟦2|驱动⟧电子传递，形成⟦2|质子梯度⟧并合成 ⟦1|ATP⟧。"],[1,"⑤速度和⟦1|产量⟧：底物水平磷酸化较快但产能少；氧化磷酸化较慢但产能多。"]]],[1,6,1,3,"简述高能磷酸化合物及高能化合物的类型。",[[0,"（1）高能磷酸化合物是⟦2|水解⟧时释放自由能大于 ⟦1|20.92⟧ kJ/⟦1|mol⟧ 的⟦1|磷酸⟧化合物；高能化合物还包括⟦1|硫酯键型⟧和甲⟦1|硫键⟧型等。"],[0,"（2）主要类型和例子。"],[1,"①⟦1|磷氧键⟧型：⟦1|乙酰磷酸⟧、⟦1|1⟧,⟦1|3⟧-⟦1|BPG⟧、氨⟦1|甲酰磷酸⟧、⟦1|ADP⟧ 和 ⟦1|PEP⟧ 等。"],[1,"②⟦1|氮磷⟧键型：⟦1|磷酸肌酸⟧、⟦1|磷酸精氨酸⟧等。"],[1,"③⟦1|硫酯⟧键型：⟦1|酰基⟧-⟦1|CoA⟧ 等。"],[1,"④甲⟦1|硫键⟧型：⟦1|S-腺苷甲硫氨酸⟧等。"]]],[1,6,1,4,"细胞如何调节氧化磷酸化？",[[0,"细胞按能量需求调节氧化磷酸化，速度通常受 ⟦1|ADP⟧ 限制，称⟦1|呼吸受体⟧控制。"],[1,"①⟦1|ADP⟧：⟦1|ATP⟧ 消耗使 ⟦1|ADP⟧ 升高，⟦1|H⁺⟧ 经 ⟦1|ATP⟧ ⟦1|合酶⟧回流，电子传递和⟦1|耗氧⟧加快；⟦1|ATP⟧ 积累使 ⟦1|ADP⟧ 降低，⟦1|呼吸链⟧减慢。"],[1,"②[⟦1|ATP⟧]/（[⟦1|ADP⟧][Pi]）反映⟦2|磷酸化⟧势，[⟦1|NADH⟧]/[⟦1|NAD⁺⟧ ]反映还原状态；其他条件适宜时，⟦1|前者⟧降低、⟦2|后者⟧升高可促进氧化磷酸化。"]]],[1,6,1,5,"支持化学渗透学说的主要证据有哪些？",[[0,"（1）化学渗透学说认为，电子传递能量先形成跨⟦1|内膜⟧⟦2|质子梯度⟧，⟦2|梯度⟧⟦1|势能⟧再⟦2|驱动⟧ ⟦1|ATP⟧ 合成。"],[0,"（2）主要证据。"],[1,"①氧化磷酸化必须有封闭、完整的⟦1|线粒体内膜⟧。"],[1,"②⟦1|内膜⟧不允许 ⟦1|H⁺⟧ 、⟦1|OH⁻⟧ 、⟦1|K⁺⟧ 、⟦1|Cl⁻⟧ ⟦1|等离子⟧自由通过。"],[1,"③破坏 ⟦1|H⁺⟧ ⟦2|梯度⟧会破坏氧化磷酸化。"],[1,"④电子传递可把 ⟦1|H⁺⟧ 由⟦2|基质⟧泵至膜⟦1|间隙⟧。"],[1,"⑤膜⟦2|表面⟧能滞留并快速传递⟦2|质子⟧，速度可超过⟦1|水相⟧。"],[1,"⑥纯化的 ⟦1|F₀ F⟧₁-⟦1|ATP⟧ ⟦1|合酶⟧能直接利用⟦2|质子梯度⟧合成 ⟦1|ATP⟧。"]]],[1,6,1,6,"论述在线粒体生物氧化体系中，电子传递与氧化磷酸化作用的联系（电子传递链和氧化磷酸化之间有何关系）。",[[0,"（1）⟦2|电子⟧由 ⟦1|NADH⟧ 或 ⟦1|FADH₂⟧经⟦2|复合体⟧Ⅰ/Ⅱ、⟦1|CoQ⟧、⟦2|复合体⟧Ⅲ、⟦1|Cyt c⟧ 和⟦2|复合体⟧Ⅳ传给 ⟦1|O₂⟧；同时泵出 ⟦1|H⁺⟧ ，建立⟦2|质子梯度⟧。"],[0,"（2）氧化磷酸化将⟦1|还原型辅酶⟧氧化释放的能量与 ⟦1|ADP⟧ ⟦2|磷酸化偶联⟧，位于线粒体⟦1|内膜⟧或⟦2|原核⟧⟦1|质膜⟧。"],[0,"（3）⟦2|二者⟧关系。"],[1,"⟦1|呼吸链⟧把⟦2|电子⟧传给 ⟦1|O₂⟧并以⟦2|质子⟧⟦1|动势储能⟧，⟦1|ATP⟧ ⟦1|合酶⟧再利用该⟦1|势能⟧合成 ⟦1|ATP⟧。"],[1,"能量状态协调⟦2|二者⟧：⟦1|ATP⟧ 高时抑制 ⟦1|TCA⟧、减少 ⟦1|NADH⟧ 和 ⟦1|FADH₂⟧，⟦1|呼吸链⟧减慢；⟦1|ADP⟧ 高时电子传递和 ⟦1|ATP⟧ 合成加快。"]]],[1,6,1,7,"解偶联剂对电子转移和 P/O 比有什么样的影响？",[[0,"（1）解偶联剂消散⟦2|质子梯度⟧，使电子传递与 ⟦1|ATP⟧ 合成分离；呼吸耗氧可加快，⟦1|ATP⟧ ⟦1|产量⟧下降，能量转为热，充分解⟦2|偶联⟧时 P/O 趋近 ⟦1|0⟧。"],[0,"P/O 比指氧化磷酸化时每消耗 ⟦1|1⟧ 个⟦1|氧原子⟧所生成的 ⟦1|ATP⟧ 数。"],[0,"（2）影响如下。"],[1,"电子传递失去 ⟦1|ATP⟧ 合成的限制，更多能量以热散失，故 P/O 下降；充分解⟦2|偶联⟧时接近 ⟦1|0⟧。"]]],[1,7,0,1,"单纯乳酸发酵（Simple lactic acid fermentation）",[[0,"单纯乳酸发酵是⟦1|丙酮酸⟧在⟦1|乳酸脱氢酶⟧作用下由 ⟦1|NADH⟧ 还原为⟦1|乳酸⟧的过程，只生成⟦1|乳酸⟧且不产气，并可再生⟦1|NAD⁺⟧ 。"]]],[1,7,0,2,"果糖不耐症（fructose intolerance）",[[0,"果糖不耐症是⟦1|肝脏醛缩酶⟧ B 缺乏所致的⟦2|遗传病⟧，摄入⟦1|果糖⟧后 ⟦1|1⟧-⟦1|磷酸果糖⟧积累并消耗⟦1|无机磷酸⟧，使 ⟦1|ATP⟧ 下降并可引起⟦1|乳酸⟧堆积。"]]],[1,7,0,3,"反馈抑制（feedback inhibition）",[[0,"代谢⟦1|终产物⟧积累后，抑制⟦2|途径⟧⟦1|前段⟧关键酶，使⟦1|通路⟧速率下降的快速、可逆调节。它能防止产物⟦2|过量⟧合成，⟦1|节省⟧物质与能量，维持⟦2|代谢物⟧⟦1|稳态⟧。"]]],[1,7,0,4,"Crabtree 效应（反 Pasteur 作用）",[[0,"⟦2|有氧⟧且⟦1|葡萄糖⟧浓度较高时，某些微生物仍⟦1|优先⟧发酵产⟦1|乙醇⟧的现象。这种方式单位底⟦1|物产⟧能较少，但可快速消耗⟦1|碳源⟧，有助于获得⟦2|竞争⟧⟦1|优势⟧。"]]],[1,7,0,5,"双重功能酶（Bifunctional enzyme）",[[0,"一条⟦1|多肽链⟧上具有两个不同活性中心、可催化两种反应的酶。如⟦2|糖原⟧⟦1|脱支酶⟧既转移⟦1|葡萄糖残基⟧，又⟦2|水解⟧⟦1|α-1⟧,⟦1|6⟧-⟦1|糖苷键⟧，从而协调脱支过程。"]]],[1,7,0,6,"半乳糖血症（galactosemia）",[[0,"半乳糖血症是 ⟦1|1⟧-⟦1|磷酸半乳糖尿苷酰⟧转移酶缺乏所致的⟦2|遗传病⟧，使 ⟦1|1⟧-⟦1|磷酸半乳糖⟧和⟦1|半乳糖⟧积累，可损伤肝、脑和⟦1|晶状体⟧。"]]],[1,7,0,7,"丙酮酸脱氢酶复合体（Pyruvate dehydrogenase complex）",[[0,"丙酮酸脱氢酶复合体是⟦1|线粒体⟧⟦2|基质⟧中催化⟦1|丙酮酸⟧氧化⟦2|脱羧⟧生成⟦1|乙酰⟧-⟦1|CoA⟧ 的⟦1|多酶⟧⟦2|复合体⟧，由 ⟦1|E1⟧、⟦1|E2⟧、⟦1|E3⟧ 及 ⟦1|TPP⟧、⟦1|硫辛酸⟧、⟦1|CoA⟧、⟦1|FAD⟧、⟦1|NAD⁺⟧ 组成。"]]],[1,7,0,8,"中心代谢",[[0,"中心代谢是以⟦1|糖酵解⟧和三⟦1|羧酸⟧⟦2|循环⟧为⟦2|核心⟧的基础代谢⟦1|网络⟧，⟦1|连接糖⟧、⟦2|脂质⟧和⟦1|氨基酸⟧的分解、供能与生物合成。"]]],[1,7,0,9,"无效循环（futile cycle）/底物循环（substrate cycle）",[[0,"无效循环是同一对⟦2|代谢物⟧的正、⟦1|逆反应⟧由不同酶催化并同时进行的循环；两向速率相等时只消耗 ⟦1|ATP⟧ 而无净产物，但可用于调节代谢⟦1|通量⟧。"]]],[1,7,0,10,"乳糖不耐症（lactose intolerance）",[[0,"乳糖不耐症是⟦1|小肠乳糖酶⟧不足导致⟦1|乳糖⟧不能充分⟦1|消化⟧的⟦1|障碍⟧；⟦1|未消化乳糖⟧产生渗透⟦2|效应⟧并被⟦1|肠菌⟧发酵，可引起腹胀、⟦1|腹痛⟧和腹泻。"]]],[1,7,0,11,"高尿酸血症（hyperuricemia）",[[0,"高尿酸血症是⟦1|尿酸⟧生成过多或排泄减少导致⟦1|血尿酸⟧持续升高的代谢异常，⟦1|尿酸⟧盐⟦1|沉积⟧可引发⟦1|痛风⟧和⟦1|肾结石⟧。"]]],[1,7,0,12,"糖原贮积症（glycogen storage disease）",[[0,"⟦2|糖原⟧⟦1|代谢酶⟧缺陷引起的⟦2|遗传病⟧，可使⟦2|糖原过量⟧或结构异常，积聚于肝、⟦2|肌肉⟧等组织。按⟦1|缺陷酶⟧不同有多种⟦1|亚型⟧，可表现为肝大、⟦1|低血糖⟧或⟦1|肌无力⟧。"]]],[1,7,1,1,"糖酵解、戊糖磷酸途径和糖异生途径之间的关系。",[[0,"（1）⟦1|G6P⟧、⟦1|F6P⟧ 和 ⟦1|GAP⟧ 联系三条途径。"],[1,"①⟦1|G6P⟧ 是 ⟦1|HMP⟧ ⟦1|起点⟧；⟦1|HMP⟧ 非氧化相可生成 ⟦1|F6P⟧ 和 ⟦1|GAP⟧。"],[1,"②⟦2|饥饿⟧或⟦1|运动⟧时，这些中间物可经糖异生补充⟦1|血糖⟧。"],[1,"③它们也可进入 ⟦1|EMP⟧ 并生成⟦1|丙酮酸⟧。"],[0,"（2）⟦1|HMP⟧ 与 ⟦1|EMP⟧ 按需要协调 ⟦1|NADPH⟧、⟦1|R5P⟧、⟦1|ATP⟧ 和⟦1|丙酮酸⟧的生成。"],[0,"（3）⟦1|HMP⟧ 非氧化相的⟦1|转酮⟧、⟦1|转醛⟧反应可逆，使 ⟦1|F6P⟧ 和 ⟦1|GAP⟧ 能在 ⟦1|HMP⟧ 与 ⟦1|EMP⟧ 间转移。"],[0,"（4）⟦1|EMP⟧ 与糖异生除 ⟦1|3⟧ 个不可逆⟦2|步骤⟧外其余反应⟦1|共用⟧，⟦1|两者⟧相反调节以维持⟦1|血糖⟧。"]]],[1,7,1,2,"试比较己糖激酶和葡萄糖激酶。",[[0,"①分布：⟦1|己糖⟧激酶存在于多数组织；葡萄糖激酶主要存在于⟦1|肝细胞⟧和⟦1|胰岛⟧β细胞。"],[0,"②底物：⟦1|己糖⟧激酶可⟦2|磷酸化⟧多种⟦1|己糖⟧；葡萄糖激酶主要作用于葡萄糖。"],[0,"③⟦1|动力学⟧：⟦1|己糖⟧激酶 Km 低、⟦2|亲和力⟧高、⟦1|Vmax⟧ 较低；葡萄糖激酶 Km 高、⟦2|亲和力⟧较低、⟦1|Vmax⟧ 较高。"],[0,"④调节：⟦1|己糖⟧激酶受 ⟦1|G6P⟧ 反馈抑制；肝葡萄糖激酶不受 ⟦1|G6P⟧ 抑制，但受调节⟦1|蛋白⟧控制，并可由⟦1|胰岛素⟧⟦2|诱导⟧表达。"],[0,"⑤作用：⟦1|己糖⟧激酶保证⟦1|低血糖⟧时组织用糖；葡萄糖激酶促餐后肝⟦1|摄糖⟧、⟦1|储糖⟧，并参与β细胞感受⟦1|血糖⟧。"]]],[1,7,1,3,"简述激素参与磷酸果糖激酶-1 活性的调控的过程。",[[0,"肝内胰⟦1|高血糖素⟧和⟦1|胰岛素⟧通过 ⟦1|F-2⟧,⟦1|6⟧-BP 调节 ⟦1|PFK-1⟧。"],[1,"①⟦1|低血糖⟧时，胰⟦1|高血糖素⟧经 ⟦1|cAMP⟧ 使双功能酶⟦2|磷酸化⟧，激活 ⟦1|FBPase-2⟧、抑制 ⟦1|PFK-2⟧；⟦1|F-2⟧,⟦1|6⟧-BP 下降，⟦1|PFK-1⟧受抑，⟦1|糖酵解⟧减慢。"],[1,"②⟦1|高血糖⟧时，⟦1|胰岛素⟧促双功能酶去⟦2|磷酸化⟧，激活 ⟦1|PFK-2⟧；⟦1|F-2⟧,⟦1|6⟧-BP 升高，激活 ⟦1|PFK-1⟧ 并抑制 ⟦1|FBPase-1⟧，⟦1|糖酵解⟧加快。"]]],[1,7,1,4,"（1）疾跑开始，什么原因导致乳酸浓度急剧上升？（2）疾跑过后，什么原因导致乳酸浓度又会下降？",[[0,"为什么乳酸的下降速率要缓于上升速率？"],[0,"（1）疾跑时⟦1|供氧⟧及氧化⟦2|能力⟧不能满足需求，⟦1|丙酮酸⟧更多还原为乳酸，再生 ⟦1|NAD⁺⟧ 以维持⟦1|糖酵解⟧快速供 ⟦1|ATP⟧，血乳酸迅速升高。"],[0,"（2）⟦1|运动⟧后，乳酸在⟦1|心肌⟧等组织氧化，或在肝内⟦1|异生⟧为⟦1|葡萄糖⟧，血乳酸逐渐下降。"],[0,"（3）生成依靠快速⟦1|糖酵解⟧；清除受转运、氧化⟦2|能力⟧和肝⟦2|糖异生⟧速率限制，⟦2|糖异生⟧还耗 ⟦1|ATP⟧，故下降通常慢于上升。"]]],[1,7,1,5,"催化 2,6 -二磷酸果糖（F-2,6-BP）合成和分解的酶位于一条单一的多肽链上，请解释这个多功能蛋白质在糖酵解调控中的意义。",[[0,"⟦1|PFK-1⟧ 是糖酵解限速酶；⟦1|F-2⟧,⟦1|6⟧-BP 是其⟦1|强激活剂⟧，可提高 ⟦1|PFK-1⟧ 对 ⟦1|F6P⟧ 的⟦2|亲和力⟧并减弱 ⟦1|ATP⟧ 抑制。"],[0,"⟦1|肝型⟧双功能酶的 ⟦1|PFK-2⟧ 合成 ⟦1|F-2⟧,⟦1|6⟧-BP，⟦1|FBPase-2⟧ 分解它，⟦1|共用⟧⟦2|磷酸化⟧开关。⟦1|缺糖⟧时⟦2|磷酸化⟧增强分解、抑制糖酵解；糖充足时去⟦2|磷酸化⟧增强合成、促进糖酵解，可快速协调两种⟦2|活性⟧。"]]],[1,7,1,6,"ATP、ADP、AMP 和柠檬酸在糖酵解和三羧酸循环的代谢调控中的作用？",[[0,"①ATP 高表示能量充足，⟦1|可抑制⟧ ⟦1|PFK-1⟧、⟦1|丙酮酸激酶⟧及 ⟦1|TCA⟧ 关键酶；其结合 ⟦1|PFK-1⟧ ⟦1|别构位点⟧后降低该酶对 ⟦1|F6P⟧的⟦2|亲和力⟧。"],[0,"②ADP、AMP 升高表示缺能，可激活 ⟦1|PFK-1⟧ 等并促进糖酵解；ADP 还激活异柠檬酸⟦1|脱氢酶⟧，AMP 作用与 ATP 相反。"],[0,"③柠檬酸抑制 ⟦1|PFK-1⟧，并反馈抑制柠檬酸⟦1|合酶⟧，提示合成⟦2|前体⟧和能量充足。"]]],[1,7,1,7,"简述糖酵解、三羧酸循环及氧化磷酸化途径之间的协调控制？",[[0,"①三条途径均受能量状态调节：⟦1|ATP⟧/⟦1|ADP⟧ 或 ⟦1|NADH⟧/⟦1|NAD⁺⟧ 高时，糖酵解和 ⟦1|TCA⟧ 减慢；⟦1|比值⟧低时加快。"],[0,"②糖酵解供⟦1|丙酮酸⟧，⟦1|TCA⟧ 氧化其生成的⟦1|乙酰⟧-⟦1|CoA⟧，产生 ⟦1|NADH⟧、⟦1|FADH₂⟧；后⟦1|两者⟧供⟦1|呼吸链⟧合成 ⟦1|ATP⟧，底物⟦1|供需⟧连接⟦1|三者⟧。"],[0,"③关键酶受反馈调节：⟦1|ATP⟧、⟦1|柠檬酸⟧抑制 ⟦1|PFK-1⟧，⟦1|AMP⟧ 激活它；⟦1|ATP⟧、⟦1|NADH⟧ 抑制异⟦1|柠檬酸脱氢酶⟧，⟦1|ADP⟧、⟦1|NAD⁺⟧激活它；⟦1|ADP⟧ ⟦1|供应⟧限制氧化磷酸化。"],[0,"因此，前两途径⟦2|供给⟧⟦1|呼吸链⟧还原⟦1|当量⟧，氧化磷酸化生成的 ⟦1|ATP⟧ 又反馈调节前两途径。"]]],[1,7,1,8,"某人吃过晚饭后直接卧床休息，试分析人体内的各种代谢途径有何变化？对糖分解、糖异生和呼吸链的调控会产生什么影响？",[[0,"（1）代谢变化。"],[1,"①糖代谢。"],[2,"糖分解：饭后⟦1|胰岛素⟧升高，促进⟦1|摄糖⟧、⟦1|糖酵解⟧和⟦2|有氧⟧氧化，并抑制糖异生。"],[2,"⟦2|糖原⟧合成：⟦1|胰岛素⟧激活⟦2           受 ⟦1|CTP⟧、⟦1|UTP⟧ 等反馈抑制"],[1,"最先产物             ⟦1|IMP⟧                             ⟦1|UMP⟧"],[1,"主要⟦2|原料⟧             ⟦1|CO₂⟧、⟦1|Asp⟧、⟦1|Gln⟧、⟦1|Gly⟧、⟦1|甲酰⟧-⟦1|THF⟧ 和 ⟦1|PRPP⟧   ⟦1|CO₂⟧、⟦1|Asp⟧、⟦1|Gln⟧ 和 ⟦1|PRPP⟧"]]],[1,10,1,4,"何谓抗代谢物？简述磺胺药、氨甲蝶呤等药物作用机制。",[[0,"（1）抗代谢物是结构类似正常⟦2|代谢物⟧、能⟦2|竞争⟧抑制关键酶的⟦2|化合物⟧，可抑菌或⟦1|抗癌⟧。"],[0,"（2）磺胺药。"],[1,"①结构似 ⟦1|PABA⟧，⟦2|竞争⟧抑制⟦1|细菌二氢叶酸⟧合成酶，使⟦1|叶酸⟧、一碳单位和⟦1|核苷酸⟧合成受阻。"],[1,"②人不能合成⟦1|叶酸⟧，依靠⟦2|食物⟧获取，故磺胺主要抑制敏感⟦1|细菌⟧。"],[0,"（3）氨甲蝶呤。"],[1,"其结构类似⟦1|叶酸⟧，⟦1|强力⟧抑制⟦1|二氢叶酸还原酶⟧，阻断 ⟦1|THF⟧ 再生及一碳单位转移，抑制⟦1|核苷酸⟧合成，发挥⟦1|抗癌⟧作用。"]]],[1,11,0,1,"反馈调节（Feedback Regulation）",[[0,"指代谢⟦2|途径⟧或⟦2|生理⟧过程中，⟦1|终产物⟧或中间产物反过来⟦2|调控途径⟧起始关键酶的调节方式，分为⟦1|负反馈⟧与正反馈；⟦1|负反馈⟧多见，产物积累时抑制⟦1|上游酶⟧，避免物质⟦1|过度⟧合成；正反馈则促进反应加速。"]]],[1,11,0,2,"反馈阻遏（feedback repression）",[[0,"⟦1|终产物⟧通过抑制相关酶的基因表达，减少酶量及自身合成的⟦1|负反馈⟧机制。它⟦1|调节酶⟧的生物合成，通常较慢而持久；反馈抑制则直接调节⟦1|已有酶⟧⟦2|活性⟧，通常快速、可逆。"]]],[1,11,0,3,"负反馈调节（Negative Feedback Regulation）",[[0,"指代谢或⟦2|生理⟧过程中，产物积累到一定浓度时，反过来抑制上游关键酶或反应⟦2|步骤⟧，使⟦2|途径⟧速度减慢、产物减少的⟦2|调控⟧方式。"]]],[1,11,1,1,"简述机体中α-酮戊二酸的来源、去向。",[[0,"（1）来源。"],[1,"①⟦1|TCA⟧ ⟦1|中异柠檬酸经异柠檬酸脱氢酶⟧生成⟦1|α-KG⟧。"],[1,"②⟦1|Glu⟧ 把⟦1|氨基⟧转给其他⟦1|α-酮酸⟧时生成⟦1|α-KG⟧。"],[1,"③⟦1|Glu⟧ 经⟦1|谷氨酸脱氢酶⟧氧化⟦2|脱氨⟧生成⟦1|α-KG⟧ 和氨。"],[0,"（2）去向。"],[1,"①经⟦1|α-KG⟧ ⟦1|脱氢酶⟧生成⟦1|琥珀酰⟧-⟦1|CoA⟧，继续 ⟦1|TCA⟧。"],[1,"②接受⟦1|氨基⟧生成 ⟦1|Glu⟧ 和另一⟦1|α-酮酸⟧。"],[1,"③经 ⟦1|Glu⟧ 生成 ⟦1|Pro⟧、⟦1|Arg⟧ 等 ⟦1|Glu⟧ 族⟦1|氨基酸⟧。"],[1,"④经 ⟦1|TCA⟧ 生成 ⟦1|OAA⟧ 后可用于⟦2|糖异生⟧。"]]],[1,11,1,2,"简述机体中延胡索酸的来源、去向",[[0,"（1）来源。"],[1,"①⟦1|TCA⟧ 中由⟦1|琥珀酸⟧脱氢生成。"],[1,"②尿素循环中由⟦1|精氨琥珀酸⟧裂解生成。"],[1,"③⟦1|Phe⟧、⟦1|Tyr⟧ 分解可生成。"],[1,"④⟦1|AMP⟧ 合成中⟦1|腺苷酸琥珀酸⟧裂解可生成。"],[0,"（2）去向。"],[1,"①经延胡索酸酶生成⟦1|苹果酸⟧，继续 ⟦1|TCA⟧。"],[1,"②经 ⟦1|OAA⟧ 进入⟦2|糖异生⟧。"]]],[1,11,1,3,"试从底物或产物浓度及变构剂对糖代谢的调节，讨论在饥饿情况下，糖异生作用增强的机制。",[[0,"①底物：饥饿时⟦1|血糖⟧和 ⟦1|EMP⟧ 底物减少，而⟦1|乳酸⟧、⟦2|甘油⟧、生糖氨基酸等⟦2|糖异生⟧底物增加。"],[0,"②产物：⟦1|葡萄糖⟧较低，对⟦2|糖异生⟧的反馈限制减弱。"],[0,"③⟦1|乙酰⟧-⟦1|CoA⟧：⟦1|脂肪酸β-⟧氧化使其升高，激活⟦1|丙酮酸羧化酶⟧、抑制⟦1|丙酮酸脱氢酶⟧，使⟦1|丙酮酸⟧转向⟦2|糖异生⟧。"],[0,"④⟦1|ATP⟧、⟦1|柠檬酸⟧：⟦2|脂肪⟧氧化供能使⟦2|二者⟧升高，抑制⟦1|糖酵解⟧并促进 ⟦1|FBPase-1⟧ 方向，推动⟦2|糖异生⟧。"]]],[1,12,0,1,"NAD+和 NADP+",[[0,"⟦1|NAD⁺⟧ 和 ⟦1|NADP⁺⟧ 是⟦1|烟酰胺⟧形成的⟦1|辅酶⟧Ⅰ和⟦1|辅酶⟧Ⅱ，均可接受氢和⟦2|电子⟧；⟦1|NAD⁺⟧ 主要参与分解代谢和⟦1|呼吸链⟧产能，⟦1|NADP⁺⟧ 还原后形成 ⟦1|NADPH⟧，主要为合成代谢和⟦1|抗氧化⟧提供还原力。"]]],[1,12,0,2,"FMN 和 FAD",[[0,"FMN 和 FAD 是⟦1|核黄素⟧形成的⟦1|黄素辅酶⟧，均可接受并传递⟦2|电子⟧和⟦2|质子⟧；FMN 主要参与⟦1|呼吸链⟧传递，FAD 常作为⟦1|脱氢酶⟧辅基参与 ⟦1|TCA⟧ ⟦2|循环⟧和⟦1|脂肪酸⟧氧化。"]]],[1,12,0,3,"辅酶 A（coenzyme A）",[[0,"由⟦1|泛酸⟧、⟦1|巯基乙胺⟧及含⟦1|腺嘌呤⟧、⟦1|核糖⟧、⟦1|磷酸⟧的部分组成，带⟦2|活性⟧⟦1|巯基⟧。它携带⟦1|乙酰基⟧、脂⟦1|酰基⟧等，⟦1|参与糖⟧、⟦2|脂质⟧及⟦1|氨基酸⟧代谢，是 ⟦1|TCA⟧、⟦1|脂肪酸⟧合成与氧化的重要辅酶。"]]],[1,12,0,4,"脂溶性维生素（fatsoluble vitamin）",[[0,"是不溶于水、⟦1|易溶⟧于⟦2|脂肪⟧及⟦1|脂溶剂⟧的一类⟦1|维生素⟧，包括⟦1|维生素⟧ A、D、E、K；它们的吸收常伴随⟦2|脂肪⟧吸收，且排泄缓慢，可在体内，尤其在肝内⟦2|储存⟧，⟦2|过量⟧易⟦1|蓄积中毒⟧。"]]],[1,12,0,5,"水溶性维生素（water-soluble vitamin）",[[0,"是⟦1|易溶⟧于水、不溶于非⟦2|极性⟧⟦1|有机溶剂⟧的一类⟦1|维生素⟧，包括 B 族⟦1|维生素⟧、⟦1|硫辛酸⟧和⟦1|维生素⟧ C；它们在体内⟦2|储存⟧极少，需日常持续摄入，缺乏⟦1|时易⟧快速出现⟦1|缺乏症⟧，多余部分随⟦1|尿液⟧排出，不易⟦1|蓄积中毒⟧。"]]],[1,12,0,6,"四氢叶酸（tetrahydrofolate，THF）",[[0,"是⟦1|叶酸⟧的⟦2|活性⟧⟦1|辅酶⟧形式，作为一碳单位的⟦1|载体⟧参与体内一碳单位代谢；它可携带⟦1|甲基⟧、亚⟦1|甲基⟧、甲⟦1|酰基⟧等一碳基团，参与⟦2|嘌呤⟧、⟦2|嘧啶⟧⟦1|核苷酸⟧合成及⟦1|氨基酸⟧转化，是⟦1|核酸⟧与蛋白质合成的关键⟦1|辅酶⟧。"]]],[1,12,0,7,"维生素（vitamin）",[[0,"是参与生物生长发育和代谢必需的一类⟦1|微量有机⟧物质；这⟦1|类物质⟧由于体内不能合成或者合成量不足，所以虽然⟦1|需要量⟧很少，但必须由⟦2|食物供给⟧。"]]],[1,12,0,8,"维生素缺乏症（avitaminosis）",[[0,"因⟦1|维生素⟧不足引起的⟦2|疾病⟧，常由摄入不足、吸收⟦1|障碍⟧或⟦2|疾病⟧所致。不同⟦1|维生素⟧缺乏有相应表现，如⟦1|维生素⟧ A缺乏可致⟦1|夜盲⟧，⟦1|维生素⟧ D 缺乏可致⟦1|佝偻病⟧。"]]],[1,12,0,9,"第二信使（second messenger）",[[0,"⟦1|胞外⟧⟦2|信号⟧⟦1|激活受体⟧后，在⟦1|胞内⟧生成或释放的小分子及⟦2|离子⟧，如 ⟦1|cAMP⟧、⟦1|Ca²⁺⟧ 。它们通过浓度变化⟦1|调节酶⟧和其他⟦1|蛋白⟧⟦2|活性⟧，将⟦1|受体⟧⟦2|信号⟧在⟦1|胞内⟧传递、放大。"]]],[1,12,0,10,"G 蛋白（GTP binding protein）",[[0,"能结合⟦1|鸟嘌呤核苷酸⟧并⟦2|水解⟧ GTP 的⟦2|信号⟧蛋白。结合 GTP 时⟦2|活化⟧，⟦2|水解⟧为 ⟦1|GDP⟧ 后⟦2|失活⟧；异⟦1|三聚体⟧ G 蛋白连接⟦1|膜受体⟧与⟦2|效应⟧分子，传递⟦1|激素⟧、⟦1|神经递质⟧⟦2|信号⟧并调节代谢。"]]],[1,12,0,11,"G 蛋白偶联受体（G-protein-coupled receptor）",[[0,"G 蛋白⟦1|偶联受体⟧是含 ⟦1|7⟧ 次⟦1|跨膜α-⟧⟦2|螺旋⟧并⟦1|与胞⟧内 G 蛋白偶联的⟦1|膜受体⟧；⟦2|配体⟧结合使其⟦1|构象⟧改变，继而激活 G 蛋白、⟦1|效应酶⟧和⟦1|第二信使⟧，⟦1|把胞⟧外⟦2|信号⟧传入细胞。"]]],[1,12,0,12,"脱敏作用（desensitization）",[[0,"⟦1|指受体⟧长期持续接触⟦1|激素⟧等⟦2|信号⟧分子后，对其⟦1|敏感性⟧显著降低的现象；常由于⟦1|受体⟧⟦2|磷酸化⟧修饰、内吞降解等导致，表现为⟦1|第二信使⟧生成减少、⟦2|信号⟧⟦1|通路⟧减弱。"]]],[1,12,0,13,"级联放大（cascade amplification）",[[0,"是细胞⟦1|信号转导⟧中的重要⟦2|效应⟧，指⟦1|激素⟧等⟦1|第一信使⟧与⟦1|受体⟧结合后，通过一系列⟦1|连续酶⟧促反应，⟦1|使胞⟧内⟦2|信号⟧呈⟦1|指数⟧级增强的过程；其作用是提高⟦2|信号⟧传递效率与⟦1|灵敏度⟧，是⟦1|激素⟧快速⟦2|调控⟧代谢的关键方式。"]]],[1,12,0,14,"cAMP（cyclic AMP）",[[0,"是⟦1|经典⟧的细胞内⟦1|第二信使⟧，由⟦1|腺苷酸环化酶⟧催化 ⟦1|ATP⟧ 环⟦1|化生成⟧；它通过激活蛋白⟦1|激酶⟧ A（⟦1|PKA⟧），⟦1|启动⟧下游⟦2|磷酸化⟧⟦1|级联⟧反应，传递并放大⟦1|激素⟧、⟦1|神经递质等胞⟧外⟦2|信号⟧。"]]],[1,12,0,15,"受体（receptor）",[[0,"主要是存在于⟦1|细胞膜⟧或细胞内的⟦2|特异性⟧蛋白质，少数为⟦1|脂类⟧。能⟦1|选择性⟧识别并结合⟦1|激素⟧、⟦1|神经递质⟧等⟦2|配体⟧，进而触发细胞⟦1|信号转导⟧；它具有⟦2|特异性⟧、高⟦2|亲和力⟧、饱和性等特点。"]]],[1,12,0,16,"激素（hormone）",[[0,"由⟦1|内分泌⟧细胞或⟦1|腺体⟧合成并分泌的⟦1|微量⟧高效⟦2|化学信号⟧物质，通过⟦1|体液⟧⟦2|运输⟧作用于⟦1|靶细胞受体⟧；它具有⟦2|特异性⟧、⟦1|高效性⟧、放大⟦2|效应⟧等特点。"]]],[1,12,0,17,"主动运送（主动运输）（active transport）",[[0,"指物质在⟦1|载体蛋白⟧协助下，逆⟦1|浓度梯度⟧或⟦1|电化学⟧⟦2|梯度⟧并消耗能量进行的⟦1|跨膜⟧转运方式；其特点是普遍存在于⟦1|动植物⟧和微生物细胞中，并具有⟦2|特异性⟧、饱和性和需能性。"]]],[1,12,0,18,"腺苷酸环化酶（adenylate cyclase ）",[[0,"是位于⟦1|细胞膜⟧上的⟦1|信号转导⟧关键酶，受 G ⟦1|蛋白⟧⟦2|调控⟧，它以 ⟦1|ATP⟧ 为底物，催化生成 ⟦1|cAMP⟧；该酶参与多种⟦1|激素⟧、⟦1|神经递质⟧的⟦2|信号⟧传递，广泛调节细胞代谢、基因表达等过程，是重要的⟦2|效应⟧分子。"]]],[1,12,0,19,"光合磷酸化（photophosphorylation）",[[0,"⟦1|指光⟧⟦2|驱动⟧的生物光系统捕获的⟦1|光能⟧一部分能量转化为 ⟦1|ATP⟧ 的⟦1|磷酸键能⟧的过程；具体来说，它主要发生在⟦1|叶绿体⟧的⟦1|类囊体⟧膜或⟦2|原核⟧生物⟦1|质膜⟧上，光能⟦2|驱动⟧电子传递，建立⟦1|跨膜⟧⟦2|质子梯度⟧，推动 ⟦1|ATP⟧ ⟦1|合酶⟧将 ⟦1|ADP⟧ 转变为 ⟦1|ATP⟧。"]]],[1,12,0,20,"酰基载体蛋白（acylcarrier protein，ACP）",[[0,"一种相对分子⟦1|质量⟧较低的蛋白质，是⟦1|脂肪酸⟧合成过程中的⟦1|核心载体蛋白⟧；在⟦1|脂肪酸合酶⟧⟦2|复合体⟧中，它负责转运、传递⟦1|酰基⟧中间产物，使⟦1|碳链⟧逐步延长，是⟦1|脂肪酸⟧从头合成的关键功能⟦2|组分⟧。"]]],[1,12,1,1,"为什么叶酸和维生素 B12 缺乏都会出现巨幼红细胞性贫血?",[[0,"①叶酸缺乏使 ⟦1|THF⟧ 携带的一碳单位不足，⟦2|嘌呤⟧和 ⟦1|dTMP⟧ 合成受阻；⟦1|骨髓细胞⟧ ⟦1|DNA⟧ 复制、分裂变慢，形成易破坏的巨幼红细胞。"],[0,"②⟦1|B₁₂⟧缺乏阻碍⟦1|甲基⟧-⟦1|THF⟧ 再生 ⟦1|THF⟧，间接造成叶酸⟦1|陷阱⟧和 ⟦1|DNA⟧ 合成⟦1|障碍⟧，也使红细胞成熟受阻。"],[0,"因此，⟦1|两者⟧均因⟦1|核苷酸⟧和 ⟦1|DNA⟧ 合成不足导致巨幼红细胞性贫血。"]]],[1,12,1,2,"简述脚气病的发病机理。",[[0,"（1）脚气病由 ⟦1|B₁⟧缺乏引起。其⟦2|活性⟧形式 ⟦1|TPP⟧ 是⟦1|丙酮酸⟧、⟦1|α-KG⟧、⟦1|支链α-酮酸脱氢酶⟧及⟦1|转酮酶⟧的⟦1|辅酶⟧。"],[0,"（2）⟦1|TPP⟧ 不足使糖⟦2|有氧⟧氧化和⟦1|磷酸戊糖⟧⟦2|途径⟧受阻，⟦1|ATP⟧ 生成减少，⟦1|丙酮酸⟧和⟦1|乳酸⟧积累。"],[0,"（3）⟦1|神经⟧和⟦1|心肌⟧对能量⟦1|障碍⟧敏感，易出现周围神经损伤、⟦1|肌无力⟧、⟦1|心功能⟧不全和⟦1|水肿⟧。"]]],[1,12,1,3,"胰岛素有无四级结构，为什么？简述其合成过程及这种方式的意义。",[[0,"（1）⟦2|活性⟧胰岛素⟦1|单体⟧的 A、B 链以⟦1|二硫键⟧相连，不作为四级结构；但胰岛素可聚成⟦1|二聚体⟧或⟦2|储存⟧性六⟦1|聚体⟧，⟦2|后者⟧有四级结构。"],[0,"（2）⟦1|信号肽⟧引导前胰岛素⟦1|原入内质网⟧并被切除，生成带 ⟦1|3⟧ 个⟦1|二硫键⟧的胰岛素原；分泌⟦1|颗粒⟧中切去 C 肽，成熟胰岛素与 C 肽同释放。"],[0,"（3）⟦2|前体⟧形式利于正确折叠、⟦2|储存⟧及按需释放，避免过早起效；成熟胰岛素促⟦2|糖原⟧、⟦2|脂肪⟧和蛋白质合成，降低⟦1|血糖⟧。"]]],[1,12,1,4,"哪几种激素参与血糖调节？说明他们的化学本质发生部位及各自的调节代谢的作用机制。",[[0,"（1）肾上腺素。"],[1,"①为 ⟦1|Tyr⟧ ⟦2|衍生物⟧，由肾上腺⟦1|髓质⟧产生；⟦1|经受体⟧-G ⟦1|蛋白⟧-⟦1|cAMP-PKA⟧ ⟦1|级联⟧促进⟦1|糖原分解⟧，肝⟦1|糖原分解⟧可迅速升高血糖。"],[1,"②经 ⟦1|cAMP-PKA⟧ 促进 ⟦1|PEPCK⟧ 等⟦1|糖异生酶⟧表达，增强⟦2|糖异生⟧。"],[1,"③还通过降低 ⟦1|F-2⟧,⟦1|6⟧-BP 等方式促进 ⟦1|FBPase-1⟧ 方向，使⟦2|糖异生⟧增强。"],[0,"（2）胰⟦1|高血糖素⟧：为⟦1|胰岛⟧α细胞肽类激素，经⟦1|肝细胞⟧ ⟦1|cAMP-PKA⟧ 促进⟦1|糖原分解⟧和⟦2|糖异生⟧，升高血糖。"],[0,"（3）⟦1|胰岛素⟧：为⟦1|胰岛⟧β细胞肽类激素，血糖升高时分泌，作用如下。"],[1,"①降低 ⟦1|cAMP⟧ 并促去⟦2|磷酸化⟧，激活⟦2|糖原⟧⟦1|合酶⟧、抑制⟦2|糖原⟧⟦1|磷酸化酶⟧，促进⟦2|糖原⟧合成。"],[1,"②促进 ⟦1|GLUT4⟧ 转位，增强⟦2|肌肉⟧和⟦2|脂肪⟧摄取⟦1|葡萄糖⟧。"],[1,"③⟦2|诱导⟧⟦1|葡萄糖激酶⟧、⟦1|PFK⟧ 和⟦1|丙酮酸激酶⟧，促进⟦1|糖酵解⟧和氧化。"],[1,"④拮抗升糖激素，下调 ⟦1|PEPCK⟧、⟦1|G6P⟧ 酶等，抑制⟦2|糖异生⟧。"]]],[1,12,1,5,"简述激素的分类。",[[0,"（1）按⟦2|化学⟧本质分类。"],[1,"①肽类：⟦1|催产素⟧、⟦1|胰岛素⟧等。"],[1,"②⟦1|儿茶酚胺⟧类：肾上腺素、⟦1|去甲⟧肾上腺素、⟦1|多巴胺⟧。"],[1,"③甲状腺激素：⟦1|T₄⟧、⟦1|T₃⟧。"],[1,"④⟦1|类固醇⟧：⟦1|皮质醇⟧、⟦1|孕酮⟧、⟦1|性激素⟧等。"],[1,"⑤⟦1|维生素⟧ D 激素：如 ⟦1|1⟧,⟦1|25⟧-二羟⟦1|维生素⟧ D。"],[1,"⑥二十烷⟦1|酸类⟧：⟦1|前列腺素⟧、⟦1|血栓⟧烷、⟦1|白三烯⟧。"],[1,"⑦类⟦1|视黄醇⟧：如⟦1|视黄酸⟧。"],[1,"⑧⟦1|气体⟧⟦2|信号⟧：如 NO。"],[0,"（2）按作用方式分类。"],[1,"①⟦1|水溶性⟧激素通常不能直接穿膜，⟦1|结合膜受体⟧后经⟦1|第二信使⟧或⟦1|蛋白⟧⟦2|信号⟧⟦1|通路⟧作用，如肽类、⟦1|儿茶酚胺⟧类。"],[1,"②⟦1|脂溶性激素穿膜后与胞内受体⟧结合，调节转录，如⟦1|类固醇⟧、⟦1|维生素⟧ D、甲状腺激素、⟦1|视黄酸⟧。"],[1,"③NO 穿膜后激活⟦2|胞质⟧⟦1|鸟苷酸环化酶⟧，以 ⟦1|cGMP⟧ 传递⟦2|信号⟧。"]]],[1,12,1,6,"请阐述维生素与代谢的关系？",[[0,"维生素是⟦1|生长⟧、⟦1|发育⟧和代谢必需的⟦1|微量⟧有机物，多数不能合成或合成不足，须由⟦2|食物供给⟧。"],[0,"维生素不供能，也不作碳⟦1|氮源⟧或结构成分。脂溶性维生素多直接调节；水溶性维生素多组成⟦1|辅酶⟧、辅基，缺乏会致代谢⟦1|障碍⟧。"]]],[1,13,0,1,"沉默子（silencer）",[[0,"是⟦2|真核⟧生物中⟦1|可抑制⟧基因转录的顺式作用 ⟦1|DNA⟧ 序列；沉默子通常位于基因的上游或下游区域，有时也存在于⟦1|内含子⟧中，其作用具有组织和⟦1|时序⟧⟦2|特异性⟧。"]]],[1,13,0,2,"基因组印记（genomic imprinting）",[[0,"指来自⟦1|父方⟧或⟦1|母方⟧的⟦1|等位基因⟧，因 ⟦1|DNA⟧ ⟦2|甲基化⟧等修饰发生差异性表达，一方表达、另一方沉默的现象；⟦2|失活⟧的基因带有⟦1|印记⟧，其 ⟦1|DNA⟧ 被⟦2|甲基化⟧、组蛋白被修饰，是一种表观遗传现象。"]]],[1,13,0,3,"结构基因（structural gene）",[[0,"又称⟦2|编码⟧基因，是⟦2|基因组⟧中负责⟦2|编码⟧特定蛋白质或 ⟦1|RNA⟧ 分子的 ⟦1|DNA⟧ 序列；在结构上，⟦2|原核⟧生物中常以操纵子形式成簇排列，⟦2|真核⟧生物多为⟦1|断裂基因⟧，含⟦1|内含子⟧与⟦1|外显子⟧，是⟦2|遗传信息⟧表达与执行的⟦2|核心⟧部分。"]]],[1,1
