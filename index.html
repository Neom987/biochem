[1, 1, 1, 2, "简要叙述细菌的形态结构、类型及在生态环境中的作用，它们与人类有什么关系？", [[0, "大多数⟦2|细菌⟧个体微小，为单⟦2|细胞⟧，有球状、杆状或螺旋状三种形态。细菌没有膜包被的细胞核，只有一个环状的DNA分子，位于细菌细胞内特定的区域内，称为拟核区。细菌细胞质中有散在的核糖体，没有线粒体等细胞器。除支原体外，细菌有以⟦1|肽聚糖⟧为主要成分的⟦1|细胞壁⟧。有些细菌还具有鞭毛、芽孢和荚膜等特殊结构。很多细菌的细胞质中还含有小的环状DNA分子，称为质粒，为染色体外的遗传物质。"], [0, "（1）⟦1|细菌⟧的营养和⟦2|代谢⟧类型多样化，根据碳的来源、能量来源及电子供体性质可分为⟦1|4种⟧营养类型。"], [1, "① 光能⟦1|自养⟧型，以CO₂为唯一或主要⟦2|碳源⟧，以光为能源；② 化能自养型，以CO₂为主要碳源，从无机物氧化获得⟦2|能量⟧。光能⟦1|异养⟧型以有机物为碳源、以光为能源；化能异养型以有机物为碳源和能源。"], [0, "（2）根据⟦1|细菌⟧对氧的需求，分为需氧菌、⟦1|厌氧⟧菌、兼性厌氧菌、微需氧菌、耐氧菌5大类。"], [0, "（3）⟦1|细菌⟧在生态环境中的作用：细菌是自然界的分解者。细菌的⟦2|代谢⟧对自然界的物质循环十分重要，自然界如果没有细菌，物质的循环就不可能实现，动、植物的尸体就将堆积如山；"], [1, "② 由于⟦1|细菌⟧的作用，尸体被分解，复杂的有机物如⟦2|蛋白质⟧等分解为简单的化合物，被植物根部所吸收。"], [0, "（4）与人类的关系：⟦1|细菌⟧与人类关系密切。在环境污染检测和治理、工农业、医药上广泛应用，也引发多种疾病。"]], 0],
[1, 1, 1, 3, "比较单细胞微生物和菌丝状微生物。", [[0, "比较如表格所示："], [0, "含水状态：⟦2|细菌⟧ 很湿或较湿；⟦1|酵母菌⟧ 较湿；⟦1|放线菌⟧ 干燥或较干燥；霉菌 干燥"], [0, "外观⟦2|形态⟧：⟦2|细菌⟧ 小而突起或大而平坦；⟦1|酵母菌⟧ 大而突起；⟦1|放线菌⟧ 小而紧密；霉菌 大而疏松或大而致密"], [0, "相互关系：⟦2|细菌⟧ 单个分散或有一定陈列方式；⟦1|酵母菌⟧ 单个分散或假丝状；⟦1|放线菌⟧ 丝状交织"], [0, "⟦2|形态⟧特征：⟦2|细菌⟧ 小而均匀，个别有芽孢；⟦1|酵母菌⟧ 大而分化；⟦1|放线菌⟧ 细而均匀；霉菌 粗而分化"], [0, "菌落透明度：⟦2|细菌⟧ 透明或稍透明；⟦1|酵母菌⟧ 稍透明；⟦1|放线菌⟧ 不透明"], [0, "菌落与⟦1|培养基⟧结合程度：⟦2|细菌⟧ 不结合；酵母菌 牢固结合；⟦1|放线菌⟧ 较牢固结合"], [0, "菌落颜色：⟦2|细菌⟧ 多样；⟦1|酵母菌⟧ 单调，一般呈乳脂或蜡烛色，少数红或黑色；⟦1|放线菌⟧ 十分多样"], [0, "⟦1|菌落⟧正反面颜色的差别：⟦2|细菌⟧ 相同；⟦1|酵母菌⟧ 一般不同"], [0, "菌落边缘：⟦2|细菌⟧ 一般看不到⟦2|细胞⟧；⟦1|酵母菌⟧ 可见球状、卵圆状或假丝状细胞；⟦1|放线菌⟧ 有时可见细丝状细胞；霉菌 可见粗丝状细胞"], [0, "⟦2|细胞⟧生长速度：⟦2|细菌⟧ 一般很快；⟦1|酵母菌⟧ 较快；⟦1|放线菌⟧ 慢；霉菌 一般较快"], [0, "气味：⟦2|细菌⟧ 一般有臭味；⟦1|酵母菌⟧ 多带酒香味；⟦1|放线菌⟧ 常有泥腥味；霉菌 往往有霉味"]], 0],
[1, 1, 1, 4, "古细菌有哪些特点，并列举古菌至少三个类群。", [[0, "古⟦1|细菌⟧的特点："], [0, "（1）16SrRNA序列分析：古⟦1|细菌⟧与细菌不相似。"], [0, "（2）⟦1|形态⟧：古⟦2|细菌⟧有扁平直角几何形状的细菌，而细菌从未发现。"], [0, "（3）结构：①古⟦1|细菌⟧⟦1|细胞壁⟧中不含胞壁酸；②古细菌⟦2|细胞⟧质膜含醚键酯及分支烃；③许多古细菌有内含子。"], [0, "（4）中间⟦1|代谢⟧：古⟦2|细菌⟧可有独特的辅酶参与。"], [0, "（4）严格⟦1|厌氧⟧是古⟦1|细菌⟧的主要呼吸类型。"], [0, "（6）生境：大多数古⟦1|细菌⟧生活在高温、极热、高盐、极酸或高度缺氧的极端环境里。"], [0, "（7）繁殖速率：古⟦2|细菌⟧繁殖速率较真细菌缓慢。举例：产甲烷古细菌群、还原硫酸盐古细菌群、极端⟦1|嗜盐⟧古细菌群、无⟦1|细胞壁⟧古细菌群、极端嗜热和超嗜热的⟦2|代谢⟧元素硫的古细菌群。"]], 0],
[1, 1, 1, 5, "什么是极端微生物，有什么价值？", [[0, "（1）定义：极端⟦1|微生物⟧是最适合生活在极端环境中的微生物的总称，包据嗜热、嗜冷、嗜酸、嗜碱、嗜压、嗜金、抗辐射、耐干燥和极端⟦1|厌氧⟧等多种类型。"], [0, "（2）价值：科学家们相信，极端⟦1|微生物⟧是这个星球留给人类独特的生物资源和极其珍贵的科研素材。开展极端微生物的研究，对于揭示生物圈起源的奥秘，阐明生物多样性形成的机制，认识生命的极限及其与环境的相互作用的规律等，都具有极为重要的科学意义。极端微生物中发现的适应机制，还将成为人类在太空中寻找地外生命的理论依据。极端微生物研究的成果，将大大促进微生物在环境保护、人类健康和生物技术等领域的利用。"]], 0],
[1, 1, 1, 6, "试以链莓菌为例，描述这类典型放线菌的菌丝、孢子和菌落的一般特征。", [[0, "⟦1|放线菌⟧是一大群丝状⟦2|细菌⟧的通称。放线菌虽有像霉菌那样的菌丝体并进行孢子繁殖，但⟦2|细胞⟧构造和⟦1|细胞壁⟧的化学组成与细菌相似，对抗细菌剂敏感。链霉菌是一类典型的放线菌。其菌丝、孢子和菌落的一般特征为："], [0, "（1）⟦1|菌丝⟧链⟦1|霉菌⟧的⟦2|细胞⟧星丝状分枝，菌丝直径很小，与⟦2|细菌⟧相似。由于菌丝的连续生长和分枝形成网络状菌丝体结构。在营养生长阶段，菌丝内无隔，内含许多核质体，故一般呈单细胞状态。"], [1, "①基内⟦1|菌丝⟧，为⟦1|营养⟧菌丝，具有吸收水，营养和排泄⟦2|代谢⟧废物等功能。"], [1, "②气生⟦1|菌丝⟧，⟦2|生长⟧致密，覆盖整个⟦1|菌落⟧表面，菌丝呈放射状。"], [1, "③孢子丝，是⟦1|放线菌⟧⟦2|分类⟧⟦2|鉴定⟧的重要指标。链⟦1|霉菌⟧孢子丝的形状和排列多种多样，有直、波曲、钩状、螺旋状、丛生、轮生等。"], [0, "（2）⟦1|孢子⟧孢子丝通过横割分裂方式，产生成串的分生孢子。孢子⟦1|形态⟧多样，有球、椭圆、杆、圆柱、瓜子、梭或半月等形状，其颜色十分丰富，且与其表面纹饰有关。"], [0, "（3）⟦1|菌落⟧特点"], [1, "①小型、干燥、不透明、表面呈致密的丝绒状，上有一薄层彩色的“干粉”。"], [1, "②⟦1|菌落⟧和⟦1|培养基⟧的连接紧密，难以挑取。"], [1, "③⟦1|菌落⟧的正反面颜色常不一致，在菌落边缘的琼脂平面有变形的现象。"]], 0],
[1, 2, 0, 1, "芽痕（bud scar）", [[0, "母⟦1|细胞⟧和子细胞两者⟦2|分离⟧，于是在母细胞上留下一个芽痕而在子细胞上相应地留下了一个蒂痕。"]], 0],
[1, 2, 0, 2, "蒂痕（pediclemarks）", [[0, "母⟦1|细胞⟧和子细胞两者⟦2|分离⟧，于是在母细胞上留下一个芽痕而在子细胞上相应地留下了个蒂痕。任何细胞上的蒂痕仅一个，而芽痕有一至十余个，根据芽痕的多少还可测定该细胞的年龄。"]], 0],
[1, 2, 0, 3, "假菌丝（pseudohyphae）", [[0, "⟦1|酵母菌⟧进行一连串的芽殖后，如果长大的子⟦1|细胞⟧与母细胞不立即⟦2|分离⟧，其间仅以狭小的面积相连，由此形成的藕节状的细胞串⟦2|结构⟧。"]], 0],
[1, 2, 0, 4, "真菌丝（fungalfilament）", [[0, "⟦1|酵母菌⟧进行一连串的芽殖后，如果⟦1|细胞⟧相连，且其间的横隔面积与细胞直径一致，形成的竹节状的细胞串⟦2|结构⟧。"]], 0],
[1, 2, 0, 5, "菌丝（hypha）", [[0, "菌丝是⟦1|霉菌⟧⟦2|营养⟧体的基本单位。它是一根管状的细丝，由⟦1|细胞壁⟧包被，里面充满原生质，幼时通常无色透明，老后呈各种颜色。直径通常为3～⟦1|10um⟧。根据菌丝中有无隔膜可分为有隔菌丝和无隔菌丝。也可以根据菌丝功能可分为营养菌丝、气生菌丝、⟦1|孢子⟧丝（⟦2|繁殖⟧菌丝）。"]], 0],
[1, 2, 0, 6, "菌丝体（mycelium）", [[0, "⟦1|菌丝⟧体是指由许多菌丝连结在一起组成的⟦2|营养⟧体类型。单一丝网状⟦2|细胞⟧称为菌丝，由⟦1|孢子⟧⟦2|生长⟧、发芽而形成的线状结构，肉眼可看的即为菌丝体。"]], 0],
[1, 2, 0, 7, "子实体（fruitingbody）", [[0, "指具有一定⟦2|形态⟧和构造的⟦1|菌丝⟧体组织，在其里面或上面可产生无性或有性⟦1|孢子⟧。"]], 0],
[1, 2, 0, 8, "匍匐菌丝（stolon）", [[0, "葡甸⟦1|菌丝⟧又称匍枝。毛霉目的⟦1|真菌⟧在固体基质上形成的与基质表面平行、具有延伸扩展功能的菌丝。它向上可长出孢囊梗和孢囊，向下则可长出假根。"]], 0],
[1, 2, 0, 9, "菌核（sclerotium）", [[0, "菌核是由若干⟦1|真菌⟧产生的一种形状、大小不一的休眠⟦1|菌丝⟧组织。形状有大有小，大的如茯苓，小的如油菜菌核（鼠粪状）。菌核的外层色深、坚硬，内层疏松，多呈白色。"]], 0],
[1, 2, 0, 10, "单细胞蛋白（singlecell protein，SCP）", [[0, "单⟦1|细胞⟧蛋白指可用工业方法大量生产的⟦2|微生物⟧细胞蛋白，尤其是⟦1|酵母菌⟧蛋白。由于单细胞蛋白可用铵盐、硝酸盐等无机氮源或尿素通过微生物代谢而生产，故对补充动物和人类⟦2|蛋白质⟧营养（食品、饲料、饵料）有童大的意义。"]], 0],
[1, 2, 1, 1, "简要介绍\"9+2\"型鞭毛的结构功能。", [[0, "（1）“9+2\"型⟦1|鞭毛⟧的构造："], [1, "①鞭杆鞭杆的中心有一对包在中央鞘中的相互平行的中央微管其外被⟦1|9个⟧微管二联体围绕一圈，整个微管由⟦1|细胞⟧质膜包裹。每条微管二联体由A，B两条中空的亚纤维组成，其中A亚纤维是一完全微管，而B亚纤维则有10个亚基围成。"], [1, "②嵌埋在⟦1|细胞⟧质膜上的基体"], [1, "③连接鞭杆与基体的过渡区"], [0, "（2）生理功能⟦1|鞭毛⟧是真核⟦1|微生物⟧的运动器官，其各部分的功能表解如下鞭杆：具有能被Ca*和Mg*激活的⟦2|ATP⟧酶，可水解ATP以释放供鞭毛运动的能量“9+2\"型鞭毛 基体：嵌埋在细胞质膜上，固定鞭杆各结构的功能过渡区：连接羧杆与基体"]], 0],
[1, 2, 1, 2, "细菌、放线菌、酵母菌和霉菌细胞壁成分的异同，并提出制备相应原生质体的酶或试剂。", [[0, "（1）⟦1|细菌⟧分为G+和G"], [1, "①G+聚糖和磷壁酸含量较高，脂质一般无，不含⟦1|蛋白质⟧，其⟦1|原生质体⟧制备使用青霉素、溶菌⟦2|酶⟧进行处理。"], [1, "②G-聚糖含量低，不含磷壁酸，脂质与⟦1|蛋白质⟧含量较高，其⟦1|原生质体⟧制备使用EDTA处理，溶菌⟦2|酶⟧进行处理。"], [0, "（2）放线菌为G+，其⟦1|细胞壁⟧具有G+具有的特点。放线菌⟦1|原生质体⟧制备：青霉素、溶菌⟦2|酶⟧处理⟦2|细胞⟧壁。"], [0, "（3）酵母菌和霉菌为真菌，酵母菌的⟦1|细胞壁⟧外层为甘露聚糖，内层为葡聚糖；而霉菌的⟦2|细胞⟧壁成分为几丁质、⟦2|蛋白质⟧、葡聚糖。酵母菌⟦1|原生质体⟧制备：蜗牛消化酶处理细胞壁。而霉菌原生质体制备：纤维素酶处理细胞壁。"]], 0],
[1, 2, 1, 3, "简述八孢裂殖酵母的生活史。", [[0, "八孢裂殖酵母的⟦1|营养⟧体只能以单倍体形式存在。其特点为：营养⟦2|细胞⟧为单倍体；无性繁殖为裂殖方式进行；二倍体细胞不能独立生活，故此期极短。故整个生活史可分为⟦1|4个⟧阶段："], [0, "①单倍体⟦1|营养⟧⟦2|细胞⟧借裂殖方式进行无性繁殖；"], [0, "②两个不同性别的⟦1|营养⟧⟦2|细胞⟧接触后形成⟦1|接合⟧管，质配后即发生核配，于是两个细胞连成一体；"], [0, "③二倍体的核分裂3次（第一次为减数分裂），形成⟦1|8个⟧单倍体的子囊⟦1|孢子⟧；"], [0, "④子囊破裂，释放子囊⟦1|孢子⟧。"]], 0],
[1, 2, 1, 4, "简述路德类酵母的生活史。", [[0, "路德类酵母的⟦2|营养⟧体只能以二倍体形式存在。其特点为：营养体为二倍体，不断进行芽殖，此阶段较长；单倍体阶段仅以子囊⟦1|孢子⟧的形式存在，不能进行独立生活；单倍体的子囊孢子在子囊内发生⟦1|接合⟧。故生活史的具体过程为："], [0, "①两个不同性别的单倍体子囊⟦1|孢子⟧在子囊内成对⟦1|接合⟧，并发生质配和核配；"], [0, "②⟦1|接合⟧后的二倍体⟦1|细胞⟧萌发，穿破子囊壁；"], [0, "③二倍体的⟦1|营养⟧⟦2|细胞⟧可独立生活，通过芽殖方式进行无性繁殖；"], [0, "④在二倍体⟦2|营养⟧⟦2|细胞⟧内的核发生减数分裂，故营养细胞成为子囊，其中形成⟦1|4个⟧单倍体子囊⟦1|孢子⟧。"]], 0],
[1, 2, 1, 5, "以粗糙脉孢菌（或任意具有菌丝的真菌）为例，简述菌丝延伸及成熟过程中细胞壁成分的变化。", [[0, "以粗糙脉孢菌为例，⟦1|菌丝⟧⟦2|生长⟧是由菌丝顶端⟦2|细胞⟧的不断延伸而实现的，随着顶端不断向前伸展，⟦1|细胞壁⟧和细胞质的形态、成分都逐渐变化、加厚并趋向成熟。菌丝尖端细胞的分化过程及其成分变化过程如下："], [0, "（1）⟦1|菌丝⟧顶端的延伸区和硬化区：⟦1|细胞壁⟧的内层是几丁质层，外层为⟦2|蛋白质⟧层；"], [0, "（2）亚顶端部位即次生壁形成区：由内至外是几丁质层、⟦1|蛋白质⟧层和葡聚糖蛋白网层；"], [0, "（3）成熟区：由内至外相应地为几丁质层、⟦1|蛋白质⟧层、葡聚糖蛋白网层和葡聚糖层；"], [0, "（4）隔膜区：它是由⟦1|菌丝⟧内壁向内延伸而成的环片状构造。"]], 0],
[1, 2, 1, 6, "介绍霉菌营养菌丝和气生菌丝各分化为那些特殊构造，并简要说明它们的功能。", [[0, "⟦2|营养⟧菌丝体是指密布在固体营养基质内部，具有吸取营养功能的菌丝体。气生菌丝体是指⟦1|孢子⟧发芽伸长分枝向空间方向分化出的菌丝体。⟦1|霉菌⟧的营养菌丝和气生菌丝可分化成的特化构造以及它们的功能表解如下"], [0, "假粮吸取养料\\吸器附着胞附潜附着枝"], [1, "葡核"], [0, "特化的酱养⟦1|菌丝⟧休眼（或休眠及蔓延）菌素延伸：匍钢枝"], [1, "菌环"], [1, "捕食线虫"], [1, "⟦1|菌丝⟧体 菌网"], [0, "分生⟦1|孢子⟧头无性简单 孢子囊（有性：担子"], [0, "分生⟦1|孢子⟧器（特化的气生⟦1|菌丝⟧（子实体）无性"], [0, "分生⟦1|孢子⟧座复杂 闭襄壳有性（子囊果）子囊壳"], [1, "“子囊盘"]], 0],
[1, 2, 1, 7, "为什么现代学术界总是把蕈菌作为微生物学的研究对象，而不是植物学的研究对象？", [[0, "现代学术界总是把蕈菌作为⟦1|微生物⟧学的研究对象，而不是植物学的研究对象的原因如下。"], [0, "（1）从进化历史，⟦1|细胞⟧结构，早期发育特点，各种生物学特性和研究方法等方面来考察，都可以证明它们与其他典型的⟦2|微生物⟧—一显微⟦1|真菌⟧完全一致。"], [0, "（2）若将其大型子实体理解为一般⟦1|真菌⟧⟦1|菌落⟧在陆生条件下的特化与高度发展形式，蕈菌就与其他真菌无异。"]], 0],
[1, 2, 1, 8, "综述一下革菌的分类地位、已记载种数、食用和药用种类的数目、食用菌产业的优势和我国有关研究生产概况等信息。", [[0, "（1）蕈菌又称伞菌，是指能形成大型肉质子实体的⟦1|真菌⟧，包括大多数担子菌和极少数的子囊菌类。"], [0, "（2）全球可供食用的⟦1|菌种⟧类有2000多种，其中我国有1500余种，目前已⟦2|鉴定⟧的食用菌已有⟦1|981种⟧，其中92种已驯化，62种已能进行人工栽培。（了解）"], [0, "（3）食用菌产业的优势和我国有关研究生产概况食用菌产业是“五不争产业，不与人争粮，不与粮争地，不与地争肥，不与农争时，不与其他行业争资源，从而使食用菌成了我国第六大农产品。我国成为全球第一大食用菌生产和出口大国。"]], 0],
[1, 2, 1, 9, "一种圆形或近圆形的微生物颗粒，可能是细菌体、芽孢、真菌孢子或者酵母菌，请你根据已掌握的微生物学知识和技术，设计一套实验方案，以确定其属于其中哪一种。（高校真题）", [[0, "根据⟦1|耐热⟧性以及生存条件中对pH的要求，设计如下实验方案："], [0, "（1）实验目的"], [1, "①熟练掌握⟦1|微生物⟧⟦2|分离⟧辨别的方法；"], [1, "②进一步了解⟦2|细菌⟧体、⟦1|芽孢⟧、真菌孢子以及⟦1|酵母菌⟧等⟦2|微生物⟧的物理化学及生态学特性，以及它们的区别。"], [0, "（2）实验原理根据耐热性以及生存条件中对pH的要求对该⟦2|微生物⟧进行鉴定。⟦1|芽孢⟧耐高温，在⟦1|120℃⟧下湿热下仍保持活性；醇母菌和霉菌孢子在60°C能生存，能够在酸性PDA⟦1|培养基⟧上生长；⟦2|细菌⟧能在牛肉膏蛋白陈培养基生长，但是60℃℃就会失活。"], [0, "（3）实验步骤"], [1, "①⟦1|120℃⟧下湿热灭菌，处理此颗粒10min，然后放入⟦2|细菌⟧⟦1|培养基⟧上⟦2|培养⟧，如长出菌说明是⟦1|芽孢⟧"], [1, "②⟦1|60℃⟧下处理10min然后放入牛肉膏蛋白陈⟦1|培养基⟧和酸性PDA⟦2|培养⟧基上培养，如牛肉膏蛋白陈培养基不长菌，而酸性PDA培养基长菌，说明可能是⟦1|酵母菌⟧和霉菌孢子，再在显微镜下观察区别，如均不长菌说明是⟦2|细菌⟧。"]], 0],
[1, 2, 1, 10, "从土壤中分离细菌、放线菌、酵母菌和霉菌的方法（注明所用培养基及其碳氮源、培养条件）。", [[0, "（高校真题）答：（1）从土壤中⟦1|分离⟧⟦2|细菌⟧的方法"], [0, "①制作pH7.0～7.2的牛肉膏蛋白陈⟦1|培养基⟧（⟦1|碳源⟧为牛肉膏，氮源为蛋白陈），趁热注入⟦2|培养⟧血中，凝成平板："], [0, "②将土壤制成10*或10-5菌悬液，接种于上步制成的平板上；"], [0, "③⟦2|培养⟧血倒置⟦1|37℃⟧温箱中，培养1824小时，便可得到⟦1|菌落⟧小、湿润、易被接种环挑起的⟦2|细菌⟧。"], [0, "（2）从土壤中⟦1|分离⟧⟦1|放线菌⟧的方法"], [1, "①制作pH为7.2～7.4高氏一号⟦1|培养基⟧（⟦1|碳源⟧为可溶性淀粉，氮源为硝酸钾），趁热注入⟦2|培养⟧血中，凝成平板："], [1, "②将土壤制成10-4或10-5菌悬液，接种于上步制成的平板上；"], [1, "③⟦2|培养⟧血倒置于25～⟦1|30℃⟧温箱中，培养7～10天，便可得到⟦1|菌落⟧硬度较大、干燥致密、且与基质紧密结合、不易被针挑起的⟦1|放线菌⟧。"], [0, "（3）从土壤中⟦1|分离⟧醇母菌的方法"], [1, "①制作马铃薯葡萄糖琼脂⟦1|培养基⟧（⟦1|碳源⟧为葡萄糖，氮源为马铃薯），趁热注入⟦2|培养⟧皿中，凝成平板；"], [1, "②将土壤制成10-4或10-5菌悬液，接种于上步制成的平板上；"], [1, "③⟦2|培养⟧血倒置于28～⟦1|30℃⟧温箱中，培养35天，便可得到⟦1|菌落⟧较大、湿润、表面光滑、较不透明的⟦1|酵母菌⟧。"], [0, "（4）从土壤中⟦1|分离⟧⟦1|霉菌⟧的方法"], [1, "①制作pH为自然的豆芽汁葡萄糖⟦1|培养基⟧（⟦2|碳源⟧为葡萄糖，氮源为豆芽汁），添加⟦1|80%⟧乳酸数滴，趁悬入⟦2|培养⟧血中，凝成平板："], [1, "②将土壤制成10-4或10-5菌悬液，接种于上步制成的平板上；"], [1, "③⟦2|培养⟧血倒置于⟦1|2530℃⟧C温箱中，培养3～4天，便可得到⟦1|菌落⟧呈绒状、棉絮状或蜘蛛网状⟦1|霉菌⟧"]], 0],
[1, 3, 0, 1, "逆转录病毒（retrovirus）", [[0, "又称反转录⟦1|病毒⟧，属于RNA病毒中的一类，它们的⟦1|遗传⟧信息不是储存在脱氧核糖⟦2|核酸⟧（DNA），而是储存在核糖核酸（RNA）上。"]], 0],
[1, 3, 0, 2, "由外裂解（lysis from without）", [[0, "大量⟦1|噬菌体⟧吸附在同一宿主⟦1|细胞⟧表面并释放众多的溶菌⟦2|酶⟧，最终因这一外在原因而导致细胞裂解的现象，称为自外裂解。"]], 0],
[1, 3, 0, 3, "病毒包含体（viralinclusion body）", [[0, "⟦1|病毒⟧包含体是宿主⟦2|细胞⟧被病毒⟦1|感染⟧后，在细胞内产生的一种有一定⟦2|形态⟧的病变⟦2|结构⟧。不同病毒可引起不同的包含体，它们在形成部位（细胞质或细胞核）、染色特性、大小、形状、数量和含病毒粒多少等方面的差别，是病毒病诊断时的重要指标。"]], 0],
[1, 3, 0, 4, "入噬菌体（abacteriophage）", [[0, "入⟦1|噬菌体⟧是大肠杆菌的一种温和噬菌体。含dsDNA，蝌蚪形，有非收缩性长尾。可改建成重要的基因工程载体，如凯隆载体和科斯⟦1|质粒⟧等。"]], 0],
[1, 3, 0, 5, "类病毒（viroid）", [[0, "类⟦1|病毒⟧是一类只含RNA一种分子，专性寄生在活⟦1|细胞⟧内的分子病原体。例如马铃薯纺锤形块茎病类病毒等。"]], 0],
[1, 3, 0, 6, "拟病毒（virusoid）", [[0, "拟⟦1|病毒⟧是一类被真病毒包裹的缺陷类病毒，前者又称辅助病毒，后者又称病毒卫星。例如绒毛烟斑驳病毒等。"]], 0],
[1, 3, 0, 7, "卫星病毒（satellitevirus）", [[0, "是一类基因组缺损、必须依赖某⟦2|形态⟧较大的专一辅助⟦1|病毒⟧才能复制和表达的小型伴生病毒。烟草坏死病毒（TVV）与其卫星病毒（STNV）间伴生。&、卫星RVA（satellite RNA）是一类存在于某专一病毒粒（辅助病毒）的⟦1|衣壳⟧内，并完全依赖后者才能复制自已的小分子RNA病原因子。"]], 0],
[1, 3, 1, 1, "请以引起 AIDS 的 HIV 为例说明病毒的增殖过程。", [[0, "HIV是一种引起获得性免疫缺陷综合征和相关疾病的逆转录双链RNA⟦1|病毒⟧，HIV破坏人体的免疫系统，从而导致艾滋病产生。病毒的增殖过程大致包括⟦1|5个⟧阶段：吸附，侵入和脱壳，生物合成，组装，释放。吸附：在HIV的增殖过程中，HIV主要入侵T⟦2|细胞⟧，与T4细胞表面的HIV表面抗原的受体CD糖蛋白结合。侵入和脱壳：HIV经细胞吞噬作用脱去⟦1|衣壳⟧进入细胞质。生物合成：病毒将自身的RNA注入T细胞内，利用T细胞里的原料（⟦2|蛋白质⟧、tRNA等），以自身 RNA为模板，逆转录生成病毒双链 DNA，病毒双链DNA进一步整合到宿主DNA上，随着T细胞DNA的转录而转录，并生成病毒RNA和外壳蛋白质。组装：在细胞质中病毒RNA和外壳蛋白质装配成为新的病毒，完成增殖。释放：随着T细胞内HIV的不断增多，T细胞最终裂解，HIV 病毒以出芽方式释放到细胞外，继续感染周围的T细胞，随着T细胞的大量死亡，人体免疫系统崩溃。"]], 0],
[1, 3, 1, 2, "病毒、类病毒和粒是什么？它们在生命的起源和进化方面给你什么启示？", [[0, "（1）⟦1|病毒⟧含义：病毒是无细胞结构的分子生物，由核酸（DNA或RNA）和⟦1|蛋白质⟧构成（或只有核酸）。病毒侵入寄主细胞之前无代谢必需的酶系统，也不能产生⟦2|ATP⟧，因此无新陈代谢活动，不能独立进行各种生命活动，更不能繁殖，可形成结晶；侵入寄主细胞后借助寄主细胞一套生命物质系统复制自己、大量繁殖，表现明显的生命现象特征。"], [1, "②⟦1|病毒⟧给我们的启示：病毒是一种不完全的生命形式或说不是严格意义上的生命形式；生物界（生命）、非生物界（非生命）没有绝对界限，没有不可逾越的鸿沟；病毒是⟦2|细胞⟧出现以后的产物；病毒和质粒、⟦1|转座子⟧有相似之处；此外，病毒含有的一些基因，常和寄主细胞的基因相同或相似，而和它种病毒的基因不同。因此，病毒可能来自细胞。"], [0, "（2）类⟦1|病毒⟧@ 组成及含义：类病毒是比病毒小的颗粒，无⟦1|蛋白质⟧外壳，是由300多个核苷酸构成的单链环状或线形RNA分子。类病毒给我们的启示：类病毒与某些基因中的内含子核苷酸顺序相似，说明类病毒可能来自于基因中的内含子。"], [0, "（3）粒"], [1, "① 组成及含义：粒是一种⟦1|蛋白质⟧分子，也称为蛋白质⟦1|病毒⟧，具有信号分子作用，能侵入寄主⟦2|细胞⟧，产生新的粒（即繁殖）。其特点是非生物性质，无核酸，无复制转录功能。"], [1, "② 既粒给我们的启示：疯牛病病原体蛋白粒子说明⟦1|蛋白质⟧可能也含⟦2|遗传⟧信息，是对中心法则的挑战和补充，同时也说明生命现象的复杂性，这有待进一步探索。"]], 0],
[1, 3, 1, 3, "比较拟病毒、卫星病毒、卫星 RNA 这三类亚病毒因子", [[0, "如图："], [0, "⟦1|核酸⟧种类：拟⟦1|病毒⟧ 小分子环状或线状 ssRNA；卫星病毒 小分子线状 ssRNA 或线状 dsDNA；卫星 RNA 小分子线状或环状 ssRNA"], [0, "⟦1|衣壳⟧：拟⟦1|病毒⟧ 无；卫星病毒 有；卫星 RNA 无"], [0, "存在状态：拟⟦1|病毒⟧ 包装在专一的辅助病毒粒内；卫星病毒 与专一的植物病毒、动物病毒或⟦1|噬菌体⟧伴生；卫星 RNA 包装在专一的辅助病毒粒内"], [0, "⟦1|核酸⟧复制对辅助⟦1|病毒⟧的依赖：拟病毒 依赖"], [0, "基因组与辅助⟦1|病毒⟧的整合：拟病毒 是；卫星病毒 否"], [0, "与辅助⟦1|病毒⟧基因组的同源性：拟病毒 有；卫星病毒 无"], [0, "对侵染的必要性：拟⟦1|病毒⟧ 必要；卫星病毒 不必要"], [0, "编码自身⟦1|衣壳⟧蛋白：拟⟦1|病毒⟧ 不能；卫星病毒 能；卫星 RNA 不能"], [0, "对辅助⟦1|病毒⟧的影响：拟病毒 干扰其复制，降低其复制量"], [0, "对宿主的影响：拟⟦1|病毒⟧ 改变辅助病毒引起的症状，可加重或减弱病害；卫星病毒 改变辅助病毒引起的症状，加重或减弱病害；若单独⟦1|感染⟧宿主，可使其溶原化；卫星 RNA 改变辅助病毒引起的症状，可加重或减弱病害"], [0, "辅助⟦1|病毒⟧种类：拟病毒 植物病毒；卫星病毒 植物病毒、动物病毒或⟦1|噬菌体⟧；卫星 RNA 植物病毒"]], 0],
[1, 3, 1, 4, "如何防止菌体对发酵工业的危害？", [[0, "防止⟦1|噬菌体⟧对⟦1|发酵⟧工业的危害的方法如下："], [0, "（1）不使用可疑⟦1|菌种⟧，认真检查斜面、摇瓶及种子罐所使用的菌种，坚决废弃任何可疑菌种。"], [0, "（2）严格保持环境卫生。"], [0, "（3）决不排放或随便丢弃活菌液环境中存在活菌。"], [0, "（4）注意通气质量空气过滤器要保证质量并经常进行严格⟦1|灭菌⟧，空气压缩机的取风口应设在30~40米高空。"], [0, "（4）加强管道及⟦1|发酵⟧罐的⟦1|灭菌⟧。"], [0, "（6）不断筛选抗性⟦1|菌种⟧，并经常轮换生产菌种。"], [0, "（7）严格执行会客制度。"]], 0],
[1, 4, 0, 1, "营养（nutrition）", [[0, "是指生物体从外部环境中摄取对其生命活动必需的⟦1|能量⟧和物质，以满足正常⟦2|生长⟧和⟦2|繁殖⟧需要的一种最基本的生理过程。"]], 0],
[1, 4, 0, 2, "营养物（nutrient）", [[0, "指具有⟦1|营养⟧功能的物质，可为正常生命活动提供所需要的结构物质、⟦2|能量⟧、⟦2|代谢⟧调节物质和必要的生理环境。"]], 0],
[1, 4, 0, 3, "生长因子（growthfactor）", [[0, "是一类对调节⟦1|微生物⟧正常⟦2|代谢⟧所必需，但不能用简单的碳源、氨源自行合成的微量有机物。广义的生长因子除了维生素外，还包括碱基，嘌呤及其衍生物、甾醇、胺类、有时还包括氨基酸⟦2|营养⟧缺陷⟦1|突变⟧株所需要的氨基酸：狭义的生长因子一般仅指维生素。"]], 0],
[1, 4, 0, 4, "碳氮比（carbon-nitrogenratio）", [[0, "是指在⟦2|微生物⟧⟦1|培养基⟧中所含的碳源中碳原子的摩尔数与氮源中氮原子的摩尔数之比。⟦1|真菌⟧适于碳氮比较高的⟦2|培养⟧基，⟦2|细菌⟧尤其是动物病原菌需碳氮比比较低的培养基"]], 0],
[1, 4, 0, 5, "氨基酸自养微生物（aminoacidautotrophs）", [[0, "氨基酸⟦1|自养⟧⟦1|微生物⟧是能利用尿素、铵盐、硝酸盐或氮气作⟦2|氮源⟧，自行合成其所需氨基酸的微生物。"]], 0],
[1, 4, 0, 6, "氨基酸异养微生物（aminoacidheterotrophs）", [[0, "氨基酸⟦1|异养⟧⟦1|微生物⟧是一类不能利用尿素和无机⟦2|氮源⟧，必须从外界吸收现成氨基酸作氮源⟦2|营养⟧物的微生物。"]], 0],
[1, 4, 0, 7, "自养微生物（autotrophs）", [[0, "是一类不依赖任何有机物即可正常⟦1|生长⟧⟦2|繁殖⟧的⟦2|微生物⟧。根据其能源的不同，可分光能⟦1|自养⟧微生物和化能自养微生物两大类。"]], 0],
[1, 4, 0, 8, "异养微生物（heterotrophs）", [[0, "是一类必须提供一种以上大量有机物才能正常⟦1|生长⟧⟦2|繁殖⟧的⟦2|微生物⟧。大多数微生物都是⟦1|异养⟧微生物，主要是"]], 0],
[1, 4, 0, 9, "蛋白陈（peptone）", [[0, "化能异果糖生物和少数光能异并能生物糖糖各种动物⟦1|蛋白质⟧（酪蛋白等）或植物蛋白质（大豆蛋白等）的酶解或酸水解产物的统称。富含各种肽段和氨基酸，是多种⟦2|微生物⟧的重要氮源⟦2|营养⟧物。"]], 0],
[1, 4, 0, 10, "天然培养基（natural medium）", [[0, "是指一类利用动、植物或⟦2|微生物⟧体包括用其提取物制成的⟦1|培养基⟧，这是类⟦2|营养⟧成分既复杂又丰富、难以说出其确切化学组成的培养基。例如培养多种⟦2|细菌⟧所用的牛肉膏蛋白陈培养基，培养⟦1|酵母菌⟧的麦芽汁培养基等。"], [0, "11，组合⟦1|培养基⟧（chemically defined medium）又称合成⟦1|培养⟧基，是指一类按⟦2|微生物⟧的⟦2|营养⟧要求设计后用多种高纯化学试剂配制成的培养基。"]], 0],
[1, 4, 0, 11, "半组合培养基（semi-defined medium）", [[0, "又称半合成⟦1|培养基⟧，是指一类主要以化学试剂配制，同时还加有某种或某些天然成分的⟦2|培养⟧基。常用的半组合培养基为用于培养⟦1|真菌⟧的马铃薯蔗糖培养基。例如，培养真菌的马铃薯蔗糖培养基等。"]], 0],
[1, 4, 0, 12, "液体培养基（liquidmedia）", [[0, "是液体状态⟦1|培养基⟧的总称。在实验室中应用广泛，也适合绝大多数⟦1|发酵⟧产物的大量生产用。"]], 0],
[1, 4, 0, 13, "固体培养基（solid media）", [[0, "是一类外形呈固体状态的⟦1|培养基⟧，主要为加有琼脂或明胶作凝固剂的固化⟦2|培养⟧基。应用广泛，可用于⟦1|菌种⟧⟦2|分离⟧、菌种⟦2|鉴定⟧、⟦1|菌落⟧计数、菌种保藏和进行大规模固态培养等。"]], 0],
[1, 4, 0, 14, "半固体培养基（semi-solidmedia）", [[0, "通过向在液体⟦1|培养基⟧中加入少量凝固剂（如⟦1|0.5%⟧琼脂）而配制成的半固态⟦2|培养⟧基。可用于⟦2|细菌⟧运动力观察厌氧菌的⟦2|分离⟧、培养和计数，⟦1|菌种⟧保藏，以及⟦1|噬菌体⟧效价测定等。"]], 0],
[1, 4, 0, 15, "Ashby无氮培养基（Ashbynitrogen-freemedium）", [[0, "是一种以甘露醇为⟦2|碳源⟧，不加任何氮源的选择性⟦1|培养基⟧，可高效⟦2|分离⟧土壤中能自生⟦1|固氮⟧的固氮菌属（Azotobacter）等⟦2|细菌⟧。"]], 0],
[1, 4, 0, 16, "Martin 氏培养基（Martin's medium）", [[0, "是一种对土壤中数量众多的⟦2|细菌⟧具有抑制作用，因而能高效⟦2|分离⟧土壤⟦1|真菌⟧的选择性⟦1|培养基⟧。其中含有的孟加拉红、金霉素和链霉素是细菌抑制剂。"]], 0],
[1, 4, 1, 1, "按照成分、外观和功能分类，培养基有哪些种类？举例说明如何利用选择培养基富集和筛选特定的微生物。", [[0, "（1）按对⟦1|培养基⟧成分的了解⟦1|分类⟧："], [0, "天然⟦1|培养基⟧：成分 动、植物或⟦1|微生物⟧及其提取物，具体化学成分不确切；举例 牛肉膏蛋白胨培养基、麦芽汁培养基；优点 ⟦2|营养⟧丰富、种类多样、配制方便、价格低廉，适宜大规模培养微生物；缺点 成分复杂不清楚、不稳定"], [0, "组合（合成）⟦1|培养基⟧：成分 适宜比例的多种高纯化学试剂；举例 葡萄糖铵盐培养基、蔗糖硝酸盐培养基（察氏培养基）；优点 成分精确、重复性高，一般用于实验室营养⟦2|代谢⟧、分类鉴定和选育⟦1|菌种⟧等工作；缺点 配制麻烦、价格较贵；⟦2|微生物⟧生长情况较一般，不宜大规模生产"], [0, "半组合（合成）⟦1|培养基⟧：成分 化学试剂（主要）+天然成分；举例 马铃薯蔗糖培养基；优点 应用最广，能使绝大多数⟦1|微生物⟧良好地⟦2|生长⟧；缺点 —"], [0, "（2）按⟦1|培养基⟧外观的物理状态⟦1|分类⟧："], [0, "液体⟦1|培养基⟧：物理状态 液体；用途 大规模⟦1|培养⟧⟦2|微生物⟧"], [0, "固化⟦1|培养基⟧：物理状态 遇热融化、冷却后凝固；用途 科研及生产中培养⟦1|微生物⟧、分离、⟦2|鉴定⟧等"], [0, "非可逆固化⟦1|培养基⟧：物理状态 凝固后不能再融化；用途 化能⟦1|自养⟧菌的⟦2|分离⟧⟦2|纯化⟧等"], [0, "天然固态⟦1|培养基⟧：物理状态 固体；用途 大量⟦1|培养⟧、工业化生产等"], [0, "滤膜：物理状态 坚韧且有无数微孔的纤维薄膜；用途 水中少量菌的计数等"], [0, "半固体⟦1|培养基⟧：物理状态 半固体；用途 ⟦2|细菌⟧动力观察、趋化性研究，厌氧菌的分离、⟦2|培养⟧和计数，菌种保藏，双层平板法测定⟦1|噬菌体⟧效价"], [0, "（3）按⟦1|培养基⟧对⟦1|微生物⟧的功能⟦2|分类⟧："], [0, "选择性⟦1|培养基⟧：具体类型 加富性选择⟦2|培养⟧基；原理 分离对象对某种⟦2|营养⟧物有特殊“嗜好”；举例 ⟦1|酵母菌⟧富集培养基；用途 分离自生固氮菌"], [0, "选择性⟦1|培养基⟧：具体类型 抑制性选择⟦2|培养⟧基；原理 ⟦2|分离⟧对象对某种抑制物质有抗性；举例 马丁培养基；用途 药品和生物制品的无菌检验、检测⟦1|真菌⟧"], [0, "鉴别性⟦1|培养基⟧：具体类型 —；原理 在成分中加入能与目的菌无色⟦2|代谢⟧产物发生显色反应的指示剂，肉眼即可辨别颜色、找出目的菌⟦1|菌落⟧；举例 EMB 培养基（伊红美蓝乳糖培养基）；用途 饮用水、牛奶的大肠菌群等⟦2|细菌⟧学检查，以及 E. coli 的遗传学研究"], [0, "（4）利用选择⟦1|培养基⟧富集和筛选特定的⟦1|微生物⟧的方法：根据待富集筛选的特定微生物的特殊⟦2|营养⟧要求或其对某理化因素抗性的原理而设计的培养基，只允许特定的微生物生长，而同时抑制或阻止其他微生物生长，从而达到富集和筛选特定的微生物的目的。例如筛选纤维素分解菌时，在培养基中加入纤维素粉作为唯一碳源，采用刚果红染色法，因为刚果红能与培养基中的纤维素形成红色复合物，当纤维素被纤维素酶分解后，刚果红一纤维素的复合物就无法合成，培养基中会出现以纤维素分解菌为中心的透明圈，所以就可以通过是否产生透明圈来筛选纤维素分解菌。"]], 0],
[1, 4, 1, 2, "培养基的制备直接关系着微生物培养的成败，简述配制培养基的原则和步骤。", [[0, "（1）配制⟦1|培养基⟧的原则培养基组分应适合⟦1|微生物⟧的⟦2|营养⟧特点（目的明确）；营养物的浓度与比例应恰当（营养协调）；物理化学条件适宜（条件适宜）；根据培养目的来选择不同来源的原料（经济节约）。"], [0, "（2）配制⟦1|培养基⟧的步骤原料称量。⟦1|培养⟧基不同成分的选择，进行称量。"], [1, "② 处理原料（溶解）。把原料进行加热溶解。⟦1|培养基⟧pH的初步调整。⟦2|培养⟧基各成分完全溶解后应进行pH的初步调整，因培养基在加热消毒过程中、pH会有所变化。培养基的过滤澄清。液体培养基必须绝对澄清，琼脂培养基也应透明无显著沉淀。一般液体培养基可用滤纸过滤法，滤纸应折叠成折扇成漏斗形，以避免因液压不均匀而引起滤纸破裂。琼脂培养基可用清洁的白色薄绒布趁热过滤。亦可用中间夹有薄层吸水棉的双层纱布过滤。培养基的分装。培养基的分装，应按使用的目的和要求，分装于试管、烧瓶等适当容器内。加塞。用棉花制作塞。包扎。三角瓶用牛皮纸或双层报纸包在棉塞外，以防止⟦1|灭菌⟧时冷凝水沾湿棉塞。试管先扎成捆后，在棉塞外用纸包。标明组别、培养基名称、日期。"], [1, "③⟦1|灭菌⟧处理。一般是湿热灭菌，即在灭菌锅中处理摆斜面、倒平板。⟦1|培养基⟧稍微冷却后倒平板。无菌检查。将灭菌的⟦2|培养⟧基放在⟦1|37℃⟧恒温箱中培养24～48h，无菌⟦2|生长⟧可使用。"]], 0],
[1, 4, 1, 3, "设计实验分离抗六氯苯的微生物，使用两种方法提高该菌对六氯苯的分解能力。（高校真题）", [[0, "（1）⟦1|分离⟧抗六氯苯的⟦2|微生物⟧的实验设计如下："], [1, "①设计思路：以大肠杆菌（E.coli）为实验材料，通过影印⟦1|培养⟧法来分离抗性⟦2|微生物⟧。"], [1, "②原理：普通大肠杆菌在含有六氯苯的⟦1|培养⟧皿中不能生存，然而抗六氯苯的大肠杆菌则可以在此⟦1|培养基⟧中生存。依据此原理，可设置对照试验。"], [1, "③主要步驱第一、制作LB固体⟦1|培养基⟧，到三个平板，分别编号A和B。A平板不含六氯苯，作对照；B、C平板均含有六氯苯。第二、将正常且健康的大肠杆菌（E.coli）接种到编号为A的⟦2|培养⟧基中，然后用影印板将A号培养基中的E.coli接种到B号培养基的对应位置上，⟦1|37℃⟧下培养8～10h。第三、将培养好的B号培养基中对应A号培养基中存活下来的大肠杆菌，接种到C号培养基中，继续培养，挑选存活⟦1|菌种⟧，即可分离出抗六氯苯的⟦2|微生物⟧。"], [0, "（2）提高该菌对六氯苯的分解能力的方法"], [1, "①增加⟦1|培养基⟧中六氯苯的浓度。让该菌在含有更高浓度的六氯苯的⟦1|培养⟧基中生存，存活下来的⟦2|细菌⟧则对六氯苯有更高的分解能力。"], [1, "②在已含有抗六氯苯抗性基因的⟦1|细菌⟧上插入一段更强的启动子。插入了强启动子的细菌的抗性基因的表达能力会增强，这样在含有相同浓度六氯苯的⟦1|培养基⟧中，含有强抗云氨苯抗性基因启动子的细菌对六氯苯的分解能力会大大提高，分解速度会大天增加。““"]], 0],
[1, 5, 0, 1, "新陈代谢（metabolism）", [[0, "是指推动生物一切生命活动的动力源和各种生命物质的“加工厂”，是活⟦1|细胞⟧中一切有序化学反应的总和，通常分成分解⟦2|代谢⟧和合成代谢两部分。"]], 0],
[1, 5, 0, 2, "分解代谢（catabolism）", [[0, "又称异化作用，是指复杂的有机分子通过分解⟦1|代谢⟧⟦2|酶⟧系的催化产生简单分子、⟦2|能量⟧和还原力的作用"]], 0],
[1, 5, 0, 3, "合成代谢（anabolism）", [[0, "又称同化作用，是指在合成⟦1|酶⟧系的催化下，由简单小分子、⟦2|ATP⟧形式的⟦2|能量⟧和[H]形式的还原力一起，共同合成复杂的生物大分子的过程"]], 0],
[1, 5, 0, 4, "细菌酒精发酵（bacterial alcoholic fermentation）", [[0, "运动⟦1|发酵⟧单胞菌等少数微⟦1|好氧⟧⟦2|细菌⟧利用ED途径将葡萄糖分解为丙酮酸，再经脱羧形成乙醛后，被NADH2还原为乙醇的过程，称为细菌酒精发酵。"]], 0],
[1, 5, 0, 5, "P/O 比 （p/O ratio）", [[0, "是指每消耗1mol氧原子所产生的⟦1|ATP⟧mol数。原核生物⟦1|呼吸链⟧的P/O比一般较真核⟦2|细胞⟧线粒体的低。"]], 0],
[1, 5, 0, 6, "硫酸盐呼吸（sulfaterespiration）", [[0, "是一类称作硫酸盐还原⟦2|细菌⟧（或反硫化细菌）的严格⟦1|厌氧⟧菌在无氧条件下获取⟦2|能量⟧的方式。特点为底物脱氢后，经⟦1|呼吸链⟧递氢，最终由末端氢受体硫酸盐受氢，在递氢过程中与⟦1|氧化磷酸化⟧作用相偶联而获得⟦2|ATP⟧。硫酸盐呼吸的最终还原产物是H2S。"]], 0],
[1, 5, 0, 7, "硫呼吸（sulfurbreathing）", [[0, "以无机硫作为⟦1|呼吸链⟧的最终⟦2|氢⟧受体并产生H2S的生物氧化作用。能进行硫呼吸的都是一些兼性或专性⟦1|厌氧⟧菌。"]], 0],
[1, 5, 0, 8, "铁呼吸（iron respiration）", [[0, "某些专性厌氧菌和兼性厌氧菌（包括化能异养⟦2|细菌⟧、化能⟦1|自养⟧细菌和某些⟦1|真菌⟧）中，其⟦1|呼吸链⟧末端的⟦2|氢⟧受体是Fe3+。"]], 0],
[1, 5, 0, 9, "循环光合磷酸化（cyclicphotophosphorylation）", [[0, "是指一种存在于⟦1|厌氧⟧⟦1|光合⟧⟦2|细菌⟧中，可在光驱动下通过⟦2|电子⟧的循环式传递而完成磷酸化产能反应。"]], 0],
[1, 5, 0, 10, "非循环式光合磷酸化（noncyclic photophosphorylation）", [[0, "非循环⟦1|光合⟧磷酸化是指各种绿色植物、藻类和⟦1|蓝细菌⟧所共有的利用光能产生⟦2|ATP⟧的磷酸化反应。"]], 0],
[1, 5, 0, 11, "嗜盐菌紫膜的光介导ATP合成", [[0, "指⟦1|嗜盐⟧菌在无氧条件下，利用光能所造成的紫膜蛋白上视黄醛辅基构象的变化，可使质子不断驱至膜外，从而在膜两侧建立一个质子动势，再由其来推动⟦1|ATP⟧合⟦2|酶⟧合成ATP。"]], 0],
[1, 5, 0, 12, "两用代谢途径（amphibolicpathway）", [[0, "是指在分解⟦1|代谢⟧和合成代谢均中具有功能的途径。EMP、HMP和TCA循环都是重要的两用代谢途径"]], 0],
[1, 5, 0, 13, "乙醛酸循环（glyoxylatecycle）", [[0, "是指TCA循环中的一条回补途径，可使TCA循环不仅具有高效产能功能，而且还兼有可为许多重要生物合成反应提供有关中间⟦1|代谢⟧物的功能，如草酰乙酸可合成天冬氨酸，α一酮戊二酸可合成谷氨酸等"]], 0],
[1, 5, 0, 14, "Calvin 循环（Calvin cycle）", [[0, "是指光能⟦1|自养⟧生物和化能自养生物固定CO2的主要途径。二磷酸核酮糖羧化⟦2|酶⟧-加氧（RuBisCO）和磷酸核酮糖激酶是本途径的两种特有的酶。存在于绿色植物、⟦1|蓝细菌⟧和多数⟦1|光合⟧⟦2|细菌⟧外，还有硫细菌、铁细菌和硝化细菌等许多化能自养菌。"]], 0],
[1, 5, 0, 15, "厌氧乙酰—CoA途径（Anaerobic acetyl-CoApathway）", [[0, "是一种非循环式的CO2固定机制，主要存在于一些产乙酸菌、硫酸盐还原菌和产甲烷菌等化能⟦1|自养⟧⟦1|细菌⟧虫关键⟦2|酶⟧为 CO脱⟦2|氢⟧酶"]], 0],
[1, 5, 0, 16, "逆向TCA途径（reverse TCApathway）", [[0, "绿菌属等一些绿色硫⟦2|细菌⟧的CO2固定是通过逆向TCA 途径途径进行的。总反应式为3.CO+12[H）+5⟦2|ATP⟧→，每循环一周掺磷酸丙糖本循环起始于柠橡酸（6C 化合物）的裂解产物草酰乙酸（4C），以它作CO磷体入⟦1|2个⟧CO2，并还原成可供各种生物合成用的乙酰-CoA（2C），由它再固定⟦1|1分子⟧CO2后，就可进一步形成丙酮酸、丙糖、已糖等一系列构成⟦2|细胞⟧所需要的重要合成原料。"]], 0],
[1, 5, 0, 17, "羟基丙酸途径（hydroxypropionicacidpathway）", [[0, "少数绿色硫⟦2|细菌⟧（绿弯菌属）在以H2或H2S作⟦2|电子⟧供体进行⟦1|自养⟧生活时所特有的一种CO2固定机制。该途径可以将⟦1|2个⟧CO⟦1|2分子⟧转变为乙醛酸。"]], 0],
[1, 5, 0, 18, "自生固氮菌（azotobacter）", [[0, "自生⟦1|固氮⟧菌是指一类不依赖与它种生物共生而能独立进行固氮的⟦1|微生物⟧。"]], 0],
[1, 5, 0, 19, "共生固氮菌（symbiotic nitrogenfixingbacteria）", [[0, "共生⟦1|固氮⟧菌是指必须与它种生物共生在一起时才能进行固氮的⟦1|微生物⟧。"]], 0],
[1, 5, 0, 20, "联合固氮菌（associative nitrogen-fixing bacterium）", [[0, "联合⟦1|固氮⟧菌是指必须生活在植物根际、叶面或动物肠道等处才能进行固氮的⟦1|微生物⟧。"]], 0],
[1, 5, 0, 21, "细菌萜醇（bactoprenol）", [[0, "是一种含⟦1|11个⟧异戊二烯单位的异戊二烯醇，它可通过⟦1|2个⟧磷酸基与N-乙酰胞壁酸分子相接，使糖的中间⟦2|代谢⟧物呈现出很强的疏水性，从而使它能顺利通过疏水性很强的⟦1|细胞膜⟧而转移到膜外。"]], 0],
[1, 5, 0, 22, "延胡索酸呼吸（fumaraterespiration）", [[0, "无氧呼吸的一种。某些兼性⟦1|厌氧⟧菌⟦1|呼吸链⟧的末端受⟦2|氢⟧体为延胡索酸，其还原产物是琥珀酸，这种生物氧化产能过程称为延胡索酸呼吸。"]], 0],
[1, 5, 0, 23, "同型乳酸发酵（homolacticfermentation）", [[0, "同型乳酸⟦1|发酵⟧是一个分子葡萄糖经EMP途径后仅产生两分子乳酸的发酵。"]], 0],
[1, 5, 0, 24, "异型乳酸发酵的\"经典\"途径（“classicalheterolacticfermentationpathway）", [[0, "即异型乳酸⟦1|发酵⟧的6-磷酸-葡糖酸途径，指由明串珠菌属等⟦1|细菌⟧通过HMP途径发酵葡萄糖产生乳酸、CO2和乙酸（或乙醇）的乳酸发酵。"]], 0],
[1, 5, 0, 25, "异型乳酸发酵的双歧杆菌途径（heterolactic fermentation\"bifidus'pathway）", [[0, "指发生在双歧杆菌属（Bifidobacterium）等⟦1|细菌⟧通过HMP途径的异型乳酸⟦1|发酵⟧，该途径发酵葡萄糖产生乳酸和乙酸的数量比为2：3。"]], 0],
[1, 5, 0, 26, "代谢物回补顺序（replenishment order of metabolites）", [[0, "⟦1|代谢⟧物回补顺序又称代谢物补偿途径。指能补充两用代谢途径中因合成代谢而消耗的中间代谢物的那些反应。借此途径，使重要产能途径中的某关键中间代谢物一旦被大量用作生物合成原料而抽走时，仍可保证⟦2|能量⟧代谢的正常进行。如乙醛酸循环等。"]], 0],
[1, 5, 1, 1, "什么是细胞呼吸？细胞呼吸可分为哪几个部分？为什么说三羧酸循环是生物物质分解代谢的共同终末遂径？", [[0, "（1）⟦1|细胞⟧呼吸的定义：是指细胞在有氧条件下氧化分解糖类等有机物，最终产生二氧化碳和水并释放⟦2|能量⟧的过程。反应先在细胞质基质，后在线粒体进行。葡萄糖（或糖原）在正常有氧的条件下，氧化后产生CO2和水，这个总过程称为糖的有氧氧化，又称细胞氧化或生物氧化。"], [0, "（2）整个过程分为⟦1|3个⟧阶段："], [1, "①糖醇解一分子葡萄糖在⟦1|细胞⟧质中反应生成两分子丙酮酸，并伴随⟦1|2分子⟧⟦2|ATP⟧和2分子NADH的产生。"], [1, "②柠檬酸循环指糖酵解的终产物丙酮酸进入线粒体基质在丙酮酸脱⟦1|氢⟧⟦2|酶⟧作用下生成乙酰CoA，乙酰CoA进入三愈酸循环，与草酰乙酸缩合生成柠檬酸开始，经过一系列脱氢和脱羧反应后又以草酰乙酸的再生成结束。由于循环中首先生成含有三个羧基的柠檬酸，故被称为三羧酸循环或柠檬酸循环，⟦1|1分子⟧葡萄糖分子在柠檬酸循环中要产生1分子GTP，3分子NADH和1分子FADH2。"], [1, "③⟦1|电子⟧传递与⟦1|氧化磷酸化⟧电子传递是指在有氧条件下，NADH和FADH2通过由电子载体所组成的电子传递链最终被O2氧化。氧化磷酸化是指只有在有氧条件下才能发生的，在电子传递过程中合成⟦2|ATP⟧的反应。经电子传递和化学渗透，将氧化与磷酸化相偶联，发生部位在线粒体内膜。"], [0, "（3）原因三羧酸循环是三大营养素（糖类、脂类、氨基酸）的最终代谢通路，三羧酸循环的起始物乙酰-CoA，不仅是糖氧化分解产物，它也可来自脂肪的甘油、脂肪酸和来自⟦1|蛋白质⟧的某些氨基酸的代谢。三羧酸循环是糖代谢、蛋白质代谢、脂肪代谢，⟦2|核酸⟧代谢以及次生物质代谢联络的枢纽。糖和甘油在体内代谢的中间产物（α-酮戊二酸及草酰乙酸等）可转变成为某些氨基酸，某些氨基酸又可通过不同途径变成α-酮戊二酸和草酰乙酸，再经糖异生的途径生成糖或转变成甘油。其他代谢的产物最终可通过三羧酸循环氧化为CO2和H2O，并放出能量，因此三羧酸循环是三大营养素分解的最终代谢通路，是三大营养素相互转变的联系枢纽。"]], 0],
[1, 5, 1, 2, "请详细叙述植物光合作用的生化反应过程。", [[0, "植物的⟦1|光合⟧作用实质上是一系列生化反应的有序进行。光合作用的全部过程包括光反应和碳反应两个阶段。"], [0, "（1）光反应光反应主要是将光能变成化学能并产生⟦1|氧气⟧，在叶绿体类囊体膜中进行，包括水的光解、O2的释放、⟦2|ATP⟧及NADPH的生成等，反应需要光。"], [0, "（2）碳反应碳反应是不需要光就能进行的一系列⟦1|酶⟧促反应，在叶绿体基质中进行，利用光反应形成的⟦2|ATP⟧和NADPH，将CO2还原为糖。碳反应可分为三个阶段："], [1, "①羧化阶段：CO2被固定，生成最初产物3-磷酸甘油酸"], [1, "②氧化还原阶段：利用同化力（NADPH、⟦1|ATP⟧）将3-磷酸甘油酸还原为三碳糖，即3磷酸甘油醛（G3-P）。"], [1, "③RuBP的再生：⟦1|5个⟧G3-P转变成3个五碳糖（RuBP），RuBP的再生需要⟦1|ATP⟧。"]], 0],
[1, 5, 1, 3, "论述植物细胞的光合作用与呼吸作用的异同点。", [[0, "绿色植物通过⟦1|光合⟧作用把CO2和H2O转变成有机物质并释放⟦1|氧气⟧：同时也通过呼吸作用把有机物质氧化分解为CO2和H2O，同时放出⟦2|能量⟧供生命活动利用。光合作用和呼吸作用既相互对立，又相互依赖，它们共同存在于统一的有机体中。"], [0, "（1）不同点：⟦1|光合⟧作用与呼吸作用在原料、产物、发生部位、发生条件以及物质、⟦1|能量⟧转换等方面有明显的区别。"], [1, "①原料：⟦1|光合⟧作用的原料是水、CO2等无机物，呼吸作用的原料是有机物和⟦1|氧气⟧；"], [1, "②部位：⟦1|光合⟧作用在叶绿体进行，呼吸作用在线粒体内进行："], [1, "③条件：⟦1|光合⟧作用需要光照，呼吸作用有光、无光都可发生："], [1, "④物质、⟦1|能量⟧转换：⟦1|光合⟧作用是有机物合成、储藏能量的过程，光能-电能-化学能；呼吸作用是有机物分解、释放能量的过程，稳定的化学能一活跃的化学能；"], [1, "③产物：⟦1|光合⟧作用的产物是糖类、氧气，呼吸作用的产物CO2和水。植物的光合作用和呼吸作用总体看来是个互逆的过程。光合作用吸收CO2，放出氧气，积累有机物，积累⟦1|ATP⟧；呼吸作用吸收氧气，放出CO2，消耗有机物，消耗⟦2|能量⟧。"], [0, "（2）相同点：⟦1|光合⟧作用与呼吸作用在物质⟦1|代谢⟧和⟦2|能量⟧代谢方面相互依赖，紧密相连。如果没有光合作用制造有机物，呼吸作用无法进行，呼吸作用分解的有机物是光合作用的产物，呼吸作用释放的能量是光合作用储存在有机物的能量。如果没有呼吸作用，光合作用也无法进行，植物在进行光合作用时，原料的吸收和产物运输所需能量，来自于呼吸作用。"], [1, "①⟦1|光合⟧和呼吸都涉及⟦2|ATP⟧和NADP+，光合作用需要ADP（供光合磷酸化产生ATP之用）和NADP+（供产生NADPH），呼吸作用也需要ADP（供⟦1|氧化磷酸化⟧）和NADP+（PPP途径产生NADPH）。"], [1, "②⟦1|光合⟧作用和呼吸作用⟦1|代谢⟧过程中有许多中间产物都是相同的。如光合碳循环与呼吸作用的PPP途径的中间产物都是三碳、四碳、五碳、六碳、七碳糖的磷酸酯。"], [1, "③⟦1|光合⟧释放的02可供呼吸作用，呼吸释放的CO2也可被光合作用所同化。"]], 0],
[1, 5, 1, 4, "试述ED途径在物生物生命活动中的功能，并说出它与人类生产实践的关系。", [[0, "（1）ED途径在物生物生命活动中的功能"], [1, "①用仅仅四步反应替代EMP途径，可与EMP、HMP和TCA连接："], [1, "②可进行⟦1|细菌⟧酒精⟦1|发酵⟧以产生酒精。"], [0, "（2）ED途径与人类生产实践的关系用ED途径⟦1|发酵⟧生产乙醇，⟦2|代谢⟧速率高，产物⟦1|转化⟧率高，菌体生成少，代谢副产物少，发酵⟦2|温度⟧高，不必定期供氧。"]], 0],
[1, 5, 1, 5, "试分析说明分子氧对专性厌氧菌毒害的机理（高校真题）", [[0, "专性⟦1|厌氧⟧菌⟦2|细胞⟧内缺乏超氧化物歧化酶（SOD）、细胞色素氧化酶和过氧化氢酶。超氧化物歧化酶可以将超氧阴离子自由基⟦1|转化⟧成过氧化氢；过氧化氢酶可以将过氧化氢转化成水和氧气。有氧存在时，专性厌氧菌体内会产生超氧阴离子自由基，超氧阴离子自由基是活性氧的形式之一，因有奇数电子，故带负电荷；它既有分子性质，又有离子性质，其性质极不稳定，化学反应力极强，在细胞内可破坏各种重要生物大分子和膜结构，还可形成其他活性氧化物，对生物体极其有害。由于专性厌氧菌细胞内缺乏超氧化物歧化酶（SOD）、细胞色素氧化酶和过氧化氢酶，不能解除超氧阴离子自由基的毒害，所以双歧杆菌在有分子氧存在时，不能⟦2|生长⟧甚至致死。"]], 0],
[1, 6, 0, 1, "代时（generation time）", [[0, "是⟦1|细胞⟧分裂一次所需要的时间，是⟦2|生长⟧速率常数的倒数（G=1/R）。"]], 0],
[1, 6, 0, 2, "生长限制因子（growth-limitedfactor）", [[0, "已对某⟦1|微生物⟧的⟦2|生长⟧速率和菌体产量产生不利影响的某种低浓度⟦2|营养⟧物。"]], 0],
[1, 6, 0, 3, "生长产量常数（growthyield）", [[0, "⟦1|生长⟧产量常数又称生长得率。指处于稳定生长期的⟦2|微生物⟧，消耗单位⟦2|营养⟧物质（g）所形成的菌体质量（g）。"]], 0],
[1, 6, 0, 4, "恒化器（chemostat）", [[0, "使培养液的流速保持不变，并使⟦1|微生物⟧始终在低于其最高⟦2|生长⟧速率的条件下进行生长繁殖的⟦1|连续培养⟧装置。该装置通过控制某一⟦2|营养⟧物的浓度，使其始终成为生长限制因子的条件下达到的，因而可称为外控制式的连续培养装置、"]], 0],
[1, 6, 0, 5, "恒浊器（turbidostat）", [[0, "一种⟦1|连续培养⟧器。根据⟦1|培养⟧器内⟦2|微生物⟧的⟦2|生长⟧密度，借光电控制系统控制培养液流速，以达到菌体密度高、生长速率恒定的连续培养器。"]], 0],
[1, 6, 0, 6, "高密度培养（highcell-densityculture）", [[0, "一般指⟦1|微生物⟧在液体培养条件下，⟦2|细胞⟧群体密度超过常规培养十倍以上的生长状态或培养技术。可通过优化营养成分、补料、通纯氧或去除有害⟦2|代谢⟧产物等措施达到。"]], 0],
[1, 6, 0, 7, "生长温度三基点（three cardinal point of growth temperature）", [[0, "⟦1|生长⟧温度三基点指某⟦2|微生物⟧生长温度的三个重要指标，即最低生长温度、最适生长温度和最高生长温度。&、⟦1|厌氧⟧罐（anaerobicjar）厌氧罐是一种⟦2|培养⟧厌氧菌用的圆柱形密封罐，内放钯催化剂和厌氧度指示剂，经抽气换气法或内源性产气袋充以N2、H2、CO或仅充H2和CO2后，利用钯催化剂在常温下使罐内残余的O2与H2结合成H2O，从而达到无氧状态。"]], 0],
[1, 6, 0, 8, "亨盖特滚管技术（Hungate roll-tube technique）", [[0, "由美国⟦1|微生物⟧学家Hungate发明的在一种称为滚管的试管壁上⟦2|培养⟧严格⟦1|厌氧⟧菌的装置，包括制备高纯氮、以氮驱氧、制作滚管和无氧培养等技术。"]], 0],
[1, 6, 0, 9, "厌氧手套箱（anaerobicglovebox）", [[0, "一种用于操作、⟦1|培养⟧和研究严格⟦1|厌氧⟧菌用的箱形装置，其内充满N2、CO2和H2气体，有两个塑料手套用于操作，箱内设有接种、除氧和培养等设备。"]], 0],
[1, 6, 0, 10, "摇瓶培养（shake-flask cultivation）", [[0, "摇瓶⟦1|培养⟧又称振荡培养。一种培养⟦1|好氧⟧⟦2|微生物⟧的实验室用常规装置。一般是把微生物接种到装有少量培养液的三角瓶中，用纱布包裹瓶口，以利通气和严防杂菌进入，然后把它放在摇床（振荡器）上作有节奏的振荡，以不断提供⟦2|氧气⟧。"]], 0],
[1, 6, 0, 11, "灭菌（sterilization）", [[0, "是一类采用强烈的理化因素使任何物体内外部的一切⟦1|微生物⟧彻底丧失其⟦2|生长⟧繁殖能力的措施。⟦1|灭菌⟧实质上还可分杀菌和溶菌两种，前者指菌体虽死，但形体尚存；后者则指菌体被杀死后，其⟦2|细胞⟧因发生自溶、裂解等而消失的现象"]], 0],
[1, 6, 0, 12, "消毒（disinfection）", [[0, "是一类旨在消除传染源（病原体）对人等⟦1|致病⟧作用的理化处理措施，仅能杀死物体表面或内部一部分对人体或动植物有害的病原体，而对被⟦1|消毒⟧对象基本无害。例如一些常用的对皮肤、水果、饮用水进行药剂消毒的方法，对啤酒、牛奶、果汁和酱油等进行消毒处理的巴氏消毒法等。"]], 0],
[1, 6, 0, 13, "防腐（antisepsis）", [[0, "是利用某种理化因素抑制霉腐⟦1|微生物⟧的⟦2|生长⟧⟦2|繁殖⟧，以防止食品、饮料或生物制品等对象发生霉腐的措施。"]], 0],
[1, 6, 0, 14, "化疗（chemotherapy）", [[0, "是化学治疗的简称。指利用具有高选择毒力即对病原菌具高度毒力而对其宿主基本无害的化学物质来抑制或杀死宿主体内病原⟦1|微生物⟧，借以达到治疗传染病的一种措施。这类具有高度选择毒力、可用于化学治疗目的的化学物质称化学治疗剂，包括磺胺类等化学合成药物、⟦1|抗生素⟧，生物药物素和若干中草药有效成分等。"]], 0],
[1, 6, 0, 15, "干热灭菌法（dryheatsterilization）", [[0, "把待⟦1|灭菌⟧物件（⟦1|耐热⟧的玻璃器血或金属器械等）放入电热烘箱内，在150～⟦1|170℃⟧下维持1～2h即可达到彻底灭菌效果的灭菌方法。"]], 0],
[1, 6, 0, 16, "热灭菌法", [[0, "利用高温的水或水蒸汽进行⟦1|灭菌⟧的方法，通常多指用⟦1|100℃⟧以上的加压蒸汽进行灭菌。"]], 0],
[1, 6, 0, 17, "巴氏消毒法（pasteurization）", [[0, "巴氏⟦1|消毒⟧法是由巴斯德发明的一种低温湿热⟦1|灭菌⟧法，一般在60～⟦1|85℃⟧下处理30min至1.5s，主要用于牛奶、果酒等液态风味食品的消毒。"]], 0],
[1, 6, 0, 18, "间歇灭菌法（fractional sterilization）", [[0, "一种适用于不耐热⟦1|培养基⟧的⟦1|灭菌⟧方法。一般将⟦2|培养⟧基放在⟦1|100℃⟧下蒸煮15min，然后置⟦1|37℃⟧下过夜（诱使残留⟦1|芽孢⟧发芽），次日再重复蒸煮，过夜，如此重复3d即可。"]], 0],
[1, 6, 0, 19, "加压蒸气灭菌法（autoclaving）", [[0, "一种利用⟦1|100℃⟧以上的高温（而非压力）蒸气进行湿热⟦1|灭菌⟧的方法，用特制的耐压灭菌锅进行。广泛应用于⟦1|培养基⟧和各种物件灭菌。"]], 0],
[1, 6, 0, 20, "最低抑制浓度（minimuminhibitoryconcentrationMIC）", [[0, "评定某化学药物药效强弱的一种指标。指在三定条伴下，（某化学药剂抑制特定⟦1|微生物⟧的最低浓度。"]], 0],
[1, 6, 0, 21, "半致死剂量（50lethaldose，LDso）", [[0, "评定某化学药物毒性强弱的一种指标。指在一定条件下，某化学药剂能杀死⟦1|50%⟧试验动物时的剂量。"]], 0],
[1, 6, 0, 22, "最低致死剂量（minimumlethal dose，MLD）", [[0, "评定某化学药物毒性强弱的一种指标。指在一定条件下，某化学药物能引起试验动物群体⟦1|100%⟧死亡率的最低剂量。"]], 0],
[1, 6, 0, 23, "表面消毒剂（surfacedisinfectant）", [[0, "指对一切活⟦1|细胞⟧、⟦1|病毒⟧粒和生物大分子都有毒性，不能用作活细胞或机体内治疗用的化学药剂。它适用于消除传播媒介物上的病原体，故在传染病预防中，可有效切断疾病传播途径，以达到控制传染病流行的目的"]], 0],
[1, 6, 0, 24, "抗菌谱（antibiogram）", [[0, "指某种或一类⟦1|抗生素⟧的制菌范围。如青霉素以抑制G+⟦1|细菌⟧为主，链霉素以抑制G-细菌为主，四环素等抗生素可同时抑制G*、G一等多种细菌，故称后者为广谱抗生素。"]], 0],
[1, 6, 0, 25, "半合成抗生素（semi-syntheticantibiotics）", [[0, "是对天然⟦1|抗生素⟧的⟦1|结构⟧进行人为改造后的抗生紫，一般具有提高疗效、降低毒性、提高稳定性或抗耐药菌等优点。"]], 0],
[1, 6, 1, 1, "有哪些方法可以获得微生物纯培养？各自的原理和优缺点是什么？", [[0, "（1）获得⟦1|微生物⟧⟦1|纯培养⟧的方法"], [1, "①用固体⟦1|培养基⟧获得⟦1|纯培养⟧；涂布平板法、稀释倒平板法、平板划线法和稀释摇管法。"], [1, "②用液体⟦1|培养基⟧获得⟦1|纯培养⟧：稀释法。"], [0, "（2）各自的原理和优缺点"], [1, "①涂布平板法a．原理：先将已熔化的⟦1|培养基⟧倒入无菌⟦2|培养⟧皿，制成无菌平板，冷却凝固后，将一定量的某一稀释度的样品悬液滴加在平板表面，再用无菌涂布棒将菌液均匀分散至整个平板表面，经培养后挑取单个⟦1|菌落⟧。b．优点：不易造成热敏⟦2|细菌⟧的死亡，是相对于稀释倒平板法而言更常用的一种纯种分离方法。c.缺点：不能计数"], [1, "②稀释倒平板法a、原理：先将待分离的材料用无菌水作一系列的稀释，然后分别取不同稀释液少许，与已熔化并冷却至⟦1|50℃⟧左右的琼脂⟦1|培养基⟧混合，摇匀后倾入灭过菌的⟦2|培养⟧皿中，待琼脂凝固后，制成可能含菌的琼脂平板，保温培养一定时间即可出现⟦1|菌落⟧。b、优点：如果稀释得当，在平板表面或琼脂培养基中就可出现分散的单个菌落。℃、缺点：会使一些严格好氧菌因被固定在琼脂中间缺乏氧气而影响其⟦2|生长⟧。"], [1, "③平板划线法a、原理：用接种环以无菌操作蘸取少许待分离的材料，在无菌平板表面进行平行划线、扇形划线或其他形式的连续划线，⟦1|微生物⟧⟦2|细胞⟧数量将随着划线次数的增加而减少，并逐步分散开来。b、优点：可以观察⟦1|菌落⟧特征，对混合菌进行分离。C、缺点：不能计数。"], [1, "①稀释摇管法a、原理：先将一系列盛无菌琼脂⟦1|培养基⟧的试管加热，使琼脂熔化后冷却并保持在50°℃左右，将待⟦2|分离⟧的材料用这些试管进行梯度稀释，试管迅速摇动均匀，冷凝后，在琼脂柱表面倾倒一层灭菌液体石蜡和固体石蜡的混合物，将⟦2|培养⟧基和空气隔开。培养后，⟦1|菌落⟧形成在琼脂柱的中间。b.优点：可分离严格厌氧菌。C.缺点：操作比较麻烦。"], [1, "⑤稀释法 a.原理：接种物在液体⟦1|培养基⟧中进行顺序稀释，以得到高度稀释的效果，使一支试管中分配不到一个⟦2|微生物⟧。如果经稀释后的大多数试管中没有微生物生长，那么有微生物生长的试管得到的培养物可能就是纯培养物。b.优点：可以分离一些个体大的⟦2|细菌⟧、许多原生动物和藻类等c.缺点：同一个稀释度有较多的平行试管，操作麻烦、微生物⟦1|连续培养⟧的两种方法的特点及异同,作脉效答：（1）连续培养的定义：是指在一个非封闭培养系统中接种微生物菌种，并在培养过程中不断补充新鲜营养液，解除抑制因子，优化生长环境，使微生物的液体培养物长期维持稳定、高速生长状态的一种溢流培养技术。此种技术可使容器内的培养物达到动态平衡，其中的微生物可长期在指数期的平衡生长状态和恒定的生长速率上，于是形成了微生物的连续生长。"], [0, "（2）方式：按控制方式分为恒浊器和恒化器。"], [1, "①恒浊器是指根据培养器内⟦1|微生物⟧的生长密度，并借光电控制系统来控制培养液流速，以取得菌体密度高。生长速率恒定的微生物⟦2|细胞⟧的⟦1|连续培养⟧器。"], [1, "②恒化器是指使培养液的流速保持不变，并使⟦1|微生物⟧始终在低于其最高生长速率的条件下进行生长繁殖的⟦1|连续培养⟧装置。该装置通过控制某一⟦2|营养⟧物的浓度，使其始终成为生长限制因子的条件下达到的，因而可称为外控制式的连续培养装置。"], [1, "③恒浊器和恒化器比较"], [0, "恒浊器（内控制）：控制对象 菌体密度；⟦1|培养基⟧限制因子 无限制；培养基流速 不固定；⟦1|生长⟧速率 最高速率；主要应用范围 大量菌体或菌体及其⟦2|代谢⟧产物的生产为主"], [0, "恒化器（外控制）：控制对象 ⟦1|生长⟧因子；⟦1|培养基⟧限制因子 有限制；⟦2|培养⟧基流速 恒定；生长速率 低于最高速率；主要应用范围 不同生长速率的菌体研究，实验室应用为主"]], 0],
[1, 6, 1, 2, "简述微生物的高密度培养的定义和可用方法。", [[0, "（1）定义⟦1|微生物⟧的高密度培养一般是指微生物在液体培养条件下⟦2|细胞⟧群体密度超过常规培养⟦1|10倍⟧以上时的生长状态或培养技术。"], [0, "（2）进行高密度⟦1|培养⟧的具体方法"], [1, "①选取最佳⟦1|培养基⟧成分和各成分含量："], [1, "②适时补料，且补料一般应采用逐量流加的方式进行；"], [1, "③提高溶解氧的浓度，特别是提高⟦1|好氧⟧菌和兼性⟦1|厌氧⟧菌⟦2|培养⟧时溶氧量；"], [1, "④防止有害⟦1|代谢⟧产物的生成；"], [1, "③保持合适pH，主要通过使⟦1|培养⟧液保持良好的缓冲性能来维持合适的pH。"]], 0],
[1, 6, 1, 3, "在微生物培养过程中，培养基的pH变化有何的规律如何？如何合理调整以利微生物更好地生长和产生大量代谢产物？", [[0, "（1）规律"], [1, "①在一般⟦1|微生物⟧的⟦2|培养⟧中往往以变酸占优势，即随着培养时间的延长，⟦1|培养基⟧的 pH会逐渐下降；"], [1, "②pH的变化与⟦1|培养基⟧的组分尤其是碳氮比有很大的关系。碳氮比高的⟦2|培养⟧基，例如培养各种⟦1|真菌⟧的培养基，经培养后其pH常会显著下降；相反，碳氮比低的培养基，例如培养一般⟦2|细菌⟧的培养基，经培养后，其pH常会明显上升。"], [0, "（2）人工调节pH的措施分成\"治标\"和“治本\"两大类，前者指根据表面现象而进行直接、及时、快速但不持久的表面化调节，后者则是指根据内在机制而采用的间接、缓效但可发挥持久作用的调节，具体方法如下r过酸时：加NaONagCo,等碱液中和"], [0, "w治标”过碱时：加H，SO+HCI等酸液中和"], [0, "pH调节过酸时r加适当⟦1|氮源⟧：加尿素，NaNO，NHOH或⟦2|蛋白质⟧等"], [1, "提高通蓬"], [0, "治本鞋加适当⟦1|碳源⟧：加糖、乳酸、乙酸、柠檬酸或油脂等"], [1, "过碱时"], [1, "降低通气量"]], 0],
[1, 6, 1, 4, "试结合微生物在自然界中分布的特点，谈谈为什么无菌操作是微生物学研究和应用的基础，可以分别采用哪些方法对实验所用到的器具和实验材料进行消毒和灭菌？", [[0, "（1）无菌操作是⟦1|微生物⟧学研究和应用的基础的原因因为微生物通常是肉眼看不到的微小生物，而且无处不在。［因此，在微生物的研究及应用中，不仅需要通过分离纯化技术从混杂的天然微生物群中分离出特定的微生物，而且还必须随时注意保持微生物⟦1|纯培养⟧物的“纯洁”，防止其他微生物的混入，所操作的微生物⟦2|培养⟧物也不应对环境造成污染。所以无菌技术是保证微生物学研究正常进行的关键。"], [0, "（2）⟦1|微生物⟧学实验材料的⟦1|灭菌⟧方法如下："], [1, "①高压蒸汽⟦1|灭菌⟧：适用于⟦1|培养基⟧灭菌。"], [1, "②灼烧⟦1|灭菌⟧：适用于无菌操作的器械。"], [1, "③高温干热⟦1|灭菌⟧：适用于玻璃器血及⟦1|耐热⟧器具。"], [1, "④紫外线⟦1|灭菌⟧：适用于上述各种器械。"], [0, "（3）各种⟦1|灭菌⟧方法的原理如下："], [1, "①高压蒸汽灭菌的原理：在密闭的蒸锅内，其中的蒸汽不能外溢，压力不断上升，使水的沸点不断提高，从而锅内温度也随之增加。在0.1MPa的压力下，锅内温度达⟦1|121℃⟧。在此蒸汽温度下，可以很快杀死各种⟦2|细菌⟧及其高度耐热的⟦1|芽孢⟧，同时可以基本保持⟦1|培养基⟧的⟦2|营养⟧成分不被破坏。"], [1, "②灼烧⟦1|灭菌⟧的原理：镊子、剪刀、解剖刀等浸入⟦1|95%⟧的酒精中，使用前取出在酒精灯前灼烧灭菌，灼烧后立即使用。"], [1, "③高温干热⟦1|灭菌⟧的原理：干热灭菌是利用烘箱加热到160~⟦1|180℃⟧的温度来杀死⟦2|微生物⟧。由于在干热条件下，⟦2|细菌⟧的营养细胞的抗热性大为提高，接近⟦1|芽孢⟧的抗热水平，通常采用170℃持续90min来灭菌。"], [1, "④紫外线⟦1|灭菌⟧的原理：在接种室、超净台上或接种箱中用紫外灯灭菌。紫外线灭菌是利用辐射因子灭菌，⟦1|细菌⟧吸收紫外线后，⟦2|蛋白质⟧和核酸发生结构变化，引起细菌的染色体变异，造成死亡。"]], 0],
[1, 7, 0, 1, "R质粒（Rplasmid，resistanceplasmid）", [[0, "又称R因子或抗性因子。是指能抗多种⟦1|抗生素⟧等药物并有转移能力的⟦1|质粒⟧。一般由两个相连的DNA片段组成一抗性转移因子和抗性决定子。"]], 0],
[1, 7, 0, 2, "Col质粒（colicinplasmid，Colplasmid）", [[0, "又称产大肠杆菌素因子，是指能够编码大肠杆菌素的⟦1|质粒⟧。如大肠杆菌素是一类由E.coli某些⟦1|菌株⟧所产生的⟦2|细菌⟧素，具有通过抑制复制、转录、翻译或⟦2|能量⟧⟦2|代谢⟧等方式而专一地杀死他种肠道菌或同种其他菌株的能力"]], 0],
[1, 7, 0, 3, "细菌素（bacteriocin）", [[0, "是由⟦1|质粒⟧编码的⟦2|蛋白质⟧，且不像⟦1|抗生素⟧那样具有很广的杀菌谱，能够使得许多⟦2|细菌⟧都能产生抑制或杀死其他近缘细菌或同种不同⟦1|菌株⟧的⟦2|代谢⟧产物"]], 0],
[1, 7, 0, 4, "T1质粒（tumorinducingplasmid）", [[0, "又称诱癌⟦1|质粒⟧或冠瘦质粒，是指包括毒性区、⟦1|接合⟧转移区、复制起始区和T-DNA区的一种环状质粒，如根癌土壤杆菌或根癌农杆菌从一些双子叶植物的受伤根部侵入根部⟦2|细胞⟧后，最后在其中溶解，释放出T1质粒，其上的T-DNA片段会与植物细胞的核基因组整合，合成正常植株所没有的冠瘦碱类，破坏控制细胞分裂的激素调节系统，从而使它转为癌细胞。"]], 0],
[1, 7, 0, 5, "Ri质粒（Riplasmid）", [[0, "Ri⟦1|质粒⟧与T1质粒相似，含有该质粒的菌侵入植物根部⟦2|细胞⟧后，会将大型Ri质粒中的一段T-DNA整合到宿主根部细胞的核基因组中，便之发生⟦1|转化⟧，从而这段T-DNA就在宿主细胞中稳定地⟦2|遗传⟧下去。"]], 0],
[1, 7, 0, 6, "mega质粒（mega plasmid）", [[0, "即巨大⟦1|质粒⟧，存在于Rhizobium（根瘤菌属）中，其上有一系列与共生⟦1|固氮⟧相关的基因，分子量比一般质粒大几十倍至几百倍。"]], 0],
[1, 7, 0, 7, "降解性质粒（degradativeplasmid）", [[0, "这类⟦1|质粒⟧可为降解一系列复杂有机物的⟦2|酶⟧编码，从而使这类⟦2|细菌⟧在污水处理、环境保护等方面发挥特有的作用。S、⟦2|生理⟧功能性质粒如广泛分布于链⟦1|霉菌⟧属中的多种产⟦1|抗生素⟧质粒，欧文氏菌属和葡萄球菌属中的产色素质粒，以及若干种肠道杆菌所具有的利用乳糖、蔗糖、尿素和固氮的质粒等。"]], 0],
[1, 7, 0, 8, "野生型菌株（wild strain）", [[0, "野生型⟦1|菌株⟧即从自然界⟦1|分离⟧到的任何⟦2|微生物⟧的原始菌株。"]], 0],
[1, 7, 0, 9, "突变株（mutant）", [[0, "⟦1|突变⟧株即野生型⟦1|菌株⟧经自发或诱发突变后出现新性状的菌株。"]], 0],
[1, 7, 0, 10, "选择性突变株（selectivemutant）", [[0, "选择性⟦1|突变⟧株是能用选择性⟦1|培养基⟧或其他选择性条件快速选择出来的突变株。"]], 0],
[1, 7, 0, 11, "形态突变型（morphological mutant）", [[0, "指由突变引起的个体或⟦1|菌落⟧形态的⟦2|变异⟧，一般属非选择性突变。例如：⟦2|细菌⟧的⟦1|鞭毛⟧的有无，霉菌或⟦1|放线菌⟧的孢子有无或颜色变化，⟦2|细胞⟧产可溶性色素的变化、菌落表面的光滑、粗糙以及噬菌斑的大小或清晰度等的突变。"]], 0],
[1, 7, 0, 12, "抗原突变型（antigenicmutant）", [[0, "指由于基因突变引起的⟦2|细胞⟧抗原结构发生的⟦2|变异⟧类型，包括⟦1|细胞壁⟧缺陷变异（L型⟦2|细菌⟧等）、⟦1|荚膜⟧或⟦1|鞭毛⟧成分变异等，一般也属非选择性突变。"]], 0],
[1, 7, 0, 13, "产量突变型（metabolite quantitative mutant）", [[0, "通过基因⟦1|突变⟧而产生的在⟦2|代谢⟧产物产量上明显有别于原始⟦1|菌株⟧的突变株，称产量突变型。若产量显著高于原始菌株者，称正变株（plus-mutant），反之则称负变株（minusmutant）。"]], 0],
[1, 7, 0, 14, "突变率（mutationrate）", [[0, "某一⟦2|细胞⟧（或⟦1|病毒⟧体）在每一世代中发生某一性状⟦1|突变⟧的概率，称突变率。突变率可用某一单位群体在每一世代（即分裂1次）中产生突变株的数目来表示"]], 0],
[1, 7, 0, 15, "点突变（point mutation）", [[0, "仅局限在一对碱基发生变化的⟦1|突变⟧称为点突变。"]], 0],
[1, 7, 0, 16, "诱发突变（inducedmutation）", [[0, "诱发⟦1|突变⟧简称⟦1|诱变⟧。它是人为地利用理化因素或生物因素显著提高⟦2|微生物⟧突变频率的突变类型。"]], 0],
[1, 7, 0, 17, "诱变剂（mutagen）", [[0, "⟦1|诱变⟧剂是能提高⟦1|突变⟧频率的任何物理因素、化学因素或生物因素。"]], 0],
[1, 7, 0, 18, "自发突变（spontaneousmutation）", [[0, "自发⟦1|突变⟧是生物体在无人工干预下自然发生的低频率突变现象。"]], 0],
[1, 7, 0, 19, "原养型（prototroph）", [[0, "原养型是⟦2|营养⟧缺陷型⟦1|突变⟧株经回复突变或与其营养互补的缺陷⟦1|菌株⟧发生重组后形成的新菌株。其营养要求在表型上与野生型菌株相同。"]], 0],
[1, 7, 0, 20, "夹层平板培养法（sandwichplatingculture）", [[0, "一种用于筛选⟦2|营养⟧缺陷型的⟦2|培养⟧方法。先在培养血底部倒一层基本⟦1|培养基⟧，待凝固后，再倒一层混有⟦1|诱变⟧剂处理后菌液的基本培养基，最后再倒一层不含菌的基本培养基。经培养后，对在第二层（中间层）中首次出现的⟦1|菌落⟧作一标记，然后在平板上再倒一层完全培养基。经培养后，在第二层中又会产生若干个新的小菌落，它们多数是营养缺陷型。"]], 0],
[1, 7, 0, 21, "基本培养基（minimalmedium，MM）", [[0, "仅能满足某⟦2|微生物⟧的野生型⟦1|菌株⟧⟦2|生长⟧所需最低成分的组合⟦1|培养基⟧，称为基本⟦2|培养⟧基。一般用[一]符号表示。"]], 0],
[1, 7, 0, 22, "完全培养基（completemedium，CM）", [[0, "完全⟦1|培养基⟧是可满足某⟦2|微生物⟧一切⟦2|营养⟧缺陷型⟦1|菌株⟧营养需要的天然或半组合⟦2|培养⟧基。一般用[+]符号表示。"]], 0],
[1, 7, 0, 23, "补充培养基（supplementalmedium）", [[0, "补充⟦1|培养基⟧是只能满足某⟦2|微生物⟧相应⟦2|营养⟧缺陷型⟦1|突变⟧株生长所需要的组合培养基或半组合培养基。一般可在基本培养基上再添加该营养缺陷型所不能合成的某一种或几种⟦2|代谢⟧物如 A、B等组成。一般用[A]或[B]等符号表示。"]], 0],
[1, 7, 0, 24, "F+菌株（F+strain）", [[0, "：F+⟦1|菌株⟧即“雄性\"菌株"], [0, "。指某些⟦2|细菌⟧⟦2|细胞⟧内存在一个至几个F⟦1|质粒⟧，并在细胞表面着生一条至几条性⟦1|菌毛⟧，可向F-⟦1|菌株⟧传递F质粒或部分⟦2|遗传⟧性状的菌株。"]], 0],
[1, 7, 0, 25, "F-菌株（Fstrain）", [[0, "F-⟦1|菌株⟧即\"雌性\"菌株。指某些⟦2|细菌⟧中与F+菌株相对应的、⟦2|细胞⟧中无F⟦1|质粒⟧、细胞表面无性⟦1|菌毛⟧的菌株。它可分别接受来自F+、F'或Hfr菌株的F质粒、F质粒或Hfr⟦2|遗传⟧因子。"]], 0],
[1, 7, 0, 26, "F菌株（F'strain）", [[0, "F⟦1|菌株⟧即带有F⟦1|质粒⟧的菌株。由Hfr菌株中的F质粒通过不正常切离脱离核⟦2|染色⟧体组时形成。"]], 0],
[1, 7, 0, 27, "Hfr菌株（Hfrstrain）", [[0, "⟦1|菌株⟧即高频重组菌株。某些⟦2|细菌⟧（如大肠杆菌）的F+菌株中的F因子由游离态转变成整合态后即称为Hf菌株。当它与F-菌株⟦1|接合⟧后，可由F因子携带较多基因至F菌株恢而使后者重组频率大为提高，故名。"]], 0],
[1, 7, 0, 28, "接合中断法（interrupted mating experiment）", [[0, "根据Hf⟦1|菌株⟧与F菌株⟦1|接合⟧过程有稳定的速度和严格顺序的原理，采用接合中断器随时中断接合，以获得来自Hf菌株不同⟦2|遗传⟧性状的F接合子的方法，称接合中断法。利用此法可绘制该⟦2|细菌⟧的环状⟦2|染色⟧体图。"]], 0],
[1, 7, 0, 29, "F质粒转导", [[0, "F⟦1|质粒⟧⟦1|转导⟧又称F因子转导或性导。以F质粒来传递供体菌株基因给受体菌株的一种⟦1|接合⟧方式。"]], 0],
[1, 7, 0, 30, "原生质体融合（protoplastfusion）", [[0, "通过人为的方法，使⟦1|遗传⟧性状不同的两个⟦2|细胞⟧的⟦1|原生质体⟧进行融合，借以获得兼有双亲遗传性状的稳定重组子的过程。"]], 0],
[1, 7, 1, 1, "某药厂声称其生产的药物A无致癌作用，请用微生物学的方法设计实验加以证明，并说明原理。（高校真题）", [[0, "（1）设计思路：依据Ames试验的回复⟦1|突变⟧可设计如下实验⟦1|鉴定⟧药物A的致癌作用。"], [0, "（2）设计原理：靶⟦1|细胞⟧在⟦2|营养⟧缺失的情况下会减缓分裂速度甚至停止分裂，若药物A作用于靶细胞后，会让靶细胞的分裂速度大大加快，则说明药物A会诱导靶细胞发生回复⟦1|突变⟧，药物A真有致癌作用。靶细胞分裂速度越快，说明药物A的致癌作用越高。"], [0, "（3）主要步骤："], [1, "①假设药物A的靶⟦1|细胞⟧为B，且B为⟦2|营养⟧缺陷型⟦1|菌株⟧。"], [1, "②制作三块牛肉膏蛋白陈固体⟦1|培养基⟧，分别编号为a、b、c。a⟦1|培养⟧基中不含His：b、c培养基中含有少量His；且只有培养基含有药物A。"], [1, "③向a、b、c⟦1|培养基⟧中分别接种同种等量的B⟦1|菌株⟧，在同一条件下进行⟦2|培养⟧。"], [1, "④⟦2|培养⟧一段时间后：结果一：若观察a⟦1|培养基⟧中无存活B菌株，b、c培养基中只有少量存活的菌株（未形成⟦1|菌落⟧），则说明药物A无致癌作用；结果二：若观察a培养基中无存活B菌株，b培养基中只有少量存活的菌株（未形成菌落），c培养基中发现大量存活菌株（形成菌落），则说明药物A有致癌作用。"]], 0],
[1, 7, 1, 2, "请用实验区分转化、转导、接合", [[0, "（1）实验操作：将两个不同的⟦2|营养⟧缺陷型菌株A和B分别接种到U形管两臂进行⟦2|培养⟧后，再分别涂布到基本⟦1|培养基⟧上。会出现三种情况：分别涂布后均无⟦1|菌落⟧出现、分别涂布后均有菌落出现、分别涂布后一边出现菌落"], [0, "（2）实验结论：分别对应了三种结果：接合、⟦1|转化⟧⟦1|转导⟧"], [0, "（3）原理：U形管不允许⟦1|细菌⟧⟦2|细胞⟧通过，但允许两臂交流营养成分。"], [1, "①⟦1|接合⟧需要⟦2|细胞⟧与细胞的直接接触才产生接合子，所以在U形管中无法进行接合，涂布后无⟦1|菌落⟧。"], [1, "②⟦1|转化⟧是受体⟦2|细胞⟧从环境中直接吸取游离的DNA片段而形成转化子，所以U形管两侧都可以形成转化子，涂布后两边均有⟦1|菌落⟧。"], [1, "③转导是以⟦1|噬菌体⟧作媒介，将一个⟦2|细胞⟧的⟦2|遗传⟧物质传递给另一个细胞的过程，而噬菌体是可过滤因子，可以穿过U形管，但噬菌体的出现意味着菌体的破裂，所以只有一侧涂布后有⟦1|菌落⟧"]], 0],
[1, 7, 1, 3, "抗生素法和菌丝过滤法为何能“浓缩”营养缺陷型突变株？", [[0, "⟦1|抗生素⟧法和菌丝过滤法能“浓缩”⟦2|营养⟧缺陷型⟦1|突变⟧株的原因如下："], [0, "（1）⟦1|抗生素⟧法抗生素法有青霉素法和制⟦1|霉菌⟧素法。"], [1, "①青霉素法主要适用于⟦2|细菌⟧，其原理是：青霉素能抑制细菌⟦1|细胞壁⟧的生物合成，因而能杀死生长繁殖着的细菌，但不能杀死处于休止状态的细菌。如果将诱变后的细菌培养在含有青霉素的基本⟦1|培养基⟧中，就可淘汰大部分生长繁殖活跃的野生型⟦2|细胞⟧，从而达到浓缩\"营养缺陷型细胞胞目胞n白r"], [1, "②制霉菌素法则适合于真菌，制霉菌素属于大环内酯类⟦1|抗生素⟧，可与真菌⟦1|细胞膜⟧上的甾醇作用，从而引起⟦2|细胞⟧膜的损伤。因为它只能杀死生长繁殖着的酵母或霉菌，所以也可用于淘汰相应的野生型菌株和“浓缩”⟦2|营养⟧缺陷型菌株。"], [0, "（2）菌丝过滤法菌丝过滤法适用于丝状⟦2|生长⟧的真菌或⟦1|放线菌⟧。其原理是：在基本⟦1|培养基⟧中，野生型的孢子能发芽成菌丝，而⟦2|营养⟧缺陷型的孢子则不能。因此，将诱变剂处理后的孢子在基本培养基中培养一段时间后，再用擦镜纸等合适的滤纸过滤。如此重复数次后，就可去除大部分野生型个体，达到“浓缩\"营养缺陷型的目的。"]], 0],
[1, 7, 1, 4, "简述微生物在基因工程中的重要性", [[0, "⟦1|微生物⟧在基因工程中承担着重要的角色"], [0, "（1）载体：能充当目的基因载体的，不是⟦2|微生物⟧本身（如⟦1|病毒⟧、⟦1|噬菌体⟧），就是微生物的一部分构造（如⟦2|细菌⟧和醇母菌中的质粒）。"], [0, "（2）工具⟦1|酶⟧：千余种特异工具酶几乎均来自⟦2|微生物⟧。"], [0, "（3）受体：作为基因工程中的受体⟦1|细胞⟧，被大量使用的主要是具有优越体制、容易培养和能高效表达的目的基因的各种性状的⟦2|微生物⟧细胞和微生物化的高等动、植物单细胞株。"], [0, "（4）⟦1|微生物⟧工程：“工程菌\"的大量⟦2|生长⟧繁殖和发挥生物化学⟦1|转化⟧作用，必须通过微生物工程的协助。"], [0, "（4）目的基因的主要供体：⟦1|微生物⟧在其⟦2|代谢⟧多样性和遗传多样性等方面具有独特的优势，是一个最重要的外源基因供体库。"]], 0],
[1, 7, 1, 5, "简述菌种衰退的表现和防止方法。", [[0, "（1）衰退（degeneration）是指某纯种⟦1|微生物⟧群体中的个别个体由于自发⟦1|突变⟧的结果，而使该物种原有一系列生物学性状发生量变或质变的现象。"], [0, "（2）具体表现"], [1, "①原有⟦1|形态⟧性状变得不典型了；"], [1, "②⟦1|生长⟧速度变慢，产生的⟦1|孢子⟧变少；"], [1, "③⟦1|代谢⟧产物生产能力下降，即出现负变；"], [1, "④⟦1|致病⟧菌对宿主侵染力的下降；"], [1, "③对外界不良条件包括低温、高温或⟦1|噬菌体⟧侵染等抵抗能力的下降等。"], [0, "（3）衰退防止方法"], [1, "①控制传代次数："], [1, "②创造良好的⟦1|培养⟧条件；"], [1, "③利用不易衰退的⟦1|细胞⟧传代；"], [1, "④采用有效的⟦1|菌种⟧保藏方法。"]], 0],
[1, 7, 1, 6, "常用的菌种保藏方法有哪些，简述各自的原理和优缺点。", [[0, "（1）常用的⟦1|菌种⟧保藏方法："], [1, "①传代⟦1|培养⟧保藏：传代培养保藏又称悬液保藏法。由于传代培养与培养物的直接使用密切相关，所以传代培养保藏是进行⟦2|微生物⟧保藏的基本方法。"], [1, "②冷冻保藏：冷冻保藏是指将⟦1|微生物⟧处于冷冻状态，使其⟦2|代谢⟧作用停止，从而达到保藏的目的。"], [1, "③干燥保藏法：因为水分对各种生化反应和一切生命活动至关重要，因此，干燥，尤其是深度干燥是⟦1|微生物⟧保藏技术中另一项经常采用的手段。"], [0, "（2）各自的原理和优缺点："], [1, "①传代培养保藏a.原理：通过降低被保藏⟦2|微生物⟧的⟦2|代谢⟧水平或防止⟦1|培养基⟧干燥，可延长传代保藏的保存时间。b.优点：操作简单，经济实用。c.缺点：菌种进行长期传代十分繁琐，容易污染，特别是会由于菌株的自发⟦1|突变⟧而导致菌种衰退，使菌株的形态、生理特性、代谢物的产量等发生变化。因此在一般情况下，在实验室里除了采用传代法对常用的菌种进行保存外，还必须根据条件采用其他方法，特别是对那些需要长期保存的菌种更是如此。"], [1, "②冷冻保藏a.原理：将⟦2|微生物⟧处于冷冻状态，使其代谢作用停止，以达到保藏的目的。b.优点：适用的微生物范围更广，使用更普遍。c,缺点；体积大的⟦2|细胞⟧和无⟦1|细胞壁⟧的细胞对低温更敏感，其原因是低温会使细胞内的水分形成冰晶，从而引起细胞，尤其是⟦1|细胞膜⟧的损伤。"], [1, "③干燥保藏法a.原理：主要包括沙士管保存和冷冻真空保藏两项⟦2|微生物⟧干燥保藏技术。第一，沙土管保存：一般将菌种接种斜面，培养至长出大量的孢子后，洗下孢子制备孢子悬液，加入无菌的沙土管中，减压干燥，直至将水分抽干，最后用石蜡、胶塞等封闭管口，置冰箱保存。第二、冷冻真空保藏：将加有保护剂的⟦2|细胞⟧样品预先冷冻使其冻结，然后在真空下通过冰的升华作用除去水分使其可在真空或情性气体的密闭环境中置低温保存，从而使微生物处于干燥、缺氧及低温的状态进行休眠，可以达到长期保藏的目的。b.优点：沙士管保存主要适用于产孢子的微生物，如⟦1|芽孢⟧杆菌、⟦1|放线菌⟧等。此法简便易行，并可以将微生物保藏较长时间，适合一般实验室及以放线菌等为菌种的发酵工厂采用。冷冻真空保藏用冰升华的方式除去水分，手段比较温和，细胞受损伤的程度相对较小，存活率及保藏效果均不错，而且经抽真空封闭的菌种安颤管的保存、邮寄、使用均很方便。因此冷冻真空干燥保藏是目前使用最普遍最重要的微生物保藏方法，大多数专业的菌种保藏机构均采用此法作为主要的微生物保存手段。C。缺点：设备较贵，操作麻烦，较适用于专业保藏。"]], 0],
[1, 8, 0, 1, "微生物生态学（microbial ecology）", [[0, "⟦1|微生物⟧⟦2|生态⟧学是研究微生物群体与其周围生物和非生物环境间相互作用的规律，并将这些规律运用于实践的一门生态学分支学科。"]], 0],
[1, 8, 0, 2, "大肠菌群（coliforms）", [[0, "大肠菌群指任何可⟦1|发酵⟧乳糖并产酸产气的杆状、无⟦1|芽孢⟧、兼性⟦1|厌氧⟧的肠道杆菌，主要是大肠杆菌和一些产气肠杆菌等。水源、饮水或食品中大肠菌群的数量代表它们与动物粪便接触的程度，故是饮用水等的重要卫生指标。"]], 0],
[1, 8, 0, 3, "嗜热微生物（thermophile）", [[0, "只能生活在⟦1|45℃⟧以上环境中的⟦1|微生物⟧。广泛分布于草堆、肥、煤堆、温泉、火山地、地热区土壤和海底火山口附近。"]], 0],
[1, 8, 0, 4, "嗜冷微生物（psychrophile）", [[0, "嗜冷⟦2|微生物⟧是一类最适⟦2|生长⟧⟦2|温度⟧低于⟦1|15℃⟧、最高生长温度低于⟦1|20℃⟧和最低生长温度低于0℃的微生物。"]], 0],
[1, 8, 0, 5, "嗜酸微生物（acidophile）", [[0, "只能生活在pH<4的条件下，在中性pH下即发生死亡的⟦1|微生物⟧。"]], 0],
[1, 8, 0, 6, "嗜碱微生物（alkalophile）", [[0, "能专性生活在pH10~11的碱性条件下而不能生活在中性pH条件下的⟦1|微生物⟧。多分布于碱性盐湖和高碳酸盐含量的土壤中。"]], 0],
[1, 8, 0, 7, "嗜盆菌（halophile）", [[0, "⟦1|嗜盐⟧菌是一类必须生活在高盐度环境下的⟦1|微生物⟧，包括多种⟦2|细菌⟧和少数藻类。其中极端嗜盐菌的最适⟦2|生长⟧盐浓度（NaCl）为2.5~5.2mol/L。&、嗜压菌（barophile）嗜压菌是一类必须生长在高静水压环境中的微生物，均为原核生物，般生活在低温深海区。"]], 0],
[1, 8, 0, 8, "抗辐射微生物（radioresistantmicroorganisms）", [[0, "抗辐射⟦1|微生物⟧是对辐射具有强大抗性的微生物，包括病⟦2|细菌⟧C⟦1|真菌⟧藻类和原生动物。至今所知抗辐射能力最强的微生物是耐辐射异常球菌。"]], 0],
[1, 8, 0, 9, "无菌动物（germ-freeanimal）", [[0, "无菌动物是一类在严格无菌条件下，将剖腹产的哺乳动物或特别孵育的禽类等实验动物，放在无菌培养器中加以精心培养而获得的不含任何活的⟦1|微生物⟧的动物。可用于在排除正常菌群干扰条件下研究动物的⟦1|免疫⟧、⟦2|营养⟧、⟦2|代谢⟧、衰老或疾病等规律。"]], 0],
[1, 8, 0, 10, "悉生生物（gnotobiota）", [[0, "悉生生物是一类已人为地接种上某种或某些已知纯种⟦1|微生物⟧的无菌动物或无菌植物。"]], 0],
[1, 8, 0, 11, "根际微生物（rhizospheremicroorganisms）", [[0, "根际⟦1|微生物⟧又称根圈微生物。生活在根系邻近土壤，依赖根部的分泌物、外渗物和脱落⟦2|细胞⟧而⟦2|生长⟧，一般对植物发挥有益作用的正常菌群。"]], 0],
[1, 8, 0, 12, "附生微生物（epibioticmicroorganisms）", [[0, "附生⟦1|微生物⟧指生活在植物地上部分表面，主要借植物外渗物质或分泌物质为⟦2|营养⟧的正常菌群，一般指叶面"], [0, "⟦1|微生物⟧。"]], 0],
[1, 8, 0, 13, "互生（metabiosis）", [[0, "是指两种可单独生活的生物，当二者在一起时，通过各自的⟦1|代谢⟧活动而有利于对方，或偏利于一方的生活方式，是一种“可分可合，合比分好”的松散的相互关系。"]], 0],
[1, 8, 0, 14, "共生（symbiosis）", [[0, "共生指两种生物共居在一起，相互分工合作，相依为命，甚至达到难分难解、合二为一的极其紧密的一种相互关系。如菌藻共生的地衣，豆科植物与⟦1|细菌⟧共生而形成的根瘤等。"]], 0],
[1, 8, 0, 15, "寄生（parasitism）", [[0, "一般指一种小型生物生活在另一种较大型生物的体内（包括⟦1|细胞⟧内）或体表，从中夺取⟦2|营养⟧并进行⟦2|生长⟧繁殖，同时使后者蒙受损害甚至被杀死的一种相互关系。前者称为寄生物，后者则称作宿主或寄主。寄生又可分为细胞内寄生和细胞外寄生，或专性寄生和兼性寄生等数种。"]], 0],
[1, 8, 0, 16, "拮抗（antagonism）", [[0, "是指由某种生物所产生的特定⟦1|代谢⟧产物可抑制他种生物的⟦2|生长⟧发育甚至杀死它们的一种相互关系。由拮抗性⟦2|微生物⟧产生的抑制或杀死他种生物的⟦1|抗生素⟧，是最典型并与人类关系最密切的拮抗。"]], 0],
[1, 8, 0, 17, "捕食（predation）", [[0, "是指一种大型的生物直接捕捉、吞食另一种小型生物以满足其⟦1|营养⟧需要的相互关系。⟦2|微生物⟧间的捕食关系主要是原生动物捕食⟦2|细菌⟧和藻类，它是水体生态系统中食物链的基本环节，在污水净化中也有重要作用。另有一类是由捕食性⟦1|真菌⟧例等利用菌环、菌套巧妙地抽食土壤线虫"]], 0],
[1, 8, 0, 18, "混菌培养（mixedcultivation）", [[0, "混菌⟦1|培养⟧又称混合培养。一般指同一培养装置中同时培养两种或几种⟦2|微生物⟧，以达到更好的培养效果的一类培养方法。"]], 0],
[1, 8, 1, 1, "试举例说明微生物之间的共生关系。", [[0, "共生是指两种不同的生物专性结合并产生特殊形态⟦1|结构⟧的共生体，互惠共生的相互关系。⟦2|微生物⟧与植物间存在着共生关系，例如："], [0, "（1）根瘤菌与豆科植物共生⟦1|固氮⟧根瘤菌与植物相互作用形成共生结构一一根瘤，并通过根瘤进行生物固氮，为植物提供氮素营养，同时植物生长⟦2|代谢⟧也为根瘤提供营养养分，固氮反应所需的⟦2|能量⟧还原力、氢载体及⟦1|厌氧⟧微环境条件。一者互惠共生，密不可分。"], [0, "（2）弗兰克氏⟦1|放线菌⟧与非豆科的乔木、灌木（杨梅、木麻黄、沙荆属等）也可形成根瘤等共生⟦2|结构⟧，并共生⟦1|固氮⟧。"], [0, "（3）人与肠道有益⟦1|微生物⟧的共生肠道温度恒定、⟦2|营养⟧丰富，从而为微生物提供了良好的生活环境，而肠道微生物在维持人体肠道正常生理功能中起重要作用，具有改善人体营养吸收、提高⟦1|免疫⟧力、抗病减毒和抗肿瘤等多种功能。"]], 0],
[1, 8, 1, 2, "良好的水体为何具有自体净化能力？如何使水体保持其高度自净能力？", [[0, "（1）良好的水体具有自体净化能力的原因"], [1, "①物理性沉淀、扩散、稀释和化学性的氧化作用；"], [1, "②生物学和生物化学作用，包括⟦1|好氧⟧⟦2|细菌⟧对有机物质的降解和分解作用，原生动物对细菌的吞噬作用，⟦1|噬菌体⟧对细菌的裂解作用，细菌糖被对污染物的吸附、沉降作用等。"], [0, "（2）使水体保持其高度自净能力的方法避免水体发生富集⟦1|营养⟧化以及一些其他严重污染事故。"]], 0],
[1, 8, 1, 3, "为何说在各种污水处理方法中、最根本、最有效、最廉价的手段是借助于微生物的生化处理法？", [[0, "用⟦2|微生物⟧处理、净化污水的过程，实质上是在污水处理装置这一小型人工生态系统内，利用不同⟦2|生理⟧、生化功能微生物间的协同作用而进行的一种物质循环过程。其成为水处理中最根本、最有效、最廉价的手段原因如下：当高BOD的污水进入该系统后，其中自然菌群在充分供氧条件下，相应于污水这种特殊选择性⟦1|培养基⟧的性质和成分，随着时间的推移，发生着有规律的微生物群演替，待系统稳定后，即成了一个良好的混菌⟦1|连续培养⟧器。它可保证污水中的各种有机物或毒物不断发生降解、氧化、转化或吸附、沉降，从而达到消除污染和达到分层的处理效果，气体自然逸出，低BOD的处理水重新流入河道，而残留的少量固态废渣则可进一步通过厌氧发酵产生沼气燃料和有机肥供人们利用。"]], 0],
[1, 8, 1, 4, "试简介用完全混合曝气法处理污水的原理和主要操作。", [[0, "（1）完全混合曝气法处理污水的原理完全混合嘎气法又称表面加速曝气法，是指一种利用活性污泥处理污水的方法。活性污泥是一种由活⟦1|细菌⟧、原生动物和其他⟦2|微生物⟧聚集在一起形成的凝絮团，在污水处理中具有很强的吸附、分解有机物或毒物的能力。"], [0, "（2）完全混合曝气法处理污水的主要操作"], [1, "①将污水与一定量的回流污泥混合后流入曝气池，在通气翼轮的不断充气、搅拌下，与池内的已处理污水充分混合并得到较好的稀释，于是污水中的有机物和其他毒物被污泥中的⟦1|好氧⟧性⟦1|微生物⟧区系所降解、氧化或吸附，而微生物群体则得到了充分的⟦2|繁殖⟧。"], [1, "②经一定时间后，通过溢流而进入沉淀池。在沉淀池内，由于没有通气和搅拌，故活性污泥重新沉入池底，除取出其中一部分作为新流入污水的⟦1|菌种⟧\"外，多余部分一般作⟦1|厌氧⟧消化处理，以进一步降低其BOD值。"]], 0],
[1, 8, 1, 5, "生物发光的机制是什么？发光细菌在监测环境污染中有何作用？其优点如何？！", [[0, "发光⟦2|细菌⟧是一类G一、长有极生⟦1|鞭毛⟧的杆菌或弧菌；兼性⟦1|厌氧⟧，在有氧条件下能发出波长为475-⟦1|505mm⟧的荧光。"], [0, "（1）生物发光的机制NADH中的H先传递给黄素蛋白以形成FMNH，然后其中的H不经过⟦1|呼吸链⟧而直接转移给分子氧，⟦2|能量⟧以光能形式释放。其反应为FMNH2+O2+RCHO>FMH+RCOOH+H2O+光荧光素酶因此，除初级⟦2|电子⟧供体NADH外，发光反应还须提供FMN、长链脂族醛、O2和荧光素酶这⟦1|4个⟧条件。荧光素酶通过自诱导的方式合成。"], [0, "（2）发光⟦1|细菌⟧在监测环境污染中的作用细菌发光的强度受环境中氧浓度、毒物种类及其含量的影响，只要用灵缴的光电测定仪器就可方便地检测试样的污染程度或毒物的毒性强弱。"], [0, "（3）用发光⟦1|细菌⟧监测环境污染的优点由于发光细菌发光强度和环境的污染浓度能够呈现线性关系，因而能够快速、灵敏、稳定地表现出环境污染情况。同时，发光细菌易于⟦2|培养⟧，成本较低，且操作简便，检测结果的精确度较高，能够广泛应用于环境监测等领域。近年来，我国学者利用自已从淡水分离出的一株青海弧菌作试验菌，成功地制成了有特色的淡水型发光细菌冻干菌粉产品，经活化后，可随时测定水质的污染情况。"]], 0],
[1, 9, 0, 1, "病原体（pathogen）", [[0, "病原体又称⟦1|致病⟧菌或病原菌。能引起传染病的各种⟦2|微生物⟧或其他生物的统称。"]], 0],
[1, 9, 0, 2, "传染病（infectious disease）", [[0, "传染病是一类因宿主⟦1|感染⟧了活病原体并发生病原体大量⟦1|繁殖⟧所引起，可从某一宿主个体直接或间接传播到同种或异种宿主另一些个体的疾病。"]], 0],
[1, 9, 0, 3, "人畜共患病（zoonosis，复zoonoses）", [[0, "人畜共患病是一大类可在人类与其他脊椎动物间相互转移的传染病，如狂犬病、鹦鹉热、鼠疫、疯牛病、炭疽病、禽流感、SARS和口蹄疫等。"]], 0],
[1, 9, 0, 4, "毒力（virulence）", [[0, "毒力又称致病力，表示病原体致病能力的强弱。对⟦1|细菌⟧性病原体来说，其致病力主要是侵袭力和产毒素两方面，具体包括菌体对宿主体表的吸附，向体内侵人，在体内定居、⟦2|生长⟧和⟦2|繁殖⟧，向周围组织的扩散蔓延，对宿主防御功能的抵抗，以及产生损害宿主的毒素等一系列能力的总和。"]], 0],
[1, 9, 0, 5, "侵袭力（invasiveness）", [[0, "是病原体所具有的突破宿主防御功能，并在其中进行⟦1|生长⟧⟦2|繁殖⟧和实现蔓延扩散的能力，例如⟦1|菌毛⟧有助于吸附和定植，多种⟦2|酶⟧（透明质酸酶等）有利于蔓延扩散等。"]], 0],
[1, 9, 0, 6, "扩散因子（spreadingfactor）", [[0, "扩散因子即某些链球菌或葡萄球菌等病原菌产生的透明质酸⟦1|酶⟧。它可水解机体结缔组织中的透明质酸而引起组织松散、通透性增加，从而有利于病原体扩散，造成全身性⟦1|感染⟧的发生"]], 0],
[1, 9, 0, 7, "链激酶（streptokinase）", [[0, "链激⟦1|酶⟧又称血纤维蛋白溶酶。能激活血纤维蛋白溶酶原（胞浆素原），使之变成血纤维蛋白溶酶（胞浆素），再由后者把血浆中的纤维蛋白凝块水解，从而有利于病原体在宿主组织中的扩散。溶血链球菌可产生此酶。提纯的链激酶可用作急性血栓病的治疗药，"]], 0],
[1, 9, 0, 8, "带菌状态（carrier state）", [[0, "病原体侵染宿主后，因两者都有一定优势，使病原体仅限制在某一局部且不能大量⟦1|繁殖⟧，这种两者长期处于相持状态的⟦1|感染⟧，称带菌状态。"]], 0],
[1, 9, 0, 9, "显性传染（apparent infection）", [[0, "显性传染即患传染病。因入侵病原体的毒力较强、数量较多，而宿主的⟦1|免疫⟧力相对薄弱，从而使病原体大量⟦1|繁殖⟧并产生大量的酶和毒素，严重损害宿主的⟦2|细胞⟧组织，导致⟦2|生理⟧功能异常，最终出现一系列临床症状，直至死亡。"]], 0],
[1, 9, 0, 10, "血脑屏障（blood-brainbarrier）", [[0, "血脑屏障是人类等高等动物脑部的一种非专有解剖⟦1|结构⟧，可阻挡病原体及其有毒产物或某些药物从血流进入脑组织或脑脊液，具有保护中枢神经系统的功能。"]], 0],
[1, 9, 0, 11, "血胎屏障（blood-embryo barrier）", [[0, "血胎屏障是由母体子宫内膜的底蜕膜和胎儿的绒毛膜共同组成。具有保证母子间物质交换和防止母体内的病原体侵入胎儿的功能。"]], 0],
[1, 9, 0, 12, "多形核白细胞（polymorphonuclearleucocyte）", [[0, "多形核白⟦1|细胞⟧又称粒细胞。一类形状较小、有分节状细胞核、细胞质内含大量溶⟦2|酶⟧体颗粒的白细胞。在骨髓中形成，运动力强、寿命短，存在于血流和骨髓中，可穿过⟦1|细胞壁⟧，对异物吞噬力强。包括嗜中性粒细胞、嗜碱性粒细胞和嗜酸性粒细胞三类。"]], 0],
[1, 9, 0, 13, "炎症反应（inflammation）", [[0, "炎症反应是机体对病原体的侵人或其他损伤的一种保护性反应，在相应部位会出现五个特征性反应，即出现红、肿、热、痛和功能障碍。"]], 0],
[1, 9, 0, 14, "补体（complement）", [[0, "补体实为一补体系统，是指存在于人体或高等动物血清中的一组非特异性血清蛋白（主要成分是β-球蛋白）。补体是一类⟦2|酶⟧原，能被任何⟦1|抗原⟧-⟦1|抗体⟧的复合物激活而具有清除抗原的能力。因其在⟦1|免疫⟧反应中能扩大和增强抗体的补助功能，故称补体。"]], 0],
[1, 9, 0, 15, "干扰素诱生剂（interferon inducer）", [[0, "指能诱导高等动物⟦2|细胞⟧产生干扰素的物质，包括病毒、灭活病毒、病毒RNA、人工合成的聚合物（如聚肌苷：胞苷等）、一些原核生物（⟦1|立克次氏体⟧、⟦1|衣原体⟧、⟦1|支原体⟧、⟦2|细菌⟧等）、⟦2|微生物⟧产物（LPS、真菌多糖等）、多聚化合物、植物血凝素、伴刀豆球蛋白、葡萄球菌肠毒素 A和卡那霉素等。"]], 0],
[1, 9, 0, 16, "B细胞（Bcell）", [[0, "B⟦2|细胞⟧即B淋巴细胞（Blymphocyte），一种在⟦1|细胞膜⟧表面带有自已合成的免疫球蛋白（也称膜⟦1|抗体⟧）表面受体、产生免疫球蛋白和向T细胞递呈⟦1|抗原⟧的淋巴细胞。"]], 0],

  r.n++; r.t = Date.now(); r.g = g;
  if (g === 'g') {   // 只有“记得”才算背过一次
    r.r++;

    const m = S.slog[c.sub] || (S.slog[c.sub] = {});
    m[dk()] = (m[dk()] || 0) + 1;
  }
  if (g === 'f') r.l++;

  if (g === 'g') {

  } else if (g === 'm') {

/* ================= sound / speech ================= */
let AC = null, MASTER = null, NOISEBUF = null;
function ensureAC() {
  if (!S.set.sound) return null;
  try {
    if (!AC) AC = new (window.AudioContext || window.webkitAudioContext)();
    if (AC.state === 'suspended') AC.resume();
    if (!MASTER) {
      const c = AC.createDynamicsCompressor();
      c.threshold.value = -16; c.knee.value = 22; c.ratio.value = 7; c.attack.value = .003; c.release.value = .25;
      c.connect(AC.destination); MASTER = c;
    }
    return AC;
  } catch (e) { return null; }
}
window.addEventListener('pointerdown', () => { try { ensureAC(); } catch (e) {} }, {once:true});

/* 一个音：f 起始频率，to 结束频率（可省），o.type 波形，o.g 音量，o.at 延迟 */
function tone(f, dur, o) {
  o = o || {};
  const ac = ensureAC(); if (!ac) return;
  const t = ac.currentTime + (o.at || 0);
  const osc = ac.createOscillator(), g = ac.createGain();
  osc.type = o.type || 'sine';
  osc.frequency.setValueAtTime(f, t);
  if (o.to) osc.frequency.exponentialRampToValueAtTime(Math.max(24, o.to), t + dur);
  const peak = o.g == null ? .12 : o.g, atk = o.a == null ? .006 : o.a;
  g.gain.setValueAtTime(.0001, t);
  g.gain.exponentialRampToValueAtTime(peak, t + atk);
  g.gain.exponentialRampToValueAtTime(.0001, t + dur);
  let out = g;
  if (o.lp) { const bq = ac.createBiquadFilter(); bq.type = 'lowpass'; bq.frequency.value = o.lp; bq.Q.value = o.q || .7; g.connect(bq); out = bq; }
  osc.connect(g); out.connect(MASTER);
  osc.start(t); osc.stop(t + dur + .04);
}
/* 一段噪声：翻面的“唰”、忘记的“闷响” */
function hiss(dur, o) {
  o = o || {};
  const ac = ensureAC(); if (!ac) return;
  if (!NOISEBUF) {
    const len = Math.floor(ac.sampleRate * 1.2);
    NOISEBUF = ac.createBuffer(1, len, ac.sampleRate);
    const d = NOISEBUF.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
  }
  const t = ac.currentTime + (o.at || 0);
  const s = ac.createBufferSource(); s.buffer = NOISEBUF;
  const bq = ac.createBiquadFilter(); bq.type = o.type || 'highpass';
  bq.frequency.setValueAtTime(o.f || 600, t);
  if (o.to) bq.frequency.exponentialRampToValueAtTime(o.to, t + dur);
  bq.Q.value = o.q || .8;
  const g = ac.createGain();
  g.gain.setValueAtTime(.0001, t);
  g.gain.exponentialRampToValueAtTime(o.g == null ? .07 : o.g, t + .012);
  g.gain.exponentialRampToValueAtTime(.0001, t + dur);
  s.connect(bq); bq.connect(g); g.connect(MASTER);
  s.start(t); s.stop(t + dur + .03);
}

const sfx = {

  /* 翻面、显示答案：轻“唰” */

  /* 点开一个填空 / 遮罩：极短的“嗒” */

  /* 记得：四音上行，连击越高音越高 */
  good(n) {

  /* 结算开场：上行琶音 + 低频落地 */

  /* 满分 */
  perfect() {

function chime() { sfx.chime(); }

/* ================= 结算动画引擎（canvas 粒子，无外部依赖） ================= */
const FX = (() => {
  let cv = null, cx = null, W = 0, H = 0, dpr = 1, parts = [], raf = 0, last = 0, on = false, gen = 0;
  const MAX = 1600, TAU = Math.PI * 2;
  const rnd = (a, b) => a + Math.random() * (b - a);
  const quiet = () => { try { return !S.set.fx || matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { return !S.set.fx; } };

  function ensure() {
    if (cv) return;
    cv = document.createElement('canvas'); cv.id = 'fx'; cv.setAttribute('aria-hidden', 'true');
    document.body.appendChild(cv);
    cx = cv.getContext('2d');
    size(); window.addEventListener('resize', size);
  }
  function size() {
    if (!cv) return;
    dpr = Math.min(2, window.devicePixelRatio || 1);
    W = window.innerWidth; H = window.innerHeight;
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
    cv.style.width = W + 'px'; cv.style.height = H + 'px';
    cx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  function push(p) {
    if (quiet()) return;
    ensure();
    if (parts.length >= MAX) parts.shift();
    p.life = p.life || 0;
    parts.push(p);
    if (!on) { on = true; cv.classList.add('on'); last = performance.now(); raf = requestAnimationFrame(loop); }
  }
  function stop() {
    on = false; gen++; cancelAnimationFrame(raf); parts = [];
    if (cv) { cv.classList.remove('on'); if (cx) cx.clearRect(0, 0, W, H); }
  }

  function draw(p, a) {
    cx.save();
    if (p.blend) cx.globalCompositeOperation = 'lighter';
    if (p.t === 'flash') {   // 满屏金光
      const pr = p.life / p.max;
      cx.globalAlpha = Math.max(0, 1 - pr) * (p.a == null ? .6 : p.a);
      cx.fillStyle = 'rgba(255,228,150,1)';
      cx.fillRect(0, 0, W, H);
    } else if (p.t === 'coin') {
      const sx = Math.max(.26, Math.abs(Math.cos(p.rot)));
      if (!p.gd) {   // 渐变只建一次，且跟着金币自己的坐标走
        const gd = cx.createLinearGradient(0, -p.r, 0, p.r);
        gd.addColorStop(0, '#8A5A00'); gd.addColorStop(.34, '#FFD24A');
        gd.addColorStop(.56, '#FFEFB0'); gd.addColorStop(1, '#C98B00');
        p.gd = gd;
      }
      cx.globalAlpha = a;
      cx.translate(p.x, p.y);
      cx.beginPath(); cx.ellipse(0, 0, p.r * sx, p.r, 0, 0, TAU);
      cx.fillStyle = p.gd; cx.fill();
      cx.lineWidth = 1.2; cx.strokeStyle = 'rgba(255,247,206,.95)'; cx.stroke();
      cx.beginPath(); cx.ellipse(0, 0, p.r * sx * .58, p.r * .58, 0, 0, TAU);
      cx.strokeStyle = 'rgba(126,74,0,.42)'; cx.lineWidth = 1; cx.stroke();
    } else if (p.t === 'gem') {
      const r = p.r;
      cx.globalAlpha = a;
      cx.translate(p.x, p.y); cx.rotate(p.rot);
      cx.beginPath(); cx.moveTo(0, -r); cx.lineTo(r * .74, 0); cx.lineTo(0, r); cx.lineTo(-r * .74, 0); cx.closePath();
      const gd = cx.createLinearGradient(0, -r, 0, r);
      gd.addColorStop(0, '#EAFEFF'); gd.addColorStop(.45, '#57CCFF'); gd.addColorStop(1, '#1657D6');
      cx.shadowColor = 'rgba(90,200,255,.95)'; cx.shadowBlur = 16;
      cx.fillStyle = gd; cx.fill();
      cx.shadowBlur = 0; cx.strokeStyle = 'rgba(255,255,255,.85)'; cx.lineWidth = 1; cx.stroke();
    } else if (p.t === 'spark') {
      cx.globalAlpha = a;
      cx.strokeStyle = 'rgba(' + p.col + ',' + a + ')';
      cx.lineWidth = p.w; cx.lineCap = 'round';
      cx.beginPath(); cx.moveTo(p.x, p.y); cx.lineTo(p.x - p.vx * 2.4, p.y - p.vy * 2.4); cx.stroke();
    } else if (p.t === 'shard') {
      cx.globalAlpha = a; cx.translate(p.x, p.y); cx.rotate(p.rot);
      cx.fillStyle = p.col; cx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
    } else if (p.t === 'ring') {
      const pr = p.life / p.max;
      const r = Math.max(0, p.r0 + (p.r1 - p.r0) * (1 - Math.pow(1 - pr, 2.2)));
      cx.globalAlpha = (1 - pr) * .62;

    } else if (p.t === 'pop') {
      const pr = p.life / p.max;
      const sc = pr < .16 ? .55 + (pr / .16) * .62 : 1.17 - Math.min(.17, (pr - .16) * .42);
      cx.globalAlpha = pr > .72 ? Math.max(0, 1 - (pr - .72) / .28) : 1;
      cx.translate(p.x, p.y); cx.scale(sc, sc);
      cx.font = '900 ' + p.size + 'px "PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif';
      cx.textAlign = 'center'; cx.textBaseline = 'middle';
      cx.lineWidth = Math.max(3, p.size * .12); cx.strokeStyle = p.stroke || 'rgba(18,28,38,.55)';
      cx.strokeText(p.text, 0, 0);
      cx.fillStyle = p.col; cx.fillText(p.text, 0, 0);
    }
    cx.restore();
  }

  function loop(now) {
    const dt = Math.max(0, Math.min(48, now - last)) / 16.667; last = now;
    cx.clearRect(0, 0, W, H);
    const floorY = H - 26;
    for (let i = parts.length - 1; i >= 0; i--) {
      const p = parts[i];
      p.life += dt * 16.667;
      if (p.life >= p.max) { parts.splice(i, 1); continue; }

      if (p.t === 'gem') {
        if (p.life < 380) { p.vy += .24 * dt; }
        else {
          const dx = p.tgt.x - p.x, dy = p.tgt.y - p.y, d = Math.hypot(dx, dy) || 1;
          if (d < 24) { parts.splice(i, 1); sparkAt(p.x, p.y, 5, '150,225,255'); continue; }
          const pull = 1.9 * dt;
          p.vx = (p.vx + dx / d * pull) * .9;
          p.vy = (p.vy + dy / d * pull) * .9;
        }

        if (p.drag) { const dg = Math.pow(p.drag, dt); p.vx *= dg; p.vy *= dg; }
      }

      if (p.vr) p.rot = (p.rot || 0) + p.vr * dt;

      if (p.floor && p.y > floorY) {
        p.y = floorY;
        if (Math.abs(p.vy) > 1.7) { p.vy *= -.44; p.vx *= .87; }
        else { p.vy = 0; p.vx *= .9; p.floor = false; }
      }
      if (p.y > H + 90 || p.x < -140 || p.x > W + 140) { parts.splice(i, 1); continue; }
      const pr = p.life / p.max;
      // 金币和宝石活到最后 1/4 才开始淡出，前面一直是实心金色
      draw(p, (p.t === 'coin' || p.t === 'gem') ? Math.min(1, Math.max(0, (1 - pr) / .25)) : Math.max(0, 1 - pr));
    }
    if (parts.length) raf = requestAnimationFrame(loop);
    else { on = false; cv.classList.remove('on'); }
  }

  function sparkAt(x, y, n, col) {
    for (let i = 0; i < n; i++) {
      const ang = Math.random() * TAU, s = rnd(.6, 4.2);
      push({t:'spark', x, y, vx:Math.cos(ang) * s, vy:Math.sin(ang) * s, g:.05, drag:.94, max:rnd(320, 620), w:rnd(1, 2.2), col:col || '255,214,120', blend:true});
    }
  }

  return {
    stop, sparkAt,
    token() { return gen; },
    /* 冲击波 */
    shock(x, y, r1) {
      push({t:'ring', x, y, r0:6, r1:r1 || 250, w:11, max:660, col:'255,208,90', blend:true, vx:0, vy:0});
      push({t:'ring', x, y, r0:2, r1:(r1 || 250) * .6, w:4, max:470, col:'255,255,255', blend:true, vx:0, vy:0});
    },
    /* 放射火花 */
    burst(x, y, n, col, spd) {
      for (let i = 0; i < n; i++) {
        const ang = (i / n) * TAU + rnd(-.16, .16), s = rnd(.55, 1.1) * (spd || 10);
        push({t:'spark', x, y, vx:Math.cos(ang) * s, vy:Math.sin(ang) * s, g:.14, drag:.965, max:rnd(460, 900), w:rnd(1.2, 3), col:col || '255,206,96', blend:true});
      }
    },
    /* 金币喷泉，落地会弹 */
    coins(n, ox) {
      const cx0 = ox == null ? W / 2 : ox;
      for (let i = 0; i < n; i++) {
        push({t:'coin', x:cx0 + rnd(-120, 120), y:H - 34, vx:rnd(-4.2, 4.2), vy:rnd(-19, -10), g:.46, drag:.996, max:rnd(2200, 3200), r:rnd(7, 13), rot:rnd(0, TAU), vr:rnd(-.11, .11), floor:true});
      }
    },
    /* 金币炸开：从一点向四面八方喷 */
    coinBurst(x, y, n) {
      for (let i = 0; i < n; i++) {
        const ang = -Math.PI / 2 + rnd(-1.55, 1.55), sp = rnd(5, 16);
        push({t:'coin', x, y, vx:Math.cos(ang) * sp, vy:Math.sin(ang) * sp, g:.44, drag:.994, max:rnd(1700, 2600), r:rnd(6, 11), rot:rnd(0, TAU), vr:rnd(-.16, .16), floor:true});
      }
    },
    /* 金币雨：从上往下掉，落地继续弹 */
    coinRain(n) {
      for (let i = 0; i < n; i++) {
        push({t:'coin', x:rnd(-20, W + 20), y:rnd(-H * .6, -20), vx:rnd(-1.4, 1.4), vy:rnd(1.5, 5), g:.4, drag:.999, max:rnd(4200, 6000), r:rnd(6, 12), rot:rnd(0, TAU), vr:rnd(-.13, .13), floor:true});
      }
    },
    /* 满屏金光 */
    flash(a) { push({t:'flash', x:0, y:0, max:320, a:a, vx:0, vy:0}); },
    /* 宝石飞向“记得”那张卡 */
    gems(n, tx, ty) {
      const g0 = gen;
      for (let i = 0; i < n; i++) {
        setTimeout(() => {
          if (g0 !== gen) return;
          push({t:'gem', x:W / 2 + rnd(-160, 160), y:H - 70, vx:rnd(-3, 3), vy:rnd(-15.5, -9), max:rnd(1200, 1700), r:rnd(7, 14), rot:rnd(0, TAU), vr:rnd(-.13, .13), tgt:{x:tx + rnd(-16, 16), y:ty}});
        }, i * 42);
      }
    },
    /* 彩纸雨 */
    rain(n) {
      const cols = ['#FFC42E', '#FF7A59', '#57CCFF', '#7CE3A8', '#FF9BC4', '#FFF3C4'];
      for (let i = 0; i < n; i++) {
        push({t:'shard', x:rnd(-40, W + 40), y:rnd(-H * .55, -20), vx:rnd(-1.6, 1.6), vy:rnd(3, 7), g:.12, drag:.999, max:rnd(3400, 4600), w:rnd(4, 8), h:rnd(9, 16), rot:rnd(0, TAU), vr:rnd(-.18, .18), col:cols[(Math.random() * cols.length) | 0]});
      }
    },
    /* 大字弹出（伤害数字那种） */
    pop(text, x, y, o) {
      o = o || {};
      push({t:'pop', x, y, text, size:o.size || 56, col:o.col || '#FFF3C4', stroke:o.stroke, max:o.max || 1150, vx:0, vy:-(o.rise || .55), g:-.004});
    }
  };
})();

function shakeScreen(hard) {
  const el = $('#done .wrap'); if (!el) return;
  try { if (matchMedia('(prefers-reduced-motion: reduce)').matches) return; } catch (e) {}
  el.style.animation = 'none'; void el.offsetWidth;
  el.style.animation = (hard ? 'shakeHard .62s' : 'shakeIt .5s') + ' cubic-bezier(.36,.07,.19,.97)';
  setTimeout(() => { el.style.animation = ''; }, 660);
}
function countUp(el, to, fmt, dur) {
  const t0 = performance.now();
  const step = now => {
    const p = Math.min(1, (now - t0) / dur), e = 1 - Math.pow(1 - p, 3);
    el.textContent = fmt(to * e);
    if (p < 1) requestAnimationFrame(step); else el.textContent = fmt(to);
  };
  requestAnimationFrame(step);
}
/* 背诵中的飘字 */
function popAt(sel, text, col) {
  const el = document.querySelector(sel); if (!el) return;
  const r = el.getBoundingClientRect();
  const d = document.createElement('div');
  d.className = 'float'; d.textContent = text; d.style.color = col;
  d.style.left = (r.left + r.width / 2) + 'px'; d.style.top = (r.top + 14) + 'px';
  document.body.appendChild(d);
  setTimeout(() => d.remove(), 950);
}

/* 一轮结束的华丽结算 */
function celebrate(o) {
  const done = $('#done');
  const lv = !o.res ? 0 : o.rate >= 80 ? 2 : o.rate >= 40 ? 1 : 0;   // 记得越多，场面越大
  done.classList.remove('go', 'perfect', 'low');
  void done.offsetWidth;

  const tEl = $('#done-title'), txt = tEl.textContent || '';
  tEl.innerHTML = Array.from(txt).map((ch, i) => '<span style="--i:' + i + '">' + esc(ch) + '</span>').join('');

  const st = $('#done-stamp');
  const perfect = !!o.res && o.rate >= 100;
  if (o.res) { st.hidden = false; st.textContent = (perfect ? 'PERFECT · ' : '') + o.rate + '% 记得'; }
  else { st.hidden = true; st.textContent = ''; }

  if (perfect) done.classList.add('perfect');

  if (!S.set.fx) { if (!o.res) sfx.skip(); return; }   // 关掉动画：直接看静态结算

  done.classList.add('go');
  if (!o.res || lv === 0) done.classList.add('low');

  /* 数字滚动 */
  $$('#done-stats .stat b').forEach((el, i) => {
    const v = +el.dataset.v || 0, f = el.dataset.f;
    setTimeout(() => {
      countUp(el, v, f === 'time' ? mmss : x => String(Math.round(x)), 640);
      if (f !== 'time' && v > 0) sfx.pick();
    }, 600 + i * 120);
  });

  /* 三色进度条从左长出来 */
  const bars = $$('#done-stack i'), widths = bars.map(b => b.style.width);
  bars.forEach(b => { b.style.transition = 'none'; b.style.width = '0%'; });
  setTimeout(() => { bars.forEach((b, i) => { b.style.transition = ''; b.style.width = widths[i]; }); }, 960);

  if (!o.res) { sfx.skip(); return; }

  /* 粒子 + 音效编排：lv2 是狂欢，lv1 是撒花，lv0 只是亮一下 */
  FX.stop();
  const tk = FX.token();
  const alive = () => FX.token() === tk;
  const rc = $('#done-title').getBoundingClientRect();
  const cx0 = rc.left + rc.width / 2, cy0 = rc.top + rc.height / 2;
  const sr0 = st.getBoundingClientRect();
  const sx0 = sr0.left + sr0.width / 2, sy0 = sr0.top + sr0.height / 2;

  if (lv === 2) FX.flash(.55);
  FX.shock(cx0, cy0, Math.max(200, rc.width * .9));
  FX.burst(cx0, cy0, lv === 2 ? 46 : lv === 1 ? 22 : 9, lv === 0 ? '150,170,185' : '255,206,96');
  if (lv === 2) { sfx.level(); shakeScreen(true); }
  else if (lv === 1) sfx.stamp();
  else sfx.mid();

  /* 印章砸下 */
  setTimeout(() => {
    if (!alive()) return;
    FX.shock(sx0, sy0, lv ? 170 : 90);
    if (lv === 2) { FX.shock(sx0, sy0, 110); FX.coinBurst(sx0, sy0, 26); FX.burst(sx0, sy0, 22, '255,240,190', 8); shakeScreen(true); }
    else if (lv === 1) FX.burst(sx0, sy0, 14, '255,236,180', 7);
    sfx.stamp();
  }, 860);

  /* 金币：一波接一波，左右两侧再加两门炮 */
  if (lv === 2) {
    const VW = window.innerWidth;
    setTimeout(() => { if (alive()) FX.coins(46); }, 120);
    setTimeout(() => { if (alive()) { FX.coins(26, VW * .1); FX.coins(26, VW * .9); } }, 420);
    setTimeout(() => { if (alive()) FX.coins(38); }, 780);
    setTimeout(() => { if (alive()) FX.coins(30); }, 1180);
    setTimeout(() => { if (alive()) { FX.coins(22, VW * .2); FX.coins(22, VW * .8); } }, 1560);
    setTimeout(() => { if (alive()) FX.coinRain(26); }, 1900);
    for (let i = 0; i < 12; i++) setTimeout(() => { if (alive()) sfx.coin(); }, 180 + i * 160);
  } else if (lv === 1) {
    setTimeout(() => { if (alive()) FX.coins(26); }, 180);
    setTimeout(() => { if (alive()) FX.coins(18); }, 760);
    for (let i = 0; i < 5; i++) setTimeout(() => { if (alive()) sfx.coin(); }, 240 + i * 170);
  }

  const gEl = $$('#done-stats .stat')[0];
  if (gEl && o.g > 0) {
    const gr = gEl.getBoundingClientRect();
    setTimeout(() => { if (alive()) FX.gems(Math.min(lv === 2 ? 34 : 20, o.g * 2 + 4), gr.left + gr.width / 2, gr.top + 24); }, 460);
  }

  if (perfect) {
    setTimeout(() => {
      if (!alive()) return;
      FX.rain(180);
      FX.coinRain(40);
      FX.flash(.35);
      FX.shock(window.innerWidth / 2, window.innerHeight * .55, 320);
      shakeScreen(true);
      sfx.perfect();
      const ar = $('#done-actions').getBoundingClientRect();
      const room = window.innerHeight - ar.bottom;          // 按钮下面还有空就再砸一个大字
      if (room > 120) FX.pop('PERFECT', window.innerWidth / 2, ar.bottom + room / 2, {size: Math.min(64, window.innerWidth / 6.6), col:'#FFD84D', max:2600, rise:.22});
    }, 1500);
  } else if (o.rate >= 80) {
    setTimeout(() => {
      if (!alive()) return;
      const ar = $('#done-actions').getBoundingClientRect();
      const room = window.innerHeight - ar.bottom;
      if (room > 100) FX.pop('很棒', window.innerWidth / 2, ar.bottom + room / 2, {size:46, col:'#FFC42E', max:1900, rise:.25});
    }, 1500);
  }
}

const mmss = ms => { const s = Math.round(ms / 1000); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };
function finish() {
  ses.done = true; stopSpeak(); closeNudge(); wake(false); save();
  const all = Object.values(ses.res), res = all.filter(x => x !== 's'), skipped = all.filter(x => x === 's').length;
  const g = res.filter(x => x === 'g').length, m = res.filter(x => x === 'm').length, f = res.filter(x => x === 'f').length;
  const drift = ses.idleN + ses.awayN, tot = Math.max(1, res.length);

  $('#done-sub').textContent = !res.length ? '没有打分的题不会计入进度。'

  $('#done-stats').innerHTML =

  $('#done-stack').innerHTML = res.length ?
    '<i style="width:' + g / tot * 100 + '%;background:var(--good)"></i><i style="width:' + m / tot * 100 + '%;background:var(--warn)"></i><i style="width:' + f / tot * 100 + '%;background:var(--bad)"></i>' : '';
  $('#done-legend').innerHTML = (res.length ? '<span>记得 <b>' + g + '</b></span><span>模糊 <b>' + m + '</b></span><span>忘记 <b>' + f + '</b></span>' : '') + (skipped ? '<span>跳过 <b>' + skipped + '</b>（不计入进度）</span>' : '');
  const smaller = drift >= 3 && (ses.n === 0 || ses.n > 5);
  $('#done-actions').innerHTML =
    '<button class="primary" id="a-rest">休息 2 分钟</button>' +

    '<button class="ghost" id="a-home">回首页</button>';
  show('done');
  celebrate({g:g, m:m, f:f, res:res.length, skipped:skipped, drift:drift, ms:ses.totalMs, rate:rate});
}

    return;
  }
  if (e.target.id === 'btn-imp') { importBackup($('#bk').value); return; }
  if (e.target.id === 'btn-wipe') {
    if (!wipeArmed) { wipeArmed = true; renderSheet(); setTimeout(() => { wipeArmed = false; if (!$('#sheet').hidden) renderSheet(); }, 4000); }
    else { wipeArmed = false; S.cards = {}; S.log = {}; S.stars = {}; S.ms = {}; S.slog = {bio:{}, mic:{}}; S.msS = {bio:{}, mic:{}}; S.water = {cups:{}}; save(); renderSheet(); renderHome(); }
  }
});
const closeSheet = () => { $('#sheet').hidden = true; wipeArmed = false; };
$('#sheet-x').addEventListener('click', closeSheet);
$('#sheet').addEventListener('click', e => { if (e.target.id === 'sheet') closeSheet(); });


/* ---------- toast ---------- */
let toastT = null;
function toast(msg) {
  const el = $('#toast'); el.textContent = msg; el.hidden = false;
  clearTimeout(toastT); toastT = setTimeout(() => { el.hidden = true; }, 3800);
}

/* ---------- fullscreen ---------- */
const isFs = () => !!(document.fullscreenElement || document.webkitFullscreenElement);
function toggleFs() {
  const d = document, el = d.documentElement;
  try {
    if (isFs()) { (d.exitFullscreen || d.webkitExitFullscreen).call(d); return; }
    const f = el.requestFullscreen || el.webkitRequestFullscreen;
    if (!f) { toast('这个浏览器不支持网页全屏。iPhone 可以在 Safari 里点“分享”，再选“添加到主屏幕”。'); return; }
    const p = f.call(el);
    if (p && p.catch) p.catch(() => toast('全屏被浏览器拦住了。试试在单独的标签页里打开这个页面。'));
  } catch (e) { toast('全屏没能打开。试试在单独的标签页里打开这个页面。'); }
}
['fullscreenchange', 'webkitfullscreenchange'].forEach(ev => document.addEventListener(ev, () => { const b = $('#btn-fs3'); if (b) b.textContent = isFs() ? '退出全屏' : '进入全屏'; }));
['#btn-fs', '#btn-fs2', '#btn-fs3'].forEach(s => $(s).addEventListener('click', toggleFs));

/* ---------- keep screen awake ---------- */
let wl = null;
async function wake(on) {
  try {
    if (on && navigator.wakeLock && !wl) { wl = await navigator.wakeLock.request('screen'); wl.addEventListener('release', () => { wl = null; }); }
    else if (!on && wl) { await wl.release(); wl = null; }
  } catch (e) { wl = null; }
}

/* ---------- water ---------- */
function renderWater() {
  const n = S.water.cups[dk()] || 0, g = S.set.cups;
  $('#drops').innerHTML = Array.from({length: Math.max(g, n)}, (_, i) =>
    '<svg class="drop' + (i < n ? ' on' : '') + '" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3C9 8 6 11 6 15a6 6 0 0 0 12 0c0-4-3-7-6-12z"/></svg>').join('') +
    '<span class="wn">' + n + ' / ' + g + ' 杯</span>';
  updateWaterNext();
}
function updateWaterNext() {
  const el = $('#water-next'); if (!el) return;
  if (!S.set.water) { el.textContent = '提醒已关闭，只记杯数。'; return; }
  const left = Math.max(0, S.set.water * 60000 - (Date.now() - waterLast));
  el.textContent = '下次提醒：约 ' + Math.ceil(left / 60000) + ' 分钟后。背题时不会打断你，会等这一题打完分再提醒。';
}
function addCup(d) {
  const k = dk(); S.water.cups[k] = Math.max(0, (S.water.cups[k] || 0) + d);
  if (d > 0) waterLast = Date.now();
  save(); renderWater();
}
$('#w-plus').addEventListener('click', () => addCup(1));
$('#w-minus').addEventListener('click', () => addCup(-1));
function openWater() {
  if (waterOpen || !S.set.water) return;
  waterOpen = true;
  if (ses && !ses.done) ses.paused = true;
  const n = S.water.cups[dk()] || 0, mins = Math.round((S.ms[dk()] || 0) / 60000);
  $('#water-sub').textContent = '今天已经喝了 ' + n + ' / ' + S.set.cups + ' 杯' + (mins ? '，学了 ' + mins + ' 分钟' : '') + '。起来喝口水，活动一下肩颈。';
  $('#water').hidden = false; chime();
  setTimeout(() => $('#w-drink').focus(), 50);
}
function closeWater() {
  waterOpen = false; $('#water').hidden = true;
  if (ses && !ses.done) { ses.paused = false; ses.lastTick = Date.now(); }
  lastActive = Date.now();
}
$('#w-drink').addEventListener('click', () => { addCup(1); closeWater(); });
$('#w-snooze').addEventListener('click', () => { waterLast = Date.now() - Math.max(0, S.set.water - 10) * 60000; closeWater(); renderWater(); });
setInterval(() => {
  if (!S.set.water || waterOpen) return;
  if (Date.now() - waterLast < S.set.water * 60000) { if (screen === 'home') updateWaterNext(); return; }
  if (screen === 'study' && ses && !ses.done) waterPending = true; else openWater();
}, 1000);

/* ---------- white noise ---------- */
let noiseSrc = null, noiseGain = null;
function applyNoise() {
  try { if (noiseSrc) { noiseSrc.stop(); noiseSrc.disconnect(); noiseSrc = null; } } catch (e) {}
  const type = S.set.noise;
  if (type === 'off') return;
  try {
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    if (AC.state === 'suspended') AC.resume();
    const len = AC.sampleRate * 3, buf = AC.createBuffer(1, len, AC.sampleRate), data = buf.getChannelData(0);
    let last = 0;
    for (let i = 0; i < len; i++) {
      const w = Math.random() * 2 - 1;
      if (type === 'brown') { last = (last + 0.02 * w) / 1.02; data[i] = last * 3.5; } else data[i] = w * 0.5;
    }
    noiseSrc = AC.createBufferSource(); noiseSrc.buffer = buf; noiseSrc.loop = true;
    noiseGain = noiseGain || AC.createGain(); noiseGain.gain.value = type === 'brown' ? 0.35 : 0.12;
    noiseSrc.connect(noiseGain); noiseGain.connect(AC.destination); noiseSrc.start();
  } catch (e) { toast('这个浏览器放不了白噪音。'); }
}

/* ---------- star ---------- */
const starLabel = c => S.stars[c.id] ? '★ 已收藏' : '☆ 收藏';
function toggleStar(id) { if (S.stars[id]) delete S.stars[id]; else S.stars[id] = 1; save(); }

/* ---------- search ---------- */
function resultHtml(c) {
  return '<details class="res"><summary>' + esc(c.q) + '<span class="rm">' + esc(where(c)) + '，' + SECT[c.s] + '，' + PART[c.p] + '</span></summary>' +
    '<div class="rbody"><button class="link" type="button" data-star="' + c.id + '">' + (S.stars[c.id] ? '★ 已收藏' : '☆ 收藏') + '</button><ol>' +
    c.a.map((_, i) => itemHtml(c, i, false)).join('') + '</ol></div></details>';
}
function doSearch() {
  const k = $('#q-in').value.trim().toLowerCase(), box = $('#q-res');
  if (!k) { box.innerHTML = '<p class="src">输入关键词，会在题目和答案里一起找。</p>'; return; }
  const hits = C.filter(c => (c.q + ' ' + answerText(c)).toLowerCase().includes(k));
  box.innerHTML = '<p class="src">找到 ' + hits.length + ' 题' + (hits.length > 30 ? '，只显示前 30 题，换个更具体的词试试' : '') + '</p>' + hits.slice(0, 30).map(resultHtml).join('');
}
$('#btn-search').addEventListener('click', () => { $('#search').hidden = false; doSearch(); setTimeout(() => $('#q-in').focus(), 50); });
$('#q-in').addEventListener('input', doSearch);
$('#search-x').addEventListener('click', () => { $('#search').hidden = true; renderHome(); });
$('#search').addEventListener('click', e => {
  if (e.target.id === 'search') { $('#search').hidden = true; renderHome(); return; }
  const b = e.target.closest('[data-star]');
  if (b) { toggleStar(b.dataset.star); b.textContent = S.stars[b.dataset.star] ? '★ 已收藏' : '☆ 收藏'; }
});

/* ---------- backup ---------- */
function importBackup(txt) {
  let d;
  try { d = JSON.parse(txt); if (!d || typeof d !== 'object' || !d.cards) throw 0; } catch (e) { toast('这段文字不是导出的进度，没有导入。'); return; }
  for (const id in d.cards) { const a = migrate(d.cards[id]), b = S.cards[id]; if (!b || (a.r || 0) > (b.r || 0) || ((a.r || 0) === (b.r || 0) && (a.n || 0) > (b.n || 0))) S.cards[id] = a; }
  for (const k in (d.log || {})) S.log[k] = Math.max(S.log[k] || 0, d.log[k]);
  for (const k in (d.ms || {})) S.ms[k] = Math.max(S.ms[k] || 0, d.ms[k]);
  for (const sb in (d.slog || {})) { const t = S.slog[sb] || (S.slog[sb] = {}); for (const k in d.slog[sb]) t[k] = Math.max(t[k] || 0, d.slog[sb][k]); }
  for (const sb in (d.msS || {})) { const t = S.msS[sb] || (S.msS[sb] = {}); for (const k in d.msS[sb]) t[k] = Math.max(t[k] || 0, d.msS[sb][k]); }
  for (const k in (d.stars || {})) S.stars[k] = 1;
  for (const k in ((d.water && d.water.cups) || {})) S.water.cups[k] = Math.max(S.water.cups[k] || 0, d.water.cups[k]);
  save(); renderHome(); toast('已导入，和这里原有的进度合并了。');
}

// 第一次点屏幕后，再恢复上次选的白噪音
window.addEventListener('pointerdown', () => { if (S.set.noise !== 'off' && !noiseSrc) applyNoise(); }, {once:true});

/* ---------- init ---------- */
applyLook();
renderHome();
})();
</script>
</body>
