⟧稳定；当发生突变、缺失或⟦2|失活⟧后，细胞⟦1|失控⟧增殖，进而引发⟦1|肿瘤⟧。"]]],[1,14,0,11,"原癌基因（Proto oncogene）",[[0,"是正常细胞内⟦2|调控⟧细胞⟦1|生长⟧、增殖与⟦1|分化⟧的关键基因，⟦2|编码⟧⟦1|生长因子⟧、⟦1|受体⟧、转录因子等产物；在受到诱变因素作用发生突变、⟦1|过度⟧表达等情况后，可被激活为⟦1|癌基因⟧，持续异常表达，导致细胞增殖⟦1|失控⟧、⟦1|恶性⟧转化。"]]],[1,14,0,12,"光复活（photoreactivation repair）",[[0,"是一种依赖光的 ⟦1|DNA⟧ 损伤修复方式，主要修复⟦1|紫外线⟧造成的⟦2|嘧啶⟧⟦1|二聚体⟧；在可见光激活下，⟦1|光复活酶⟧识别并结合⟦1|二聚体⟧，直接裂解环⟦1|丁烷⟧结构，使⟦1|碱基⟧恢复正常配对，无需切除⟦1|碱基⟧。"]]],[1,14,0,13,"碱基类似物（base analog）",[[0,"与 ⟦1|DNA⟧ 正常⟦1|碱基⟧结构类似的⟦2|化合物⟧，能在 ⟦1|DNA⟧ 复制时取代正常⟦1|碱基⟧掺入并与⟦1|互补链⟧上的⟦1|碱基配对⟧；常作为⟦1|诱变剂⟧用于⟦1|实验⟧诱变，部分也可作为抗肿瘤、⟦1|抗病毒⟧⟦2|药物⟧，通过干扰⟦1|核酸⟧合成⟦1|发挥作用⟧。"]]],[1,14,0,14,"DNA 突变",[[0,"指 DNA 分子中⟦1|核苷酸⟧序列发生的可⟦2|遗传⟧改变，包括⟦1|碱基⟧替换、插入、缺失及⟦1|重排⟧等类型；这种改变可是由⟦1|物理⟧因素（如⟦1|紫外线⟧、⟦1|电离辐射⟧等）、⟦2|化学⟧因素（如⟦2|化学⟧⟦1|诱变剂⟧）或生物因素（如⟦2|病毒⟧、⟦1|细菌⟧等）引起的。"]]],[1,14,0,15,"解旋酶",[[0,"是一类依赖 ⟦1|ATP⟧ ⟦2|水解⟧供能，能解开 ⟦1|DNA⟧ ⟦1|双链氢键⟧的酶；在 ⟦1|DNA⟧ 复制、修复、⟦2|重组⟧及转录过程中，它沿 ⟦1|DNA⟧ 链⟦2|移动⟧，将⟦1|双链⟧解开为⟦1|单链⟧，为后续聚合酶等⟦1|发挥作用创造条件⟧。"]]],[1,14,0,16,"复合转座子（composite transposon）",[[0,"⟦1|两翼⟧由相同或⟦1|高度同源⟧的 IS ⟦2|元件⟧夹住中间基因所形成的⟦1|转座子⟧，常携带⟦1|耐药⟧基因。整体可转移，并促进⟦1|耐药⟧或代谢⟦1|性状⟧在⟦2|基因组⟧间⟦1|传播⟧，是⟦1|细菌⟧水平基因转移的重要⟦2|元件⟧。"]]],[1,14,0,17,"溶原途径",[[0,"温和⟦1|噬菌体⟧感染后与⟦2|宿主⟧共存的潜伏⟦2|途径⟧。⟦1|噬菌体⟧ ⟦1|DNA⟧ 常整合为原⟦1|噬菌体⟧，随⟦2|宿主⟧复制而不裂解细胞；裂解相关基因受阻遏，少数维持溶⟦1|原性⟧的⟦2|调控⟧基因表达，⟦2|诱导⟧后可转入裂解周期。"]]],[1,14,0,18,"重组 DNA 技术",[[0,"是将不同来源的 DNA 分子在体外进行切割、拼接，重新组合成新的 DNA 分子，再⟦1|导入受体⟧细胞并使其复制表达的技术；它是⟦1|基因工程⟧的⟦1|核心技术⟧，广泛用于基因⟦2|克隆⟧、⟦1|基因治疗⟧和⟦1|动植物⟧育种。"]]],[1,14,1,1,"什么是同源重组，简述 Holliday 模型的关键步骤，举例大肠杆菌中与重组有关的酶以及它们的功能。",[[0,"（1）同源重组是⟦1|同源⟧ ⟦1|DNA⟧ 经配对、断裂和重连交换片段。"],[0,"（2）Holliday 模型分 ⟦1|4⟧ 步。"],[1,"①两条⟦1|同源双链⟧ ⟦1|DNA⟧ 对齐。"],[1,"②⟦1|对应单链⟧断裂并⟦1|交叉⟧连接，形成 Holliday ⟦1|连接体⟧。"],[1,"③⟦1|分支⟧迁移，扩大⟦1|异源双链⟧区。"],[1,"④切开⟦1|连接体⟧并修复，形成重组 ⟦1|DNA⟧。"],[0,"（3）大肠杆菌相关⟦1|蛋白⟧。"],[1,"①⟦1|RecA⟧ 结合⟦1|单链⟧，形成核蛋白丝，搜索⟦1|同源⟧序列并促进链侵入、交换，也参与 ⟦1|SOS⟧ 反应。"],[1,"②⟦1|RecBCD⟧ 有三种⟦2|活性⟧。"],[2,"a.⟦1|ATP⟧ 依赖的⟦1|外切核酸酶⟧⟦2|活性⟧。"],[2,"b.⟦1|ATP⟧ 增强的内切⟦1|核酸酶⟧⟦2|活性⟧。"],[2,"c.⟦1|ATP⟧ 依赖⟦1|解旋酶⟧⟦2|活性⟧；从 ⟦1|DNA⟧ ⟦1|断端⟧解旋、⟦2|加工⟧⟦1|双链⟧，产生重组所需⟦1|单链⟧。"],[1,"③⟦1|RuvA⟧ 识别 Holliday ⟦1|交叉点⟧并招募 ⟦1|RuvB⟧。"],[1,"④⟦1|RuvB⟧ |单元⟧。"]]],[1,15,0,7,"逆转录酶（reverse transcriptase）",[[0,"指以 ⟦1|RNA⟧ 为⟦2|模板⟧，⟦1|4⟧ 种⟦1|脱氧核苷⟧三⟦1|磷酸⟧为底物，沿 ⟦1|5⟧’→⟦1|3⟧’方向催化合成 ⟦1|DNA⟧ 的酶；它往往兼有 ⟦1|3⟧ 种酶活力：⟦1|RNA⟧ ⟦1|指导⟧的 ⟦1|DNA⟧ 聚合酶活力、⟦1|DNA⟧ ⟦1|指导⟧的 ⟦1|DNA⟧ 聚合酶活力和⟦1|核糖核酸⟧酶 H ⟦1|活力⟧。"]]],[1,15,0,8,"逆转录病毒（Retrovirus）",[[0,"是一类以 ⟦1|RNA⟧ 为⟦1|遗传物质⟧，需通过⟦1|逆转录酶⟧将 ⟦1|RNA⟧ ⟦1|逆转录⟧为 ⟦1|cDNA⟧，再整合到⟦2|宿主⟧⟦1|染色体⟧ ⟦1|DNA⟧ 中的⟦2|病毒⟧；整合后的原⟦2|病毒⟧可随⟦1|细胞分裂⟧稳定传递，在一定条件下表达组装⟦1|新病毒⟧，易引发⟦1|肿瘤⟧或⟦1|持续性⟧感染。"]]],[1,15,1,9,"简要介绍逆转录病毒 RNA 合成过程（逆转录过程）。",[[0,"①逆转录：⟦2|病毒⟧ RNA 入⟦2|宿主⟧后以 ⟦1|tRNA⟧ 为⟦2|引物⟧，⟦1|逆转录酶⟧合成 ⟦1|cDNA⟧；其 ⟦1|RNase H⟧ ⟦2|活性⟧降解 RNA ⟦2|模板⟧。"],[0,"②⟦1|第二链⟧合成：⟦1|逆转录酶⟧以 ⟦1|cDNA⟧ 为⟦1|模板合成互补链⟧，形成⟦1|双链⟧ ⟦1|DNA⟧。"],[0,"③整合：⟦1|整合酶⟧把⟦1|双链⟧⟦2|病毒⟧ ⟦1|DNA⟧ 插入⟦2|宿主⟧⟦1|染色体⟧，形成前⟦2|病毒⟧。"],[0,"④表达：前⟦2|病毒⟧随⟦2|宿主⟧复制，并转录出⟦2|基因组⟧ RNA 和 ⟦1|mRNA⟧，翻译⟦2|病毒⟧⟦1|蛋白⟧。"],[0,"⑤装配释放：⟦2|病毒⟧⟦1|蛋白⟧与⟦2|基因组⟧ RNA 装配，并以出芽等方式离开细胞。"]]],[1,15,1,10,"RNA 编辑及其生物学意义？",[[0,"（1）RNA 编辑通过插入、删除或改变⟦1|核苷酸⟧，使 RNA 序列⟦1|信息⟧不同于 ⟦1|DNA⟧ ⟦2|模板⟧，常由⟦1|位点⟧特异⟦2|脱氨⟧或⟦1|指导⟧ RNA介导。"],[0,"（2）意义。"],[1,"①可⟦1|校正⟧某些基因缺失或错误信息。"],[1,"②可产生或去除起始、终止⟦1|密码⟧，调节翻译。"],[1,"③可由一个基因产生不同结构、功能的产物，增加⟦1|信息容量⟧并利于进化。"]]],[1,15,1,11,"解释为什么 DNA 聚合酶需要引物，而 RNA 聚合酶不需要？",[[0,"①DNA 聚合酶只能将 ⟦1|dNTP⟧ 加到已有 ⟦1|3⟧′-OH 上，需引物；RNA 聚合酶可⟦2|定位⟧并连接最初两个 ⟦1|NTP⟧，从头起始。"],[0,"②DNA 长期保存⟦2|遗传信息⟧，复制需更⟦1|高保真⟧；RNA ⟦1|寿命⟧较短，转录允许相对较高⟦1|错误率⟧。"]]],[1,15,1,12,"原、真核生物 RNA、rRNA、tRNA 转录后加工修饰异同点。",[[0,"（1）⟦2|相同点⟧。"],[1,"①⟦2|原核⟧、真核 rRNA 和 tRNA ⟦2|前体⟧均需加工才能成熟。"],[1,"②⟦1|两者⟧ tRNA 均有⟦1|剪切⟧及多种⟦1|碱基⟧修饰，以提高⟦2|稳定性⟧和功能。"],[0,"（2）⟦2|不同点⟧。"],[1,"①⟦1|细菌⟧ ⟦1|mRNA⟧ 多无须复杂加工且可边转录边翻译；真核 ⟦1|mRNA⟧ ⟦2|前体⟧通常需加帽、⟦1|加尾⟧及剪接。"],[1,"②两类 rRNA 均需切割和修饰；真核许多⟦2|甲基化⟧、⟦1|假尿苷化由⟧ ⟦1|snoRNA⟧ ⟦1|指导⟧。"],[1,"③⟦2|原核⟧ ⟦1|RNase P⟧ 的 RNA 本身可催化切除 ⟦1|tRNA 5⟧′⟦1|前导⟧序列；真核 ⟦1|RNase P⟧ 更依赖⟦1|蛋白⟧，⟦1|内含子⟧剪接需⟦1|专门酶⟧。"],[1,"④⟦2|原核⟧加工调节较简单；真核需多种小 RNA 和⟦1|蛋白⟧⟦2|复合体⟧，层次更多。"]]],[1,16,0,1,"同工 tRNA（isoacceptor tRNA）",[[0,"同工 tRNA 是携带同一种⟦1|氨基酸⟧而反密码子不同的一组 tRNA，可识别该⟦1|氨基酸⟧的不同同义密码子；其存在与遗传密码的简并性和摆动配对⟦1|相适应⟧。"]]],[1,16,0,2,"起始-tRNA（initiator-tRNA）",[[0,"是⟦1|专门⟧负责翻译起始⟦1|阶段⟧、识别起始⟦1|密码子⟧的特殊 tRNA；它不能进入⟦1|核糖体⟧ A 位，只能结合 P 位，是⟦1|启动⟧ [0, 0, 0, 1, "微生物（microorganism，microbe）", [[0, "是指一切肉眼看不见或看不清的微小生物的总称。它们都是一些个体微小（一般<⟦1|0.1mm⟧）、构造简单的低等生物。大多为单⟦1|细胞⟧，少数为多细胞，还包括一些没有细胞⟦2|结构⟧的生物。"]], 0],
[0, 0, 0, 2, "科赫原则（Kochprinciple）", [[0, "用于证明某种动物疾病确实由某种⟦2|微生物⟧引起的方法。首先在每一病例中都出现这种微生物；再要从寄主⟦2|分离⟧出这样的微生物并在⟦1|培养基⟧中⟦2|培养⟧出来；用这种微生物的⟦1|纯培养⟧接种健康而敏感的寄主，同样的疾病会重复发生；从试验发病的寄主中能再度分离培养出这种微生物来，由此说明该种微生物是该种疾病的致病菌。"]], 0],
[0, 0, 1, 1, "简述列文虎克、巴斯德和科赫对微生物学发展的贡献", [[0, "（1）列文虎克的主要贡献利用自制放大倍数约为⟦1|200倍⟧的单式显微镜，观察到⟦1|细菌⟧等⟦2|微生物⟧的个体，并且对一些微生物进行形态描述，首次克服了人类认识微生物世界的第一个难关——“个体微小”，使人类初步踏进了微生物世界的大门，因此称为\"微生物学先驱者”。"], [0, "（2）巴斯德的主要贡献"], [1, "①彻底否定了“自生说”。曲颈瓶实验彻底否定了“自生说”，并从此建立了病原学说，推动了⟦1|微生物⟧学的发展。"], [1, "②⟦1|免疫⟧学一预防接种。巴斯德发现将病原菌减毒可诱发免疫性，以预防霍乱病，并首次制成狂犬疫苗，证实其免疫学说，为人类防病和治病做出了重大贡献。"], [1, "③证实⟦1|发酵⟧是由⟦1|微生物⟧引起的。巴斯德发现乳酸发酵、醋酸发酵和丁酸发酵都是由不同⟦2|细菌⟧所引起的。为进一步研究微生物的生理生化奠定了基础。"], [1, "④巴斯德⟦1|消毒⟧法（60～⟦1|65°C⟧作短时间加热处理，杀死有害⟦2|微生物⟧的一种消毒法）和家蚕软化病问题的解决，推动了微生物病原学说的发展，并深刻影响医学的发展。"], [0, "（3）科赫的主要贡献"], [1, "①对病原⟦1|细菌⟧的研究方面做出的贡献：a.证实了炭疽病菌是炭疽病的病原菌；b．发现了肺结核病的病原菌；c。提出了证明某种⟦2|微生物⟧是否为某种疾病病原体的基本原则—一科赫原则。"], [1, "②对⟦1|微生物⟧基本操作技术方面做出的贡献：a用固体⟦1|培养基⟧分离纯化微生物的技术；b.配制⟦2|培养⟧基。"]], 0],
[0, 0, 1, 2, "微生物与人类的关系", [[0, "⟦1|微生物⟧与人类关系十分重要。微生物是一把锋利的“双刃剑”，给人类带来“残忍\"破坏的同时也带来巨大利益，它给人类带来的利益不仅是享受，而且很多时候涉及到人类的生存。"], [0, "（1）益处"], [1, "①⟦1|微生物⟧是自然界物质循环的关键环节；"], [1, "②体内的正常菌群是人及动物健康的基本保证，可以帮助消化、提供必需的⟦1|营养⟧物质、组成⟦2|生理⟧屏障等。"], [1, "③⟦1|微生物⟧可以在工农医药等行业为我们提供很多有用的物质，如有机酸、⟦2|酶⟧、各种药物、疫苗、面包、奶酪、啤酒、酱油等等"], [1, "④⟦1|微生物⟧在基因工程为代表的现代生物技术发挥重大作用。"], [0, "（2）环处病原⟦1|微生物⟧引发的疾病一度困扰人类的生存和发展。在古时候，鼠疫（黑死病）、天花、肺结核、流感、疟疾和梅毒等的大流行。而时至今日，仍有多种新发传染病和再现传染病在疯狂地侵扰和残害人类，例如艾滋病、萨斯、禽流感、疯牛病、乙型肝炎和结核病等。其中艾滋病被称为“世纪瘟疫\"或黄色妖魔”。"]], 0],
[0, 1, 0, 1, "肽聚糖（peptidoglycan）", [[0, "是真⟦2|细菌⟧⟦1|细胞壁⟧的特有成分，由大量⟦1|肽聚糖⟧单体以网状形式交联而成。肽聚糖是由肽和聚糖两部分组成，其中肽包括四肽尾和肽桥两种，聚糖则是由N-乙酰葡萄糖胺通过β-1，4-糖苷键与N-乙酰胞壁酸相连接成的长链。G+细菌与G-细菌的肽聚糖⟦2|结构⟧稍有不同。"]], 0],
[0, 1, 0, 2, "原核生物（prokaryote）", [[0, "是指一大类⟦2|细胞⟧核无核膜包裹，只存在称作核区的裸露DNA的原始单细胞生物，包括真⟦2|细菌⟧和古生菌两大类群。原核生物根据外表特征可粗分为⟦1|6种⟧类型，即细菌（狭义的）、⟦1|放线菌⟧、⟦1|蓝细菌⟧、支原体、⟦1|立克次氏体⟧和衣原体。"]], 0],
[0, 1, 0, 3, "外膜（outermembrane）", [[0, "是G-⟦2|细菌⟧⟦1|细胞壁⟧所特有的⟦2|结构⟧，位于壁的最外层，主要由脂多糖、磷脂及外膜蛋白⟦1|3种⟧成分组成。"]], 0],
[0, 1, 0, 4, "古菌（archaebacteria）", [[0, "是一类在进化途径上很早就与真⟦1|细菌⟧和真核生物相互独立的生物类群，主要包括一些独特⟦2|生态⟧类型的原核生物，如产甲烷菌及大多数嗜极菌，包括极端⟦1|嗜盐⟧菌、极端嗜热菌等。"]], 0],
[0, 1, 0, 5, "缺壁细菌（cell wall deficient bacteria）", [[0, "是指在自然界长期进化中和在实验室菌种的自发突变中都会产生少数缺⟦1|细胞壁⟧的种类；此外，还可用人为方法通过抑制新生⟦2|细胞⟧壁的合成或对现成细胞壁进行⟦2|酶⟧解而获得人工缺壁⟦2|细菌⟧。至要包括⟦1|4类⟧：L型细菌、⟦1|原生质体⟧、球状体和⟦1|支原体⟧。"]], 0],
[0, 1, 0, 6, "L型细菌（L-form of bacteria）", [[0, "指在实验室或宿主体内通过自发突变而形成的⟦2|遗传⟧性稳定的⟦1|细胞壁⟧缺损菌株。该⟦2|细胞⟧膨大、对渗透敏感在固体⟦1|培养基⟧上可形成“油煎蛋”似的小⟦1|菌落⟧。"]], 0],
[0, 1, 0, 7, "原生质体（protoplast）", [[0, "指在人为条件下，用溶菌酶除尽原有⟦1|细胞壁⟧或用青霉素抑制新生⟦2|细胞⟧壁合成后，所得到的仅有一层⟦1|细胞膜⟧包裹的圆球状的渗透敏感细胞，它们只能用等渗或高渗培养液保存或维持⟦2|生长⟧。G+⟦2|细菌⟧最易形成⟦1|原生质体⟧。"]], 0],
[0, 1, 0, 8, "球状体（spheroplast）", [[0, "又称原生质球，指还残留了部分⟦1|细胞壁⟧（尤其是G-⟦2|细菌⟧外膜层）的圆球形⟦1|原生质体⟧。"]], 0],
[0, 1, 0, 9, "支原体（mycoplasma）", [[0, "是在长期进化过程中形成的、适应自然生活条件的无⟦1|细胞壁⟧的原核生物；因为它的⟦1|细胞膜⟧中含有一般原核生物所没有的甾醇，故即使缺乏⟦2|细胞⟧壁，其细胞膜仍有较高的机械强度"]], 0],
[0, 1, 0, 10, "聚-β-羟丁酸（poly-β-hydroxybutyrate，PHB）", [[0, "是一种存在于许多⟦1|细菌⟧⟦2|细胞⟧质内属于脂质的碳源类贮藏物，不溶于水，而溶于氯仿，可用尼罗蓝或苏丹黑染色，具有贮藏⟦2|能量⟧、碳源和降低细胞内渗透压等作用，具有无毒、可塑和易降解等特点，因此可用作制造医用塑料、快餐盒、药品和化妆品等的优质原料，以克服当前危害严重的“白色污染\"。"]], 0],
[0, 1, 0, 11, "气泡（gas vacuole）", [[0, "是存在于许多光能⟦1|营养⟧型、无⟦1|鞭毛⟧运动水生⟦2|细菌⟧中的泡囊状内含物，其充满气体，内有数排柱形小空泡，具有调节⟦2|细胞⟧相对密度，以使其漂浮在最适水层中的作用，借以获取光能、氧和营养物质。"]], 0],
[0, 1, 0, 12, "鞭毛（flagellum）", [[0, "着⟦1|生长⟧在某些⟦2|细菌⟧表面的长丝状、波曲的⟦2|蛋白质⟧附属物。其数目为一至数十条，具有运动功能。"]], 0],
[0, 1, 0, 13, "菌毛（fimbria）", [[0, "是一种长在⟦2|细菌⟧体表的纤细、中空、短直且数量较多的⟦2|蛋白质⟧类附属物，具有使菌体附着于物体表面上和向宿主⟦2|细胞⟧注入毒素等功能，比⟦1|鞭毛⟧简单，无基体等构造，直接着生于细胞质膜上。⟦1|菌毛⟧多数存在于G一致病菌中。它们借助菌毛可使自己牢固地黏附在宿主的呼吸道、消化管或泌尿生殖道等黏膜上。"]], 0],
[0, 1, 0, 14, "性毛（pilus）", [[0, "构造和成分与⟦1|菌毛⟧相同，但比菌毛长，且每个⟦2|细胞⟧仅一至少数几根。一般见于G-⟦2|细菌⟧的雄性⟦1|菌株⟧（供体菌）中，具有向雌性菌株（受体菌）传递⟦2|遗传⟧物质的作用，有的还是RNA⟦1|噬菌体⟧的特异性吸附受体。"]], 0],
[0, 1, 0, 15, "芽孢（endospore，spore）", [[0, "某些⟦1|细菌⟧在其生长发育后期，在⟦2|细胞⟧内形成的一个圆形或椭圆形、厚壁、含水量低、抗逆性强的休眠构造，称为⟦1|芽孢⟧。由于每一⟦2|营养⟧细胞内仅形成一个芽孢，故芽孢并无繁殖功能。"]], 0],
[0, 1, 0, 16, "伴孢晶体（parasporalcrystal）", [[0, "是少数⟦1|芽孢⟧杆菌产生的糖蛋白昆虫毒素。如苏云金芽孢杆菌在形成芽孢的同时，会在芽孢旁形成一颗菱形、方形或不规则形的碱溶性⟦1|蛋白质⟧晶体，这种伴孢晶体对鳞翅目等多种昆虫和动、植物线虫有毒杀作用，因此可将这类⟦2|细菌⟧制成对人畜安全、对害虫的天敌和植物无害，有利于环境保护的生物农药。"]], 0],
[0, 1, 0, 17, "菌落（colony）", [[0, "将单个⟦2|细菌⟧或一小堆同种细菌⟦2|细胞⟧接种到固体⟦1|培养基⟧表面或内层，当它占有一定的发展空间并处于适宜的培养条件下，该细胞就会迅速⟦2|生长⟧繁殖并形成细胞堆，此即⟦1|菌落⟧。菌落特征是⟦1|菌种⟧鉴定中的重要指标，也常用于菌种的分离、纯化、计数、育种和保藏等实际工作中。"]], 0],
[0, 1, 0, 18, "放线菌（actinomycetes）", [[0, "是指一类主要呈⟦1|菌丝⟧状⟦2|生长⟧和以⟦1|孢子⟧⟦2|繁殖⟧的陆生性较强的原核生物，是一类主要呈丝状生长和孢子繁殖的⟦1|革兰氏⟧阳性⟦2|细菌⟧。"]], 0],
[0, 1, 0, 19, "革兰氏染色（Gram's staining）", [[0, "一种根据⟦2|细菌⟧⟦1|细胞壁⟧⟦2|结构⟧的不同而将细菌区分为两大类的⟦2|染色⟧方法。染色步骤一般为初染、媒染、脱色和复染。结果染成红色的称为⟦1|革兰氏⟧阴性，染成紫色的称为革兰氏阳性。"]], 0],
[0, 1, 0, 20, "渗透调节皮层膨胀学说（osmotic regulation of cortical expansion theory）", [[0, "用于解释⟦1|芽孢⟧⟦1|耐热⟧机制的学说，该学说认为芽孢衣对多价阳离子和水分的透性差，而其皮层的离子强度却很高，从而皮层会产生极高的渗透压去夺取芽孢核心部位的水分，其结果造成了皮层的充分膨胀，而芽孢的核心部位却高度失水，从而使其获得了高度耐热性。"]], 0],
[0, 1, 1, 1, "简要说明肽聚糖的构造，并指出 G+与 G-细菌肽聚糖结构的差别。", [[0, "⟦1|肽聚糖⟧是真⟦2|细菌⟧⟦1|细胞壁⟧中的特有成分。肽聚糖的构造：肽聚糖分子由肽和聚糖两部分组成，其中肽包括四肽尾和肽桥两种，而聚糖则是由N-乙酰葡糖胺和N-乙酰胞壁酸两种单糖相互间隔连接成的长链。这种肽聚糖网格状分子交织成一个致密的网套覆盖在整个⟦2|细胞⟧上。"], [0, "（2）G-⟦1|细菌⟧⟦1|肽聚糖⟧⟦2|结构⟧与G+细菌基本相同，G-细菌肽聚糖结构的差别如下："], [1, "①四肽尾的第三个氨基酸分子不是L-Lys，而是被一种只存在于原核生物⟦1|细胞壁⟧上的特殊氨基酸一一内消二氨基庚二酸（m-DAP）所代替；"], [1, "②没有特殊的肽桥，故前后两个单体间的连接仅通过甲四肽尾的第四个氨基酸（D-Ala）的羧基与乙四肽尾的第三个氨基酸（m-DAP）的氨基直接相连，因而只形成较为疏稀、机械强度较差的⟦1|肽聚糖⟧网套。"]], 0],
[0, 1, 1, 2, "简述G+与G-细菌细胞壁的主要构造，并简要说明两者的异同。", [[0, "（1）G+与G-⟦1|细菌⟧⟦1|细胞壁⟧的主要构造"], [1, "①G+⟦2|细菌⟧的⟦1|细胞壁⟧厚度大（20-⟦1|80nm⟧，从几层至25层分子）和化学组分简单，一般含有60%～95%的⟦1|肽聚糖⟧和10%30%的磷壁酸。其中肽聚糖由肽和聚糖两部分组成，肽包括四肽尾和肽桥两种，聚糖则是由N-乙酰葡萄糖胺通过β-1，4-糖苷键与N-乙酰胞壁酸相连接成的长链。"], [1, "②G-⟦2|细菌⟧的⟦1|细胞壁⟧厚度比较G+细菌薄，层次较多，成分较复杂，⟦1|肽聚糖⟧层很薄（只有2-⟦1|3nm⟧），故机械强度较G+细菌弱。⟦2|细胞⟧壁由肽聚糖、外膜、周质空间三部分组成。"], [0, "（2）G+与G-⟦2|细菌⟧⟦1|细胞壁⟧异同比较：G+与G-细菌的细胞壁都含⟦1|肽聚糖⟧，但成分含量存在区别。在G+细菌的细胞壁中肽聚糖、磷壁酸含量高，而脂质和⟦2|蛋白质⟧含量少，而G一则相反，其肽聚糖含量较低，无磷壁酸，脂质和蛋白质含量高。G+与G-细菌一系列生物学特性的比较如表所示："], [0, "1、⟦1|革兰氏⟧⟦1|染色⟧反应：G+⟦2|细菌⟧ 能阻留结晶紫而染成为紫色；G-细菌 可经脱色而复染成红色"], [0, "2、⟦1|肽聚糖⟧层：G+⟦1|细菌⟧ 厚，层次多；G-细菌 薄，一般单层"], [0, "3、磷壁酸：G+⟦1|细菌⟧ 多数含有；G-细菌 无"], [0, "4、外膜：G+⟦1|细菌⟧ 无；G-细菌 有"], [0, "5、脂多糖：G+⟦1|细菌⟧ 无；G-细菌 有"], [0, "6、类脂和脂蛋白含量：G+⟦1|细菌⟧ 低（仅抗酸细菌含类脂）；G-细菌 高"], [0, "7、⟦1|鞭毛⟧⟦1|结构⟧：G+⟦2|细菌⟧ 基体上着生两个环；G-细菌 基体上着生四个环"], [0, "8、产毒素：G+⟦2|细菌⟧ 以⟦1|外毒素⟧为主；G-细菌 以⟦1|内毒素⟧为主"], [0, "9、对机械力的抗性：G+⟦1|细菌⟧ 强；G-细菌 弱"], [0, "10、⟦1|细胞壁⟧抗溶菌⟦1|酶⟧：G+⟦2|细菌⟧ 弱；G-细菌 强"], [0, "11、对青霉素和磺胺：G+⟦1|细菌⟧ 敏感"], [0, "12、对链霉素、氯霉素、四环素：G+⟦1|细菌⟧ 不敏感；G-细菌 敏感"], [0, "13、碱性染料的抑菌作用：G+⟦1|细菌⟧ 强；G-细菌 弱"], [0, "14、对阴离子去污剂：G+⟦1|细菌⟧ 敏感；G-细菌 不敏感"], [0, "15、对叠氮化钠：G+⟦1|细菌⟧ 敏感；G-细菌 不敏感"], [0, "16、对干燥：G+⟦1|细菌⟧ 抗性强；G-细菌 抗性弱"], [0, "17、产⟦1|芽孢⟧：G+⟦1|细菌⟧ 有的产；G-细菌 不产"]], 0],
[0, 1, 1, 3, "简述革兰氏染色的原理和意义。", [[0, "（1）⟦1|革兰氏⟧⟦2|染色⟧的原理：G+和G-⟦2|细菌⟧主要由于其⟦1|细胞壁⟧化学成分的差异而引起了物理特性（脱色能力）的不同，决定了最终染色反应的不同。"], [0, "G+⟦2|细菌⟧染色通过结晶紫初染和碘液媒染后，在⟦1|细胞壁⟧内形成了不溶于水的结晶紫与碘的复合物，革兰氏阳性菌由于其⟦2|细胞⟧壁较厚、⟦1|肽聚糖⟧网层次较多且交联致密，故遇乙醇或丙酮脱色处理时，因失水反而使网孔缩小，再加上它不含类脂，故乙醇处理不会出现缝隙，因此能把结晶紫与碘复合物牢牢留在壁内，使其仍呈紫色。"], [0, "G-⟦2|细菌⟧⟦2|染色⟧革兰氏阴性菌因其⟦1|细胞壁⟧薄、外膜层类脂含量高、⟦1|肽聚糖⟧层薄且交联度差，在遇脱色剂后，以类脂为主的外膜迅速溶解，薄而松散的肽聚糖网不能阻挡结晶紫与碘复合物的溶出，因此通过乙醇脱色后呈无色，再经沙黄等红色染料复染，就使革兰氏阴性菌呈红色。"], [0, "（2）⟦1|革兰氏⟧染色的意义：革兰氏染色有着十分重要的理论与实践意义。通过这一染色，可把几乎所有的⟦2|细菌⟧都分成革兰氏阳性菌与革兰氏阴性菌两个大类，因此它是分类鉴定菌种时的重要指标。又由于这两大类细菌在⟦2|细胞⟧结构、成分、形态、生理、生化、遗传、⟦1|免疫⟧、生态和药物敏感性等方面都呈现出明显的差异，因此任何细菌只要先通过很简单的革兰染色，即可提供不少其他重要的生物学特性方面的信息。"], [0, "【补充：⟦1|革兰氏⟧⟦1|染色⟧的实验步骤】"], [0, "（1）用碱性染料结晶紫对菌液涂片进行初染；"], [0, "（2）用碘溶液进行媒染，其作用是提高染料和⟦1|细胞⟧间的相互作用从而使二者结合得更牢固；"], [0, "（3）用乙醇或丙酮冲洗进行脱色。在经历脱色后仍将结晶紫保留在⟦1|细胞⟧内的为⟦1|革兰氏⟧阳性⟦2|细菌⟧，而革兰氏阴性细菌的结晶紫被洗掉，细胞呈无色；"], [0, "（4）用一种与结晶紫具有不同颜色的碱性染料对涂片进行复染。例如沙黄，它使原来无色的⟦1|革兰氏⟧阴性⟦1|细菌⟧最后呈现桃红到红色，而革兰氏阳性细菌继续保持深紫色，"]], 0],
[0, 1, 1, 4, "什么是缺壁细菌？试列表比较4类缺壁细菌的形成、特点和实践意义", [[0, "（1）缺壁⟦2|细菌⟧的定义：是指在自然界长期进化中和在实验室菌种的自发突变中都会产生少数缺⟦1|细胞壁⟧的种类；此外，还可用人为方法通过抑制新生⟦2|细胞⟧壁的合成或对现成细胞壁进行酶解而获得人工缺壁细菌。主要包括⟦1|4类⟧：L型细菌、⟦1|原生质体⟧，球状体和支原体。"], [0, "（2）四者的比较如表所示"], [0, "L型⟦2|细菌⟧：形成 在某些环境条件下（实验室或宿主体内）通过自发突变而形成的遗传性稳定的⟦1|细胞壁⟧缺陷变异型。；特点 ①没有完整而坚韧的⟦2|细胞⟧壁，细胞呈多形态；②有些能通过细菌滤器，故又称“滤过型细菌”；③对渗透敏感，在固体⟦1|培养基⟧上形成“油煎蛋”似的小菌落。；实践意义 可能与针对细胞壁的抗菌治疗有关。"], [0, "⟦1|原生质体⟧：形成 在人为条件下，用溶菌酶处理，或在含青霉素的培养基中抑制新生⟦1|细胞壁⟧合成后形成。该⟦2|细胞⟧仅由一层细胞膜包裹，呈圆球形，对渗透压变化敏感，一般由革兰氏阳性⟦2|细菌⟧形成。；特点 ①对环境条件变化敏感，低渗透压、振荡、离心甚至通气等都易引起其破裂；②有的具有鞭毛但不能运动，也不被相应噬菌体感染；在适宜条件（如高渗培养基）下可生长繁殖、形成菌落、形成芽孢及恢复成有细胞壁的正常结构。；实践意义 不同菌种或菌株的原生质体间易发生细胞融合，因而可用于杂交育种；原生质体比正常细菌更易导入外源遗传物质，有利于遗传学基本原理的研究。"], [0, "球状体：形成 又称原生质球，是革兰氏阴性⟦2|细菌⟧经处理后获得的、残留部分⟦1|细胞壁⟧（外壁层）的球形体。；特点 与⟦1|原生质体⟧相比，它对外界环境具有一定的抗性，可在普通培养基上生长。；实践意义 球状体无繁殖能力；比正常有⟦2|细胞⟧壁的细菌更易导入外源遗传物质和渗入诱变剂，是研究遗传规律和进行原生质体育种的实验材料。"], [0, "支原体：形成 在长期进化过程中形成的、适应自然生活条件的无⟦1|细胞壁⟧原核生物。；特点 ⟦1|细胞膜⟧中含有一般原核生物所没有的甾醇，因此即使缺乏⟦2|细胞⟧壁，其细胞膜仍有较高的机械强度。；实践意义 许多种类是人和动物的⟦2|致病⟧菌，与相关疾病的防治有关。"]], 0],
[0, 1, 1, 5, "古菌和真细菌的主要差异是什么？", [[0, "在⟦2|细胞⟧结构和代谢上，古菌在很多方面接近其它原核生物。然而在基因转录的分子生物学的中心过程上，它们并不明显表现出⟦2|细菌⟧的特征，反而非常接近真核生物。古菌还具有一些其它特征，与大多数细菌不同，它们只有一层细胞膜而缺少⟦1|肽聚糖⟧⟦1|细胞壁⟧。而且，绝大多数细菌和真核生物的细胞膜中的脂类主要由甘油酯组成，而古菌的膜脂由甘油醚构成。这些区别也许是对超高温环境的适应，古菌鞭毛的成分和形成过程也与细菌不同。两者的差别如表所示："], [0, "亲水头与疏水尾相连：真⟦1|细菌⟧ 酯键；古生菌 醚键"], [0, "疏水尾成分：真⟦1|细菌⟧ 脂肪酸；古生菌 异戊二烯重复单位、四聚体植烷"], [0, "单分子层膜：真⟦1|细菌⟧ 不存在；古生菌 存在"], [0, "甘油 C3 上连接物：真⟦1|细菌⟧ 磷脂酸、磷脂酰乙醇胺、磷脂酰胆碱、磷脂酰甘油、磷脂酰肌醇；古生菌 磷脂酸、硫脂酸、各种糖基"], [0, "膜上含独特脂类：真⟦1|细菌⟧ 无；古生菌 种类多样，如细菌红素、番茄红素等"]], 0],
[0, 1, 1, 6, "简要说明芽孢构造，简述芽孢的耐热机制。", [[0, "⟦1|芽孢⟧是指某些⟦1|细菌⟧在其生长发育后期，在⟦2|细胞⟧内形成的个圆形或椭圆形、厚壁、含水量低、抗逆性强的休眠构造。由于每一营养细胞内仅形成一个芽孢，故芽孢并无繁殖功能。"], [0, "（1）⟦1|芽孢⟧的结构：芽抱囊：是产芽抱菌的⟦1|营养⟧⟦2|细胞⟧外壳孢外登：主要含脂蛋白，透性差（有的练把无此层）"], [0, "产芽孢⟦2|细菌⟧穿孢农：主要含蔬水性角蛋白，抗酶解，抗药物，多价阳离子难通过穿抱皮层：主要含芽抱⟦1|肽聚糖⟧及DPA-Ca，体积较大。渗透压高，含水量大芽抱缝，含肽感糖，可发展成新细胞的核心辣孢质膜：含磷脂、⟦2|蛋白质⟧，可发展成新细胞的膜芽孢质含DPA-Ca⟦1|核糖体⟧，RNA和随类核区：含DNA"], [0, "（2）⟦1|芽孢⟧的⟦1|耐热⟧机制"], [1, "①⟦1|芽孢⟧的⟦1|耐热⟧机制有多种学说，其中最有代表性的是渗透调节皮层膨胀学说。该学说的主要内容是：芽孢衣对多价阳离子和水分的透性很差以及皮层离子强度高，从而使皮层产生了极高的渗透压去夺取芽孢核心中的水分，其结果是皮层充分膨胀和核心的高度失水，因而耐热。"], [1, "②另一种学说认为⟦1|芽孢⟧中含有⟦2|营养⟧⟦2|细胞⟧所没有的DPA-Ca，它能使芽孢中的生物大分子形成稳定、⟦1|耐热⟧的凝胶，从而增强芽孢的耐热性。"]], 0],
[0, 1, 1, 7, "简述研究芽孢有何意义？", [[0, "⟦1|芽孢⟧是指某些⟦1|细菌⟧在其生长发育后期，在⟦2|细胞⟧内形成的一个圆形或椭圆形、厚壁、含水量低、抗逆性强的休眠构造。由于每一营养细胞内仅形成一个芽孢，故芽孢并无繁殖功能。研究细菌芽孢的理论和实际意义如下："], [0, "（1）是研究生物抗逆性和休眠的生物学机制的良好材料；"], [0, "（2）是⟦1|细菌⟧⟦2|分类⟧、鉴定中的重要的指标；"], [0, "（3）有利于提高⟦1|菌种⟧筛选效率；"], [0, "（4）有利于⟦1|菌种⟧的长期保藏；"], [0, "（4）为比较各种⟦1|消毒⟧⟦1|灭菌⟧方法的可靠性提供优良的模式生物。"]], 0],
[0, 1, 1, 8, "试列表比较细菌鞭毛、菌毛和性毛的异同", [[0, "（1）①⟦1|鞭毛⟧是指生长在某些⟦2|细菌⟧表面的长丝状、波曲的⟦2|蛋白质⟧附属物。其数目为一至数十条，具有运动功能。②菌毛是一种长在细菌体表的纤细、中空、短直且数量较多的蛋白质类附属物，具有使菌体附着于物体表面上和向宿主细胞注入毒素等功能，比鞭毛简单，无基体等构造，直接着生于细胞质膜上。③性毛是指构造和成分与菌毛相同，但比菌毛长，且每个细胞仅一至少数几根。一般见于G-细菌的雄性菌株（供体菌）中，具有向雌性菌株（受体菌）传递遗传物质的作用，有的还是RNA⟦1|噬菌体⟧的特异性吸附受体。"], [0, "（2）三者异同如下表所示："], [0, "⟦2|形态⟧：⟦1|鞭毛⟧ 长，波曲，中空，由基体、钩形鞘和鞭毛丝3部分组成；⟦1|菌毛⟧ 短、直、细、中空，构造简单；性毛 较长、较直、中空，构造简单"], [0, "数目：⟦1|鞭毛⟧ 一至数十条；⟦1|菌毛⟧ 250至⟦1|1000条⟧；性毛 一至少数几条"], [0, "着生部位：⟦1|鞭毛⟧ 端生、周生、侧生；⟦1|菌毛⟧ 周生；性毛 不定"], [0, "成分：⟦1|鞭毛⟧ 鞭毛蛋白；⟦1|菌毛⟧ 菌毛蛋白；性毛 性毛蛋白"], [0, "功能：⟦1|鞭毛⟧ 运动；⟦1|菌毛⟧ 黏附；性毛 传递⟦2|遗传⟧物质"]], 0],
[0, 1, 1, 9, "什么是菌落？试讨论细菌的细胞形态与菌落形态间的相关性。", [[0, "（1）⟦1|菌落⟧的定义将单个⟦2|细菌⟧或一小堆同种细菌细胞接种到固体⟦1|培养基⟧表面或内层，当它占有一定的发展空间并处于适宜的培养条件下，该细胞就会迅速生长繁殖并形成细胞堆，此即菌落。菌落可用于⟦2|微生物⟧的分离、纯化、鉴定、计数以及选种育种等方面。"], [0, "（2）⟦2|细菌⟧的细胞形态与⟦1|菌落⟧形态间的相关性各种⟦2|微生物⟧在一定条件下形成的菌落，其形态特征有一定的稳定性和专一性，因而可以作为识别、鉴定⟦1|菌种⟧的一个依据，但也受某些因素的影响，观察时应加以注意。例如："], [1, "①无⟦1|鞭毛⟧、不能运动的⟦2|细菌⟧尤其是球菌通常形成较小、较厚、边缘圆整的半球状⟦1|菌落⟧；"], [1, "②长有⟦1|鞭毛⟧、运动能力强的⟦2|细菌⟧一般形成大而平坦、边缘多缺刻（甚至成树根状）、不规则的⟦1|菌落⟧；"], [1, "③有糖被的⟦1|细菌⟧，会长出大型、透明、蛋清状的⟦1|菌落⟧；"], [1, "④有⟦1|芽孢⟧的⟦2|细菌⟧往往长出外观粗糙、“干燥”、不透明且表面多褶的⟦1|菌落⟧等。"]], 0],
[0, 1, 1, 10, "青霉素为何只能抑制代谢旺盛的细菌，其抑菌机制是什么？（高校真题）", [[0, "（1）青霉素只能抑制代谢旺盛的⟦1|细菌⟧的原因青霉素的作用机制在于抑制⟦1|肽聚糖⟧的生物合成，因此对处于生长繁殖旺盛期的⟦2|微生物⟧具有明显的抑制作用，而对处于生长休止期的细胞，则无抑制作用。"], [0, "（2）青霉素只能抑制代谢旺盛的⟦2|细菌⟧的抑菌机制青霉素是⟦1|肽聚糖⟧单体五肽尾末端一一D-丙氨酰-D-丙氨酸的结构类似物，它们两者可相互竞争转肽酶的活性中心。转肽酶一旦被青霉素结合，前后⟦1|2个⟧肽聚糖间不能形成肽桥，因此合成的肽聚糖是缺乏机械强度的次品”，由此产生了⟦1|原生质体⟧或球状体之类的⟦2|细胞⟧壁缺损细菌，于不利的环境时，极易裂解死亡。"]], 0],
[0, 1, 1, 11, "比较革兰氏阳性细菌与阴性细菌细胞对机械抗性、溶菌酶和碱性染料敏感性的差异，并解释可能的机制。（高校真题）", [[0, "（1）差异表现为：⟦1|革兰氏⟧阳性菌的⟦1|细胞⟧机械抗性强，容易被溶菌⟦2|酶⟧所裂解，且对碱性染料敏感度强，而革兰氏阴性菌细胞则刚好相反。"], [0, "（2）对于出现这种差异的可能机制的解释如下："], [1, "①革兰氏阳性菌⟦1|细胞壁⟧较厚、⟦1|肽聚糖⟧网层次多和交联致密，故其机械强度大，高含量的肽聚糖易被溶菌酶所溶解致使细胞裂解。碱性染料的阳离子基团能与细胞⟦2|蛋白质⟧氨基酸上的羧基或核酸上的磷酸基结合阻断正常的细胞代谢过程。另外阳性⟦2|细菌⟧菌体等电点较阴性细菌为低，在相同pH条件下进行染色，阳性细菌吸附碱性染料很多，阴性菌则相反。碱性染料可透过革兰氏阳性菌细胞壁进入胞内与重要蛋白质结合，故对革兰氏阳性菌有选择性抑菌作用。"], [1, "②革兰氏阴性菌⟦1|细胞壁⟧薄、外膜层类脂含量高、⟦1|肽聚糖⟧层薄和交联度差，外膜阻挡溶菌⟦2|酶⟧接触⟦2|细胞⟧壁肽聚糖，阻挡碱性染料透过细胞壁，因此不宜被溶菌酶裂解，也对碱性染料不敏感"]], 0],
[0, 2, 0, 1, "真核微生物（eukaryoticmicroorganisms）", [[0, "一大类⟦1|细胞⟧核具有核膜，能进行有丝分裂，细胞质中存在线粒体或同时存在叶绿体等多种细胞器的生物⟦1|真菌⟧、显微藻类和原生动物等是属于真核生物类的⟦2|微生物⟧，故称为真核微生物。"]], 0],
[0, 2, 0, 2, "真菌（fungi）", [[0, "是一类重要的真核⟦2|微生物⟧，无叶绿素，不能进行光合作用；多数具有发达的⟦1|菌丝⟧体；⟦1|细胞壁⟧一般含几丁质；⟦2|营养⟧方式为异养吸收型；以产生各种无性或有性⟦1|孢子⟧方式进行⟦2|繁殖⟧；陆生性较强。"]], 0],
[0, 2, 0, 3, "酵母菌（yeast）", [[0, "是指能⟦1|发酵⟧糖类的各种单⟦2|细胞⟧⟦1|真菌⟧的俗称。通常具有五个特点：一般为单细胞；多数常出芽⟦2|繁殖⟧；能发酵糖类产能；⟦1|细胞壁⟧常含甘露聚糖；常生活在含糖量较高、酸度较大的水生环境中。"]], 0],
[0, 2, 0, 4, "霉菌（mould，mold）", [[0, "是丝状⟦1|真菌⟧的一个俗称，即“会引起物品霉变的真菌”，通常指那些⟦1|菌丝⟧体较发达又不产生大型肉质子实体⟦2|结构⟧的真菌。"]], 0],
[0, 2, 0, 5, "蕈菌（mushroom）", [[0, "是一个通俗名称，通常是指那些能形成大型肉质子实体的⟦1|真菌⟧，包括大多数担子菌类和极少数的子囊菌类。菌最大特征是形成性状、大小、颜色各异的大型肉质或革质等子实体。"]], 0],
[0, 2, 0, 6, "锁状联合（clamp connection）", [[0, "是指形成喙状突起而连合两个⟦1|细胞⟧的方式，是蕈菌的二级⟦1|菌丝⟧尖端向前延伸的方式。具有双核细胞的次生菌丝常以锁状联合的方式来增加细胞的个体。"]], 0],
[0, 2, 1, 1, "比较真核生物和原核生物的异同。", [[0, "原核生物指一大类⟦2|细胞⟧核无核膜包裹，只存在核区的裸露DNA的原始单细胞生物，包括⟦2|细菌⟧、⟦1|放线菌⟧、蓝细菌、枝原体、⟦1|立克次氏体⟧和衣原体。真核生物指一大类细胞核具有核膜，能进行有丝分裂，细胞质中存在线粒体或同时存在叶绿体等多种细胞器的生物，包括真菌、显微藻类和原生动物。两者的异同见表格："], [0, "⟦1|细胞⟧大小：真核生物 较大（通常直径>⟦1|2 μm⟧）；原核生物 较小（通常直径<2 μm）"], [0, "⟦1|细胞壁⟧成分：真核生物 纤维素、几丁质；原核生物 不含纤维素，多数为⟦1|肽聚糖⟧"], [0, "⟦1|细胞膜⟧中甾醇：真核生物 有；原核生物 无（⟦1|支原体⟧除外）"], [0, "⟦1|鞭毛⟧⟦1|结构⟧：真核生物 粗而复杂（9+2型）；原核生物 细而简单"], [0, "⟦1|细胞⟧器：真核生物 多种，具有⟦1|核糖体⟧、线粒体、叶绿体、内质网、高尔基体等；原核生物 核糖体"], [0, "⟦1|细胞⟧质⟦1|核糖体⟧：真核生物 80S；原核生物 70S"], [0, "核膜：真核生物 有（⟦1|2层⟧）；原核生物 无"], [0, "⟦1|氧化磷酸化⟧部位：真核生物 线粒体；原核生物 ⟦1|细胞膜⟧"], [0, "⟦1|繁殖⟧方式：真核生物 有性、无性多种；原核生物 一般为无性（二等分裂）"]], 0],
[0, 2, 1, 2, "试总结酵母菌的5个特点，并列出各个特点的例外。", [[0, "⟦1|酵母菌⟧（yeast）是一个通俗名称，一般泛指能发酵糖类的各种单⟦2|细胞⟧⟦1|真菌⟧。酵母菌的⟦1|5个⟧特点及各个特点的例外如下"], [0, "（1）个体一般以单⟦2|细胞⟧非菌丝状态存在。有含⟦1|真菌⟧丝的⟦1|酵母菌⟧为细胞相连，竹节状细胞串除外。"], [0, "（2）多数营出芽生殖。有进行裂殖生殖的⟦1|酵母菌⟧，裂殖酵母除外。"], [0, "（3）能⟦1|发酵⟧糖类产能。非发酵糖类⟦1|酵母菌⟧除外。"], [0, "（4）⟦1|细胞壁⟧常含甘露聚糖。绝大多数的⟦1|酵母菌⟧⟦2|细胞⟧壁含甘露聚糖，少数不含。"], [0, "（4）常生活在含糖量较高、酸度较大的环境中。生活于石油油田中的⟦1|酵母菌⟧除外。"]], 0],
[0, 2, 1, 3, "简述酿酒酵母的生活史。", [[0, "酿酒酵母既能以单倍体也能以二倍体形式存在。其特点为：一般情况下都以⟦1|营养⟧体状态进行出芽⟦2|繁殖⟧；营养体既能以单倍体（n）的形式存在，也能以二倍体（2n）的形式存在；在特定的条件下才进行有性繁殖。生活史可描述为："], [0, "①子囊⟦1|孢子⟧发芽：子囊孢子在合适的条件下发芽产生单倍体⟦1|营养⟧⟦2|细胞⟧，单倍体营养细胞不断进行出芽繁殖。"], [0, "②⟦1|接合⟧：两个性别不同的⟦1|营养⟧⟦2|细胞⟧彼此接合，在质配后即发生核配，形成二倍体营养细胞。"], [0, "③减数分裂：正常情况下，二倍体⟦2|营养⟧⟦2|细胞⟧进行出芽繁殖，在以醋酸盐为唯一或主要碳源，同时又缺乏氮源等特定条件下，二倍体营养细胞转变成子囊，细胞核进行减数分裂，并形成⟦1|4个⟧子囊⟦1|孢子⟧。"], [0, "④破壁：子囊⟦1|孢子⟧在合适的条件下发芽，经自然破壁或人为破壁后，子囊释放出单倍体子囊孢子。因此酿酒酵母营养体既可以是单倍体，也可以是双倍体4、四大类⟦2|微生物⟧的细胞形态和⟦1|菌落⟧特征的比较。答：（1）⟦2|细菌⟧：细菌属单细胞生物，一个菌落内无数细胞并没有形态和功能上的分化，细胞间充满着毛细管状态的水。故细菌菌落一般呈现湿润，较光滑，较透明，较粘稠，易挑取，质地均匀以及菌落正反面或边缘与中央部位的颜色一致。"], [0, "（2）⟦1|放线菌⟧：多数放线菌有基内和气生菌丝的分化，气生菌丝成熟时又会进一步分化成孢子丝并产生串的干粉状孢子，它们伸展在空间，菌丝间没有毛细管水积存。故菌落特征为能产生大量分枝和气生菌丝的菌种（如链霉菌）菌落质地致密，与⟦1|培养基⟧结合紧密，小而不蔓延，不易挑起或挑起后不易破碎；不能产生大量菌丝体的菌种（如诺卡氏菌）粘着力差，粉质，针挑起易粉碎。"], [0, "（3）⟦1|酵母菌⟧：酵母菌的⟦2|细胞⟧比⟦2|细菌⟧的大，细胞内有许多分化的细胞器，细胞间隙含水量相对较少，以及不能运动等特点，故醇母菌的⟦1|菌落⟧特征为一般较细菌菌落大且厚，表面湿润，粘稠，易被挑起，多为乳白色，少数呈红色。"], [0, "（4）霉菌：霉菌的⟦2|细胞⟧呈丝状，在固体⟦1|培养基⟧上生长时又有营养和气生菌丝的分化，气生菌丝间没毛细管水。故霉菌⟦1|菌落⟧特征为由粗而长的分枝状菌丝组成，菌落疏松，皇绒毛状、絮状或蜘蛛网状，比⟦2|细菌⟧菌落大几倍到几十倍，有的没有固定大小。"]], 0],
[0, 2, 1, 4, "什么叫锁状联合？其生理意义如何？", [[0, "锁状联合是指形成喙状突起而连合两个⟦1|细胞⟧的方式，是蕈菌的二级⟦1|菌丝⟧尖端向前延伸的方式。（具有双核细胞的次生菌丝常以锁状联合的方式来增加细胞的个体。）"], [0, "（1）锁状联合过程"], [1, "①双核⟦1|菌丝⟧的顶端⟦1|细胞⟧开始分裂时，在其两个细胞核间的菌丝壁向外侧生出一喙状突起，并逐步伸长和向下弯曲；"], [1, "②两核之一进入突起中；"], [1, "③两核同时进行一次有丝分裂，结果产生⟦1|4个⟧子核；"], [1, "④在⟦1|4个⟧子核中，来自突起中的两核，其一仍留在突起中，另一则进入⟦1|菌丝⟧尖端；"], [1, "③在喙状突起的后部与⟦1|菌丝⟧⟦1|细胞⟧交界处形成一个横隔、接着在菌丝细胞的第二个核和第三个核之间也形成一个横隔，从而形成了一个双核细胞和两个单核细胞；"], [1, "③喙状突起⟦1|细胞⟧的前端与另一单核细胞接触，进而发生融合，接着喙状突起细胞内的细胞核进入其中，最终在⟦1|菌丝⟧上就增加了一个双核细胞。"], [0, "（2）锁状联合的⟦1|生理⟧意义保证每个⟦1|菌丝⟧⟦2|细胞⟧内都含有两个不同性别的核；"], [1, "② 为进行有性生殖，通过核配形成担⟦1|孢子⟧打下基础"]], 0],
[0, 3, 0, 1, "病毒（virus）", [[0, "是一类由⟦2|核酸⟧和⟦2|蛋白质⟧等少数几种成分组成的超显微“非⟦2|细胞⟧生物\"，其本质是一类含DNA或RNA的特殊遗传因子。与⟦1|质粒⟧等一般遗传因子不同的是，⟦1|病毒⟧是一类能以⟦1|感染⟧态和非感染态两种形式存在的病原体，它们既可通过感染宿主并借助其代谢系统大量复制自已，又可在离体条件下，以生物大分子状态长期保持其感染活性。"]], 0],
[0, 3, 0, 2, "病毒粒（virus particle）", [[0, "也称⟦1|病毒⟧颗粒或病毒粒子，专指成熟的、⟦2|结构⟧完整的和有⟦1|感染⟧性的单个病毒。病毒粒的基本成分是⟦2|核酸⟧和⟦2|蛋白质⟧。"]], 0],
[0, 3, 0, 3, "噬菌体（phage）", [[0, "是原核生物病毒的总称，一般多指⟦1|噬菌体⟧和噬⟦1|放线菌⟧体。因部分能引起宿主菌的裂解，故称为噬菌体。噬菌体必须在活菌内寄生，有严格的宿主特异性，其取决于噬菌体吸附器官和受体菌表面受体的分子⟦2|结构⟧和互补性。即原核生物的病毒，包括噬⟦2|细菌⟧体、噬放线菌体和噬⟦1|蓝细菌⟧体"]], 0],
[0, 3, 0, 4, "噬菌斑（plaque）", [[0, "将⟦1|噬菌体⟧稀释液接种于布满敏感⟦1|细菌⟧的平板上后，经一定时间⟦2|培养⟧，以每一母噬菌体粒子为中心而形成的一个圆形、透明和有一定特征的溶菌区域，称噬菌斑；可用于噬菌体的⟦2|鉴定⟧、分离和计数："]], 0],
[0, 3, 0, 5, "烈性噬菌体（virulent phage）", [[0, "是在短时间内能连续完成五阶段生活史（吸附、侵入、增殖、成熟和裂解），并通过宿主⟦1|细胞⟧裂解而实现其⟦2|繁殖⟧的⟦1|噬菌体⟧。"]], 0],
[0, 3, 0, 6, "温和噬菌体（temperatephage）", [[0, "是一类在通常情况下只引起宿主⟦1|细胞⟧溶源化而不引起裂解的⟦1|噬菌体⟧。侵人宿主后，其基因组通过与宿主基因组整合，并随后者的复制而进行同步复制。"]], 0],
[0, 3, 0, 7, "裂解性循环（lytic cycle）", [[0, "又称裂解性周期。指每一代烈性⟦1|噬菌体⟧所经历的⟦1|繁殖⟧过程。包括吸附、侵入、增殖、成熟和裂解五个阶段。"]], 0],
[0, 3, 0, 8, "溶源性循环（lysogeniccycle）", [[0, "指温和⟦1|噬菌体⟧的生活史。它们侵人宿主⟦1|细胞⟧后，可引起溶源化，即噬菌体基因组整合到宿主基因组上，并以前噬菌体状态与宿主长期并存、同步复制，只在自发或诱导条件下才转入增殖、成熟和裂解阶段，完成其全部生活史。"]], 0],
[0, 3, 0, 9, "效价（titre，titer）", [[0, "表示每毫升试样中所含有的具侵染性的⟦1|噬菌体⟧粒子数，又称噬菌斑形成单位数（plaque formingunit，pfu）或⟦1|感染⟧中心数。测定效价的方法很多，如液体稀释法、玻片快速测定法和单层平板法等，较常用且较精确的方法称为双层平板法。"]], 0],
[0, 3, 0, 10, "噬菌斑（plaque）", [[0, "在涂布有敏感宿主⟦2|细胞⟧的固体⟦1|培养基⟧表面，若接种上相应⟦1|噬菌体⟧的稀释液，其中每一噬菌体粒子由于先侵染和裂解一个细胞，然后以此为中心，再反复侵染和裂解周围大量的细胞，结果就会在菌苔上形成一个具有一定形状、大小、边缘和透明度的噬菌斑"]], 0],
[0, 3, 0, 11, "一步生长曲线（one stepgrowth curve）", [[0, "可定量描述烈性⟦1|噬菌体⟧⟦2|生长⟧规律的实验曲线，称作一步⟦1|生长曲线⟧或一级生长曲线。可反映每种噬菌体（或⟦1|病毒⟧）的⟦1|3个⟧最重要的特征参数：潜伏期和裂解期的长短以及裂解量的大小。"]], 0],
[0, 3, 0, 12, "隐蔽期（eclipsephase）", [[0, "指在潜伏期前期人为地（用氯仿等）裂解宿主⟦2|细胞⟧后，此裂解液仍无侵染性的一段时间，这时细胞内正处于⟦1|噬菌体⟧形成早期蛋白、复制噬菌体⟦2|核酸⟧和合成其⟦2|蛋白质⟧⟦1|衣壳⟧的阶段；"]], 0],
[0, 3, 0, 13, "成熟期（maturationphase）", [[0, "又称胞内累积期或潜伏后期，指在隐蔽期后，若人为地裂解⟦1|细胞⟧，其裂解液已呈现侵染性的一段时间，这意味着细胞内已开始装配⟦1|噬菌体⟧粒子，并可用电镜观察到。"]], 0],
[0, 3, 0, 14, "裂解期（crackingperiod）", [[0, "指紧接在潜伏期后的宿主⟦1|细胞⟧迅速裂解、溶液中⟦1|噬菌体⟧粒子急剧增多的一段时间。"]], 0],
[0, 3, 0, 15, "平稳期（plateauphase）", [[0, "指⟦1|感染⟧后的宿主⟦2|细胞⟧已全部裂解，溶液中⟦1|噬菌体⟧效价达到最高点的时期。在本时期中，每一宿主细胞所释放的平均噬菌体粒子数，即称裂解量。"]], 0],
[0, 3, 0, 16, "溶原性（lysogeny）", [[0, "温和⟦1|噬菌体⟧侵入相应宿主⟦1|细胞⟧后，由于前者的基因组整合到后者的基因组上，并随后者的复制而进行同步复制，因此，这种温和噬菌体的侵入并不引起宿主细胞裂解，称溶原性或溶原现象。"]], 0],
[0, 3, 0, 17, "亚病毒因子（subviralagent）", [[0, "是一类在构造、成分和功能上不符合典型⟦1|病毒⟧定义的分子病原体，一是只含⟦1|核酸⟧或⟦2|蛋白质⟧一种成分，如只含RNA的类病毒和拟病毒，以及只含蛋白质的朊病毒；另一是虽同时含有核酸和蛋白质两种成分，因其功能不全而成为缺陷病毒，如卫星病毒和卫星RNA等。"]], 0],
[0, 3, 0, 18, "朊病毒（prion）", [[0, "是一类不含⟦1|核酸⟧的传染性⟦2|蛋白质⟧分子，因能引起宿主体内现有的同类蛋白质分子发生与其相似的⟦1|感染⟧性构象变化，从而可使宿主⟦2|致病⟧。可引起羊瘙痒病，牛海绵状脑病，以及人的克-雅氏病、库鲁病和GS综合征等。"]], 0],
[0, 3, 1, 1, "什么叫烈性噬菌体？简述其裂解性生活史。", [[0, "t答：（1）烈性⟦1|噬菌体⟧定义：指能在短时间内亮晟啵懈、覆失19霜、殷癌和裂解个阶段，而实现其⟦2|繁殖⟧的噬菌体。其⟦2|生长⟧规律曲线是一步⟦1|生长曲线⟧，包括潜伏期、“裂解期、平稳期。"], [0, "（2）烈性⟦1|噬菌体⟧的裂解生活史大致为："], [1, "①吸附⟦1|噬菌体⟧以尾丝尖端与敏感的宿主⟦1|细胞⟧接触，在宿主细胞的特异性受体上结合，触发颈须把卷紧的尾丝散开，附着在受体上，从而把刺突、基板固着于细胞表面。"], [1, "②侵入T偶数噬菌体通过注射方式将其DNA注入宿主⟦2|细胞⟧中。T4噬菌体完成吸附后，尾丝收缩，尾鞘中的衣壳粒发生移位，尾鞘收缩，尾管插入到⟦1|细胞壁⟧和膜中；尾管携带的溶菌酶溶解细胞壁中的⟦1|肽聚糖⟧；头部⟦2|核酸⟧通过尾管注入到细胞中，衣壳则留在胞外。"], [0, "增殖⟦1|噬菌体⟧核酸的复制和⟦2|蛋白质⟧的生物合成。噬菌体核酸进入宿主⟦2|细胞⟧后，操纵宿主细胞的代谢机能，大量复制噬菌体核酸，并合成⟦1|病毒⟧所需要的蛋白质。一般分为早期蛋白质（主要是病毒复制所需要的酶及抑制细胞代谢的调节蛋白质）台成；中期进行核酸复制；晚期蛋白质（噬菌体外壳的结构蛋白质，如头部蛋白质、尾部蛋白质等）合成。"], [1, "④成熟⟦1|噬菌体⟧的⟦1|核酸⟧、⟦2|蛋白质⟧分别合成后即装配成成熟的、有侵染力的噬菌体粒子。"], [1, "③裂解当宿主⟦2|细胞⟧中噬菌体粒子成熟后，能诱导脂肪⟦2|酶⟧水解⟦1|细胞膜⟧，溶菌酶水解⟦1|细胞壁⟧，促进细胞的裂解，释放出子代噬菌体。"]], 0],
[0, 3, 1, 2, "什么是效价？测定噬菌体效价的方法有几种？最常用的是什么方法，其优点如何？", [[0, "（1）效价的定义：表示每毫升试样中所含有的具侵染性的⟦1|噬菌体⟧粒子数，又称噬菌斑形成单位数（plaqueformingunit，pfu）或⟦1|感染⟧中心数。"], [0, "（2）效价的测定方法主要包括：斑点试验法、液体稀释管法、双层平板法、单层平板法和玻片快速法。"], [0, "（3）效价测定最常用的方法及优点A.双层平板法主要操作步骤为：预先分别配制含⟦1|2%⟧和1%琼脂的底层⟦1|培养基⟧和上层⟦2|培养⟧基。"], [1, "② 先用底层⟦1|培养基⟧在⟦2|培养⟧血上浇一层平板，待凝固后，再把预先融化并冷却到45度以下、加有较浓的敏感宿主和一定体积待测⟦1|噬菌体⟧样品的上层培养基，在试管中摇匀后，立即倒在底层培养基上铺平待凝；然后在37度下保温，一般经10余小时后即可对噬菌斑计数。B.双层平板法的优点："], [1, "①加了底层⟦1|培养基⟧后，可弥补⟦1|培养⟧基底部不平的缺陷；"], [1, "②可使所有的噬菌斑都位于近乎同一平面上，因而大小一致、边缘清晰且无重叠现象；"], [1, "③因上层⟦1|培养基⟧中琼脂较稀，故可形成⟦1|形态⟧较大、特征较明显以及便于观察和计数的噬菌斑。"]], 0],
[0, 3, 1, 3, "简述用双层琼脂平板法测定噬菌体效价的基本原理和主要操作步骤。", [[0, "（1）基本原理⟦2|培养⟧血底部并非十分平整，注入少量⟦1|培养基⟧铺平底部，作为下层；上层为⟦1|噬菌体⟧和⟦2|细菌⟧混合物的培养基注入，铺平，这样使得观察物在同一平面，更利于噬菌斑的观察及分离纯化。"], [0, "（2）主要操作步骤预先分别配制含⟦1|2%⟧和1%琼脂的底层⟦1|培养基⟧和上层⟦2|培养⟧基。先用底层培养基在培养皿上浇一层平板，待凝固后，再把预先融化并冷却到45度以下、加有较浓的敏感宿主和一定体积待测⟦1|噬菌体⟧样品的上层培养基，在试管中摇匀后，立即倒在底层培养基上铺平待凝；然后在37度下保温，一般经10余小时后即可对噬菌斑计数。"]], 0],
[0, 3, 1, 4, "什么是一步生长曲线它可分几期？各期有何特点？", [[0, "（1）一步⟦1|生长曲线⟧定义可定量描述烈性⟦1|噬菌体⟧⟦2|生长⟧规律的实验曲线，称作一步生长曲线或一级生长曲线。可反映每种噬菌体（或病毒）的⟦1|3个⟧最重要的特征参数：潜伏期和裂解期的长短以及裂解量的大小。"], [0, "（2）一步⟦1|生长曲线⟧的时期一步⟦1|生长⟧曲线可分为三个时期：潜伏期、裂解期、平稳期。"], [0, "（3）一步⟦1|生长曲线⟧各期的特点如下：第一，潜伏期：指⟦1|噬菌体⟧的⟦2|核酸⟧侵入宿主⟦2|细胞⟧后至第一个成熟噬菌体粒子释放前的一段时间。它又可分为两段："], [1, "①隐晦期：指在潜伏期前期人为地（用氯仿等）裂解宿主⟦2|细胞⟧后，此裂解液仍无侵染性的一段时间，这时细胞内正处于⟦1|噬菌体⟧形成早期蛋白、复制噬菌体核酸和合成其⟦2|蛋白质⟧⟦1|衣壳⟧的阶段；"], [1, "②成熟期：又称胞内累积期或潜伏后期，指在隐晦期后，若人为地裂解⟦2|细胞⟧，其裂解液已呈现侵染性的一段时间，这意味着细胞内已开始装配⟦1|噬菌体⟧粒子，并可用电镜观察到。第二，裂解期指紧接在潜伏期后的宿主细胞迅速裂解、溶液中噬菌体粒子急剧增多的一段时间。第三，平稳期指⟦1|感染⟧后的宿主细胞已全部裂解，溶液中噬菌体效价达到最高点的时期。在本时期中，每一宿主细胞所释放的平均噬菌体粒子数，即称裂解量。"], [0, "【补充：一步⟦1|生长曲线⟧的基本实验步骤】用⟦1|噬菌体⟧的稀释液去感染高浓度的宿主⟦2|细胞⟧，以保证每个细胞所吸附的噬菌体至多只有一个；"], [1, "② 经数分钟吸附后，在混合液中加入适量的相应抗血清，以中和尚未吸附的⟦1|噬菌体⟧；然后用保温的⟦1|培养⟧液稀释此混合液，以终止抗血清的作用，随即置于适宜的⟦2|温度⟧下培养；"], [1, "④ 其间每隔数分钟取样，连续测定其效价，再把结果绘制成图即可。"]], 0],
[0, 3, 1, 5, "何为溶原性及如何检测溶原菌。", [[0, "（1）溶原性的定义：温和⟦1|噬菌体⟧侵入相应宿主⟦1|细胞⟧后，由于前者的基因组整合到后者的基因组上，并随后者的复制而进行同步复制，因此，这种温和噬菌体的侵入并不引起宿主细胞裂解，称溶原性或溶原现象。"], [0, "（2）检验某菌株是否为溶原菌的方法将少量溶原菌与大量的敏感性指示菌（遇溶原菌裂解后所释放的温和⟦1|噬菌体⟧会发生裂解循环者）相混合，然后与琼脂⟦1|培养基⟧混匀后倒一个平板，经⟦2|培养⟧后溶原菌就一长成菌落。由于溶原菌在⟦2|细胞⟧分裂过程中有极少数个体会引起自发裂解，其释放的噬菌体可不断侵染溶原菌菌落周围的指示菌菌苔，于是就形成了一个个中央有溶原菌的小菌落，四周有透明圈围着的这种独特噬菌斑。"]], 0],
[0, 3, 1, 6, "何谓溶源转变？它与转导现象有何异同点？", [[0, "（1）溶源转变的定义：溶源转变是指当温和⟦1|噬菌体⟧感染其宿主而使之发生溶源化时，因噬菌体的基因整合到宿主的基因组上，而使后者获得了除⟦1|免疫⟧性以外的新性状的现象。当宿主丧失这一噬菌体时，通过溶源转变而获得的性状也同时消失。"], [0, "（2）溶源转变与⟦1|转导⟧现象的异同点如下："], [1, "①相同点都是由⟦1|噬菌体⟧将目的基因整合到宿主基因组上。"], [1, "②不同点溶源转变和⟦1|转导⟧有本质上的不同a.溶源转变的温和⟦1|噬菌体⟧不携带任何供体菌的基因；b．进行溶源转变的噬菌体是完整的，而不是缺陷的；c．新性状的产生由噬菌体的基因决定，并可以随噬菌体的消失而同时消失；d.溶源转变只能用温和噬菌体，转导可以用温和噬菌体和烈性噬菌体。"]], 0],
[0, 3, 1, 7, "病毒在基因工程中有何应用？试对其在动物、植物、微生物育种中的作用各举一例，并加以简单的说明。", [[0, "在基因工程操作中，把外源目的基因导入受体⟦2|细胞⟧并使之表达的中介体，称为载体。除原核生物的⟦1|质粒⟧外，⟦1|病毒⟧是最好的载体。"], [0, "（1）⟦1|噬菌体⟧作为原核生物基因工程的载体E.coli的入噬菌体基因组中，约有一半“非必要基因\"可被外源基因取代而建成良好的基因工程载体。如凯隆载体和科斯⟦1|质粒⟧。"], [0, "（2）动物DNA⟦1|病毒⟧作为动物基因工程的载体动物病毒可作为基因工程载体的很多，主要为SV40，其次为人的腺病区。毒、牛乳头瘤病毒、痘苗病毒以及RNA病毒等。"], [0, "（3）植物DNA⟦1|病毒⟧作为植物基因工程的载体花椰菜花叶病毒是一种由昆虫传播的侵染十字花科植物的病毒，含8kb的环状dsDNA，存在多种限制性内切⟦1|酶⟧的切点。"], [0, "（4）昆虫DNA⟦1|病毒⟧作为真核生物基因工程的载体杆状病毒可作为外源基因载体，具有不侵染脊椎动物，对人畜十分安全；它带有强启动子，可使此基因表达产物含量高。可作为重组病毒的选择性标记等优点。"]], 0],
[0, 4, 0, 1, "单纯扩散（simplediffusion）", [[0, "指疏水性双分子层⟦1|细胞膜⟧（包括孔蛋白在内）在无载体蛋白参与下，单纯依靠物理扩散方式让许多小分子、非电离分子尤其是亲水性分子被动通过的一种物质运送方式。主要是O2、CO2、乙醇、甘油和某些氨基酸分子。"]], 0],
[0, 4, 0, 2, "促进扩散（facilitateddiffusion）", [[0, "指溶质在运送过程中，必须借助存在于⟦1|细胞膜⟧上的底物特异载体蛋白的协助，但不消耗⟦1|能量⟧的一类扩散性运送方式。"]], 0],
[0, 4, 0, 3, "主动转运（activetransport）", [[0, "指一类须提供⟦1|能量⟧并通过⟦1|细胞膜⟧上开特异性载体蛋白构象的变化，而使膜外环境中低浓度的溶质运入膜内的一种运送方式。主要包括有无机离子、有机离子（某些氨基酸、有机酸等转运。"]], 0],
[0, 4, 0, 4, "基团转位（grouptranslocation）", [[0, "指一类既需特异性载体蛋白的参与，又耗能的一种物质运送方式，其特点是溶质在运送前后会发生分子⟦1|结构⟧的变化。基团转位广泛存在于原核生物中，尤其是一些兼性⟦1|厌氧⟧菌和专性厌氧菌，主要用于运送各种糖类、核苷酸、丁酸和腺嘌呤等物质。"]], 0],
[0, 4, 0, 5, "培养基（medium）", [[0, "是指由人工配制的、含有六大⟦1|营养⟧要素、适合⟦2|微生物⟧生长繁殖或产生⟦2|代谢⟧产物用的混合营养料。"]], 0],
[0, 4, 0, 6, "选择性培养基（selective medium）", [[0, "是指根据某种⟦1|微生物⟧的特殊⟦2|营养⟧要求或其对某化学、物理因素的抗性而设计的⟦1|培养基⟧，其功能是使混合菌样中的劣势菌变成优势菌，从而提高该菌的筛选效率。可分为加富性选择⟦2|培养⟧基和抑制性选择培养基。"]], 0],
[0, 4, 0, 7, "EMB培养基（EMBmedium）", [[0, "即伊红-美蓝乳糖⟦1|培养基⟧。一种鉴别大肠菌群尤其是大肠杆菌的鉴别性⟦2|培养⟧基。因大肠杆菌能强烈⟦1|发酵⟧乳糖产酸，故它可在EMB平板上与伊红美蓝结合，产生具绿色金属闪光的⟦1|菌落⟧。EMB在饮水检验和⟦2|遗传⟧学研究中十分重要。"]], 0],
[0, 4, 1, 1, "简述营养物质进入细胞的方式及其特点。", [[0, "⟦1|细胞膜⟧运送⟦2|营养⟧物质有⟦1|4种⟧方式，即单纯扩散、促进扩散、主动转运和基团转位。"], [0, "（1）单纯扩散指疏水性双分子层⟦1|细胞膜⟧（包括孔蛋白在内）在无载体蛋白参与下，单纯依靠物理扩散方式让许多小分子、非电离分子尤其是亲水性分子被动通过的一种物质运送方式。主要是O2、CO2、乙醇、甘油和某些氨基酸分子。其特点如下："], [1, "①驱动力为浓度梯度，不消耗⟦1|能量⟧；"], [1, "②物质不发生任何反应；"], [1, "③不能逆浓度梯度运输；运输速率与膜内外物质的浓度差成正比；"], [1, "③非特异性，但是膜上小孔的大小和形状有一定选择性"], [0, "（2）促进扩散是指溶质在运送过程中，必须借助存在于⟦1|细胞膜⟧上的底物特异载体蛋白的协助，但不消耗⟦1|能量⟧的一类扩散性运送方式。其特点如下："], [1, "①驱动力为浓度梯度，不消耗⟦1|能量⟧；"], [1, "②物质分子⟦1|结构⟧不发生变化；"], [1, "③不能进行逆浓度运输；"], [1, "④运输速率与膜内外物质的浓度差成正比；）需载体蛋白参与，每种载体只运输相应物质，具有较高专一性。"], [0, "（3）主动运送指一类须提供⟦1|能量⟧并通过⟦1|细胞膜⟧上开特异性载体蛋白构象的变化，而使膜外环境中低浓度的溶质运入膜内的一种运送方式。主要包括有无机离子、有机离子（某些氨基酸、有机酸等转运其特点如下："], [1, "①物质运输过程中需消耗⟦1|能量⟧；"], [1, "②物质本身的分子⟦1|结构⟧不变化；"], [1, "③可逆浓度梯度运输；"], [1, "④需载体蛋白参与。"], [0, "（4）基团转位指一类既需特异性载体蛋白的参与，又耗能的一种物质运送方式，其特点是溶质在运送前后会发生分子⟦1|结构⟧的变化。基团转位广泛存在于原核生物中，尤其是一些兼性⟦1|厌氧⟧菌和专性厌氧菌，主要用于运送各种糖类、核苷酸、丁酸和腺嘌呤等物质。其特点如下："], [1, "①运输过程中需消耗⟦1|能量⟧；②物质本身的分子⟦2|结构⟧发生变化；"], [1, "③可逆浓度梯度运输：需载体蛋白参与；"], [1, "③主要存在⟦1|厌氧⟧⟦1|微生物⟧中。"]], 0],
[0, 4, 1, 2, "种运送营养物质方式的比较", [[0, "特殊载体蛋白：单纯扩散 无；促进扩散 有"], [0, "运送速度：单纯扩散 慢；促进扩散 快"], [0, "常见运送方向：单纯扩散 由浓至稀；促进扩散 由稀至浓"], [0, "平衡时内外浓度：单纯扩散 内外相等；促进扩散 内外浓度差很多"], [0, "运送分子：单纯扩散 无特异性；促进扩散 特异性"], [0, "⟦1|能量⟧消耗：单纯扩散 不需要；促进扩散 需要"], [0, "运送前后溶质分子：单纯扩散 不变；促进扩散 改变"], [0, "载体饱和效应：单纯扩散 无；促进扩散 有"], [0, "与溶质类似物运输：单纯扩散 无竞争性；促进扩散 有竞争性"], [0, "运送对象举例：单纯扩散 H₂O、CO₂、O₂ 等小分子；部⟦1|分离⟧子可经膜孔通过；促进扩散 甘油、氨基酸、乳糖等；主动转运 葡萄糖、氨基酸、无机离子等；基团转位 葡萄糖、果糖、甘露糖、核苷及其衍生物等"]], 0],
[0, 4, 1, 3, "简述基团转位的定义，并举例说明。", [[0, "（1）定义基团转位指一类既需特异性载体蛋白的参与，又耗能的一种物质运送方式，其特点是溶质在运送前后会发生分子⟦1|结构⟧的变化。基团转位广泛存在于原核生物中，尤其是一些兼性⟦1|厌氧⟧菌和专性厌氧菌，主要用于运送各种糖类、核苷酸、丁酸和腺嘌呤等物质。"], [0, "（2）典型例子在E.coli中主要靠磷酸转移酶系统（PTS）即磷酸烯醇丙酮酸-已糖磷酸转移酶系统进行。其特点是自外界环境每输入一个葡萄糖分子，就要消耗⟦1|1分子⟧⟦2|ATP⟧的能量。具体运送分两步进行：1）热稳载体蛋自（heat-stablecarrierprotein，HPr）的激活：⟦2|细胞⟧内高能化合物一磷酸烯醇丙酮酸（PEP）的磷酸基团通过酶I的作用而把HPr激活。PEPHPr Pyr（内酸）+pHPHPr是一种低分子量的可溶性蛋白，结合在⟦1|细胞膜⟧上，起着高能磷酸载体的作用。酶I是一种可溶性细胞质蛋白。HPr和酶I在磷酸转移酶系统中，均无底物特异性。2）糖经磷酸化而运入细胞膜内：膜外环境中的糖分子先与细胞膜外表面上的底物特异膜蛋白一酶II结合，接着糖分子被由P~HPr→酶IⅡa一→酶IⅡI逐级传递来的磷酸基团激活，最后通过酶I。再把这一磷酸糖释放到细胞质中。"]], 0],
[0, 4, 1, 4, "简要说明微生物的六大营养要素。", [[0, "⟦1|微生物⟧利用的六大类⟦2|营养⟧要素分别为碳源、氮源、能源、生长因子、无机盐和水。"], [0, "①碳源提供⟦1|微生物⟧⟦2|营养⟧所需碳元素，对⟦1|异养⟧微生物而言碳源同时也是能源；"], [0, "②氮源提供⟦1|微生物⟧⟦2|营养⟧所需氮元素："], [0, "③⟦1|能量⟧为⟦2|微生物⟧的生命获得提供最初能量来源"], [0, "④生长因子对⟦1|微生物⟧正常⟦2|代谢⟧必不可少，且不能从简单的碳、氮源自行合成；（生长因子是指一类对微生物正常代谢必不可少且无法自行合成的微量有机物，主要包括：氨基酸、嘌呤和嘧啶及其衍生物、维生素、胺类和脂肪酸）"], [0, "③无机盐的主要功能包括构成菌体成分，⟦1|酶⟧活性基组成或维持酶活性，调节渗透压、pH，化能⟦1|自养⟧⟦2|微生物⟧能源等："], [0, "③水可以作为⟦1|微生物⟧的组成成分、反应介质、物质运输媒体和热的良导体，是良好的溶剂，且生化反应在水中进行。"]], 0],
[0, 4, 1, 5, "简述微生物的营养类型。", [[0, "⟦1|营养⟧类型是指根据⟦2|微生物⟧生长所需要的主要营养要素即能源和碳源的不同，按它们对能源、氢供体和基本碳源的需要来区分的⟦1|4种⟧类型。"], [0, "（1）光能⟦1|自养⟧型"], [1, "①能以CO2为唯一或主要⟦1|碳源⟧；"], [1, "②进行⟦1|光合⟧作用获取⟦1|生长⟧所需要的⟦2|能量⟧；"], [1, "③以无机物作为供氢体或⟦1|电子⟧供体，使CO2还原为⟦2|细胞⟧物质。"], [0, "（2）光能⟦1|异养⟧型"], [1, "①不能以CO2为主要或唯一的⟦1|碳源⟧："], [1, "②以有机物作为⟦1|碳源⟧和供氢体，营⟦1|光合⟧⟦2|生长⟧。"], [0, "（3）化能⟦1|自养⟧型"], [1, "①⟦1|生长⟧所需要⟦2|能量⟧来自无机物氧化过程中释放的化学能；"], [1, "②以CO2或碳酸盐作为唯一或主要⟦1|碳源⟧进行⟦2|生长⟧；"], [1, "③利用无机物作为⟦1|电子⟧供体使CO2还原成⟦2|细胞⟧物质。"], [0, "（4）化能⟦1|异养⟧型"], [1, "①⟦1|生长⟧所需要的⟦2|能量⟧均来自有机物氧化过程中放出的化学能；"], [1, "②⟦1|碳源⟧主要是一些有机化合物；"], [1, "③有机物通常既是碳源也是能源，还是氢供体注意：不同⟦2|营养⟧类型之间的界限并非绝对。⟦1|异养⟧型⟦2|微生物⟧并非绝对不能利用CO2；⟦1|自养⟧型微生物也并非不能利用有机物进行生长；在不同生长条件下生长时，有些微生物营养类型会发生改变。微生物营养类型的可变性有利于提高其对环境条件变化的适应能力。"]], 0],
[0, 4, 1, 6, "何为营养缺陷型？应如何得到×菌的某种营养缺陷型（例如his²）菌株？简述并分析应采用的实验步骤和原理。", [[0, "（1）⟦2|营养⟧缺陷型营养缺陷型是指一种缺乏合成其生存所必需的营养物的⟦1|突变⟧型，只有从周围环境或⟦1|培养基⟧中获得这些营养或其前体物才能⟦2|生长⟧。营养缺陷型的筛选过程：一般要经过诱变、淘汰野生型、检出和鉴定营养缺陷型四个环节"], [0, "（2）得到X菌的his⟦1|菌株⟧的方法"], [1, "①实验方法选择影印平板法进行分离，因为⟦2|营养⟧缺陷型⟦1|突变⟧型在选择⟦1|培养基⟧（或基本培养基）上不⟦2|生长⟧，所以是一种负选择标记，故采用影印平板法进行分离最为合适。"], [1, "②实验原理由于⟦2|营养⟧缺陷型⟦1|突变⟧型在选择⟦1|培养基⟧（或基本培养基）上不⟦2|生长⟧，所以是一种负选择标记，故采用影印平板法进行分离。"], [1, "③实验步骤第一、将待分离突变株的原始菌株以合适的稀释度涂布到野生型菌株和突变株均能⟦2|生长⟧的主平板（含完全⟦1|培养基⟧）上，经培养后形成单⟦1|菌落⟧。第二、通过一消毒的\"印章”（直径略小于培养皿底，表面包有丝绒布，使其尽量平整）将（a）平板的菌落分别原位转移（或印迹）到（c）平板[含有与（a）平板相同的⟦2|营养⟧成分]和（d）平板（不含缺陷型所需的营养因子，即基本培养基）。第三、经培养后对照观察（c）和（d）平板上形成的单菌落，如果在（c）平板上长而在（d）平板上不长的，则为所需分离的突变型。第四、在（c）平板上挑取（d）平板上不长的相应位置的单菌落，并进一步在完全培养基上划线分离纯化。"]], 0],
[0, 5, 0, 1, "生物氧化（biologicaloxidation）", [[0, "是指发生在活⟦1|细胞⟧内的一系列产能性氧化反应的总称。生物氧化与有机物的燃烧都是通过底物的氧化反应而释放其中的化学潜能，但两者不同。生物氧化形式为某物质与氧结合、脱⟦2|氢⟧和失去⟦2|电子⟧。"]], 0],
[0, 5, 0, 2, "EMP途径（Embden-Meyerhof-Parnas pathway）", [[0, "又称糖酵解途径（glycolysis）是绝大多数生物所共有的一条主流⟦2|代谢⟧途径。它以⟦1|1分子⟧葡萄糖为底物，约经⟦1|10步⟧反应而产生2分子丙酮酸、2分子NADH+H+和2分子⟦2|ATP⟧的过程。可概括为两个阶段（耗能和产能）、3种产物和10个反应。"]], 0],
[0, 5, 0, 3, "HMP途径（hexose monophosphate pathway）", [[0, "又称戊糖磷酸途径或磷酸葡萄糖酸途径，是指葡萄糖不经EMP途径和TCA循环而得到彻底氧化，并能产生大量NADPH+H*形式的还原力以及多种重要中间⟦1|代谢⟧产物的途径。"]], 0],
[0, 5, 0, 4, "ED途径（Entner-Doudoroff pathway）", [[0, "ED途径又称KDPG途径，它是存在于某些缺乏完整EMP途径⟦1|微生物⟧中的一条EMP替代途径。特点是底物葡萄糖仅经四步反应即可快速获得由EMP途径须经十步反应才能形成的丙酮酸。本途径中KDPG醛缩酶是关键酶。每一葡萄糖分子的⟦2|代谢⟧产物为2丙酮酸、1NADH2、1NADPH2和1⟦2|ATP⟧。"]], 0],
[0, 5, 0, 5, "TCA循环（TCA cycle）", [[0, "又称Krebs循环或柠檬酸循环，是指由丙酮酸经过一系列环节作循环式反应而被彻底氧化、脱羧，形成CO2、H:O和NADH2的过程。这是一个广泛存在于各种生物体中的重要反应。柠檬酸是葡萄糖经TCA循环而形成的最有代表性的⟦1|代谢⟧产物。"]], 0],
[0, 5, 0, 6, "有氧呼吸（aerobic respiration）", [[0, "底物按常规方式脱⟦1|氢⟧后，脱下的氢经完整⟦1|呼吸链⟧传递，最终被外源分子氧接受，产生了水并释放出⟦2|ATP⟧开式的⟦2|能量⟧。这是一种递氢和受氢都须在有氧条件下完成的生物氧化作用，是一种高效产能方式。"]], 0],
[0, 5, 0, 7, "呼吸链（respiratorychain）", [[0, "是指位于原核生物⟦1|细胞膜⟧上或真核生物线粒体膜上的、由一系列氧化还原势呈梯度差的、链状排列的一组（或⟦1|电子⟧）传递体。"]], 0],
[0, 5, 0, 8, "氧化磷酸化（oxidativephosphorylation）", [[0, "又称⟦1|电子⟧传递链磷酸化，是指⟦1|呼吸链⟧的递⟦2|氢⟧（或电子）和受氢过程与磷酸化反应相偶联并产生⟦2|ATP⟧的作用。"]], 0],
[0, 5, 0, 9, "化学渗透学说（chemiosmotic theory）", [[0, "在⟦1|氧化磷酸化⟧过程中，通过⟦1|呼吸链⟧有关⟦2|酶⟧系的作用，可将底物分子上的质子从膜的内侧传递到膜的外侧，从而造成了膜两侧质子分布不均衡，此即质子动势的由来，也是合成⟦2|ATP⟧的⟦2|能量⟧来源。通过ATP合酶的逆反应，把质子从膜的外侧重新输回到膜的内侧，于是在消除质子动势的同时合成了ATP。"]], 0],
[0, 5, 0, 10, "ATP合酶（ATP synthase）", [[0, "是由嵌埋在原核生物⟦1|细胞膜⟧上或真核生物线粒体内膜上的基部Fo和伸展在膜外的头部FI所组成。"]], 0],
[0, 5, 0, 11, "无氧呼吸（anaerobic respiration）", [[0, "又称⟦1|厌氧⟧呼吸，是指一类⟦1|呼吸链⟧末端的⟦2|氢⟧受体为外源无机氧化物（少数为有机氧化物）的生物氧化。这是一类在无氧条件下进行的、产能效率低的特殊呼吸。"]], 0],
[0, 5, 0, 12, "硝酸盐呼吸（nitraterespiration）", [[0, "又称反硝化作用（denitrification）"], [0, "在无氧条件下，某些兼性⟦1|厌氧⟧⟦2|微生物⟧利用硝酸盐作为⟦1|呼吸链⟧的最终⟦2|氢⟧受体，把它还原成亚硝酸、NO、N2O直至N2的过程，称为异化性硝酸盐还原作用，又称硝酸盐呼吸或反硝化作用。能进行硝酸盐呼吸的都是一些兼性厌氧微生物，如反硝化⟦2|细菌⟧。"]], 0],
[0, 5, 0, 13, "发酵（fermentation）", [[0, "是指在无氧等外源⟦2|氢⟧受体的条件下，底物脱氢后所产生的还原力[H]未经⟦1|呼吸链⟧传递而直接交给某一内源性中间⟦2|代谢⟧物接受，以实现⟦1|底物水平磷酸化⟧产能的一类生物氧化反应。"]], 0],
[0, 5, 0, 14, "Stickland反应", [[0, "是指以一种氨基酸作底物脱⟦1|氢⟧（氢供体），而以另一种氨基酸作氢受体而实现生物氧化产能的独特⟦1|发酵⟧类型，如生孢梭菌可利用一些氨基酸兼作⟦2|碳源⟧、⟦2|氮源⟧和能源。"]], 0],
[0, 5, 0, 15, "生物固氮（biologicalnitrogenfixation）", [[0, "生物⟦1|固氮⟧是指大气中的分子氮通过⟦1|微生物⟧固氮⟦2|酶⟧的催化而还原成氨的过程。"]], 0],
[0, 5, 0, 16, "固氮醉（nitrogenase）", [[0, "一种复合蛋白、由固二氮酶和固二氮酶还原酶组成。其中固二氮酶是一种含有钼和铁的蛋白，它是还原N的活性中心；固二氮酶还原酶是一种只含铁的蛋白。对氧气高度敏感测胞研患合为的方大重为之缺腺法、17、次生⟦1|代谢⟧物（secondarymetabolite）是指某些⟦2|微生物⟧⟦2|生长⟧到稳定期前后，以结构简单、代谢途径明确、产量较大的初生代谢物作为前体，通过受杂的次生代谢途径所合成的各种结构更求的化学物性生老石"]], 0],
[0, 5, 1, 1, "在化能异养微生物的生物氧化过程中，其基质脱氢和产能途径主要有哪几条？试列表比较各途径的主要特点。", [[0, "底物脱⟦1|氢⟧的途径有⟦1|4种⟧：EMP途径、HMP途径、ED途径、TCA循环。"], [0, "底物：EMP 途径 ⟦1|1 分子⟧葡萄糖；HMP 途径 6 分子葡萄糖；ED 途径 1 分子葡萄糖；TCA 途径 2 分子丙酮酸"], [0, "产物：EMP 途径 2 NADH、2 ⟦1|ATP⟧、2 丙酮酸；HMP 途径 12 NADPH₂、5 G-6-P、6 CO₂；ED 途径 1 NADH、1 NADPH₂、1 ATP、2 丙酮酸；TCA 途径 4 NADH₂、1 FADH₂、1 GTP、3 CO₂"], [0, "反应阶段：EMP 途径 耗能阶段、产酸阶段；HMP 途径 氧化阶段、基团转换和重新合成阶段；ED 途径 产 KDPG 阶段、KDPG 产丙酮酸阶段；TCA 途径 柠檬酸（6C）合成阶段、α-酮戊二酸（5C）形成阶段、4C 二羧酸形成阶段"], [0, "反应步骤：EMP 途径 ⟦1|10 步⟧；HMP 途径 12 步；ED 途径 4 步；TCA 途径 10 步"], [0, "特点：EMP 途径 醛缩⟦1|酶⟧为关键酶；在⟦1|厌氧⟧条件下进行，产能效率较低；HMP 途径 转酮酶和转醛酶为关键酶；只产 NADPH₂，可在有氧条件下进行；ED 途径 KDPG 醛缩酶是关键酶；产能效率较低；TCA 途径 产还原力效率高；在有氧条件下进行，是分解⟦2|代谢⟧和合成代谢的枢纽"], [0, "生理功能：EMP 途径 供应还原力，连接各⟦1|代谢⟧途径；提供生物合成中间代谢物，逆向可合成多糖并产生多种⟦1|发酵⟧产物；HMP 途径 供应还原力和合成用中间代谢物，扩大碳源利用途径，提供固定 CO₂ 的底物，产生多种发酵产品；ED 途径 代替 EMP 途径，可与 EMP、HMP 和 TCA 连接，可进行⟦2|细菌⟧酒精发酵以生产酒精；TCA 途径 同时产生两类还原力，是分解和合成代谢的枢纽，可合成多种重要中间代谢物并产生多种发酵产品"]], 0],
[0, 5, 1, 2, "简述EMP途径的生理意义。", [[0, "EMP途径又称糖酵解途径（glycolysis）是绝大多数生物所共有的一条主流⟦1|代谢⟧途径。它以⟦1|1分子⟧葡萄糖为底物，约经10步反应而产生2分子丙酮酸、2分子NADH+H+和2分子⟦2|ATP⟧的过程。可概括为两个阶段（耗能和产能）、3种产物和10个反应。生理意义："], [0, "①EMP途径是多种⟦1|微生物⟧所具有的⟦2|代谢⟧途径，其产能效率虽低，生理功能极其重要："], [0, "②供应⟦1|ATP⟧形式的⟦2|能量⟧和NADH2形式的还原力；"], [0, "③是连接其他几个重要⟦1|代谢⟧途径的桥梁，包括三羧酸循环（TCA）、HMP途径和ED途径等；"], [0, "④为生物合成提供多种中间⟦1|代谢⟧物；"], [0, "③通过逆向反应可进行多糖合成。"]], 0],
[0, 5, 1, 3, "简述HMP途径的生理意义。", [[0, "HMP途径又称戊糖磷酸途径或磷酸葡萄糖酸途径，是指葡萄糖不经EMP途径和TCA循环而得到彻底氧化，并能产生大量NADPH十H*形式的还原力以及多种重要中间⟦1|代谢⟧产物的途径。⟦2|生理⟧意义如下；"], [0, "①供应合成原料为⟦1|核酸⟧、核苷酸、NAD（P）、FAD（FMN）和CoA等的生物合成提供戊糖磷酸；而且HMP途径中的4磷酸赤藓糖是合成芳香族、杂环族氨基酸的原料。"], [0, "②产还原力产生大量NADPH2形式的还原力，可供脂肪酸、固醇等生物合成之需，可供通过⟦1|呼吸链⟧产星大量⟦1|能量⟧之需"], [0, "③作为固定CO2的中介HMP途径是光能⟦1|自养⟧⟦1|微生物⟧和化能自养微生物固定CO2的重要中介，即HMIR途径中的5一磷酸核酮糖在磷酸核酮糖激⟦2|酶⟧的催化下先形成1，5—二磷酸核酮糖，然后在羧化酶的催化下固定CO2。"], [0, "④扩大碳源利用范围HMP途径为⟦1|微生物⟧利用C3—Cr多种碳源提供了必要的⟦2|代谢⟧途径"], [0, "③连接EMP途径通过与EMP途径的连接（在1，6一二磷酸果糖和3一磷酸甘油醛处），可为生物合成提供更多的戊糖。"]], 0],
[0, 5, 1, 4, "简述TCA循环的定义和特点。", [[0, "（1）TCA循环又称Krebs循环或柠檬酸循环，是指由丙酮酸经过一系列环节作循环式反应而被彻底氧化、脱羧，形成CO2、H2O和NADH2的过程。这是一个广泛存在于各种生物体中的重要反应。柠檬酸是葡萄糖经TCA循环而形成的最有代表性的⟦1|代谢⟧产物。"], [0, "（2）TCA循环的特点"], [1, "①氧虽不直接参与其中反应，但TCA循环必须在有氧条件下运转："], [1, "②每分子丙酮酸可产⟦1|4分子⟧NADH+H*，1分子FADH2和1分子GTP，共相当于10分子⟦1|ATP⟧，因此产能效率极高："], [1, "③TCA位于一切分解⟦1|代谢⟧和合成代谢中的枢纽地位，不仅可为⟦2|微生物⟧的生物合成提供各种碳架原料，而且还与人类的⟦1|发酵⟧生产（如柠檬酸、苹果酸、谷氨酸、延胡索酸和琥珀酸等）紧密相关。"]], 0],
[0, 5, 1, 5, "试比较有氧呼吸、无氧呼吸和发酵的特点。", [[0, "（1）有氧呼吸是指底物按常规方式脱氢后，脱下的氢经完整⟦1|呼吸链⟧传递，最终被外源分子氧接受，产生了水并释放出⟦1|ATP⟧形式的⟦2|能量⟧的一系列过程。这是一种递氢和受氢都须在有氧条件下完成的生物氧化作用，是一种高效产能方式。"], [0, "（2）无氧呼吸是指一类⟦1|呼吸链⟧末端的⟦1|氢⟧受体为外源无机氧化物（少数为有机氧化物）的生物氧化。这是一类在无氧条件下进行的、产能效率低的特殊呼吸。"], [0, "（3）发酵是指在无氧等外源⟦2|氢⟧受体的条件下，底物脱氢后所产生的还原力[H]未经⟦1|呼吸链⟧传递而直接交给某一内源性中间⟦2|代谢⟧物接受，以实现⟦1|底物水平磷酸化⟧产能的一类生物氧化反应。"], [0, "（4）三者的比较如下表："], [0, "氢受体：有氧呼吸 ⟦1|氧气⟧；无氧呼吸 无机氧化物（少部分为有机氧化物）；⟦1|发酵⟧ 内源中间⟦2|代谢⟧产物"], [0, "递⟦2|氢⟧体：有氧呼吸 完整的⟦1|呼吸链⟧；无氧呼吸 少部分呼吸链；⟦1|发酵⟧ 未经呼吸链"], [0, "终产物：有氧呼吸 水；无氧呼吸 无机氧化物还原后的产物；⟦1|发酵⟧ 还原后的中间⟦1|代谢⟧产物"], [0, "产能机制：有氧呼吸 ⟦1|氧化磷酸化⟧；无氧呼吸 ⟦1|底物水平磷酸化⟧"], [0, "产能效率：有氧呼吸 高；无氧呼吸 低"]], 0],
[0, 5, 1, 6, "试比较经典异型乳酸发酵与双歧杆菌异型乳酸发酵途径的异同。", [[0, "（1）相同点两者都属于异型乳酸⟦1|发酵⟧，是指葡萄糖通过HMP途径产生乳酸、乙醇（或乙酸）和CO2等多种产物的发酵。"], [0, "（2）不同点"], [1, "①经典异型⟦1|发酵⟧乳，以肠膜明串珠菌为代表，当肠膜明串珠菌以葡萄糖为发酵底物时，其发酵产物为乳酸、乙醇和CO2、⟦1|1分子⟧H2O和1分子⟦2|ATP⟧；以核糖作发酵底物时，其发酵产物为乳酸、乙酸、2分子H2O和2分子ATP；以果糖为底物时，其发酵产物为乳酸、乙酸、CO2和甘露醇。"], [1, "②双歧杆菌异型乳酸⟦1|发酵⟧途径是通过HMP发酵的新途径，其特点是⟦1|2分子⟧的葡翻糖可产生3分子乙酸、2分子乳酸和5分子⟦2|ATP⟧。"]], 0],
[0, 5, 1, 7, "异养微生物的产能途径有哪些？", [[0, "⟦1|异养⟧⟦1|微生物⟧产能途径的多样性："], [0, "（1）EMP途径以⟦1|1分子⟧葡萄糖为底物反应产生2分子丙酮酸，2分子NADH氢离子和2分子⟦1|ATP⟧。EMP途径是绝多数生物所共有的一条主流⟦2|代谢⟧途径。"], [0, "（2）HMP途径是从葡糖-6-磷酸开始的，其特点是葡萄糖不经EMP途径和TCA循环而得到彻底氧化，并能产生大量还原型烟酸胺腺嘌呤二核苷酸磷酸以及重要中间⟦2|代谢⟧产物。在多数好氧菌和兼性⟦1|厌氧⟧⟦1|菌种⟧都存在HMP途径，而且通常还与EMP途径同时存在。只有HMP途径而无EMP途径的⟦2|微生物⟧很少，例如弱氧化醋杆菌，氧化葡糖杆菌，氧化醋单胞菌。"], [0, "（3）ED途径以⟦1|1分子⟧葡萄糖为底物生成2分子丙酮酸，1分子⟦2|ATP⟧，1分子NADPH和NADH。其特点是只经过4步反应即可快速获得由EMP途径须经10步反应才能形成的丙酮酸。ED途径在⟦1|革兰氏⟧阴性菌中分布较广，特别是假单胞菌和⟦1|固氮⟧菌的某些菌中较多存在，是缺乏完整EMP途径的⟦2|微生物⟧中的一种替代途径。ED途径可不依赖于EMP途径和HMP途径而单独存在。"], [0, "（4）TCA途径以⟦1|1分子⟧丙酮酸为底物，经过一系列循环反应而彻底氧化，脱羧形成3分子CO2，4分子NADH2，1分子FADH2和1分子GTP，总共相当于10分子⟦2|ATP⟧，产能效率极高。这是一个广泛存在于各生物体中的重要生物化学反应，在各种⟦1|好氧⟧⟦2|微生物⟧中普遍存在。"]], 0],
[0, 5, 1, 8, "化能异养微生物的生物氧化类型有哪些，请简要说明。", [[0, "化能⟦1|异养⟧⟦2|微生物⟧是指通过对无机物进行氧化而获得还原CO2所需的⟦2|ATP⟧和[H]的微生物。例如氧化NH4t、NO2、H2S、H2等无机物。化能⟦1|自养⟧菌一般是好氧菌如硝化细菌。"], [0, "（1）生物氧化类型：根据氧化还原反应中⟦2|电子⟧受体的不同可将化能⟦1|异养⟧⟦2|微生物⟧氧化有机物的方式分为⟦1|发酵⟧和呼吸两种类型。"], [1, "①⟦1|发酵⟧：指⟦1|微生物⟧⟦2|细胞⟧将有机物氧化释放的电子直接交给底物本身未完全氧化的某种中间产物，同时释放能量并产生各种不同的代谢产物。该过程中，有机物只是部分被氧化，释放出一小部分能量。"], [1, "②呼吸作用：⟦2|微生物⟧在降解底物的过程中，将释放出的电子交给NAD（P）*、FAD或FMN等电子载体，再经电子传递系统传给外源电子受体，从而生成水或其他还原型产物并释放出⟦2|能量⟧的过程。以分子氧作为最终电子受体的称为⟦1|好氧⟧呼吸；以氧化型化合物作为最终电子受体的称为⟦1|厌氧⟧呼吸。"]], 0],
[0, 5, 1, 9, "简要说明嗜盐菌紫膜的光介导ATP合成的过程及意义。", [[0, "⟦1|嗜盐⟧菌在无氧条件下，利用光能所造成的紫膜蛋白上视黄醛辅基构象的变化，可使质子不断驱至膜外，从而在膜两侧建立一个质子动势，再由其来推动⟦2|ATP⟧合酶合成ATP。其中紫膜，能进行独特⟦1|光合⟧作用，由称作细菌视紫红质的⟦2|蛋白质⟧（占⟦1|75%⟧）和类脂（占25%）组成，前者与人眼视网膜上柱状细胞中所含的一种功能相似的蛋白一视紫红质十分相似，两者都以紫色的视黄醛作辅基。"], [0, "（1）过程⟦1|细菌⟧的视紫红质的功能与叶绿素相似，能吸收光能，并在光量子的驱动下起着质子泵作用。这时，它将反应中产生的质子一一逐出⟦1|细胞膜⟧外，从而使紫膜内外形成一个质子梯度差。根据化学渗透学说，这一梯度差（即质子动势）在驱使H+通过⟦2|ATP⟧合酶的孔道进入膜内以达到质子平衡时，就会产生ATP。"], [0, "（2）意义紫膜的⟦1|光合⟧磷酸化是迄今所知道的最简单的光合磷酸化反应，这是验证化学渗透学说的绝好实验模型。对其机制的深刻揭示，发现视紫红质具有光致变色、光电响应和质子传递等功能，是生命科学基础理论中的又一重大突破，并无疑将会对人类的生产实践包括太阳能的高效利用、海水的淡化、疾病诊断以及生物芯片、生物电池和光敏元件的制作等事业带来革命性的影响。"]], 0],
[0, 5, 1, 10, "自养微生物的CO2固定的途径有哪些？", [[0, "种固定CO2途径分别为Calvin 循环、⟦1|厌氧⟧乙酰-CoA途径、逆向TCA循环途径和羟基丙酸途径。现逐一简介如下。"], [0, "（1）Calvin循环是指光能自养生物和化能自养生物固定CO2的主要途径。二磷酸核酮糖羧化⟦2|酶⟧-加氧（RuBis-CO）和磷酸核酮糖激酶是本途径的两种特有的酶。存在于绿色植物、⟦1|蓝细菌⟧和多数⟦1|光合⟧⟦2|细菌⟧外，还有硫细菌、铁细菌和硝化细菌等许多化能自养菌。"], [0, "（2）⟦1|厌氧⟧乙酰CoA途径是一种非循环式的CO2固定机制，主要存在于一些产乙酸菌、硫酸盐还原菌和产甲烷菌等化能⟦1|自养⟧⟦2|细菌⟧中。"], [1, "关键⟦1|酶⟧为CO脱⟦2|氢⟧酶"], [0, "（3）逆向TCA途径绿菌属等一些绿色硫⟦1|细菌⟧的CO2固定是通过逆向TCA途径途径进行的。本循环起始于柠檬酸（6C化合物）的裂解产物草酰乙酸（4C），以它作CO2受体，每循环一周掺入⟦1|2个⟧CO2，并还原成可供各种生物合成用的乙酰-CoA（2C），由它再固定1分子CO2后，就可进一步形成丙酮酸、丙糖、己糖等一系列构成⟦2|细胞⟧所需要的重要合成原料。"], [0, "（4）羟基丙酸途径少数绿色硫⟦2|细菌⟧在以H2或H2S作⟦2|电子⟧供体进行⟦1|自养⟧生活时所特有的一种CO2固定机制。该途径可以将⟦1|2个⟧CO2分子转变为乙醛酸。"]], 0],
[0, 5, 1, 11, "三种好氧性固氮菌保护固氮酶免受氧毒害的机制？", [[0, "（n）⟦1|好氧⟧性自生⟦1|固氮⟧菌的抗氧保护机制"], [0, "①呼吸保护⟦1|固氮⟧菌以极强的呼吸作用迅速地将周围环境中的氧消耗掉，使⟦1|细胞⟧周围微环境处于低氧状态，借此保护固氮⟦2|酶⟧。"], [0, "②构象保护在高氧分压条件下，有些⟦1|固氮⟧⟦1|酶⟧能形成一个无固氮活性但能防止氧害的特殊构象，目前认为构像保护是因为存在一种耐氧蛋白即铁硫蛋白I，可在高氧条件下与固氮酶的两个组分形成耐氧的复合物。"], [0, "（2）⟦1|蓝细菌⟧的⟦1|固氮⟧菌的抗氧保护机制"], [1, "①分化出特殊的还原性异形胞在具有异形胞分化的⟦1|蓝细菌⟧，⟦1|固氮⟧作用只局限在异形胞中进行。异形胞特点：i异形胞的体积较一般营养⟦2|细胞⟧大，细胞外有一层由糖脂组成的片层式的较厚外膜，它具有阻止氧气进入细胞的屏障作用；i异形胞内缺乏产氧光合系统II，加上脱氢酶和氢化酶的活性高，使异形胞能维持很强的还原态；ii其中超氧化物歧化酶SOD的活性很高，有解除氧毒害的功能；iv异形胞比邻近营养细胞高出⟦1|2倍⟧的呼吸强度，借此可消耗过多的氧并产生对固氮必需的⟦2|ATP⟧。"], [1, "②非异形胞的保护方式i一些菌株可通过将⟦1|固氮⟧作用与光合作用进行时间上的分隔（白天光照下进行光合作用，夜晚黑暗下固氮）来达到；i束毛⟦1|蓝细菌⟧属通过束状群体中央处于厌氧环境下的⟦2|细胞⟧失去能产氧的光合系统I，以便于进行固氮反应；ii黏球蓝⟦2|细菌⟧属则通过提高过氧化物酶和SOD的活性来除去有毒过氧化合物等等"], [0, "（3）豆科植物根瘤菌的抗氧保护机制形成类菌体，具有类菌体周膜，维持一个低氧的内环境里⟦1|固氮⟧，且周膜外内存在一种红色的含铁蛋白一豆血红蛋白，可通过氧化态和还原态间变化具有缓冲作用，使游离的氧维持在低而恒定的水平。"]], 0],
[0, 5, 1, 12, "简述肽聚糖合成的过程", [[0, "（1）⟦1|肽聚糖⟧是绝大多数原核生物⟦1|细胞壁⟧所含有的独特成分，它在真⟦2|细菌⟧的生命活动中有着重要的功能，尤其是许多重要抗生素例如青霉素、头孢霉素、万古霉素、环丝氨酸和杆菌肽等呈现其选择毒力的物质基础。"], [0, "（2）合成的三阶段"], [1, "1）在⟦1|细胞⟧质中合成"], [1, "①由葡萄糖合成N—乙酰葡糖胺和N—乙酰胞壁酸；"], [1, "②由N一乙酰胞壁酸合成\"Park\"核苷酸。\"Park\"核苷酸（Parknucleotide）即UDP-N-乙酰胞壁酸五肽，亲水性分子，它的合成过程共分⟦1|4步⟧，都需UDP（尿苷二磷酸）作糖载体；合成时可被环丝氨酸所抑制2）在⟦2|细胞⟧膜上合成UDP一N一乙酰胞壁酸五肽掺入细胞膜并进一步接上N一乙酰葡萄糖胺和甘氨酸五肽\"桥”，最后由⟦2|细菌⟧醇的类脂载体的运送⟦1|肽聚糖⟧单体插入细胞膜外的⟦1|细胞壁⟧生长点；"], [1, "3）在⟦1|细胞膜⟧外合成"], [1, "①⟦2|细胞⟧⟦2|分离⟧促自溶素酶解⟦1|细胞壁⟧上的⟦1|肽聚糖⟧网套，使得原有的肽聚糖分子作为新合成分子的引物；"], [1, "②已合成的⟦1|肽聚糖⟧单体与引物分子间发生转糖基作用，使多糖链在横向上延伸一个双糖分；"], [1, "③通过转肽⟦1|酶⟧的转肽作用，最终使前后两条多糖链间形成甘氨酸五肽“桥\"而发生纵向交联，从而形成新的⟦1|肽聚糖⟧。"]], 0],
[0, 5, 1, 13, "什么叫次生代谢物？有哪几条次生代谢物合成途径，各自产生何类重要次生代谢物？", [[0, "（1）次生⟦1|代谢⟧物定义次生代谢物是指某些⟦2|微生物⟧生长到稳定期前后，以结构简单、代谢途径明确、产量较大的初生代谢物作为前体，通过复杂的次生代谢途径所合成的各种结构复杂的化学物。"], [0, "（2）⟦1|微生物⟧次生⟦2|代谢⟧合成途径主要有⟦1|4条⟧，"], [1, "①糖⟦2|代谢⟧延伸途径由糖类⟦1|转化⟧、聚合产生多糖类、糖苷类和⟦2|核酸⟧类化合物进一步转化而形成核苷类、糖苷类和糖衍生物类⟦1|抗生素⟧。"], [1, "②莽草酸延伸途径由莽草酸分支途径产生氯霉素等⟦1|抗生素⟧。"], [1, "③氨基酸延伸途径由各种氨基酸衍生、聚合形成多种含氨基酸的⟦1|抗生素⟧，如多肽类抗生素、β一内酰胺类抗生素和杀腺癌菌素等。"], [1, "①乙酸延伸途径乙酸经缩合形成聚酮酐，进而合成大环内酯类、四环素类、灰黄霉素类⟦1|抗生素⟧和黄曲霉毒素。还可经甲羟戊酸而合成异戊二烯类，进一步合成重要的植物⟦2|生长⟧刺激素——赤霉素或⟦1|真菌⟧毒素等。"]], 0],
[0, 5, 1, 14, "微生物代谢调节在发酵工业中有何重要性？试举例加以说明。", [[0, "⟦1|微生物⟧⟦2|代谢⟧调节在⟦1|发酵⟧工业中的重要性表现在："], [0, "（1）应用⟦1|营养⟧缺陷型解除正常的反馈调节"], [1, "①赖氨酸⟦1|发酵⟧在许多⟦1|微生物⟧中，可用天冬氨酸为原料，通过分支代谢途径合成出赖氨酸、苏氨酸和甲硫氨酸。赖氨酸是一种重要的必需氨基酸，在食品、医药和畜牧业上需要量很大。但在代谢过程中，一方面由于赖氨酸对天冬氨酸激酶（AK）有反馈抑制作用，另一方面由于天冬氨酸除用于合成赖氨酸外，还要作为合成甲硫氨酸和苏氨酸的原料，因此，在正常的⟦2|细胞⟧内，就难以累积较高浓度的赖氨酸。"], [1, "②为了解除正常的⟦2|代谢⟧调节以获得赖氨酸的高产菌株，工业上选育了谷氨酸棒杆菌的高丝氨酸缺陷型菌株作为赖氨酸的⟦1|发酵⟧菌种。这个菌种由于不能合成高丝氨酸脱氢⟦2|酶⟧（HSDH），故不能合成高丝氨酸，也不能产生苏氨酸和甲硫氨酸，在补给适量高丝氨酸（或苏氨酸和甲硫氨酸）的条件下，在含有较高糖分和铵盐的⟦1|培养基⟧上，能产生大量的赖氨酸。"], [0, "（2）应用抗反馈调节的⟦1|突变⟧株调节反馈调节举例：当把棒杆菌培养在含苏氨酸和异亮氨酸的⟦2|结构⟧类似物AHV（α-氨基-β-羟基戊酸）的⟦1|培养基⟧上时，由于AHV可干扰该菌的高丝氨酸脱氢酶、苏氨酸脱氢酶以及二羧酸脱水酶，所以抑制了该菌的正常⟦2|生长⟧。如果采用诱变（如用亚硝基胍作为诱变剂2后所获得的抗AHV突变株进行发酵，则能分泌较多的苏氨酸和异亮氨酸。这是因为，该突变株的高丝氨酸脱氢酶或苏氨酸脱氢酶和二羧酸脱水酶的结构基因发生了突变，故不再受苏氨酸或异亮氨酸的反馈抑制，于是就有大量的苏氨酸和异亮氨酸的累积。如进一步再选育出甲硫氨酸缺陷型菌株，则其苏氨酸产量还可进一步提高，原因是甲硫氨酸合成途径上的两个反馈阻遏也被解除了。"], [0, "（3）控制⟦1|细胞膜⟧的渗透性"], [1, "①通过⟦2|生理⟧学手段控制⟦1|细胞膜⟧的渗透性举例：在谷氨酸⟦1|发酵⟧生产中，生物素的浓度对谷氨酸的累积有着明显的影响，只有把生物素的浓度控制在亚适量情况下，才能分泌出大量的谷氨酸。"], [1, "②通过⟦1|细胞膜⟧缺损突变而控制其渗透性举例：应用谷氨酸产生菌的油酸缺陷型菌株，在限量添加油酸的⟦1|培养基⟧中，也能因⟦2|细胞⟧膜发生渗漏而提高谷氨酸的产量，这是因为油酸是一种含有一个双键的不饱和脂肪酸（十八碳烯酸），它是⟦2|细菌⟧细胞膜磷脂中的重要脂肪酸。油酸缺陷型突变株因其不能合成油酸而使细胞膜缺损。"]], 0],
[0, 6, 0, 1, "菌落形成单位（colony-formingunit，cfu）", [[0, "⟦1|菌落⟧形成单位即用平板菌落计数法对活菌进行计数时的一个计数单位。对充分分散、稀释度合适的单⟦1|细胞⟧⟦2|微生物⟧来说，1cfu即表示样品中有一个活细胞，但对成团或呈链状、丝状⟦2|生长⟧的微生物来说，则cfu值并非一个活细胞。"]], 0],
[0, 6, 0, 2, "平板菌落计数法（colony-countingmethod）", [[0, "是活⟦2|微生物⟧个体数的常用计数法之一。把一定量稀释菌液浇注或涂布在固体⟦1|培养基⟧平板上（内），经⟦2|培养⟧后，每一活⟦2|细胞⟧就形成一个单⟦1|菌落⟧，依菌落形成单位数（cfu）乘以稀释度即可求得试样中所含的活菌数。——"]], 0],
[0, 6, 0, 3, "同步培养（synchronousculture）", [[0, "是指设法使某一群体中的所有个体⟦1|细胞⟧尽可能都处于同样的细胞⟦2|生长⟧和分裂周期中的⟦2|培养⟧方式，通过分析此群体在各阶段的生物化学特性变化，来间接了解单个细胞的相应变化规律。"]], 0],
[0, 6, 0, 4, "同步生长（synchronousgrowth）", [[0, "是通过获得同步培养物的手段，使⟦1|微生物⟧⟦2|细胞⟧群体内的各个体都处于同一细胞分裂周期的特殊⟦2|生长⟧状态。"]], 0],
[0, 6, 0, 5, "典型生长曲线（typicalgrowthcurve）", [[0, "定量描述等容积液体⟦1|培养基⟧中⟦2|微生物⟧群体⟦2|生长⟧规律的一条实验曲线，称⟦1|生长曲线⟧。当把少量纯种单⟦2|细胞⟧微生物接种到恒体积的液体培养基中进行批式培养后，在适宜的温度、通气等条件下，该群体就会由小到大，发生有规律的增长。如以细胞数目的对数值作纵坐标，以培养时间作横坐标，就可画出一条由延滞期、指数期、稳定期和衰亡期⟦1|4个⟧阶段"]], 0],
[0, 6, 0, 6, "生长速率常数（growth rate constant）", [[0, "某⟦1|微生物⟧⟦2|细胞⟧每小时的平均分裂次数。"]], 0],
[0, 6, 0, 7, "延滞期（lag phase）", [[0, "延滞期是典型⟦1|生长曲线⟧中的第一期。指少量单⟦1|细胞⟧⟦2|微生物⟧接种到新鲜培养液中后，在开始培养的一段时间内，因⟦2|代谢⟧系统产生诱导酶等适应新环境的需要，出现细胞数目没有增加的一段时间（生长速率常数R=0）。"]], 0],
[0, 6, 0, 8, "指数期（exponential phase）", [[0, "指数期又称对数期。典型⟦1|生长曲线⟧中的第二期。指紧跟着延滞期而来的一段⟦1|细胞⟧数以几何级数增长的时期。此期的细胞呈平衡⟦2|生长⟧，其酶系活跃、⟦2|代谢⟧旺盛，故应用很广"]], 0],
[0, 6, 0, 9, "稳定期（stationaryphase）", [[0, "稳定期是典型⟦1|生长曲线⟧中的第三期。指紧跟着指数期后的一个处于正⟦1|生长⟧与负生长相等的动态平衡期，其特点是生长速率常数（R）等于0，菌体产量达到最高值。"]], 0],
[0, 6, 0, 10, "衰亡期（declinephase）", [[0, "衰亡期是典型⟦1|生长曲线⟧中的第四期。指紧跟在稳定期后的一段个体死亡速度超过新繁殖速度，即群体出现负⟦2|生长⟧的时期。特点是R为负值，⟦2|细胞⟧形态不规则，常出现退化型、膨大型、畸形或自溶细胞，并会释放次生⟦2|代谢⟧产物或⟦1|芽孢⟧等。"]], 0],
[0, 6, 0, 11, "连续培养（continuousculture）", [[0, "当⟦2|微生物⟧以单批培养方式培养到指数期的后期时，一方面以一定速度连续流入新鲜⟦1|培养基⟧和新鲜空气（指对⟦1|好氧⟧菌），并立即搅拌均匀，同时利用溢流方式连续不断流出培养物，使培养器内微生物长期处在适宜的培养基中连续保持指数期⟦2|生长⟧，借以提高微生物的生长和⟦2|代谢⟧效率。"]], 0],
[0, 6, 0, 12, "专性好氧菌（obligateaerobes）", [[0, "是一大类必须在较高浓度分子氧的条件下才能⟦2|生长⟧，有完整的⟦1|呼吸链⟧，以分子氧作为最终氢受体，具有超氧化物歧化酶（SOD）和过氧化氢酶的⟦2|微生物⟧。如绝大多数⟦1|真菌⟧和多数⟦2|细菌⟧、⟦1|放线菌⟧等。"]], 0],
[0, 6, 0, 13, "兼性厌氧菌（facultativeanaerobes）", [[0, "是一类主要生长在有氧条件下也可在无氧条件下生长的⟦2|微生物⟧。特点是在有氧下借呼吸产能，而在无氧条件下可借⟦1|发酵⟧或无氧呼吸产能；⟦2|细胞⟧含超氧化物歧化酶（SOD）和过氧化氢酶。例如一些⟦1|酵母菌⟧和许多⟦2|细菌⟧等。"]], 0],
[0, 6, 0, 14, "微好氧菌（microaerophilicmicroorganisms）", [[0, "是一类只能在较低的氧分压下才能正常⟦1|生长⟧的⟦2|微生物⟧，例如少数⟦2|细菌⟧。"]], 0],
[0, 6, 0, 15, "耐氧菌（aerotolerantanaerobes）", [[0, "是一类可在分子氧存在下进行⟦1|发酵⟧性厌氧生活的厌氧菌。它们的⟦2|生长⟧不需要任何氧，但分子氧对它们也无害。不具有⟦1|呼吸链⟧，仅依靠专性发酵和⟦1|底物水平磷酸化⟧而获得⟦2|能量⟧。⟦2|细胞⟧内存在SOD和过氧化物酶（但缺乏过氧化氢酶）可耐氧。通常的乳酸菌多为耐氧菌。"]], 0],
[0, 6, 0, 16, "厌氧菌（anaerobes）", [[0, "厌氧菌一般指严格厌氧菌。一类对分子氧高度敏感的⟦2|微生物⟧。特点是：①分子氧对它们有毒，即使短期接触也可被抑制甚至致死：②在大气环境下，只能在固体⟦1|培养基⟧或半固体培养基深层无氧处或在低氧化-还原条件下生长；③生命活动所需能量借⟦1|发酵⟧无氧呼吸、循环⟦1|光合⟧磷酸化或甲烷发酵提供：④缺乏SOD和⟦2|细胞⟧色素氧化酶，多数无过氧化氢酶。如产甲烷菌和光合⟦2|细菌⟧等"]], 0],
[0, 6, 0, 17, "超氧阴离子自由基（superoxideanion radical）", [[0, "活性氧的形式之一，带负电荷（有奇数⟦1|电子⟧9，性质不稳化学反应强，可破坏重要生物大分子和各种膜⟦2|结构⟧，对生物体有毒害作用。"]], 0],
[0, 6, 0, 18, "超氧化物歧化酶（superoxidedismutase，SOD）", [[0, "一切⟦1|好氧⟧⟦1|微生物⟧或耐氧微生物含有的可使剧毒的超氧阴离子自由基变为过氧化⟦2|氢⟧的⟦2|酶⟧。"]], 0],
[0, 6, 0, 19, "石炭酸系数（phenolcoefficient）", [[0, "在一定时间内，某化学药剂能杀死全部供试菌的最高稀释度与达到同效的石炭酸（苯酚）的最高稀释度之比，称为石炭酸系数。一般规定处理时间为10min，供试菌为伤寒沙门氏菌。"]], 0],
[0, 6, 0, 20, "抗代谢物（antimetabolite）", [[0, "又称⟦1|代谢⟧拮抗物或代谢类似物。一类在化学⟦2|结构⟧上与⟦2|细胞⟧内必要代谢物的结构相似，并可竞争性地干扰正常代谢活动的化学物质。它们具有良好的选择毒力，故可用作化学治疗剂。如磺胺类药物等。"]], 0],
[0, 6, 0, 21, "抗生素（antibiotics）", [[0, "是一类由⟦1|微生物⟧或其他生物生命活动过程中合成的次生⟦2|代谢⟧物或其人工衍生物，它们在很低浓度时即可抑制或干扰它种生物（包括病原菌、⟦1|病毒⟧、癌⟦2|细胞⟧等）的生命活动，因而可用作优良的化学治疗剂。如青霉素、四环素和利福素等。"]], 0],
[0, 6, 1, 1, "什么是单细胞微生物的典型生长曲线？试描述四个时期的特征。", [[0, "典型⟦1|生长曲线⟧是指定量描述等容积液体⟦1|培养基⟧中⟦2|微生物⟧群体⟦2|生长⟧规律的一条实验曲线，称生长曲线。典型的微生物生长曲线包括四个时期：延滞期、对数期、稳定期、衰亡期。"], [0, "（1）延滞期特点："], [1, "①⟦1|生长⟧速率常数为零；"], [1, "②⟦1|细胞⟧⟦2|形态⟧变大或增长，许多杆菌可长成丝状；"], [1, "③⟦1|细胞⟧内的RNA尤其是rRNA含量增高，原生质呈嗜碱性；"], [1, "④合成⟦1|代谢⟧十分活跃，⟦1|核糖体⟧、酶类和⟦2|ATP⟧的合成加速，易产生各种诱导酶；"], [1, "③对外界不良条件如NaCI溶液浓度、⟦1|温度⟧和⟦1|抗生素⟧等理化因素反应敏感。"], [0, "（2）指数期特点："], [1, "①⟦1|生长⟧速率常数R最大，⟦2|细胞⟧的代时或原生质增加一倍所需的倍增时间最短；"], [1, "②⟦1|细胞⟧进行平衡⟦2|生长⟧，故菌体各部分的成分十分均匀；"], [1, "③⟦1|酶⟧系活跃，⟦2|代谢⟧旺盛。"], [0, "（3）稳定期特点："], [1, "①⟦1|生长⟧速率常数R等于零，即处于新繁殖的⟦2|细胞⟧数与衰亡的细胞数相等，或正生长与负生长相等的动态平衡之中；"], [1, "②菌体产量达到了最高点，而且菌体产量与⟦1|营养⟧物质的消耗间呈现出有规律的比例关系，这一关系可用⟦2|生长⟧产量常数Y（或称生长得率，growth yield）来表示；"], [1, "③⟦1|细胞⟧内开始积聚糖原、异染颗粒和脂肪等内含物，如⟦1|芽孢⟧杆菌一般在这时开始形成芽孢；"], [1, "④合成⟦1|抗生素⟧等对人类有用的各种次生⟦1|代谢⟧物，所以次生代谢物又称稳定期产物。"], [0, "（4）衰亡期特点："], [1, "①⟦1|微生物⟧的个体死亡速度超过新生速度，整个群体呈现负⟦2|生长⟧状态（R为负值）的时期；"], [1, "②⟦1|细胞⟧形态发生多形化，例如会发生膨大或不规则的退化；有的⟦2|微生物⟧因蛋白水解酶活力的增强而发自溶；"], [1, "③有的⟦2|微生物⟧在此期会进一步合成或释放对人类有益的⟦1|抗生素⟧等次生⟦2|代谢⟧物，而在⟦1|芽孢⟧杆菌中，往往在此期释放芽孢等等。"]], 0],
[0, 6, 1, 2, "延滞期有何特点？实践上如何缩短它？", [[0, "（1）定义：延滞期是指少量单⟦1|细胞⟧⟦2|微生物⟧接种到新鲜培养液中后，在开始培养的一段时间内，因代谢系统适应新环境的需要，细胞数目没有增加的一段时期。"], [0, "（2）该期的特点为"], [1, "①⟦1|生长⟧速率常数为零；"], [1, "②⟦1|细胞⟧⟦2|形态⟧变大或增长，许多杆菌可长成丝状；"], [1, "③⟦1|细胞⟧内的RNA尤其是rRNA含量增高，原生质呈嗜碱性合成代谢十分活跃，⟦1|核糖体⟧、酶类和⟦2|ATP⟧的合成加速，易产生各种诱导酶"], [1, "③对外界不良条件如NaCI溶液浓度、⟦1|温度⟧和⟦1|抗生素⟧等理化因素反应敏感。"], [0, "（3）实践上缩短延滞期的方法"], [1, "①以对数期或稳定期接种龄的“种子接种；"], [1, "②增大接种量，一般采用1/10的接种量；"], [1, "③将⟦1|微生物⟧接种到⟦2|营养⟧丰富的天然⟦1|培养基⟧中。"]], 0],
[0, 6, 1, 3, "指数期有何特点？处于此期的微生物有何应用？", [[0, "（1）定义：指数期是指在⟦1|生长曲线⟧中，紧接着延滞期的一段⟦1|细胞⟧数目以几何级数增长的时期。"], [0, "（2）指数期的特点"], [1, "①⟦1|生长⟧速率常数R最大，⟦2|细胞⟧的代时或原生质增加一倍所需的倍增时间最短；"], [1, "②⟦1|细胞⟧进行平衡⟦2|生长⟧，故菌体各部分的成分十分均匀；"], [1, "③⟦1|酶⟧系活跃，⟦2|代谢⟧旺盛。"], [0, "（3）指数期⟦1|微生物⟧的应用"], [1, "①作为⟦1|代谢⟧、⟦2|生理⟧等研究的良好材料；"], [1, "②是增殖⟦1|噬菌体⟧的最适宿主菌龄："], [1, "③是⟦1|发酵⟧生产中用作“种子”的最佳种龄。"]], 0],
[0, 6, 1, 4, "稳定期有何特点？稳定期到来的原因有哪些？", [[0, "（1）定义：稳定期又称恒定期或最高⟦1|生长⟧期，是⟦2|微生物⟧数量最高的生长时期。"], [0, "（2）稳定期的特点"], [1, "①⟦1|生长⟧速率常数R等于零，即处于新繁殖的⟦2|细胞⟧数与衰亡的细胞数相等，或正生长与负生长相等的动态平衡之中；"], [1, "②菌体产量达到了最高点，而且菌体产量与⟦1|营养⟧物质的消耗间呈现出有规律的比例关系，这一关系可用⟦2|生长⟧产量常数Y来表示："], [1, "③⟦1|细胞⟧内开始积聚糖原、异染颗粒和脂肪等内含物，如⟦1|芽孢⟧杆菌一般在这时开始形成芽孢；"], [1, "③合成⟦1|抗生素⟧等对人类有用的各种次生⟦1|代谢⟧物，所以次生代谢物文称稳定期产物。"], [0, "（3）进入稳定期原因"], [1, "①⟦1|营养⟧物尤其是⟦2|生长⟧限制因子的耗尽；营养物的比例失调，例如 CIN 比不合适等"], [1, "③酸、醇、毒素或H202等有害⟦1|代谢⟧产物的累积；"], [1, "④pH、氧化还原电势等物理化学条件越来越不适宜等。"]], 0],
[0, 6, 1, 5, "如何解释厌氧菌的氧毒害机制？", [[0, "用于⟦1|厌氧⟧菌的氧毒害机制一一超氧化物歧化⟦1|酶⟧（SOD）学说，该学说认为，"], [0, "（1）专性⟦1|厌氧⟧菌⟦2|细胞⟧内缺乏超氧化物歧化酶（SOD）、细胞色素氧化酶和过氧化氢酶。而超氧化物歧化酶可以将超氧阴离子自由基⟦1|转化⟧成过氧化氢；过氧化氢酶可以将过氧化氢转化成水和⟦2|氧气⟧。"], [0, "（2）有氧存在时，⟦1|微生物⟧体内会产生超氧阴离子自由基，超氧阴离子自由基是活性氧的形式之一，因有奇数电子，故带负电荷；它既有分子性质，又有离子性质，其性质极不稳定，化学反应力极强，在⟦2|细胞⟧内可破坏各种重要生物大分子和膜结构，还可形成其他活性氧化物，对生物体极其有害。"], [0, "（3）由于专性⟦1|厌氧⟧菌⟦1|细胞⟧内缺乏超氧化物歧化⟦2|酶⟧（SOD）、细胞色素氧化酶和过氧化氢酶，不能解除超氧阴离子自由基的毒害，所以双歧杆菌等厌氧菌必然只能进行转性厌氧生活。"]], 0],
[0, 6, 1, 6, "举例说明抗生素的作用机理。", [[0, "⟦1|抗生素⟧的作用机理及举例如下："], [0, "（1）抑制⟦1|细胞壁⟧的合成，例如青霉素具有抑制肽尾和肽桥间的转肽作用。"], [0, "（2）引起⟦1|细胞壁⟧降解，例如溶葡球菌素具有水解肽尾和分解胞壁酸-葡糖按链的作用。"], [0, "（3）干扰⟦1|细胞膜⟧功能，例如短杆菌肽能使⟦1|氧化磷酸化⟧解偶联，与膜结合。"], [0, "（4）抑制⟦1|蛋白质⟧合成，例如链霉素能与30S⟦1|核糖体⟧结合，促进错译，抑制肽链延伸。"], [0, "（4）抑制DNA合成，例如链霉素C能抑制黄苷酸氨基⟦1|酶⟧，可阻止GMP合成而抑制DNA。"], [0, "（6）抑制DNA复制，例如丝裂霉素能使DNA的互补链相结合，抑制复制后的⟦1|分离⟧。"], [0, "（7）抑制RNA转录，例如⟦1|放线菌⟧素D能与DNA中的鸟嘌呤结合，阻止依赖于DNA的RNA合成。"], [0, "（8）抑制RNA合成，例如利福平能与RNA聚合⟦1|酶⟧结合，阻止其合成。"]], 0],
[0, 6, 1, 7, "简述细菌耐药性的机制及避免细菌抗药性的注意事项。", [[0, "（1）⟦1|细菌⟧耐药性机制主要有："], [0, "合成修饰⟦1|抗生素⟧的⟦2|酶⟧：举例 抗青霉素或头孢菌素⟦1|菌株⟧中的β-内酰胺酶"], [0, "把药物作用的靶位加以修饰和改变：举例 抗链霉素⟦1|菌株⟧30S⟦1|核糖体⟧亚单位P10蛋白组分改变"], [0, "形成“救护途径”：举例 金葡菌和部分肠道菌群的耐磺胺⟦1|变异⟧"], [0, "使药物不能透过⟦1|细胞膜⟧：举例 部分肠道⟦1|细菌⟧与铜绿假单胞菌阻止氯霉素入胞"], [0, "主动把进入⟦1|细胞⟧内的药物泵出细胞外：举例 铜绿假单胞菌及多种多重耐药菌"], [0, "（2）在临床上用⟦1|抗生素⟧来治疗由⟦1|细菌⟧引起的疾病时，为了避免出现细菌的抗药性，使用时一定要注意："], [1, "①第一次使用的药物剂量要足；"], [1, "②避免在一个时期或长期多次使用同种⟦1|抗生素⟧；"], [1, "③不同的⟦1|抗生素⟧（或与其他药物）混合使用；"], [1, "④对现有⟦1|抗生素⟧进行改造；"], [1, "③筛选新的更有效的⟦1|抗生素⟧。"]], 0],
[0, 6, 1, 8, "试以磺胺及其增效剂 TMP为例，说明这类化学治疗剂的作用机制。", [[0, "磺胺及其增效剂TMP类的化学治疗剂的作用机制如下："], [0, "（1）磺胺药的化学结构与某些⟦1|细菌⟧的一种生长因子一一对氨基苯甲酸（PABA）的结构十分相似,故是PABA的⟦2|代谢⟧类似物，两者间存在竞争性拮抗作用。PABA 是具有转移一碳基功能的辅酶F（即四氢叶酸THFA）结构中的一个组分。由于磺胺可与PABA竞争二氢蝶酸合成酶以抑制二氢叶酸的合成，二氢蝶酸合成酶也可利用磺胺作底物，使某些磺胺分子与2-氨-4-羟-7，8-二氢蝶啶酰焦磷酸缩合，形成一个2-氨4羟-7，8-二氢蝶酸的类似物，即“假二氢叶酸”，THFA就无法合成，最终限制了与一碳基转移有关的许多反应，使这类细菌无法获得许多重要的中间代谢物（嘌呤、核苷酸、丝氨酸和甲硫氨酸等），"], [0, "众而抑制了⟦1|细菌⟧的⟦2|生长⟧。"], [0, "（2）TMP能抑制二氢叶酸还原⟦1|酶⟧，使二氢叶酸无法还原成四氢叶酸，增强了磺胺的抑制效果。在防治相关⟦2|细菌⟧性传染病方面，磺胺与TMP的双重阻断起“双保险\"的作用。"]], 0],
[0, 7, 0, 1, "饰变（modification）", [[0, "指外表的修饰性改变，意即一种不涉及⟦1|遗传⟧物质⟦2|结构⟧改变而只发生在转录，翻译水平上的表型变化。其特点是整个群体中的几乎每一个体都发生同样变化；性状变化的幅度小；因其遗传物质未变，故饰变是不遗传的。"]], 0],
[0, 7, 0, 2, "基因（gene）", [[0, "是指位于⟦1|染色⟧体上的一段以直线排列的核苷酸序列，是生物体内⟦2|遗传⟧信息的基本单位，具有编码一特定功能的多肽、⟦2|蛋白质⟧或RNA的功能"]], 0],
[0, 7, 0, 3, "质粒（plasmid）", [[0, "凡游离于原核生物核基因组以外，具有独立复制能力的小型共价闭合环状的dsDNA分子。"]], 0],
[0, 7, 0, 4, "F质粒（Fplasmid）", [[0, "又称F因子或致育因子。是大肠杆菌等⟦1|细菌⟧决定其性别并有转移能力的⟦1|质粒⟧。"]], 0],
[0, 7, 0, 5, "基因突变（gene mutation）", [[0, "泛指⟦2|细胞⟧内（或⟦1|病毒⟧体内）⟦2|遗传⟧物质的分子⟦2|结构⟧或数量突然发生的可遗传的变化，可自发或诱导产生。狭义的⟦1|突变⟧专指基因突变（点突变），广义的突变则包括基因突变和染色体畸变。"]], 0],
[0, 7, 0, 6, "营养缺陷型（auxotroph）", [[0, "指野生型菌株经⟦1|诱变⟧剂处理后，由于发生了丧失某⟦2|酶⟧合成能力的⟦1|突变⟧，因而只能在加有该酶合成产物的⟦1|培养基⟧中才能⟦2|生长⟧的一类突变菌株。即其不能在基本⟦2|培养⟧基上生长，而只能在完全培养基或相应的补充培养基上生长。"]], 0],
[0, 7, 0, 7, "抗性突变型（resistantmutant）", [[0, "指野生型菌株因发生基因⟦1|突变⟧，而产生的对某化学药物、致死物理因子或⟦1|噬菌体⟧的抗性⟦2|变异⟧类型。可在加有相应药物、用相应物理因子处理或含噬菌体的⟦1|培养基⟧平板上筛选出。"]], 0],
[0, 7, 0, 8, "条件致死突变型（conditionallethalmutant）", [[0, "某⟦1|菌株⟧或⟦1|病毒⟧经基因⟦1|突变⟧后，在某种条件下可正常地⟦2|生长⟧、⟦2|繁殖⟧并呈现其固有的表型，而在另一种条件下却无法生长、繁殖，这种突变类型称为条件致死突变型。如⟦2|温度⟧敏感突变株。"]], 0],
[0, 7, 0, 9, "原养型（prototroph）", [[0, "原养型是指⟦2|营养⟧缺陷型⟦1|突变⟧株经回复突变或重组后产生的⟦1|菌株⟧，其营养要求在表型上与野生型相同。"]], 0],
[0, 7, 0, 10, "影印平板培养法（replicaplating）", [[0, "是一种通过在固体⟦1|培养基⟧表面“盖印章\"的接种方式，达到在一系列⟦2|培养⟧血平板的相同位置上出现相同⟦2|遗传⟧型⟦1|菌落⟧的接种和培养方法。常用影印平板培养法挑选⟦2|营养⟧缺陷型⟦1|突变⟧株。"]], 0],
[0, 7, 0, 11, "碱基置换（base substitution）", [[0, "一对碱基被另一对碱基置换的点⟦1|突变⟧称为碱基置换。分为转换和颠换两种。转换是DNA 链中的一种嘌呤被另一种嘌吟所置换或一种嘧啶被另一种嘧啶所置换；而颇换则是一个嘌呤被另一个嘧啶所置换，或是一个嘧啶被另一个嘌吟所置换。"]], 0],
[0, 7, 0, 12, "移码突变（frame-shiftmutation）", [[0, "移码⟦1|突变⟧是⟦1|诱变⟧剂引起DNA序列中的一个或少数几个核苷酸发生增添或缺失，从而使该处后面的全部⟦2|遗传⟧密码的阅读框架发生改变，进而引起转录和翻译发生错误的一类突变。"]], 0],
[0, 7, 0, 13, "染色体畸变（chromosomeaberration）", [[0, "由某些强烈理化因素（X射线、烷化剂等）引起的DNA分子的大损伤，包括⟦1|染色⟧体的缺失、重复、插人、易位、倒位或染色体数目的变化。"]], 0],
[0, 7, 0, 14, "转座（transposition）", [[0, "DNA序列通过非同源重组的方式，从⟦1|染色⟧体上某一部位转移到同一染色体上另一部位或其他染色体上某一部位的⟦2|变异⟧现象，称为转座。"]], 0],
[0, 7, 0, 15, "转座因子（transposableelement）", [[0, "是一段具有转座作用的DNA序列，例如原核生物中的插入序列（IS）、⟦1|转座子⟧（Tn）和转座⟦1|噬菌体⟧（Mu）等。"]], 0],
[0, 7, 0, 16, "光复活作用（photoreactivation）", [[0, "紫外线照射后的⟦1|微生物⟧经可见光的照射可明显降低其死亡率的现象，称光复活作用。"]], 0],
[0, 7, 0, 17, "切除修复（excisionrepair）", [[0, "切除修复又称暗修复。活⟦1|细胞⟧内对损伤DNA的修复机制之一。它不需要可见光的作用，只通过⟦2|酶⟧切作用去除嘧啶二聚体，然后重新合成一段正常DNA链，再经连接酶连接后即成。"]], 0],
[0, 7, 0, 18, "诱变育种（breedingbyinducedmutation）", [[0, "利用⟦1|诱变⟧剂处理⟦2|微生物⟧群体以促进⟦1|突变⟧，再采用科学的筛选方法，从中挑选少数所需突变株的育种方法，即为诱变育种。"]], 0],
[0, 7, 0, 19, "艾姆斯试验（Ames test）", [[0, "是一种利用⟦2|细菌⟧⟦2|营养⟧缺陷型的回复⟦1|突变⟧来检测环境或食品中是否存在化学致癌剂的简便有效方法。原理在于鼠伤寒沙门氏菌的组氨酸营养缺陷型（his）⟦1|菌株⟧在基本⟦1|培养基⟧[-]的平板正不能⟦2|生长⟧，如发生回复突变变成原养型（his*）后则能生长。"]], 0],
[0, 7, 0, 20, "基因重组（gene recombination）", [[0, "两个独立基因组内的⟦2|遗传⟧基因，通过一定的途径转移到一-起，形成新的稳定基因组的过程，称为或遗传重组，简称重组。包括真核⟦2|微生物⟧中的有性杂交、准性杂交、⟦1|原生质体⟧融合以及原核生物中的⟦1|转化⟧、⟦1|转导⟧、接合和原生质体融合等"]], 0],
[0, 7, 0, 21, "转化（transformation）", [[0, "受体菌真接吸收供体菌的DNA片段而获得后者部分⟦1|遗传⟧性状的⟦2|变异⟧现象，称为⟦1|转化⟧。"]], 0],
[0, 7, 0, 22, "转化子（transformant）", [[0, "通过⟦1|转化⟧方式而形成的部分重组⟦1|菌株⟧称为转化子。"]], 0],
[0, 7, 0, 23, "感受态（competence）", [[0, "在⟦1|转化⟧发生前，受体⟦1|细胞⟧最易接受外源DNA片段并实现转化的一种⟦2|生理⟧状态，称为感受态。"]], 0],
[0, 7, 0, 24, "转化因子（transformingprinciple）", [[0, "⟦1|转化⟧因子的本质是离体的DNA片段。在不同的⟦2|微生物⟧中，转化因子的形式不同，除dsDNA或ssDNA外，⟦1|质粒⟧DNA也是良好的转化因子。"]], 0],
[0, 7, 0, 25, "转染（transfection）", [[0, "转染是指用提纯的⟦1|病毒⟧⟦2|核酸⟧（DNA或RNA）去⟦1|感染⟧其宿主⟦2|细胞⟧或其⟦1|原生质体⟧，可增殖出一群正常病毒后代的现象。"]], 0],
[0, 7, 0, 26, "转导（transduction）", [[0, "是指通过缺陷⟦1|噬菌体⟧的媒介，把供体⟦2|细胞⟧的小片段DNA携带到受体细胞中，通过交换与整合，使后者获得前者部分⟦2|遗传⟧性状的现象。由⟦1|转导⟧作用获得部分新性状的重组细胞，称为转导子。"]], 0],
[0, 7, 0, 27, "普遍转导（generaltransduction）", [[0, "是通过极少数完全缺陷⟦1|噬菌体⟧对供体菌基因组上任何DNA小片段进行误包，而将其⟦1|遗传⟧性状传递给受体菌的现象。"]], 0],
[0, 7, 0, 28, "流产转导（abortivetransduction）", [[0, "经转导⟦1|噬菌体⟧的媒介而获得供体菌DNA片段的受体菌，若此外源DNA在其内既不进行交换、整合和复制，也不迅速消失，而能表现稳定的转录、翻译和性状表达的现象，称为流产转导。其特征是在选择性⟦1|培养基⟧上形成一微小⟦1|菌落⟧。"]], 0],
[0, 7, 0, 29, "局限转导（specializedtransduction）", [[0, "通过部分缺陷的温和⟦1|噬菌体⟧把供体菌的少数特定基因携带到受体菌中，并与后者的基因组整合、重组，形成局限⟦1|转导⟧子的现象，称为局限转导。"]], 0],
[0, 7, 0, 30, "双重溶源菌（doublelysogen）", [[0, "双重溶源菌是同时⟦1|感染⟧有正常⟦1|噬菌体⟧和缺陷噬菌体的溶源菌。当它受紫外线等因素诱导后，可同时复制出上述两种噬菌体。"]], 0],
[0, 7, 0, 31, "溶源转变（lysogenic conversion）", [[0, "因温和⟦1|噬菌体⟧⟦1|感染⟧其宿主，而使宿主⟦2|细胞⟧在发生溶源化时获得了除对同种噬菌体⟦1|免疫⟧性以外的新⟦2|遗传⟧性状的现象，称溶源转变。例如，白喉棒杆菌因β温和噬菌体感染而产白喉毒素等。"]], 0],
[0, 7, 0, 32, "接合（conjugation，mating）", [[0, "雄性供体菌通过性⟦1|菌毛⟧与雌性受体菌直接接触，并把F⟦1|质粒⟧或其携带的部分或全部核基因组传递给受体菌，使后者通过⟦1|基因重组⟧而获得若干新⟦2|遗传⟧性状的现象，称为接合。"]], 0],
[0, 7, 0, 33, "有性杂交（sexualhybridization）", [[0, "有性杂交是指不同⟦1|遗传⟧型的两性⟦2|细胞⟧间发生的⟦1|接合⟧和随之进行的⟦2|染色⟧体重组，进而产生新遗传型后代的种育种技术。"]], 0],
[0, 7, 0, 34, "准性杂交（parasexual hybridization）", [[0, "是一种在同种而不同⟦1|菌株⟧的体⟦2|细胞⟧间发生的融合，可不借助减数分裂而导致低频率⟦1|基因重组⟧并产生重组子。准性生殖是在自然条件下，真核⟦2|微生物⟧体细胞间的一种自发性的⟦1|原生质体⟧融合现象。"]], 0],
[0, 7, 0, 35, "基因工程（gene engineering", [[0, "；gene technology）又称⟦1|遗传⟧工程，是指人们利用分子生物学的理论和技术，自觉设计、操纵、改造和重建⟦2|细胞⟧的基因组，从而使生物体的遗传性状发生定向⟦2|变异⟧，以最大限度地满足人类活动的需要。这是一种自觉的、可人为操纵的体外DNA重组技术，是一种可达到超远缘杂交的定向育种新技术"]], 0],
[0, 7, 0, 36, "CRISPR", [[0, "CRISPR全名为成簇有规律间隔的回文重复序列（clusteredregularlyinterspaced shortpalindromicrepeat），又称CRISPR/Cas系统，是广泛存在于原核生物⟦2|染色⟧体上的一种串联重复DNA序列，它具有清除外来有害⟦2|核酸⟧（⟦1|病毒⟧、⟦1|质粒⟧等）的特殊免疫系统。⟦2|细菌⟧或⟦1|古菌⟧可利用这些基因序列对外敌“存档”，以便伺机反击。"]], 0],
[0, 7, 0, 37, "Cas蛋白（CRISPRassociatedprotein）", [[0, "具有剪切靶标DNA的功能，俗称“分子剪刀”。通过Cas剪切，既可敲除不需要的基因，也可将新基因插入到新间隔中，在基因编辑中常用的Cas9，来自酿脓链球菌的Cas9基因，尤其适合哺乳动物和人体⟦1|细胞⟧的基因编辑工作"]], 0],
[0, 7, 0, 38, "基因编辑（geneediting）", [[0, "是一类人为定点改造生物基因组的新技术。CRISPR/Cas9是一种建立在上述⟦2|细菌⟧和⟦1|古菌⟧的CRISPR⟦1|免疫⟧机制基础上的第三代基因编辑技术。它利用crRNA作向导，借助Cas9对目的基因的特定位点进行剪切，添加等精确操作，达到对活⟦2|细胞⟧的基因组进行简便、快速、高效改造的目的。"]], 0],
[0, 7, 0, 39, "CRISPR/Cas9", [[0, "先设计并合成crRNA和tra crRNA，使之与Cas9形成复合物，然后用显微注射器注入待“编辑\"的活⟦1|细胞⟧中。经crRNA引导，复合物便整合到双链DNA的靶标上，随即由Cas9打开DNA双链，对目的基因作定点剪切、修改、替换或添加，从而使原有基因组得到精确的改造和优化。"]], 0],
[0, 7, 0, 40, "衰退（degeneration）", [[0, "是指某纯种⟦1|微生物⟧群体中的个别个体由于自发⟦1|突变⟧的结果，而使该物种原有一系列生物学性状发生量变或质变的现象。"]], 0],
[0, 7, 0, 41, "复壮（rejuvenation）", [[0, "复壮有广、狭两义。狭义的复壮：是指在⟦1|菌种⟧已发生衰退的情况下，通过纯种⟦2|分离⟧和测定典型性状、生产性能等指标，从已衰退的群体中筛选出少数尚未退化的个体，以达到恢复原⟦1|菌株⟧固有性状的相应措施。广义的复壮：指在菌种的典型特征或生产性状尚未衰退前，即经常有意识地采取纯种分离和生产性状的测定主的,以期从中避择到自发的正年个体是糖"]], 0],
[0, 7, 1, 1, "质粒有何特点？主要的质粒可分为几类？各有哪些理论或实际意义？", [[0, "⟦1|质粒⟧是指凡游离于原核生物核基因组以外，具有独立复制能力的小型共价闭合环状的dsDNA分子"], [0, "（1）⟦1|质粒⟧的特点"], [1, "①绝大多数⟦1|质粒⟧由共价闭合环状双螺旋DNA分子所构成，分子量较⟦1|细菌⟧⟦2|染色⟧体小；"], [1, "②在每个菌体内有一个或几个，也可能有很多个⟦1|质粒⟧；"], [1, "③⟦1|质粒⟧可以从⟦2|细菌⟧体内自行消失，也可通过物理化学手段，将其消除或抑制，没有质粒的细菌，可通过接合、⟦1|转化⟧或转导等方式，从具有质粒的细菌中获得，但不能自发产生；"], [1, "④质粒存在与否，无损于⟦2|细菌⟧生存，但许多次生⟦2|代谢⟧产物如⟦1|抗生素⟧的产生、色素等的产生、以至⟦1|芽孢⟧的形成，均受质粒的控制："], [1, "③⟦1|质粒⟧既能自我复制、稳定⟦2|遗传⟧，也可插入⟦2|细菌⟧染色体中或携带的外源DNA片段共同复制增殖；它可通过⟦1|转化⟧、转导或接合作用单独转移，也可携带着染色体片段一起转移，已成为遗传工程中重要的运载工具之一。"], [0, "（2）主要的⟦1|质粒⟧类型"], [1, "①⟦1|接合⟧性⟦1|质粒⟧，如E.coli的F质粒。"], [1, "②抗药性⟦1|质粒⟧，可以抗各种⟦1|抗生素⟧以及重金属等离子。"], [1, "③产⟦2|细菌⟧素和⟦1|抗生素⟧的⟦1|质粒⟧。"], [1, "④具有⟦2|生理⟧功能的⟦1|质粒⟧，如⟦1|固氮⟧、降解辛烷和产生色素等。"], [1, "③产毒质粒，能生产⟦1|外毒素⟧、K抗原、⟦1|内毒素⟧等。"], [0, "（3）⟦1|质粒⟧的理论和实际意义质粒具有许多有利于基因工程操作的优点："], [1, "①体积小，便于DNA的⟦1|分离⟧和操作；"], [1, "②呈环状，使其在化学⟦1|分离⟧过程中能保持性能稳定；"], [1, "③有不受核基因组控制的独立复制起始点："], [1, "④拷贝数多，使外源DNA可很快扩增；"], [1, "③存在抗药性基因等选择性标记，便于含⟦1|质粒⟧克隆的检出和选择。"]], 0],
[0, 7, 1, 2, "简述基因突变的特点。", [[0, "（1）基因⟦1|突变⟧泛指⟦2|细胞⟧内（或⟦1|病毒⟧体内）⟦2|遗传⟧物质的分子结构或数量突然发生的可遗传的变化，可自发或诱导产生。狭义的突变专指基因突变（点突变），广义的突变则包括基因突变和染色体畸变。"], [0, "（2）基因⟦1|突变⟧的特点"], [1, "①自发性：指可自发地产生各种⟦1|遗传⟧性状的⟦1|突变⟧；"], [1, "②不对应性：指⟦1|突变⟧性状与引起该突变的原因（如用紫外线照射或化学⟦1|诱变⟧剂诱变）间无直接对应关系："], [1, "③ 稀有性：通常自发⟦1|突变⟧的概率在10-6-10-9之间；"], [1, "④我独立性：某基因的⟦1|突变⟧率不受他种基因突变率的影响；"], [1, "③可⟦1|诱变⟧性：自发⟦1|突变⟧率可因诱变剂的影响而大为提高；"], [1, "③租稳定性：发生基因⟦1|突变⟧后产生的新⟦1|遗传⟧性状是稳定的、可遗传的；"], [1, "①可逆性：野生型⟦1|菌株⟧的某一性状既可发生正向⟦1|突变⟧，也可发生相反的回复突变"]], 0],
[0, 7, 1, 3, "试述用Ames法检测致癌、致突变、致畸变物质的理论依据、方法要点和优缺点？", [[0, "（1）用Ames法检测致癌、致⟦1|突变⟧、致畸变物质的理论依据鼠伤寒沙门氏菌的组氨酸缺陷型（his-）菌株在基本⟦1|培养基⟧[-I的平板上不能生，如发生回复突变则能⟦2|生长⟧。"], [0, "（2）用Ames法检测致癌、致突变、致畸变物质的方法大致在含待测可疑“三致”物的试样中，加入鼠肝匀浆液，经一段时间保温后，吸入滤纸片中，然后将滤纸片放置于含有鼠伤寒沙门氏菌的组氨酸⟦2|营养⟧缺陷型（his\"）菌株的基本⟦1|培养基⟧[一]的平板中央进行⟦2|培养⟧。经培养后，出现三种情况：在平板上无大量⟦1|菌落⟧产生，说明试样中不含诱变剂；"], [1, "② 在纸片周围有一抑制圈，其外才是大量⟦1|菌落⟧，说明试样中某⟦1|诱变⟧剂的浓度很高；在纸片周围即长大量菌落，说明诱变剂的浓度合适。某些物质本身并非诱变剂，但这种“前诱变剂”往往入动物体后经过生物化学修饰才变成诱变剂。"], [0, "（3）用Ames法检测致癌、致⟦1|突变⟧、致畸变物质的优缺点Ames法的优点：快速、准确和费用省等。"], [1, "② Ames法的缺点：⟦1|微生物⟧的DNA修复系统比哺乳动物简单，基因不如哺乳动物多，不能完全代表哺乳动物的实际情况。"]], 0],
[0, 7, 1, 4, "简述筛选抗药性突变株的方法。", [[0, "梯度平板法是定向筛选抗药性⟦1|突变⟧株的一种有效方法，通过制备琼脂表面存在药物浓度梯度的平板（由含药物的上半个斜面和不含有药物的下半个斜面分两次浇合而成），在其上涂布诱变处理后的⟦2|细胞⟧悬液、经⟦2|培养⟧后再从其上选取抗药性⟦1|菌落⟧等步骤，就可定向筛选到相应抗药性突变株。"]], 0],
[0, 7, 1, 5, "简述筛选营养缺陷型的方法。", [[0, "（1）⟦2|营养⟧缺陷型是指野生型菌株经诱变剂处理后，由于发生了丧失某酶合成能力的⟦1|突变⟧，因而只能在加有该酶合成产物的⟦1|培养基⟧中才能⟦2|生长⟧的一类突变菌株。即其不能在基本培养基上生长，而只能在完全培养基或相应的补充培养基上生长。"], [0, "（2）⟦2|营养⟧缺陷型的筛选步骤第一，诱变剂处理；第二，淘汰野生型：包括⟦1|抗生素⟧法和菌丝过滤法：第三，检出缺陷型：包括夹层培养法、限量补充培养法逐个检出法和影印培养法。其中影印平板法是指将诱变剂处理后的⟦2|细胞⟧群涂布在完全⟦1|培养基⟧平板上，经培养后，使其长出许多菌落。然后用无菌的影印接种工具，把此平板上的全部菌落转印到另一基本培养基平板上。经培养后，比较前后两个平板上长出的菌落。如果发现在前一培养基平板上的某一部位长有菌落，而在后一平板上的相应部位却呈空白，说明这就是一个营养缺陷型突变株。第四，鉴定缺陷型可借生长谱法进行。生长谱法是指在混有供试菌的基本培养基平板表面，点加微量营养物，视某营养物的周围有否长菌来确定该供试菌的营养要求的一种快速、直观的方法。"]], 0],
[0, 7, 1, 6, "简述原核生物基因重组的四种方式。", [[0, "⟦1|基因重组⟧是指两个独立基因组内的⟦2|遗传⟧基因，通过一定的途径转移到一起，形成新的稳定基因组的过程，原核生物中基因重组包括：转化、转导、接合和⟦1|原生质体⟧融合四种方式。"], [0, "（1）⟦1|转化⟧转化是指受体菌直接吸收供体菌的DNA片断而获得后者部分⟦1|遗传⟧性状的现象，通过转方式而形成的杂种后代称转化子。"], [0, "（2）⟦1|转导⟧转导是指通过缺陷⟦1|噬菌体⟧的媒介，把供体⟦2|细胞⟧的小片段DNA携带到受体细胞中，通过交换与整合，使后者获得前者部分⟦2|遗传⟧性状的现象。转导的类型分为普遍转导和局限转导。"], [0, "（3）接合接合是指供体菌通过性⟦1|菌毛⟧与受体菌直接接触，把F⟦1|质粒⟧或其携带的不同长度的核基因组片断传递给后者，使后者获得若干新⟦2|遗传⟧性状的现象。大肠杆菌的⟦1|4种⟧接合型菌株：F+、F-、Hf菌株、F'菌株。"], [0, "（4）⟦1|原生质体⟧融合原生质体融合是指通过人为的方法使⟦1|遗传⟧性状不同的两个⟦2|细胞⟧的原生质体进行融合，借以获得兼有双亲遗传形状的稳定重组子的过程。"]], 0],
[0, 7, 1, 7, "比较普遍转导和局限转导。", [[0, "（1）普遍⟦1|转导⟧是指通过极少数完全缺陷⟦1|噬菌体⟧对供体菌基因组上任何小片段DNA进行“误包”，而将其⟦2|遗传⟧性状传递给受体菌的现象。而局限转导是指通过部分缺陷的温和噬菌体把供体菌的少数特定基因携带到受体菌中，并与后者的基因组整合、重组，形成转导子的现象。"], [0, "（2）两者比较如表所示："], [0, "普遍⟦1|转导⟧：发生 自然发生；⟦1|噬菌体⟧形成 错误包装；内含 DNA 只含供体菌 DNA；转导性状 供体的任何性状；转导过程 通过交换使供体 DNA 替换了受体 DNA 的同源区；转导子 稳定"], [0, "局限⟦1|转导⟧：发生 人工诱导；⟦1|噬菌体⟧形成 噬菌体不正常切割；内含 DNA 同时具有噬菌体和宿主 DNA；转导性状 多为前噬菌体邻近两端的 DNA 片段；转导过程 供体 DNA 插入；转导子 不稳定"]], 0],
[0, 7, 1, 8, "何为溶原转变？简述其特点。", [[0, "溶源转变是指当正常的温和⟦1|噬菌体⟧感染其宿主而使其发生溶源化时，因噬菌体基因整合到宿主的核基因组上，而使宿主获得了除免疫性外的新⟦2|遗传⟧性状的现象。其特点如下：第一，不携带任何外源基因的正常噬菌体；第二，是噬菌体基因而不是供体菌的基因提供了宿主的新性状；第三，新性状是宿主⟦2|细胞⟧溶源化时的表型，而不是经遗传重组形成的稳定⟦1|转导⟧子；第四，获得的性状可随噬菌体的消失而同时消失。"]], 0],
[0, 7, 1, 9, "试比较 E.coli 的 F+、F-、F'和 Hfr 菌株的特点，并简述它们间的相互转化关系。", [[0, "（1）E.coli的F+、F-、F'和Hfr⟦1|菌株⟧的特点"], [1, "①F菌株为雄性菌株，⟦2|细胞⟧内存在一至几个F⟦1|质粒⟧，并在细胞表面着生一至几条性⟦1|菌毛⟧"], [1, "②F'菌株为雌性菌株，⟦2|细胞⟧内不含F⟦1|质粒⟧，细胞表面也无性⟦1|菌毛⟧。"], [1, "③Hfr⟦1|菌株⟧为雄性菌株，⟦2|细胞⟧内含F⟦1|质粒⟧，但质粒整合到大肠杆菌⟦2|染色⟧体上。"], [1, "①F'⟦1|菌株⟧为雄性菌株，⟦2|细胞⟧内含F'⟦1|质粒⟧，是整合到大肠杆菌⟦2|染色⟧体上的质粒发生不正常切离，而使F质粒带有一段大肠杆菌的基因片段，因此称为F'质粒，含有这样质粒的菌株称为F\"菌。"], [0, "（1）四种⟦1|菌株⟧的相互⟦1|转化⟧关系"], [1, "①F*%F\"结果：F*的F因子向F-⟦1|菌株⟧转移；F*菌株⟦1|染色⟧体一般不被转移；受体⟦2|细胞⟧F-变成F+菌株。"], [1, "②HfrxF\"结果：Hfr的F因子不易转入F-⟦1|菌株⟧；Hfr⟦1|染色⟧体片段与F-菌株的染色体基因发生高频率重组；受体⟦2|细胞⟧F-不变成 Hfr菌株。"], [1, "③FxF一结果：F'因子向F⟦1|菌株⟧转移；F\"因子的部分⟦1|染色⟧体一同转移；受体⟦2|细胞⟧F变成F菌株。"]], 0],
[0, 7, 1, 10, "简述真核生物基因重组的方式。", [[0, "⟦1|基因重组⟧是指两个独立基因组内的⟦1|遗传⟧基因，通过一定的途径转移到一起，形成新的稳定基因组的过程，真核生物中基因重组包括有性杂交和准性杂交两种方式。"], [0, "（1）有性杂交：是指不同⟦1|遗传⟧型的两性⟦2|细胞⟧间发生的⟦1|接合⟧和随之进行的染色体重组，进而产生新遗传型后代的一种育种技术。"], [0, "（2）准性生殖：是一种在同种而不同菌株的体⟦2|细胞⟧间发生的融合，可不借助减数分裂而导致低频率⟦1|基因重组⟧并产生重组子。准性生殖是在自然条件下，真核⟦2|微生物⟧体细胞间的一种自发性的⟦1|原生质体⟧融合现象。"]], 0],
[0, 7, 1, 11, "简述基因工程的定义和基本操作过程。", [[0, "（1）基因工程的定义：是指人们利用分子生物学的理论和技术，自觉设计、操纵、改造和重建⟦1|细胞⟧的基因组，从而使生物体的⟦2|遗传⟧性状发生定向变异，以最大限度地满足人类活动的需要。这是一种自觉的、可人为操纵的体外DNA重组技术，是一种可达到超远缘杂交的定向育种新技术。"], [0, "（2）基本操作第一、目的基因的取得。主要有⟦1|3条⟧途径。分别为从适当的供体生物包括⟦1|微生物⟧、动物或植物中提取；通过反转录酶的作用，由mRNA合成cDNA（互补DNA）；由化学合成方法合成有特定功能的目的基因。第二、优良载体的选择。优良载体的具备条件：是一个相对分子质量较小、结构清楚、具百我复制能力的复制子：能在受体⟦2|细胞⟧内大量扩增；载体上最好只有一个限制性核酸内切酶的切口，使目的基因能固定地整合到载体DNA的一定位置上；其上必须有一种选择性遗传标记。以便及时高效地选出\"程菌\"或工程细胞”。第三、目的基因与载体DNA的体外重组"], [1, "①工具⟦1|酶⟧：限制性内切⟦2|核酸⟧酶、连接酶"], [1, "②过程：采用限制性内切⟦2|核酸⟧酶的处理或人为地在DNA的3'端接上polyA和polyT，就可使参与重组的两个DNA分子产生互补黏性末端。然后两者进行退火”。凡与黏性末端上碱基互补的片段，就会因氢键的作用而彼此吸引，重新形成双链。这时，在外加连接酶的作用下，目的基因就与载体DNA进行共价结合，形成一个完整的有复制能力的环状重组载体。第四、重组载体导入受体⟦2|细胞⟧质粒可用转化法、⟦1|噬菌体⟧或⟦1|病毒⟧可用转染法；DNA片段可用基因枪法和花粉管通道法等。第五、重组受体细胞的筛选和鉴定第六、“工程菌\"或“工程细胞\"的大规模培养。"]], 0],
[0, 7, 1, 12, "简述CRISPR免疫的原理和过程", [[0, "（1）CRISPR全名为成簇有规律间隔的回文重复序列，又称CRISPR/Cas系统，是广泛存在于原核生物染色体上的一种串联重复DNA序列，它具有清除外来有害⟦2|核酸⟧（⟦1|病毒⟧、⟦1|质粒⟧等）的特殊免疫系统。⟦2|细菌⟧或古菌可利用这些基因序列对外敌“存档”，以便伺机反击，CRISPR免疫系统由以下3部分组成。"], [1, "①CRISPR相关基因位于DNA双链上，是由一些高度保守的同向重复序列（re-peat，21-48bp）和间隔序列（spacer，26-72bp）构成的R-S⟦1|结构⟧"], [1, "②CrRNA即上述间隔序列的转录产物。crRNA通过碱基配对与traRNA（反向活化RNA，transactivatingRNA）相结合，形成的tracrRNA复合物可引导Cas9到与crRNA配对的双链DNA的靶点上，以完成特异性识别和剪切功能。"], [1, "③Cas蛋白（CRISPRassociatedprotein）具有剪切靶标DNA的功能，俗称分子剪刀”。通过Cas剪切，既可敲除不需要的基因，也可将新基因插入到新间隔中，在基因编辑中常用的Cas9，来自酿脓链球菌的Cas9基因，尤其适合哺乳动物和人体⟦1|细胞⟧的基因编辑工作。"], [0, "（2）CRISPR⟦1|免疫⟧功能的三阶段1）适应阶段通过CRISPR相关基因把外源DNA的同源片段插入至前导序列与第一段重复序列间，经复制后，形成一新R-S单元，以作记忆留存。"], [1, "2）表达阶段"], [1, "①⟦1|细菌⟧⟦2|染色⟧体上的CRISPR基因区经转录和翻译，形成一条crRNA前体链"], [1, "②它被Cas剪切成许多crRNA片段"], [1, "③crRNA与Cas相结合，形成有向导功能的Cas-crRNA复合体，执行寻找DNA链上靶标的功能。3）干扰阶段crRNA作为Cas-crRNA的向导，待找到目标位点后，与外源DNA的前间隔序列发生互补配对，再进行定点剪切或添加等操作。"]], 0],
[0, 7, 1, 13, "简述利用CRISPR/Cas9进行基因编辑的要点。", [[0, "基因编辑（gene editing）是一类人为定点改造生物基因组的新技术。CRISPR/Cas9是一种建立在上述⟦2|细菌⟧和⟦1|古菌⟧的CRISPR⟦1|免疫⟧机制基础上的第三代基因编辑技术。它利用crRNA作向导，借助Cas9对目的基因的特定位点进行剪切，添加等精确操作，达到对活⟦2|细胞⟧的基因组进行简便、快速、高效改造的目的。CRISPR/Cas9的技术要点：先设计并合成crRNA和tracrRNA，使之与Cas9形成复合物，然后用显微注射器注入待“编辑\"的活细胞中。经crRNA引导，复合物便整合到双链DNA的靶标上，随即由Cas9打弃卉DNA双链，对目的基因作定点剪切，修改、替换或添加，从而使原有基因组得到精确的改造和优化。"]], 0],
[0, 8, 0, 1, "嗜极菌（extremophiles）", [[0, "又称极端⟦1|微生物⟧。依赖于一些极端环境才能正常⟦2|生长⟧⟦2|繁殖⟧的微生物，如生活于高温、低温、高酸、高碱、高盐或高压水体中的相应微生物一一嗜热菌、嗜冷菌、嗜酸菌、嗜碱菌、⟦1|嗜盐⟧菌或嗜压菌等。"]], 0],
[0, 8, 0, 2, "嗜极酶（extremeenzymes）", [[0, "嗜极⟦1|酶⟧是由嗜极菌产生的、适应于极端条件的酶类，主要指各种嗜热菌产生的⟦1|耐热⟧酶，如由水生栖热菌产生的可用于PCR技术中的TaqDNA聚合酶等。"]], 0],
[0, 8, 0, 3, "条件致病菌（opportunist）", [[0, "在微⟦1|生态⟧失调状态下，原先属于正常菌群中的一些非⟦2|致病⟧菌（如大肠杆菌、脆弱拟杆菌或白假丝酵母等）因伺机大量⟦2|繁殖⟧或转移至其他部位而引起宿主致病者，称条件致病菌。"]], 0],
[0, 8, 0, 4, "微生态制剂（probiotics）", [[0, "是依据微⟦1|生态⟧学理论而制成的含有有益菌的活菌制剂，其功能在于维持宿主的微生态平衡、调整宿主的微生态失调并兼有其他确切的保健功能。微生态制剂主要有益生菌剂和益生元两类。"]], 0],
[0, 8, 0, 5, "氮素循环（nitrogen cycle）", [[0, "指不同分子形式中的氮元素，在⟦2|生态⟧系统和地球生物化学循环中的地位及其⟦1|转化⟧规律。在氮素循环的⟦1|8个⟧环节中，有⟦1|6个⟧只能通过⟦2|微生物⟧才能进行，故微生物是自然界氮素循环中的核心生物。"]], 0],
[0, 8, 0, 6, "产甲烷菌（methanogens）", [[0, "产甲烷菌是一类必须生活在严格⟦1|厌氧⟧生境下并利用CO2和H2产生甲烷的古生菌。"]], 0],
[0, 8, 0, 7, "富营养化（eutrophication）", [[0, "是指水体中因氮、磷等元素含最过高而导致水体表层⟦1|蓝细菌⟧和藻类过度⟦1|生长⟧繁殖的现象。这时，下层水体不仅缺光少氧，而且因大量死藻被⟦2|细菌⟧分解而进一步造成缺氧和有毒的环境。水华和赤潮就是由水体的富⟦2|营养⟧化而造成的两类典型的水污染现象。"]], 0],
[0, 8, 0, 8, "水华（water bloom）", [[0, "指发生在池、河、江、湖或水库等淡水水体中因富⟦1|营养⟧化而引起的藻类过度⟦2|繁殖⟧的自然现象。富营养化后水体中的⟦1|蓝细菌⟧和浮游藻类就会迅速增殖，从而在水面上形成一薄层由蓝绿色的藻体和泡沫组成的水华。"]], 0],
[0, 8, 0, 9, "赤潮（red tide）", [[0, "指发生在河口、港湾或浅海等成水区的水体，因富⟦1|营养⟧化而导致其中的⟦1|蓝细菌⟧，浮游植物和原生动物的暴发性增殖、聚集，进而产生毒素，引发水体呈现红、棕色等异常的有害自然现象。"]], 0],
[0, 8, 0, 10, "发光细菌（luminescentbacteria）", [[0, "发光⟦2|细菌⟧是一类G-、长有极生⟦1|鞭毛⟧的杆菌或弧菌，兼性⟦1|厌氧⟧，在有氧条件下能发出波长为475~⟦1|505nm⟧的荧光的细菌。"]], 0],
[0, 8, 1, 1, "为什么说微生物在自然界氮素循环中起着关键的作用？", [[0, "⟦2|微生物⟧在自然界氮素循环中起关键的作用的原因：在氮素循环的⟦1|8个⟧环节（生物⟦1|固氮⟧、硝化作用、硝酸盐同化作用、氨化作用、异化性硝酸盐还原作用、反硝化作用、亚硝酸氨化作用）中，有6个只有通过微生物才能进行，特别是为整个生物圈开辟氮索⟦2|营养⟧源的生物固氮作用，更属原核生物的“专利”，微生物是自然界氮素循环中的核心生物。微生物在自然界氮素循环中起关键的作用具体表现在以下几个方面。"], [0, "（1）生物⟦1|固氮⟧生物界中只有原核生物才具固氮能力，它能够将大气中的分子氮催化还原成氨。"], [0, "（2）硝化作用氨态氮经硝化⟦1|细菌⟧的氧化，转变为硝酸态氮的过程。"], [0, "（3）硝酸盐同化作用硝酸盐被重新还原成NH3后再被利用于合成各种含氮有机物，即为硝酸盐的同化作用。几乎一切绿色植物和多种⟦1|微生物⟧都可利用硝酸盐作氮素⟦2|营养⟧源。"], [0, "（4）氨化作用即含氮有机物经⟦1|微生物⟧的分解产生氨的作用。氨化作用在农业生产上十分重要。"], [0, "（4）铵盐同化作用由所有绿色植物和许多⟦1|微生物⟧进行的以铵盐作为营养，是合成氨基酸、⟦2|蛋白质⟧、核酸和其他含氮有机物的作用。"], [0, "（6）异化性硝酸盐还原作用指硝酸离子作为⟦1|呼吸链⟧的末端⟦2|电子⟧受体从而被还原为亚硝酸的反应。有时亚硝酸还可进一步通过亚硝酸氨化作用而产生氨或进一步通过反硝化作用产生氮气、NO或N2O。能进行异化性硝酸还原作用的⟦2|微生物⟧都是一些兼性⟦1|厌氧⟧菌"], [0, "（7）反硝化作用反硝化作用又称脱氮作用。广义的反硝化作用是指由硝酸还原成NO2并进一步还原成N的过程，因而把异化性硝酸盐还原作用也包括在内了。狭义的反硝化作用仅指由亚硝酸还原成N的过程。"], [0, "（8）亚硝酸氨化作用亚硝酸通过异化性还原可以经羟氨而转变成氨，具有这种作用的⟦1|微生物⟧主要是一些⟦2|细菌⟧，如气单胞菌属、⟦1|芽孢⟧杆菌等。"]], 0],
[0, 8, 1, 2, "试简介微生物在自然界碳元素循环中的作用。", [[0, "碳素循环包括CO2的固定和CO2的再生。⟦1|微生物⟧在自然界碳素循环中的作用如下："], [0, "（1）⟦2|微生物⟧在CO2的固定中的作用：一些光能自养微生物，如藻类、光合⟦2|细菌⟧和⟦1|蓝细菌⟧等可通过光合作用直接利用自然界中的CO2合成有机碳化物，进而⟦1|转化⟧为各种有机物：化能自养菌能利用化学能同化CO2。微生物合成的有机物在数量和规模上虽远不及绿色植物，但在一些特殊环境（如植物难以生存的水域）中具有相当重要的作用。"], [0, "（2）⟦1|微生物⟧在CO2的再生中的作用：⟦1|异养⟧微生物可以利用动植物和微生物尸体中的有机物，⟦2|细菌⟧是有机物最主要的利用者，他们在利用这些有机物的同时，不断地将其分解以获取生长所需的能量，同时产生大量CO2。自然界中的有机物的分解则以微生物为主"]], 0],
[0, 8, 1, 3, "为什么说土壤是人类最丰富的菌种资源库？", [[0, "土壤具备了绝大多数⟦1|微生物⟧生长发育所需要的⟦2|营养⟧、空气、酸碱度、温度等条件，因此称为微生物良好的生存环境。"], [0, "①土壤含有极为丰富的有机物。可以为绝大多数⟦1|微生物⟧提供所需的⟦2|碳源⟧和能源"], [0, "②土壤含有相当齐全的矿物质元素，可供⟦1|微生物⟧⟦2|生长⟧所需"], [0, "③土壤的pH值范围与大多数⟦1|微生物⟧适宜⟦2|生长⟧的pH范围相一致，一般pH在5.5-8.5之间"], [0, "④土壤能为⟦1|微生物⟧提供有氧和无氧的条件，都可适应微生物⟦2|生长⟧。"], [0, "③土壤温度变化范围也与⟦1|微生物⟧的⟦2|生长⟧适宜温度范围相一致。"]], 0],
[0, 8, 1, 4, "如何从土壤筛选所需要的菌种？", [[0, "从土壤中筛选所需⟦1|菌种⟧的一般步骤：采集菌样→富集⟦1|培养⟧→纯种⟦2|分离⟧→性能测定。"], [0, "①采集菌样：从适合的环境采集菌样。"], [0, "②富集培养：设仅适合待分离⟦1|微生物⟧旺盛⟦2|生长⟧的特定环境条件，使其群落中的数量大大增加，从而分离出所需微生物。"], [0, "③纯种分离：接种前要对⟦1|培养基⟧进行⟦1|灭菌⟧处理。在整个⟦2|微生物⟧的分离和⟦2|培养⟧中，一定要注意在无菌条件下进行。纯化微生物培养的接种方法包括稀释涂布平板法、划线平板法等。"], [0, "④性能测定；"], [0, "③⟦1|菌种⟧保藏。"]], 0],
[0, 8, 1, 5, "沼气发酵可分几个阶段？各阶段有何特点？有何微生物参与？试讨论利用污水生产氢和有机酸的可能途径。", [[0, "沼气又称生物气，是一种混合可燃气体主要成飞为甲烷，另有少量H、N和CO2。其生物化学的本质是产甲烷菌在⟦1|厌氧⟧条件下，利用H和还原CO2等碳源营养物质以产生⟦2|细胞⟧物质、⟦2|能量⟧和甲烷的过程，可以分为⟦1|3个⟧阶段"], [0, "（1）沼气⟦1|发酵⟧各阶段的特点及⟦1|微生物⟧参与的种类"], [1, "①水解阶段由多种厌氧或兼性厌氧的水解性或⟦1|发酵⟧性⟦2|细菌⟧通过胞外⟦2|酶⟧的作用，把污泥、污水中的各类聚合物进行酶解，⟦1|转化⟧成可溶于水的物质。本阶段的水解性细菌，主要包括梭菌属、拟杆菌属、丁酸弧菌属、优杆菌属和双歧杆菌属等专性厌氧细菌：兼性厌氧菌包括链球菌属和一些肠道菌等。"], [1, "②产酸阶段由产氢产乙酸⟦1|细菌⟧群利用第一阶段产生的各种有机酸，分解成乙酸、H2和CO2。产氢产乙酸细菌群在甲烷⟦1|发酵⟧中的⟦2|生理⟧功能是将第一阶段的发酵产物如丙酸等三碳以上的有机酸、芳香族酸和醇类等，氧化分解成乙酸和分子氢"], [1, "③产气阶段由严格⟦1|厌氧⟧的产甲烷菌群来完成。这群⟦2|细菌⟧只能利用一碳化合物（CO2、甲醇、甲酸、甲基胺和CO）、乙酸和⟦2|氢⟧气形成甲烷。在其形成的甲烷中，约有⟦1|30%⟧来自H的氧化和CO2的还原；另外70%左右则来自乙酸盐。在甲烷⟦1|发酵⟧的三个阶段中，产甲烷菌形成甲烷是关键所在；产甲烷菌也是自然界碳素循环中厌氧生物链的最后一个成员，对自然界物质循环起着重要的作用。"], [0, "（2）利用污水生产⟦1|氢⟧和有机酸的可能途径"], [1, "①氧化⟦1|氢⟧的产甲烷菌群，将H2和CO2等一碳化合物⟦1|转化⟧为CH4。"], [1, "②裂解乙酸的产甲烷菌群，可通过裂解乙酸产生CH4。"]], 0],
[0, 9, 0, 1, "传染（infection）", [[0, "指外源性病原体或内源性病原体突破其宿主的三道⟦1|免疫⟧防御体系（机械防御、非特异性免疫和特异性免疫）后，在宿主的特定部位定植、⟦1|生长⟧⟦2|繁殖⟧或（和）产生酶及毒素，进而引起一系列病理⟦2|生理⟧的过程。"]], 0],
[0, 9, 0, 2, "外毒素（exotoxin）", [[0, "是病原菌在其⟦1|生长⟧过程中向外分泌的一类毒性⟦2|蛋白质⟧，包括⟦2|酶⟧、酶原或毒蛋白，如白喉毒素、破伤风毒素和肉毒毒素等。"]], 0],
[0, 9, 0, 3, "内毒素（endotoxin）", [[0, "即⟦1|革兰氏⟧阴性⟦2|细菌⟧外壁层的脂多糖（LPS）。因它只在⟦2|细胞⟧死亡后经自溶或人工裂解时才释放，故称⟦1|内毒素⟧。其毒性较弱，但可引起动物发高烧等病症。"]], 0],
[0, 9, 0, 4, "类毒素（toxoid）", [[0, "是⟦2|细菌⟧⟦1|外毒素⟧用⟦1|0.3%⟧~⟦1|0.4%⟧甲醛溶液作脱毒处理后的产物。类毒素无毒性但仍保留了外毒素的⟦1|免疫⟧原性，故是优良的免疫预防用生物制品。如白喉类毒素、破伤风类毒素或肉毒类毒素等。"]], 0],
[0, 9, 0, 5, "抗毒素（antitoxin）", [[0, "是一类能抗⟦1|外毒素⟧的⟦1|抗体⟧。将类毒素作⟦1|抗原⟧注入机体后，即可使该机体产生对相应外毒素具有特异性免疫反应的抗体（抗毒素）。作治疗用的抗毒素可由马等动物生产"]], 0],
[0, 9, 0, 6, "免疫力（immunity）", [[0, "经典的概念是指机体免除传染性疾病的能力。现代⟦1|免疫⟧概念认为，免疫是机体识别和排除⟦1|抗原⟧性异物的一种保护性功能，在正常条件下，它对机体有利；在异常条件下，也可损害机体。"]], 0],
[0, 9, 0, 7, "非特异性免疫（nonspecific immunity）", [[0, "又称先天⟦1|免疫⟧或自然免疫。在生物长期进化中形成，属先天即有、相对稳定、无特殊针对性的对付病原体的天然抵抗力。如人类的屏障⟦1|结构⟧、吞噬⟦2|细胞⟧的吞噬功能、正常组织和体液中的抗菌物质以及有保护性的炎症反应等。"]], 0],
[0, 9, 0, 8, "特异性免疫（specific immunity）", [[0, "又称获得性⟦1|免疫⟧。是机体从后天获得的一种识别非自身和自身的⟦1|抗原⟧物质、对前者产生免疫应答，以保证机体内环境稳定的能力。包括体液免疫系统和⟦2|细胞⟧免疫系统两类。"]], 0],
[0, 9, 0, 9, "巨噬细胞（macrophage，M4）", [[0, "是一类存在于血液、淋巴和多种组织中的大型单核⟦2|细胞⟧，寿命长，可作变形虫状运动，对异物有吞噬和胞饮功能。巨噬细胞起源于骨髓干细胞。它在不同组织中有不同的名称功能很多，如吞噬和杀菌作用、⟦1|抗原⟧递呈作用、⟦1|免疫⟧调节作用和抗癌作用等。"]], 0],
[0, 9, 0, 10, "干扰素（interferon，IFN）", [[0, "干扰素是高等动物⟦1|细胞⟧在⟦1|病毒⟧或dsRNA等干扰素诱生剂的刺激下，所产生的一类具有高活性、广谱抗病毒能力的特异性糖蛋白。有 IFN-α、IFN-B、IFN-、IFN-α四类。"]], 0],
[0, 9, 0, 11, "免疫应答（immuneresponse）", [[0, "⟦1|免疫⟧应答是一类发生在活生物体内的特异性免疫的系统反应过程。它是一个从⟦1|抗原⟧的刺激开始，经过抗原特异性淋巴⟦2|细胞⟧对抗原的识别（感应），使淋巴细胞发生活化、增殖和分化等一系列变化，最终表现出相应的体液免疫或（和）细胞免疫效应的过程。"]], 0],
[0, 9, 0, 12, "细胞免疫（cellularimmunity）", [[0, "是指机体在⟦1|抗原⟧刺激下，一类小淋巴⟦2|细胞⟧（依赖胸腺的T细胞）发生增殖、分化，进而直接攻击靶细胞或间接地释放一些淋巴因子的⟦1|免疫⟧作用。"]], 0],
[0, 9, 0, 13, "体液免疫（humoralimmunity）", [[0, "是指机体受⟦1|抗原⟧刺激后，来源于骨髓的一类小淋巴⟦2|细胞⟧（B细胞）进行增殖并分化为浆细胞，由它合成⟦1|抗体⟧并释放到体液中以发挥其⟦1|免疫⟧作用。"]], 0],
[0, 9, 0, 14, "抗原（antigen，Ag）", [[0, "是一类能诱导机体发生⟦1|免疫⟧应答并能与相应⟦1|抗体⟧或T淋巴⟦2|细胞⟧受体发生特异性免疫反应的大分子物质。"]], 0],
[0, 9, 0, 15, "抗原决定簇（antigenic determinant）", [[0, "是指位于⟦1|抗原⟧表面可决定抗原特异性的特定化学基团。它使抗原能与相应淋巴⟦2|细胞⟧上的抗原受体发生特异结合，从而可激活淋巴细胞并引起⟦1|免疫⟧应答。凡能与⟦1|抗体⟧相结合的抗原决定簇的总数，称为抗原结含价。"]], 0],
[0, 9, 0, 16, "抗体（antibody）", [[0, "是指高等动物体在⟦1|抗原⟧物质的刺激下，由浆⟦2|细胞⟧产生的一类能与相应抗原在体内外发生特异结合的⟦1|免疫⟧球蛋白。"]], 0],
[0, 9, 0, 17, "单克隆抗体（monoclonal antibody，McAb）", [[0, "是指由一纯系B淋巴⟦1|细胞⟧克隆经分化、增殖后的浆细胞所产生的单-成努、单-特异性的⟦1|免疫⟧球蛋白分子。"]], 0],
[0, 9, 0, 18, "杂交瘤技术（hybridoma technique）", [[0, "是指将B淋巴⟦2|细胞⟧和骨髓瘤细胞两者融合，获得既能产生单一⟦1|抗体⟧又能进行长期增殖的杂种细胞的技术。这种骨髓瘤的单克隆不仅具有快速增殖能力，而且能产生大量匀质、单克隆性质的任何⟦1|免疫⟧球蛋白。"]], 0],
[0, 9, 0, 19, "蛋白质免疫印迹（Westernblot）", [[0, "一种高特异和高分辨率分析⟦2|蛋白质⟧的⟦1|免疫⟧学技术。几种分子量不同的蛋白质（⟦1|抗原⟧）先经SDS-PAGE凝胶电泳⟦2|分离⟧出不同的条带，再转印至硝酸纤维薄膜上，然后用酶或同位素标记的⟦1|抗体⟧对条带进行显色（或放射自显影）和⟦2|鉴定⟧。此法兼有SDS-PAGE的高分辨率和免疫反应的高特异性等优点，常用于检测不同基因所表达的各种微量蛋白质抗原。"]], 0],
[0, 9, 0, 20, "疫苗（vaccine）", [[0, "用于预防传染病的⟦1|抗原⟧制剂称为疫苗。通常用钝化、弱化或无害的病原体或其产物制成，用以刺激机体产生保护性免疫力，以预防或控制传染病的流行。狭义的疫苗仅指用⟦1|病毒⟧、⟦1|立克次氏体⟧或螺旋体等⟦2|微生物⟧制成的生物制品；广义的疫苗包括菌苗和疫苗两类生物制品。而菌苗则仅指用⟦2|细菌⟧制成的生物制品。疫苗又可分活疫苗和死疫苗两类。"]], 0],
[0, 9, 1, 1, "简述人体对付病原体的侵袭主要三道防线。", [[0, "人体对付病原体的侵袭有三道防线。第一道防线是体表的屏障，第二道防线是体内的非特异性反应，第三道防线是特异性反应，即⟦1|免疫⟧应答。"], [0, "（1）体表的屏障通常病原体不能穿过皮肤和消化、呼吸、泌尿、生殖等管道的黏膜。皮肤的表面有一层死⟦1|细胞⟧（角质细胞），病原体不能在这种环境中生存，而且皮肤中的皮脂腺分泌的油脂也能抑制⟦1|真菌⟧和某些⟦2|细菌⟧。第一道防线包括身体表面的物理屏障和化学防御。"], [0, "（2）体内的非特异性反应如果病原体突破体表屏障，某些白⟦1|细胞⟧和血浆蛋白便会产生反应以对付任何侵犯人体的病原体，这种反应不是专门针对某种特定的病原体。"], [1, "①局灶性炎症反应：当皮肤破损后往往引起局灶性炎症反应。它有⟦1|4种⟧症状：疼痛、发红、肿胀和发热。皮肤破损可使病原⟦1|微生物⟧进入体内，引起中性白细胞和单核细胞进入受损伤的部位。单核细胞分化成巨噬细胞，和中性白细胞一样，吞噬⟦2|细菌⟧，然后由其溶酶体中的水解酶将它们消化。"], [1, "②补体系统：简称为补体，是指在人体血液中有一个复杂的具有酶活性的血浆蛋白系统，大约含⟦1|20种⟧⟦2|蛋白质⟧。补体被激活后，通过3种方式发挥作用：补体蛋白质聚合形成孔道复合体，嵌入病原体的⟦1|细胞膜⟧！使病原体死亡；直接附着在⟦2|细菌⟧的⟦1|细胞壁⟧上，增加细菌被吞噬的概率；刺激肥大细胞释放组胺，促进炎症反应。"], [1, "③干扰素：是受⟦1|病毒⟧⟦1|感染⟧的⟦2|细胞⟧所产生的能抵抗病毒感染的一组⟦2|蛋白质⟧。产生干扰素是机体的一种保护性反应。干扰素通过刺激自身和周围的细胞产生另一种能抑制病毒复制的蛋白质，从而抵抗感染。"], [0, "（3）人体对付病原体侵袭的第三道防线是特异性⟦1|免疫⟧，包括体液免疫和⟦1|细胞⟧免疫。"], [1, "①⟦2|细胞⟧⟦1|免疫⟧指机体在⟦1|抗原⟧刺激下，一类小淋巴细胞（依赖胸腺的T细胞）发生增殖、分化，进而直接攻击靶细胞或间接地释放一些淋巴因子的免疫作用。"], [1, "②体液免疫指机体受⟦1|抗原⟧刺激后，来源于骨髓的一类小淋巴⟦2|细胞⟧（B细胞）进行增殖并分化为浆细胞，由它合成⟦1|抗体⟧并释放到体液中以发挥其免疫作用。"]], 0],
[0, 9, 1, 2, "决定传染结局的三大因素是什么？简述三者间的相互关系。", [[0, "（1）决定传染结局的三大因素是病原体、宿主的⟦1|免疫⟧力、环境因素。"], [0, "（2）病原体侵入宿主后，按病原体、宿主与环境三方面力量的对比或影响的大小决定着传染的结局，所以病原体、宿主⟦1|免疫⟧力、环境因素三者间的相互关系："], [1, "①如果宿主的⟦1|免疫⟧力很强，而病原菌的毒力相对较弱，数量又较少，传染后只能引起宿主的轻微损害，且很快就将病原体彻底消灭，而基本上不会出现临床症状者，即为隐性⟦1|感染⟧；"], [1, "②如果病原菌与宿主双方都有一定优势，但病原菌仅被限制于某一局部且无法大量⟦1|繁殖⟧，两者长期处于相持的状态，即为带菌状态，如不注意，就会成为该传染病的传染源："], [1, "③如果宿主的⟦1|免疫⟧力较低，或入侵病原菌的毒力较强、数量较多，病原菌很快在体内⟦1|繁殖⟧并产生大量有毒产物，使宿主的⟦2|细胞⟧和组织蒙受严重损害，生理功能异常，于是就出现了一系列临床症状，即是显性传染或传染病。"]], 0],
[0, 9, 1, 3, "鲨试剂法测定内毒素的原理是什么？用此法代替家免法测内毒素（热原质）有何优点？", [[0, "⟦1|内毒素⟧是G-⟦2|细菌⟧⟦1|细胞壁⟧外层的组分之一，其化学成分是脂多糖（LPS）。"], [0, "（1）凿试剂法测定⟦1|内毒素⟧的原理鲨血中仅含一种变形⟦1|细胞⟧，其裂解产物可与G-⟦2|细菌⟧的内毒素（LPS）和脂磷壁酸（膜磷壁酸）等发生特异性和高灵敏度的凝胶化反应。"], [0, "（2）用鲨试剂法代替家兔法测⟦1|内毒素⟧（热原质）的优点用莹试剂法检测内毒素，具有灵敏、专一、准确、简便和快速等的优点。过去用家免试验法一般要2~3天才能获得结果，而鲨试剂法只要⟦1|1小时⟧即可。鲨试剂法已被广泛用于临床诊断，药品、生物制品和血制品检验，食品卫生监测，以及科学研究等许多领域中。"]], 0],
[0, 9, 1, 4, "试分析巨噬细胞在机体内的非特异性免疫和特异性免疫应答中的重要作用。", [[0, "巨噬⟦2|细胞⟧是一类存在于血液、淋巴和多种组织中的大型单核细胞（直径为10~⟦1|20um⟧），寿命长，可作变形虫状运动，并有吞噬和胞饮功能。巨噬细胞在机体内的非特异性⟦1|免疫⟧和特异性免疫应答中的重要作用如下："], [0, "（1）吞噬和杀菌作用通过多种胞内⟦1|酶⟧和胞外酶，杀灭、消化被吞入的病原体和异物。但当它在激活后的T⟦2|细胞⟧或其某些产物如巨噬细胞活化因子（MAF）的作用下，可使巨噬细胞激活，这时，它产生激活前所没有的非特异性的抗病原菌活性。"], [0, "（2）⟦1|抗原⟧递呈作用巨噬⟦2|细胞⟧可通过吞噬、处理及传递⟦1|3个⟧步骤β对外来抗原物质进行工以适应激活淋巴细胞的需要。"], [0, "（3）⟦1|免疫⟧调节作用巨噬⟦2|细胞⟧可在外来⟦1|抗原⟧刺激下，分泌多种可溶性生物活性物质，借此来调节免疫功能"], [0, "（4）抗癌作用激活后的巨噬⟦1|细胞⟧可通过非吞噬性的细胞毒作用，非特异性地抑制或杀伤癌细胞，也可协同特异性⟦1|抗体⟧或致敏T细胞产生的特异性细胞因子抑制或杀伤癌细胞。"]], 0],
[0, 9, 1, 5, "何谓淋巴细胞杂交瘤？如何制备？有何用处？", [[0, "（1）淋巴⟦1|细胞⟧杂交瘤的定义淋巴细胞杂交瘤又称杂交瘤，是指由B淋巴细胞和骨髓瘤细胞，两者融合而成的一种既能在体内外大量增殖，又能产生大量McAb的杂种细胞。"], [0, "（2）制备淋巴⟦1|细胞⟧杂交瘤的步骤"], [1, "①选择亲本⟦2|细胞⟧株a.第一种亲本细胞骨髓瘤细胞，必须事先选择HGPRT酶缺陷型细胞或TK酶缺陷型细胞，因前者不能利用外源性次黄嘌呤来合成本身⟦2|核酸⟧中所需要的嘌呤，而内源性嘌呤和嘧啶的合成，又被Apr（氨基蝶呤）所阻断，故在HAT⟦1|培养基⟧上会死亡；而后者可阻断dTMP的合成，故也可使亲本骨髓瘤细胞因不能在HAT上舍成核酸而死亡。b.第二种亲本细胞-B淋巴细胞，是用SRBC先⟦1|免疫⟧小白鼠，待其在脾内形成激活的B淋巴细胞后，取出脾脏，制成B淋巴细胞悬液。"], [1, "②混合双亲⟦1|细胞⟧将B淋巴细胞与骨髓瘤细胞以2：1至10：1比例混合。"], [1, "③促进⟦1|细胞⟧融合早期用仙台⟦1|病毒⟧，近年来都用PEG作融合剂。"], [1, "④淘汰未融合的亲本⟦1|细胞⟧把经融合剂处理后的细胞分装到塑料板孔内，在HAT选择性培养液中培养两周左右，未经融合的亲本细胞因无法合成⟦2|核酸⟧而死亡。杂交后的融合子经过产物的鉴定，选出优良的McAb产生株。"], [1, "③杂交瘤的扩大⟦1|培养⟧优良淋巴⟦2|细胞⟧杂交瘤细胞株的大量培养：可将它们注射到动物体内去增殖，也可在组织培养瓶或新型的细胞培养罐中进行大量培养。"], [0, "（3）淋巴⟦1|细胞⟧杂交瘤的应用用于单克隆⟦1|抗体⟧的制备。"]], 0],
[0, 9, 1, 6, "简述免疫球蛋白的结构。", [[0, "（1）⟦1|免疫⟧球蛋白的定义：凡具有⟦1|抗体⟧活性以及与抗体有关的各种球蛋白。"], [0, "（2）典型Ig分子的⟦1|结构⟧："], [1, "①Ig分子是有一长一短的两对多肽链对称排列而成的一个呈Y形对称的分子。近对称轴的一对较长肽链称为重链或H链，外侧的一对较短肽链称为轻链或L链。"], [1, "②占重链1/4和轻链1/2的区域称可变区或V区，这一区域中的氨基酸顺序是可变的；占重链3/4和轻链1/2的区域则称恒定区或C区，这一区域中的氨基酸顺序是恒定的。"], [1, "③轻链与重链间和重链与重链间分别由二硫键相连接，"], [1, "④在重链的中央处约有⟦1|30个⟧氨基酸残基组成了一个能使Ig分子自由折叠的区域，称为铰链区。铰链区含有较多的脯氨酸，富有弹性。"]], 0],
[0, 10, 0, 1, "双名法（binomial nomenclature）", [[0, "指一个物种的学名由前面一个属名（generic name）和后面一个种名加词（specificepithet）两部分组成。属名的词首须大写，种名加词的字首须小写（包括由人名或地名等专用名词衍生的）。出现在⟦1|分类⟧学文献中的学名，在上述两部分之后还应加写3项内容，即首次定名人（正体字，用括号括住）、现名定名人（正体字）和现名的定名年份。"]], 0],
[0, 10, 0, 2, "三域分类学说（Three-domainsystem）", [[0, "通过对大量⟦1|微生物⟧和其他生物进行16SrRNA和18SrRNA的寡核苷酸测序，并比较其同源性水平后，提出了一个与以往各种界级⟦2|分类⟧不同的新系统，称为三域学说。三个域指的是⟦2|细菌⟧域、⟦1|古菌⟧域和真核生物域。"]], 0],
[0, 10, 0, 3, "菌株（strain）", [[0, "又称品系（在非⟦2|细胞⟧型的⟦1|病毒⟧中则称毒株或株），它表示任何由一个独立分离的单细胞（或单个病毒粒）⟦2|繁殖⟧而成的纯遗传型群体及其一切后代。因此，一种⟦2|微生物⟧的每一不同来源的⟦1|纯培养⟧物或纯分离物均可称为某菌种的一个⟦1|菌株⟧。"]], 0],
[0, 10, 0, 4, "GC 比 （GC ratio）", [[0, "又称DNA碱基比例，是指（G+C）mo⟦1|1%⟧值，简称\"GC比\"，它表示DNA分子中鸟嘌呤（G）和胞嘧啶（C）所占的摩尔百分比值。在⟦2|分类⟧学上，用G十C占全部碱基的物质的量百分数（G十C）mo⟦1|1%⟧表示各类生物的DNA碱基因组成特征。"]], 0],
[0, 10, 1, 1, "GC比在微生物分类鉴定中的作用。", [[0, "（1）定义：DNA碱基比例是指（G+C）mol%值，简称“GC比”，“它表示DNA分子中鸟嘌呤（G）和胞嘧啶（C）所占的摩尔百分比值。"], [0, "（2）GC比的应用：GC比是目前发表任何⟦1|微生物⟧新种时所必须具有的重要指标。在⟦2|分类⟧学上，用G+C占全部碱基的物质的量百分数（G+C）mo⟦1|1%⟧表示各类生物的DNA碱基因组成特征。"], [1, "①亲缘关系相近的种，其基因组的⟦1|核酸⟧序列相近，故两者的GC比也接近，"], [1, "②GC比差距很大的两种⟦1|微生物⟧，它们的亲缘关系必然较远"], [1, "③GC比是建立新⟦2|分类⟧单元时的可靠指标。据测定，GC比相差低于⟦1|2%⟧时，没有分类学上的意义；种内各⟦1|菌株⟧间的差别在2.5%-4.0%间；若相差在5%以上时，就可认为属于不同的种了；假如差距超过10%，一般就可以认为是不同的属了。"]], 0],
[0, 10, 1, 2, "简述选用16SrRNA或18SrRNA作生物进化和系统分类研究的优点。", [[0, "优点如下："], [0, "①它们普遍存在于一切⟦1|细胞⟧内，不论是原核生物和真核生物，因此可比较它们在进化中的相互关系"], [0, "②它们的⟦1|生理⟧功能既重要又恒定"], [0, "③在⟦1|细胞⟧中的含量较高，较易提取；"], [0, "④编码rRNA的基因十分稳定："], [0, "③TRNA的某些核苷酸序列非常保守，虽经30余亿年的进化历程仍能保持其原初状态；"], [0, "③分子量适中，尤其是16SrRNA和18SrRNA不但核苷酸数适中，而且信息量大、易于分析，故成了理想的研究材料。"]], 0],
[1, 0, 0, 1, "微生物学（microbiology）", [[0, "是一门在分子、⟦1|细胞⟧或群体水平上研究⟦2|微生物⟧的形态构造、生理⟦2|代谢⟧、遗传变异、生态分布和分类进化等生命活动基本规律，并将其应用于工业⟦1|发酵⟧、医药卫生、生物工程和环境保护等实践领域的科学，其根本任务是发掘、利用、改善和保护有益微生物，控制、消灭或改造有害微生物，为人类社会的进步服务。"]], 0],
[1, 0, 1, 1, "微生物难以认识的主要原因及其克服方法", [[0, "（1）个体微小克服：列文虎克利用自制放大倍数约为⟦1|200倍⟧的单式显微镜，观察到⟦1|细菌⟧等⟦2|微生物⟧的个体，并且对一些微生物进行形态描述，首次克服了人类认识微生物世界的第一个难关一一个体微小，使人类初步踏进了微生物世界的大门，因此称为“微生物学先驱者”。"], [0, "（2）外貌不显克服：主要由科赫学派克服的，他们创立了许多显微镜技术，染色技术、悬滴⟦1|培养⟧技术和显微摄影技术，使人们能清楚地观察到⟦2|细菌⟧等的外貌"], [0, "（3）杂居混生克服：科赫等人发明明胶和琼脂平板⟦1|分离⟧⟦2|微生物⟧纯种的方法，克服了微生物在自然界中的杂居混生状态，从而进入了研究微生物⟦1|纯培养⟧阶段。"], [0, "（4）因果难联克服：巴斯德提出了⟦1|发酵⟧是由⟦1|微生物⟧引起的，否认了自然发生学说，科赫提出了证明某病的病原菌的“科赫法则”等，从而把微生物作用的因果联系起来。"]], 0],
[1, 0, 1, 2, "简述微生物的五大特性。", [[0, "（1）体积小，面积大；"], [0, "（2）吸收多，⟦1|转化⟧快；"], [0, "（3）⟦1|生长⟧旺，⟦2|繁殖⟧快；"], [0, "（4）适应强，易⟦1|变异⟧；"], [0, "（4）分布广，种类多。"]], 0],
[1, 1, 0, 1, "细菌（bacteria）", [[0, "是指一类⟦2|细胞⟧细短（直径约⟦1|0.5um⟧，长度约0.5～⟦1|5μm⟧）、⟦2|结构⟧简单、胞壁坚韧、多以二分裂方式⟦2|繁殖⟧和水生性较强的原核生物。"]], 0],
[1, 1, 0, 2, "细胞壁（cell wall）", [[0, "是位于⟦1|细胞膜⟧外的一层厚实、坚韧的外被。其主要成分为⟦1|肽聚糖⟧，具有固定⟦2|细胞⟧外形和保护细胞不受损伤等多种⟦2|生理⟧功能。⟦2|细菌⟧⟦1|细胞壁⟧除了绝大多数的细菌以肽聚糖为基本成分外，在G+细菌、G-细菌、抗酸细菌和古菌中还各有自己的特点。"]], 0],
[1, 1, 0, 3, "磷壁酸（teichoicacid）", [[0, "是G+⟦1|细菌⟧⟦1|细胞壁⟧上的一种酸性多糖，主要成分为甘油磷酸或核糖醇磷酸。可分为壁磷壁酸和膜磷壁酸两种，具有浓缩环境中Mg2+离子等以利⟦2|生长⟧等功能。"]], 0],
[1, 1, 0, 4, "脂多糖（lipopolysaccharide，LPs）", [[0, "是位于G-⟦2|细菌⟧⟦1|细胞壁⟧最外层的一层较厚（8-⟦1|10nm⟧）的类脂多糖类物质，由类脂A、核心多糖和O一特异链3部分组成。"]], 0],
[1, 1, 0, 5, "外膜蛋白（outermembraneprotein）", [[0, "指嵌合在脂多糖和磷脂层外膜上的20余种蛋白。按照功能不同可分为两类：一类为脂蛋白具有使外膜层与内壁⟦1|肽聚糖⟧层紧密连接的功能；另有一类为孔蛋白是一种中间有孔道、可控制分子量大于600物质（如⟦1|抗生素⟧等）进入外膜的三聚体跨膜蛋白，它是多种小分子成分进入⟦2|细胞⟧的通道，有特异性与非特异性两种。"]], 0],
[1, 1, 0, 6, "周质空间（periplasmicspace，periplasm）", [[0, "外膜与⟦1|细胞膜⟧间的狭窄胶质空间。其中存在多种周质蛋白，包括水解⟦1|酶⟧类，合成酶类和运输蛋白等。"]], 0],
[1, 1, 0, 7, "抗酸细菌（acid-fastbacteria）", [[0, "是一类⟦1|细胞壁⟧中含有大量分支菌酸等蜡质的特殊G+⟦1|细菌⟧。因它们被酸性复红染上色后，就不能像其他G+细菌那样被盐酸乙醇脱色，故称抗酸细菌。分支杆菌属的细菌属于抗酸细菌，常见的有结核分支杆菌和麻风分支杆菌两种。"]], 0],
[1, 1, 0, 8, "假肽聚糖（pseudopeptidoglycan）", [[0, "是某些古生菌⟦1|细胞壁⟧的主要成分，其⟦2|结构⟧虽与⟦1|肽聚糖⟧相似，但其多糖骨架则是由N-乙酰葡糖胺和N-乙酰塔罗糖胺醛酸以β-1，3-糖苷键交替连接而成，连在后一氨基糖上的肽尾由L-Glu、L-Ala和L-Lys⟦1|3个⟧L型氨基酸组成，肽桥则由L-Glu一个氨基酸组成"]], 0],
[1, 1, 0, 9, "细胞膜（cellmembrane）", [[0, "又称⟦2|细胞⟧质膜、质膜或内膜，是一层紧贴在⟦1|细胞壁⟧内侧，包围着细胞质的柔软、脆弱、富有弹性的半透性薄膜，厚7~⟦1|8nm⟧，由磷脂（占⟦1|20%⟧~30%）和⟦2|蛋白质⟧（占50%~70%）组成。"]], 0],
[1, 1, 0, 10, "间体（mesosome）", [[0, "是一种由⟦1|细胞膜⟧内褶而形成的囊状⟦1|结构⟧，内部充满着层状或管状泡囊。多见于G+⟦2|细菌⟧。可能与DNA复制、分配和⟦2|细胞⟧分裂有关。也有科学家认为“间体\"仅是电镜制片时因脱水操作而引起的一种像"]], 0],
[1, 1, 0, 11, "细胞质（cytoplasm）", [[0, "是指被⟦1|细胞膜⟧包围的除核区以外的一切半透明、胶体状、颗粒状物质的总称。其主要成分为⟦1|核糖体⟧、贮藏物、酶类、中间⟦2|代谢⟧物、⟦1|质粒⟧、各种营养物质和大分子的单体等，少数⟦2|细菌⟧还含类囊体、羧酶体、气泡或伴孢晶体等有特定功能的⟦2|细胞⟧组分。"]], 0],
[1, 1, 0, 12, "贮藏物（material）", [[0, "是指一类由不同化学成分累积而成的不溶性颗粒，主要功能是储存⟦1|营养⟧物。如贮藏⟦2|碳源⟧的糖原；贮藏⟦2|氮源⟧类的如藻青素和藻青蛋白等。"]], 0],
[1, 1, 0, 13, "磁小体（magnetosome）", [[0, "存在于少数G-⟦1|细菌⟧，主要是在趋磁细菌中，是一种纳米级、高纯度、高均匀度、有独特结构的链状单磁畴磁晶体，大小均匀，数目不等，成分为Fe3O4，外有一层磷脂、⟦2|蛋白质⟧或糖蛋白膜包裹，无毒，一般沿⟦2|细胞⟧长轴排列成链，具有导向功能，即借⟦1|鞭毛⟧引导细菌游向最有利的泥、水界面微氧环境处生活。"]], 0],
[1, 1, 0, 14, "羧酶体（carboxysome）", [[0, "又称羧化体，是存在于一些⟦1|自养⟧⟦2|细菌⟧⟦2|细胞⟧内的多角形或六角形内含物，大小与⟦1|噬菌体⟧相仿，内含1，5-二磷酸核酮糖羧化⟦2|酶⟧，在自养细菌的CO2固定中起着关键作用。存在于化能自养的硫杆菌属、贝日阿托氏菌属和一些光能自养的⟦1|蓝细菌⟧中。"]], 0],
[1, 1, 0, 15, "糖被（glycocalyx）", [[0, "包被于某些⟦2|细菌⟧⟦1|细胞壁⟧外的一层厚度不定的透明胶状物质。糖被的成分一般是多糖，少数为⟦2|蛋白质⟧或多肽，也有多糖与多肽复合型的。糖被的有无、厚薄除与⟦1|菌种⟧的遗传性相关外，还与环境尤其是⟦2|营养⟧条件密切相关。"]], 0],
[1, 1, 0, 16, "孢囊（sporocyst）", [[0, "是棕色⟦1|固氮⟧菌等一些固氮菌在外界缺乏⟦1|营养⟧的条件下，由整个营养⟦2|细胞⟧外壁加厚、细胞失水而形成的一种抗干旱但不抗热的圆形休眠体。因为一个营养细胞仅形成一个孢囊，不具繁殖功能。孢囊在适宜条件下，可发芽并重新进行营养⟦2|生长⟧。"]], 0],
[1, 1, 0, 17, "克隆（clone）", [[0, "由一个单⟦1|细胞⟧⟦2|繁殖⟧形成的一个纯种细胞群，即为克隆。"]], 0],
[1, 1, 0, 18, "菌苔（bacterial lawn）", [[0, "把大量分散的纯种⟦2|细胞⟧密集地接种在固体⟦1|培养基⟧的较大表面上，结果长出的大量“⟦1|菌落⟧\"已相互连成一片，即为菌苔。"]], 0],
[1, 1, 0, 19, "气生菌丝（aerialmycelium）", [[0, "又称二级⟦1|菌丝⟧，是指在基内菌丝体上不断向空间方向分化出颜色较深、直径较粗的分支菌丝。"]], 0],
[1, 1, 0, 20, "分生孢子丝（conidiafilaments）", [[0, "气生⟦1|菌丝⟧体成熟分化为⟦1|孢子⟧丝，通过横割分裂方式产生成串的分生孢子。"]], 0],
[1, 1, 0, 21, "蓝细菌（cyanobacteria）", [[0, "是指一类进化历史悠久、⟦1|革兰氏⟧⟦2|染色⟧阴性、无⟦1|鞭毛⟧、含叶绿素a（但不形成叶绿体）、能进行产氧性⟦1|光合⟧作用的大型原核生物。"]], 0],
[1, 1, 0, 22, "外毒素（exotoxin）", [[0, "⟦1|外毒素⟧是病原菌在其⟦1|生长⟧过程中向外分泌的一类毒性⟦2|蛋白质⟧，包括⟦2|酶⟧、酶原或毒蛋白，如白喉毒素、破伤风毒素和肉毒毒素等。"]], 0],
[1, 1, 0, 23, "内毒素（endotoxin）", [[0, "⟦1|内毒素⟧即⟦1|革兰氏⟧阴性⟦2|细菌⟧外壁层的脂多糖（LPS）。因它只在⟦2|细胞⟧死亡后经自溶或人工裂解时才释放，故称内毒素。其毒性较弱，但可引起动物发高烧等病症。"]], 0],
[1, 1, 1, 1, "论述微生物的多样性及其在生产中的运用。", [[0, "（1）⟦1|微生物⟧多样性，是指从微生物生命活动层次的角度，将微生物多样性分为遗传（基因）多样性、生理多样性、物种多样性和生态多样性四个层面。遗传（基因）多样性是指微生物群体或群落在基因水平上数目和频率的分布差异，主要体在组成⟦2|核酸⟧分子的碱基数量的巨大性和排列顺序的多样性上；"], [1, "② 生理多样性可以分为生理⟦1|结构⟧和生理功能的多样性：物种多样性的主要研究对象是⟦2|微生物⟧系统分类、物种数量、物种构成等；生态多样性可分为生态结构以及生态功能多样性。生态结构多样性包括生境分布广泛性和种群、群落结构的多样性，生态功能多样性主要指微生物与其他生物和非生物环境的关系。"], [0, "（2）⟦1|微生物⟧的应用：（微生物⟦2|代谢⟧、遗传变异育种、微生物生态、传染与⟦1|免疫⟧四章内容都涉及应用，不必局限于答案，可自行拓展作答）微生物可分解有机物，在自然界物质循环中起巨大作用："], [1, "② 在农业生产中，⟦2|微生物⟧是土壤肥力的重要因素。微生物可分解有机残体，促进难溶性矿物⟦1|转化⟧固定空气中氮素，增加土壤有效养分，促进土壤团粒结构的形成，还可利用其进行沼气发酵。此外，微生物产生多种⟦1|抗生素⟧，能防治作物病害和杂草；在工业生产中，有的是直接利用微生物菌体，有的是利用其⟦2|代谢⟧产物或代谢活动。在环境保护方面，可利用微生物处理污水、污染物和有毒物质，消除污染，保护环境。微生物与人类及畜禽的健康关系密切。"]], 0],
