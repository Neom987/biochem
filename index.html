<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>生化背诵</title>
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#EDF1F4; --surface:#FFFFFF; --ink:#16222C; --ink2:#52626E; --line:#D3DBE1; --seg:#E1E8ED; --mask:#C9D3DB; --water:#2E9BE0;
  --accent:#2447C9; --on-accent:#FFFFFF; --tint:#E4EAFB;
  --good:#0F8A64; --warn:#B97800; --bad:#C2255C;
  --good-t:#DDF3EA; --warn-t:#FBEFD2; --bad-t:#F9DCE7;
  --shadow:0 1px 2px rgba(22,34,44,.06),0 10px 28px rgba(22,34,44,.07);
  --sans:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC","Source Han Sans SC",system-ui,-apple-system,sans-serif;
  --serif:"Songti SC","Noto Serif CJK SC","Source Han Serif SC","STSong","SimSun",serif;
  --fs:1;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E151A; --surface:#172129; --ink:#E7EEF2; --ink2:#9AA9B4; --line:#2A3741; --seg:#1F2B34; --mask:#3A4955; --water:#5BB8F2;
    --accent:#8DA2FF; --on-accent:#0B1020; --tint:#1E2A4D;
    --good:#3ECB9B; --warn:#F0B93A; --bad:#FF7FA8;
    --good-t:#123428; --warn-t:#3A2E10; --bad-t:#3E1827;
    --shadow:0 0 0 1px rgba(255,255,255,.04);
  }
}
:root[data-theme="dark"]{
  --bg:#0E151A; --surface:#172129; --ink:#E7EEF2; --ink2:#9AA9B4; --line:#2A3741; --seg:#1F2B34; --mask:#3A4955; --water:#5BB8F2;
  --accent:#8DA2FF; --on-accent:#0B1020; --tint:#1E2A4D;
  --good:#3ECB9B; --warn:#F0B93A; --bad:#FF7FA8;
  --good-t:#123428; --warn-t:#3A2E10; --bad-t:#3E1827;
  --shadow:0 0 0 1px rgba(255,255,255,.04);
}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:calc(16px*var(--fs));line-height:1.65;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
[hidden]{display:none!important}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:8px}
.wrap{max-width:640px;margin:0 auto;padding:0 16px}
.screen{padding-bottom:40px}

/* shared controls */
.icon{width:44px;height:44px;border:0;background:transparent;border-radius:12px;display:grid;place-items:center;color:var(--ink2)}
.icon:active{background:var(--seg)}
.icon svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.primary{border:0;background:var(--accent);color:var(--on-accent);font-weight:700;border-radius:16px;padding:16px 20px;width:100%;font-size:1.06em}
.primary:disabled{opacity:.55;cursor:default}
.ghost:disabled{opacity:.45;cursor:default}
.primary:active:not(:disabled){transform:translateY(1px)}
.ghost{border:1.5px solid var(--line);background:var(--surface);border-radius:14px;padding:13px 16px;font-weight:600;width:100%}
.link{border:0;background:none;color:var(--accent);font-weight:600;padding:6px 4px}
.seg{display:flex;gap:2px;background:var(--seg);border-radius:13px;padding:3px}
.seg button{flex:1;border:0;background:transparent;padding:9px 6px;border-radius:10px;color:var(--ink2);font-size:.94em;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);font-weight:700;box-shadow:0 1px 3px rgba(0,0,0,.12)}

/* home */
.top{display:flex;align-items:center;justify-content:space-between;padding:10px 0 2px}
.top h1{margin:0;font-size:1.15em;font-weight:800;letter-spacing:.02em}
.hero{margin:12px 0 20px;padding:22px 18px 18px;background:var(--surface);border-radius:22px;box-shadow:var(--shadow)}
.hero h2{margin:0 0 6px;font-family:var(--serif);font-size:calc(28px*var(--fs));line-height:1.3;font-weight:800}
.hero p{margin:0 0 18px;color:var(--ink2)}
.hero .seg{margin-bottom:12px}
.block{margin:0 0 22px}
.block h3{margin:0 0 10px;font-size:.98em;color:var(--ink2);font-weight:700}
.block .seg{margin-bottom:10px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px;margin-top:12px}
.tile{position:relative;text-align:left;border:1.5px solid var(--line);background:var(--surface);border-radius:14px;padding:9px 10px 12px;min-height:82px;display:flex;flex-direction:column;gap:2px}
.tile[aria-pressed="true"]{border-color:var(--accent);background:var(--tint)}
.tile:disabled{opacity:.4;cursor:default}
.tile .n{font-size:.76em;color:var(--ink2)}
.tile .nm{font-weight:700;font-size:.9em;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tile .pb{position:absolute;left:10px;right:10px;bottom:7px;height:4px;border-radius:2px;background:var(--seg);overflow:hidden}
.tile .pb i{display:block;height:100%;background:var(--good)}
.tile .ct{font-size:.74em;color:var(--ink2);margin-top:auto;padding-bottom:7px}
.row-tools{display:flex;justify-content:space-between;align-items:center}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface);border-radius:16px;padding:12px 14px;box-shadow:var(--shadow)}
.stat b{display:block;font-size:1.5em;line-height:1.2}
.stat span{font-size:.82em;color:var(--ink2)}
.src{font-size:.82em;color:var(--ink2);margin:6px 0 0}

/* study */
.sticky{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-bottom:8px}
.bar-row{display:flex;align-items:center;gap:6px}
#segs{flex:1;display:flex;gap:3px;height:8px}
#segs i{flex:1;border-radius:4px;background:var(--seg);transition:background .2s}
#segs i.cur{background:var(--ink2)}
#segs i.r-g{background:var(--good)}
#segs i.r-m{background:var(--warn)}
#segs i.r-f{background:var(--bad)}
#segs i.r-s{background:repeating-linear-gradient(45deg,var(--line) 0 3px,transparent 3px 6px)}
#segs i.cur.r-g,#segs i.cur.r-m,#segs i.cur.r-f,#segs i.cur.r-s{outline:2px solid var(--ink2);outline-offset:1px}
#drift{font-size:.82em;color:var(--ink2);min-width:4.4em;text-align:right;padding-right:6px}
#timer{margin:2px 0 0}
.track{height:12px;border-radius:6px;background:var(--seg);overflow:hidden}
#bar-fill{height:100%;width:100%;border-radius:6px;background:var(--accent);transition:width .25s linear,background .3s}
#bar-fill[data-lv="b"]{background:var(--warn)}
#bar-fill[data-lv="c"]{background:var(--bad)}
#bar-label{font-size:.84em;color:var(--ink2);margin-top:4px;min-height:1.6em}
.card{background:var(--surface);border-radius:22px;box-shadow:var(--shadow);padding:18px 18px 20px;margin-top:6px}
.meta{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:.84em;color:var(--ink2);margin-bottom:10px}
.tags{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.tag{border:1px solid var(--line);border-radius:999px;padding:1px 9px}
.tag.must{border-color:var(--accent);color:var(--accent)}
.tag.again{border-color:var(--bad);color:var(--bad)}
.q{font-family:var(--serif);font-weight:800;font-size:calc(23px*var(--fs));line-height:1.5;margin:4px 0 12px;word-break:break-word}
.tools{display:flex;gap:6px;margin:0 0 10px}
.tools button{border:1px solid var(--line);background:transparent;border-radius:10px;padding:5px 12px;font-size:.88em;color:var(--ink2)}
textarea#note{width:100%;min-height:96px;border:1.5px solid var(--line);border-radius:14px;background:var(--bg);color:var(--ink);padding:12px;font:inherit;resize:vertical}
textarea#note:read-only{opacity:.85}
.ans-head{display:flex;justify-content:space-between;align-items:center;margin:16px 0 4px;color:var(--ink2);font-size:.9em;border-top:1.5px dashed var(--line);padding-top:12px}
#answer ol{list-style:none;margin:0;padding:0}
.pt{padding:10px 0;border-bottom:1px solid var(--line)}
.pt:last-child{border-bottom:0}
.hd{font-weight:700}
.ck{background:var(--mask);color:transparent;border-radius:5px;box-shadow:inset 0 0 0 1px var(--line);cursor:pointer;user-select:none;-webkit-user-select:none;padding:0 2px;margin:0 1px;transition:background .2s,color .2s}
.ck.on{background:var(--tint);color:inherit;box-shadow:none;user-select:text;-webkit-user-select:text;cursor:default}
.mkr{color:var(--ink2);font-weight:700;margin-right:.3em}
#answer .pt{line-height:1.95}
.pt.head .hd{color:var(--accent)}
.pt.row{display:flex;gap:.5em;align-items:flex-start}
.pt.row .mk{flex:1;margin-top:0}
.mk{display:block;margin-top:2px;filter:blur(6px);cursor:pointer;user-select:none;-webkit-user-select:none;transition:filter .25s;border-radius:6px}
.mk.on{filter:none;user-select:text;-webkit-user-select:text;cursor:default}
.dock{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--bg);border-top:1px solid var(--line);padding:10px 16px calc(12px + env(safe-area-inset-bottom,0px))}
.dock>div{max-width:640px;margin:0 auto}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.two button{padding:14px 8px;font-size:1em}
.grades{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.grades button{border:0;border-radius:16px;padding:12px 6px 10px;font-weight:800;font-size:1.04em;display:flex;flex-direction:column;align-items:center;gap:2px}
.grades button small{font-weight:500;font-size:.72em;opacity:.85}
.grades .f{background:var(--bad-t);color:var(--bad)}
.grades .m{background:var(--warn-t);color:var(--warn)}
.grades .g{background:var(--good-t);color:var(--good)}
#study .spacer{height:130px}

/* nudge + sheet */
.veil{position:fixed;inset:0;z-index:20;background:rgba(10,16,22,.62);display:grid;place-items:center;padding:20px}
.pop{background:var(--surface);border-radius:24px;padding:24px 20px 20px;max-width:420px;width:100%;box-shadow:var(--shadow)}
.pop h2{margin:0 0 6px;font-size:1.5em}
.pop p{margin:0 0 14px;color:var(--ink2)}
.pop .pq{font-family:var(--serif);font-weight:700;font-size:1.1em;background:var(--bg);border-radius:14px;padding:12px 14px;margin-bottom:16px}
.sheet{position:fixed;inset:0;z-index:30;background:rgba(10,16,22,.55);display:flex;align-items:flex-end;justify-content:center}
.sheet>div{background:var(--bg);width:100%;max-width:640px;max-height:88vh;overflow:auto;border-radius:24px 24px 0 0;padding:14px 16px calc(24px + env(safe-area-inset-bottom,0px))}
.sheet header{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.sheet h2{margin:0;font-size:1.2em}
.opt{padding:12px 0;border-bottom:1px solid var(--line)}
.opt:last-of-type{border-bottom:0}
.opt h4{margin:0 0 2px;font-size:1em}
.opt p{margin:0 0 8px;font-size:.84em;color:var(--ink2)}
.sw{display:flex;justify-content:space-between;align-items:center;gap:12px}
.sw input{width:50px;height:30px;accent-color:var(--accent)}
.fsrow{display:flex;gap:8px;align-items:center}
.fsrow button{flex:0 0 56px;border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:8px 0;font-weight:700}
.danger{color:var(--bad);border-color:var(--bad)}

/* extras */
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px;vertical-align:baseline}
.dh{margin:16px 0 8px;font-size:.92em;color:var(--ink2);font-weight:700}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:7;display:grid;grid-template-columns:repeat(3,1fr);background:var(--surface);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px))}
.nav button{border:0;background:transparent;border-radius:12px;padding:6px 0 4px;color:var(--ink2);font-size:.8em;display:flex;flex-direction:column;align-items:center;gap:2px;min-height:52px}
.nav button svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav button[aria-current="true"]{color:var(--accent);font-weight:800}
#home{padding-bottom:96px}
.crow{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:var(--surface);border:0;border-radius:16px;padding:12px 14px;margin:0 0 8px;box-shadow:var(--shadow);min-height:64px}
.crow .no{flex:0 0 38px;height:38px;border-radius:12px;background:var(--tint);color:var(--accent);font-weight:800;display:grid;place-items:center}
.crow .mid{flex:1;min-width:0;display:block}
.crow .nm{display:block;font-weight:700;line-height:1.35}
.crow .sub{display:block;font-size:.8em;color:var(--ink2)}
.crow .pbar{display:block;height:5px;border-radius:3px;background:var(--seg);margin-top:6px;overflow:hidden}
.crow .pbar i{display:block;height:100%;background:var(--good)}
.crow .due{flex:0 0 auto;font-size:.76em;background:var(--warn-t);color:var(--warn);padding:2px 8px;border-radius:999px;font-weight:700}
.stats3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:4px 0 8px}
.stats3 .stat{padding:10px 12px}
.stats3 .stat b{font-size:1.3em}
#segs.num{display:block;height:auto;text-align:center;font-size:.88em;color:var(--ink2)}
.q.fill{font-size:calc(20px*var(--fs));line-height:2.1;font-weight:600}
.gap{cursor:pointer}
.gap .gt{display:inline-block;min-width:2.6em;text-align:center;border-bottom:2px solid var(--accent);background:var(--tint);color:transparent;border-radius:4px 4px 0 0;padding:0 3px;margin:0 2px;user-select:none;-webkit-user-select:none;transition:color .2s,background .2s}
.gap.on .gt{color:var(--accent);background:transparent;font-weight:800;user-select:text;-webkit-user-select:text}
.judge{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.judge button{border:0;border-radius:20px;padding:14px 0 12px;font-size:1.2em;font-weight:800;display:flex;flex-direction:column;align-items:center;gap:0;min-height:84px;justify-content:center}
.judge button:disabled{opacity:.45}
.judge .gl{font-size:1.9em;line-height:1.1}
.judge .jf{background:var(--bad-t);color:var(--bad)}
.judge .jt{background:var(--good-t);color:var(--good)}
.two button{white-space:nowrap;font-size:.96em;padding:14px 4px}
.ans-head{flex-wrap:wrap;gap:4px 12px}
.gh{margin:14px 0 2px;font-size:.88em;color:var(--ink2);font-weight:700}
.blank{color:var(--accent);font-weight:700;white-space:nowrap}
.ans{color:var(--accent)}
.q.sm{font-size:calc(19px*var(--fs));line-height:1.65;font-weight:700}
.verdict{margin:14px 0 4px;padding:10px 12px;border-radius:12px;font-weight:700}
.verdict.ok{background:var(--good-t);color:var(--good)}
.verdict.no{background:var(--bad-t);color:var(--bad)}
.seg.w{flex-wrap:wrap}
.seg.w button{flex:1 1 auto}
.tb{display:flex;gap:0}
.icon.sm{width:40px;height:40px}
.water-card{background:var(--surface);border-radius:18px;padding:14px;box-shadow:var(--shadow)}
.drops{display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.drop{width:28px;height:28px;fill:var(--seg);stroke:var(--line);stroke-width:1}
.drop.on{fill:var(--water);stroke:none}
.wn{margin-left:8px;color:var(--ink2);font-size:.9em}
.wrow{display:flex;gap:8px;margin:12px 0 6px}
.wrow .ghost{width:64px;padding:11px 0}
.wrow .primary{flex:1;padding:11px}
.water-card .seg{margin-top:8px}
.stats{grid-template-columns:repeat(2,1fr)}
.stat.hit b{color:var(--good)}
.res{background:var(--surface);border-radius:14px;margin:8px 0;padding:10px 12px}
.res summary{cursor:pointer;font-weight:700;line-height:1.5}
.res .rm{display:block;font-weight:400;color:var(--ink2);font-size:.8em}
.rbody{margin-top:8px;border-top:1px dashed var(--line);padding-top:6px}
.rbody ol{list-style:none;margin:0;padding:0}
.field{width:100%;padding:12px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;margin:6px 0 10px}
textarea.field{min-height:84px;resize:vertical;font-size:.85em}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom,0px));z-index:40;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;max-width:min(92vw,520px);font-size:.92em;box-shadow:var(--shadow)}
.pop .ghost{margin-top:8px}
.btnrow{display:flex;gap:8px}
.btnrow .ghost{margin-top:0}

/* done + rest */
.done h2,.rest h2{font-family:var(--serif);font-size:calc(28px*var(--fs));line-height:1.3;margin:26px 0 6px}
.done p,.rest p{color:var(--ink2);margin:0 0 16px}
.big3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.stack{display:flex;height:16px;border-radius:8px;overflow:hidden;background:var(--seg);margin:0 0 6px}
.stack i{display:block;height:100%}
.legend{display:flex;gap:14px;font-size:.86em;color:var(--ink2);margin-bottom:20px;flex-wrap:wrap}
.legend b{color:var(--ink)}
.actions{display:grid;gap:10px}
.clock{font-family:var(--serif);font-weight:800;font-size:calc(64px*var(--fs));text-align:center;margin:30px 0 10px;font-variant-numeric:tabular-nums}
.breath{width:92px;height:92px;border-radius:50%;background:var(--tint);margin:10px auto 20px;animation:br 6s ease-in-out infinite}
@keyframes br{0%,100%{transform:scale(.72)}50%{transform:scale(1.05)}}
@media (prefers-reduced-motion: reduce){
  .breath{animation:none}
  #bar-fill,.ck,#segs i{transition:none}
}
</style>
</head>
<body>

<!-- 首页 -->
<section id="home" class="screen">
  <div class="wrap">
    <div class="top">
      <h1>生化背诵</h1>
      <div class="tb">
      <button class="icon" id="btn-search" aria-label="查题"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg></button>
      <button class="icon" id="btn-fs" aria-label="全屏"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
      <button class="icon" id="btn-set" aria-label="设置"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
      </div>
    </div>

    
    <div id="tab-go" class="tab">
      <div class="hero">
      <h2 id="hero-title"></h2>
      <p id="hero-sub"></p>
      <div id="sprint-seg"></div>
      <button class="primary" id="btn-start"></button>
    </div>


      <div class="block">
        <h3>背哪些</h3>
        <div id="part-seg"></div>
        <div id="sect-seg"></div>
        <div id="only-seg"></div>
      </div>

      <div class="block">
      <h3>出题顺序</h3>
      <div id="order-seg"></div>
    </div>


      <div class="block">
      <h3>背诵方式</h3>
      <div id="mode-seg"></div>
      <div id="cloze-seg"></div>
      <p class="src" id="mode-desc"></p>
    </div>


    </div>

    <div id="tab-ch" class="tab" hidden>
      <div class="block">
        <h3>按章节背：点一章，选择怎么背</h3>
        <div id="chsrc-seg"></div>
      </div>
      <div id="chlist"></div>
    </div>

const D = [[0,1,0,1,"构型（configuration）",[[0,"⟦1|有机⟧分子中各原子的固定⟦2|空间⟧排列，用于描述⟦1|立体异构体⟧的三维关系；其中，构型改变须断裂并重建⟦1|共价键⟧，⟦1|常伴旋光性⟧改变，如 D 型与 L 型互变。"]]],[0,1,0,2,"构象（conformation）",[[0,"分子在某一瞬间所采取的⟦2|空间⟧形态，反映各原子的⟦1|实际⟧相对位置；具体来说，⟦1|单键⟧旋转和⟦1|键角柔性⟧可产生多种构象；构象互变不破坏⟦1|共价键⟧。"]]],[0,1,0,3,"不对称碳原子（asymmetric carbon）/手性碳原子（chiral carbon atom）",[[0,"连接 ⟦1|4⟧ 个不同取代基的⟦1|四面体⟧碳原子，又称手性碳原子，常以 C*表示；在立体化学上，含 ⟦1|1⟧ 个⟦1|手性⟧碳原子的分子通常有两个旋光异构体；含 n 个时最多有 ⟦1|2⟧ⁿ个⟦1|立体异构体⟧。"]]],[0,1,0,4,"等电点（pI，isoelectric point）",[[0,"⟦1|氨基酸⟧或蛋白质净⟦2|电荷⟧为 ⟦1|0⟧ 时的 pH；具体而言，pH=pI 时在⟦1|电场⟧中不迁移；pH>pI 带⟦2|负电⟧并移向正极，pH<pI则相反。"]]],[0,1,0,5,"茚三酮反应（ninhydrin reaction）",[[0,"⟦1|弱酸⟧条件下用⟦1|茚三酮⟧氧化并⟦2|定量检测⟧⟦1|氨基酸⟧的显色反应；反应时，⟦1|α-氨基酸⟧与⟦1|茚三酮⟧共热生成⟦1|紫色⟧产物，⟦1|570⟧nm 有吸收；⟦1|Pro⟧ 和羟 ⟦1|Pro⟧ 呈亮⟦1|黄色⟧，吸收峰 ⟦1|440⟧ nm。"]]],[0,1,0,6,"双缩脲反应（biuret reaction）",[[0,"含至少两个⟦1|肽键⟧的肽或蛋白质特有、⟦2|游离⟧⟦1|氨基酸⟧不发生的⟦1|颜色⟧反应；反应中，含两个及以上⟦1|肽键⟧的⟦2|化合物⟧在⟦1|碱性⟧ ⟦1|CuSO₄⟧中生成⟦1|紫红⟧或⟦1|蓝紫色复合物⟧。"]]],[0,1,0,7,"离子交换层析（ion-exchange column chromatography）",[[0,"按带电性质分离⟦1|氨基酸⟧、蛋白质等物质的⟦1|层析⟧方法；分离时，⟦2|样品⟧与⟦1|树脂⟧带电基团发生可逆静电作用；因结合强弱不同，可调 pH 或⟦2|离子强度⟧洗脱分离。"]]],[0,1,0,8,"肽键（peptide bond）",[[0,"一个⟦1|氨基酸⟧的⟦1|α-羧基⟧与另一⟦1|氨基酸⟧的⟦1|α-氨基⟧脱水形成的-⟦1|CO-NH-酰胺键⟧；从结构上看，肽键具部分⟦1|双键⟧性质，不能自由旋转，使每个肽单位形成⟦1|刚性平面⟧。"]]],[0,1,0,9,"寡肽 （oligopeptide）",[[0,"由几个至十几个氨基酸残基组成、相对分子⟦1|质量⟧通常小于 ⟦1|1000⟧ 的肽；由于分子较小，可被人体直接吸收。"]]],[0,1,0,10,"肽单位 （peptide unit）",[[0,"又称⟦1|肽基⟧，由⟦1|肽键⟧的 ⟦1|4⟧ 个原子及相邻 ⟦1|2⟧ 个 ⟦1|Cα⟧组成。因⟦1|肽键⟧有部分⟦1|双键⟧性质，这 ⟦1|6⟧ 个原子近于共面，构成⟦1|主链⟧的⟦1|刚性单元⟧。"]]],[0,1,0,11,"酰胺平面（amide plane）也称肽基平面或肽平面（peptide plane）",[[0,"⟦1|肽键⟧有部分⟦1|双键⟧性质，不能自由旋转，使肽单位的 ⟦1|6⟧ 个原子近于共面。这一⟦1|刚性⟧平面限制⟦1|主链⟧旋转，是形成二级结构的基础。"]]],[0,1,0,12,"活性肽（Active peptide）",[[0,"以⟦2|游离⟧状态存在、⟦1|分子量⟧较小且有特定⟦1|生理功能⟧的⟦1|多肽⟧。可由⟦1|核糖体⟧合成的⟦2|前体加工⟧而成，也可经非⟦1|核糖体途径酶⟧促合成。"]]],[0,1,0,13,"谷胱甘肽 （Glutathione）",[[0,"由 ⟦1|Glu⟧、⟦1|Cys⟧、⟦1|Gly⟧ 组成、主要以⟦1|还原型⟧ ⟦1|GSH⟧ 存在的⟦1|三肽⟧；在功能上，其⟦1|巯基⟧参与⟦1|抗氧化⟧，清除⟦1|自由基⟧并保护蛋白质和⟦1|细胞膜⟧免受氧化损伤。"]]],[0,1,0,14,"亚基（subunit）",[[0,"寡聚蛋白中可独立折叠并具有三级结构的⟦1|多肽链⟧；在寡聚蛋白中，亚基单独存在通常无完整⟦2|活性⟧，按特定方式组装成四级结构后才具完整⟦2|活性⟧。"]]],[0,1,0,15,"一级结构 （primary structure）",[[0,"⟦1|多肽链⟧中⟦1|氨基酸⟧的组成、数量、排列⟦1|顺序⟧及⟦2|共价⟧连接，也称⟦2|化学⟧结构；它主要由⟦1|肽键⟧、少量⟦1|二硫键维系⟧；由基因⟦2|编码⟧，并决定高级结构和⟦1|生物学⟧功能。"]]],[0,1,0,16,"同源蛋白质（homologous proteins）",[[0,"由具有⟦1|同源⟧关系的基因⟦2|编码⟧、序列明显相似的蛋白质；因此，通常具有相同或相似的三维结构和功能。"]]],[0,1,0,17,"Edman 降解（Edman degradation）",[[0,"从⟦1|多肽⟧ N 端逐次切下并鉴定单个⟦1|残基⟧的⟦2|化学⟧⟦1|测序⟧法；具体反应中，⟦1|PITC⟧ 在⟦1|弱碱⟧条件下⟦2|标记⟧ N 端，⟦1|酸处理⟧切下该⟦1|残基⟧并形成稳定的 ⟦1|PTH⟧ ⟦2|衍生物⟧。"]]],[0,1,0,18,"必需氨基酸（essential amino acids）",[[0,"人体不能合成或合成量不足，必须由⟦2|食物供给⟧的⟦1|氨基酸⟧；常见的⟦1|成人⟧必需氨基酸包括 ⟦1|Lys⟧、⟦1|Trp⟧、⟦1|Phe⟧、⟦1|Met⟧、⟦1|Thr⟧、⟦1|Ile⟧、⟦1|Leu⟧ 和 ⟦1|Val⟧，⟦1|婴幼儿⟧还需 ⟦1|His⟧。"]]],[0,1,0,19,"α-氨基酸（α-amino acid）",[[0,"⟦1|氨基⟧连在⟦1|羧基⟧相邻的⟦1|α-⟧碳上，⟦1|Cα⟧还连接 H 和 R 基的氨基酸；蛋白质中的⟦1|α-⟧氨基酸，除 ⟦1|Gly⟧ 外均具⟦1|旋光性⟧，均为 L 型。"]]],[0,1,0,20,"两性离子/兼性离子（Zwitterion，或偶极离子（dipolarion））",[[0,"同一分子同时带正、⟦1|负电荷⟧基团的离子，又称兼性离子或偶极离子；其既可作⟦2|质子供体⟧，又可作⟦1|质子受体⟧，因此⟦1|兼具酸⟧、碱性质。"]]],[0,1,0,21,"对角线电泳（diagonal electrophoresis）",[[0,"在两次相互垂直的⟦1|电泳⟧间处理⟦2|样品⟧，用于确定⟦1|二硫键⟧位置；判读时，第一次⟦1|电泳⟧后破坏⟦1|二硫键⟧，再转 ⟦1|90⟧°⟦1|电泳⟧；未⟦1|改变肽⟧段在⟦1|对角线⟧上，含⟦1|二硫键肽⟧段偏离⟦1|对角线⟧。"]]],[0,1,0,22,"缀合蛋白/结合蛋白（Conjugated protein）",[[0,"含⟦1|氨基酸⟧以外的⟦1|永久性⟧非蛋白成分的蛋白质，又称结合蛋白或复合蛋白；其中，蛋白部分称脱辅基蛋白；非蛋白部分⟦1|可为糖⟧、⟦2|脂质⟧或⟦2|金属离子⟧等。"]]],[0,1,0,23,"蛋白质二级结构（protein secondary structure）",[[0,"⟦1|多肽⟧局部⟦1|主链⟧经⟦1|氢键⟧形成的⟦1|规则⟧、⟦1|周期性空间结构⟧，不涉及⟦1|侧链构象⟧；例如，常见类型有⟦1|α-⟧⟦2|螺旋⟧、⟦1|β-⟧折叠、⟦1|β-转角⟧和无规卷曲。"]]],[0,1,0,24,"α-螺旋（α-helix）",[[0,"蛋白质中常见的⟦1|右手⟧螺旋二级结构；具体来说，⟦1|每圈⟧ ⟦1|3.6⟧ 个⟦1|残基⟧、⟦1|螺距⟧ ⟦1|0.54⟧ nm；链内第 n 个 C=O 与第 ⟦1|n+4⟧个 ⟦1|N-H⟧ 形成⟦1|氢键⟧。"]]],[0,1,0,25,"β-折叠（β-sheet）",[[0,"⟦1|多肽主链⟧伸展排列形成的片⟦1|层状⟧二级结构；其稳定依靠同一⟦1|肽链⟧或相邻⟦1|肽链⟧的 C=O 与 ⟦1|N-H⟧ 形成⟦1|氢键⟧。"]]],[0,1,0,26,"超二级结构（super-secondary structure）",[[0,"两个或多个二级结构⟦2|元件⟧组合形成的较大⟦1|结构单元⟧，又称⟦1|模体⟧；通常，组合种类有限，结构⟦1|规则⟧且能量较低。"]]],[0,1,0,27,"结构域（domain）",[[0,"⟦1|多肽链⟧局部独立折叠形成的紧密⟦1|球状⟧区，是⟦1|球状蛋白⟧的独立折叠单位；一般而言，常由序列上连续的 ⟦1|100～200⟧ 个⟦1|残基⟧组成。"]]],[0,1,0,28,"蛋白质变性（denaturation）",[[0,"蛋白质受⟦1|物理⟧或⟦2|化学⟧因素作用后，⟦2|活性⟧和理化性质改变的过程；进一步说，本质是⟦1|次级键⟧破坏、天然⟦1|构象解体⟧；通常不破坏⟦1|共价键⟧，一级结构仍完整。"]]],[0,1,0,29,"寡聚蛋白（oligomer protein）",[[0,"两个及以上相同或不同⟦1|亚基⟧以非⟦2|共价⟧力组装成的复合蛋白质；在功能上，⟦1|亚基⟧组装可稳定⟦2|空间⟧⟦1|构象⟧，并产生⟦1|协同效应⟧、⟦1|变构⟧调节和完整生物功能。"]]],[0,1,0,30,"蛋白质三级结构（protein tertiary structure）",[[0,"一条⟦1|多肽链⟧的⟦1|主链⟧和⟦1|侧链⟧在二级结构基础上进一步折叠形成的整体三维排布；从功能上看，三级结构确定蛋白质⟦1|形状⟧和⟦2|活性⟧⟦1|位点构型⟧，是执行⟦1|生物学⟧功能的关键。"]]],[0,1,0,31,"蛋白质四级结构（protein quaternary structure）",[[0,"两条及以上具有完整三级结构的⟦1|亚基⟧以非⟦2|共价⟧力组装形成的⟦1|空间结构⟧。例如，血红蛋白可通过⟦1|亚基⟧间构象变化调节氧的结合与释放。"]]],[0,1,0,32,"血红蛋白（hemoglobin，Hb）",[[0,"由 ⟦1|4⟧ 个⟦1|多肽亚基⟧组成、每个⟦1|亚基含⟧ ⟦1|1⟧ 个⟦1|血红素⟧的氧结合⟦1|蛋白⟧；从功能上看，位于⟦1|红细胞⟧，在肺结合氧、在组织释放氧，完成氧⟦2|运输⟧。"]]],[0,1,0,33,"波尔效应（Bohr effect）",[[0,"pH 和 ⟦1|CO₂⟧浓度改变血红蛋白氧⟦2|亲和力⟧的现象；具体表现为，pH 降低或 ⟦1|CO₂⟧升高使 Hb 由 R 态⟦1|偏向⟧ T 态，氧⟦2|亲和力⟧下降，氧解离⟦2|曲线⟧⟦1|右移⟧。"]]],[0,1,0,34,"酶联免疫吸附测定（enzyme-linked immunosorbent assay，ELISA）",[[0,"利用⟦1|抗原⟧⟦2|抗体⟧特异结合和酶促显色，⟦2|检测⟧或⟦2|定量⟧特定⟦1|抗原⟧或⟦2|抗体⟧的⟦2|技术⟧；⟦2|检测⟧时，先将⟦1|抗原⟧或⟦2|抗体⟧固定于⟦1|固相载体⟧，再结合⟦1|待测物⟧和酶标⟦1|试剂⟧，最后加底物显色⟦2|检测⟧。"]]],[0,1,0,35,"镰刀型细胞贫血病（sickle-cell anemia）",[[0,"由⟦1|基因突变⟧引起 Hb β链第 ⟦1|6⟧ 位 ⟦1|Glu⟧ 被 ⟦1|Val⟧ 替换的血红蛋白病；⟦1|病理⟧上，脱氧 Hb 异常聚集成不⟦1|溶性纤维⟧，使⟦1|红细胞⟧呈⟦1|镰刀状⟧。"]]],[0,1,0,36,"盐析（salting out）",[[0,"高盐使蛋白质⟦1|溶解度⟧下降并聚集沉淀的现象。其⟦1|原理⟧是盐⟦2|离子⟧降低水⟦1|活度⟧、削弱⟦1|水化⟧作用，促进疏水聚集；常用⟦1|硫酸铵⟧分离蛋白质，通常可保留其天然⟦1|构象⟧。"]]],[0,1,0,37,"电泳（EP）",[[0,"带电⟦1|颗粒⟧在外⟦1|电场中向⟧相反⟦2|电荷⟧的⟦1|电极⟧迁移的现象；分离时，⟦1|颗粒⟧因⟦2|电荷⟧、大小和⟦1|形状⟧不同而迁移速度不同，据此实现分离。"]]],[0,1,0,38,"等电聚焦电泳（IEF，isoelectric focusing）",[[0,"按⟦1|等电点⟧差异分离蛋白质的⟦1|高分辨率电泳技术⟧；聚焦过程中，⟦2|凝胶⟧中建立 pH ⟦2|梯度⟧；蛋白质迁移至 pH=pI 处时净⟦2|电荷⟧为 ⟦1|0⟧ 并停止⟦2|移动⟧。"]]],[0,1,0,39,"双向电泳（two-dimensional electrophoresis）",[[0,"将等电聚焦与 ⟦1|SDS-PAGE⟧ 连续结合的蛋白质分离⟦2|技术⟧；具体而言，第一向按 pI 分离，旋转 ⟦1|90⟧°后第二向按⟦1|分子量⟧分离；⟦1|图谱⟧两轴分别反映 pI 和⟦1|分子量⟧。"]]],[0,1,0,40,"亲和层析（affinity chromatography）",[[0,"⟦1|利用生物⟧分子与⟦2|配体⟧的专一识别进行纯化的⟦1|层析⟧方法；纯化时，将特异⟦2|配体⟧固定在⟦1|载体⟧上，只吸附⟦2|目标⟧分子，再经洗脱获得⟦1|高纯度⟧产物。"]]],[0,1,0,41,"疏水作用层析（hydrophobic interaction chromatography）",[[0,"按蛋白质⟦2|表面⟧疏⟦1|水性⟧⟦2|差异⟧进行分离的⟦1|层析技术⟧；操作时，高盐促进蛋白质与⟦1|介质⟧疏水基团结合；降低⟦1|盐浓度⟧或改变 pH 使其洗脱。"]]],[0,1,0,42,"透析（dialysis）",[[0,"利用⟦1|半透膜⟧截留蛋白质，使其与可透膜小分子分开的⟦2|技术⟧；透析时，将蛋白质⟦1|溶液⟧置于⟦1|透析袋⟧中，小分子沿⟦1|浓度梯度⟧扩散⟦1|出膜⟧，实现⟦1|脱盐⟧和除杂。"]]],[0,1,0,43,"超过滤或超滤（ultrafiltration）",[[0,"以⟦1|压力⟧或⟦1|离心力⟧⟦2|驱动⟧水和小分子⟦1|透膜⟧，而截留蛋白质等⟦1|大分子⟧的⟦2|技术⟧；因此，用于蛋白质浓缩、⟦1|脱盐⟧和粗⟦1|分级⟧。"]]],[0,1,0,44,"凝胶过滤（gel filtration）",[[0,"按分子大小和⟦1|形状⟧在多孔⟦2|凝胶⟧中的排阻⟦2|差异⟧进行分离的⟦1|层析技术⟧；分离时，⟦1|大分子⟧难进入⟦2|凝胶⟧孔、⟦1|路径⟧短而先洗脱；小分子进入⟦1|孔道⟧、⟦1|路径⟧长而后洗脱。"]]],[0,1,0,45,"凯氏（Kjeldahl）定氮法",[[0,"测定⟦2|样品⟧总氮并据此推算蛋白质⟦2|含量⟧的方法；测定时，⟦1|浓硫酸消化⟧使⟦1|有机⟧氮变为⟦1|铵盐⟧；⟦1|碱化⟧蒸馏放氨，酸吸收后滴定，再乘换算⟦1|系数⟧。"]]],[0,1,0,46,"SDS-聚丙烯酰胺凝胶电泳（SDS-PAGE）",[[0,"加入 SDS 和⟦1|还原剂⟧的⟦2|变性⟧聚丙烯酰胺凝胶电泳；其中，SDS 使蛋白质变性并带近似均一⟦1|负电荷⟧，消除⟦2|电荷⟧和⟦1|构象⟧⟦2|差异⟧，使⟦1|迁移率⟧主要取决于⟦1|分子量⟧，小分子更快。"]]],[0,1,1,1,"根据氨基酸通式的 R 基团性质，20 种常见的氨基酸可进行怎样的分类？（常作为小题出现）",[[0,"（1）非⟦2|极性脂肪⟧族 R 基：⟦1|Gly⟧、⟦1|Ala⟧、⟦1|Val⟧、⟦1|Pro⟧、⟦1|Leu⟧、⟦1|Ile⟧、⟦1|Met⟧；多具疏⟦1|水性⟧，常聚于蛋白质内部并稳定结构。"],[0,"（2）⟦2|极性⟧不带电 R 基：⟦1|Ser⟧、⟦1|Thr⟧、⟦1|Cys⟧、⟦1|Asn⟧、⟦1|Gln⟧；可与水形成⟦1|氢键⟧，⟦1|亲水性⟧较强。"],[0,"（3）⟦1|碱性⟧ R 基：⟦1|Lys⟧、⟦1|Arg⟧、⟦1|His⟧；⟦1|pH 7⟧.⟦1|0⟧ 时 ⟦1|Lys⟧、⟦1|Arg⟧ ⟦1|侧链⟧多带⟦1|正电⟧，⟦1|His⟧ ⟦1|侧链⟧仅部分⟦1|质子化⟧。"],[0,"（4）⟦1|酸性⟧ R 基：⟦1|Asp⟧、⟦1|Glu⟧；⟦1|侧链羧基⟧在 ⟦1|pH 7⟧.⟦1|0⟧ 附近解离带⟦2|负电⟧。"],[0,"（5）⟦1|芳香族⟧ R 基：含⟦1|芳香⟧环，包括 ⟦1|Phe⟧、⟦1|Tyr⟧、⟦1|Trp⟧。"]]],[0,1,1,2,"蛋白的一级结构与高级结构有何关系？",[[0,"①一级结构决定高级结构：⟦1|氨基酸⟧序列含有折叠⟦1|信息⟧；若一级结构未受破坏，在适宜条件下可能⟦2|复性⟧并恢复功能。"],[0,"②高级结构是一级结构的三维表达：正确的三级或四级⟦1|构象⟧是蛋白质发挥功能的基础。"]]],[0,1,1,3,"（1）列举确定蛋白质的氨基酸序列可以采取哪些方法。（2）举出两种可以得到已知氨基酸序列的蛋白样品的实验方法。",[[0,"①⟦1|Edman⟧ 法：⟦1|PITC⟧ ⟦2|标记⟧ N 端，⟦1|酸处理⟧切下该⟦1|残基⟧，再转为 ⟦1|PTH-⟧氨基酸，用 ⟦1|HPLC⟧ 鉴定；反复进行可连续⟦1|测序⟧。"],[0,"②⟦1|质谱法⟧：根据相邻⟦1|质谱⟧峰相差一个⟦1|残基⟧的⟦1|质量⟧推定序列。"],[0,"③根据基因⟦1|核苷酸⟧序列和⟦1|密码子⟧推定⟦1|多肽⟧氨基酸序列。"],[0,"（2）①⟦1|基因工程⟧法：按⟦1|密码子⟧⟦2|设计⟧ ⟦1|DNA⟧，⟦1|接入载体⟧表达；可用特异⟦2|抗体⟧亲和层析等方法纯化蛋白。"],[0,"②固相合⟦1|成法⟧：把⟦1|目标肽⟧ C 端固定在⟦1|树脂⟧上，以 ⟦1|DCC⟧ 促使氨基酸逐轮形成⟦1|肽键⟧，直至得到⟦2|目标⟧⟦1|多肽⟧。"]]],[0,1,1,4,"生物分子间和分子内基团间的非共价相互作用有哪些？它们有什么特点？",[[0,"非共价作用包括⟦2|离子⟧相互作用、⟦1|氢键⟧、范德华力和疏水相互作用。"],[0,"（1）⟦2|离子⟧相互作用：带电基团间的静电作用；⟦1|异号⟧相吸、同号相斥。盐可减弱，非⟦2|极性⟧⟦1|低介⟧电⟦2|环境⟧可增强。"],[0,"（2）⟦1|氢键⟧：⟦2|供体⟧ H 与带部分⟦2|负电⟧的⟦1|受体原子间⟧的静电作用；具⟦1|方向性⟧、饱和性和⟦2|协同⟧性。"],[0,"（3）范德华力：包括⟦2|极性⟧分子间的定向效应、⟦2|极性⟧与非⟦2|极性⟧分子间的⟦2|诱导效应⟧，以及分子间的 ⟦1|London⟧ ⟦1|分散力⟧。"],[0,"（4）疏水相互作用：水中非⟦2|极性⟧基团自发聚集的熵⟦2|驱动⟧作用，是稳定生物大分子三维结构的重要⟦1|力量⟧。"]]],[0,1,1,5,"测定蛋白质三维结构有哪些方法？",[[0,"①X ⟦1|射线⟧衍射：测定蛋白质⟦1|晶体⟧的三维结构。"],[0,"②核磁共振（⟦1|NMR⟧）：在原子水平⟦2|研究⟧⟦1|溶液⟧中蛋白质的三维结构，并提供⟦1|动态信息⟧。"],[0,"③紫外⟦1|光谱⟧：⟦2|检测⟧⟦1|芳香族⟧和⟦1|杂环共轭体系⟧在近紫外区的吸收。"],[0,"④⟦1|荧光⟧及⟦1|荧光偏振⟧：⟦2|检测⟧ ⟦1|Trp⟧、⟦1|Tyr⟧ 微⟦2|环境⟧和蛋白质构象变化。"],[0,"⑤⟦1|圆二色性⟧（CD）：反映二级结构变化，并估算⟦1|α-⟧⟦2|螺旋⟧、⟦1|β-⟧折叠和无规卷曲⟦2|含量⟧。"],[0,"⑥拉⟦1|曼光谱⟧：⟦2|研究⟧蛋白质⟦1|主链构象⟧。"],[0,"⑦⟦1|冷冻电⟧镜：⟦1|高精度解析⟧蛋白质结构。"]]],[0,1,1,6,"什么是蛋白质的二级结构？常见的二级结构有哪些？分别有什么特点？二级结构对蛋白质空间结构有什么影响？",[[0,"（1）二级结构：⟦1|多肽⟧局部⟦1|主链⟧的⟦2|空间⟧⟦1|构象⟧，不涉及⟦1|侧链⟧⟦2|定位⟧及与远⟦1|端肽⟧段的关系；⟦1|规则⟧结构主要由⟦1|主链氢键⟧稳定。"],[0,"（2）常见类型有⟦1|α-⟧⟦2|螺旋⟧、⟦1|β-⟧折叠、⟦1|β-转角⟧和无规卷曲，主要由链内或⟦1|链间氢键⟧稳定。"],[0,"（3）各类二级结构的特点及其对空间结构的影响。"],[1,"①⟦1|α-⟧⟦2|螺旋⟧：⟦1|右手⟧⟦2|螺旋⟧，⟦1|每圈⟧ ⟦1|3.6⟧ 个⟦1|残基⟧、⟦1|螺距⟧ ⟦1|0.54⟧ nm；链内第 i 个 C=O 与第 ⟦1|i+4⟧ 个 ⟦1|N-H⟧ 成⟦1|氢键⟧，并与其他⟦1|结构单元⟧共同构成整体⟦1|构象⟧。"],[1,"②⟦1|β-⟧折叠：⟦1|肽链⟧呈⟦1|锯齿状⟧伸展，相邻β股可⟦1|平行⟧或反⟦1|平行⟧排列，由⟦1|股间氢键⟧稳定；参与整体折叠与多聚体装配。"],[1,"③⟦1|β-转角⟧：⟦1|4⟧ 个连续⟦1|残基⟧使⟦1|肽链⟧约 ⟦1|180⟧°回折，第 n 个 C=O 与第 ⟦1|n+3⟧ 个 ⟦1|N-H⟧ 成⟦1|氢键⟧；常含 ⟦1|Gly⟧、⟦1|Pro⟧，用于连接⟦1|β-⟧折叠片段。"],[1,"④无规卷曲：较松散但非完全随机，可填充结构⟦1|间隙⟧并提供⟦1|柔性⟧，利于⟦1|构象⟧和功能变化。"]]],[0,1,1,7,"什么是蛋白质的变性作用？变性作用的原因有哪些？变性后发生哪些改变？",[[0,"（1）蛋白质变性：⟦1|物理⟧或⟦2|化学⟧因素破坏⟦1|次级键⟧，使天然⟦1|构象解体⟧、⟦2|活性⟧丧失、理化性质改变；通常不破坏一级结构。"],[0,"（2）原因分两类：⟦1|物理⟧因素有热、⟦1|紫外线⟧、⟦1|高压⟧、⟦1|表面张力⟧；⟦2|化学⟧因素有⟦1|有机溶剂⟧、脲、胍、酸、碱。"],[0,"（3）变性后的性质改变。"],[1,"①生物⟦2|活性⟧丧失，是变性的主要特征。"],[1,"②结构伸展使原先埋藏的⟦1|侧链⟧基团暴露，更易与⟦1|试剂⟧反应。"],[1,"③疏⟦1|水基⟧暴露使⟦1|溶解度⟧下降；分子伸展还使⟦1|黏度⟧升高、⟦1|扩散系数⟧降低，并改变⟦1|旋光性⟧和紫外吸收。"],[1,"④结构松散，更易被⟦1|蛋白酶⟧⟦2|水解⟧。"]]],[0,1,1,8,"什么是蛋白质的变性和蛋白质沉淀，二者有何相似性和区别？",[[0,"（1）变性：⟦1|次级键⟧被破坏，天然⟦1|构象解体⟧，导致⟦2|活性⟧和理化性质改变；通常不破坏一级结构。"],[0,"沉淀：⟦1|水化⟧膜或⟦1|双电层⟧被破坏，蛋白质失去分散⟦2|稳定性⟧并聚集析出；一般不破坏一级结构。"],[0,"（2）相似点"],[1,"①二者都可能伴随蛋白质沉淀。"],[1,"②部分沉淀方法同时利用蛋白质变性。"],[1,"③二者通常都不改变蛋白质一级结构。"],[1,"④变性程度较低时，变性和沉淀都可能可逆。"],[0,"（3）区别"],[1,"①变性破坏维持高级结构的⟦1|作用力⟧；沉淀主要破坏⟦1|水化⟧层和⟦1|双电层⟧，使⟦1|溶解度⟧降低。"],[1,"②变性通常难逆；部分沉淀可逆，如⟦1|盐析蛋白⟧在适当条件下可重新溶解。"],[1,"③变性使⟦2|活性⟧丧失；未伴变性的沉淀可保留⟦2|活性⟧，如⟦1|盐析⟧沉淀。"]]],[0,1,1,9,"影响α-螺旋的稳定性的因素？",[[0,"①⟦1|残基⟧形成螺旋的固有倾向：R 基⟦2|电荷⟧和⟦1|体积⟧影响⟦1|主链⟧φ、ψ角，进而影响螺旋形成。"],[0,"②相隔 ⟦1|3～4⟧ 个⟦1|残基⟧的 R 基可相互作用，影响⟦1|α-⟧螺旋稳定性。"],[0,"③相邻 R 基过大可产生⟦2|空间⟧位阻，如多聚 ⟦1|Ile⟧ 难以形成⟦1|α-⟧螺旋。"],[0,"④⟦1|Pro⟧ 的⟦1|刚性⟧环限制 ⟦1|N-C⟧ 旋转且缺少可成⟦1|氢键⟧的 ⟦1|N-H⟧；⟦1|Gly⟧ 过于⟦1|柔性⟧，⟦2|二者⟧均不利于螺旋稳定。"],[0,"⑤螺旋偶极使 N ⟦1|端带⟧部分⟦1|正电⟧、C ⟦1|端带⟧部分⟦2|负电⟧；因此⟦2|负电⟧⟦1|残基⟧常位于 N 端，⟦1|正电残基⟧常位于 C 端。"]]],[0,1,1,10,"为什么 Gly 和 Pro 不能出现在α螺旋中？",[[0,"Pro 和 Gly 并非绝对不能进入⟦1|α-⟧螺旋，但形成螺旋的倾向低，常降低其⟦2|稳定性⟧。"],[0,"Pro 的⟦1|刚性⟧环限制 ⟦1|N-C⟧ 旋转，且⟦1|酰胺⟧ N 无 H，不能参与⟦1|主链氢键⟧，因此常造成螺旋⟦1|折点⟧。"],[0,"Gly ⟦1|侧链⟧仅为 H，⟦1|构象⟧自由度过大，更倾向采取其他⟦1|卷曲构象⟧。"]]],[0,1,1,11,"甘氨酸的特点以及它在蛋白质二级结构形成中的作用。",[[0,"⟦1|Gly⟧ ⟦1|侧链⟧仅为 H，是结构最简单的⟦1|氨基酸⟧，⟦2|空间⟧位阻很小，几乎不发生侧⟦1|链间⟧作用。"],[0,"⟦1|Gly⟧ 使⟦1|肽链柔性⟧增大，可能破坏⟦1|α-⟧⟦2|螺旋⟧并降低⟦2|稳定性⟧；其⟦1|灵活性⟧又使其常见于⟦1|β-转角⟧和无规卷曲区。"]]],[0,1,1,12,"球状蛋白质三级结构有哪些特征及分类（结构域分类）？",[[0,"（1）⟦1|结构特征⟧。"],[1,"①⟦2|核心⟧多由⟦1|α-⟧⟦2|螺旋⟧和⟦1|β-⟧折叠构成；球状⟦1|蛋白⟧及部分⟦1|膜蛋白⟧常含两种以上二级结构，多数纤维蛋白主要含一种。"],[1,"②折叠有层次：二级结构可在⟦2|空间⟧相邻并相互作用，形成超二级结构。"],[1,"③分子整体通常为紧密的球状或⟦1|椭球⟧状⟦1|实体⟧。"],[1,"④疏水⟦1|侧链⟧多埋在内部，⟦1|亲水侧链⟧多露于⟦2|表面⟧；折叠受⟦1|二面角⟧和⟦1|手性⟧限制，疏水作用是形成三级结构的主要⟦1|动力⟧。"],[1,"⑤⟦2|表面⟧⟦1|空穴⟧常为⟦2|配体⟧结合或催化⟦1|位点⟧，周围疏水⟦1|侧链⟧可提供适宜的反应⟦2|环境⟧。"],[0,"（2）结构域分类。"],[1,"①全α类：⟦1|α-⟧⟦2|螺旋⟧占优势或仅含⟦1|α-⟧⟦2|螺旋⟧，常用参考范围为α>⟦1|15⟧%、β<⟦1|10⟧%。"],[1,"②全β类：⟦1|β-⟧折叠占优势或仅含⟦1|β-⟧折叠，常用参考范围为β>⟦1|15⟧%、α<⟦1|10⟧%。"],[1,"③α/β类：⟦1|α-⟧⟦2|螺旋⟧与β股交替出现，⟦2|二者⟧通常均>⟦1|10⟧%，以⟦1|平行⟧或⟦1|混合⟧β片层为基础。"],[1,"④⟦1|α+β⟧类：⟦1|α-⟧⟦2|螺旋⟧与⟦1|β-⟧折叠分别聚集在不同区域，常用参考范围为α>⟦1|10⟧%、β>⟦1|15⟧%。"],[1,"⑤富含⟦2|金属⟧或⟦1|二硫键⟧类：⟦2|金属⟧⟦1|配位⟧或⟦1|二硫键⟧稳定⟦1|构象⟧；破坏⟦1|二硫键⟧可使天然⟦1|构象⟧丧失。"]]],[0,1,1,13,"蛋白质变性作用与变构作用有何本质差别？",[[0,"（1）⟦2|变性⟧：⟦1|物理⟧或⟦2|化学⟧因素破坏⟦1|次级键⟧，使整体天然⟦1|构象解体⟧、⟦2|活性⟧丧失，但一级结构通常完整。"],[0,"变构：调节⟦1|位点⟧非⟦2|共价⟧结合⟦2|配体⟧，引起可逆构象变化，从而改变⟦2|活性⟧⟦1|位点⟧的结合或催化⟦2|能力⟧。"],[0,"（2）差别"],[1,"①⟦2|变性⟧常使天然结构⟦1|解体⟧，且通常难逆；变构为可逆构象变化，⟦2|效应⟧物移除后可恢复。"],[1,"②⟦2|变性⟧常使功能完全丧失；变构可增强或抑制⟦2|活性⟧。"],[1,"③⟦2|变性⟧多由⟦1|极端⟧⟦2|环境⟧引起并常有害；变构是代谢、⟦2|信号⟧和酶⟦2|活性⟧调节机制。"]]],[0,1,1,14,"简述疏水相互作用及其对蛋白质结构的影响。",[[0,"（1）疏水相互作用：水中非⟦2|极性⟧分子或基团自发聚集的非⟦2|共价⟧作用，是稳定生物大分子三维结构的重要⟦1|作用力⟧。"],[0,"（2）对蛋白质折叠和组装的影响。"],[1,"①折叠时疏水⟦1|侧链⟧埋入内部形成疏水核，从而稳定三级结构。"],[1,"②⟦1|亚基⟧缔合埋藏暴露的疏⟦1|水面⟧，增强疏水作用，稳定四级结构。"]]],[0,1,1,15,"大多数球状蛋白具有下列性质的原因：（1）低 pH 发生沉淀；（2）离子强度从零逐渐增加时，其溶解度开始增加，然后下降，最后出现沉淀；（3）在一定的离子强度下，达到等电点 pH 值时，表现出最小的溶解度；（4）加热时沉淀；（5）加入一种可和水混溶的非极性溶剂减小其介质的介电常数，导致溶解度的减小；（6）如果加入一种非极性强的溶剂，使介电常数大大地下降会导致变性。",[[0,"（1）低 pH 使基团⟦1|质子化⟧，破坏盐键并增强同号⟦2|电荷⟧排斥；⟦1|构象⟧伸展、疏水核暴露后发生变性沉淀。"],[0,"（2）低盐可⟦1|屏蔽⟧蛋白质间的⟦1|静电⟧吸引，提高溶解度；高盐时盐离子⟦2|竞争⟧⟦1|水化⟧水，促进疏水聚集，引起⟦1|盐析⟧。"],[0,"（3）pH=pI 时蛋白质净⟦2|电荷⟧为 ⟦1|0⟧，分子间缺少⟦1|静电⟧排斥，易聚集，因此溶解度最低。"],[0,"（4）加热破坏维持天然⟦1|构象⟧的作用，使疏⟦1|水基⟧暴露，继而聚集沉淀。"],[0,"（5）⟦1|乙醇⟧、⟦1|丙酮⟧等与水⟦1|互溶⟧的⟦1|有机溶剂⟧降低介电常数并削弱⟦1|水化⟧作用，增强蛋白质间吸引，使溶解度下降。"],[0,"（6）⟦1|高浓度有机溶剂⟧改变水⟦2|环境⟧与非⟦2|共价⟧作用，使疏水⟦2|核心⟧展开，导致蛋白质变性。"]]],[0,1,1,16,"为什么α螺旋比许多其他可能的构象更容易形成？",[[0,"①⟦1|α-⟧螺旋可充分形成链内⟦1|氢键⟧：第 n 个 C=O 与第 ⟦1|n+4⟧ 个 ⟦1|N-H⟧ 配对，⟦1|每圈⟧约有 ⟦1|3～4⟧ 个⟦1|氢键⟧；两端各有 ⟦1|3～4⟧个未配对的 ⟦1|N-H⟧ 或 C=O，还能与水⟦1|成键⟧。"],[0,"②各⟦1|肽键⟧ ⟦1|N-H⟧ 和 C=O 的偶极沿螺旋轴同向排列，形成整体螺旋偶极：N ⟦1|端带⟧部分⟦1|正电⟧、C ⟦1|端带⟧部分⟦2|负电⟧，⟦1|有助⟧稳定结构。"]]],[0,1,1,17,"举例说明蛋白质的结构与其功能之间的关系。",[[0,"（1）结构决定功能：一级结构决定高级结构，⟦1|序列改变⟧可影响功能，相似序列常功能相近；高级⟦1|构象⟧被破坏时，即使一级结构完整，也可能⟦2|失活⟧。"],[0,"（2）⟦1|举例⟧。"],[1,"①⟦1|镰刀⟧型⟦1|贫血⟧：⟦1|HbS⟧ 与 ⟦1|HbA⟧ 的α链相同，仅 ⟦1|HbS⟧ β链第 ⟦1|6⟧ 位 ⟦1|Glu⟧ 被 ⟦1|Val⟧ 替换，即引起结构和功能异常。"],[1,"②⟦1|同源蛋白⟧：序列越相似，功能通常越接近；如⟦1|亲缘⟧越近的⟦1|物种⟧，⟦1|Cyt c⟧ ⟦1|残基⟧⟦2|差异⟧越少。"],[1,"③⟦1|RNase A⟧：天然⟦1|构象⟧有⟦2|活性⟧；还原⟦1|二硫键⟧并去折叠后⟦2|失活⟧；恢复⟦1|构象⟧和⟦1|二硫键⟧后⟦2|活性⟧恢复。"]]],[0,1,1,18,"任举一个例子来说明蛋白质三维结构决定于它的氨基酸顺序？",[[0,"（1）一级结构含有折叠⟦1|信息⟧，决定高级结构；⟦2|变性⟧可使⟦1|蛋白⟧⟦2|失活⟧，若一级结构未损伤，去除⟦2|变性⟧因素后可能⟦2|复性⟧。"],[0,"（2）⟦1|RNase A⟧ 在 ⟦1|8⟧ ⟦1|mol⟧/L ⟦1|尿素⟧或 ⟦1|6⟧ ⟦1|mol⟧/L ⟦1|盐酸⟧胍中经⟦1|β-巯基乙醇⟧处理，⟦1|4⟧ 个⟦1|二硫键⟧断裂并展开；透析去除⟦1|变性剂⟧后⟦2|活性⟧恢复至 ⟦1|95⟧%～⟦1|100⟧%。若不先⟦2|变性⟧，⟦1|37⟧℃、⟦1|pH 7⟧ 时⟦1|二硫键⟧很难被还原。"]]],[0,1,1,19,"试述血红蛋白 Bohr 效应涉及的[H+]、[CO2]、BPG 的相互关系及其生理意义。",[[0,"Bohr 效应：⟦1|H⁺⟧ 增加（pH 降低）或 ⟦1|CO₂⟧升高使 Hb 氧⟦2|亲和力⟧下降、氧合⟦2|曲线⟧⟦1|右移⟧，促进⟦1|释氧⟧。"],[0,"（1）⟦1|H⁺⟧ 和 ⟦1|CO₂⟧：⟦1|CO₂水合⟧产生 ⟦1|HCO₃⁻⟧ 和 ⟦1|H⁺⟧ ；β链 ⟦1|His146⟧ ⟦1|质子化⟧后与 ⟦1|Asp94⟧ ⟦1|成盐桥⟧，稳定 T 态去氧 Hb。"],[0,"⟦1|CO₂⟧还与⟦1|珠蛋白⟧ N 端⟦1|氨基⟧形成氨⟦1|甲酰⟧ Hb 并释放 ⟦1|H⁺⟧ ；新增⟦1|盐桥⟧稳定 T 态，增强 Bohr 效应。去氧 Hb 对 ⟦1|H⁺⟧ ⟦2|亲和力⟧更高。"],[0,"意义：代谢旺盛组织 pH 低、⟦1|CO₂⟧高，促使 Hb 释氧并结合 ⟦1|H⁺⟧ 、⟦1|CO₂⟧；肺中 ⟦1|O₂⟧高，Hb 结合 ⟦1|O₂⟧并释放 ⟦1|H⁺⟧ 、⟦1|CO₂⟧。"],[0,"（2）BPG：与去氧 Hb 结合并稳定 T 态，促进⟦1|释氧⟧；⟦1|O₂⟧结合会破坏 BPG 结合⟦1|位点⟧，⟦2|二者⟧相互排斥。"],[0,"意义：BPG 升高主要增强组织⟦1|释氧⟧，对⟦1|肺部摄氧⟧影响较小；缺氧时可⟦1|代偿⟧性升高，如⟦1|肺气肿患者⟧。"]]],[0,1,1,20,"酶联免疫吸附测定的包括哪些基本步骤以及有何应用？",[[0,"⟦1|ELISA⟧ 利用⟦1|抗原⟧⟦2|抗体⟧特异结合和酶促显色⟦1|筛查⟧、⟦2|定量⟧⟦1|抗原⟧或⟦2|抗体⟧。以下为⟦2|检测⟧⟦1|抗原⟧的一种间接法⟦1|流程⟧。"],[1,"①将含待测⟦1|抗原⟧的⟦2|样品⟧吸附于⟦1|惰性⟧固相⟦2|表面⟧。"],[1,"②加入非特异⟦1|蛋白温育⟧，封闭未被⟦2|样品⟧占据的固相位点。"],[1,"③加入针对待测⟦1|蛋白⟧的一抗，⟦1|温育后⟧洗去未结合⟦2|抗体⟧。"],[1,"④⟦1|加入酶⟧标二抗，使其结合一抗；⟦1|标记酶⟧可用⟦1|辣根过氧化物⟧酶。"],[1,"⑤洗去未结合二抗，加入底物显色；在⟦2|检测⟧范围内，⟦1|颜色⟧⟦2|强度⟧反映⟦1|抗原⟧⟦2|含量⟧。"],[0,"应用①快速⟦1|筛查⟧和⟦2|定量样品⟧中的特定⟦1|抗原⟧。"],[1,"②⟦1|疾病诊断⟧：⟦2|检测⟧⟦1|体液⟧中的⟦1|病原体抗原⟧或⟦2|抗体⟧，如 ⟦1|HIV⟧、⟦1|肝炎⟧⟦2|病毒⟧及⟦1|细菌⟧感染相关⟦1|指标⟧。"],[1,"③生物⟦1|标志物⟧⟦2|检测⟧：⟦2|定量⟧⟦1|标志物⟧以⟦1|监测病程⟧或⟦1|疗效⟧，如 ⟦1|PSA⟧。"],[1,"④免疫⟦2|研究⟧：⟦2|检测⟧⟦1|细胞因子⟧分泌、免疫球蛋白水平等免疫反应。"]]],[0,1,1,21,"简述血红蛋白的结构及其结构与功能的关系。",[[0,"（1）结构：Hb 为 ⟦1|4⟧ ⟦1|亚基⟧（⟦1|2⟧ 条α链、⟦1|2⟧ 条β链）的⟦1|四聚体⟧；每个⟦1|亚基含⟧ ⟦1|1⟧ 个⟦1|血红素⟧，可结合 ⟦1|1⟧ 个 ⟦1|O₂⟧。"],[0,"（2）结构与功能的关系。"],[1,"①四级结构产生⟦1|协同效应⟧：首个⟦1|亚基⟧结合 ⟦1|O₂⟧后部分盐键断裂、⟦1|构象⟧改变，提高其余⟦1|亚基⟧的氧⟦2|亲和力⟧，促进后续 ⟦1|O₂⟧结合。"],[1,"②一级结构异常可致病：⟦1|HbS⟧ 与 ⟦1|HbA⟧ 的α链相同，但 ⟦1|HbS⟧ β链第 ⟦1|6⟧ 位 ⟦1|Glu⟧ 被 ⟦1|Val⟧ 替换，引起⟦1|镰刀⟧型⟦1|贫血⟧。"]]],[0,1,1,22,"Mb 和 Hb 结合氧的能力哪个更强，为什么？这对生理有何意义？",[[0,"Mb 对 ⟦1|O₂⟧的⟦2|亲和力⟧高于 Hb。"],[0,"（1）原因：Mb 为⟦1|单体⟧，⟦1|低氧⟧时仍有较高氧⟦2|亲和力⟧；Hb 为⟦1|四聚体⟧，⟦1|亚基⟧⟦2|协同⟧使氧合⟦2|曲线⟧呈 S 形，适于随⟦1|氧分压⟧变化结合或释放 ⟦1|O₂⟧。"],[0,"（2）意义：Mb 可从⟦1|低氧血液⟧中获取并⟦2|储存⟧ ⟦1|O₂⟧；Hb 在高氧的肺中充分结合 ⟦1|O₂⟧，在⟦1|低氧⟧组织中⟦2|大量⟧释放，实现高效⟦2|运输⟧。"]]],[0,1,1,23,"二磷酸甘油酸（BPG）是如何调节血红蛋白运氧功能的？",[[0,"①BPG 是 Hb 的异促⟦1|别构抑制⟧剂：Hb 为⟦1|α₂β₂四聚体⟧，⟦1|中央⟧有 ⟦1|1⟧ 个⟦1|空穴⟧；带⟦2|负电⟧的 BPG 在此与两条β链⟦1|正电残基⟧成盐键，稳定 T 态并促使⟦1|释氧⟧。"],[0,"②BPG 使 Hb 氧合⟦2|曲线⟧⟦1|右移⟧，主要影响去氧 Hb；因此在组织⟦1|低氧⟧时增加⟦1|释氧⟧，调节⟦2|运输⟧效率。"]]],[0,1,1,24,"以血红蛋白和肌红蛋白为例，具体分析二者的结构与功能的异同点比较，从而解释空间结构决定生物学功能的关系。",[[0,"（1）⟦2|相同点⟧。"],[1,"①Hb 和 Mb 均为⟦1|球状⟧含⟦1|血红素蛋白⟧，⟦1|珠蛋白链⟧的序列和三级结构具有同源性。"],[1,"②二者每条⟦1|珠蛋白链⟧均结合 ⟦1|1⟧ 个⟦1|血红素⟧，可与 ⟦1|O₂⟧可逆结合。"],[0,"（2）⟦2|不同点⟧。"],[1,"①结构：Hb 为⟦1|α₂β₂四聚体⟧，具有四级结构和 ⟦1|4⟧ 个 ⟦1|O₂⟧结合⟦1|位点⟧；Mb 为⟦1|单体⟧，只有三级结构和 ⟦1|1⟧ 个 ⟦1|O₂⟧结合⟦1|位点⟧。"],[1,"②结合⟦1|特性⟧：Hb 有正⟦1|协同效应⟧，氧合⟦2|曲线⟧呈 S 形，并受 ⟦1|H⁺⟧ 、⟦1|CO₂⟧和 ⟦1|BPG⟧ 调节；Mb 无⟦1|协同效应⟧，氧合⟦2|曲线⟧呈⟦1|双曲线⟧，对 ⟦1|O₂⟧⟦2|亲和力⟧更高。"],[1,"③功能：Hb 在⟦1|血液⟧中⟦2|运输⟧ ⟦1|O₂⟧ 分子更快。"],[0,"（2）⟦1|SDS-PAGE⟧ 操作流程。"],[1,"①⟦1|制胶⟧：按⟦2|目标⟧⟦1|蛋白分子量⟧选⟦2|凝胶⟧浓度；⟦1|低浓度孔径⟧大，适合较大⟦1|蛋白⟧，⟦1|高浓度⟧适合较小⟦1|蛋白⟧。"],[1,"②⟦2|样品⟧制备：⟦1|蛋白⟧与 SDS ⟦1|混合⟧加热⟦2|变性⟧，并加 ⟦1|DTT⟧ 或⟦1|β-巯基乙醇⟧还原⟦1|二硫键⟧。"],[1,"③把处理后的⟦2|样品⟧加入⟦2|凝胶⟧⟦1|加样⟧孔。"],[1,"④加⟦1|电压⟧，带⟦2|负电⟧的蛋白质向⟦1|阳极⟧迁移。"],[1,"⑤用考⟦1|马斯亮⟧蓝等⟦1|染色⟧，再脱去⟦1|背景色⟧，使⟦1|蛋白条带⟧可见。"],[0,"（3）各部分功能。"],[1,"①⟦2|凝胶⟧：上层⟦1|低浓度⟧浓缩胶将⟦2|样品⟧浓缩成⟦1|窄带⟧；⟦1|下层高浓度⟧分离胶⟦1|孔径⟧较小，按⟦1|分子量⟧分离。"],[1,"②SDS：使⟦1|蛋白⟧展开，并赋予近似一致的⟦1|荷质⟧比，掩盖天然⟦2|电荷差异⟧。"],[1,"③⟦2|样品⟧⟦1|缓冲液⟧：SDS 负责⟦2|变性⟧，⟦2|甘油⟧增加⟦1|密度⟧，⟦1|Tris⟧ 维持 pH，⟦1|还原剂⟧断开⟦1|二硫键⟧。"],[1,"④⟦1|染料⟧：考⟦1|马斯亮⟧蓝或⟦1|银染⟧与⟦1|蛋白⟧结合，使⟦1|条带⟧显现。"],[0,"（4）应用。"],[1,"①⟦1|分子量⟧⟦2|分析⟧：与⟦1|标准蛋白标尺⟧比较，估算⟦2|样品⟧⟦1|蛋白分子量⟧并⟦1|辅助⟧鉴定、⟦1|纯度⟧⟦2|分析⟧。"],[1,"②⟦1|蛋白⟧表达比较：用 ⟦1|SDS-PAGE⟧ 比较不同⟦2|样品⟧的蛋白质表达⟦2|差异⟧。"],[1,"③鉴定与验证：⟦2|检测⟧⟦1|纯度⟧，并据⟦1|分子量辅助⟧验证⟦2|重组⟧⟦1|蛋白⟧的表达和纯化。"]]],[0,1,1,28,"说明等电聚焦技术的基本原理。",[[0,"等电聚焦又称电聚焦⟦1|电泳⟧。⟦1|两性电解质⟧在聚⟦1|丙烯酰胺⟧⟦2|凝胶⟧中形成 pH ⟦2|梯度⟧；蛋白质在⟦1|电场⟧中迁移至 pH=pI 处后净⟦2|电荷⟧为 ⟦1|0⟧，停止⟦2|移动⟧并聚成⟦1|窄带⟧。该法⟦1|分辨率⟧高，可测蛋白质 pI。"]]],[0,1,1,29,"简述蛋白质双向电泳（2-DE）的原理与主要应用。",[[0,"（1）原理：先 ⟦1|IEF⟧ 按 pI 分离，再将⟦1|胶条⟧转 ⟦1|90⟧°置于 ⟦1|SDS-PAGE⟧ 上按⟦1|分子量⟧分离；⟦1|图谱⟧横向为 pI、纵向为⟦1|分子量⟧，可⟦1|区分⟧单一⟦1|维度⟧相近的⟦1|蛋白⟧。"],[0,"（2）主要应用。"],[1,"①蛋白质组学：用 ⟦1|2⟧-DE 分离不同⟦1|生物体⟧、组织或⟦2|生理⟧状态的复杂蛋白质⟦2|样品⟧。"],[1,"②蛋白质鉴定：提供分离⟦1|图谱⟧，筛出⟦2|疾病⟧⟦1|模型⟧或⟦1|标志物⟧⟦2|研究⟧中的⟦2|差异⟧⟦1|蛋白⟧，再结合⟦1|质谱⟧等鉴定。"],[1,"③定量分析：比较⟦2|凝胶⟧⟦1|斑点⟧⟦2|强度⟧，估计不同⟦2|样品⟧的⟦1|蛋白⟧表达水平。"],[1,"④修饰⟦2|研究⟧：利用翻译后修饰造成的 pI 或⟦1|分子量⟧变化进行⟦2|分析⟧。"],[1,"⑤⟦2|疾病⟧⟦1|标志物⟧筛选与验证：用 ⟦1|2⟧-DE 比较健康和⟦2|疾病⟧⟦1|样本图谱⟧，发现⟦2|差异⟧表达的候选⟦1|蛋白⟧。"]]],[0,1,1,30,"何谓蛋白质的构象？构象与构型有何不同？",[[0,"（1）构象：分子某一⟦1|时刻⟧的⟦2|空间⟧形态，可经⟦1|单键⟧旋转互变，不需断裂⟦1|共价键⟧；构象变化仍可影响⟦1|旋光性⟧。"],[0,"构型：原子或基团的固定⟦2|空间⟧排列；互变须断裂并重建⟦1|共价键⟧，⟦1|常伴旋光性⟧变化。"],[0,"（2）区别：①构象可有多种且由⟦1|单键⟧旋转产生；构型是固定的⟦1|立体⟧排列，转换⟦1|需断键⟧。②构象描述⟦1|动态⟧立体化学，构型描述⟦1|静态⟧立体化学。"]]],[0,1,1,31,"写出在强酸性阳离子交换柱上 Gly、Ile、Asp、Arg 几种氨基酸的洗脱先后顺序并解释原因。",[[0,"（1）强酸性阳离子交换⟦1|树脂⟧带⟦2|负电⟧；给定 pH 下，氨基酸⟦1|正电荷⟧越多，结合越强，洗脱越晚。"],[0,"（2）洗脱⟦1|顺序⟧要看 pI 和疏水相互作用（见⟦1|教材⟧有详细介绍）"],[0,"先考虑 pI：Asp 的 pI 最低，最先洗脱；Gly 和 Ile 的 pI 属于中等，中间⟦1|顺序⟧洗脱；Arg 的 pI 最高、⟦1|正电荷⟧最多，最后洗脱。"],[0,"再考虑疏水相互作用：Gly 和 Ile 的 pI 接近，都为非⟦2|极性⟧氨基酸，非⟦2|极性⟧越强，洗脱越慢，Ile 属于非⟦2|极性⟧特别强的氨基酸，故洗脱晚。"],[0,"因此常见洗脱⟦1|顺序⟧为 Asp→Gly→Ile→Arg；"]]],[0,1,1,32,"多肽链的部分裂解成小片段的方法有哪些？",[[0,"（1）酶裂解法。"],[1,"①胰蛋白酶：切断 ⟦1|Lys⟧ 或 ⟦1|Arg⟧ ⟦1|残基羧基⟧侧的⟦1|肽键⟧。"],[1,"②⟦1|糜蛋白酶⟧：切断 ⟦1|Phe⟧、⟦1|Trp⟧、⟦1|Tyr⟧ 等疏水⟦1|残基羧基⟧侧的⟦1|肽键⟧；"],[1,"③胃蛋白酶：切断 ⟦1|Phe⟧、⟦1|Trp⟧、⟦1|Tyr⟧ 等疏水⟦1|残基氨基⟧侧的⟦1|肽键⟧。"],[1,"④内切⟦1|蛋白酶⟧ ⟦1|Lys C⟧：专切 ⟦1|Lys⟧ ⟦1|残基羧基⟧侧的⟦1|肽键⟧。"],[1,"⑤⟦1|葡萄球菌蛋白酶⟧：在 ⟦1|pH 7⟧.⟦1|8⟧ ⟦1|磷酸缓冲液⟧中切断 ⟦1|Glu⟧ 或 ⟦1|Asp⟧ ⟦1|残基羧基⟧侧的⟦1|肽键⟧。"],[1,"⑥⟦1|Asp-N⟧ ⟦1|蛋白酶⟧：专切 ⟦1|Glu⟧ 或 ⟦1|Asp⟧ ⟦1|残基氨基⟧侧的⟦1|肽键⟧。"],[1,"⑦⟦1|小鼠下颚⟧腺⟦1|蛋白酶⟧：专切 ⟦1|Arg⟧ ⟦1|残基羧基⟧侧的⟦1|肽键⟧。"],[0,"（2）⟦2|化学⟧裂解法。"],[1,"①⟦1|溴化氰⟧：专切 ⟦1|Met⟧ ⟦1|残基羧基⟧侧的⟦1|肽键⟧。"],[1,"②⟦1|羟胺⟧（⟦1|NH₂OH⟧）：在 ⟦1|pH 9⟧ 时专切 ⟦1|Asn-Gly⟧ 之间的⟦1|肽键⟧。"]]],[0,1,1,33,"蛋白质分子中 N-末端和 C-末端氨基酸残基的鉴定方法有哪些？",[[0,"（1）N 端⟦1|残基分析方法⟧。"],[1,"①⟦1|DNFB⟧（⟦1|FDNB⟧）法：N 端⟦1|氨基⟧与 ⟦1|Sanger⟧ ⟦1|试剂⟧形成⟦1|耐酸⟧ ⟦1|DNP⟧ ⟦2|衍生物⟧；完全⟦2|水解⟧后，提取⟦1|黄色⟧ ⟦1|DNP-氨基酸⟧并⟦1|层析⟧鉴定。"],[1,"②⟦1|DNS⟧ 法：⟦1|原理⟧同 ⟦1|DNFB⟧ 法；产物有强⟦1|荧光⟧，⟦1|灵敏度⟧约高 ⟦1|100⟧ 倍；⟦2|水解⟧后用⟦1|纸电泳⟧或⟦1|薄层层析⟧鉴定。"],[1,"③⟦1|Edman⟧ 法：⟦1|PITC⟧ 在⟦1|弱碱⟧中⟦2|标记⟧ N 端，⟦1|酸处理⟧切下该⟦1|残基⟧，再转为稳定的 ⟦1|PTH-氨基酸⟧，用 ⟦1|HPLC⟧ 鉴定；反复进行可连续⟦1|测序⟧。"],[1,"④⟦1|氨肽酶⟧法：从 N 端逐个切下⟦1|残基⟧；按释放⟦1|顺序⟧确定 N 端⟦1|残基⟧及邻近序列。"],[0,"（2）C 端⟦1|残基分析方法⟧。"],[1,"①肼解法：无水肼 ⟦1|100⟧℃处理使 C 端⟦1|残基⟧⟦2|游离⟧、其余⟦1|残基成肼⟧⟦2|衍生物⟧；鉴定⟦2|游离⟧⟦1|氨基酸⟧即可确定 C 端。"],[1,"②⟦1|还原法⟧：⟦1|LiBH₄⟧把 C 端⟦1|残基⟧还原为⟦1|α-氨基醇⟧；完全⟦2|水解⟧后以⟦1|层析⟧鉴定。"],[1,"③⟦1|羧肽酶⟧法：从 C 端逐个切下⟦1|残基⟧；按释放⟦1|顺序⟧确定 C 端⟦1|残基⟧及邻近序列。"]]],[0,1,1,34,"试述蛋白质多肽链的氨基酸顺序分析的一般步骤。",[[0,"（1）分析末端⟦1|残基⟧，判断不同多肽链的⟦1|数目⟧和种类；不同链的末端通常不同。"],[0,"（2）拆分⟦1|亚基⟧：非⟦2|共价⟧缔合用⟦1|尿素⟧、⟦1|盐酸⟧胍或高盐解离；⟦1|链间二硫键⟧用⟦1|氧化剂⟧或⟦1|还原剂⟧断开。"],[0,"（3）在第 ⟦1|4⟧ 步前，用⟦1|氧化剂⟧或⟦1|还原剂断开链⟧内⟦1|二硫键⟧。"],[0,"（4）取部分纯化多肽链完全⟦2|水解⟧，测定氨基酸组成及⟦1|残基数目⟧或⟦1|比例⟧。"],[0,"（5）另取⟦2|样品⟧鉴定 N 端和 C 端⟦1|残基⟧，作为重建完整序列的两个⟦1|参考点⟧。"],[0,"（6）用两种以上⟦1|切点⟧不同的方法裂解各链，得到相互重叠的肽段，并分别纯化。"],[0,"（7）测定各⟦1|小肽⟧序列，常用 ⟦1|Edman⟧ 降解或⟦1|自动⟧序列⟦1|分析仪⟧。"],[0,"（8）利用不同肽段的交错重叠关系，拼接出完整多肽链序列。"],[0,"（9）用对角线电泳⟦2|定位⟧⟦1|二硫键⟧：首次⟦1|电泳⟧后断开⟦1|二硫键⟧，转 ⟦1|90⟧°再⟦1|电泳⟧；据偏离⟦1|对角线⟧的肽段确定原⟦1|二硫键⟧连接。"],[0,"（10）必要时确定 ⟦1|Asn⟧、⟦1|Gln⟧ ⟦1|残基⟧的⟦1|酰胺⟧基位置。"]]],[0,1,1,35,"现有一六肽，Leu-Leu-Arg-Val-Phe-Asp，分析其分别在如下三种不同反应条件下会得到什么物质：",[[0,"（1）利用 ⟦1|2⟧，⟦1|4⟧-二⟦1|硝基氟苯⟧（⟦1|DNFB⟧）反应会得到什么？"],[0,"（2）利用胰蛋白酶反应会得到哪几个⟦1|多肽⟧，得到的几个⟦1|多肽⟧分别用 ⟦1|DNFB⟧ 反应又会得到什么？"],[0,"（3）用胰⟦1|凝乳蛋白酶⟧反应会得到哪几个⟦1|多肽⟧？【求臻⟦1|答案⟧】"],[0,"（1）⟦1|DNFB⟧ 法的⟦1|基本原理⟧：⟦1|DNFB⟧ 即 ⟦1|2⟧,⟦1|4⟧-二⟦1|硝基氟苯⟧，在弱⟦1|碱性⟧⟦2|环境⟧（pH=⟦1|8.0~9.0⟧）下可以与蛋白质 N 末端的α⟦1|氨基酸⟧结合生成稳定的 ⟦1|2⟧,⟦1|4⟧-⟦1|二硝基苯多肽⟧（⟦1|DNP-多肽⟧），⟦1|酸性⟧条件下⟦2|水解⟧后，得到⟦1|黄色⟧ ⟦1|DNP-氨基酸⟧。其余的⟦1|氨基酸⟧⟦2|游离⟧存在。所以得到的产物为 ⟦1|DNP-Leu⟧，和其余 ⟦1|5⟧ 个⟦2|游离⟧⟦1|氨基酸⟧。"],[0,"（2）胰蛋白酶：专一裂解 ⟦1|Lys⟧、Arg 的⟦1|羧基⟧参与形成的⟦1|肽键⟧。所以会得到两个⟦1|多肽⟧，分别为 ⟦1|Leu-Leu-Arg⟧ 和⟦1|Val-Phe-Asp⟧。用 ⟦1|DNFB⟧ 处理后，得到 ⟦1|DNP-Leu⟧ 和 ⟦1|DNP-Val⟧，以及其余 ⟦1|4⟧ 种⟦2|游离⟧⟦1|氨基酸⟧。"],[0,"（3）胰⟦1|凝乳蛋白酶⟧：断裂 Phe、⟦1|Trp⟧、⟦1|Tyr⟧ 等疏水⟦1|氨基酸⟧的⟦1|羧基⟧所形成的⟦1|肽键⟧。所以会得到⟦1|多肽Leu-Leu-Arg-Val-Phe⟧"]]],[0,1,1,36,"现需测定某六肽序列，已知其含有 1 个 Asp、1 个 Val、1 个 Phe、2 个 Leu、1 个 Arg。请根据以下条件推断出六肽顺序。",[[0,"（1）利用 ⟦1|2⟧，⟦1|4⟧-二⟦1|硝基氟苯⟧（⟦1|DNFB⟧）反应得到 ⟦1|DNP-Leu⟧；"],[0,"（2）利用胰蛋白酶裂解成为两个⟦1|三肽⟧，其中⟦1|一肽⟧段再次与 ⟦1|DNFB⟧ 反应得到 ⟦1|DNP-Val⟧；"],[0,"（3）用胰⟦1|凝乳蛋白酶⟧⟦2|水解⟧得到一个⟦1|五肽⟧和⟦2|游离⟧的 Asp。【求臻⟦1|答案⟧】"],[0,"（1）⟦1|DNFB⟧ 法的⟦1|基本原理⟧：⟦1|DNFB⟧ 即 ⟦1|2⟧,⟦1|4⟧-二⟦1|硝基氟苯⟧，在弱⟦1|碱性⟧⟦2|环境⟧（pH=⟦1|8.0~9.0⟧）下可以与蛋白质 N 末端的α⟦1|氨基酸⟧结合生成稳定的 ⟦1|2⟧,⟦1|4⟧-⟦1|二硝基苯多肽⟧（⟦1|DNP-多肽⟧），⟦1|酸性⟧条件下⟦2|水解⟧后，得到⟦1|黄色⟧ ⟦1|DNP-氨基酸⟧。所以Leu 在 N 端。"],[0,"（2）胰蛋白酶：专一裂解 ⟦1|Lys⟧、Arg 的⟦1|羧基⟧参与形成的⟦1|肽键⟧。所以 Val 在第四位，第三位为 Arg。"],[0,"（3）胰⟦1|凝乳蛋白酶⟧：断裂 Phe、⟦1|Trp⟧、⟦1|Tyr⟧ 等疏水⟦1|氨基酸⟧的⟦1|羧基⟧所形成的⟦1|肽键⟧。所以第五位为 Phe，最后为 Asp。"],[0,"⟦1|综上⟧，序列为：⟦1|Leu-Leu-Arg-Val-Phe-Asp⟧。"]]],[0,1,1,37,"根据分子量、等电点判定蛋白质被洗脱的先后顺序（a）Mr=9000Da  pI=10；    （b）Mr=28000Da pI=6；（c）Mr=62000Da  pI=7；    （d）Mr=12000Da pI=4；分别指出在下述柱层析的情况下，上述四种蛋白质被洗脱的先后顺序，并简单解释：",[[0,"（1）该⟦1|混合物⟧用 ⟦1|DEAE-纤维素⟧柱层析时，在 ⟦1|pH8⟧.⟦1|0⟧ ⟦1|缓冲液⟧中以逐渐增高洗脱液的⟦1|盐浓度⟧方式进行洗脱。"],[0,"（2）该⟦1|混合物⟧用 ⟦1|SephadcxG-100⟧ ⟦1|介质⟧进行柱层析时，在⟦1|中性缓冲液⟧中进行洗脱。【求臻⟦1|答案⟧】"],[0,"（1）⟦1|DEAE-纤维素⟧柱层析为⟦1|阴离子⟧交换剂，带⟦1|正电⟧的先被洗下，带的⟦2|负电⟧越多越不容易被洗下 pH 大于 pI时，蛋白质带⟦2|负电⟧，所以 ⟦1|bcd⟧ 带⟦2|负电⟧，a 带⟦1|正电⟧。所以⟦1|顺序⟧为 ⟦1|acbd⟧。"],[0,"（2）⟦1|SephadcxG-100⟧ ⟦1|介质⟧主要是用于凝胶过滤，其所用⟦1|介质⟧是⟦2|凝胶⟧珠，内部为多孔⟦1|网状结构⟧，当不同分子大小的蛋白质通过时，较大的不能通过珠内的⟦1|网状结构⟧，只能通过珠与珠之间的⟦1|空隙⟧，走的⟦1|路程⟧短，洗脱速度较快；而分子较小的蛋白质可以进入⟦1|珠内⟧，走的⟦1|路程⟧较长，洗脱速度较慢。所以⟦1|顺序⟧为 ⟦1|cbda⟧。"],[0,"【注意，⟦1|本题考试⟧常常会换其他形式考，比如⟦2|设计⟧⟦1|实验⟧来分离如上蛋白质】"]]],[0,2,0,1,"全酶（holoenzyme）",[[0,"由⟦1|脱辅酶⟧与⟦1|辅因子⟧结合形成的有⟦1|催化活性⟧的酶。⟦1|脱辅酶⟧为蛋白质部分，⟦1|辅因子⟧为非⟦1|蛋白⟧小分子或⟦2|金属离子⟧；⟦1|两者⟧配合才能完成相应催化反应。"]]],[0,2,0,2,"辅因子（cofactor）",[[0,"辅因子是⟦1|缀合蛋白酶⟧中维持⟦1|催化活性⟧所必需的耐热非蛋白质小分子或⟦2|金属离子⟧；按与酶⟦1|蛋白⟧结合的松紧分为结合疏松、可透析除去的⟦1|辅酶⟧和结合牢固、不可透析除去的辅基。"]]],[0,2,0,3,"辅基（prosthetic group）",[[0,"辅基是以⟦1|共价键⟧等方式与⟦1|脱辅酶⟧紧密结合的小分子有机物或⟦2|金属离子⟧，不能用透析除去，通常⟦1|需经⟧⟦2|化学⟧处理才能分离。"]]],[0,2,0,4,"辅酶（coenzyme）",[[0,"辅酶是与⟦1|脱辅酶⟧结合较松、可用透析分离的小分子⟦1|有机辅因子⟧；在酶促反应中主要传递⟦2|电子⟧、原子或⟦2|化学⟧基团。"]]],[0,2,0,5,"单体酶（monomeric enzyme）",[[0,"通常由一条⟦1|肽链⟧组成的酶，少数由多条⟦1|肽链⟧以⟦1|共价键连成⟧整体。例如⟦1|溶菌酶⟧为⟦1|单链⟧，胰⟦1|凝乳蛋白酶⟧的 ⟦1|3⟧ 条⟦1|肽链⟧由⟦1|二硫键⟧相连。"]]],[0,2,0,6,"寡聚酶（oligomeric enzyme）",[[0,"寡聚酶是由两个或两个以上相同或不同的⟦1|亚基⟧以⟦1|次级键⟧结合形成的酶；它们多为⟦1|调节酶⟧，参与代谢⟦2|调控⟧。"]]],[0,2,0,7,"核酶（ribozyme）",[[0,"具有⟦1|催化活性⟧的 ⟦1|RNA⟧ 分子，可催化 ⟦1|RNA⟧ ⟦1|磷酸二酯⟧键断裂等反应。其发现打破了“酶都是蛋白质”的⟦1|传统⟧认识，对⟦2|研究⟧⟦1|生命起源⟧具有重要意义。"]]],[0,2,0,8,"诱导契合学说（induced-fit hypothesis）",[[0,"诱导契合学说认为，酶与底物结合时一方或⟦1|双方⟧发生构象变化，最终形成互补结构；该⟦1|学说⟧用于⟦1|解释酶⟧与底物的识别和酶的专一性。"]]],[0,2,0,9,"酶活力单位（U，active unit）",[[0,"酶活力单位表示一定条件下单位⟦1|时间⟧内催化⟦1|一定量⟧底物转化⟦1|所需⟧的酶量；⟦1|1⟧ 个⟦1|国际⟧单位⟦1|规定⟧为最适条件下每分钟催化 ⟦1|1⟧ ⟦1|μmol⟧ 底物转化的酶量。"]]],[0,2,0,10,"酶活力（enzyme activity）",[[0,"酶催化化学反应的⟦2|能力⟧，通常以一定条件下单位⟦1|时间⟧内底物的减少量或产物的⟦1|增加量⟧表示。因此，测定酶活力就是⟦1|测定酶⟧促反应速率。"]]],[0,2,0,11,"酶的比活力（specific activity）",[[0,"每毫克蛋白质所含的酶活力单位数，是⟦1|衡量酶纯度⟧和纯化⟦1|效果⟧的常用⟦1|指标⟧。对同一种酶，在相同测定条件下，比⟦1|活力⟧越高，通常⟦1|纯度⟧越高。"]]],[0,2,0,12,"限速酶（Rate limiting enzyme）",[[0,"限速酶是在连续代谢反应中催化速度最慢的酶，调节其⟦2|活性⟧可控制整条代谢⟦2|途径⟧的速率，甚至改变代谢方向。"]]],[0,2,0,13,"抗体酶（abzyme）",[[0,"抗体酶是可催化反应的免疫球蛋白，其可变区具有酶的⟦1|属性⟧，兼有⟦2|抗体⟧的⟦1|高度⟧⟦2|特异性⟧和酶的催化⟦2|能力⟧。"]]],[0,2,0,14,"酶促反应动力学（Enzymatic reaction kinetics）",[[0,"酶促反应动力学是⟦1|研究酶⟧促反应速率及其影响因素的⟦1|学科⟧，可为⟦1|阐明酶⟧的作用机制和结构功能关系提供依据。"]]],[0,2,0,15,"米氏常数（Michaelis constant）（Km）",[[0,"米氏常数 Km 等于反应速率达到最大速率一半时的底物浓度；在一定条件下，Km 越小⟦1|表示酶⟧与底物的⟦2|亲和力⟧越强，且 Km 与酶浓度无关。"]]],[0,2,0,16,"Kcat/酶的转换数（turnover number，TN）",[[0,"酶的转换数 Kcat 是酶被底物饱和时，每秒⟦1|每个酶⟧分子或⟦2|活性部位⟧转化的底物分子数；Kcat 越大，酶的催化⟦2|能力⟧越强。"]]],[0,2,0,17,"可逆抑制（reversible inhibition）",[[0,"可逆抑制是⟦1|抑制剂⟧以非⟦1|共价键⟧与酶结合而降低酶⟦2|活性⟧，⟦1|除去抑制剂后酶⟧可恢复⟦2|活性⟧；具体可分为⟦1|竞争性⟧、非⟦1|竞争性⟧、反⟦1|竞争性⟧和混合型抑制。"]]],[0,2,0,18,"竞争性抑制作用（competitive inhibition）",[[0,"⟦1|竞争性⟧抑制是结构类似底物的⟦1|抑制剂⟧与底物⟦1|竞争酶⟧的⟦1|结合部位⟧，使反应速率下降；其 Km 增大、⟦1|Vmax⟧ 不变，提高底物浓度可减弱抑制。"]]],[0,2,0,19,"非竞争性抑制作用（noncompetitive inhibition）",[[0,"非⟦1|竞争性⟧抑制是⟦1|抑制剂⟧结合酶活性中心以外的⟦1|位点⟧，与底物不发生⟦2|竞争⟧；其 ⟦1|Vmax⟧ 降低、Km 不变，增加底物浓度不能解除抑制。"]]],[0,2,0,20,"反竞争性抑制作用（uncompetitive inhibition）",[[0,"反⟦1|竞争性⟧抑制是⟦1|抑制剂⟧只与酶-底物⟦1|复合物⟧结合，使其不能生成产物；其 Km 和 ⟦1|Vmax⟧ 均降低，增加底物浓度不能解除抑制。"]]],[0,2,0,21,"Ks 型不可逆抑制剂（Ks-type irreversible inhibitors）",[[0,"Ks 型不可逆抑制剂是按底物⟦1|结构设计⟧、可结合酶并以活泼基团⟦2|共价⟧⟦1|修饰酶⟧必需基团的⟦1|抑制剂⟧，又称亲和⟦2|标记⟧⟦1|试剂⟧；其活泼基团也可能⟦1|修饰酶⟧的其他部位，因而专一性有限。"]]],[0,2,0,22,"Kcat 型不可逆抑制剂/酶的自杀性抑制剂（Kcat-type irreversible inhibitors）",[[0,"Kcat 型不可逆抑制剂又称⟦1|自杀性抑制剂⟧，是带有潜伏反应基团的底物⟦1|类似物⟧；酶催化它⟦1|时会⟧使该基团⟦2|活化⟧并修饰⟦2|活性部位⟧或辅基，导致酶不可逆⟦2|失活⟧。"]]],[0,2,0,23,"双倒数作图（double-reciprocal plot）",[[0,"双倒数作图又称 ⟦1|Lineweaver-Burk⟧ ⟦1|作图⟧，是将米氏方程取⟦1|倒数⟧后以 ⟦1|1⟧/v 对 ⟦1|1⟧/[S]⟦1|作图⟧的方法；⟦1|直线横轴⟧截距为-⟦1|1⟧/Km，⟦1|纵轴⟧截距为 ⟦1|1⟧/⟦1|Vmax⟧。"]]],[0,2,0,24,"酶的活性中心（The activity center of the enzyme）",[[0,"酶的活性中心是由少数特异氨基酸残基构成、直接决定⟦1|催化活性⟧的区域；其组成包括结合底物的⟦1|结合部位⟧和催化⟦1|化学键⟧断裂或形成的⟦1|催化部位⟧。"]]],[0,2,0,25,"邻近效应（approximation，proximity）",[[0,"在双分子反应中，酶将两个底物⟦1|束缚⟧在⟦2|活性部位⟧附近，使其彼此接近、有效浓度提高。由此使反应类似分子内反应，是酶高效催化的原因之一。"]]],[0,2,0,26,"定向效应（orientation）",[[0,"酶使底物反应基团之间及其与催化基团之间形成正确取向。底物被固定于酶⟦2|表面⟧，反应类似分子内反应，能增加有效碰撞并加快反应。"]]],[0,2,0,27,"同促效应（homotropic effect）",[[0,"同促效应是由同一种⟦2|效应⟧物介导的⟦1|别构效应⟧，一个结合⟦1|位点⟧与⟦2|效应⟧物结合后可促进或抑制同种⟦2|效应⟧物与其他⟦1|位点⟧结合，分别称正⟦2|协同⟧和负⟦2|协同⟧。"]]],[0,2,0,28,"异促效应（heterotropic effect）",[[0,"异促效应是不同⟦2|效应⟧物之间的⟦1|别构效应⟧，调节物与⟦1|别构⟧⟦2|中心⟧结合后影响另一种⟦2|配体⟧与⟦2|活性部位⟧结合；按作用结果，可分为激活⟦2|效应⟧和抑制效应。"]]],[0,2,0,29,"酶原（zymogen/proenzyme）",[[0,"机体合成的无⟦1|活性酶⟧⟦2|前体⟧，经⟦2|特异性⟧⟦1|蛋白⟧⟦2|水解⟧和⟦1|构象⟧改变后形成⟦1|活性酶⟧。酶原形式可⟦1|防止酶⟧过早⟦2|活化⟧损伤组织，常见于⟦1|消化酶⟧和⟦1|凝血因子⟧。"]]],[0,2,0,30,"酶原激活（activation of zymogen）",[[0,"酶原激活是⟦1|酶原⟧经有限⟦2|水解⟧切除部分肽段、⟦1|重塑构象⟧并形成活性中心的过程，属于不可逆的⟦2|共价⟧调节。"]]],[0,2,0,31,"别构酶（allosteric enzyme）",[[0,"别构酶通常由多个⟦1|亚基⟧组成，兼有结合底物的活性中心和结合⟦2|效应⟧物的⟦1|别构⟧⟦2|中心⟧；⟦2|效应⟧物引起酶⟦1|构象⟧改变，从而增强或减弱酶⟦2|活性⟧。"]]],[0,2,0,32,"别构调控（allosteric regulation）/别构调节/变构调控/变构调节",[[0,"别构调控是⟦2|效应⟧物与酶的⟦1|别构⟧⟦2|中心⟧结合，引起⟦1|构象⟧改变并影响活性中心对底物的⟦2|亲和力⟧，从而⟦1|调节酶⟧⟦2|活性⟧的机制。"]]],[0,2,0,33,"别构效应物",[[0,"别构效应物是能与蛋白质⟦1|别构⟧⟦2|中心⟧特异结合的物质，可通过改变蛋白质⟦1|构象⟧增强或减弱活性中心的功能。"]]],[0,2,0,34,"别构/变构效应（allosteric effect）",[[0,"⟦1|别构效应⟧是⟦2|配体⟧与蛋白质调节部位非⟦2|共价⟧结合，引起⟦1|构象⟧可逆改变并影响⟦2|活性部位⟧结合或催化⟦2|能力⟧的现象。"]]],[0,2,0,35,"级联系统（cascade system）",[[0,"级联系统是由一系列⟦1|连续酶⟧促反应组成的⟦2|信号⟧传递⟦1|体系⟧，初始⟦2|信号⟧在逐级传递中被放大，最终产生显著的⟦2|生理效应⟧。"]]],[0,2,0,36,"蛋白质的磷酸化与脱磷酸化（Protein phosphorylation and dephosphorylation）",[[0,"蛋白质⟦2|磷酸化⟧与脱⟦2|磷酸化⟧是可逆⟦2|共价⟧修饰：⟦1|蛋白激酶⟧把 ⟦1|ATP⟧ 或 ⟦1|GTP⟧ 的⟦1|γ-磷酸⟧基转移到蛋白质⟦1|残基⟧上，⟦1|蛋白磷酸酶⟧再将其⟦2|水解⟧除去。"]]],[0,2,0,37,"化学修饰（chemical modification）",[[0,"在温和、可控条件下，用修饰剂特异改变蛋白质⟦1|个别侧链官能团⟧的⟦2|共价⟧处理方法。常用于⟦2|研究⟧结构与功能，如 ⟦1|DFP⟧ 修饰⟦1|某些酶⟧⟦2|活性部位⟧的 ⟦1|Ser⟧ 而使其⟦2|失活⟧。"]]],[0,2,0,38,"酶的可逆共价修饰（reversible covalent modification）",[[0,"酶的可逆共价修饰是酶⟦1|蛋白⟧上某些⟦2|化学⟧基团可逆结合或脱落而⟦1|改变酶⟧⟦2|活性⟧的调节方式，常见形式有⟦2|磷酸化⟧、⟦1|腺苷⟧化和⟦2|甲基化⟧。"]]],[0,2,0,39,"同工酶（isoenzyme 或 isozyme）",[[0,"同工酶是由不同基因⟦2|编码⟧、催化同一反应，但结构、理化性质或⟦1|免疫学特性⟧不同的⟦1|一组酶⟧；其分布常具有组织和⟦1|发育阶段⟧⟦2|特异性⟧。"]]],[0,2,1,1,"酶作为生物催化剂的特点。",[[0,"①易⟦2|失活⟧：酶为生物大分子，⟦2|变性⟧因素可使其⟦2|失活⟧。"],[0,"②高效：比非催化反应快 ⟦1|10⟧⁸～⟦1|10⟧²⁰倍，比非生物催化剂快 ⟦1|10⟧⁷～⟦1|10⟧¹³倍。"],[0,"③专一：通常只识别一类底物、催化一类反应，源于特异互作与结构互补。"],[0,"④可调：酶浓度、⟦1|激素⟧、反馈物、⟦1|抑制剂⟧和⟦1|激活剂⟧均可调节⟦2|活性⟧。"],[0,"⑤条件温和：常在⟦1|常温⟧、⟦1|常压⟧及近⟦1|中性⟧ pH 下反应。"],[0,"⑥许多酶需⟦2|金属离子⟧或⟦1|辅酶⟧等⟦1|辅助因子⟧。"]]],[0,2,1,2,"酶活力和酶的比活力各指的是什么？酶纯度用什么表示？",[[0,"（1）酶活力：一定条件下的催化速率；速率越大，⟦1|活力⟧越高，单位为 U。"],[0,"（2）比⟦1|活力⟧：每 mg ⟦1|蛋白⟧所含的酶活力，单位 U/mg；同一种酶在相同条件下，比⟦1|活力⟧越高，通常越纯。"],[0,"（3）酶纯度以比⟦1|活力⟧表示：比⟦1|活力⟧＝总⟦1|活力⟧ U÷总⟦1|蛋白⟧ mg。"]]],[0,2,1,3,"测定酶活力时为何要测定反应初速度？并且常以测定产物的增加量为宜？",[[0,"⟦1|应测⟧初速度：此时产物少，⟦1|逆反应⟧和抑制弱，速率与酶量近似⟦1|成正比⟧；通常取⟦1|规定⟧条件下底物变化不超过 ⟦1|5⟧%的⟦1|阶段⟧。"],[1,"①反应延长会消耗底物、积累产物，增强⟦1|逆反应⟧及调节，酶也可能⟦2|失活⟧；测初速度可减少这些影响。"],[1,"②初期底物减少量小，难准确⟦2|检测⟧；产物从无到有，更易⟦1|灵敏⟧测定，故常测产物⟦1|增量⟧。"]]],[0,2,1,4,"简要说明辅因子在酶中的作用?",[[0,"（1）辅因子分⟦2|金属离子⟧和⟦1|有机⟧小分子。结合松、可透析者为⟦1|辅酶⟧，如 ⟦1|NAD⁺⟧ ；结合紧者为辅基，如铁卟啉、⟦1|FAD⟧。⟦1|脱辅酶⟧与辅因子构成⟦1|全酶⟧。"],[1,"（2）①⟦1|NAD⁺⟧ 、⟦1|FAD⟧ 等传递氢或⟦2|电子⟧。"],[1,"②传递⟦1|酰基⟧、⟦1|氨基⟧、⟦1|羧基⟧和一碳单位等；⟦1|有机⟧辅因子多来自⟦1|维生素⟧。"],[1,"③维持⟦2|活性部位⟧⟦1|构象⟧，协助结合底物和催化。"],[1,"④影响底物专一性和反应速率，可增强或抑制酶⟦2|活性⟧。"]]],[0,2,1,5,"酶活力的测定方法？",[[0,"（1）酶活力指催化⟦2|能力⟧，以⟦1|规定⟧条件下的反应速率表示。"],[0,"（2）测与酶量近似⟦1|成正比⟧的⟦1|初速度⟧；⟦1|统一⟧⟦2|温度⟧、pH、底物浓度和⟦2|离子强度⟧，通常取底物变化不超过 ⟦1|5⟧%的⟦1|阶段⟧。"],[0,"（3）可测完成一定反应量所需⟦1|时间⟧，或单位⟦1|时间⟧的反应量。"],[1,"①⟦1|分光光度法⟧：按底物与产物的吸收⟦2|差异⟧连续测吸⟦1|光度⟧；简便、省时省样，常用于氧化⟦1|还原酶⟧。"],[1,"②⟦1|荧光法⟧：按底物与产物的⟦1|荧光⟧⟦2|差异⟧测定；⟦1|灵敏⟧，但易受⟦1|杂质荧光⟧干扰。"],[1,"③⟦1|同位素⟧法：分离⟦1|放射性⟧产物并测⟦1|脉冲数⟧，⟦1|灵敏度⟧可达 ⟦1|fmol⟧ 级。"],[1,"④⟦1|电化学⟧法：连续⟦2|检测⟧底物或产物的⟦1|电学⟧变化；⟦1|灵敏⟧、准确，但需⟦1|专用仪器⟧。"]]],[0,2,1,6,"酶按照国际系统分类可分为六大类，试简述各大类酶的名称并举例说明。",[[0,"⟦1|分类⟧                     催化反应                       ⟦1|举例⟧"],[0,"氧化⟦1|还原酶⟧      催化⟦2|电子⟧或氢的转移，即氧化还原反应              ⟦1|谷氨酸脱氢酶⟧"],[0,"转移酶       催化基团从一个分子转移到另一个分子              ⟦1|天冬氨酸⟧氨⟦1|基转移酶⟧"],[0,"⟦1|水解酶⟧       以水为⟦1|反应物⟧⟦2|水解⟧⟦1|化学键⟧                    ⟦1|精氨酸酶⟧"],[0,"⟦1|分类⟧                       催化反应                         ⟦1|举例⟧"],[0,"⟦1|裂合酶⟧          非⟦2|水解⟧地断裂或形成⟦1|化学键⟧，常伴随⟦1|双键⟧变化            ⟦1|果糖二磷酸醛缩酶⟧"],[0,"⟦1|异构酶⟧          催化分子内部⟦1|重排⟧，生成⟦1|同分异构⟧体                ⟦1|磷酸葡萄糖异构酶⟧"],[0,"连接酶（也叫合成酶）         催化两个分子连接，通常⟦2|偶联⟧ ⟦1|ATP⟧ ⟦2|水解⟧            ⟦1|谷氨酰胺⟧合成酶"],[0,"注意，现在⟦1|学界⟧已经有第 ⟦1|7⟧ 大⟦1|酶类⟧了，但是不写也没关系，就写 ⟦1|6⟧ 大⟦1|经典分类⟧即可"]]],[0,2,1,7,"何谓核酶？其结构特点和应用前景是什么？有什么意义",[[0,"（1）核酶是具有⟦1|催化活性⟧的 ⟦1|RNA⟧。"],[0,"（2）结构特点。"],[1,"①⟦1|发夹⟧核酶含 ⟦1|4⟧ 段⟦2|螺旋⟧及连接环；⟦2|螺旋⟧Ⅰ、Ⅱ与底物形成⟦1|识别区⟧，两个内部环相互靠近形成催化⟦2|中心⟧。"],[1,"②⟦1|锤头⟧核酶约 ⟦1|30⟧ nt，含 ⟦1|3⟧ 个配对⟦2|螺旋⟧区、⟦1|2⟧ 个⟦1|单链⟧区和膨出⟦1|碱基⟧；⟦1|13⟧ 个保守⟦1|碱基⟧与⟦2|螺旋⟧Ⅱ构成⟦1|催化核心⟧，⟦2|螺旋⟧Ⅰ、Ⅲ决定⟦2|特异性⟧。"],[0,"（3）应用前景。"],[1,"①⟦1|靶向⟧切割特定 ⟦1|mRNA⟧、抑制基因表达，可用于⟦1|基因治疗⟧。"],[1,"②将核酶基因导入细胞或机体，可用于⟦1|抗病毒⟧和抗肿瘤。"],[1,"③可在体外切割、连接 ⟦1|RNA⟧，用于 ⟦1|RNA⟧ ⟦2|研究⟧和精确⟦1|编辑⟧。"],[0,"（4）发现意义。"],[1,"①说明 ⟦1|RNA⟧ 兼有⟦2|遗传信息⟧⟦1|载体⟧和生物催化功能。"],[1,"②支 。"]]],[0,2,1,17,"何谓抗代谢物？简述磺胺药、氨甲蝶呤等药物的作用机制。",[[0,"抗代谢物是结构类似必需⟦2|代谢物⟧、可⟦2|竞争⟧并干扰其正常代谢的物质；可用于阐明药物机制和⟦2|设计⟧⟦1|新药⟧。"],[1,"①磺胺似对⟦1|氨基苯甲酸⟧，⟦2|竞争⟧抑制⟦1|细菌二氢叶酸⟧合成酶，使四氢叶酸不足并阻断⟦1|核苷酸⟧、蛋白质合成。人体⟦1|叶酸⟧来自⟦2|食物⟧，故⟦1|可选择性⟧抑菌。"],[1,"②氨甲蝶呤似⟦1|二氢叶酸⟧，可牢固抑制⟦1|二氢叶酸还原酶⟧，阻断四氢叶酸生成及一碳单位转移，抑制⟦1|核苷酸碱基⟧合成，用于⟦1|抗癌⟧。"]]],[0,2,1,18,"（1）以下是不同抑制剂条件下（无抑制剂、不可逆抑制剂、可逆抑制剂） 反应速率与酶浓度关系图。",[[0,"指出图中各条⟦1|直线⟧分别⟦1|对应⟧何种情况并说明⟦1|理由⟧。（⟦1|2⟧）相对于无抑制剂条件而言，在存在⟦1|竞争性⟧抑制"],[0,"剂的情况下 ⟦1|Vmax⟧ 和 Km 分别怎样变化？存在非⟦1|竞争性抑制剂⟧时呢？"],[1,"（1）①⟦1|直线⟧ ⟦1|1⟧：无抑制剂。"],[1,"②⟦1|直线⟧ ⟦1|2⟧：可逆抑制剂；仍过⟦1|原点⟧，但⟦1|斜率⟧低于无抑制剂。"],[1,"③⟦1|直线⟧ ⟦1|3⟧：不可逆抑制剂；先使⟦1|定量酶⟧⟦2|失活⟧，酶量⟦1|超过抑制剂⟧后才显⟦1|活力⟧，故⟦1|直线右移⟧且不过⟦1|原点⟧。"],[2,"（2）⟦1|竞争性⟧抑制：⟦1|Vmax⟧ 不变、Km 增大，高底物可解除；非⟦1|竞争性⟧抑制：⟦1|Vmax⟧ 降低、Km 不变，高底物不能解除。"]]],[0,2,1,19,"酶活性部位的特点？",[[0,"①所占⟦1|体积小⟧，通常仅⟦1|占酶体积⟧ ⟦1|1⟧%～⟦1|2⟧%，多数⟦1|残基⟧不接触底物。"],[0,"②为三维⟦1|实体⟧；⟦1|有关残基⟧可在序列上相距很远或⟦1|分属⟧不同链，折叠后靠近。高级结构破坏可损伤活性部位，使酶⟦2|失活⟧。"],[0,"③与底物并非⟦1|预先⟧完全互补；结合时发生⟦1|构象⟧改变，使催化基团⟦1|对准⟧反应键。"],[0,"④常位于⟦2|表面⟧⟦1|空穴⟧或⟦1|裂缝⟧；内部较疏水，也含用于结合、催化的⟦2|极性⟧⟦1|残基⟧。"],[0,"⑤ES 主要靠⟦1|氢键⟧、盐键、范德华力和疏水作用等⟦1|次级键⟧结合。"],[0,"⑥具有⟦1|柔性⟧和⟦1|运动性⟧。"]]],[0,2,1,20,"影响酶高效催化效率有关的因素有哪些？/酶降低化学反应活化能的方式。（最少记住前 4 点）",[[0,"（1）邻近效应和定向效应：形成 ES 既完成识别，也把分子间反应转为类似分子内反应。"],[1,"①邻近效应：底物被吸引至活性中心，使局部“有效浓度”升高，加快反应。"],[1,"②定向效应：使底物间及底物与催化基团正确取向，提高有效碰撞。"],[0,"（2）底物形变和⟦2|诱导⟧契合。"],[1,"①底物形变：酶与底物相互作用使底物趋近⟦1|过渡态⟧，催化基团就位，反应键被削弱。"],[1,"②⟦2|诱导⟧契合：结合⟦1|时酶⟧、底物或⟦2|二者⟧改变⟦1|构象⟧，使催化基团⟦1|对准⟧反应键。"],[0,"（3）多元催化和⟦2|协同⟧：⟦2|活性部位⟧多个催化基团同时作用于底物。"],[0,"（4）微⟦2|环境⟧：底物进入疏水⟦1|裂缝⟧后，与催化基团的作用增强，利于催化。"],[0,"（5）⟦1|酸碱⟧催化：催化基团⟦2|供给⟧或接受⟦2|质子⟧，稳定⟦1|过渡态⟧并降低活化能。"],[0,"（6）共价催化：酶的⟦1|亲核⟧或亲⟦2|电子⟧基团与底物形成不稳定⟦2|共价⟧中间物，降低活化能。"],[0,"（7）⟦2|金属离子⟧催化有三种方式："],[1,"①结合底物并使其⟦1|定向⟧。"],[1,"②改变⟦2|金属⟧氧化态，传递⟦2|电子⟧。"],[1,"③以静电作用稳定或⟦1|屏蔽负电荷⟧。"]]],[0,2,1,21,"为什么 His 常被选择作为酶分子中的活性中心的构成成分，而并不作为蛋白质的一般结构成分/为什么组氨酸在酶的活性中心很重要？/在很多酶的活性中心均有 His 残基参与，请简述其原因。",[[0,"①His ⟦1|咪唑⟧基 pK 约 ⟦1|6.0⟧，⟦2|生理⟧ pH 下存在⟦1|质子化⟧和非⟦1|质子化⟧形式，可供、受⟦2|质子⟧，适于⟦1|广义酸碱⟧催化，因此常参与活性中心。"],[0,"②⟦1|咪唑基供⟧、受⟦2|质子⟧很快，半⟦1|寿期⟧小于 ⟦1|10⟧⁻ ¹⁰ s；因此 His 虽⟦2|含量⟧少，却常作为催化基团。"]]],[0,2,1,22,"举例说明酶活性调节的几种主要方式？/简述酶质变的调节方式有哪些？",[[0,"代谢⟦1|受酶⟧活性和酶⟦2|含量⟧调节；酶活性主要有以下 ⟦1|5⟧ 种调节方式。"],[1,"①别构调控：⟦2|效应⟧物非⟦2|共价⟧结合非⟦1|催化部位⟧，引起⟦1|构象⟧和活性改变；如 ⟦1|CTP⟧ 反馈抑制 ⟦1|ATCase⟧，⟦1|ATP⟧ 则激活。"],[1,"②可逆⟦2|共价⟧修饰：其他酶可逆⟦1|修饰酶蛋白⟧，如⟦2|糖原⟧⟦1|磷酸化酶⟧ b 的 ⟦1|Ser14⟧ ⟦2|磷酸化⟧后成为活性 a；可级联放大，但常耗能。"],[1,"③酶原激活：无活性⟦1|酶原⟧经有限⟦2|水解⟧获得活性；如胃蛋白酶原在 pH＜⟦1|5⟧ 时切除 ⟦1|44⟧ 个⟦1|残基⟧而激活。"],[1,"④激活或抑制⟦1|蛋白⟧调节：专一⟦1|蛋白⟧结合酶并改变活性；如 ⟦1|Ca²⁺⟧ 结合钙调⟦1|蛋白⟧后激活⟦1|多种酶⟧。"],[1,"⑤聚合与解离：⟦1|改变酶⟧的组装状态可调节活性；如⟦1|乙酰⟧ ⟦1|CoA⟧ ⟦1|羧化酶⟧可在⟦1|柠檬酸⟧促进下聚合并⟦2|活化⟧。"]]],[0,2,1,23,"生物体内存在大量的别构酶有什么生物学意义？",[[0,"⟦2|效应⟧物非⟦2|共价⟧结合非⟦1|催化部位⟧，引起⟦1|构象⟧和⟦2|活性⟧变化，称⟦1|别构调节⟧；具有这种调节的酶称别构酶。其意义如下。"],[1,"①代谢调节：感受底物或产物浓度，迅速改变⟦2|活性⟧和⟦1|通路流量⟧，适应生理需要。"],[1,"②反馈调节：受⟦1|终产物⟧抑制或其他⟦2|代谢物⟧激活，维持产物⟦1|稳态⟧，防止积累或耗尽。"],[1,"③⟦1|协同效应⟧：正⟦2|协同⟧提高对底物浓度变化的⟦1|敏感性⟧；负⟦2|协同⟧提供相对不⟦1|敏感区⟧，保障重要反应稳定进行。"],[1,"④⟦1|适应性⟧调节：快速响应⟦2|环境⟧；某⟦2|代谢物⟧升高时⟦1|可抑制⟧相应别构酶，减少其合成。"]]],[0,2,1,24,"研究酶活性部位的方法？",[[0,"（1）⟦1|侧链化学修饰⟧：用⟦2|共价⟧⟦1|试剂标记酶⟧，再⟦2|水解⟧并鉴定⟦1|标记肽⟧段。"],[1,"①非特异修饰：修饰量增加而⟦2|活性⟧下降，且底物或可逆抑制剂能保护时，提示所修饰基团参与功能。"],[1,"②⟦2|特异性共价⟧修饰：⟦1|试剂⟧专一修饰活性部位⟦1|残基⟧使酶⟦2|失活⟧；如 ⟦1|DFP⟧ 结合 ⟦1|Ser⟧ ⟦1|羟基⟧，⟦2|水解⟧分离⟦1|标记肽⟧段可确定⟦1|残基⟧。"],[1,"③亲和⟦2|标记⟧：以底物⟦2|亲和力⟧将带活泼基团的修饰剂引至结合⟦1|位点⟧，再与邻近基团形成稳定⟦1|共价键⟧。"],[0,"（2）⟦1|动力学参数⟧法：测⟦1|参数⟧与⟦1|残基⟧解离状态的关系，判断活性部位化学性质。"],[0,"（3）X ⟦1|射线晶体结构⟧⟦2|分析⟧：⟦1|解析⟧三维结构，确定相关⟦1|残基⟧的位置和状态。"],[0,"（4）⟦1|定点诱变⟧：⟦1|改变酶⟧基因序列，⟦1|检验⟧活性部位的必需⟦1|残基⟧。"]]],[0,2,1,25,"同工酶概念、机制、生物学功能。",[[0,"（1）同工酶催化同一反应，但结构、理化及免疫性质不同，底物⟦2|亲和力⟧也可不同；常由不同基因或⟦1|亚基⟧组合产生，如⟦1|乳酸脱氢酶⟧有 ⟦1|5⟧ 种主要同工酶。"],[0,"（2）常源于基因⟦1|分化⟧；结构⟦2|差异⟧改变⟦2|亲和力⟧、⟦2|稳定性⟧、最适⟦2|温度⟧、pH 及调节方式，以适应不同组织和代谢状态。"],[0,"（3）生物学功能。"],[1,"①与⟦2|遗传⟧：可作⟦2|遗传⟧⟦1|标志⟧，用于⟦2|遗传分析⟧。"],[1,"②与⟦1|发育⟧和⟦1|分化⟧：其类型随⟦1|胚胎发育⟧、出生和组织⟦1|分化⟧而转换。"],[1,"③与代谢调节：适应不同组织或⟦1|细胞器⟧的代谢需要。"],[1,"④与⟦1|癌基因⟧表达：用于⟦2|研究⟧⟦1|癌变⟧机制和寻找诊断⟦1|指标⟧。"],[1,"⑤与⟦1|临床⟧诊断：⟦1|血清⟧同工酶可作组织损伤⟦1|标志物⟧。"]]],[0,2,1,26,"什么是酶原和酶原激活？说明酶原激活的生理意义。",[[0,"（1）①酶原是无⟦2|活性⟧的酶⟦2|前体⟧，经特异⟦2|水解⟧和⟦1|构象⟧改变形成⟦2|活性部位⟧后成为⟦1|活性酶⟧。"],[0,"②酶原激活指酶原经有限⟦2|水解⟧获得⟦2|活性⟧；它不同于⟦1|别构调节⟧和可逆修饰，属于不可逆⟦2|共价⟧调节。"],[1,"（2）生理意义。"],[0,"①⟦1|防止酶⟧⟦2|水解⟧自身组织。"],[0,"②⟦1|保证酶⟧在特定⟦1|时间⟧和部位⟦1|发挥作用⟧。"],[0,"③便于⟦2|储存⟧和⟦2|运输⟧；如凝血、⟦1|纤溶酶⟧以酶原⟦2|循环⟧，需要时再激活。"]]],[0,3,0,1,"核苷酸（nucleotide）",[[0,"核苷酸由⟦1|含氮碱基⟧、五⟦1|碳糖⟧和⟦1|磷酸⟧组成，是⟦1|核酸⟧的⟦2|基本⟧单位；⟦1|按糖⟧的种类分为⟦1|核糖⟧核苷酸和脱氧核苷酸。"]]],[0,3,0,2,"脱氧核苷酸（deoxyribotide）",[[0,"由⟦1|碱基⟧、⟦1|脱氧核糖⟧和⟦1|磷酸⟧组成，常见⟦1|碱基⟧为 A、G、C、T。它是 ⟦1|DNA⟧ 的⟦2|基本⟧单位，多个脱氧核苷酸以 ⟦1|3⟧′,⟦1|5⟧′-⟦1|磷酸二酯⟧键⟦1|连接成链⟧。"]]],[0,3,0,3,"脱氧核糖核酸（DNA，deoxyribonucleic acid）",[[0,"由脱氧核苷酸以 ⟦1|3⟧′,⟦1|5⟧′-⟦1|磷酸二酯⟧键连接形成的⟦1|核酸大分子⟧，常呈⟦1|双链⟧并遵循 ⟦1|A-T⟧、⟦1|G-C⟧ 配对。它⟦2|储存⟧和传递⟦2|遗传信息⟧，并⟦1|指导⟧ ⟦1|RNA⟧ 及蛋白质合成。"]]],[0,3,0,4,"DNA 双螺旋（DNA double helix）",[[0,"DNA 双螺旋由两条反向⟦1|平行⟧的脱氧核苷酸链绕同一轴形成⟦1|右手⟧⟦2|螺旋⟧；糖-⟦1|磷酸⟧⟦2|骨架⟧位于外侧，⟦1|碱基⟧在内侧按⟦1|A-T⟧、⟦1|G-C⟧ 互补配对。"]]],[0,3,0,5,"DNA 超螺旋（DNA superhelix）",[[0,"DNA 超螺旋是 DNA ⟦2|双螺旋⟧进一步扭曲盘绕形成的三级结构；盘绕方向与⟦2|双螺旋⟧相同为正超螺旋，相反为负超螺旋。"]]],[0,3,0,6,"非编码 RNA（Non-coding RNA）",[[0,"非编码 RNA 是不翻译为蛋白质、直接以 RNA 形式⟦1|发挥作用⟧的转录产物，可参与 RNA ⟦2|加工⟧、蛋白质合成和基因表达⟦2|调控⟧。"]]],[0,3,0,7,"RNA 的二级结构（Secondary structure of the RNA）",[[0,"RNA 的二级结构是 RNA 通过链内⟦1|碱基配对⟧和自身回折形成的局部稳定⟦1|构象⟧，常见形式有茎和发夹环。"]]],[0,3,0,8,"查格夫法则（Chargaff’s rules）",[[0,"描述⟦1|双链⟧ ⟦1|DNA⟧ 碱基组成的⟦1|规律⟧：A=T、G=C，因此 ⟦1|A+G⟧=⟦1|C+T⟧，⟦2|嘌呤⟧⟦1|总量⟧等于⟦2|嘧啶⟧⟦1|总量⟧。该⟦1|规律⟧是提出⟦1|碱基⟧互补配对和⟦2|双螺旋⟧⟦1|模型⟧的重要依据。"]]],[0,3,0,9,"mRNA（messenger ribonucleic acid）",[[0,"mRNA 是由 ⟦1|DNA⟧ 转录产生、携带⟦2|遗传信息⟧并作为蛋白质合成⟦2|模板⟧的 ⟦1|RNA⟧；在结构上，⟦2|真核⟧ mRNA 通常具有 ⟦1|5⟧′帽、开放阅读框和 ⟦1|3⟧′多聚 A 尾。"]]],[0,3,0,10,"tRNA（transfer ribonucleic acid）",[[0,"tRNA 是把⟦1|氨基酸⟧运送到⟦1|核糖体⟧的 ⟦1|RNA⟧，其 ⟦1|3⟧′端 ⟦1|CCA⟧ 结合⟦1|氨基酸⟧，反密码子与 ⟦1|mRNA⟧ ⟦1|密码子⟧配对，使⟦1|氨基酸⟧按⟦2|遗传信息⟧加入⟦1|多肽链⟧。"]]],[0,3,0,11,"rRNA（ribosomal RNA）",[[0,"rRNA 是与蛋白质共同构成⟦1|核糖体⟧的一类 RNA，既形成⟦1|核糖体⟧⟦2|骨架⟧，又参与蛋白质合成中的催化。"]]],[0,3,0,12,"tRNA 的二级结构（Secondary structure of the tRNA）",[[0,"tRNA 的二级结构呈⟦1|三叶草⟧形，由⟦1|氨基酸⟧臂、⟦1|DHU⟧ 环、反密码子环、可变环和 ⟦1|TΨC⟧ 环组成；⟦1|氨基酸⟧臂结合⟦1|氨基酸⟧，反密码子环识别⟦1|密码子⟧。"]]],[0,3,0,13,"单顺反子（monocistronic）",[[0,"单顺反子是只含一个翻译⟦1|起点⟧、一个开放阅读框和一个终止⟦1|位点⟧，只⟦2|编码⟧一种⟦1|多肽⟧的 ⟦1|mRNA⟧，主要见于⟦2|真核⟧生物。"]]],[0,3,0,14,"多顺反子（polycistronic）",[[0,"多顺反子是一条含有多个翻译⟦1|起点⟧、开放阅读框和终止⟦1|位点⟧，可⟦2|编码⟧多种⟦1|多肽⟧的 ⟦1|mRNA⟧，主要见于⟦2|原核⟧生物的操纵子。"]]],[0,3,0,15,"B 型 DNA（B-DNA）",[[0,"⟦1|B-DNA⟧ 是⟦2|生理⟧条件下最常见、最稳定的⟦1|右手⟧⟦2|双螺旋⟧ DNA，⟦1|每圈⟧约 ⟦1|10⟧ 个碱基对，⟦1|直径⟧ ⟦1|2.0⟧ nm，⟦1|螺距⟧ ⟦1|3.4⟧ nm。"]]],[0,3,0,16,"限制性酶（restriction nuclease）/限制性核酸内切酶（restriction endonuclease）",[[0,"限制性核酸内⟦1|切酶⟧是能识别⟦1|双链⟧ ⟦1|DNA⟧ 特定序列并在该⟦1|位点⟧或附近切割、产生⟦1|平端⟧或黏⟦1|端的酶⟧，常用于基因⟦2|克隆⟧和 ⟦1|DNA⟧ ⟦2|重组⟧。"]]],[0,3,0,17,"核酸的变性（Denaturation of nucleic acids）",[[0,"⟦1|核酸⟧⟦2|变性⟧是⟦1|核酸⟧受热、⟦1|极端⟧ pH、低⟦2|离子强度⟧或⟦1|变性剂⟧作用后，⟦1|氢键⟧和碱基堆积作用被破坏，⟦1|双链⟧解离为⟦1|单链⟧的过程。"]]],[0,3,0,18,"增色效应（hyperchromic effect）",[[0,"增色效应是⟦1|核酸⟧⟦2|变性⟧⟦1|解链⟧、⟦1|碱基⟧暴露后，⟦1|260⟧ nm 处紫外吸收升高的现象；其原因是碱基堆积解除，π⟦1|电子云⟧重叠减少。"]]],[0,3,0,19,"退火（annealing）",[[0,"退火是热⟦2|变性⟧的 ⟦1|DNA⟧ 缓慢冷却后，互补⟦1|单链⟧重新配对形成⟦2|双螺旋⟧的⟦2|复性⟧过程，常用于 ⟦1|PCR⟧ 和核酸分子杂交。"]]],[0,3,0,20,"DNA 的熔解温度（melting temperature，Tm）/熔解温度",[[0,"DNA 熔解温度 Tm 是 DNA 热⟦2|变性⟧达到一半时的温度，受 GC ⟦2|含量⟧、⟦1|核酸⟧⟦2|长度⟧、序列均一性、pH 和⟦2|离子强度⟧等因素影响。"]]],[0,3,0,21,"实时定量 PCR（real-time quantitative PCR）",[[0,"在 PCR 扩增中，用⟦1|荧光染料⟧或⟦1|探针⟧实时⟦1|监测⟧产物积累，并定量初始⟦2|模板⟧的⟦2|技术⟧。其⟦1|灵敏度⟧高，常用于基因表达⟦2|分析⟧、⟦2|疾病检测⟧和⟦1|环境监测⟧。"]]],[0,3,0,22,"Southern 印迹法（Southern blotting）",[[0,"Southern 印迹法是将酶切并⟦1|电泳分离⟧的 ⟦1|DNA⟧ 转移到固⟦1|相膜⟧上，再用⟦2|标记⟧⟦1|探针杂交⟧以⟦2|检测⟧特定 ⟦1|DNA⟧ 序列的⟦2|技术⟧。"]]],[0,3,0,23,"Sanger 双脱氧链终止法",[[0,"Sanger 双脱氧链终止法是在 ⟦1|DNA⟧ 合成⟦1|体系⟧中加入缺少 ⟦1|3⟧′-OH 的 ⟦1|ddNTP⟧，使链随机终止；不同⟦2|长度⟧的产物经⟦1|电泳分离⟧后可读出 ⟦1|DNA⟧ 序列。"]]],[0,3,0,24,"核酸分子杂交（hybridization）",[[0,"核酸分子杂交是不同来源的⟦1|核酸单链⟧按⟦1|碱基⟧互补⟦1|原则⟧形成⟦1|双链杂合⟧分子的过程，可发生于 ⟦1|DNA-DNA⟧、⟦1|DNA-RNA⟧或 ⟦1|RNA-RNA⟧ 之间。"]]],[0,3,1,1,"DNA 的二级结构（试述 DNA 双螺旋/B-DNA 的结构要点）",[[0,"（1）DNA 二级结构是多⟦1|核苷酸链⟧通过⟦1|氢键⟧、碱基堆积等形成的⟦2|空间⟧⟦1|构象⟧，通常为双螺旋，可随条件改变而转换。"],[0,"（2）双螺旋特点。"],[1,"①两条反向⟦1|平行⟧的多⟦1|核苷酸链⟧绕同一轴形成⟦1|右手⟧⟦2|螺旋⟧。"],[1,"②⟦1|碱基朝内⟧，糖-⟦1|磷酸⟧⟦2|骨架⟧⟦1|朝外⟧；⟦1|碱基⟧面近垂直⟦2|螺旋⟧轴，糖⟦1|环面⟧近⟦1|平行⟧于轴；⟦1|两链⟧反向排列，形成⟦1|大沟⟧和⟦1|小沟⟧。"],[1,"③⟦1|直径⟧ ⟦1|2⟧ nm，相邻碱基对⟦1|间距⟧ ⟦1|0.34⟧ nm、⟦1|夹角⟧ ⟦1|36⟧°；⟦1|每圈⟧约 ⟦1|10⟧ 个碱基对，⟦1|螺距⟧ ⟦1|3.4⟧ nm。"],[1,"④⟦1|A-T⟧ 形成 ⟦1|2⟧ 个⟦1|氢键⟧，⟦1|G-C⟧ 形成 ⟦1|3⟧ 个，故 ⟦1|G-C⟧ 更稳定。"],[1,"⑤⟦1|一条链⟧序列确定后，另⟦1|一链⟧由互补配对决定；⟦1|碱基⟧序列携带⟦2|遗传信息⟧。"],[1,"⑥⟦1|氢键⟧和碱基堆积力维持结构，⟦2|后者⟧⟦1|贡献⟧更大。"]]],[0,3,1,2,"tRNA 的高级结构（简述 tRNA 的结构和功能）",[[0,"（1）二级结构。"],[1,"tRNA 呈⟦1|三叶草⟧形，由 "]]],[0,3,1,8,"简述核酸变性和复性的过程，以及影响溶解温度和复性速度的主要因素（影响 DNA 变性和复性的因素）",[[0,"（什么是 Tm，简述影响 Tm 值的因素）。"],[0,"（1）变性：加热、⟦1|极端⟧ pH、低盐或⟦1|尿素⟧、⟦1|盐酸⟧胍、⟦1|甲醛⟧等破坏⟦1|氢键⟧和⟦1|堆积作用⟧，使⟦1|双链⟧解离、⟦1|构象⟧及性质改变。"],[0,"（2）Tm 是 DNA 热变性达到一半时的温度，受⟦2|离子强度⟧、pH 和⟦2|极性⟧⟦1|溶质⟧等影响。"],[1,"①GC ⟦2|含量⟧：⟦1|G-C⟧ 有 ⟦1|3⟧ 个⟦1|氢键⟧，⟦1|A-T⟧ 有 ⟦1|2⟧ 个；GC 越多，⟦1|双链⟧越稳，Tm 越高。"],[1,"②⟦1|盐浓度⟧：盐⟦2|离子⟧中和⟦1|磷酸⟧基⟦1|负电荷⟧、减弱排斥，⟦1|盐浓度⟧升高通常使 Tm 升高。"],[1,"③DNA ⟦2|长度⟧：⟦1|长链⟧通常更稳定，Tm 较高。"],[1,"④pH：适宜 pH 利于稳定，过高或过⟦1|低会⟧改变⟦1|碱基⟧解离及配对，促进变性。"],[1,"⑤⟦1|有机溶剂⟧：⟦1|乙醇⟧、⟦1|异丙醇⟧等改变⟦1|链间⟧作用和⟦1|水合⟧，降低⟦2|稳定性⟧并影响 Tm。"],[1,"⑥序列均一性：不规则序列使局部 Tm ⟦2|差异⟧增大，影响⟦1|总体⟧ Tm。"],[1,"⑦⟦1|变性剂⟧：破坏⟦1|氢键⟧和⟦1|堆积作用⟧，使 Tm 下降。"],[0,"（3）复性：变性 DNA 在适宜条件下重新互补配对成⟦2|双螺旋⟧，主要受以下因素影响。"],[1,"①温度：由⟦1|高温⟧缓慢降至适宜温度，互补⟦1|单链⟧开始配对；过高不能复性。"],[1,"②⟦2|离子强度⟧：⟦2|离子⟧⟦1|屏蔽磷酸⟧基⟦1|负电荷⟧，减小⟦1|链间⟧排斥，促进复性。"],[1,"③DNA 浓度：一定条件下，浓度越高，⟦1|互补链⟧碰撞⟦1|机会⟧越多，复性越快；过低则慢。"],[1,"④⟦2|长度⟧：相同⟦1|核苷酸⟧浓度等条件下，较长片段通常有更多成核⟦1|机会⟧，复性可更快；并非短链一定更快。"],[1,"⑤序列⟦1|复杂度⟧与互补程度：重复序列多、⟦1|互补性⟧高，复性较快；序列复杂或错配多，复性较慢。"],[1,"⑥⟦1|缓冲液⟧：合适 pH 和⟦1|盐浓度⟧可提高复性效率。"],[1,"⑦⟦1|机械⟧因素：温和搅拌或振荡可促⟦1|链接⟧近，超声等⟦1|强力⟧可能干扰复性。"]]],[0,3,1,9,"DNA 热变性有何特点？影响 DNA 复性过程的主要因素有哪些？",[[0,"（1）热变性：DNA 稀⟦1|盐液⟧加热至约 ⟦1|70～100⟧℃时，⟦1|氢键⟧和⟦1|堆积作用⟧被破坏，⟦1|双链⟧解离为⟦1|单链线团⟧。"],[0,"（2）特点：变性⟦1|温区⟧窄，⟦1|A₂₆⟧ ₀ 及⟦1|浮力密度⟧升高，⟦1|黏度⟧和⟦1|比旋光⟧度下降，沉降性质、⟦1|酸碱⟧滴定⟦2|曲线⟧改变，正常⟦1|双链⟧功能受损。"],[0,"（3）复性影响因素。"],[1,"①⟦2|温度⟧：⟦1|高温⟧使 DNA 保持⟦1|单链⟧，缓慢降至适宜⟦2|温度⟧可促进互补配对。"],[1,"②⟦2|离子强度⟧：适量⟦1|阳离子屏蔽磷酸⟧基⟦1|负电荷⟧，减小⟦1|链间⟧排斥，促进复性。"],[1,"③DNA 浓度：浓度过低时⟦1|互补链⟧碰撞少、复性慢；适当提高浓度可加快复性。"],[1,"④DNA ⟦2|长度⟧：在⟦1|核苷酸⟧浓度等相同时，较长片段通常有更多成核⟦1|机会⟧，复性可更快；不能只凭长短判断。"],[1,"⑤序列⟦1|复杂度⟧与互补程度：重复序列多、互补程度⟦1|高者⟧复性较快；序列复杂或错配较多者复性较慢。"],[1,"⑥缓冲⟦1|体系⟧：适宜的 pH 和⟦1|盐浓度⟧有利于复性。"],[1,"⑦⟦1|机械⟧因素：温和⟦1|混合⟧可增加⟦1|互补链⟧接触，强⟦1|剪切⟧则可能使 DNA 断裂。"]]],[0,3,1,10,"简要介绍 PCR，以及在基因进行 PCR 扩增过程时的影响因素。",[[0,"（1）PCR 是在体外扩增两⟦2|引物⟧间靶 ⟦1|DNA⟧ 的⟦2|技术⟧，需⟦2|模板⟧、耐热 ⟦1|DNA⟧ 聚合酶、⟦1|4⟧ 种 ⟦1|dNTP⟧、⟦2|引物⟧及⟦1|缓冲液⟧。"],[0,"（2）依次⟦1|高温⟧⟦2|变性⟧、退火、延伸；退火⟦2|温度⟧按⟦2|引物⟧ Tm 确定，⟦1|Taq⟧ 常在 ⟦1|72⟧℃由 ⟦1|3⟧′端向 ⟦1|5⟧′→⟦1|3⟧′方向延伸。⟦1|理想⟧扩增期，n ⟦1|轮约⟧增至 ⟦1|2⟧ⁿ倍。"],[0,"（3）影响因素。"],[1,"①⟦2|引物⟧：⟦2|特异性⟧、⟦2|长度⟧和 GC ⟦2|含量⟧影响效率，应与靶序列互补并避免非特异结合。"],[1,"②⟦2|模板⟧⟦1|质量⟧：⟦1|污染⟧或降解会导致失败或非特异扩增。"],[1,"③⟦1|DNA⟧ 聚合酶：⟦1|Taq⟧ 酶的⟦2|活性⟧和⟦1|耐热性⟧直接影响效率。"],[1,"④⟦2|循环⟧⟦1|次数⟧：增加可⟦1|提高产量⟧，过多会积累非特异产物和⟦1|错误⟧。"],[1,"⑤退火⟦2|温度⟧：应按⟦2|引物⟧ Tm ⟦1|优化⟧。"],[1,"⑥⟦1|Mg²⁺⟧ ：与 ⟦1|dNTP⟧ 和⟦1|核酸⟧⟦2|骨架⟧互作并影响聚合酶⟦2|活性⟧，浓度须适宜。"]]],[0,3,1,11,"简述核酸杂交的原理及主要应用。",[[0,"（1）原理：互补⟦1|异源⟧核酸经⟦2|变性⟧、⟦2|复性⟧形成 ⟦1|DNA-DNA⟧ 或 ⟦1|DNA-RNA⟧ ⟦1|杂交链⟧；已知⟦1|探针⟧可特异检出靶序列。"],[0,"（2）应用。"],[1,"①⟦1|Southern⟧ ⟦1|印迹⟧：⟦1|DNA⟧ 酶切、⟦1|电泳⟧、⟦2|变性⟧、⟦1|转膜⟧后与⟦1|探针⟧杂交，可检出特定序列并判断片段大小和⟦1|酶切位点⟧。"],[1,"②⟦1|Northern⟧ ⟦1|印迹⟧：方法类似 ⟦1|Southern⟧，用于⟦2|检测⟧ ⟦1|RNA⟧ 和基因表达。"],[1,"③⟦1|菌落原位杂交⟧：从⟦2|大量克隆⟧中快速筛选⟦1|阳性⟧⟦2|克隆⟧。"],[1,"④点⟦1|印迹⟧：少量⟦2|样品⟧即可检出⟦2|目标⟧序列，但不能判断片段大小或重复序列的组织方式。"],[1,"⑤基因⟦1|探针⟧：带⟦2|标记⟧的已知互补核酸与目的基因杂交，以⟦2|信号⟧显示靶序列。"]]],[0,3,1,12,"一般来说 DNA 稳定，而 RNA 不稳定，DNA 稳定有什么生物学意义。RNA 不稳定又有什么意义？",[[0,"DNA 缺少 ⟦1|2⟧′-OH，通常为⟦1|双链⟧并有复制校对和修复机制，利于稳定⟦1|保存信息⟧；RNA 有 ⟦1|2⟧′-OH，易碱⟦2|水解⟧，且多为⟦1|单链⟧，通常更易降解。"],[0,"（1）DNA 稳定的意义。"],[1,"①长期保存并⟦1|代际⟧传递⟦2|遗传信息⟧，维持⟦2|遗传⟧⟦1|连续性⟧。"],[1,"②为精确⟦2|调控⟧转录、翻译和生长发育提供稳定⟦2|模板⟧。"],[1,"③保证分裂时⟦1|染色体⟧准确复制并均等⟦1|分配⟧。"],[0,"（2）RNA 不稳定的意义。"],[1,"①通过快速合成和降解，及时响应⟦2|环境⟧并⟦1|调整⟧表达。"],[1,"②调节 ⟦1|mRNA⟧ 半⟦1|寿期⟧，可控制蛋白质合成速率和数量。"],[1,"③RNA 可作可更新的⟦1|信息中间体⟧，参与⟦1|信息⟧传递与⟦2|重组⟧，如逆转录病毒将 RNA ⟦1|信息⟧写入 DNA；这并非由 RNA⟦1|不稳定性⟧单独决定。"]]],[0,3,1,13,"分离 DNA 和 RNA 的主要方法有哪些？其原理是什么？",[[0,"（1）DNA 分离。"],[1,"①⟦1|苯酚⟧法：适宜 pH 下，⟦1|苯酚⟧使⟦1|蛋白⟧⟦2|变性⟧，DNA 留在⟦1|水相⟧；反复抽提后加盐⟦1|和约⟧ ⟦1|2⟧ 倍⟦1|体积乙醇⟧，⟦1|低温⟧沉淀 DNA。"],[1,"②氯仿-⟦1|辛醇⟧法：以含⟦1|辛醇⟧的氯仿使 ⟦1|DNP⟧ 中⟦1|蛋白⟧⟦2|表面变性⟧，DNA 留在⟦1|水相⟧；反复抽提至无⟦1|蛋白⟧。"],[1,"③⟦1|SDS⟧ 法：⟦1|SDS⟧ 裂解并抑制⟦1|核酸酶⟧，⟦1|蛋白酶消化蛋白⟧，再用⟦1|苯酚⟧、氯仿除⟦1|蛋白⟧。"],[0,"（2）RNA 分离。"],[1,"RNA 较不稳定且 ⟦1|RNase⟧ 普遍存在，故分离更难，常用⟦1|两法⟧。"],[2,"①酚提取：水饱和酚除⟦1|蛋白⟧；RNA 在上层⟦1|水相⟧，⟦1|蛋白⟧在⟦1|下层⟧酚相。"],[2,"②胍盐/⟦1|氯化铯⟧⟦2|梯度⟧离心：胍盐使⟦1|蛋白⟧⟦2|变性⟧而 RNA 保持溶解；离心后⟦1|蛋白⟧在上、DNA 居中、RNA 在底部。"]]],[0,3,1,14,"请详述 Sanger 法 DNA 测序的原理、过程、优势和应用。",[[0,"（1）原理：⟦1|传统⟧ Sanger ⟦1|法用单链⟧ DNA、⟦2|引物⟧、聚合酶和 ⟦1|dNTP⟧ 反应，四组各加一种无 ⟦1|3⟧′-OH 的 ⟦1|ddNTP⟧，掺入即终止；⟦2|变性⟧ ⟦1|PAGE⟧ 分离后按⟦2|长度⟧⟦1|读序⟧。"],[0,"（2）⟦2|步骤⟧。"],[1,"①提取并纯化 DNA。"],[1,"②按⟦1|待测区⟧⟦2|设计⟧、合成特异⟦2|引物⟧。"],[1,"③配置⟦2|模板⟧、⟦2|引物⟧、⟦1|4⟧ 种 ⟦1|dNTP⟧、DNA 聚合酶和少量 ⟦1|ddNTP⟧。"],[1,"④完成退火、延伸和随机终止。"],[1,"⑤⟦2|变性⟧ ⟦1|PAGE⟧ 分离产物，由放射自显影图按片段长短读取序列。"],[0,"（3）优势。"],[1,"①准确、⟦1|直观⟧、通常无需⟦1|建库⟧，适合验证⟦1|碱基⟧替换（转换、颠换）、缺失和插入；⟦1|污染少时⟧假⟦1|阳性⟧较低。"],[1,"②低⟦1|通量项目成本低⟧、运行快，适合⟦1|个性化⟧⟦2|检测⟧。"],[0,"（4）应用。"],[1,"①测定目的基因 ⟦1|PCR⟧ 产物。"],[1,"②验证突变、⟦1|SNP⟧ 及插入或缺失。"],[1,"③用于微生物、⟦1|真菌⟧鉴定，⟦1|HLA⟧ 和⟦2|病毒⟧⟦1|分型⟧。"],[1,"④⟦2|检测⟧⟦1|肿瘤⟧突变和⟦1|位点⟧明确、数量有限的单基因⟦2|遗传病⟧。"],[1,"⑤验证新一代测序结果。"]]],[0,3,1,15,"如何看待 RNA 功能的多样性？它的核心作用是什么？",[[0,"（1）RNA 功能多样。"],[1,"①参与翻译：⟦1|mRNA⟧ 作⟦1|信使⟧和⟦2|模板⟧，⟦1|rRNA⟧ 参与装配和催化，⟦1|tRNA⟧ 转运并⟦1|译码⟧。"],[1,"②具有催化功能，如⟦1|核酶⟧；还承担多种⟦1|持家⟧功能。"],[1,"③参与 RNA 切割、修剪、剪接和⟦1|编辑⟧；如 ⟦1|snoRNA⟧ ⟦1|指导⟧ ⟦1|rRNA⟧ ⟦2|甲基化⟧、⟦1|假尿苷⟧化及⟦2|加工⟧。"],[1,"④调节基因表达；如⟦1|反义⟧ RNA 与靶序列互补，阻断功能或改变其⟦1|构象⟧。"],[1,"⑤剪接和⟦1|编辑⟧可减轻突变影响、增加⟦2|遗传信息⟧多样性并促进进化。"],[1,"⑥部分⟦2|病毒⟧以 RNA ⟦2|储存遗传信息⟧。"],[0,"（2）核心作用：在 ⟦1|DNA⟧ 与蛋白质间传递⟦2|遗传信息⟧，并⟦2|调控⟧基因表达。"]]],[0,5,0,1,"必需脂肪酸（essential fatty acids）",[[0,"必需脂肪酸是人和⟦1|哺乳动物⟧不能合成、必须从⟦2|食物⟧获得的多不饱和脂肪酸，主要包括⟦1|ω-6⟧ 系列⟦2|前体⟧⟦1|亚油酸⟧和⟦1|ω-3⟧ 系列⟦2|前体⟧⟦1|α-亚麻酸⟧。"]]],[0,6,0,1,"氧化磷酸化（oxidative phosphorylation）",[[0,"氧化磷酸化是 ⟦1|NADH⟧ 或 ⟦1|FADH₂⟧的⟦2|电子⟧经⟦1|呼吸链⟧传给 ⟦1|O₂⟧，并利用释放的能量使 ⟦1|ADP⟧ 生成 ⟦1|ATP⟧ 的⟦2|偶联⟧过程，发生在⟦1|线粒体内膜⟧或⟦2|原核⟧生物⟦1|质膜⟧。"]]],[0,6,0,2,"电子传递链，或称呼吸链（respiratory chain）",[[0,"⟦1|呼吸链⟧是按⟦2|电子亲和力⟧递增顺序排列、把⟦2|电子⟧由 ⟦1|NADH⟧ 或 ⟦1|FADH₂⟧传给 ⟦1|O₂⟧的⟦1|一系列载体⟧，由⟦2|复合体⟧Ⅰ～Ⅳ、⟦1|辅酶⟧Q 和细胞色素 c 等组成。"]]],[0,6,0,3,"化学渗透假说（Chemiosmotic hypothesis）",[[0,"化学渗透假说认为，⟦1|呼吸链⟧释放的能量先建立⟦1|跨膜⟧⟦2|质子⟧⟦1|电化学⟧⟦2|梯度⟧，⟦2|质子⟧顺⟦2|梯度⟧回流时再⟦2|驱动⟧ ⟦1|ATP⟧ 合成。"]]],[0,6,0,4,"解偶联剂（uncoupler agent）",[[0,"解偶联剂是消除⟦1|跨膜⟧⟦2|质子梯度⟧、使电子传递与 ⟦1|ATP⟧ 合成分离的物质；电子传递仍可进行，但能量以热散失，⟦1|耗氧⟧增加而 ⟦1|ATP⟧ 生成减少。"]]],[0,6,0,5,"解偶联作用（uncoupling）",[[0,"解偶联作用是电子传递与氧化磷酸化失去⟦2|偶联⟧的现象，表现为⟦2|质子梯度⟧⟦1|消失⟧、⟦1|ATP⟧ 合成减少、耗氧和⟦1|产热⟧增加。"]]],[0,6,0,6,"氧化磷酸化抑制剂（Oxidative phosphorylation inhibitor）",[[0,"氧化磷酸化抑制剂是直接阻断 ⟦1|ATP⟧ 合成的物质，可同时降低 ⟦1|ATP⟧ 生成和氧的利用，并间接减慢电子传递。"]]],[0,6,0,7,"P/O 比（P/O ratio/value）",[[0,"P/O 比是一对⟦2|电子⟧经⟦1|呼吸链⟧传给 ⟦1|O₂⟧时形成的 ⟦1|ATP⟧ 分子数，即每消耗 ⟦1|1⟧ ⟦1|mol⟧ 原子⟦1|氧所⟧生成 ⟦1|ATP⟧ 的⟦1|摩尔⟧数；⟦1|NADH⟧和 ⟦1|FADH₂⟧的 P/O 比约为 ⟦1|2.5⟧ 和 ⟦1|1.5⟧。"]]],[0,6,0,8,"生物氧化（biological oxidation）",[[0,"生物氧化又称细胞呼吸，是糖、⟦2|脂质⟧和蛋白质等在酶催化下逐步氧化为 ⟦1|CO₂⟧和水，并把释放能量⟦2|储存⟧在 ⟦1|ATP⟧中的过程。"]]],[0,6,0,9,"辅酶 Q/泛醌（coenzyme Q）",[[0,"辅酶 Q 又称泛醌，是呼吸链中脂⟦1|溶性⟧的非⟦1|蛋白电子载体⟧，可接受⟦2|复合体⟧Ⅰ、Ⅱ的⟦2|电子⟧并传给⟦2|复合体⟧Ⅲ。"]]],[0,6,0,10,"Q 循环（Q Cycle）",[[0,"Q 循环是⟦2|复合体⟧Ⅲ中⟦1|辅酶⟧ Q 传递⟦2|电子⟧的循环方式，可把两个 ⟦1|QH₂⟧的⟦2|电子⟧交给两个细胞色素 c，并使每对电子传递伴随 ⟦1|4⟧ 个⟦2|质子⟧移向膜⟦1|间隙⟧。"]]],[0,6,0,11,"苹果酸-天冬氨酸穿梭系统（Malate-aspartate acid Shuttle System）",[[0,"苹果酸-天冬氨酸穿梭把⟦2|胞质⟧ ⟦1|NADH⟧ 的还原⟦1|当量⟧转入⟦1|线粒体⟧：⟦1|草酰乙酸⟧先还原为苹果酸进入⟦2|基质⟧，再氧化生成⟦1|草酰乙酸⟧和 ⟦1|NADH⟧。"]]],[0,6,0,12,"甘油 3-磷酸穿梭途径（glycerol3-phosphate shuttle）",[[0,"甘油-⟦1|3⟧-磷酸穿梭把⟦2|胞质⟧ ⟦1|NADH⟧ 的⟦2|电子⟧经磷酸二羟⟦1|丙酮⟧和甘油-⟦1|3⟧-磷酸转给⟦1|线粒体⟧ ⟦1|FAD⟧，生成的 ⟦1|FADH₂⟧进入⟦1|呼吸链⟧；每个⟦2|胞质⟧ ⟦1|NADH⟧ 约形成 ⟦1|1.5⟧ 个 ⟦1|ATP⟧。"]]],[0,6,0,13,"能荷（energy charge）",[[0,"能荷是⟦1|腺苷酸总池⟧中⟦1|高能磷酸键⟧所占的相对水平，可表示细胞能量状态，其值由⟦1|全为⟧ ⟦1|AMP⟧ 时的 ⟦1|0⟧ 变到⟦1|全为⟧ ⟦1|ATP⟧时的 ⟦1|1⟧。"]]],[0,6,1,1,"写出 ATP 的结构并说明在体内具有哪些生理作用。",[[0,"（1）ATP 由⟦1|腺嘌呤⟧、⟦1|核糖⟧和 ⟦1|3⟧ 个⟦1|磷酸⟧基组成，记作 ⟦1|A-P⟧～P～P。"],[0,"（2）生理作用如下。"],[1,"①暂存、传递能量：生物氧化生成 ATP，ATP 为合成、收缩、主动⟦2|运输⟧和⟦2|遗传信息⟧传递等供能。"],[1,"②ATP ⟦2|水解⟧可⟦2|驱动⟧⟦1|机械功⟧和⟦1|电化学⟧过程，也可产热；ATP 与 ⟦1|UTP⟧、⟦1|CTP⟧、⟦1|GTP⟧ 之间可转移⟦1|高能磷酸⟧基。"],[1,"③经⟦1|腺苷酸环化酶⟧生成 ⟦1|cAMP⟧，作为⟦1|多种肽⟧类⟦1|激素⟧的⟦1|第二信使⟧。"],[1,"④ATP 及 ⟦1|ADP⟧、Pi 水平反映能量状态并调节⟦1|多种酶⟧和代谢。"],[1,"⑤与 ⟦1|Met⟧ 生成 ⟦1|SAM⟧，⟦2|活化⟧并⟦2|供给⟧⟦1|甲基⟧，还参与⟦1|氨基酸⟧⟦2|循环⟧。"],[1,"⑥ATP 是 ⟦1|RNA⟧ 合成⟦2|原料⟧，并可经代谢转为 ⟦1|DNA⟧ 合成⟦1|所需⟧的 ⟦1|dATP⟧。"],[1,"⑦⟦1|AMP⟧ 是 ⟦1|NAD⁺⟧ 、⟦1|NADP⁺⟧ 、⟦1|FAD⟧ 和 ⟦1|CoA⟧ 等⟦1|辅酶⟧的组成部分。"]]],[0,6,1,2,"如何理解生物体内的能量代谢是以 ATP 为中心的？",[[0,"①ATP 是通用能量⟦1|媒介⟧，⟦2|水解⟧可⟦2|驱动⟧多数需能反应；部分反应用其他 ⟦1|NTP⟧ 供能，它们可与 ATP 相互转换。"],[0,"②连接分解与合成：分解代谢释放能量合成 ATP，ATP ⟦2|水解⟧再推动合成代谢。"],[0,"③ATP、⟦1|ADP⟧ 和 Pi 的⟦1|比例⟧反映能量状态，细胞据此调节能量代谢。"],[0,"④为逆浓度⟦1|跨膜⟧⟦2|运输⟧、⟦1|神经传导⟧和⟦2|肌肉⟧收缩等供能或传递⟦2|信号⟧。"],[0,"⑤可快速⟦1|储能⟧、释能，适应能量需求⟦1|波动⟧。"]]],[0,6,1,3,"说明 ATP、CTP、UTP、GTP 四种核苷三磷酸在代谢中的作用。",[[0,"（1）CTP（⟦1|胞嘧啶⟧核苷三磷酸）的作用。"],[1,"①转录时提供 ⟦1|CMP⟧。"],[1,"②经 ⟦1|CDP-胆碱⟧、⟦1|CDP-乙醇胺⟧等⟦2|活化⟧中间物，参与⟦1|磷脂酰胆碱⟧和⟦1|磷脂酰乙醇胺⟧合成。"],[0,"（2）UTP（⟦1|尿嘧啶⟧核苷三磷酸）的作用。"],[1,"①转录时提供 ⟦1|UMP⟧。"],[1,"②参与⟦1|半乳糖⟧代谢；⟦1|UDP-半乳糖⟧是⟦1|乳糖⟧合成⟦2|前体⟧。"],[1,"③以 ⟦1|UDP-葡萄糖⟧⟦2|活化⟧⟦1|葡萄糖⟧，参与⟦2|糖原⟧合成。"],[1,"④⟦1|UDP-葡萄糖⟧、⟦1|UDP-N-乙酰葡萄糖胺⟧是⟦1|糖蛋白⟧合成⟦2|前体⟧。"],[1,"⑤⟦1|UDP-葡萄糖⟧参与⟦1|蔗糖⟧和⟦1|纤维素⟧合成；⟦1|淀粉⟧合成主要用 ⟦1|ADP-葡萄糖⟧，不能直接归于 UTP ⟦1|供糖⟧。"],[0,"（3）GTP（⟦1|鸟嘌呤⟧核苷三磷酸）的作用。"],[1,"①转录时提供 ⟦1|GMP⟧。"],[1,"②为蛋白质合成、寻靶和转运供能。"],[1,"③参与 G ⟦1|蛋白⟧⟦2|活化⟧和 ⟦1|cGMP⟧ ⟦1|第二信使⟧生成。"],[1,"④⟦1|琥珀酰⟧-⟦1|CoA⟧ 转为⟦1|琥珀酸⟧时，⟦1|GDP⟧ 可接受磷酸基生成 GTP。"],[1,"⑤⟦1|GDP-甘露糖⟧是⟦1|糖蛋白⟧合成⟦2|前体⟧。"],[0,"（4）ATP（⟦1|腺嘌呤⟧核苷三磷酸）的作用。"],[1,"①转录时提供 ⟦1|AMP⟧。"],[1,"②为收缩、⟦1|神经传导⟧、代谢、吸收分泌和逆浓度⟦2|运输⟧等供能。"],[1,"③生成 ⟦1|cAMP⟧，⟦1|调节糖⟧、⟦2|脂质⟧、蛋白质和⟦1|核酸⟧代谢。"],[1,"④可作⟦1|神经递质⟧。"],[1,"⑤是重要磷酸基⟦2|供体⟧。"],[1,"⑥⟦1|NAD⁺⟧ 、⟦1|NADP⁺⟧ 、⟦1|FAD⟧ 和 ⟦1|CoA⟧ 均含 ⟦1|AMP⟧ 部分。"]]],[0,6,1,4,"什么叫呼吸链？它由哪些组分组成？有哪些方法可以用来确定电子传递顺序？",[[0,"（1）⟦1|呼吸链⟧是⟦2|电子⟧由 ⟦1|NADH⟧ 或 ⟦1|FADH₂⟧经⟦2|亲和力⟧递增的⟦1|载体⟧传给 ⟦1|O₂⟧并生成 ⟦1|H₂O⟧ 的⟦1|体系⟧；⟦2|真核⟧位于⟦1|线粒体内膜⟧，⟦2|原核⟧位于⟦1|质膜⟧。"],[0,"（2）组成为⟦2|复合体⟧Ⅰ、⟦2|复合体⟧Ⅱ、⟦1|CoQ⟧、⟦2|复合体⟧Ⅲ、细胞色素 c 和⟦2|复合体⟧Ⅳ。"],[0,"（3）确定顺序的方法。"],[1,"①测各⟦1|载体标准⟧氧化还原⟦1|电位⟧；⟦1|电位⟧越低，越易失⟦2|电子⟧，位置越靠前。"],[1,"②体外⟦2|重组⟧：⟦1|检验⟧各⟦1|载体⟧间能否直接传递⟦2|电子⟧，据此确定先后。"],[1,"③用⟦1|抑制剂⟧阻断特⟦1|定位点⟧，再测各组分氧化还原状态。"],[1,"④用⟦1|分光光度法⟧测完整⟦1|线粒体⟧中各⟦1|载体⟧的氧化还原状态。"]]],[0,6,1,5,"试比较解偶联剂、氧化磷酸化抑制剂和离子载体抑制剂对生物氧化作用的影响（氧化磷酸化抑制剂、解偶联剂、离子载体抑制剂有什么区别，各举一例）。",[[0,"类型          电子传递          ⟦1|ATP⟧ 合成             ⟦1|膜电位⟧    能量去向         ⟦1|举例⟧"],[0,"解偶联剂          加快            受抑                消散     转为⟦1|热能⟧      ⟦1|2⟧,⟦1|4⟧-⟦1|二硝基苯⟧酚氧化磷酸化抑制剂       先减慢，继而停止          停止           升高或暂时维持    不能形成 ⟦1|ATP⟧     ⟦1|寡霉素⟧"],[0,"离子载体         通常加快           受抑                消散     转为⟦1|热能⟧       缬氨⟦1|霉素⟧"]]],[0,6,1,6,"常见的电子传递抑制剂有哪些（呼吸链的抑制剂及作用机理）？",[[0,"（1）电子传递抑制剂指阻断⟦1|呼吸链⟧某一电子传递⟦2|步骤⟧的物质，也可用于⟦1|判断载体顺序⟧。"],[0,"（2）种类。"],[1,"①⟦1|鱼藤酮⟧、⟦1|安密妥⟧、杀⟦1|粉蝶菌素⟧ A：阻断⟦2|复合体⟧Ⅰ中 ⟦1|NADH⟧→⟦1|CoQ⟧ 的电子传递；⟦1|鱼藤酮⟧也用作⟦1|杀虫剂⟧。"],[1,"②⟦1|抗霉素⟧ A：阻断⟦2|复合体⟧Ⅲ的 Qi ⟦1|位点⟧，抑制 Q ⟦2|循环⟧及向细胞色素 c 的电子传递。"],[1,"③⟦1|CN⁻⟧ 、⟦1|N₃⁻⟧ 和 CO：阻断⟦2|复合体⟧Ⅳ；前⟦1|两者⟧结合⟦1|血红素⟧ ⟦1|a₃⟧的 ⟦1|Fe³⁺⟧ ，CO 结合 ⟦1|Fe²⁺⟧ 。"]]],[0,6,1,7,"简述氧化磷酸化的机制？",[[0,"（1）氧化磷酸化指⟦1|还原型辅酶⟧的⟦2|电子⟧经⟦1|呼吸链⟧传给 ⟦1|O₂⟧，并用释放能量使 ⟦1|ADP⟧ 生成 ⟦1|ATP⟧，是⟦1|需氧⟧生物主要产能方式。"],[0,"（2）机制。"],[1,"⟦2|化学⟧渗透⟦1|学说⟧：电子传递把 ⟦1|H⁺⟧ 由⟦2|基质⟧泵至膜⟦1|间隙⟧，建立⟦2|质子⟧⟦1|电化学⟧⟦2|梯度⟧；⟦1|H⁺⟧ 回流⟦2|驱动⟧ ⟦1|ATP⟧ 合成。"],[2,"a.⟦1|NADH⟧、⟦1|FADH₂⟧的⟦2|电子⟧沿⟦2|亲和力⟧递增的⟦1|载体⟧传给 ⟦1|O₂⟧，⟦2|后者⟧与 ⟦1|H⁺⟧ 形成 ⟦1|H₂O⟧。"],[2,"b. ⟦2|复合体⟧Ⅰ、Ⅲ、Ⅳ利用电子传递能量，把 ⟦1|H⁺⟧ 从⟦2|基质⟧转移至膜⟦1|间隙⟧。"],[2,"c.⟦1|内膜⟧不让 ⟦1|H⁺⟧ 自由通过，故外侧 ⟦1|H⁺⟧ 积累并形成⟦1|电化学⟧势。"],[2,"d.⟦1|H⁺⟧ 经 ⟦1|ATP⟧ ⟦1|合酶⟧回流，释放⟦1|势能⟧，⟦2|偶联⟧ ⟦1|ADP+Pi⟧→⟦1|ATP⟧。"]]],[0,6,1,8,"论述 NADH 进入线粒体的两种穿梭途径（细胞质中 NADH 所携带的氢被其他物质带入线粒体的两种机制）。",[[0,"⟦2|胞质⟧ NADH 不能透过线粒体⟦1|内膜⟧，须经穿梭把还原⟦1|当量⟧送入线粒体氧化系统。"],[0,"（1）⟦2|甘油⟧-⟦1|3⟧-⟦1|磷酸⟧穿梭：⟦2|胞质⟧ NADH 把 ⟦1|DHAP⟧ 还原为⟦2|甘油⟧-⟦1|3⟧-⟦1|磷酸⟧；⟦1|内膜⟧ ⟦1|FAD⟧ 酶再氧化它，⟦2|电子⟧以 ⟦1|FADH₂⟧交给 Q。每个 NADH ⟦1|约产⟧ ⟦1|1.5⟧ ⟦1|ATP⟧，主要见于⟦2|肌肉⟧、脑。"],[0,"（2）⟦1|苹果酸⟧-⟦1|天冬氨酸⟧穿梭：⟦2|胞质⟧ NADH 把⟦1|草酰乙酸⟧还原为⟦1|苹果酸⟧；入⟦2|基质⟧后再氧化并生成 NADH。⟦1|草酰乙酸⟧转氨成 ⟦1|Asp⟧ 后运回⟦2|胞质⟧。每个 NADH ⟦1|约产⟧ ⟦1|2.5⟧ ⟦1|ATP⟧，主要见于肝、心。"]]],[0,6,1,9,"化学渗透学说核心要点是什么（简述 ATP 合成的化学渗透偶联学说）？氧化过程和磷酸化过程是什么关系？",[[0,"（1）电子传递先建立跨⟦1|内膜⟧⟦2|质子梯度⟧，⟦2|梯度⟧再⟦2|驱动⟧ ATP 合成。主要⟦1|内容⟧如下。"],[1,"①⟦2|复合体⟧Ⅰ、Ⅲ、Ⅳ⟦1|定向⟧传递⟦2|电子⟧，同时把 ⟦1|H⁺⟧ 从⟦2|基质⟧泵至膜⟦1|间隙⟧，形成⟦2|质子⟧⟦1|动势⟧。"],[1,"②⟦2|质子⟧⟦1|动势⟧⟦2|驱动⟧ ⟦1|H⁺⟧ 通过 ATP ⟦1|合酶⟧，释放能量并偶联 ATP 合成。"],[1,"③需完整、封闭且不让 ⟦1|H⁺⟧ 自由通过的⟦1|内膜⟧；⟦2|梯度⟧被破坏，ATP 合成即受抑。"],[1,"④⟦1|H⁺⟧ 经 ATP ⟦1|合酶⟧通道回到⟦2|基质⟧，促使 ⟦1|ADP+Pi⟧→ATP。"],[0,"（2）氧化与磷酸化的关系。"],[1,"⟦2|二者⟧为能量偶联：⟦1|NADH⟧、⟦1|FADH₂⟧⟦2|电子⟧传给 ⟦1|O₂⟧时释放能量并泵出 ⟦1|H⁺⟧ ；⟦1|H⁺⟧ 经 ⟦1|F₀⟧ 回流，⟦1|F₁⟧催化 ATP 生成。"]]],[0,6,1,10,"TCA 循环没有氧气的参与为什么是有氧呼吸的一部分？",[[0,"TCA 循环在⟦1|原核细胞⟧质或⟦2|真核⟧⟦1|线粒体⟧⟦2|基质⟧进行，把⟦1|乙酰⟧-⟦1|CoA⟧ 氧化为 ⟦1|CO₂⟧并产生⟦1|还原型辅酶⟧和能量。"],[0,"它虽不直接耗 ⟦1|O₂⟧，但 ⟦1|NADH⟧、⟦1|FADH₂⟧须由以 ⟦1|O₂⟧为末端⟦1|受体⟧的⟦1|呼吸链⟧再氧化；缺氧时 ⟦1|NAD⁺⟧ 、⟦1|FAD⟧ 不能再生，TCA即停滞。"]]],[0,6,1,11,"描述 NADH 氧化呼吸链和琥珀酸氧化呼吸链的组成、排列顺序及氧化磷酸化的偶联部位。",[[0,"（1）NADH 链：NADH→⟦2|复合体⟧Ⅰ（⟦1|FMN⟧、⟦1|Fe-S⟧）→⟦1|CoQ⟧→⟦2|复合体⟧Ⅲ（⟦1|Cyt b⟧、⟦1|Fe-S⟧、⟦1|c₁⟧）→⟦1|Cyt c⟧→⟦2|复合体⟧Ⅳ（⟦1|Cytaa₃⟧）→⟦1|O₂⟧。偶联部位为⟦2|复合体⟧Ⅰ、Ⅲ、Ⅳ。"],[0,"⟦1|琥珀酸链⟧：琥珀酸→⟦2|复合体⟧Ⅱ（⟦1|FAD⟧、⟦1|Fe-S⟧、⟦1|Cyt b⟧）→⟦1|CoQ⟧→⟦2|复合体⟧Ⅲ→⟦1|Cyt c⟧→⟦2|复合体⟧Ⅳ→⟦1|O₂⟧。偶联部位为⟦2|复合体⟧Ⅲ、Ⅳ。"],[0,"（2）详细⟦2|组分⟧。"],[1,"①⟦2|复合体⟧Ⅰ：NADH 把⟦2|电子⟧交给 ⟦1|FMN⟧，再经 ⟦1|Fe-S⟧ 传给 ⟦1|CoQ⟧，并泵出 ⟦1|H⁺⟧ 。"],[1,"②⟦2|复合体⟧Ⅱ：⟦1|FADH₂⟧经 ⟦1|Fe-S⟧ 把⟦2|电子⟧交给 ⟦1|CoQ⟧；释放能量不足以泵 ⟦1|H⁺⟧ 。"],[1,"③⟦1|CoQ⟧：⟦1|内膜中脂溶性⟧、唯一非⟦1|蛋白载体⟧，把⟦2|复合体⟧Ⅰ、Ⅱ的⟦2|电子⟧送至⟦2|复合体⟧Ⅲ。"],[1,"④⟦2|复合体⟧Ⅲ：含 ⟦1|Cyt bH⟧、bL、⟦1|2Fe-2S⟧ 和 ⟦1|Cyt c⟧₁，把 ⟦1|QH₂⟧⟦2|电子⟧交给 ⟦1|Cyt c⟧。"],[1,"⑤细胞色素 c。"],[2,"位于⟦1|内膜⟧外侧，以 ⟦1|Fe³⁺⟧ /⟦1|Fe²⁺⟧ 互变每次传 ⟦1|1⟧ 个⟦2|电子⟧；是⟦1|水溶性载体⟧，连接⟦2|复合体⟧Ⅲ和Ⅳ。"],[1,"⑥⟦2|复合体⟧Ⅳ：⟦1|跨膜⟧⟦2|复合体⟧，接受⟦1|还原型⟧ ⟦1|Cyt c⟧ 的⟦2|电子⟧并传给 ⟦1|O₂⟧，最终生成 ⟦1|H₂O⟧。"]]],[0,7,0,1,"糖酵解（glycolysis）",[[0,"糖酵解又称 ⟦1|EMP⟧ ⟦2|途径⟧，是 ⟦1|1⟧ 分子⟦1|葡萄糖⟧在⟦1|细胞质⟧中不需氧、经 ⟦1|10⟧ 步反应生成 ⟦1|2⟧ 分子⟦1|丙酮酸⟧，并净生成 ⟦1|2⟧ 分子⟦1|ATP⟧ 和 ⟦1|2⟧ 分子 ⟦1|NADH⟧ 的过程。"]]],[0,7,0,2,"底物水平磷酸化（substrate level phosphorylation）",[[0,"底物水平磷酸化是⟦1|高能⟧代谢中间物把⟦1|磷酸⟧基直接转移给 ⟦1|ADP⟧ 或 ⟦1|GDP⟧ 生成 ⟦1|ATP⟧ 或 ⟦1|GTP⟧ 的过程，不依赖⟦1|呼吸链⟧和⟦2|质子梯度⟧。"]]],[0,7,0,3,"巴斯德效应（Pasteur effect）",[[0,"巴斯德效应是氧使⟦1|酵母⟧发酵减慢、⟦1|葡萄糖⟧消耗和⟦1|乙醇⟧生成减少的现象；原因是有氧呼吸产 ⟦1|ATP⟧ 较多，对⟦1|糖酵解⟧的需求下降。"]]],[0,7,0,4,"柠檬酸循环（citric acid cycle，TCA）",[[0,"柠檬酸循环又称三⟦1|羧酸⟧⟦2|循环⟧，是⟦1|乙酰⟧-⟦1|CoA⟧ 与⟦1|草酰乙酸⟧缩合后经一系列反应再生⟦1|草酰乙酸⟧，并生成 ⟦1|NADH⟧、⟦1|FADH₂⟧等还原⟦1|当量⟧的⟦2|循环⟧。"]]],[0,7,0,5,"回补反应（anaplerotic reaction）",[[0,"补充因生物合成而消耗的三⟦1|羧酸⟧⟦2|循环⟧中间物，以维持⟦2|循环⟧和供能的反应。例如⟦1|丙酮酸羧化酶⟧将⟦1|丙酮酸⟧转为⟦1|草酰乙酸⟧，补足⟦2|循环⟧中间物。"]]],[0,7,0,6,"两用代谢途径（amphibolic pathway）",[[0,"既参与分解代谢供能，又为合成代谢提供⟦2|前体⟧的⟦2|途径⟧。例如三⟦1|羧酸⟧⟦2|循环⟧既氧化⟦1|乙酰⟧ ⟦1|CoA⟧，又提供⟦1|氨基酸⟧、卟啉等合成⟦2|前体⟧，连接分解与合成代谢。"]]],[0,7,0,7,"乙醛酸循环（乙醛酸途径）（glyoxylate cycle）",[[0,"乙醛酸循环是植物和某些微生物通过异⟦1|柠檬酸裂解酶⟧、⟦1|苹果酸⟧合成酶等把⟦1|乙酰⟧-⟦1|CoA⟧ 转为⟦1|琥珀酸⟧和⟦1|苹果酸⟧的途径，使⟦1|脂肪酸⟧可转化为糖。"]]],[0,7,0,8,"戊糖磷酸途径（pentose phosphate pathway，PPP）",[[0,"戊糖磷酸途径是 ⟦1|6⟧-⟦1|磷酸葡萄糖⟧在⟦2|胞质⟧中氧化并⟦1|重排⟧的一条⟦1|支路⟧，不生成 ⟦1|ATP⟧，主要产生 ⟦1|NADPH⟧ 和 ⟦1|5⟧-⟦1|磷酸核糖⟧。"]]],[0,7,0,9,"蚕豆病（favism）",[[0,"蚕豆病是 ⟦1|6⟧-⟦1|磷酸葡萄糖脱氢酶⟧缺乏所致的⟦2|遗传病⟧，⟦1|患者⟧接触⟦1|蚕豆⟧、某些⟦2|药物⟧或感染时，⟦1|红细胞抗氧化⟧⟦2|能力⟧不足而可发生溶血。"]]],[0,7,0,10,"糖异生作用（gluconeogenesis）",[[0,"⟦2|糖异生⟧是以⟦1|乳酸⟧、⟦2|甘油⟧和生糖氨基酸等⟦1|非糖⟧物质合成⟦1|葡萄糖⟧的过程，主要在肝和肾进行，以维持⟦1|血糖⟧。"]]],[0,7,0,11,"可立氏循环/乳酸循环（cori cycle）",[[0,"⟦2|肌肉⟧产生的乳酸经⟦1|血液⟧运至肝，经⟦2|糖异生⟧转为⟦1|葡萄糖⟧，再回到⟦2|肌肉⟧利用的循环。它回收乳酸并维持⟦1|血糖⟧，⟦2|肌肉⟧借此持续无氧供能，但肝⟦2|糖异生⟧需耗能。"]]],[0,7,0,12,"发酵（fermentation）",[[0,"不依赖⟦1|呼吸链⟧，以有机物作⟦1|电子受体⟧、通过底物水平磷酸化产能的过程。常生成⟦1|乳酸⟧或⟦1|乙醇⟧并再生 ⟦1|NAD⁺⟧ ，使⟦1|糖酵解⟧能在缺氧时继续进行。"]]],[0,7,1,1,"什么是糖酵解？其生理意义是什么？",[[0,"（1）糖酵解即 ⟦1|EMP⟧ ⟦2|途径⟧：⟦1|1⟧ 分子⟦1|葡萄糖⟧在⟦2|胞质⟧经 ⟦1|10⟧ 步生成 ⟦1|2⟧ ⟦1|丙酮酸⟧，净得 ⟦1|2⟧ ⟦1|ATP⟧ 和 ⟦1|2⟧ ⟦1|NADH⟧；不直接⟦1|需氧⟧，是多数生物分解⟦1|葡萄糖⟧的共同⟦1|前段⟧。"],[0,"（2）生理意义。"],[1,"①无氧或缺氧时快速供能，是厌氧生物主要供能方式，也是成熟⟦1|红细胞⟧几乎唯一的 ⟦1|ATP⟧ 来源。"],[1,"②中间物可供合成：⟦1|DHAP⟧ 生成⟦2|甘油⟧-⟦1|3⟧-⟦1|磷酸⟧，⟦1|丙酮酸⟧生成 ⟦1|Ala⟧、⟦1|乙酰⟧-⟦1|CoA⟧，联系糖、⟦2|脂质⟧和蛋白质代谢。"],[1,"③许多⟦1|肿瘤⟧细胞糖酵解增强，即使⟦2|有氧⟧也可⟦2|大量⟧产⟦1|乳酸⟧，为快速增殖供能和提供中间物。"],[1,"④部分酶有兼职功能：⟦1|磷酸己糖异构酶⟧可作⟦1|神经白介素⟧和自分泌⟦1|运动因子⟧；⟦1|GAPDH⟧ 可参与 ⟦1|DNA⟧ ⟦1|碱基⟧切除修复。"],[1,"⑤为⟦2|有氧⟧氧化作准备，⟦1|丙酮酸⟧生成⟦1|乙酰⟧-⟦1|CoA⟧ 后进入 ⟦1|TCA⟧ ⟦2|循环⟧。"],[1,"⑥与⟦2|糖异生⟧协调，维持⟦1|血糖⟧稳定。"]]],[0,7,1,2,"糖酵解中间产物磷酸化的生理意义（糖酵解过程中由葡萄糖到所有中间产物的结构特点是什么？这种形式有什么意义？）",[[0,"（1）葡萄糖进入糖酵解后被磷酸化；除起始葡萄糖和⟦1|终产物丙酮酸⟧外，各中间物均含⟦1|磷酸⟧基。"],[0,"（2）其意义如下。"],[1,"①生理 pH 下带⟦2|负电⟧、⟦2|极性⟧强，不能自由扩散⟦1|出膜⟧，使⟦1|反应物⟧留在⟦2|胞质⟧。"],[1,"②⟦1|磷酸⟧基可作酶识别⟦2|信号⟧，利于底物结合和催化。"],[1,"③⟦1|磷酸⟧基最终可转给 ⟦1|ADP⟧ 生成 ⟦1|ATP⟧，利于能量保存与转移。"]]],[0,7,1,3,"为什么说磷酸果糖激酶-1 是糖酵解调节作用的限速酶？（为什么磷酸果糖激酶-1 是限速酶而不是己糖激酶？）",[[0,"⟦1|PFK-1⟧ 而非⟦1|己糖⟧激酶是限速酶，原因如下："],[1,"①⟦1|己糖⟧激酶反应虽不可逆，但 ⟦1|G6P⟧ 还可来自⟦1|糖原分解⟧，并可进入⟦2|糖原⟧合成或 ⟦1|PPP⟧，未把⟦1|葡萄糖⟧专一导入糖酵解。"],[1,"②⟦1|PFK-1⟧ 催化不可逆的糖酵解承诺⟦2|步骤⟧，并受 ⟦1|ATP⟧、⟦1|AMP⟧、⟦1|F-2⟧,⟦1|6⟧-BP 等调节，可⟦1|灵敏⟧响应能量状态。"]]],[0,7,1,4,"简述糖酵解产生的 NADH 和丙酮酸的去向。在糖代谢过程中，丙酮酸可能进入哪些主要代谢途径？",[[0,"（1）NADH 和丙酮酸的去向。"],[1,"⟦1|1⟧）⟦2|有氧⟧时。"],[2,"①⟦2|有氧⟧⟦1|原核细胞⟧中，NADH 向⟦1|质膜呼吸链⟧供⟦2|电子⟧；⟦2|真核⟧经⟦2|甘油⟧-⟦1|3⟧-⟦1|磷酸⟧或⟦1|苹果酸⟧-⟦1|天冬氨酸⟧穿梭把还原⟦1|当量⟧送入⟦1|线粒体⟧，氧化供能。"],[2,"②丙酮酸⟦1|经载体⟧进入⟦1|线粒体⟧⟦2|基质⟧，由丙酮酸⟦1|脱氢酶⟧系氧化为⟦1|乙酰⟧-⟦1|CoA⟧。"],[1,"⟦1|2⟧）缺氧或无氧时。"],[1,"NADH 用于还原丙酮酸或其⟦2|衍生物⟧，再生 ⟦1|NAD⁺⟧ ，常见两种方式。"],[2,"①⟦1|乳酸⟧发酵：⟦1|乳酸脱氢酶⟧以丙酮酸受氢，使 NADH→⟦1|NAD⁺⟧ 、丙酮酸→⟦1|乳酸⟧。"],[2,"②⟦1|乙醇⟧发酵：⟦1|TPP⟧ 依赖的丙酮酸⟦1|脱羧酶先生⟧成⟦1|乙醛⟧，再由⟦1|乙醇脱氢酶⟧还原成⟦1|乙醇⟧，同时再生 ⟦1|NAD⁺⟧ 。"],[0,"（2）丙酮酸主要代谢去向。"],[1,"①在⟦2|肌肉⟧中还原成⟦1|乳酸⟧。"],[1,"②⟦2|有氧⟧时生成⟦1|乙酰⟧-⟦1|CoA⟧，进入 ⟦1|TCA⟧ 供能，或用于⟦1|脂肪酸⟧、⟦2|脂肪⟧和⟦1|类脂⟧合成。"],[1,"③⟦1|羧化⟧成⟦1|草酰乙酸⟧，再生成 ⟦1|PEP⟧，经⟦2|糖异生⟧生成⟦1|葡萄糖⟧和⟦2|糖原⟧。"],[1,"④⟦1|转氨⟧生成⟦1|丙氨酸⟧等⟦1|氨基酸⟧。"]]],[0,7,1,5,"简述糖酵解和发酵的过程及催化反应所需的酶 萄糖。"],[0,"（2）意义：⟦1|G6P⟧ 是糖代谢⟦1|交叉点⟧，也是⟦1|多种糖⟧的共同中间物。"],[1,"①经 ⟦1|PPP⟧ ⟦2|供给⟧ ⟦1|R5P⟧，为⟦1|核酸⟧合成提供⟦2|原料⟧。"],[1,"②经 ⟦1|PPP⟧ 生成 ⟦1|NADPH⟧，提供还原力。"],[1,"③经 ⟦1|EMP⟧、⟦1|TCA⟧ 和⟦1|呼吸链⟧彻底氧化供能。"],[1,"④⟦2|糖异生⟧时转为葡萄糖入血，维持⟦1|血糖⟧。"],[1,"⑤转为 ⟦1|G1P⟧ 并合成⟦2|糖原⟧⟦1|储能⟧。"],[1,"⑥还可作为其他糖、⟦2|脂质⟧和⟦1|氨基酸⟧的⟦2|前体⟧。"]]],[0,7,1,8,"为什么说肝脏是维持血糖浓度的重要器官？",[[0,"肝是血糖调节的主要靶器官，受⟦1|激素⟧⟦2|调控⟧，通过⟦2|糖原⟧合成、分解及⟦2|糖异生⟧平衡血糖来源和⟦1|去路⟧。"],[1,"①⟦1|GLUT2⟧ 使⟦1|肝细胞葡萄糖⟧与血糖接近平衡；摄入的⟦1|葡萄糖⟧可经⟦1|糖酵解⟧、⟦1|TCA⟧ 彻底氧化供能。"],[1,"②肝⟦1|葡萄糖激酶⟧ Km 高且不受 ⟦1|G6P⟧ 抑制，饱食⟦1|高血糖⟧时仍可生成 ⟦1|G6P⟧ 并合成肝⟦2|糖原⟧。"],[1,"③肝有⟦1|葡萄糖⟧-⟦1|6⟧-⟦1|磷酸酶⟧，⟦2|肌肉⟧没有；⟦1|空腹⟧时，肝可将⟦1|糖原分解⟧所得 ⟦1|G6P⟧ 转为⟦1|葡萄糖⟧入血。"],[1,"④肝有完整⟦1|糖异生酶⟧系，⟦1|禁食⟧时由生糖氨基酸、⟦1|乳酸⟧和⟦2|甘油⟧合成⟦1|葡萄糖⟧。"],[1,"⑤可把⟦1|果糖⟧、⟦1|半乳糖⟧等转为⟦1|葡萄糖⟧，补充血糖。"]]],[0,7,1,9,"ATP 是磷酸果糖激酶-1 的底物，但高浓度的 ATP 却抑制该酶的活性，为什么？",[[0,"①⟦1|PFK-1⟧ 有两个 ATP ⟦1|位点⟧：⟦1|高亲⟧和活性⟦1|位点⟧以 ATP 为底物，⟦1|低亲⟧和⟦1|别构位点⟧在高 ATP 时被占据，降低酶对 ⟦1|F6P⟧的⟦2|亲和力⟧。"],[0,"②高 ATP 表示能量充足，反馈抑制 ⟦1|PFK-1⟧ 可避免⟦1|过度⟧产能；⟦1|柠檬酸⟧还能增强这种抑制，使 ⟦1|EMP⟧ 减慢。"]]],[0,7,1,10,"糖酵解中的关键酶有哪些?",[[0,"⟦1|EMP⟧ 关键酶⟦1|为己糖激酶⟧、⟦1|PFK-1⟧ 和⟦1|丙酮酸激酶⟧。"],[1,"①⟦1|己糖激酶⟧：催化⟦1|葡萄糖⟧+⟦1|ATP⟧→⟦1|G6P+ADP⟧，需 ⟦1|Mg²⁺⟧ ，反应不可逆，并受 ⟦1|G6P⟧ 反馈抑制。"],[1,"②⟦1|PFK-1⟧：催化 ⟦1|F6P+ATP⟧→⟦1|F-1⟧,⟦1|6⟧-⟦1|BP+ADP⟧，需 ⟦1|Mg²⁺⟧ ，是不可逆限速⟦2|步骤⟧；⟦1|AMP⟧、⟦1|ADP⟧、⟦1|F-2⟧,⟦1|6⟧-BP 和 ⟦1|F6P⟧ 激活，⟦1|ATP⟧、⟦1|柠檬酸⟧抑制。"],[1,"③⟦1|丙酮酸激酶⟧：催化 ⟦1|PEP+ADP⟧→⟦1|丙酮酸⟧+⟦1|ATP⟧，是不可逆底物水平磷酸化；⟦1|F-1⟧,⟦1|6⟧-BP 激活，⟦1|Ala⟧、⟦1|乙酰⟧-⟦1|CoA⟧ 和⟦1|长链脂肪酸⟧抑制，⟦1|肝酶⟧⟦2|磷酸化⟧后⟦2|活性⟧降低。"]]],[0,7,1,11,"阐述三羧酸循环的过程及其特点（简述柠檬酸循环的过程及催化反应所需的酶）。",[[0,"（1）⟦1|TCA⟧ 循环含 ⟦1|8⟧ 步。"],[1,"①⟦1|OAA+乙酰⟧-⟦1|CoA⟧→⟦1|柠檬酸⟧（⟦1|柠檬酸合酶⟧）。"],[1,"②⟦1|柠檬酸⟧→异⟦1|柠檬酸⟧（顺⟦1|乌头酸酶⟧）。"],[1,"③异⟦1|柠檬酸⟧→⟦1|α-KG+CO₂+NADH⟧（异⟦1|柠檬酸脱氢酶⟧）。"],[1,"④⟦1|α-KG⟧→⟦1|琥珀酰⟧-⟦1|CoA+CO₂+NADH⟧（⟦1|α-KG⟧ ⟦1|脱氢酶⟧系）。"],[1,"⑤⟦1|琥珀酰⟧-⟦1|CoA⟧→⟦1|琥珀酸⟧+⟦1|GTP⟧（⟦1|琥珀酰⟧-⟦1|CoA⟧ 合成酶）。"],[1,"⑥⟦1|琥珀酸⟧→⟦1|延胡索酸⟧+⟦1|FADH₂⟧（⟦1|琥珀酸脱氢酶⟧）。"],[1,"⑦⟦1|延胡索酸⟧→⟦1|苹果酸⟧（⟦1|延胡索酸⟧酶）。"],[1,"⑧⟦1|苹果酸⟧→⟦1|OAA+NADH⟧（⟦1|苹果酸脱氢酶⟧）。"],[0,"（2）特点。"],[1,"①每轮进入 ⟦1|2⟧ 个 C 并放出 ⟦1|2⟧ 个 C，但放出的并非当轮⟦1|乙酰基⟧的 C，而来自 ⟦1|OAA⟧。"],[1,"②每个⟦1|乙酰⟧-⟦1|CoA⟧ 经 ⟦1|4⟧ 次脱氢生成 ⟦1|3⟧ ⟦1|NADH⟧、⟦1|1⟧ ⟦1|FADH₂⟧，并经 ⟦1|2⟧ 次⟦2|脱羧⟧生成 ⟦1|2⟧ ⟦1|CO₂⟧。"],[1,"③有 ⟦1|1⟧ 次底物水平磷酸化，生成 ⟦1|GTP⟧ 或 ⟦1|ATP⟧。"],[1,"④消耗 ⟦1|2⟧ 个 ⟦1|H₂O⟧，分别用于⟦1|柠檬酸合酶⟧和⟦1|延胡索酸⟧酶反应。"],[1,"⑤⟦1|O₂⟧不直接参加，但 ⟦1|NADH⟧、⟦1|FADH₂⟧须经有氧呼吸链再氧化，故循环依赖 ⟦1|O₂⟧。"],[1,"⑥关键酶为⟦1|柠檬酸合酶⟧、异⟦1|柠檬酸脱氢酶⟧和⟦1|α-KG⟧ ⟦1|脱氢酶⟧⟦2|复合体⟧。"]]],[0,7,1,12,"试述三羧酸循环的生理意义（TCA 循环的要点与生物学意义）（双重作用）（生理功能）？",[[0,"TCA 循环的意义："],[1,"①是高效供能⟦2|途径⟧：⟦1|1⟧ 分子⟦1|葡萄糖⟧经 ⟦1|EMP⟧、TCA 循环和⟦1|呼吸链⟧可生成 ⟦1|30⟧ 或 ⟦1|32⟧ 分子 ⟦1|ATP⟧，能量⟦1|利用率⟧约 ⟦1|40⟧%。"],[1,"②是糖、⟦2|脂质⟧和蛋白质氧化的共同⟦2|途径⟧：它们分解产生⟦1|乙酰⟧-⟦1|CoA⟧ 或循环中间物，经 TCA 及⟦1|呼吸链⟧完成氧化供能。"],[1,"③供合成⟦2|前体⟧和能量：⟦1|OAA⟧ 用于⟦2|糖异生⟧，⟦1|柠檬酸⟧转运⟦1|乙酰基⟧供⟦1|脂肪酸⟧合成，⟦1|OAA⟧ 和⟦1|α-KG⟧ 生成 ⟦1|Asp⟧ 和 ⟦1|Glu⟧，其他中间物参与⟦1|核苷酸⟧合成。"],[1,"④部分中间物可作别构效应物：如⟦1|柠檬酸⟧调节 ⟦1|PFK-1⟧、⟦1|果糖⟧-⟦1|1⟧,⟦1|6⟧-二⟦1|磷酸酶⟧和⟦1|乙酰⟧-⟦1|CoA⟧ ⟦1|羧化酶⟧。"]]],[0,7,1,13,"简述乙酰-CoA 的来源与去路。",[[0,"（1）来源。"],[1,"①⟦1|丙酮酸⟧经丙酮酸脱氢酶复合体氧化⟦2|脱羧⟧，生成乙酰-CoA 和 ⟦1|CO₂⟧。"],[1,"②⟦1|脂肪酸β-⟧氧化通常每轮生成 ⟦1|1⟧ 个乙酰-CoA，⟦1|脂酰链⟧缩短 ⟦1|2⟧ 个碳；⟦1|偶数链⟧最后一轮生成 ⟦1|2⟧ 个乙酰-CoA。"],[1,"③肝外组织利用 ⟦1|D-β-⟧羟⟦1|丁酸⟧、乙酰⟦1|乙酸⟧等⟦1|酮体⟧时生成乙酰-CoA。"],[1,"④生酮氨基酸分解生成，如 ⟦1|Phe⟧ 经乙酰乙酰-CoA 生成乙酰-CoA。"],[0,"（2）去路。"],[1,"①与 ⟦1|OAA⟧ 生成⟦1|柠檬酸⟧，经 ⟦1|TCA⟧ 及⟦1|呼吸链⟧彻底氧化，生成 ⟦1|CO₂⟧、⟦1|H₂O⟧ 并合成 ⟦1|ATP⟧。"],[1,"②作为起始⟦2|原料⟧合成⟦1|胆固醇⟧等⟦1|类固醇⟧。"],[1,"③⟦2|饥饿⟧或⟦1|糖尿病⟧时在肝⟦1|线粒体⟧生成乙酰⟦1|乙酸⟧、⟦1|D-β-⟧羟⟦1|丁酸⟧和⟦1|丙酮⟧等⟦1|酮体⟧。"],[1,"④作为⟦1|脂肪酸⟧合成⟦2|前体⟧。"],[1,"⑤合成⟦1|神经递质⟧乙酰胆碱。"],[1,"⑥作为⟦1|乙酰基⟧⟦2|供体⟧参与⟦1|乙酰化⟧。"]]],[0,7,1,14,"简述乙酰-CoA 的作用。",[[0,"乙酰-CoA ⟦1|连接糖⟧、⟦2|脂质⟧和蛋白质代谢；多种分解产物经它汇入 ⟦1|TCA⟧，再经氧化磷酸化供能。"],[1,"①进入 ⟦1|TCA⟧：与 ⟦1|OAA⟧ 生成⟦1|柠檬酸⟧，再产生 ⟦1|NADH⟧、⟦1|FADH₂⟧、⟦1|GTP⟧ 并经⟦1|呼吸链⟧⟦2|大量⟧产 ⟦1|ATP⟧。"],[1,"②作为⟦1|脂肪酸⟧合成⟦2|原料⟧。"],[1,"③⟦2|饥饿⟧或⟦1|糖尿病⟧时生成乙酰⟦1|乙酸⟧、⟦1|D-β-⟧羟⟦1|丁酸⟧等⟦1|酮体⟧，⟦1|供肝⟧外组织利用。"],[1,"④作为⟦1|胆固醇⟧合成⟦2|原料⟧。"],[1,"⑤参与⟦1|氨基酸⟧等代谢并提供碳⟦2|骨架⟧，是三大物质代谢的⟦2|中心化合物⟧。"],[1,"⑥⟦2|供给活性⟧物质，如乙酰胆碱等。"],[1,"⑦作为⟦1|乙酰基⟧⟦2|供体⟧参与某些⟦2|药物⟧的⟦1|乙酰化⟧代谢，影响其⟦2|活性⟧或排泄，但并非普遍的⟦2|药物⟧减毒机制。"],[1,"⑧作为⟦1|乙酰基⟧⟦2|供体⟧参与⟦1|乙酰化⟧。"]]],[0,7,1,15,"简述三羧酸循环的调控（柠檬酸循环本身制约系统的调节）。",[[0,"关键酶为⟦1|柠檬酸合酶⟧、异⟦1|柠檬酸脱氢酶⟧和⟦1|α-KG⟧ ⟦1|脱氢酶⟧⟦2|复合体⟧；异⟦1|柠檬酸脱氢酶⟧最重要，⟦1|α-KG⟧ ⟦1|脱氢酶⟧次之。"],[1,"①底物⟦1|供应⟧：⟦1|乙酰⟧-⟦1|CoA⟧、⟦1|OAA⟧ 及 ⟦1|NAD⁺⟧ 等的⟦1|供应⟧影响循环；⟦1|丙酮酸脱氢酶⟧⟦2|活性⟧影响⟦1|乙酰⟧-⟦1|CoA⟧ 来源。"],[1,"②产物抑制：⟦1|琥珀酰⟧-⟦1|CoA⟧ 抑制⟦1|α-KG⟧ ⟦1|脱氢酶⟧；⟦1|柠檬酸⟧抑制⟦1|柠檬酸合酶⟧；⟦1|ATP⟧ 抑制⟦1|柠檬酸合酶⟧和异⟦1|柠檬酸脱氢酶⟧。"],[1,"③⟦1|变构⟧调节：底物或产物作⟦2|效应⟧物，以前馈或反馈方式调节循环。"],[1,"④能量状态：⟦1|ATP⟧、⟦1|NADH⟧ 较高时抑制循环，⟦1|ADP⟧ 可激活异⟦1|柠檬酸脱氢酶⟧，促进氧化供能。"],[1,"⑤⟦1|Ca²⁺⟧ 结合异⟦1|柠檬酸脱氢酶⟧和⟦1|α-KG⟧ ⟦1|脱氢酶⟧，降低 Km 并激活。"]]],[0,7,1,16,"简述丙酮酸脱氢酶系的组成及其催化作用。",[[0,"（1）丙酮酸脱氢酶系含 ⟦1|E1⟧ 丙酮酸脱氢酶、⟦1|E2⟧ 二氢⟦1|硫辛酰⟧转⟦1|乙酰酶⟧和 ⟦1|E3⟧ 二氢⟦1|硫辛酰⟧脱氢酶；需 ⟦1|TPP⟧、⟦1|硫辛酸⟧、⟦1|CoA⟧、⟦1|FAD⟧ 和 ⟦1|NAD⁺⟧ 。"],[0,"（2）催化过程如下。"],[1,"①⟦1|E1⟧、⟦1|E2⟧ 催化丙酮酸⟦2|脱羧⟧并形成⟦1|乙酰基⟧。"],[2,"⟦1|TPP⟧ 结合丙酮酸，⟦2|脱羧⟧形成⟦1|羟乙⟧基-⟦1|TPP⟧；⟦1|羟乙基被⟧氧化为⟦1|乙酰基⟧，转给 ⟦1|E2⟧ 的⟦1|硫辛酰胺⟧，同时还原其⟦1|二硫键⟧。"],[1,"②⟦1|E2⟧ 把⟦1|乙酰基⟧转给 ⟦1|CoA⟧，形成⟦1|乙酰⟧-⟦1|CoA⟧。"],[2,"⟦1|E2⟧ 将⟦1|乙酰基⟧转给 ⟦1|CoA-SH⟧，生成⟦1|乙酰⟧-⟦1|CoA⟧，留下⟦1|还原型⟧二氢⟦1|硫辛酰胺⟧。"],[1,"③⟦1|E3⟧ 使 ⟦1|E2⟧ 的⟦1|二氢硫辛酰胺⟧再氧化。"],[2,"⟦1|E3⟧ 重新氧化二氢⟦1|硫辛酰胺⟧，使其恢复⟦1|二硫键⟧；⟦1|E3⟧ 含 ⟦1|FAD⟧ 辅基。"],[1,"④⟦1|还原型⟧ ⟦1|E3⟧ 再氧化。"],[2,"⟦1|FAD⟧ 接受 ⟦1|E3⟧ ⟦1|巯基⟧上的氢生成 ⟦1|FADH₂⟧，再把氢交给 ⟦1|NAD⁺⟧ ，使 ⟦1|E3⟧ 和 ⟦1|FAD⟧ 恢复氧化态。"]]],[0,7,1,17,"如果三羧酸循环中的草酰乙酸被用来合成氨基酸，该怎样让循环正常运行下去？",[[0,"⟦1|OAA⟧ 被用于合成后，须补充其碳⟦2|骨架⟧以维持 ⟦1|TCA⟧，可通过以下反应生成 ⟦1|OAA⟧。"],[1,"①⟦1|丙酮酸羧化⟧：动物主要方式。⟦1|丙酮酸羧化酶⟧以⟦1|生物素⟧为辅基，耗 ⟦1|1⟧ ⟦1|ATP⟧ 生成 ⟦1|OAA⟧，在⟦1|线粒体⟧⟦2|基质⟧进行。"],[1,"②⟦1|PEP⟧ ⟦1|羧化⟧：植物和⟦1|细菌⟧由 ⟦1|PEP⟧ ⟦1|羧化酶⟧使 ⟦1|PEP⟧ 生成 ⟦1|OAA⟧。"],[1,"③⟦1|苹果酸⟧脱氢：⟦1|苹果酸脱氢酶⟧生成 ⟦1|OAA⟧；须有循环外⟦1|碳源⟧补入⟦1|苹果酸⟧，才构成净回补。"],[1,"④氨基酸转化：⟦1|Asp⟧ 经⟦1|谷草转氨酶⟧生成 ⟦1|OAA⟧。"]]],[0,7,1,18,"氧气含量的高低为什么可以影响三羧酸循环进程？",[[0,"①⟦1|NADH⟧、⟦1|FADH₂⟧须把⟦2|电子⟧经⟦1|呼吸链⟧交给 ⟦1|O₂⟧，才能再生 ⟦1|NAD⁺⟧ 、⟦1|FAD⟧ 并维持 ⟦1|TCA⟧；⟦1|O₂⟧充足时⟦1|呼吸链⟧顺畅，循环正常，缺氧⟦1|时则⟧减慢。"],[0,"②⟦1|O₂⟧充足时⟦1|丙酮酸⟧生成⟦1|乙酰⟧-⟦1|CoA⟧ 并进入 ⟦1|TCA⟧；缺氧时更多⟦1|丙酮酸⟧被还原成⟦1|乳酸⟧或⟦1|乙醇⟧，⟦1|乙酰⟧-⟦1|CoA⟧ 来源减少，循环减慢。"]]],[0,7,1,19,"比较哺乳动物肌肉细胞内有氧和无氧条件下葡萄糖氧化有什么不同？",[[0,"①过程：有氧时，葡萄糖经 ⟦1|EMP⟧ 生成⟦1|丙酮酸⟧，再转为⟦1|乙酰⟧-⟦1|CoA⟧ 进入 ⟦1|TCA⟧，彻底氧化为 ⟦1|CO₂⟧和 ⟦1|H₂O⟧；无氧时，⟦1|丙酮酸⟧还原成⟦1|乳酸⟧。"],[0,"②产能：有氧时每分子葡萄糖约生成 ⟦1|30～32⟧ ⟦1|ATP⟧；无氧时仅净生成 ⟦1|2⟧ ⟦1|ATP⟧。"],[0,"③意义：有氧氧化供能高效；缺氧时⟦1|乳酸⟧发酵可快速供能并再生 ⟦1|NAD⁺⟧ 。⟦1|乳酸⟧并非⟦1|运动⟧后延迟性肌肉⟦1|酸痛⟧的直接原因。"],[0,"④⟦1|场所⟧：有氧氧化在⟦2|胞质⟧和⟦1|线粒体⟧进行；无氧氧化⟦1|全在胞质⟧进行。"],[0,"⑤⟦1|需氧⟧：有氧氧化包括 ⟦
